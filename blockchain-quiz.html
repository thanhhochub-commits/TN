 khóa offline, giảm bề mặt bị tấn công qua mạng. Hot/web/exchange wallet có các mức kết nối và rủi ro trực tuyến cao hơn.\n\nPhân tích từng đáp án:\n✗ A SAI. Ví web kết nối mạng thường là ví nóng.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Ví lạnh.\n✗ C SAI. Ví lưu ký trên sàn có rủi ro kết nối và lưu ký.\n✗ D SAI. Hot wallet đang trực tuyến, không phải ngoại tuyến.","source":"Bộ đề Blockchain - Câu gốc 161/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q162","chapter":1,"number":162,"question":"Why does a small change in the input data matter for a hash function?\nVì sao thay đổi nhỏ trong dữ liệu đầu vào quan trọng với hàm băm?","options":[{"id":"BC260-Q162-A","text":"It makes the hash function stop working\nKhiến hàm băm ngừng chạy"},{"id":"BC260-Q162-B","text":"It gives a completely different hash, revealing it\nTạo hash hoàn toàn khác để bộc lộ thay đổi"},{"id":"BC260-Q162-C","text":"It slightly changes the last digit of the hash\nChỉ hơi thay chữ số cuối của hash"},{"id":"BC260-Q162-D","text":"It produces the same hash, hiding the change\nTạo cùng hash, che giấu thay đổi"}],"correctOptionId":"BC260-Q162-B","explanation":"Explanation (EN): Cryptographic hash functions exhibit an avalanche-like effect: small changes in input generally change the digest substantially. This makes tampering noticeable.\nGiải thích (VI): Hiệu ứng avalanche: thay đổi dù rất nhỏ ở đầu vào thường dẫn tới hash khác biệt lớn. Hash không chỉ đổi vài ký tự cuối theo tỷ lệ tương ứng.\n\nPhân tích từng đáp án:\n✗ A SAI. Thay đầu vào không làm hàm băm ngừng hoạt động.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Tạo hash hoàn toàn khác để bộc lộ thay đổi.\n✗ C SAI. Hash không chỉ đổi một chữ số cuối.\n✗ D SAI. Khả năng cùng hash với thay đổi là cực kỳ thấp theo thiết kế an toàn.","source":"Bộ đề Blockchain - Câu gốc 162/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q163","chapter":3,"number":163,"question":"An importer and an exporter want payment released only after shipment is confirmed. What blockchain tool fits best?\nNhà nhập khẩu và xuất khẩu muốn chỉ giải ngân khi xác nhận hàng đã gửi. Công cụ blockchain nào phù hợp?","options":[{"id":"BC260-Q163-A","text":"A cold wallet for both parties\nVí lạnh cho cả hai bên"},{"id":"BC260-Q163-B","text":"A hard fork of the chain\nHard fork của chuỗi"},{"id":"BC260-Q163-C","text":"A smart contract escrow\nKý quỹ bằng smart contract"},{"id":"BC260-Q163-D","text":"A shared mining pool\nNhóm đào chung"}],"correctOptionId":"BC260-Q163-C","explanation":"Explanation (EN): A smart-contract escrow can automatically release funds after specified conditions, such as verified shipment, are met. Real-world data may require an oracle and dispute process.\nGiải thích (VI): Smart-contract escrow khóa và giải ngân theo các điều kiện xác định trước, như chứng từ giao hàng được xác thực. Cơ chế giải quyết tranh chấp và dữ liệu oracle vẫn cần thiết ngoài đời thực.\n\nPhân tích từng đáp án:\n✗ A SAI. Ví lạnh chỉ lưu khóa, không tự giải ngân khi giao hàng.\n✗ B SAI. Hard fork là sự thay đổi/tách quy tắc chuỗi.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Ký quỹ bằng smart contract.\n✗ D SAI. Pool đào không có logic ký quỹ thương mại.","source":"Bộ đề Blockchain - Câu gốc 163/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q164","chapter":1,"number":164,"question":"Why can blockchain reduce the need for intermediaries in transactions?\nVì sao blockchain giảm nhu cầu trung gian khi giao dịch?","options":[{"id":"BC260-Q164-A","text":"It forces users to reveal their identity to all\nBuộc người dùng tiết lộ danh tính"},{"id":"BC260-Q164-B","text":"It requires a bank to approve every transaction\nCần ngân hàng phê duyệt mọi giao dịch"},{"id":"BC260-Q164-C","text":"It stores data on paper ledgers\nLưu dữ liệu trong sổ giấy"},{"id":"BC260-Q164-D","text":"Parties share one verified record, not a middleman\nCác bên chia sẻ bản ghi đã xác minh thay vì trung gian"}],"correctOptionId":"BC260-Q164-D","explanation":"Explanation (EN): Blockchain shares transaction history and uses cryptographic verification and consensus to reduce reliance on reconciliation intermediaries. It does not remove all institutions from every application.\nGiải thích (VI): Sổ cái chung được các bên xác minh giúp họ giao dịch dựa trên một nguồn dữ liệu nhất quán, giảm phụ thuộc bên trung gian đối soát. Blockchain không thay thế mọi yêu cầu luật pháp hay kiểm soát nội bộ.\n\nPhân tích từng đáp án:\n✗ A SAI. Blockchain không buộc mọi người công khai danh tính.\n✗ B SAI. Không cần ngân hàng kiểm duyệt mọi giao dịch.\n✗ C SAI. Blockchain không chỉ là sổ giấy.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Các bên chia sẻ bản ghi đã xác minh thay vì trung gian.","source":"Bộ đề Blockchain - Câu gốc 164/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q165","chapter":4,"number":165,"question":"How does an algorithmic stablecoin differ from an asset- backed one?\nStablecoin thuật toán khác stablecoin được bảo đảm bằng tài sản ở điểm nào?","options":[{"id":"BC260-Q165-A","text":"It is issued and guaranteed by a central bank\nĐược ngân hàng trung ương phát hành và bảo lãnh"},{"id":"BC260-Q165-B","text":"It is backed by gold stored in vaults\nĐược bảo đảm bằng vàng trong kho"},{"id":"BC260-Q165-C","text":"It adjusts supply by rules instead of reserves\nĐiều chỉnh nguồn cung theo quy tắc thay vì dự trữ"},{"id":"BC260-Q165-D","text":"It cannot be traded on any exchange\nKhông giao dịch được trên bất kỳ sàn nào"}],"correctOptionId":"BC260-Q165-C","explanation":"Explanation (EN): An algorithmic stablecoin relies chiefly on programmed supply and incentive adjustments to seek a peg rather than redemption against matching reserves. Such mechanisms can fail in a crisis.\nGiải thích (VI): Algorithmic stablecoin chủ yếu dùng cơ chế điều chỉnh cung hoặc động lực thị trường để giữ neo, không dựa trực tiếp vào dự trữ đủ giá trị như stablecoin thế chấp. Mô hình này dễ rơi vào vòng xoáy mất niềm tin khi cầu sụt mạnh.\n\nPhân tích từng đáp án:\n✗ A SAI. Stablecoin thuật toán thường không do ngân hàng trung ương bảo lãnh.\n✗ B SAI. Bảo đảm bằng vàng là dạng tài sản bảo chứng, không phải cơ chế thuần thuật toán.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Điều chỉnh nguồn cung theo quy tắc thay vì dự trữ.\n✗ D SAI. Stablecoin thuật toán vẫn có thể được giao dịch.","source":"Bộ đề Blockchain - Câu gốc 165/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q166","chapter":1,"number":166,"question":"Which item lets a user prove ownership of bitcoin when spending it?\nYếu tố nào giúp người dùng chứng minh quyền sở hữu Bitcoin khi chi tiêu?","options":[{"id":"BC260-Q166-A","text":"A receipt issued by the user's exchange\nBiên nhận do sàn phát"},{"id":"BC260-Q166-B","text":"The number of the block that holds the coins\nSố khối chứa coin"},{"id":"BC260-Q166-C","text":"A digital signature made with the private key\nChữ ký số tạo bằng khóa riêng"},{"id":"BC260-Q166-D","text":"The user's email address and login password\nEmail và mật khẩu đăng nhập"}],"correctOptionId":"BC260-Q166-C","explanation":"Explanation (EN): A valid private-key signature proves control of the relevant spendable output. An exchange receipt or email password is not a Bitcoin consensus authorization.\nGiải thích (VI): Private key tạo chữ ký số chứng minh quyền chi tiêu, được kiểm tra bằng public key. Email, mật khẩu sàn hoặc số khối không thay thế được chữ ký hợp lệ trên UTXO.\n\nPhân tích từng đáp án:\n✗ A SAI. Biên nhận sàn không tự chứng minh có quyền ký UTXO.\n✗ B SAI. Số khối không cho quyền chi tiêu.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Chữ ký số tạo bằng khóa riêng.\n✗ D SAI. Email và mật khẩu sàn không phải chữ ký mật mã Bitcoin.","source":"Bộ đề Blockchain - Câu gốc 166/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q167","chapter":1,"number":167,"question":"A shop owner fears a customer could reuse the bitcoin paid to her for another purchase. What protects her?\nChủ cửa hàng lo khách có thể dùng lại số Bitcoin đã trả. Điều gì bảo vệ họ?","options":[{"id":"BC260-Q167-A","text":"A regulator checks each payment before settling\nCơ quan quản lý kiểm tra từng khoản trước quyết toán"},{"id":"BC260-Q167-B","text":"Network confirmation rejects any reuse of the coin\nXác nhận mạng ngăn việc tiêu lại cùng coin"},{"id":"BC260-Q167-C","text":"The customer's bank blocks the second purchase\nNgân hàng khách chặn lần mua thứ hai"},{"id":"BC260-Q167-D","text":"The coin is deleted from the customer's phone\nCoin bị xóa khỏi điện thoại khách"}],"correctOptionId":"BC260-Q167-B","explanation":"Explanation (EN): UTXO validation and network confirmations prevent the same confirmed output from being spent twice. The customer's bank does not control Bitcoin's consensus ledger.\nGiải thích (VI): Nếu bên mua cố chi lại UTXO đã trả cửa hàng, mạng phát hiện đầu ra đã tiêu và từ chối giao dịch xung đột. Chờ đủ xác nhận còn làm giảm rủi ro đảo giao dịch.\n\nPhân tích từng đáp án:\n✗ A SAI. Không có cơ quan quản lý kiểm tra từng thanh toán giao thức.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Xác nhận mạng ngăn việc tiêu lại cùng coin.\n✗ C SAI. Ngân hàng không kiểm soát đồng thuận Bitcoin.\n✗ D SAI. Coin không biến mất khỏi điện thoại vì đã được chi.","source":"Bộ đề Blockchain - Câu gốc 167/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q168","chapter":1,"number":168,"question":"Why is decentralization considered a key characteristic of blockchain?\nVì sao phi tập trung là đặc điểm then chốt của blockchain?","options":[{"id":"BC260-Q168-A","text":"One authority can quickly correct any error\nMột cơ quan có thể nhanh chóng sửa mọi lỗi"},{"id":"BC260-Q168-B","text":"It reduces the number of copies of the ledger\nGiảm số bản sao sổ cái"},{"id":"BC260-Q168-C","text":"Control and data are spread across many nodes\nQuyền kiểm soát và dữ liệu phân bố ở nhiều nút"},{"id":"BC260-Q168-D","text":"It allows anonymOus administrators to edit data\nCho quản trị viên ẩn danh sửa dữ liệu"}],"correctOptionId":"BC260-Q168-C","explanation":"Explanation (EN): Decentralization distributes records and decision-making across many participants, reducing single-party control. It is not the ability of an administrator to edit past transactions.\nGiải thích (VI): Phi tập trung nghĩa là dữ liệu và quyền kiểm tra được phân tán giữa nhiều nút, hạn chế phụ thuộc vào một người quản trị. Nó không đồng nghĩa không có bất kỳ giới hạn kỹ thuật hoặc tập trung kinh tế nào.\n\nPhân tích từng đáp án:\n✗ A SAI. Quyền sửa tập trung trái nguyên tắc phân quyền.\n✗ B SAI. Blockchain phân tán thường có nhiều bản sao chứ không giảm xuống một.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Quyền kiểm soát và dữ liệu phân bố ở nhiều nút.\n✗ D SAI. Quản trị viên không được tự sửa tùy ý lịch sử blockchain.","source":"Bộ đề Blockchain - Câu gốc 168/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q169","chapter":1,"number":169,"question":"What is the very first block of a blockchain called?\nKhối đầu tiên của blockchain gọi là gì?","options":[{"id":"BC260-Q169-A","text":"The root block\nKhối gốc"},{"id":"BC260-Q169-B","text":"The final block\nKhối cuối"},{"id":"BC260-Q169-C","text":"The orphan block\nKhối mồ côi"},{"id":"BC260-Q169-D","text":"The genesis block\nKhối genesis (khởi nguyên)"}],"correctOptionId":"BC260-Q169-D","explanation":"Explanation (EN): The genesis block is the initial block from which the chain begins. It is distinct from an orphaned or later block.\nGiải thích (VI): Genesis block là khối mở đầu blockchain. Các khối về sau tham chiếu hash của khối trước, trừ genesis không có khối trước thông thường.\n\nPhân tích từng đáp án:\n✗ A SAI. “Root block” không phải tên chuẩn của khối đầu.\n✗ B SAI. “Final block” không phải khái niệm khởi nguyên.\n✗ C SAI. Khối mồ côi là khối không nằm trong nhánh được chấp nhận.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Khối genesis (khởi nguyên).","source":"Bộ đề Blockchain - Câu gốc 169/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q170","chapter":3,"number":170,"question":"The block reward is 6.25 BTC before a halving. What is it immediately after the halving?\nPhần thưởng khối là 6,25 BTC trước halving. Ngay sau halving còn bao nhiêu?","options":[{"id":"BC260-Q170-A","text":"1.5625 BTC\n1,5625 BTC"},{"id":"BC260-Q170-B","text":"6.25 BTC\n6,25 BTC"},{"id":"BC260-Q170-C","text":"3.125 BTC\n3,125 BTC"},{"id":"BC260-Q170-D","text":"12.5 BTC\n12,5 BTC"}],"correctOptionId":"BC260-Q170-C","explanation":"Explanation (EN): A halving cuts the block subsidy in half: 6.25 / 2 = 3.125 BTC. The change concerns the subsidy, not a mandatory change in market price.\nGiải thích (VI): Halving cắt trợ cấp 6,25 BTC làm hai: 3,125 BTC. Đây là phần trợ cấp, chưa cộng phí giao dịch của khối.\n\nPhân tích từng đáp án:\n✗ A SAI. 1,5625 BTC là giảm thêm một lần nữa.\n✗ B SAI. Giữ 6,25 là chưa halving.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: 3,125 BTC.\n✗ D SAI. 12,5 BTC là gấp đôi thay vì giảm một nửa.","source":"Bộ đề Blockchain - Câu gốc 170/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q171","chapter":3,"number":171,"question":"Why does the coinbase transaction have no ordinary inputs?\nVì sao giao dịch coinbase không có đầu vào thông thường?","options":[{"id":"BC260-Q171-A","text":"It creates new coins instead of spending old ones\nTạo coin mới chứ không tiêu coin cũ"},{"id":"BC260-Q171-B","text":"It is created by the receive r, not the sender\nDo người nhận tạo thay người gửi"},{"id":"BC260-Q171-C","text":"It is paid for by the central bank\nDo ngân hàng trung ương thanh toán"},{"id":"BC260-Q171-D","text":"Its inputs are hidden for privacy\nĐầu vào bị giấu vì riêng tư"}],"correctOptionId":"BC260-Q171-A","explanation":"Explanation (EN): A coinbase transaction creates the permitted block subsidy and collects fees rather than spending ordinary prior UTXOs. It therefore has no normal transaction inputs.\nGiải thích (VI): Coinbase transaction tạo số BTC mới theo trợ cấp khối và nhận phí, nên không tiêu các UTXO thông thường để lấy tiền đầu vào. Không được nhầm với giao dịch trả tiền từ người khác.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Tạo coin mới chứ không tiêu coin cũ.\n✗ B SAI. Giao dịch coinbase do thợ đào tạo, không phải người nhận thông thường.\n✗ C SAI. Không do ngân hàng trung ương trả tiền coinbase.\n✗ D SAI. Coinbase có cấu trúc đầu vào đặc biệt chứ không bị giấu.","source":"Bộ đề Blockchain - Câu gốc 171/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q172","chapter":2,"number":172,"question":"How does a digital signature prove that a transaction was authorized by the owner?\nChữ ký số chứng minh giao dịch được chủ sở hữu cho phép như thế nào?","options":[{"id":"BC260-Q172-A","text":"It is approved by a certification bank\nĐược ngân hàng chứng nhận phê duyệt"},{"id":"BC260-Q172-B","text":"Anyone can check it using the owner's public key\nBất kỳ ai cũng có thể dùng khóa công khai của chủ sở hữu để kiểm tra"},{"id":"BC260-Q172-C","text":"It contains the owner's password in encrypted form\nChứa mật khẩu chủ sở hữu ở dạng mã hóa"},{"id":"BC260-Q172-D","text":"It shows the owner's name to all nodes\nHiện tên chủ sở hữu cho mọi nút"}],"correctOptionId":"BC260-Q172-B","explanation":"Explanation (EN): The holder signs transaction data using a private key; other nodes verify the signature with the corresponding public key. The cryptographic proof does not display a legal name.\nGiải thích (VI): Chủ sở hữu dùng private key ký thông điệp giao dịch; các nút có thể dùng public key tương ứng xác minh chữ ký. Không cần công bố mật khẩu hay tên thật.\n\nPhân tích từng đáp án:\n✗ A SAI. Không cần ngân hàng chứng nhận phê duyệt giao dịch Bitcoin.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Bất kỳ ai cũng có thể dùng khóa công khai của chủ sở hữu để kiểm tra.\n✗ C SAI. Chữ ký không chứa mật khẩu của chủ.\n✗ D SAI. Chữ ký số không công khai tên pháp lý của chủ khóa.","source":"Bộ đề Blockchain - Câu gốc 172/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q173","chapter":1,"number":173,"question":"An investor compares a PoW coin with a PoS coin. Which statement about how they are secured is accurate?\nNhà đầu tư so sánh coin PoW và PoS. Phát biểu nào về cách bảo vệ mạng là đúng?","options":[{"id":"BC260-Q173-A","text":"PoW needs no computers to secure the chain\nPoW không cần máy tính bảo vệ chuỗi"},{"id":"BC260-Q173-B","text":"Both secure the network by staking coins\nCả hai đều bảo vệ bằng staking"},{"id":"BC260-Q173-C","text":"PoW uses computing work; PoS uses staked coins\nPoW dùng công việc tính toán; PoS dùng coin được stake"},{"id":"BC260-Q173-D","text":"PoS consumes more electricity than PoW\nPoS tiêu thụ điện nhiều hơn PoW"}],"correctOptionId":"BC260-Q173-C","explanation":"Explanation (EN): Proof of Work uses computational effort; Proof of Stake ties validation rights and penalties to coins committed as stake. The mechanisms have distinct resource requirements.\nGiải thích (VI): PoW dựa vào công việc tính toán; PoS dựa vào tài sản khóa làm stake và cơ chế chọn validator. Hai mô hình khác nhau về động lực kinh tế và tiêu thụ điện.\n\nPhân tích từng đáp án:\n✗ A SAI. PoW dựa vào tính toán của thiết bị.\n✗ B SAI. PoW không dựa vào coin stake theo cùng cách PoS.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: PoW dùng công việc tính toán; PoS dùng coin được stake.\n✗ D SAI. PoS thông thường tiết kiệm điện hơn PoW.","source":"Bộ đề Blockchain - Câu gốc 173/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q174","chapter":3,"number":174,"question":"A user receives an email asking for their wallet recovery phrase to ‘verify the account’. What should they do?\nNgười dùng nhận email yêu cầu seed phrase để “xác minh tài khoản”. Nên làm gì?","options":[{"id":"BC260-Q174-A","text":"Send only half of the phrase\nChỉ gửi một nửa cụm từ"},{"id":"BC260-Q174-B","text":"Refuse, because anyone with the phrase can take the funds\nTừ chối vì ai có cụm từ này đều có thể lấy tiền"},{"id":"BC260-Q174-C","text":"Post it on social media for safety\nĐăng lên mạng xã hội cho an toàn"},{"id":"BC260-Q174-D","text":"Send it, since wallets require periodic verification\nGửi vì ví phải xác minh định kỳ"}],"correctOptionId":"BC260-Q174-B","explanation":"Explanation (EN): A recovery phrase is a secret that can regenerate wallet keys. Sharing it with an email requester can hand over control of the assets.\nGiải thích (VI): Seed phrase có thể tái tạo khóa ví; gửi nó cho kẻ lạ đồng nghĩa trao quyền kiểm soát tài sản. Email 'xác minh tài khoản' xin seed là dấu hiệu lừa đảo, không có lý do tiết lộ nửa cụm từ.\n\nPhân tích từng đáp án:\n✗ A SAI. Dù chia nửa cụm từ vẫn là hành vi nguy hiểm và không cần thiết.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Từ chối vì ai có cụm từ này đều có thể lấy tiền.\n✗ C SAI. Đăng seed phrase công khai làm mất quyền kiểm soát.\n✗ D SAI. Không ví hợp pháp nào cần bạn tiết lộ seed phrase cho người lạ.","source":"Bộ đề Blockchain - Câu gốc 174/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q175","chapter":2,"number":175,"question":"What is the main purpose of a consensus mechanism in a blockchain?\nMục đích chính của cơ chế đồng thuận blockchain là gì?","options":[{"id":"BC260-Q175-A","text":"19 identifY users by their real name\nNhận dạng người dùng theo tên thật [ảnh lỗi chữ]"},{"id":"BC260-Q175-B","text":"To make nodes agree on the valid ledger state\nLàm các nút thống nhất trạng thái sổ cái hợp lệ"},{"id":"BC260-Q175-C","text":"+9 encrypt users' private keys on each nana\nMã hóa khóa riêng của người dùng ở mỗi nút [ảnh lỗi chữ]"},{"id":"BC260-Q175-D","text":"To set the price of the cryptocurrency\nĐặt giá đồng tiền mã hóa"}],"correctOptionId":"BC260-Q175-B","explanation":"Explanation (EN): Consensus rules help nodes agree on a valid ledger history and resolve competing blocks. They do not set exchange prices or disclose private keys.\nGiải thích (VI): Consensus giúp các nút chấp nhận trạng thái sổ cái và thứ tự giao dịch hợp lệ. Giá thị trường, danh tính pháp lý và khóa riêng không phải mục tiêu trực tiếp của thuật toán đồng thuận.\n\nPhân tích từng đáp án:\n✗ A SAI. Đồng thuận không xác minh tên pháp lý người dùng.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Làm các nút thống nhất trạng thái sổ cái hợp lệ.\n✗ C SAI. Đồng thuận không phải cơ chế mã hóa khóa riêng ở mỗi nút.\n✗ D SAI. Đồng thuận không định giá Bitcoin.","source":"Bộ đề Blockchain - Câu gốc 175/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q176","chapter":1,"number":176,"question":"Why is the Bitcoin ledger described as transparent?\nVì sao sổ cái Bitcoin được mô tả là minh bạch?","options":[{"id":"BC260-Q176-A","text":"Users can edit their own past transactions\nNgười dùng có thể sửa giao dịch cũ của mình"},{"id":"BC260-Q176-B","text":"Anyone can view every confirmed transaction\nBất kỳ ai đều xem được giao dịch đã xác nhận"},{"id":"BC260-Q176-C","text":"Only regulators can see the transactions\nChỉ cơ quan quản lý xem được giao dịch"},{"id":"BC260-Q176-D","text":"It displays users' real names\nHiển thị tên thật của người dùng"}],"correctOptionId":"BC260-Q176-B","explanation":"Explanation (EN): Bitcoin's public ledger lets observers inspect confirmed transactions and addresses. Transparency does not mean identities are automatically exposed or that users can rewrite confirmed records.\nGiải thích (VI): Blockchain Bitcoin công khai dữ liệu giao dịch đã xác nhận cho người có thể truy cập mạng. Tính minh bạch không đồng nghĩa mọi địa chỉ công khai tên thật, cũng không cho phép tùy ý sửa lịch sử.\n\nPhân tích từng đáp án:\n✗ A SAI. Giao dịch đã xác nhận không được tùy tiện sửa.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Bất kỳ ai đều xem được giao dịch đã xác nhận.\n✗ C SAI. Dữ liệu công khai cho nhiều người, không chỉ cơ quan quản lý.\n✗ D SAI. Địa chỉ thường không hiển thị tên thật.","source":"Bộ đề Blockchain - Câu gốc 176/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q177","chapter":4,"number":177,"question":"How does a general-purpose CBDC differ from a wholesale-only CBDC?\nCBDC dùng cho công chúng khác CBDC chỉ dùng liên ngân hàng như thế nào?","options":[{"id":"BC260-Q177-A","text":"It is fully anonymous and outside all regulation\nHoàn toàn ẩn danh và ngoài mọi quản lý"},{"id":"BC260-Q177-B","text":"The public can use it; wholesale CBDC is for institutions\nCông chúng dùng được; CBDC bán buôn dành cho tổ chức"},{"id":"BC260-Q177-C","text":"It can only be used between central banks\nChỉ dùng giữa ngân hàng trung ương"},{"id":"BC260-Q177-D","text":"It has no link at all to the central bank's balance sheet\nKhông liên quan bảng cân đối ngân hàng trung ương"}],"correctOptionId":"BC260-Q177-B","explanation":"Explanation (EN): General-purpose or retail CBDCs are aimed at broader public use, whereas wholesale CBDCs are for eligible financial institutions and settlement activity.\nGiải thích (VI): General-purpose hay retail CBDC có thể phục vụ công chúng; wholesale CBDC hướng tới tổ chức tài chính được phép. Cả hai đều liên quan nghĩa vụ của ngân hàng trung ương.\n\nPhân tích từng đáp án:\n✗ A SAI. CBDC cho công chúng vẫn chịu quản lý và không mặc định ẩn danh hoàn toàn.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Công chúng dùng được; CBDC bán buôn dành cho tổ chức.\n✗ C SAI. CBDC dùng chung không giới hạn chỉ giữa ngân hàng trung ương.\n✗ D SAI. CBDC là nghĩa vụ trên bảng cân đối ngân hàng trung ương.","source":"Bộ đề Blockchain - Câu gốc 177/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q178","chapter":1,"number":178,"question":"Why is it safe to publish a bitcoin address, for example on an invoice?\nVì sao an toàn khi công bố địa chỉ Bitcoin trên hóa đơn?","options":[{"id":"BC260-Q178-A","text":"It changes automatically after being published\nTự động thay đổi sau khi công bố"},{"id":"BC260-Q178-B","text":"It lets others send funds but not spend them\nCho phép người khác gửi nhưng không thể dùng địa chỉ để chi tiền"},{"id":"BC260-Q178-C","text":"It is linked to a bank that guards the funds\nGắn với ngân hàng bảo vệ tài sản"},{"id":"BC260-Q178-D","text":"It is encrypted so that no one can read it\nĐược mã hóa đến mức không ai đọc được"}],"correctOptionId":"BC260-Q178-B","explanation":"Explanation (EN): A receiving address allows others to direct funds toward the owner but does not itself authorize spending. The corresponding private key remains secret.\nGiải thích (VI): Địa chỉ dùng để nhận tiền, không phải bí mật có thể ký chi tiêu. Đăng địa chỉ trên hóa đơn là phù hợp; không đăng private key hoặc seed phrase.\n\nPhân tích từng đáp án:\n✗ A SAI. Địa chỉ có thể dùng nhiều lần, không bắt buộc đổi khi công bố.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Cho phép người khác gửi nhưng không thể dùng địa chỉ để chi tiền.\n✗ C SAI. Địa chỉ Bitcoin không phải tài khoản ngân hàng được bảo lãnh.\n✗ D SAI. Địa chỉ công khai để người khác đọc, không phải bí mật mã hóa.","source":"Bộ đề Blockchain - Câu gốc 178/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q179","chapter":1,"number":179,"question":"What is a recovery (seed) phrase in a cryptocurrency wallet?\nCụm từ khôi phục (seed phrase) trong ví crypto là gì?","options":[{"id":"BC260-Q179-A","text":"A list of words that can restore the wallet's keys\nDanh sách từ có thể khôi phục khóa ví"},{"id":"BC260-Q179-B","text":"A message attached to every transaction\nThông điệp đi kèm mọi giao dịch"},{"id":"BC260-Q179-C","text":"A public code shared to receive payments\nMã công khai để nhận tiền"},{"id":"BC260-Q179-D","text":"A password used to log into an exchange\nMật khẩu đăng nhập sàn"}],"correctOptionId":"BC260-Q179-A","explanation":"Explanation (EN): A seed or recovery phrase can recreate a wallet's spending keys when the device is lost. It must be protected like a master secret.\nGiải thích (VI): Recovery/seed phrase là chuỗi từ khôi phục ví và các khóa. Ai biết cụm từ này có thể chiếm quyền kiểm soát; cần sao lưu riêng tư, không gửi qua chat.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Danh sách từ có thể khôi phục khóa ví.\n✗ B SAI. Thông điệp giao dịch không phục hồi được seed phrase ví.\n✗ C SAI. Mã nhận tiền công khai khác cụm từ bí mật.\n✗ D SAI. Mật khẩu sàn không mặc định tạo lại khóa ví cá nhân.","source":"Bộ đề Blockchain - Câu gốc 179/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q180","chapter":2,"number":180,"question":"A miner finds a valid block but other nodes discover it includes an invalid transaction. What happens?\nThợ đào tìm thấy khối hợp lệ về PoW nhưng chứa giao dịch không hợp lệ. Các nút khác làm gì?","options":[{"id":"BC260-Q180-A","text":"Only the invalid transaction is removed\nChỉ bỏ giao dịch sai ra"},{"id":"BC260-Q180-B","text":"Nodes reject the block and the miner loses the reward\nNút từ chối cả khối và thợ đào mất thưởng"},{"id":"BC260-Q180-C","text":"The miner is fined by a regulator\nThợ đào bị cơ quan quản lý phạt"},{"id":"BC260-Q180-D","text":"The block is accepted because the hash is valid\nVẫn nhận khối vì hash hợp lệ"}],"correctOptionId":"BC260-Q180-B","explanation":"Explanation (EN): Valid Proof of Work is not enough to make a block valid. Full nodes reject a block containing invalid transactions, so the miner does not receive an accepted block reward.\nGiải thích (VI): Hash PoW hợp lệ không đủ làm khối hợp lệ nếu chứa giao dịch sai. Full node kiểm tra cả cấu trúc và quy tắc giao dịch, sẽ từ chối toàn bộ khối vi phạm.\n\nPhân tích từng đáp án:\n✗ A SAI. Bỏ giao dịch sai không khiến khối ban đầu với Merkle root cũ hợp lệ.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Nút từ chối cả khối và thợ đào mất thưởng.\n✗ C SAI. Không cần cơ quan nhà nước phạt miner để từ chối khối sai.\n✗ D SAI. Hash PoW hợp lệ chưa đủ: giao dịch cũng phải hợp lệ.","source":"Bộ đề Blockchain - Câu gốc 180/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q181","chapter":2,"number":181,"question":"A miner finds a valid block but other nodes discover it includes an invalid transaction. What happens?\nThợ đào tìm thấy khối hợp lệ về PoW nhưng chứa giao dịch không hợp lệ. Các nút khác làm gì?","options":[{"id":"BC260-Q181-A","text":"Only the invalid transaction is removed\nChỉ bỏ giao dịch sai ra"},{"id":"BC260-Q181-B","text":"Nodes reject the block and the miner loses the reward\nNút từ chối cả khối và thợ đào mất thưởng"},{"id":"BC260-Q181-C","text":"The miner is fined by a regulator\nThợ đào bị cơ quan quản lý phạt"},{"id":"BC260-Q181-D","text":"The block is accepted because the hash is valid\nVẫn nhận khối vì hash hợp lệ"}],"correctOptionId":"BC260-Q181-B","explanation":"Explanation (EN): Valid Proof of Work is not enough to make a block valid. Full nodes reject a block containing invalid transactions, so the miner does not receive an accepted block reward.\nGiải thích (VI): Hash PoW hợp lệ không đủ làm khối hợp lệ nếu chứa giao dịch sai. Full node kiểm tra cả cấu trúc và quy tắc giao dịch, sẽ từ chối toàn bộ khối vi phạm.\n\nPhân tích từng đáp án:\n✗ A SAI. Bỏ giao dịch sai không khiến khối ban đầu với Merkle root cũ hợp lệ.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Nút từ chối cả khối và thợ đào mất thưởng.\n✗ C SAI. Không cần cơ quan nhà nước phạt miner để từ chối khối sai.\n✗ D SAI. Hash PoW hợp lệ chưa đủ: giao dịch cũng phải hợp lệ.","source":"Bộ đề Blockchain - Câu gốc 181/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q182","chapter":1,"number":182,"question":"Which type of blockchain allows anyone to join, read and validate transactions?\nLoại blockchain nào cho phép bất kỳ ai tham gia, đọc và xác minh giao dịch?","options":[{"id":"BC260-Q182-A","text":"Consortium blockchain\nBlockchain liên minh"},{"id":"BC260-Q182-B","text":"Private blockchain\nBlockchain riêng"},{"id":"BC260-Q182-C","text":"Public blockchain\nBlockchain công khai"},{"id":"BC260-Q182-D","text":"Centralized blockchain\nBlockchain tập trung"}],"correctOptionId":"BC260-Q182-C","explanation":"Explanation (EN): A public permissionless blockchain permits broad access to read and participate under network rules. Private and consortium chains restrict access or validation roles.\nGiải thích (VI): Public/permissionless blockchain cho mọi người tham gia đọc và xác minh theo quy tắc công khai. Quyền ghi khối có thể phụ thuộc cơ chế đồng thuận nhưng không do một chủ sở hữu cấp phép.\n\nPhân tích từng đáp án:\n✗ A SAI. Consortium giới hạn thành viên đã được cho phép.\n✗ B SAI. Private chain không mở cho mọi người tham gia.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Blockchain công khai.\n✗ D SAI. Hệ thống tập trung không mở cho các nút xác minh tự do.","source":"Bộ đề Blockchain - Câu gốc 182/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q183","chapter":1,"number":183,"question":"A trader keeps all their crypto on one exchange for convenience. What is the main risk?\nNhà giao dịch giữ toàn bộ crypto trên một sàn vì tiện. Rủi ro chính là gì?","options":[{"id":"BC260-Q183-A","text":"Losing the right to vote in elections\nMất quyền bỏ phiếu bầu cử"},{"id":"BC260-Q183-B","text":"Losing funds if the exchange is hacked or fails\nMất tài sản nếu sàn bị hack hoặc sụp đổ"},{"id":"BC260-Q183-C","text":"Automatic conversion of the coins into a CBDC\nCoin tự chuyển sang CBDC"},{"id":"BC260-Q183-D","text":"Higher mining difficulty for the whole network\nĐộ khó đào toàn mạng tăng"}],"correctOptionId":"BC260-Q183-B","explanation":"Explanation (EN): Keeping assets on one centralized exchange exposes the holder to custody, hack and insolvency risk. Convenience does not guarantee recoverability.\nGiải thích (VI): Giữ toàn bộ crypto trên sàn tạo rủi ro lưu ký: sàn có thể bị hack, phá sản hoặc phong tỏa rút tiền. Tiện lợi không đồng nghĩa tự nắm private key.\n\nPhân tích từng đáp án:\n✗ A SAI. Mua crypto trên sàn không ảnh hưởng quyền bỏ phiếu bầu cử.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Mất tài sản nếu sàn bị hack hoặc sụp đổ.\n✗ C SAI. Sàn không tự đổi mọi coin thành CBDC.\n✗ D SAI. Việc dùng sàn không tự làm thay độ khó toàn mạng.","source":"Bộ đề Blockchain - Câu gốc 183/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q184","chapter":1,"number":184,"question":"A customer wants to send bitcoin abroad on a weekend when banks are closed. Why is this still possible?\nKhách muốn gửi Bitcoin ra nước ngoài vào cuối tuần khi ngân hàng đóng cửa. Vì sao vẫn làm được?","options":[{"id":"BC260-Q184-A","text":"The network runs continuously without relying on bank opening hours\nMạng luôn hoạt động, không phụ thuộc giờ mở cửa ngân hàng"},{"id":"BC260-Q184-B","text":"Bitcoin payments are processed by central banks on weekends\nNgân hàng trung ương xử lý Bitcoin cuối tuần"},{"id":"BC260-Q184-C","text":"The payment is held by an intermediary until banks reopen Monday\nTrung gian giữ khoản tiền đến thứ Hai"},{"id":"BC260-Q184-D","text":"Weekend payments are recorded on paper and posted later\nGhi thanh toán cuối tuần ra giấy rồi nhập sau"}],"correctOptionId":"BC260-Q184-A","explanation":"Explanation (EN): Bitcoin's peer-to-peer network operates continuously regardless of banking hours or borders. Confirmation still depends on network conditions and fees.\nGiải thích (VI): Bitcoin hoạt động 24/7 trên mạng P2P toàn cầu, không phụ thuộc giờ giao dịch ngân hàng. Mạng vẫn có thể tắc nghẽn hoặc phí cao nhưng không 'đóng cửa cuối tuần'.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Mạng luôn hoạt động, không phụ thuộc giờ mở cửa ngân hàng.\n✗ B SAI. Bitcoin không do ngân hàng trung ương xử lý cuối tuần.\n✗ C SAI. Không cần chờ ngân hàng mở lại để truyền giao dịch.\n✗ D SAI. Giao dịch không cần sổ giấy cuối tuần.","source":"Bộ đề Blockchain - Câu gốc 184/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q185","chapter":3,"number":185,"question":"What is the Bitcoin transaction ledger?\nSổ cái giao dịch Bitcoin là gì?","options":[{"id":"BC260-Q185-A","text":"A private database held by the founder of Bitcoin\nCơ sở dữ liệu riêng của người sáng lập Bitcoin"},{"id":"BC260-Q185-B","text":"A list of account balances kept by banks\nDanh sách số dư ngân hàng giữ"},{"id":"BC260-Q185-C","text":"A paper record book kept by the largest miners\nSổ giấy của các thợ đào lớn nhất"},{"id":"BC260-Q185-D","text":"The blockchain: a public record of confirmed transactions\nBlockchain: bản ghi công khai các giao dịch đã xác nhận"}],"correctOptionId":"BC260-Q185-D","explanation":"Explanation (EN): Bitcoin's transaction ledger is the blockchain, a public history of validated transactions. It is not the founder's private database or a bank account register.\nGiải thích (VI): Sổ cái Bitcoin là blockchain công khai ghi các giao dịch đã xác nhận. Dữ liệu đó không nằm trong sổ giấy của thợ đào hoặc cơ sở dữ liệu riêng của nhà sáng lập.\n\nPhân tích từng đáp án:\n✗ A SAI. Bitcoin không có cơ sở dữ liệu riêng người sáng lập kiểm soát.\n✗ B SAI. Sổ cái Bitcoin không do ngân hàng giữ số dư tài khoản theo cách này.\n✗ C SAI. Bản ghi Bitcoin là dữ liệu số phân tán, không phải sổ giấy của miner.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Blockchain: bản ghi công khai các giao dịch đã xác nhận.","source":"Bộ đề Blockchain - Câu gốc 185/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q186","chapter":1,"number":186,"question":"What does the phrase ‘trust without a middleman’ mean for Bitcoin?\nCụm từ “tin cậy không cần trung gian” trong Bitcoin có nghĩa gì?","options":[{"id":"BC260-Q186-A","text":"Trust is not needed because transactions are reversible\nKhông cần tin cậy vì giao dịch đảo được"},{"id":"BC260-Q186-B","text":"A licensed bank guarantees every Bitcoin transaction for users\nNgân hàng được cấp phép bảo đảm mọi giao dịch"},{"id":"BC260-Q186-C","text":"Trust rests on cryptography and network rules, not an institution\nNiềm tin dựa vào mật mã và quy tắc mạng chứ không phải tổ chức"},{"id":"BC260-Q186-D","text":"Users must trust the developers who wrote the software\nNgười dùng phải tin nhà phát triển phần mềm"}],"correctOptionId":"BC260-Q186-C","explanation":"Explanation (EN): Bitcoin replaces institutional trust with independently checked cryptographic proofs and consensus rules. It does not mean that all reversals are freely available.\nGiải thích (VI): Niềm tin không qua trung gian đến từ chữ ký mật mã, xác minh độc lập và đồng thuận về quy tắc sổ cái. Nó không có nghĩa mọi giao dịch đều có thể hủy hoặc ngân hàng cam kết bồi thường.\n\nPhân tích từng đáp án:\n✗ A SAI. Tin cậy không đồng nghĩa giao dịch có thể đảo ngược.\n✗ B SAI. Không có ngân hàng được phép bảo lãnh mọi giao dịch Bitcoin.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Niềm tin dựa vào mật mã và quy tắc mạng chứ không phải tổ chức.\n✗ D SAI. Nhà phát triển không có quyền bắt mạng chấp nhận quy tắc sai.","source":"Bộ đề Blockchain - Câu gốc 186/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q187","chapter":1,"number":187,"question":"In a traditional centralized ledger, who stores and controls the transaction records?\nTrong sổ cái tập trung truyền thống, ai lưu và kiểm soát bản ghi giao dịch?","options":[{"id":"BC260-Q187-A","text":"Anonymous nodes selected at rando m\nCác nút ẩn danh được chọn ngẫu nhiên"},{"id":"BC260-Q187-B","text":"Miners competing to add new blocks\nThợ đào cạnh tranh thêm khối"},{"id":"BC260-Q187-C","text":"A single trusted intermediary\nMột trung gian được tin cậy duy nhất"},{"id":"BC260-Q187-D","text":"Every participant holding an identical copy\nMọi bên giữ bản sao như nhau"}],"correctOptionId":"BC260-Q187-C","explanation":"Explanation (EN): In a centralized ledger, a single trusted organization controls record storage and updates. A decentralized or distributed system instead has multiple participating nodes.\nGiải thích (VI): Trong mô hình tập trung, một thực thể đáng tin cậy vận hành kho ghi chép chính và kiểm soát cập nhật. Đây là điểm khác biệt nền tảng với nhiều nút giữ bản sao.\n\nPhân tích từng đáp án:\n✗ A SAI. Nút ẩn danh không phải trung gian quản lý sổ tập trung.\n✗ B SAI. Miner cạnh tranh mô tả PoW chứ không phải sổ cái tập trung.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Một trung gian được tin cậy duy nhất.\n✗ D SAI. Nhiều bên giữ bản sao là thiết kế phân tán.","source":"Bộ đề Blockchain - Câu gốc 187/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q188","chapter":2,"number":188,"question":"Why can a public key be shared openly without putting funds at risk?\nVì sao khóa công khai có thể chia sẻ công khai mà không đặt tài sản vào nguy hiểm?","options":[{"id":"BC260-Q188-A","text":"The public key is encrypted with the address\nKhóa công khai được địa chỉ mã hóa"},{"id":"BC260-Q188-B","text":"The public key expires after each transaction\nKhóa công khai hết hạn sau mỗi giao dịch"},{"id":"BC260-Q188-C","text":"Only miners can read the public key\nChỉ thợ đào đọc được khóa công khai"},{"id":"BC260-Q188-D","text":"The private key cannot feasibly be derived from it\nKhông thể tính ngược khóa riêng từ khóa công khai một cách khả thi"}],"correctOptionId":"BC260-Q188-D","explanation":"Explanation (EN): Asymmetric cryptography lets people share public keys because the corresponding private key is computationally infeasible to derive from them under normal assumptions.\nGiải thích (VI): Public key được công khai vì trên hệ mật mã bất đối xứng chuẩn, việc suy ra private key từ public key là không khả thi về mặt tính toán trong điều kiện an toàn giả định. Điều đó không cho phép công khai private key.\n\nPhân tích từng đáp án:\n✗ A SAI. Khóa công khai không cần được địa chỉ mã hóa mới chia sẻ được.\n✗ B SAI. Khóa công khai không tự hết hạn sau mỗi giao dịch.\n✗ C SAI. Khóa công khai có thể được bất kỳ người nào đọc.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Không thể tính ngược khóa riêng từ khóa công khai một cách khả thi.","source":"Bộ đề Blockchain - Câu gốc 188/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q189","chapter":2,"number":189,"question":"Why can smart contracts create legal and operational risk?\nVì sao smart contract có thể tạo rủi ro pháp lý và vận hành?","options":[{"id":"BC260-Q189-A","text":"Once deployed, they run automatically and are hard to amend\nSau triển khai, hợp đồng tự chạy và khó sửa đổi"},{"id":"BC260-Q189-B","text":"They cannot store any data about the agreement\nKhông thể lưu dữ liệu nào về thỏa thuận"},{"id":"BC260-Q189-C","text":"They always require a court's approval before running\nLuôn cần tòa án phê duyệt mới chạy"},{"id":"BC260-Q189-D","text":"They can be changed by any user at any time\nBất kỳ người dùng nào cũng sửa được mọi lúc"}],"correctOptionId":"BC260-Q189-A","explanation":"Explanation (EN): Smart contracts execute coded conditions automatically, which can make mistakes difficult to reverse and upgrades legally or operationally complex. Code cannot resolve every real-world dispute alone.\nGiải thích (VI): Mã smart contract thực thi tự động và có thể khó sửa sau triển khai; nếu viết sai điều kiện hoặc luật pháp không rõ ràng, hậu quả có thể gây tranh chấp. Cần kiểm toán mã và thiết kế cơ chế xử lý sự cố.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Sau triển khai, hợp đồng tự chạy và khó sửa đổi.\n✗ B SAI. Smart contract có thể lưu hoặc tham chiếu dữ liệu thỏa thuận.\n✗ C SAI. Hợp đồng không luôn phải được tòa án phê duyệt mới chạy.\n✗ D SAI. Không phải ai cũng có quyền sửa code hợp đồng triển khai.","source":"Bộ đề Blockchain - Câu gốc 189/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q190","chapter":1,"number":190,"question":"Which item lets a user prove ownership of bitcoin when spending it?\nYếu tố nào giúp người dùng chứng minh quyền sở hữu Bitcoin khi chi tiêu?","options":[{"id":"BC260-Q190-A","text":"The number of the block that holds the coins\nSố khối chứa coin"},{"id":"BC260-Q190-B","text":"A digital signature made with the private key\nChữ ký số tạo bằng khóa riêng"},{"id":"BC260-Q190-C","text":"The user's email address and login password\nEmail và mật khẩu đăng nhập"},{"id":"BC260-Q190-D","text":"A receipt issued by the user's exchange\nBiên nhận do sàn phát"}],"correctOptionId":"BC260-Q190-B","explanation":"Explanation (EN): A valid private-key signature proves control of the relevant spendable output. An exchange receipt or email password is not a Bitcoin consensus authorization.\nGiải thích (VI): Private key tạo chữ ký số chứng minh quyền chi tiêu, được kiểm tra bằng public key. Email, mật khẩu sàn hoặc số khối không thay thế được chữ ký hợp lệ trên UTXO.\n\nPhân tích từng đáp án:\n✗ A SAI. Số khối không cho quyền chi tiêu.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Chữ ký số tạo bằng khóa riêng.\n✗ C SAI. Email và mật khẩu sàn không phải chữ ký mật mã Bitcoin.\n✗ D SAI. Biên nhận sàn không tự chứng minh có quyền ký UTXO.","source":"Bộ đề Blockchain - Câu gốc 190/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q191","chapter":1,"number":191,"question":"Which term best describes Bitcoin’s monetary policy?\nThuật ngữ nào mô tả đúng nhất chính sách tiền tệ Bitcoin?","options":[{"id":"BC260-Q191-A","text":"Set by a central bank each month\nNgân hàng trung ương đặt mỗi tháng"},{"id":"BC260-Q191-B","text":"Predetermined and fixed by protocol rules\nĐược xác định trước và cố định theo giao thức"},{"id":"BC260-Q191-C","text":"Adjusted daily to keep prices stable\nĐiều chỉnh hằng ngày để ổn định giá"},{"id":"BC260-Q191-D","text":"Decided by the largest exchange\nDo sàn lớn nhất quyết định"}],"correctOptionId":"BC260-Q191-B","explanation":"Explanation (EN): Bitcoin follows predetermined supply and issuance rules. No exchange, bank or minister changes its monetary schedule unilaterally.\nGiải thích (VI): Chính sách phát hành Bitcoin được định trước trong giao thức, gồm mức thưởng và chu kỳ halving. Giá thị trường vẫn dao động theo cung cầu, không do giao thức neo vào USD.\n\nPhân tích từng đáp án:\n✗ A SAI. Không có ngân hàng trung ương đặt lịch phát hành Bitcoin.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Được xác định trước và cố định theo giao thức.\n✗ C SAI. Bitcoin không tự điều chỉnh phát hành để giữ giá ổn định.\n✗ D SAI. Sàn lớn nhất không quyết định quy tắc cung tiền.","source":"Bộ đề Blockchain - Câu gốc 191/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q192","chapter":3,"number":192,"question":"What does a node check when verifying the inputs of a transaction?\nNút kiểm tra điều gì khi xác minh đầu vào giao dịch?","options":[{"id":"BC260-Q192-A","text":"That the receiver has approved the payment\nNgười nhận đã phê duyệt thanh toán"},{"id":"BC260-Q192-B","text":"That the sender has a bank account\nNgười gửi có tài khoản ngân hàng"},{"id":"BC260-Q192-C","text":"That the amount isa whole number of bitcoin\nSố tiền phải là số nguyên Bitcoin"},{"id":"BC260-Q192-D","text":"That inputs are unspent and properly signed\nĐầu vào chưa tiêu và có chữ ký hợp lệ"}],"correctOptionId":"BC260-Q192-D","explanation":"Explanation (EN): A full node checks that transaction inputs reference unspent outputs and satisfy the required authorization signatures. Recipient approval and bank accounts are not Bitcoin validation rules.\nGiải thích (VI): Full node kiểm tra rằng UTXO đầu vào chưa bị tiêu và có chữ ký/thỏa điều kiện mở khóa hợp lệ. Nếu thiếu một trong hai, giao dịch có thể bị từ chối.\n\nPhân tích từng đáp án:\n✗ A SAI. Người nhận không cần phê duyệt mỗi đầu vào để nó hợp lệ.\n✗ B SAI. Bitcoin không yêu cầu người gửi có tài khoản ngân hàng.\n✗ C SAI. Bitcoin cho phép đơn vị nhỏ hơn 1 BTC.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Đầu vào chưa tiêu và có chữ ký hợp lệ.","source":"Bộ đề Blockchain - Câu gốc 192/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q193","chapter":3,"number":193,"question":"What does UTXO stand for?\nUTXO là viết tắt của cụm từ gì?","options":[{"id":"BC260-Q193-A","text":"Universal token exchange\nTrao đổi token phổ quát"},{"id":"BC260-Q193-B","text":"Unverified transfer operation\nHoạt động chuyển chưa được xác minh"},{"id":"BC260-Q193-C","text":"Unified transaction order\nThứ tự giao dịch thống nhất"},{"id":"BC260-Q193-D","text":"Unspent transaction output\nĐầu ra giao dịch chưa chi tiêu"}],"correctOptionId":"BC260-Q193-D","explanation":"Explanation (EN): UTXO stands for Unspent Transaction Output: a discrete output of a prior transaction that has not yet been spent.\nGiải thích (VI): UTXO viết tắt của Unspent Transaction Output, nghĩa là đầu ra giao dịch chưa được dùng để chi tiêu. Đây là đơn vị kế toán quan trọng của Bitcoin.\n\nPhân tích từng đáp án:\n✗ A SAI. Tên này không phải cụm UTXO chính thức.\n✗ B SAI. Không phải định nghĩa UTXO.\n✗ C SAI. Thuật ngữ liên quan thứ tự, không phải đầu ra chưa tiêu.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Đầu ra giao dịch chưa chi tiêu.","source":"Bộ đề Blockchain - Câu gốc 193/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q194","chapter":3,"number":194,"question":"Why does a Bitcoin transaction often include a ‘change’ output back to the sender?\nVì sao giao dịch Bitcoin thường có đầu ra “tiền thừa” trả lại người gửi?","options":[{"id":"BC260-Q194-A","text":"The receiver must return part of the payment\nNgười nhận phải hoàn lại một phần"},{"id":"BC260-Q194-B","text":"A UTXO is spent in full, so the excess comes back\nUTXO được tiêu toàn bộ nên phần dư được trả lại"},{"id":"BC260-Q194-C","text":"Miners require a refund on every transaction\nThợ đào yêu cầu hoàn tiền mọi giao dịch"},{"id":"BC260-Q194-D","text":"It is needed to pay the bank's commission\nCần để trả hoa hồng ngân hàng"}],"correctOptionId":"BC260-Q194-B","explanation":"Explanation (EN): A UTXO used as an input is consumed in full. After paying the recipient and the fee, the remainder is created as a new change output under the sender's control.\nGiải thích (VI): Trong UTXO, đầu vào được chi toàn bộ; phần còn dư sau khi trả người nhận và phí thường quay lại địa chỉ change của người gửi. Đây không phải tiền người nhận hoàn trả.\n\nPhân tích từng đáp án:\n✗ A SAI. Đầu ra change do người gửi tạo, không do người nhận hoàn lại.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: UTXO được tiêu toàn bộ nên phần dư được trả lại.\n✗ C SAI. Miner không yêu cầu refund cho từng giao dịch.\n✗ D SAI. Không phải hoa hồng ngân hàng.","source":"Bộ đề Blockchain - Câu gốc 194/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q195","chapter":3,"number":195,"question":"A merchant receives a Bitcoin payment that is not yet in any block. What is its current status?\nNgười bán nhận khoản Bitcoin chưa nằm trong khối nào. Trạng thái hiện tại là gì?","options":[{"id":"BC260-Q195-A","text":"Converted automatically into fiat money\nTự chuyển sang tiền pháp định"},{"id":"BC260-Q195-B","text":"Final and irreversible\nĐã cuối cùng và không thể đảo"},{"id":"BC260-Q195-C","text":"Rejected by the network\nBị mạng từ chối"},{"id":"BC260-Q195-D","text":"Pending, waiting to be confirmed in a block\nĐang chờ được xác nhận trong một khối"}],"correctOptionId":"BC260-Q195-D","explanation":"Explanation (EN): A valid-looking Bitcoin payment outside a confirmed block remains unconfirmed or pending. It can still conflict with another transaction and should not be treated as final.\nGiải thích (VI): Trước khi ghi vào khối, giao dịch được phát tán và chờ xác nhận, thường trong mempool. Chưa có trong khối thì chưa có xác nhận, không nên coi là cuối cùng.\n\nPhân tích từng đáp án:\n✗ A SAI. Chưa có xác nhận không tự đổi sang tiền pháp định.\n✗ B SAI. Giao dịch chưa vào khối chưa có tính chắc chắn của xác nhận.\n✗ C SAI. Không phải giao dịch chờ nào cũng bị từ chối.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Đang chờ được xác nhận trong một khối.","source":"Bộ đề Blockchain - Câu gốc 195/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q196","chapter":1,"number":196,"question":"Why are public and private keys described as a 'key pair’?\nVì sao gọi khóa công khai và khóa riêng là một “cặp khóa”?","options":[{"id":"BC260-Q196-A","text":"They are both meant to be shared openly with the network\nCả hai đều phải công khai"},{"id":"BC260-Q196-B","text":"They are two copies of exactly the same secret key\nHai bản sao của cùng một khóa bí mật"},{"id":"BC260-Q196-C","text":"They are always issued together by a commercial bank\nLuôn được ngân hàng thương mại cấp cùng lúc"},{"id":"BC260-Q196-D","text":"They are mathematically linked but have different roles\nCó liên hệ toán học nhưng vai trò khác nhau"}],"correctOptionId":"BC260-Q196-D","explanation":"Explanation (EN): Public and private keys are mathematically related but have different purposes: signing with the private key and verifying with the public key.\nGiải thích (VI): Public và private key là hai khóa liên kết toán học nhưng dùng những chức năng khác nhau: ký/bảo mật và kiểm tra/chia sẻ. Chúng không phải hai bản sao của cùng một bí mật.\n\nPhân tích từng đáp án:\n✗ A SAI. Khóa riêng phải được giữ bí mật, không chia sẻ cả cặp.\n✗ B SAI. Hai khóa khác nhau về chức năng và giá trị.\n✗ C SAI. Không cần ngân hàng thương mại phát hành cặp khóa.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Có liên hệ toán học nhưng vai trò khác nhau.","source":"Bộ đề Blockchain - Câu gốc 196/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q197","chapter":2,"number":197,"question":"Why does a wallet need the sender's private key to create a transaction?\nVì sao ví cần khóa riêng của người gửi để tạo giao dịch?","options":[{"id":"BC260-Q197-A","text":"To sign it and prove the right to spend\nKý giao dịch và chứng minh quyền chi tiêu"},{"id":"BC260-Q197-B","text":"To link the wallet to the sender' s bank\nLiên kết ví với ngân hàng người gửi"},{"id":"BC260-Q197-C","text":"To choose which miner will confirm it\nChọn thợ đào xác nhận giao dịch"},{"id":"BC260-Q197-D","text":"To work out the receiver's address\nTìm địa chỉ người nhận"}],"correctOptionId":"BC260-Q197-A","explanation":"Explanation (EN): The sender uses a private key to sign the transaction and demonstrate authority over the inputs. The receiver's address can be known without using the sender's key.\nGiải thích (VI): Người gửi cần private key để ký giao dịch, chứng minh quyền sử dụng UTXO hoặc tài sản ở địa chỉ tương ứng. Không phải để chọn miner hoặc tính địa chỉ người nhận.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Ký giao dịch và chứng minh quyền chi tiêu.\n✗ B SAI. Khóa riêng không dùng liên kết ngân hàng.\n✗ C SAI. Chọn miner không phải mục đích chữ ký ví.\n✗ D SAI. Địa chỉ nhận tiền không cần khóa riêng người gửi để tìm.","source":"Bộ đề Blockchain - Câu gốc 197/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q198","chapter":1,"number":198,"question":"A shop wants to receive bitcoin from a customer. What should the shop give the customer?\nCửa hàng muốn nhận Bitcoin từ khách. Nên đưa thông tin gì cho khách?","options":[{"id":"BC260-Q198-A","text":"Its bank login password\nMật khẩu đăng nhập ngân hàng"},{"id":"BC260-Q198-B","text":"A receiving address\nĐịa chỉ nhận tiền"},{"id":"BC260-Q198-C","text":"Its private key\nKhóa riêng"},{"id":"BC260-Q198-D","text":"Its wallet backup phrase\nCụm từ sao lưu ví"}],"correctOptionId":"BC260-Q198-B","explanation":"Explanation (EN): The merchant should provide a public receiving address. A private key or seed phrase would expose control over the merchant's funds.\nGiải thích (VI): Để khách gửi BTC, cửa hàng chỉ cần cung cấp địa chỉ nhận. Private key và seed phrase là bí mật tuyệt đối, không nằm trong thông tin yêu cầu thanh toán.\n\nPhân tích từng đáp án:\n✗ A SAI. Mật khẩu ngân hàng không dùng nhận Bitcoin trên chuỗi.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Địa chỉ nhận tiền.\n✗ C SAI. Khóa riêng cho quyền chi tiền, không được cho khách.\n✗ D SAI. Seed phrase có thể kiểm soát toàn bộ ví nên không chia sẻ.","source":"Bộ đề Blockchain - Câu gốc 198/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q199","chapter":3,"number":199,"question":"Which two main parts does every Bitcoin transaction contain?\nMỗi giao dịch Bitcoin gồm hai phần chính nào?","options":[{"id":"BC260-Q199-A","text":"Sender name and receiver name\nTên người gửi và người nhận"},{"id":"BC260-Q199-B","text":"Header and nonce\nPhần đầu khối và nonce"},{"id":"BC260-Q199-C","text":"Inputs and outputs\nĐầu vào và đầu ra"},{"id":"BC260-Q199-D","text":"Debit and credit accounts\nTài khoản ghi Nợ và ghi Có"}],"correctOptionId":"BC260-Q199-C","explanation":"Explanation (EN): Bitcoin transactions consist primarily of inputs and outputs. Header fields such as nonce belong to a block, not the two main transaction components.\nGiải thích (VI): Giao dịch Bitcoin có các đầu vào (UTXO được tiêu) và các đầu ra (UTXO mới tạo). Header và nonce là đặc trưng của khối, không phải hai phần chính của giao dịch.\n\nPhân tích từng đáp án:\n✗ A SAI. Bitcoin không ghi tên thật người gửi và nhận trong hai trường chính.\n✗ B SAI. Header và nonce thuộc dữ liệu khối.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Đầu vào và đầu ra.\n✗ D SAI. Kế toán ghi nợ/có khác cấu trúc giao dịch Bitcoin.","source":"Bộ đề Blockchain - Câu gốc 199/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q200","chapter":2,"number":200,"question":"Two miners publish valid blocks at the same height at almost the same time. What will happen?\nHai thợ đào công bố khối hợp lệ ở cùng độ cao gần đồng thời. Điều gì xảy ra?","options":[{"id":"BC260-Q200-A","text":"Nodes keep both briefly, then follow the branch that becomes longer\nCác nút giữ cả hai tạm thời rồi theo nhánh có nhiều công việc hơn"},{"id":"BC260-Q200-B","text":"The miner who holds more bitcoin wins the tie\nThợ đào nắm nhiều Bitcoin thắng"},{"id":"BC260-Q200-C","text":"A central authority chooses which block is kept\nCơ quan trung tâm chọn khối"},{"id":"BC260-Q200-D","text":"Both blocks are deleted permanently by all nodes\nCả hai khối đều bị xóa vĩnh viễn"}],"correctOptionId":"BC260-Q200-A","explanation":"Explanation (EN): Simultaneous valid blocks can create a temporary fork. Nodes eventually follow the branch with the greatest cumulative work rather than a bank-selected winner.\nGiải thích (VI): Khi hai khối hợp lệ cùng chiều cao xuất hiện, mạng có thể tạm phân nhánh; khi một nhánh tích lũy nhiều công việc hơn, các nút chuyển theo nhánh đó. Không cần một cơ quan trung tâm chọn.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Các nút giữ cả hai tạm thời rồi theo nhánh có nhiều công việc hơn.\n✗ B SAI. Số coin sở hữu không dùng phân xử PoW tại cùng chiều cao.\n✗ C SAI. Bitcoin không có cơ quan trung tâm chọn khối thắng.\n✗ D SAI. Hai khối không nhất thiết bị xóa vĩnh viễn ngay lập tức.","source":"Bộ đề Blockchain - Câu gốc 200/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q201","chapter":1,"number":201,"question":"Why must every node verify transactions independently?\nVì sao mọi nút phải tự xác minh giao dịch một cách độc lập?","options":[{"id":"BC260-Q201-A","text":"To reduce the size of the blockchain\nĐể giảm kích thước blockchain"},{"id":"BC260-Q201-B","text":"To identify the real names of users\nĐể nhận dạng tên thật người dùng"},{"id":"BC260-Q201-C","text":"So no node needs to trust other nodes\nĐể không nút nào phải tin nút khác"},{"id":"BC260-Q201-D","text":"To allow banks to approve each payment\nĐể ngân hàng phê duyệt từng khoản"}],"correctOptionId":"BC260-Q201-C","explanation":"Explanation (EN): Independent verification means that a node checks validity instead of taking another participant's claim on trust. This is essential where there is no central authority.\nGiải thích (VI): Nút Bitcoin tự xác minh vì một nút khác có thể sai hoặc có động cơ gian lận. Kiểm tra độc lập làm giảm nhu cầu tin một thực thể trung tâm.\n\nPhân tích từng đáp án:\n✗ A SAI. Việc tự kiểm tra không nhằm làm dữ liệu nhỏ hơn.\n✗ B SAI. Full node không biết tên pháp lý người dùng nhờ tự xác minh.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Để không nút nào phải tin nút khác.\n✗ D SAI. Bitcoin không cần ngân hàng phê duyệt từng khoản.","source":"Bộ đề Blockchain - Câu gốc 201/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q202","chapter":1,"number":202,"question":"What is a recovery (seed) phrase in a cryptocurrency wallet?\nCụm từ khôi phục (seed phrase) trong ví crypto là gì?","options":[{"id":"BC260-Q202-A","text":"A list of words that can restore the wallet's keys\nDanh sách từ có thể khôi phục khóa ví"},{"id":"BC260-Q202-B","text":"A password used to log into an exchange\nMật khẩu đăng nhập sàn"},{"id":"BC260-Q202-C","text":"A public code shared to receive payments\nMã công khai để nhận tiền"},{"id":"BC260-Q202-D","text":"A message attached to every transaction\nThông điệp đi kèm mọi giao dịch"}],"correctOptionId":"BC260-Q202-A","explanation":"Explanation (EN): A seed or recovery phrase can recreate a wallet's spending keys when the device is lost. It must be protected like a master secret.\nGiải thích (VI): Recovery/seed phrase là chuỗi từ khôi phục ví và các khóa. Ai biết cụm từ này có thể chiếm quyền kiểm soát; cần sao lưu riêng tư, không gửi qua chat.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Danh sách từ có thể khôi phục khóa ví.\n✗ B SAI. Mật khẩu sàn không mặc định tạo lại khóa ví cá nhân.\n✗ C SAI. Mã nhận tiền công khai khác cụm từ bí mật.\n✗ D SAI. Thông điệp giao dịch không phục hồi được seed phrase ví.","source":"Bộ đề Blockchain - Câu gốc 202/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q203","chapter":1,"number":203,"question":"What does a hash function produce from input data of any size?\nHàm băm tạo ra loại đầu ra gì từ dữ liệu đầu vào có độ dài bất kỳ?","options":[{"id":"BC260-Q203-A","text":"A variable-length copy of the input\nBản sao đầu vào có độ dài thay đổi"},{"id":"BC260-Q203-B","text":"A random number unrelated to the input\nSố ngẫu nhiên không liên quan đầu vào"},{"id":"BC260-Q203-C","text":"An encrypted file that can be decrypted with a key\nTệp được mã hóa có thể giải bằng khóa"},{"id":"BC260-Q203-D","text":"A fixed-length output called a hash or digest\nĐầu ra độ dài cố định gọi là hash hay digest"}],"correctOptionId":"BC260-Q203-D","explanation":"Explanation (EN): A hash function maps variable-length input to a fixed-length digest. A hash is not an encrypted copy that can be decrypted to reveal the input.\nGiải thích (VI): Hàm băm ánh xạ dữ liệu đầu vào kích thước bất kỳ thành một thông điệp băm có độ dài cố định. Hash không phải bản sao đầu vào và không thể giải mã như bản mã đối xứng.\n\nPhân tích từng đáp án:\n✗ A SAI. Hash không sao chép nguyên văn đầu vào.\n✗ B SAI. Hash là kết quả xác định từ đầu vào chứ không phải số ngẫu nhiên độc lập.\n✗ C SAI. Mã hóa đảo được bằng khóa là cơ chế khác với băm.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Đầu ra độ dài cố định gọi là hash hay digest.","source":"Bộ đề Blockchain - Câu gốc 203/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q204","chapter":1,"number":204,"question":"An exchange holding customers’ keys is hacked. Why do customers bear the risk?\nSàn giữ khóa của khách bị hack. Vì sao khách chịu rủi ro?","options":[{"id":"BC260-Q204-A","text":"Bitcoin is backed by the exchange's capital\nBitcoin được vốn của sàn bảo đảm"},{"id":"BC260-Q204-B","text":"The exchange, not the customers, held the keys\nSàn giữ khóa thay khách hàng"},{"id":"BC260-Q204-C","text":"The blockchain itself was destroyed\nBlockchain đã bị phá hủy"},{"id":"BC260-Q204-D","text":"Custom ers' public keys were published\nKhóa công khai của khách đã bị lộ"}],"correctOptionId":"BC260-Q204-B","explanation":"Explanation (EN): A custodial exchange holds keys on users' behalf; a breach can compromise the ability to protect or withdraw their assets. This is custody risk, not destruction of Bitcoin's chain.\nGiải thích (VI): Sàn lưu private key cho khách tạo rủi ro phụ thuộc vào an ninh và khả năng thanh toán của sàn. Nếu sàn bị hack, khách có thể tổn thất dù giao thức Bitcoin không bị phá.\n\nPhân tích từng đáp án:\n✗ A SAI. Vốn của sàn không đương nhiên bảo đảm mọi BTC của khách.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Sàn giữ khóa thay khách hàng.\n✗ C SAI. Blockchain không bị phá hủy khi sàn bị hack.\n✗ D SAI. Khóa công khai vốn được công khai, không phải bí mật lưu ký.","source":"Bộ đề Blockchain - Câu gốc 204/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q205","chapter":2,"number":205,"question":"Why can a public key be shared openly without putting funds at risk?\nVì sao khóa công khai có thể chia sẻ công khai mà không đặt tài sản vào nguy hiểm?","options":[{"id":"BC260-Q205-A","text":"The public key is encrypted with the address\nKhóa công khai được địa chỉ mã hóa"},{"id":"BC260-Q205-B","text":"Only miners can read the public key\nChỉ thợ đào đọc được khóa công khai"},{"id":"BC260-Q205-C","text":"The private key cannot feasibly be derived from it\nKhông thể tính ngược khóa riêng từ khóa công khai một cách khả thi"},{"id":"BC260-Q205-D","text":"The public key expires after each transaction\nKhóa công khai hết hạn sau mỗi giao dịch"}],"correctOptionId":"BC260-Q205-C","explanation":"Explanation (EN): Asymmetric cryptography lets people share public keys because the corresponding private key is computationally infeasible to derive from them under normal assumptions.\nGiải thích (VI): Public key được công khai vì trên hệ mật mã bất đối xứng chuẩn, việc suy ra private key từ public key là không khả thi về mặt tính toán trong điều kiện an toàn giả định. Điều đó không cho phép công khai private key.\n\nPhân tích từng đáp án:\n✗ A SAI. Khóa công khai không cần được địa chỉ mã hóa mới chia sẻ được.\n✗ B SAI. Khóa công khai có thể được bất kỳ người nào đọc.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Không thể tính ngược khóa riêng từ khóa công khai một cách khả thi.\n✗ D SAI. Khóa công khai không tự hết hạn sau mỗi giao dịch.","source":"Bộ đề Blockchain - Câu gốc 205/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q206","chapter":1,"number":206,"question":"A firm stores the hash of a contract on a blockchain. Later a party presents a modified version. How can this be detected?\nDoanh nghiệp lưu hash hợp đồng lên blockchain, sau đó bên khác nộp bản hợp đồng bị sửa. Phát hiện thế nào?","options":[{"id":"BC260-Q206-A","text":"The hash value updates automatically to match\nHash tự đổi để khớp bản mới"},{"id":"BC260-Q206-B","text":"The contract owner's private key changes\nKhóa riêng chủ hợp đồng thay đổi"},{"id":"BC260-Q206-C","text":"The new version's hash differs from the stored one\nHash bản mới khác hash đã lưu"},{"id":"BC260-Q206-D","text":"The blockchain stores the full contract text\nBlockchain lưu toàn văn hợp đồng"}],"correctOptionId":"BC260-Q206-C","explanation":"Explanation (EN): Rehashing the altered contract produces a digest different from the one committed to the blockchain. Comparing hashes detects a change without requiring the full contract to be stored on-chain.\nGiải thích (VI): Băm lại bản hợp đồng đã sửa sẽ cho hash khác giá trị được ghi nhận trước đó, giúp phát hiện nội dung thay đổi. Hash một mình không chứng minh hợp đồng gốc có tính pháp lý hoặc đã được hai bên đồng ý.\n\nPhân tích từng đáp án:\n✗ A SAI. Hash đã ghi không tự thay đổi theo bản hợp đồng mới.\n✗ B SAI. Khóa riêng chủ hợp đồng không tự đổi khi sửa văn bản.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Hash bản mới khác hash đã lưu.\n✗ D SAI. Nhiều hệ thống chỉ lưu hash trên chuỗi, không lưu toàn văn.","source":"Bộ đề Blockchain - Câu gốc 206/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q207","chapter":1,"number":207,"question":"From which item is a Bitcoin address derived?\nĐịa chỉ Bitcoin được dẫn xuất từ thông tin nào?","options":[{"id":"BC260-Q207-A","text":"The user's email address\nEmail người dùng"},{"id":"BC260-Q207-B","text":"The public key\nKhóa công khai"},{"id":"BC260-Q207-C","text":"The block number\nSố khối"},{"id":"BC260-Q207-D","text":"The private key directly without hashing\nKhóa riêng trực tiếp, không cần băm"}],"correctOptionId":"BC260-Q207-B","explanation":"Explanation (EN): Bitcoin addresses are derived from public-key-related data using hashing and encoding. They are not derived directly from an email address or block number.\nGiải thích (VI): Địa chỉ Bitcoin thường được tạo từ thông tin public key thông qua các bước hash và mã hóa địa chỉ. Nó không phải địa chỉ email và không cần công bố private key.\n\nPhân tích từng đáp án:\n✗ A SAI. Email không phải nguồn dẫn xuất địa chỉ Bitcoin.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Khóa công khai.\n✗ C SAI. Số khối không dùng tạo địa chỉ nhận.\n✗ D SAI. Địa chỉ thường có bước xử lý public key, không đơn thuần lộ private key.","source":"Bộ đề Blockchain - Câu gốc 207/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q208","chapter":2,"number":208,"question":"What is a commonly cited advantage of Proof of Stake over Proof of Work?\nLợi thế thường được nhắc đến của Proof of Stake so với Proof of Work là gì?","options":[{"id":"BC260-Q208-A","text":"Complete removal of all fees\nLoại bỏ hoàn toàn mọi khoản phí"},{"id":"BC260-Q208-B","text":"Much lower energy consumption\nTiêu thụ điện thấp hơn nhiều"},{"id":"BC260-Q208-C","text":"Guaranteed fixed coin prices\nBảo đảm giá coin cố định"},{"id":"BC260-Q208-D","text":"No need for any validators\nKhông cần bất kỳ validator nào"}],"correctOptionId":"BC260-Q208-B","explanation":"Explanation (EN): Proof of Stake normally avoids Bitcoin-style energy-intensive hash competition. However, it still needs validators, can involve fees, and cannot guarantee a token's price.\nGiải thích (VI): Proof of Stake chọn người xác thực dựa trên cơ chế stake thay vì bắt buộc cạnh tranh tiêu thụ điện như Proof of Work; lợi thế thường là tiết kiệm năng lượng. PoS vẫn cần validator và vẫn có phí mạng.\n\nPhân tích từng đáp án:\n✗ A SAI. PoS vẫn có phí mạng.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Tiêu thụ điện thấp hơn nhiều.\n✗ C SAI. PoS không cố định giá token.\n✗ D SAI. PoS phải có cơ chế validator tham gia.","source":"Bộ đề Blockchain - Câu gốc 208/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q209","chapter":3,"number":209,"question":"Alice has one UTXO of 5 BTC and pays Bob 3 BTC with a 0.001 BTC fee. What is her change output?\nAlice có một UTXO 5 BTC, trả Bob 3 BTC và phí 0,001 BTC. Đầu ra tiền thừa là bao nhiêu?","options":[{"id":"BC260-Q209-A","text":"5 BIC\n5 BTC [ảnh lỗi nhận dạng]"},{"id":"BC260-Q209-B","text":"2 BIC\n2 BTC [ảnh lỗi nhận dạng]"},{"id":"BC260-Q209-C","text":"1.999 BTC\n1,999 BTC"},{"id":"BC260-Q209-D","text":"2.001 BTC\n2,001 BTC"}],"correctOptionId":"BC260-Q209-C","explanation":"Explanation (EN): The change output is 5 - 3 - 0.001 = 1.999 BTC. UTXO inputs are spent in full and any unused value is returned as a new output.\nGiải thích (VI): Đầu vào 5 BTC, trả Bob 3 BTC và phí 0,001 BTC thì tiền thối lại là 5 − 3 − 0,001 = 1,999 BTC. UTXO gốc bị tiêu toàn bộ.\n\nPhân tích từng đáp án:\n✗ A SAI. 5 BTC là toàn bộ đầu vào, chưa trừ thanh toán và phí.\n✗ B SAI. 2 BTC tính thiếu phí và tiền trả Bob.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: 1,999 BTC.\n✗ D SAI. 2,001 BTC lớn hơn tiền còn sau khi trả 3 BTC.","source":"Bộ đề Blockchain - Câu gốc 209/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q210","chapter":1,"number":210,"question":"An exchange holding customers’ keys is hacked. Why do customers bear the risk?\nSàn giữ khóa của khách bị hack. Vì sao khách chịu rủi ro?","options":[{"id":"BC260-Q210-A","text":"Custom ers' public keys were published\nKhóa công khai của khách đã bị lộ"},{"id":"BC260-Q210-B","text":"The blockchain itself was destroyed\nBlockchain đã bị phá hủy"},{"id":"BC260-Q210-C","text":"Bitcoin is backed by the exchange's capital\nBitcoin được vốn của sàn bảo đảm"},{"id":"BC260-Q210-D","text":"The exchange, not the customers, held the keys\nSàn giữ khóa thay khách hàng"}],"correctOptionId":"BC260-Q210-D","explanation":"Explanation (EN): A custodial exchange holds keys on users' behalf; a breach can compromise the ability to protect or withdraw their assets. This is custody risk, not destruction of Bitcoin's chain.\nGiải thích (VI): Sàn lưu private key cho khách tạo rủi ro phụ thuộc vào an ninh và khả năng thanh toán của sàn. Nếu sàn bị hack, khách có thể tổn thất dù giao thức Bitcoin không bị phá.\n\nPhân tích từng đáp án:\n✗ A SAI. Khóa công khai vốn được công khai, không phải bí mật lưu ký.\n✗ B SAI. Blockchain không bị phá hủy khi sàn bị hack.\n✗ C SAI. Vốn của sàn không đương nhiên bảo đảm mọi BTC của khách.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Sàn giữ khóa thay khách hàng.","source":"Bộ đề Blockchain - Câu gốc 210/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q211","chapter":1,"number":211,"question":"Why are hash functions essential to blockchain security?\nTại sao hàm băm lại thiết yếu đối với bảo mật blockchain?","options":[{"id":"BC260-Q211-A","text":"They make transactions reversible\nChúng khiến giao dịch có thể đảo ngược"},{"id":"BC260-Q211-B","text":"They make any change to data detectable\nChúng giúp phát hiện mọi thay đổi dữ liệu"},{"id":"BC260-Q211-C","text":"They store user identities securelY\nChúng lưu an toàn danh tính người dùng"},{"id":"BC260-Q211-D","text":"They allow lost private keys to be recovered\nChúng cho phép khôi phục khóa riêng bị mất"}],"correctOptionId":"BC260-Q211-B","explanation":"Explanation (EN): A cryptographic hash produces a digest that changes when the input changes. This helps detect tampering; hashing does not recover lost keys or undo payments.\nGiải thích (VI): Hàm băm tạo dấu vân tay dữ liệu: chỉ cần thay đổi nhỏ ở đầu vào, giá trị băm có khả năng thay đổi rất lớn. Nhờ đó mạng có thể phát hiện dữ liệu bị sửa, chứ không dùng hash để khôi phục khóa bị mất.\n\nPhân tích từng đáp án:\n✗ A SAI. Hash không giúp đảo ngược giao dịch đã xác nhận.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Chúng giúp phát hiện mọi thay đổi dữ liệu.\n✗ C SAI. Hash không phải cơ sở dữ liệu định danh.\n✗ D SAI. Hash không thể khôi phục khóa riêng bí mật.","source":"Bộ đề Blockchain - Câu gốc 211/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q212","chapter":1,"number":212,"question":"What is a blockchain fork?\nFork trong blockchain là gì?","options":[{"id":"BC260-Q212-A","text":"A fee paid to exchanges for listing a coin\nPhí trả sàn để niêm yết coin"},{"id":"BC260-Q212-B","text":"A split in the chain or a change in protocol rules\nNhánh chuỗi tách ra hoặc thay đổi quy tắc giao thức"},{"id":"BC260-Q212-C","text":"A type of cold wallet used for long-term storage\nVí lạnh giữ coin dài hạn"},{"id":"BC260-Q212-D","text":"A tool that lets miners find blocks faster\nCông cụ giúp thợ đào tìm khối nhanh"}],"correctOptionId":"BC260-Q212-B","explanation":"Explanation (EN): A fork is a divergence in blockchain history or a change in protocol rules that splits network behavior. It is not a wallet or an exchange listing fee.\nGiải thích (VI): Fork có thể là phân nhánh tạm thời của chuỗi khối hoặc thay đổi quy tắc giao thức dẫn tới nhánh khác nhau. Cần phân biệt fork với phí niêm yết hoặc thiết bị đào.\n\nPhân tích từng đáp án:\n✗ A SAI. Phí niêm yết sàn không phải fork của blockchain.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Nhánh chuỗi tách ra hoặc thay đổi quy tắc giao thức.\n✗ C SAI. Fork không phải kiểu ví lạnh.\n✗ D SAI. Tốc độ đào không được định nghĩa bằng fork.","source":"Bộ đề Blockchain - Câu gốc 212/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q213","chapter":1,"number":213,"question":"What type of network structure does Bitcoin use?\nBitcoin sử dụng cấu trúc mạng nào?","options":[{"id":"BC260-Q213-A","text":"Client-server\nMạng máy khách–máy chủ"},{"id":"BC260-Q213-B","text":"Star network with a central hub\nMạng hình sao với nút trung tâm"},{"id":"BC260-Q213-C","text":"Peer-to-peer\nMạng ngang hàng P2P"},{"id":"BC260-Q213-D","text":"Hub- and-spoke\nMạng trung tâm và nhánh"}],"correctOptionId":"BC260-Q213-C","explanation":"Explanation (EN): Bitcoin runs on a peer-to-peer network in which nodes exchange transactions and blocks directly. It does not rely on one central payment server.\nGiải thích (VI): Bitcoin vận hành theo mạng ngang hàng (peer-to-peer, P2P), các nút trao đổi và xác minh dữ liệu theo quy tắc chung. Không có máy chủ ngân hàng trung tâm điều hành sổ cái.\n\nPhân tích từng đáp án:\n✗ A SAI. Client-server dựa vào máy chủ cung cấp dịch vụ.\n✗ B SAI. Mạng hình sao đòi hỏi hub trung tâm.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Mạng ngang hàng P2P.\n✗ D SAI. Hub-and-spoke vẫn dựa vào hub.","source":"Bộ đề Blockchain - Câu gốc 213/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q214","chapter":1,"number":214,"question":"Which characteristic means that records can be added to a blockchain but not edited or deleted?\nThuộc tính nào nói rằng bản ghi chỉ được thêm vào blockchain mà không sửa hay xóa?","options":[{"id":"BC260-Q214-A","text":"Scalability\nKhả năng mở rộng"},{"id":"BC260-Q214-B","text":"Interoperability\nKhả năng tương tác"},{"id":"BC260-Q214-C","text":"Centralization\nTập trung hóa"},{"id":"BC260-Q214-D","text":"Append-only\nChỉ cho phép ghi thêm"}],"correctOptionId":"BC260-Q214-D","explanation":"Explanation (EN): Append-only means records are added to the ledger rather than edited or removed in place. Immutability is a related but distinct security property.\nGiải thích (VI): Append-only là chỉ thêm dữ liệu mới, không sửa hay xóa trực tiếp bản ghi cũ đã xác nhận. Đây là một đặc điểm quan trọng của tính truy vết sổ cái.\n\nPhân tích từng đáp án:\n✗ A SAI. Khả năng mở rộng nói về lưu lượng xử lý.\n✗ B SAI. Tương tác là khả năng các hệ thống kết nối.\n✗ C SAI. Tập trung hóa nói về quyền điều khiển.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Chỉ cho phép ghi thêm.","source":"Bộ đề Blockchain - Câu gốc 214/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q215","chapter":2,"number":215,"question":"Why must a private key never be shared with anyone?\nVì sao tuyệt đối không chia sẻ khóa riêng?","options":[{"id":"BC260-Q215-A","text":"Sharing it slows down every later transaction\nChia sẻ làm mọi giao dịch sau chậm đi"},{"id":"BC260-Q215-B","text":"Whoever holds it can spend the funds it controls\nNgười giữ khóa có thể chi số tiền nó kiểm soát"},{"id":"BC260-Q215-C","text":"It reveals the owner's real name to the network\nTiết lộ tên thật chủ ví"},{"id":"BC260-Q215-D","text":"It can only be used once before it expires\nChỉ dùng một lần trước khi hết hạn"}],"correctOptionId":"BC260-Q215-B","explanation":"Explanation (EN): Anyone controlling a private key can sign valid transactions spending funds it controls. Sharing the key is therefore far more dangerous than sharing a public address.\nGiải thích (VI): Private key cho phép tạo chữ ký hợp lệ để chi tiêu tài sản tương ứng; nếu bị lộ, kẻ khác có thể kiểm soát tiền. Nó không phải mật khẩu một lần tự hết hạn sau khi dùng.\n\nPhân tích từng đáp án:\n✗ A SAI. Khóa riêng không phải yếu tố làm giao dịch sau chậm hơn.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Người giữ khóa có thể chi số tiền nó kiểm soát.\n✗ C SAI. Biết khóa riêng không nhất thiết bộc lộ tên thật chủ.\n✗ D SAI. Khóa riêng không tự hết hạn sau một lần dùng.","source":"Bộ đề Blockchain - Câu gốc 215/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q216","chapter":2,"number":216,"question":"How many keys does an asymmetric cryptosystem use for each user?\nHệ mật mã bất đối xứng dùng bao nhiêu khóa cho mỗi người dùng?","options":[{"id":"BC260-Q216-A","text":"One shared secret key\nMột khóa bí mật chung"},{"id":"BC260-Q216-B","text":"A pair: one public and one private key\nMột cặp: khóa công khai và khóa riêng"},{"id":"BC260-Q216-C","text":"Three keys: public, private and master\nBa khóa: công khai, riêng và chủ"},{"id":"BC260-Q216-D","text":"No keys; it relies only on passwords\nKhông cần khóa, chỉ dùng mật khẩu"}],"correctOptionId":"BC260-Q216-B","explanation":"Explanation (EN): Asymmetric cryptography uses a mathematically related public key and private key. It is not the same as symmetric encryption with one shared secret.\nGiải thích (VI): Mật mã bất đối xứng sử dụng một cặp public key và private key liên kết toán học. Đây là điểm khác với mã hóa đối xứng chỉ dùng khóa bí mật chung.\n\nPhân tích từng đáp án:\n✗ A SAI. Mật mã một khóa chung là đối xứng.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Một cặp: khóa công khai và khóa riêng.\n✗ C SAI. Hệ bất đối xứng cơ bản không cần bộ ba khóa như vậy.\n✗ D SAI. Mật khẩu thông thường không thay thế hoàn toàn cặp khóa.","source":"Bộ đề Blockchain - Câu gốc 216/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q217","chapter":1,"number":217,"question":"Which characteristic means that records can be added to a blockchain but not edited or deleted?\nThuộc tính nào nói rằng bản ghi chỉ được thêm vào blockchain mà không sửa hay xóa?","options":[{"id":"BC260-Q217-A","text":"Interoperability\nKhả năng tương tác"},{"id":"BC260-Q217-B","text":"Append-only\nChỉ cho phép ghi thêm"},{"id":"BC260-Q217-C","text":"Scalability\nKhả năng mở rộng"},{"id":"BC260-Q217-D","text":"Centralization\nTập trung hóa"}],"correctOptionId":"BC260-Q217-B","explanation":"Explanation (EN): Append-only means records are added to the ledger rather than edited or remove
