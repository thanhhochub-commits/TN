<style>
:root{--bg:#f5f7fb;--panel:#ffffff;--panel2:#f9fafb;--text:#111827;--muted:#64748b;--line:#e5e7eb;--primary:#2563eb;--primary2:#1d4ed8;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--warn:#a16207;--shadow:0 10px 35px rgba(15,23,42,.08);--radius:18px;--font:16px}

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:var(--font)/1.52 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;overflow:auto;z-index:20}.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 18px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:800}.brand b{font-size:17px}.brand small{display:block;color:var(--muted)}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--text);padding:11px 12px;border-radius:12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center}.nav button:hover,.nav button.active{background:var(--panel2)}.nav button.active{font-weight:700;color:var(--primary)}.side-foot{margin-top:18px;padding:13px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px}.main{min-width:0}.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:10px}.menu-btn{display:none}.topbar .spacer{flex:1}.icon-btn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:12px;cursor:pointer;transition:.18s transform,.18s background,.18s border}.btn:hover,.icon-btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--primary) 45%,var(--line))}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}.btn.danger{color:var(--bad)}.content{max-width:1180px;margin:0 auto;padding:26px 22px 70px}.page-title{margin:0 0 6px;font-size:28px;letter-spacing:-.02em}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.stat{grid-column:span 3}.stat .n{font-size:28px;font-weight:800}.stat .l{color:var(--muted);font-size:13px}.progress{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);width:0}.section-title{font-size:18px;margin:0 0 12px}.chapter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chapter-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2)}.chapter-item input{width:18px;height:18px}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 11px;border-radius:11px;outline:none}.field input:focus,.field select:focus{border-color:var(--primary)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toggle{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.toggle input{width:18px;height:18px}.setup{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.quiz-wrap{max-width:900px;margin:0 auto}.quiz-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}.quiz-head .progress{flex:1}.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel2);padding:5px 8px;border-radius:999px}.question{font-size:20px;font-weight:760;line-height:1.45;margin:14px 0 16px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:13px 14px;border-radius:14px;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;transition:.16s transform,.16s border,.16s background}.option:hover:not(:disabled){transform:translateY(-1px);border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}.option:disabled{cursor:default}.option.selected{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--panel2))}.option.selected .opt-letter{border-color:var(--primary);color:var(--primary)}.opt-letter{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--panel)}.option.correct{border-color:var(--ok);background:var(--okbg)}.option.correct .opt-letter{border-color:var(--ok);color:var(--ok)}.option.wrong{border-color:var(--bad);background:var(--badbg)}.option.wrong .opt-letter{border-color:var(--bad);color:var(--bad)}.option.review{border-color:#d97706;background:color-mix(in srgb,#f59e0b 12%,var(--panel))}.option.review .opt-letter{border-color:#d97706;color:#d97706}.feedback.review{border-color:#d97706;background:color-mix(in srgb,#f59e0b 10%,var(--panel))}.feedback{margin-top:14px;border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--panel2)}.feedback.good{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}.feedback.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}.feedback b{display:block;margin-bottom:5px}.explanation{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}.quiz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.navigator{display:flex;gap:6px;overflow:auto;padding:10px 0 2px}.navq{min-width:34px;height:34px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;cursor:pointer}.navq.current{outline:2px solid var(--primary)}.navq.answered{background:color-mix(in srgb,var(--primary) 12%,var(--panel))}.navq.correct{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.navq.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}.list{display:grid;gap:10px}.q-row{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:14px}.q-row h4{margin:0 0 7px;font-size:15px}.q-row .meta{font-size:12px;color:var(--muted)}.q-row .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.searchbar{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;margin-bottom:14px}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.toast{position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--panel);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translateY(0)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;padding:20px;z-index:99}.modal.open{display:grid}.modal-card{max-width:620px;width:100%;max-height:85vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.kpi-table{width:100%;border-collapse:collapse}.kpi-table th,.kpi-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.right{text-align:right!important}.muted{color:var(--muted)}.hidden{display:none!important}.test-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.test-summary .card{box-shadow:none}.timer{font-variant-numeric:tabular-nums;font-weight:800}.bookmark.active{color:#eab308;border-color:#eab308}.danger-zone{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-280px;width:260px;transition:.22s left;box-shadow:var(--shadow)}.sidebar.open{left:0}.menu-btn{display:inline-flex}.stat{grid-column:span 6}.setup{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr 1fr}.searchbar>*:first-child{grid-column:1/-1}.content{padding:20px 14px 70px}.topbar{padding:10px 14px}.question{font-size:18px}}
@media(max-width:560px){.stat{grid-column:span 12}.chapter-grid{grid-template-columns:1fr}.test-summary{grid-template-columns:1fr}.quiz-card{padding:16px}.option{padding:11px}.quiz-actions{position:sticky;bottom:10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);padding:8px;border-radius:14px}.searchbar{grid-template-columns:1fr}.page-title{font-size:24px}}

<script>
const QUESTIONS = [{"id":"BC260-Q001","chapter":4,"number":1,"question":"Which type of token gives holders rights similar to owning shares or bonds?\nLoại token nào trao cho người nắm giữ quyền lợi tương tự việc sở hữu cổ phiếu hoặc trái phiếu?","options":[{"id":"BC260-Q001-A","text":"Non-fungible token\nToken không thể thay thế (NFT)"},{"id":"BC260-Q001-B","text":"Security token\nToken chứng khoán"},{"id":"BC260-Q001-C","text":"Stablecoin\nĐồng tiền ổn định giá"},{"id":"BC260-Q001-D","text":"Utility token\nToken tiện ích"}],"correctOptionId":"BC260-Q001-B","explanation":"Explanation (EN): A security token can represent investment rights such as equity interests, profit participation, or debt claims. An NFT identifies a distinct asset, a stablecoin targets price stability, and a utility token grants access to a service.\nGiải thích (VI): Security token là token đại diện cho quyền lợi mang tính đầu tư, có thể gắn với cổ phần, quyền hưởng lợi nhuận hoặc công cụ nợ tương tự trái phiếu. NFT chủ yếu biểu thị tài sản riêng biệt; stablecoin hướng đến ổn định giá; utility token chủ yếu cho quyền dùng sản phẩm hoặc dịch vụ.\n\nPhân tích từng đáp án:\n✗ A SAI. NFT chứng nhận tính độc nhất, không mặc định trao quyền giống cổ phiếu hoặc trái phiếu.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Token chứng khoán.\n✗ C SAI. Stablecoin nhắm giữ ổn định giá, không phải quyền sở hữu doanh nghiệp.\n✗ D SAI. Utility token cho quyền dùng dịch vụ, không mặc định là chứng khoán.","source":"Bộ đề Blockchain - Câu gốc 1/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q002","chapter":3,"number":2,"question":"How is the transaction fee in a Bitcoin transaction determined?\nPhí giao dịch Bitcoin được xác định như thế nào?","options":[{"id":"BC260-Q002-A","text":"A fixed fee set by the central bank\nPhí cố định do ngân hàng trung ương quy định"},{"id":"BC260-Q002-B","text":"Total inputs minus total outputs\nTổng đầu vào trừ tổng đầu ra"},{"id":"BC260-Q002-C","text":"Total outputs minus total inputs\nTổng đầu ra trừ tổng đầu vào"},{"id":"BC260-Q002-D","text":"1% of the amount sent\n1% số tiền gửi"}],"correctOptionId":"BC260-Q002-B","explanation":"Explanation (EN): In Bitcoin's UTXO model, the transaction fee equals the sum of input values minus the sum of output values. It is not a statutory percentage or a central-bank charge.\nGiải thích (VI): Phí giao dịch Bitcoin trong mô hình UTXO bằng tổng giá trị các đầu vào trừ tổng giá trị các đầu ra. Chênh lệch này được trả cho thợ đào, không do ngân hàng trung ương ấn định.\n\nPhân tích từng đáp án:\n✗ A SAI. Mạng Bitcoin không có ngân hàng trung ương định phí bắt buộc.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Tổng đầu vào trừ tổng đầu ra.\n✗ C SAI. Công thức trừ ngược sẽ cho giá trị âm khi đầu vào lớn hơn đầu ra.\n✗ D SAI. Không có quy tắc phí cố định bằng 1% số tiền gửi.","source":"Bộ đề Blockchain - Câu gốc 2/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q003","chapter":1,"number":3,"question":"What does 'independent verification' mean in the Bitcoin network?\n“Xác minh độc lập” trong mạng Bitcoin có nghĩa là gì?","options":[{"id":"BC260-Q003-A","text":"Miners verify only their own transactions\nThợ đào chỉ xác minh giao dịch của chính họ"},{"id":"BC260-Q003-B","text":"Banks verify transactions for their clients\nNgân hàng xác minh giao dịch cho khách hàng"},{"id":"BC260-Q003-C","text":"Each full node checks every transaction itself\nMỗi full node tự kiểm tra mọi giao dịch"},{"id":"BC260-Q003-D","text":"A single auditor verifies all blocks\nMột kiểm toán viên xác minh tất cả khối"}],"correctOptionId":"BC260-Q003-C","explanation":"Explanation (EN): An independently verifying full node checks transactions and blocks against the protocol's rules instead of relying on miners, banks, or one auditor. This is central to trust minimization.\nGiải thích (VI): Xác minh độc lập nghĩa là full node tự kiểm tra chữ ký, UTXO và quy tắc đồng thuận thay vì mặc nhiên tin một ngân hàng, kiểm toán viên hay thợ đào khác.\n\nPhân tích từng đáp án:\n✗ A SAI. Nút xác minh cả giao dịch của người khác, không chỉ giao dịch mình.\n✗ B SAI. Bitcoin không nhờ ngân hàng làm bên xác minh bắt buộc.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Mỗi full node tự kiểm tra mọi giao dịch.\n✗ D SAI. Không có kiểm toán viên duy nhất kiểm tra tất cả khối.","source":"Bộ đề Blockchain - Câu gốc 3/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q004","chapter":1,"number":4,"question":"Why are hash functions essential to blockchain security?\nTại sao hàm băm lại thiết yếu đối với bảo mật blockchain?","options":[{"id":"BC260-Q004-A","text":"They store user identities securelY\nChúng lưu an toàn danh tính người dùng"},{"id":"BC260-Q004-B","text":"They make transactions reversible\nChúng khiến giao dịch có thể đảo ngược"},{"id":"BC260-Q004-C","text":"They allow lost private keys to be recovered\nChúng cho phép khôi phục khóa riêng bị mất"},{"id":"BC260-Q004-D","text":"They make any change to data detectable\nChúng giúp phát hiện mọi thay đổi dữ liệu"}],"correctOptionId":"BC260-Q004-D","explanation":"Explanation (EN): A cryptographic hash produces a digest that changes when the input changes. This helps detect tampering; hashing does not recover lost keys or undo payments.\nGiải thích (VI): Hàm băm tạo dấu vân tay dữ liệu: chỉ cần thay đổi nhỏ ở đầu vào, giá trị băm có khả năng thay đổi rất lớn. Nhờ đó mạng có thể phát hiện dữ liệu bị sửa, chứ không dùng hash để khôi phục khóa bị mất.\n\nPhân tích từng đáp án:\n✗ A SAI. Hash không phải cơ sở dữ liệu định danh.\n✗ B SAI. Hash không giúp đảo ngược giao dịch đã xác nhận.\n✗ C SAI. Hash không thể khôi phục khóa riêng bí mật.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Chúng giúp phát hiện mọi thay đổi dữ liệu.","source":"Bộ đề Blockchain - Câu gốc 4/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q005","chapter":4,"number":5,"question":"Which category of token gives holders access to a product or service on a platform?\nLoại token nào cho phép người nắm giữ truy cập sản phẩm hoặc dịch vụ trên một nền tảng?","options":[{"id":"BC260-Q005-A","text":"Utility token\nToken tiện ích"},{"id":"BC260-Q005-B","text":"Security token\nToken chứng khoán"},{"id":"BC260-Q005-C","text":"Fiat-backed stablecoin\nStablecoin được bảo đảm bằng tiền pháp định"},{"id":"BC260-Q005-D","text":"Central bank digital currencY\nTiền kỹ thuật số ngân hàng trung ương"}],"correctOptionId":"BC260-Q005-A","explanation":"Explanation (EN): Utility tokens provide rights to use a platform's products or services. They should not be confused with investment-right tokens, currency-pegged stablecoins, or a CBDC.\nGiải thích (VI): Utility token cung cấp quyền sử dụng sản phẩm hoặc dịch vụ trên nền tảng. Nó khác security token gắn với quyền đầu tư và stablecoin hướng tới ổn định giá.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Token tiện ích.\n✗ B SAI. Security token tập trung vào quyền lợi đầu tư.\n✗ C SAI. Stablecoin dùng để duy trì giá tham chiếu.\n✗ D SAI. CBDC là tiền số của ngân hàng trung ương.","source":"Bộ đề Blockchain - Câu gốc 5/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q006","chapter":4,"number":6,"question":"A business wants to pay overseas suppliers in crypto without exposure to large price swings. Which asset suits best?\nMột doanh nghiệp muốn trả tiền mã hóa cho nhà cung cấp nước ngoài nhưng tránh biến động giá lớn. Tài sản nào phù hợp nhất?","options":[{"id":"BC260-Q006-A","text":"A newly launched altcoin\nAltcoin mới ra mắt"},{"id":"BC260-Q006-B","text":"A fiat-backed stablecoin\nStablecoin được bảo đảm bằng tiền pháp định"},{"id":"BC260-Q006-C","text":"Bitcoin\nBitcoin"},{"id":"BC260-Q006-D","text":"An NFT\nNFT"}],"correctOptionId":"BC260-Q006-B","explanation":"Explanation (EN): A fiat-backed stablecoin targets a value close to the referenced currency, making it more useful for reducing price volatility than Bitcoin, speculative altcoins, or NFTs. Peg and reserve risks still remain.\nGiải thích (VI): Doanh nghiệp muốn hạn chế biến động tỷ giá crypto thường chọn stablecoin được bảo chứng bằng tiền pháp định. Cần nhớ stablecoin vẫn có rủi ro dự trữ và mất neo giá, không phải bảo đảm tuyệt đối.\n\nPhân tích từng đáp án:\n✗ A SAI. Altcoin mới thường có biến động lớn.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Stablecoin được bảo đảm bằng tiền pháp định.\n✗ C SAI. Bitcoin biến động giá đáng kể.\n✗ D SAI. NFT không nhằm duy trì giá trị ổn định để thanh toán.","source":"Bộ đề Blockchain - Câu gốc 6/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q007","chapter":1,"number":7,"question":"Why is Bitcoin often described as resistant to inflation?\nVì sao Bitcoin thường được cho là có khả năng chống lạm phát?","options":[{"id":"BC260-Q007-A","text":"Its price never changes on any exchange\nGiá của nó không bao giờ thay đổi trên bất kỳ sàn nào"},{"id":"BC260-Q007-B","text":"It is backed by gold reserves\nĐược bảo đảm bằng dự trữ vàng"},{"id":"BC260-Q007-C","text":"Its supply is capped and issuance declines\nNguồn cung có giới hạn và lượng phát hành giảm dần"},{"id":"BC260-Q007-D","text":"A central bank controls its supply\nNgân hàng trung ương kiểm soát nguồn cung"}],"correctOptionId":"BC260-Q007-C","explanation":"Explanation (EN): Bitcoin has a protocol-defined supply limit and a declining issuance schedule. That constrains monetary issuance, but its market price can still fluctuate greatly.\nGiải thích (VI): Bitcoin có lịch phát hành theo giao thức và mức cung tối đa khoảng 21 triệu BTC; phần thưởng khối định kỳ giảm một nửa. Điều này không có nghĩa giá BTC không biến động hoặc chỉ số giá hàng hóa luôn giảm.\n\nPhân tích từng đáp án:\n✗ A SAI. Giá thị trường Bitcoin vẫn biến động.\n✗ B SAI. Bitcoin không có dự trữ vàng bảo chứng.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Nguồn cung có giới hạn và lượng phát hành giảm dần.\n✗ D SAI. Không có ngân hàng trung ương điều chỉnh nguồn cung Bitcoin.","source":"Bộ đề Blockchain - Câu gốc 7/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q008","chapter":4,"number":8,"question":"What is a non-fungible token (NFT)?\nToken không thể thay thế (NFT) là gì?","options":[{"id":"BC260-Q008-A","text":"A stablecoin that can be exchanged one- for-one\nStablecoin có thể đổi ngang nhau theo tỷ lệ một đổi một"},{"id":"BC260-Q008-B","text":"A unique token showing ownership of a specific item\nToken độc nhất chứng minh quyền sở hữu một tài sản cụ thể"},{"id":"BC260-Q008-C","text":"A token that represents a share in a bank\nToken đại diện cổ phần trong một ngân hàng"},{"id":"BC260-Q008-D","text":"A type of mining hardware\nMột loại thiết bị đào"}],"correctOptionId":"BC260-Q008-B","explanation":"Explanation (EN): An NFT is a distinctive token that can identify a specific digital or other asset. It is not interchangeable in the same way as identical units of a fungible stablecoin.\nGiải thích (VI): NFT đại diện cho một đơn vị token riêng biệt, không có tính thay thế một-một như các đơn vị tiền cùng loại. Công dụng thường liên quan tới nhận diện hoặc quyền gắn với một tài sản cụ thể.\n\nPhân tích từng đáp án:\n✗ A SAI. Stablecoin là tài sản đồng nhất theo đơn vị, khác NFT độc nhất.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Token độc nhất chứng minh quyền sở hữu một tài sản cụ thể.\n✗ C SAI. Cổ phần hóa khoản đầu tư gần với token chứng khoán.\n✗ D SAI. Thiết bị đào không phải loại token.","source":"Bộ đề Blockchain - Câu gốc 8/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q009","chapter":2,"number":9,"question":"How does a digital signature prove that a transaction was authorized by the owner?\nChữ ký số chứng minh giao dịch được chủ sở hữu cho phép như thế nào?","options":[{"id":"BC260-Q009-A","text":"It shows the owner's name to all nodes\nHiện tên chủ sở hữu cho mọi nút"},{"id":"BC260-Q009-B","text":"It contains the owner's password in encrypted form\nChứa mật khẩu chủ sở hữu ở dạng mã hóa"},{"id":"BC260-Q009-C","text":"Anyone can check it using the owner's public key\nBất kỳ ai cũng có thể dùng khóa công khai của chủ sở hữu để kiểm tra"},{"id":"BC260-Q009-D","text":"It is approved by a certification bank\nĐược ngân hàng chứng nhận phê duyệt"}],"correctOptionId":"BC260-Q009-C","explanation":"Explanation (EN): The holder signs transaction data using a private key; other nodes verify the signature with the corresponding public key. The cryptographic proof does not display a legal name.\nGiải thích (VI): Chủ sở hữu dùng private key ký thông điệp giao dịch; các nút có thể dùng public key tương ứng xác minh chữ ký. Không cần công bố mật khẩu hay tên thật.\n\nPhân tích từng đáp án:\n✗ A SAI. Chữ ký số không công khai tên pháp lý của chủ khóa.\n✗ B SAI. Chữ ký không chứa mật khẩu của chủ.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Bất kỳ ai cũng có thể dùng khóa công khai của chủ sở hữu để kiểm tra.\n✗ D SAI. Không cần ngân hàng chứng nhận phê duyệt giao dịch Bitcoin.","source":"Bộ đề Blockchain - Câu gốc 9/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q010","chapter":3,"number":10,"question":"An attacker modifies a transaction in Block 100 of a chain of 120 blocks. What must they do for the change to go unnoticed?\nKẻ tấn công sửa giao dịch tại khối 100 trong chuỗi 120 khối. Họ phải làm gì để thay đổi không bị phát hiện?","options":[{"id":"BC260-Q010-A","text":"Delete the genesis block and restart the chain\nXóa khối genesis và khởi tạo lại chuỗi"},{"id":"BC260-Q010-B","text":"Change only Block 100's timestamp to an earlier time\nChỉ đổi dấu thời gian khối 100 về sớm hơn"},{"id":"BC260-Q010-C","text":"Ask one trusted node to accept the change on behalf of all nodes\nNhờ một nút đáng tin chấp nhận thay cho mọi nút"},{"id":"BC260-Q010-D","text":"Recompute Block 100 and all 20 later blocks faster than the network\nTính lại khối 100 và cả 20 khối sau nhanh hơn cả mạng"}],"correctOptionId":"BC260-Q010-D","explanation":"Explanation (EN): Changing an old transaction changes the Merkle root and block hash, breaking the links to later blocks. The attacker would need to redo the affected work and catch up with the honest chain; this is prohibitively hard under normal assumptions.\nGiải thích (VI): Đổi giao dịch trong khối cũ làm đổi Merkle root và hash khối, khiến các liên kết phía sau không còn khớp. Kẻ tấn công phải tái tính toán phần việc khối đó và các khối kế tiếp, đồng thời cạnh tranh với chuỗi hợp lệ.\n\nPhân tích từng đáp án:\n✗ A SAI. Không cần xóa genesis và cũng không đủ để thay dữ liệu cũ.\n✗ B SAI. Sửa timestamp không làm Merkle root khớp trở lại.\n✗ C SAI. Một nút không thay thế quy tắc xác minh của cả mạng.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Tính lại khối 100 và cả 20 khối sau nhanh hơn cả mạng.","source":"Bộ đề Blockchain - Câu gốc 10/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q011","chapter":1,"number":11,"question":"Why is the Bitcoin ledger described as transparent?\nVì sao sổ cái Bitcoin được mô tả là minh bạch?","options":[{"id":"BC260-Q011-A","text":"Anyone can view every confirmed transaction\nBất kỳ ai đều xem được giao dịch đã xác nhận"},{"id":"BC260-Q011-B","text":"Users can edit their own past transactions\nNgười dùng có thể sửa giao dịch cũ của mình"},{"id":"BC260-Q011-C","text":"Only regulators can see the transactions\nChỉ cơ quan quản lý xem được giao dịch"},{"id":"BC260-Q011-D","text":"It displays users' real names\nHiển thị tên thật của người dùng"}],"correctOptionId":"BC260-Q011-A","explanation":"Explanation (EN): Bitcoin's public ledger lets observers inspect confirmed transactions and addresses. Transparency does not mean identities are automatically exposed or that users can rewrite confirmed records.\nGiải thích (VI): Blockchain Bitcoin công khai dữ liệu giao dịch đã xác nhận cho người có thể truy cập mạng. Tính minh bạch không đồng nghĩa mọi địa chỉ công khai tên thật, cũng không cho phép tùy ý sửa lịch sử.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Bất kỳ ai đều xem được giao dịch đã xác nhận.\n✗ B SAI. Giao dịch đã xác nhận không được tùy tiện sửa.\n✗ C SAI. Dữ liệu công khai cho nhiều người, không chỉ cơ quan quản lý.\n✗ D SAI. Địa chỉ thường không hiển thị tên thật.","source":"Bộ đề Blockchain - Câu gốc 11/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q012","chapter":1,"number":12,"question":"What does a hash function produce from input data of any size?\nHàm băm tạo ra loại đầu ra gì từ dữ liệu đầu vào có độ dài bất kỳ?","options":[{"id":"BC260-Q012-A","text":"A variable-length copy of the input\nBản sao đầu vào có độ dài thay đổi"},{"id":"BC260-Q012-B","text":"An encrypted file that can be decrypted with a key\nTệp được mã hóa có thể giải bằng khóa"},{"id":"BC260-Q012-C","text":"A random number unrelated to the input\nSố ngẫu nhiên không liên quan đầu vào"},{"id":"BC260-Q012-D","text":"A fixed-length output called a hash or digest\nĐầu ra độ dài cố định gọi là hash hay digest"}],"correctOptionId":"BC260-Q012-D","explanation":"Explanation (EN): A hash function maps variable-length input to a fixed-length digest. A hash is not an encrypted copy that can be decrypted to reveal the input.\nGiải thích (VI): Hàm băm ánh xạ dữ liệu đầu vào kích thước bất kỳ thành một thông điệp băm có độ dài cố định. Hash không phải bản sao đầu vào và không thể giải mã như bản mã đối xứng.\n\nPhân tích từng đáp án:\n✗ A SAI. Hash không sao chép nguyên văn đầu vào.\n✗ B SAI. Mã hóa đảo được bằng khóa là cơ chế khác với băm.\n✗ C SAI. Hash là kết quả xác định từ đầu vào chứ không phải số ngẫu nhiên độc lập.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Đầu ra độ dài cố định gọi là hash hay digest.","source":"Bộ đề Blockchain - Câu gốc 12/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q013","chapter":1,"number":13,"question":"What type of network structure does Bitcoin use?\nBitcoin sử dụng cấu trúc mạng nào?","options":[{"id":"BC260-Q013-A","text":"Star network with a central hub\nMạng hình sao với nút trung tâm"},{"id":"BC260-Q013-B","text":"Hub- and-spoke\nMạng trung tâm và nhánh"},{"id":"BC260-Q013-C","text":"Peer-to-peer\nMạng ngang hàng P2P"},{"id":"BC260-Q013-D","text":"Client-server\nMạng máy khách–máy chủ"}],"correctOptionId":"BC260-Q013-C","explanation":"Explanation (EN): Bitcoin runs on a peer-to-peer network in which nodes exchange transactions and blocks directly. It does not rely on one central payment server.\nGiải thích (VI): Bitcoin vận hành theo mạng ngang hàng (peer-to-peer, P2P), các nút trao đổi và xác minh dữ liệu theo quy tắc chung. Không có máy chủ ngân hàng trung tâm điều hành sổ cái.\n\nPhân tích từng đáp án:\n✗ A SAI. Mạng hình sao đòi hỏi hub trung tâm.\n✗ B SAI. Hub-and-spoke vẫn dựa vào hub.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Mạng ngang hàng P2P.\n✗ D SAI. Client-server dựa vào máy chủ cung cấp dịch vụ.","source":"Bộ đề Blockchain - Câu gốc 13/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q014","chapter":1,"number":14,"question":"An investor buys a token only because its price rose quickly last week. Which risk does this illustrate?\nNhà đầu tư mua token chỉ vì giá tăng mạnh tuần trước. Đây là ví dụ về rủi ro gì?","options":[{"id":"BC260-Q014-A","text":"Speculative risk similar to gambling\nRủi ro đầu cơ gần giống đánh bạc"},{"id":"BC260-Q014-B","text":"Currency risk on cash holdings\nRủi ro tiền tệ khi nắm giữ tiền mặt"},{"id":"BC260-Q014-C","text":"Credit risk on a government bond\nRủi ro tín dụng trái phiếu chính phủ"},{"id":"BC260-Q014-D","text":"Interest rate risk on bank deposits\nRủi ro lãi suất tiền gửi ngân hàng"}],"correctOptionId":"BC260-Q014-A","explanation":"Explanation (EN): Buying solely because the price recently surged is speculative behavior driven by momentum or fear of missing out. It differs from bond credit or deposit interest-rate risk.\nGiải thích (VI): Mua vì giá vừa tăng mà không xét giá trị hay rủi ro cho thấy hành vi đầu cơ theo đà, dễ chịu biến động mạnh. Đây không phải mặc nhiên là rủi ro lãi suất hay tín dụng trái phiếu.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Rủi ro đầu cơ gần giống đánh bạc.\n✗ B SAI. Rủi ro tiền tệ không giải thích hành vi đuổi theo giá token.\n✗ C SAI. Rủi ro tín dụng trái phiếu liên quan khả năng không trả nợ.\n✗ D SAI. Rủi ro lãi suất tiền gửi khác rủi ro đầu cơ theo đà.","source":"Bộ đề Blockchain - Câu gốc 14/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q015","chapter":1,"number":15,"question":"A government wishes to print more bitcoin to fund spending. What prevents this?\nMột chính phủ muốn in thêm Bitcoin để tài trợ chi tiêu. Điều gì ngăn cản họ?","options":[{"id":"BC260-Q015-A","text":"Exchanges refuse to list newly printed coins\nSàn từ chối niêm yết coin mới in"},{"id":"BC260-Q015-B","text":"Bitcoin can only be printed by the US Federal Reserve\nChỉ Cục Dự trữ Liên bang Mỹ được in Bitcoin"},{"id":"BC260-Q015-C","text":"The Bitcoin Foundation must approve all issuance\nQuỹ Bitcoin phải phê duyệt mọi lần phát hành"},{"id":"BC260-Q015-D","text":"Protocol rules fix supply, and nodes reject extra coins\nGiao thức giới hạn nguồn cung, nút từ chối coin vượt mức"}],"correctOptionId":"BC260-Q015-D","explanation":"Explanation (EN): A government's desire to issue extra bitcoin cannot override consensus rules. Validating nodes reject blocks that create more coins than permitted by the protocol.\nGiải thích (VI): Không chính phủ nào chỉ việc 'in' thêm BTC hợp lệ theo ý mình: full node áp dụng giới hạn phát hành của quy tắc Bitcoin. Khối tạo quá số BTC cho phép bị coi là không hợp lệ.\n\nPhân tích từng đáp án:\n✗ A SAI. Sàn không có quyền quyết định coin nào hợp lệ trong sổ cái Bitcoin.\n✗ B SAI. Fed không phát hành Bitcoin.\n✗ C SAI. Bitcoin Foundation không nắm quyền phê duyệt phát hành.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Giao thức giới hạn nguồn cung, nút từ chối coin vượt mức.","source":"Bộ đề Blockchain - Câu gốc 15/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q016","chapter":4,"number":16,"question":"What is an altcoin?\nAltcoin là gì?","options":[{"id":"BC260-Q016-A","text":"A paper certificate of bitcoin owners hip\nGiấy chứng nhận quyền sở hữu Bitcoin"},{"id":"BC260-Q016-B","text":"A stablecoin issued by a central bank\nStablecoin do ngân hàng trung ương phát hành"},{"id":"BC260-Q016-C","text":"Any cryptocurrency other than Bitcoin\nBất kỳ tiền mã hóa nào ngoài Bitcoin"},{"id":"BC260-Q016-D","text":"A token used only for mining\nToken chỉ dùng để đào"}],"correctOptionId":"BC260-Q016-C","explanation":"Explanation (EN): An altcoin is a cryptocurrency other than Bitcoin. The term includes many different designs and does not automatically mean a stablecoin or CBDC.\nGiải thích (VI): Altcoin là tên chung của tiền mã hóa khác Bitcoin. Không nên đồng nhất altcoin với CBDC, thiết bị đào hay chỉ stablecoin.\n\nPhân tích từng đáp án:\n✗ A SAI. Giấy chứng nhận giấy không phải crypto khác Bitcoin.\n✗ B SAI. CBDC do ngân hàng trung ương khác altcoin.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Bất kỳ tiền mã hóa nào ngoài Bitcoin.\n✗ D SAI. Altcoin có nhiều chức năng, không chỉ phục vụ đào.","source":"Bộ đề Blockchain - Câu gốc 16/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q017","chapter":2,"number":17,"question":"Why does Bitcoin adjust mining difficulty when total computing power rises?\nTại sao Bitcoin điều chỉnh độ khó đào khi tổng sức mạnh tính toán tăng?","options":[{"id":"BC260-Q017-A","text":"To make transactions cheaper for users\nLàm giao dịch rẻ hơn"},{"id":"BC260-Q017-B","text":"To keep the average block time near 10 minutes\nGiữ thời gian khối trung bình gần 10 phút"},{"id":"BC260-Q017-C","text":"To reduce the number of nodes on the network\nGiảm số nút trong mạng"},{"id":"BC260-Q017-D","text":"To increase the reward for miners\nTăng thưởng cho thợ đào"}],"correctOptionId":"BC260-Q017-B","explanation":"Explanation (EN): Bitcoin adjusts Proof-of-Work difficulty so blocks continue to arrive roughly every ten minutes despite changes in network hash power. Difficulty is not a fee or reward setting.\nGiải thích (VI): Khi tổng hashrate tăng, giao thức điều chỉnh độ khó nhằm duy trì thời gian tạo khối trung bình gần 10 phút trong dài hạn. Tăng sức mạnh đào không tự làm phần thưởng mỗi khối tăng.\n\nPhân tích từng đáp án:\n✗ A SAI. Độ khó không được điều chỉnh để giảm phí người dùng.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Giữ thời gian khối trung bình gần 10 phút.\n✗ C SAI. Mục tiêu không phải giảm số nút.\n✗ D SAI. Phần thưởng được xác định bởi giao thức và phí, không theo độ khó.","source":"Bộ đề Blockchain - Câu gốc 17/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q018","chapter":2,"number":18,"question":"What is a commonly cited advantage of Proof of Stake over Proof of Work?\nLợi thế thường được nhắc đến của Proof of Stake so với Proof of Work là gì?","options":[{"id":"BC260-Q018-A","text":"Much lower energy consumption\nTiêu thụ điện thấp hơn nhiều"},{"id":"BC260-Q018-B","text":"Complete removal of all fees\nLoại bỏ hoàn toàn mọi khoản phí"},{"id":"BC260-Q018-C","text":"Guaranteed fixed coin prices\nBảo đảm giá coin cố định"},{"id":"BC260-Q018-D","text":"No need for any validators\nKhông cần bất kỳ validator nào"}],"correctOptionId":"BC260-Q018-A","explanation":"Explanation (EN): Proof of Stake normally avoids Bitcoin-style energy-intensive hash competition. However, it still needs validators, can involve fees, and cannot guarantee a token's price.\nGiải thích (VI): Proof of Stake chọn người xác thực dựa trên cơ chế stake thay vì bắt buộc cạnh tranh tiêu thụ điện như Proof of Work; lợi thế thường là tiết kiệm năng lượng. PoS vẫn cần validator và vẫn có phí mạng.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Tiêu thụ điện thấp hơn nhiều.\n✗ B SAI. PoS vẫn có phí mạng.\n✗ C SAI. PoS không cố định giá token.\n✗ D SAI. PoS phải có cơ chế validator tham gia.","source":"Bộ đề Blockchain - Câu gốc 18/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q019","chapter":1,"number":19,"question":"Why do many wallets generate a new address for each payment received?\nTại sao nhiều ví tạo địa chỉ nhận tiền mới cho mỗi khoản thanh toán?","options":[{"id":"BC260-Q019-A","text":"Because each address can hold only one bitcoin\nVì mỗi địa chỉ chỉ chứa tối đa một Bitcoin"},{"id":"BC260-Q019-B","text":"To improve privacy by making payments harder to link\nTăng quyền riêng tư, khó liên kết các khoản thanh toán"},{"id":"BC260-Q019-C","text":"Because addresses expire after 24 hours\nVì địa chỉ hết hạn sau 24 giờ"},{"id":"BC260-Q019-D","text":"To avoid paying any transaction fee\nĐể khỏi phải trả phí giao dịch"}],"correctOptionId":"BC260-Q019-B","explanation":"Explanation (EN): Using a fresh receiving address reduces obvious public links between payments. It improves privacy but does not make Bitcoin perfectly anonymous.\nGiải thích (VI): Ví tạo địa chỉ nhận mới giúp hạn chế việc liên kết nhiều giao dịch vào cùng một địa chỉ khi phân tích blockchain. Đây là biện pháp tăng riêng tư, không khiến lịch sử giao dịch biến mất.\n\nPhân tích từng đáp án:\n✗ A SAI. Một địa chỉ không bị giới hạn đúng một Bitcoin.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Tăng quyền riêng tư, khó liên kết các khoản thanh toán.\n✗ C SAI. Địa chỉ không tự hết hạn mỗi 24 giờ.\n✗ D SAI. Việc đổi địa chỉ không miễn phí mạng.","source":"Bộ đề Blockchain - Câu gốc 19/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q020","chapter":3,"number":20,"question":"Why are Bitcoin miners required to spend real resources such as electricity?\nVì sao thợ đào Bitcoin phải tiêu tốn tài nguyên thật như điện năng?","options":[{"id":"BC260-Q020-A","text":"The cost makes cheating expensive and protects the ledger\nChi phí khiến gian lận trở nên đắt đỏ và bảo vệ sổ cái"},{"id":"BC260-Q020-B","text":"It lowers the price of bitcoin for all users\nHạ giá Bitcoin cho mọi người"},{"id":"BC260-Q020-C","text":"Regulators charge every miner a special energy tax\nCơ quan quản lý thu thuế điện đặc biệt từ mọi thợ đào"},{"id":"BC260-Q020-D","text":"Electricity is needed to store bitcoin in wallets\nCần điện để cất Bitcoin trong ví"}],"correctOptionId":"BC260-Q020-A","explanation":"Explanation (EN): Proof of Work requires costly computation and electricity, making attacks on the transaction history expensive. Electricity does not physically store coins or establish their market price.\nGiải thích (VI): Trong Proof of Work, chi phí phần cứng và điện khiến việc gian lận hay viết lại lịch sử tốn kém, tạo động cơ kinh tế để tuân thủ quy tắc. Điện không phải cách lưu bitcoin trong ví.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Chi phí khiến gian lận trở nên đắt đỏ và bảo vệ sổ cái.\n✗ B SAI. Điện năng không trực tiếp quyết định giá giao dịch.\n✗ C SAI. Không phải mọi nước áp dụng thuế điện đặc biệt như mô tả.\n✗ D SAI. Coin nằm trên sổ cái, không cất bằng điện.","source":"Bộ đề Blockchain - Câu gốc 20/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q021","chapter":4,"number":21,"question":"Why does the quality of reserves matter for a fiat-backed stablecoin?\nTại sao chất lượng dự trữ quan trọng đối với stablecoin được bảo đảm bằng tiền pháp định?","options":[{"id":"BC260-Q021-A","text":"It sets the number of nodes in the network\nQuyết định số nút trong mạng"},{"id":"BC260-Q021-B","text":"It determines how fast blocks are mined\nQuyết định tốc độ đào khối"},{"id":"BC260-Q021-C","text":"Holders rely on reserves to redeem at par\nNgười giữ coin trông vào dự trữ để quy đổi ngang giá"},{"id":"BC260-Q021-D","text":"It decides the coin's hashing algorithm\nQuyết định thuật toán băm của coin"}],"correctOptionId":"BC260-Q021-C","explanation":"Explanation (EN): Fiat-backed stablecoin holders depend on sufficient and liquid reserves to support redemption near the pegged value. Poor reserves can undermine the peg.\nGiải thích (VI): Fiat-backed stablecoin dựa vào tài sản dự trữ có chất lượng và tính thanh khoản đủ để đáp ứng nhu cầu đổi tiền. Dự trữ yếu khiến người nắm giữ khó tin vào khả năng duy trì tỷ giá neo.\n\nPhân tích từng đáp án:\n✗ A SAI. Số nút không được quyết định bởi tài sản dự trữ.\n✗ B SAI. Khai thác khối không do dự trữ stablecoin điều khiển.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Người giữ coin trông vào dự trữ để quy đổi ngang giá.\n✗ D SAI. Thuật toán băm không được quyết định bởi chất lượng dự trữ.","source":"Bộ đề Blockchain - Câu gốc 21/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q022","chapter":4,"number":22,"question":"How does an algorithmic stablecoin differ from an asset- backed one?\nStablecoin thuật toán khác stablecoin được bảo đảm bằng tài sản ở điểm nào?","options":[{"id":"BC260-Q022-A","text":"It is issued and guaranteed by a central bank\nĐược ngân hàng trung ương phát hành và bảo lãnh"},{"id":"BC260-Q022-B","text":"It adjusts supply by rules instead of reserves\nĐiều chỉnh nguồn cung theo quy tắc thay vì dự trữ"},{"id":"BC260-Q022-C","text":"It cannot be traded on any exchange\nKhông giao dịch được trên bất kỳ sàn nào"},{"id":"BC260-Q022-D","text":"It is backed by gold stored in vaults\nĐược bảo đảm bằng vàng trong kho"}],"correctOptionId":"BC260-Q022-B","explanation":"Explanation (EN): An algorithmic stablecoin relies chiefly on programmed supply and incentive adjustments to seek a peg rather than redemption against matching reserves. Such mechanisms can fail in a crisis.\nGiải thích (VI): Algorithmic stablecoin chủ yếu dùng cơ chế điều chỉnh cung hoặc động lực thị trường để giữ neo, không dựa trực tiếp vào dự trữ đủ giá trị như stablecoin thế chấp. Mô hình này dễ rơi vào vòng xoáy mất niềm tin khi cầu sụt mạnh.\n\nPhân tích từng đáp án:\n✗ A SAI. Stablecoin thuật toán thường không do ngân hàng trung ương bảo lãnh.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Điều chỉnh nguồn cung theo quy tắc thay vì dự trữ.\n✗ C SAI. Stablecoin thuật toán vẫn có thể được giao dịch.\n✗ D SAI. Bảo đảm bằng vàng là dạng tài sản bảo chứng, không phải cơ chế thuần thuật toán.","source":"Bộ đề Blockchain - Câu gốc 22/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q023","chapter":1,"number":23,"question":"Bob receives a signed message claiming to be from Alice. What should Bob use to verify the signature?\nBob nhận tin nhắn có chữ ký được cho là của Alice. Bob dùng gì để kiểm tra chữ ký?","options":[{"id":"BC260-Q023-A","text":"Alice's private key\nKhóa riêng của Alice"},{"id":"BC260-Q023-B","text":"The miner's public key\nKhóa công khai của thợ đào"},{"id":"BC260-Q023-C","text":"Bob's private key\nKhóa riêng của Bob"},{"id":"BC260-Q023-D","text":"Alice's public key\nKhóa công khai của Alice"}],"correctOptionId":"BC260-Q023-D","explanation":"Explanation (EN): Bob verifies Alice's signature using Alice's public key. Neither Bob's private key nor a miner's key establishes whether Alice authorized the message.\nGiải thích (VI): Người nhận xác minh chữ ký bằng public key của người ký, tức Alice. Private key của Alice tuyệt đối không được gửi cho Bob.\n\nPhân tích từng đáp án:\n✗ A SAI. Khóa riêng của Alice phải giữ bí mật và chỉ để ký.\n✗ B SAI. Khóa công khai thợ đào không chứng minh Alice ký.\n✗ C SAI. Khóa riêng của Bob không dùng xác minh chữ ký của Alice.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Khóa công khai của Alice.","source":"Bộ đề Blockchain - Câu gốc 23/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q024","chapter":1,"number":24,"question":"Two banks find that their records of the same interbank transfer do not match. Which ledger design would most reduce this problem?\nHai ngân hàng có số liệu khác nhau về cùng một giao dịch liên ngân hàng. Thiết kế sổ cái nào giảm vấn đề này tốt nhất?","options":[{"id":"BC260-Q024-A","text":"Two separate ledgers that are checked against each other yearly\nHai sổ cái riêng được so sánh mỗi năm"},{"id":"BC260-Q024-B","text":"A shared ledger both banks see and update in sync\nMột sổ cái chung hai ngân hàng xem và cập nhật đồng bộ"},{"id":"BC260-Q024-C","text":"A spreadsheet stored on one bank's server\nBảng tính trên máy chủ một ngân hàng"},{"id":"BC260-Q024-D","text":"A paper ledger kept by the sending bank\nSổ giấy do ngân hàng gửi giữ"}],"correctOptionId":"BC260-Q024-B","explanation":"Explanation (EN): A shared, synchronized ledger gives both banks one consistent view of the transfer. Separate records require recurring reconciliation and can disagree.\nGiải thích (VI): Một sổ cái dùng chung, được đồng bộ và xác minh giữa hai ngân hàng, giảm tình trạng số liệu không khớp phải đối soát nhiều lần. Hai bản ghi biệt lập chỉ làm phát sinh thêm chi phí hòa giải.\n\nPhân tích từng đáp án:\n✗ A SAI. Hai sổ riêng vẫn cần đối chiếu và có thể lệch nhau.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Một sổ cái chung hai ngân hàng xem và cập nhật đồng bộ.\n✗ C SAI. Chỉ dùng bảng tính tại một ngân hàng không bảo đảm hai bên đồng bộ.\n✗ D SAI. Sổ giấy một phía không cho hai ngân hàng cùng xác minh bản ghi.","source":"Bộ đề Blockchain - Câu gốc 24/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q025","chapter":1,"number":25,"question":"A company's central database is attacked and all records become unavailable. Which property of a distributed ledger would have helped most?\nCơ sở dữ liệu tập trung của công ty bị tấn công và không truy cập được mọi bản ghi. Đặc tính nào của sổ cái phân tán có thể giúp nhất?","options":[{"id":"BC260-Q025-A","text":"Copies of the ledger are kept by many nodes\nNhiều nút lưu bản sao sổ cái"},{"id":"BC260-Q025-B","text":"Only administrators can read the ledger\nChỉ quản trị viên được đọc sổ cái"},{"id":"BC260-Q025-C","text":"The ledger deletes old records automatically\nSổ cái tự xóa dữ liệu cũ"},{"id":"BC260-Q025-D","text":"The ledger uses a single highly secure server\nChỉ dùng một máy chủ rất an toàn"}],"correctOptionId":"BC260-Q025-A","explanation":"Explanation (EN): Distributing copies across many nodes reduces dependence on a single database or server. An outage at one location need not destroy access to the shared record.\nGiải thích (VI): Distributed ledger có nhiều bản sao ở các nút, nên lỗi hay tấn công một máy không nhất thiết làm toàn bộ dữ liệu ngừng hoạt động. Đây là ưu thế chống điểm lỗi đơn.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Nhiều nút lưu bản sao sổ cái.\n✗ B SAI. Quyền đọc của quản trị viên không tạo khả năng dự phòng.\n✗ C SAI. Xóa dữ liệu cũ không làm hệ thống chịu lỗi tốt hơn.\n✗ D SAI. Máy chủ duy nhất vẫn là điểm lỗi đơn lẻ.","source":"Bộ đề Blockchain - Câu gốc 25/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q026","chapter":2,"number":26,"question":"Which consensus mechanism does Bitcoin use?\nBitcoin sử dụng cơ chế đồng thuận nào?","options":[{"id":"BC260-Q026-A","text":"Proof of Stake\nBằng chứng cổ phần (PoS)"},{"id":"BC260-Q026-B","text":"Proof of Work\nBằng chứng công việc (PoW)"},{"id":"BC260-Q026-C","text":"Proof of Authority\nBằng chứng thẩm quyền (PoA)"},{"id":"BC260-Q026-D","text":"Delegated Proof of Stake\nBằng chứng cổ phần ủy quyền (DPoS)"}],"correctOptionId":"BC260-Q026-B","explanation":"Explanation (EN): Bitcoin's consensus uses Proof of Work. Proof of Stake and authority-based mechanisms appear in other blockchain designs.\nGiải thích (VI): Bitcoin dùng Proof of Work (PoW) để lựa chọn khối và bảo vệ lịch sử chuỗi. Không nhầm với Proof of Stake là cơ chế Ethereum đang dùng.\n\nPhân tích từng đáp án:\n✗ A SAI. PoS không phải cơ chế đồng thuận của Bitcoin.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Bằng chứng công việc (PoW).\n✗ C SAI. PoA phù hợp một số mạng permissioned, không phải Bitcoin.\n✗ D SAI. DPoS không phải đồng thuận của Bitcoin.","source":"Bộ đề Blockchain - Câu gốc 26/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q027","chapter":1,"number":27,"question":"How does an append-only ledger differ from a traditional database?\nSổ cái chỉ-ghi-thêm khác cơ sở dữ liệu truyền thống như thế nào?","options":[{"id":"BC260-Q027-A","text":"It stores data only on one central server [cần đối chiếu ảnh gốc]\nChỉ lưu dữ liệu trên một máy chủ trung tâm [cần đối chiếu ảnh]"},{"id":"BC260-Q027-B","text":"It cannot store financial transactions\nKhông lưu được giao dịch tài chính"},{"id":"BC260-Q027-C","text":"Records can be added but not updated or deleted\nBản ghi chỉ được thêm, không sửa hoặc xóa"},{"id":"BC260-Q027-D","text":"It allows all users to delete any record\nCho phép mọi người xóa bất kỳ bản ghi"}],"correctOptionId":"BC260-Q027-C","explanation":"Explanation (EN): An append-only blockchain preserves historical entries and appends new records rather than allowing ordinary in-place editing or deletion. Corrections are represented as later entries.\nGiải thích (VI): Sổ cái append-only cho thêm bản ghi mới nhưng không sửa/xóa trực tiếp lịch sử đã xác nhận. Cơ chế này tạo khả năng kiểm toán và phát hiện thay đổi.\n\nPhân tích từng đáp án:\n✗ A SAI. Một máy chủ trung tâm trái với sổ cái phân tán; ảnh gốc còn cần đối chiếu.\n✗ B SAI. Blockchain lưu giao dịch tài chính được.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Bản ghi chỉ được thêm, không sửa hoặc xóa.\n✗ D SAI. Tự do xóa bản ghi trái nguyên tắc chỉ-ghi-thêm.\n\n⚠ Cần đối chiếu ảnh gốc: Một lựa chọn bị che hoặc có lỗi nhận dạng.","source":"Bộ đề Blockchain - Câu gốc 27/260","topic":"Overview of Blockchain","needsReview":true},{"id":"BC260-Q028","chapter":1,"number":28,"question":"Which value in the block header summarizes all transactions in the block?\nGiá trị nào trong phần đầu khối tóm tắt tất cả giao dịch trong khối?","options":[{"id":"BC260-Q028-A","text":"The Merkle root\nMerkle root (gốc Merkle)"},{"id":"BC260-Q028-B","text":"The block size\nKích thước khối"},{"id":"BC260-Q028-C","text":"The version\nPhiên bản"},{"id":"BC260-Q028-D","text":"The nonce\nNonce"}],"correctOptionId":"BC260-Q028-A","explanation":"Explanation (EN): The Merkle root summarizes transaction hashes inside the block header. The nonce, version and size fields have different functions.\nGiải thích (VI): Merkle root là giá trị băm tổng hợp tất cả giao dịch trong khối, nằm trong block header. Nonce phục vụ thử PoW, version chỉ phiên bản, block size là kích thước.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Merkle root (gốc Merkle).\n✗ B SAI. Kích thước khối không tóm tắt nội dung giao dịch bằng hash.\n✗ C SAI. Số phiên bản biểu thị quy tắc/định dạng.\n✗ D SAI. Nonce dùng để thử tìm hash hợp lệ trong PoW.","source":"Bộ đề Blockchain - Câu gốc 28/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q029","chapter":4,"number":29,"question":"What is a stablecoin?\nStablecoin là gì?","options":[{"id":"BC260-Q029-A","text":"A coin that can never be traded or transferred\nCoin không bao giờ được mua bán hay chuyển"},{"id":"BC260-Q029-B","text":"A coin whose price is fixed by its miners\nGiá coin được thợ đào cố định"},{"id":"BC260-Q029-C","text":"The digital currency issued by a central bank\nTiền số do ngân hàng trung ương phát hành"},{"id":"BC260-Q029-D","text":"A cryptocurrency designed to keep a stable value\nTiền mã hóa được thiết kế duy trì giá trị ổn định"}],"correctOptionId":"BC260-Q029-D","explanation":"Explanation (EN): A stablecoin is designed to maintain a relatively stable reference value, often by tracking a currency. This design goal is not a guarantee that its peg cannot fail.\nGiải thích (VI): Stablecoin là tài sản mã hóa được thiết kế để bám theo một giá trị mục tiêu, thường là đồng tiền pháp định. 'Được thiết kế ổn định' không có nghĩa chắc chắn không bao giờ mất neo.\n\nPhân tích từng đáp án:\n✗ A SAI. Stablecoin vẫn có thể được chuyển nhượng và giao dịch.\n✗ B SAI. Thợ đào không cố định giá bằng quy tắc đồng thuận.\n✗ C SAI. CBDC là tiền số của ngân hàng trung ương.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Tiền mã hóa được thiết kế duy trì giá trị ổn định.","source":"Bộ đề Blockchain - Câu gốc 29/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q030","chapter":1,"number":30,"question":"What is the main benefit of the Merkle tree for lightweight users?\nCây Merkle đem lại lợi ích chính gì cho người dùng nút nhẹ?","options":[{"id":"BC260-Q030-A","text":"it removes the need to download block headers\nKhông cần tải phần đầu khối"},{"id":"BC260-Q030-B","text":"It allows them to mine new blocks much faster\nCho phép họ đào khối nhanh hơn nhiều"},{"id":"BC260-Q030-C","text":"They can confirm a transaction with only a few hashes\nCó thể kiểm tra giao dịch chỉ với vài hash"},{"id":"BC260-Q030-D","text":"It hides transaction amounts from everyone\nChe giấu số tiền giao dịch khỏi mọi người"}],"correctOptionId":"BC260-Q030-C","explanation":"Explanation (EN): A Merkle proof lets lightweight participants verify inclusion of a transaction with a short path of hashes and block headers. It does not eliminate the need for headers.\nGiải thích (VI): Merkle proof cho phép máy khách nhẹ kiểm chứng một giao dịch nằm trong khối chỉ qua nhánh hash ngắn và block header. Nó không tự thay thế toàn bộ các bước xác minh đồng thuận của full node.\n\nPhân tích từng đáp án:\n✗ A SAI. Light client vẫn cần các block header liên quan.\n✗ B SAI. Merkle proof không giúp đào nhanh hơn.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Có thể kiểm tra giao dịch chỉ với vài hash.\n✗ D SAI. Merkle tree kiểm tra tính toàn vẹn, không che số tiền.","source":"Bộ đề Blockchain - Câu gốc 30/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q031","chapter":2,"number":31,"question":"An attacker controls more than half of the network's mining power. What can they most likely do?\nKẻ tấn công kiểm soát hơn một nửa sức mạnh đào mạng. Họ nhiều khả năng làm được gì?","options":[{"id":"BC260-Q031-A","text":"Read all users' private keys from the chain\nĐọc khóa riêng mọi người từ chuỗi"},{"id":"BC260-Q031-B","text":"Steal coins from any address\nLấy coin từ bất kỳ địa chỉ nào"},{"id":"BC260-Q031-C","text":"Reverse their own recent transactions\nĐảo ngược giao dịch gần đây của chính mình"},{"id":"BC260-Q031-D","text":"Change the 21 million supply cap\nĐổi giới hạn 21 triệu Bitcoin"}],"correctOptionId":"BC260-Q031-C","explanation":"Explanation (EN): With majority mining power, an attacker can potentially reorganize recent blocks to reverse their own payments. It does not reveal private keys or allow arbitrary issuance above consensus rules.\nGiải thích (VI): Khi một nhóm kiểm soát quá nửa sức mạnh băm, họ có thể thử sắp xếp lại các khối mới để đảo một giao dịch của chính mình. Điều đó không cho họ khóa riêng của người khác hoặc quyền đổi tùy ý giới hạn cung.\n\nPhân tích từng đáp án:\n✗ A SAI. Kiểm soát hash power không cho phép tính khóa riêng từ chuỗi.\n✗ B SAI. Không thể ký chi tiêu từ địa chỉ khác khi không có khóa.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Đảo ngược giao dịch gần đây của chính mình.\n✗ D SAI. Giới hạn nguồn cung vẫn được full node kiểm tra.","source":"Bộ đề Blockchain - Câu gốc 31/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q032","chapter":1,"number":32,"question":"A user sets up her wallet on a new phone after losing the old one. What does she need to recover her bitcoin?\nNgười dùng cài ví trên điện thoại mới sau khi mất máy cũ. Cần gì để khôi phục Bitcoin?","options":[{"id":"BC260-Q032-A","text":"Her recovery phrase or private key backup\nCụm từ khôi phục hoặc bản sao khóa riêng"},{"id":"BC260-Q032-B","text":"A confirmation letter from her bank\nThư xác nhận của ngân hàng"},{"id":"BC260-Q032-C","text":"The serial number of her old phone\nSố sê-ri điện thoại cũ"},{"id":"BC260-Q032-D","text":"Her public bitcoin address on its own\nChỉ cần địa chỉ Bitcoin công khai"}],"correctOptionId":"BC260-Q032-A","explanation":"Explanation (EN): Wallet recovery typically requires the seed phrase or a valid private-key backup. The public address alone cannot reconstruct the spending secret.\nGiải thích (VI): Khôi phục quyền kiểm soát ví cần seed phrase hoặc bản sao private key tương ứng. Địa chỉ công khai và số sê-ri điện thoại không thể tái tạo bí mật ký giao dịch.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Cụm từ khôi phục hoặc bản sao khóa riêng.\n✗ B SAI. Ngân hàng không thể cấp lại khóa Bitcoin cho ví tự quản.\n✗ C SAI. Số sê-ri điện thoại không tái tạo khóa riêng.\n✗ D SAI. Địa chỉ công khai không đủ để ký chi tiêu.","source":"Bộ đề Blockchain - Câu gốc 32/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q033","chapter":3,"number":33,"question":"How is the transaction fee in a Bitcoin transaction determined?\nPhí giao dịch Bitcoin được xác định như thế nào?","options":[{"id":"BC260-Q033-A","text":"Total outputs minus total inputs\nTổng đầu ra trừ tổng đầu vào"},{"id":"BC260-Q033-B","text":"1% of the amount sent\n1% số tiền gửi"},{"id":"BC260-Q033-C","text":"A fixed fee set by the central bank\nPhí cố định do ngân hàng trung ương quy định"},{"id":"BC260-Q033-D","text":"Total inputs minus total outputs\nTổng đầu vào trừ tổng đầu ra"}],"correctOptionId":"BC260-Q033-D","explanation":"Explanation (EN): In Bitcoin's UTXO model, the transaction fee equals the sum of input values minus the sum of output values. It is not a statutory percentage or a central-bank charge.\nGiải thích (VI): Phí giao dịch Bitcoin trong mô hình UTXO bằng tổng giá trị các đầu vào trừ tổng giá trị các đầu ra. Chênh lệch này được trả cho thợ đào, không do ngân hàng trung ương ấn định.\n\nPhân tích từng đáp án:\n✗ A SAI. Công thức trừ ngược sẽ cho giá trị âm khi đầu vào lớn hơn đầu ra.\n✗ B SAI. Không có quy tắc phí cố định bằng 1% số tiền gửi.\n✗ C SAI. Mạng Bitcoin không có ngân hàng trung ương định phí bắt buộc.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Tổng đầu vào trừ tổng đầu ra.","source":"Bộ đề Blockchain - Câu gốc 33/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q034","chapter":3,"number":34,"question":"Why do transaction fees become more important for miners over time?\nVì sao phí giao dịch ngày càng quan trọng đối với thợ đào?","options":[{"id":"BC260-Q034-A","text":"Block rewards fall with each halving\nTrợ cấp khối giảm sau mỗi kỳ halving"},{"id":"BC260-Q034-B","text":"Fees are fixed by law to rise each year\nLuật buộc phí tăng hằng năm"},{"id":"BC260-Q034-C","text":"Miners stop receiving any coins\nThợ đào ngừng nhận mọi coin"},{"id":"BC260-Q034-D","text":"Mining costs fall to zero\nChi phí đào giảm về không"}],"correctOptionId":"BC260-Q034-A","explanation":"Explanation (EN): Bitcoin's block subsidy falls by half periodically, so transaction fees become a larger potential share of miners' revenue. Fees are not guaranteed to rise by law.\nGiải thích (VI): Bitcoin giảm phần thưởng trợ cấp khối qua các kỳ halving, nên phí giao dịch trở thành phần tương đối quan trọng hơn trong động lực kinh tế của thợ đào. Phí không tăng cố định theo luật.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Trợ cấp khối giảm sau mỗi kỳ halving.\n✗ B SAI. Phí Bitcoin không bị luật bắt tăng mỗi năm.\n✗ C SAI. Trợ cấp chưa về 0 ngay sau các kỳ halving.\n✗ D SAI. Chi phí đào không tự động biến mất.","source":"Bộ đề Blockchain - Câu gốc 34/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q035","chapter":1,"number":35,"question":"What is a Merkle tree used for in a block?\nCây Merkle được dùng để làm gì trong một khối?","options":[{"id":"BC260-Q035-A","text":"To set the reward paid to the miner\nQuy định thưởng trả thợ đào"},{"id":"BC260-Q035-B","text":"To record the names of the block's miners\nGhi tên thợ đào trong khối"},{"id":"BC260-Q035-C","text":"To summarize and verify the block's transactions\nTóm tắt và xác minh giao dịch của khối"},{"id":"BC260-Q035-D","text":"To store the private keys of all users\nLưu khóa riêng của mọi người dùng"}],"correctOptionId":"BC260-Q035-C","explanation":"Explanation (EN): A Merkle tree combines transaction hashes into one root, allowing efficient integrity and inclusion checks. It is not a store of miners' names or private keys.\nGiải thích (VI): Merkle tree băm các giao dịch theo cặp tới một root đại diện cho toàn bộ tập giao dịch, thuận tiện kiểm tra tính toàn vẹn. Nó không chứa private key của người dùng.\n\nPhân tích từng đáp án:\n✗ A SAI. Cây Merkle không đặt mức thưởng giao thức.\n✗ B SAI. Không lưu danh sách thợ đào như mục tiêu chính.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Tóm tắt và xác minh giao dịch của khối.\n✗ D SAI. Không chứa khóa riêng người dùng.","source":"Bộ đề Blockchain - Câu gốc 35/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q036","chapter":2,"number":36,"question":"An attacker controls more than half of the network's mining power. What can they most likely do?\nKẻ tấn công kiểm soát hơn một nửa sức mạnh đào mạng. Họ nhiều khả năng làm được gì?","options":[{"id":"BC260-Q036-A","text":"Steal coins from any address\nLấy coin từ bất kỳ địa chỉ nào"},{"id":"BC260-Q036-B","text":"Change the 21 million supply cap\nĐổi giới hạn 21 triệu Bitcoin"},{"id":"BC260-Q036-C","text":"Read all users' private keys from the chain\nĐọc khóa riêng mọi người từ chuỗi"},{"id":"BC260-Q036-D","text":"Reverse their own recent transactions\nĐảo ngược giao dịch gần đây của chính mình"}],"correctOptionId":"BC260-Q036-D","explanation":"Explanation (EN): With majority mining power, an attacker can potentially reorganize recent blocks to reverse their own payments. It does not reveal private keys or allow arbitrary issuance above consensus rules.\nGiải thích (VI): Khi một nhóm kiểm soát quá nửa sức mạnh băm, họ có thể thử sắp xếp lại các khối mới để đảo một giao dịch của chính mình. Điều đó không cho họ khóa riêng của người khác hoặc quyền đổi tùy ý giới hạn cung.\n\nPhân tích từng đáp án:\n✗ A SAI. Không thể ký chi tiêu từ địa chỉ khác khi không có khóa.\n✗ B SAI. Giới hạn nguồn cung vẫn được full node kiểm tra.\n✗ C SAI. Kiểm soát hash power không cho phép tính khóa riêng từ chuỗi.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Đảo ngược giao dịch gần đây của chính mình.","source":"Bộ đề Blockchain - Câu gốc 36/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q037","chapter":3,"number":37,"question":"A friend plans to ask Bitcoin's 'customer service' to reverse a mistaken payment. What is the most accurate response?\nMột người định nhờ “chăm sóc khách hàng Bitcoin” đảo ngược khoản gửi nhầm. Phản hồi nào chính xác nhất?","options":[{"id":"BC260-Q037-A","text":"The receiver' s bank must approve the reversal\nNgân hàng của người nhận phải đồng ý đảo ngược"},{"id":"BC260-Q037-B","text":"The confirming miner can refund the payment\nThợ đào xác nhận có thể hoàn tiền"},{"id":"BC260-Q037-C","text":"No central party exists that can reverse it\nKhông có bên trung tâm nào có thể đảo ngược"},{"id":"BC260-Q037-D","text":"It can be reversed if requested within 24 hours\nCó thể đảo ngược trong 24 giờ"}],"correctOptionId":"BC260-Q037-C","explanation":"Explanation (EN): Bitcoin has no central customer service with power to reverse a confirmed payment. Voluntary repayment by the recipient is separate from a network-level reversal.\nGiải thích (VI): Bitcoin không có bộ phận hỗ trợ trung tâm có quyền đảo giao dịch đã hoàn tất. Đôi bên có thể tự thỏa thuận gửi giao dịch hoàn tiền mới, nhưng không phải sửa giao dịch cũ.\n\nPhân tích từng đáp án:\n✗ A SAI. Ngân hàng người nhận không kiểm soát Bitcoin.\n✗ B SAI. Thợ đào không có quyền đơn phương thu hồi tiền đã gửi.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Không có bên trung tâm nào có thể đảo ngược.\n✗ D SAI. Không có thời hạn chung 24 giờ để đảo giao dịch.","source":"Bộ đề Blockchain - Câu gốc 37/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q038","chapter":1,"number":38,"question":"What is the main benefit of the Merkle tree for lightweight users?\nCây Merkle đem lại lợi ích chính gì cho người dùng nút nhẹ?","options":[{"id":"BC260-Q038-A","text":"They can confirm a transaction with only a few hashes\nCó thể kiểm tra giao dịch chỉ với vài hash"},{"id":"BC260-Q038-B","text":"it removes the need to download block headers\nKhông cần tải phần đầu khối"},{"id":"BC260-Q038-C","text":"It allows them to mine new blocks much faster\nCho phép họ đào khối nhanh hơn nhiều"},{"id":"BC260-Q038-D","text":"It hides transaction amounts from everyone\nChe giấu số tiền giao dịch khỏi mọi người"}],"correctOptionId":"BC260-Q038-A","explanation":"Explanation (EN): A Merkle proof lets lightweight participants verify inclusion of a transaction with a short path of hashes and block headers. It does not eliminate the need for headers.\nGiải thích (VI): Merkle proof cho phép máy khách nhẹ kiểm chứng một giao dịch nằm trong khối chỉ qua nhánh hash ngắn và block header. Nó không tự thay thế toàn bộ các bước xác minh đồng thuận của full node.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Có thể kiểm tra giao dịch chỉ với vài hash.\n✗ B SAI. Light client vẫn cần các block header liên quan.\n✗ C SAI. Merkle proof không giúp đào nhanh hơn.\n✗ D SAI. Merkle tree kiểm tra tính toàn vẹn, không che số tiền.","source":"Bộ đề Blockchain - Câu gốc 38/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q039","chapter":1,"number":39,"question":"Why is heavy reliance on a few large crypto exchanges risky for the market?\nTại sao thị trường có rủi ro khi quá phụ thuộc vào vài sàn crypto lớn?","options":[{"id":"BC260-Q039-A","text":"Large exchanges must mine all their own coins\nSàn lớn phải tự đào toàn bộ coin"},{"id":"BC260-Q039-B","text":"A failure could hit many users and services at once\nSự cố có thể ảnh hưởng đồng thời nhiều người và dịch vụ"},{"id":"BC260-Q039-C","text":"Large exchanges are unable to hold stablecoins\nSàn lớn không thể giữ stablecoin"},{"id":"BC260-Q039-D","text":"Large exchanges are banned from charging fees\nSàn lớn bị cấm tính phí"}],"correctOptionId":"BC260-Q039-B","explanation":"Explanation (EN): Concentration on a few custodial exchanges creates shared operational and security risks. A failure can disrupt many clients, services and markets simultaneously.\nGiải thích (VI): Tập trung tài sản và khách hàng ở vài sàn lớn khiến sự cố một sàn có thể gây tổn thất lan truyền. Đó là rủi ro tập trung ở lớp trung gian, dù blockchain cơ sở là phi tập trung.\n\nPhân tích từng đáp án:\n✗ A SAI. Sàn lớn không bắt buộc tự đào coin.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Sự cố có thể ảnh hưởng đồng thời nhiều người và dịch vụ.\n✗ C SAI. Sàn có thể lưu ký stablecoin.\n✗ D SAI. Sàn có thể thu phí tùy sản phẩm và luật.","source":"Bộ đề Blockchain - Câu gốc 39/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q040","chapter":1,"number":40,"question":"An investor holds a large amount of bitcoin for the long term and trades rarely. Which storage is most suitable?\nNhà đầu tư nắm lượng Bitcoin lớn lâu dài và hiếm khi giao dịch. Cách lưu trữ nào phù hợp nhất?","options":[{"id":"BC260-Q040-A","text":"A screens hot of the private key in email\nẢnh chụp khóa riêng lưu trong email"},{"id":"BC260-Q040-B","text":"A cold wallet kept offline\nVí lạnh lưu ngoại tuyến"},{"id":"BC260-Q040-C","text":"A balance left onan exchange\nĐể số dư trên sàn"},{"id":"BC260-Q040-D","text":"A hot wallet on a public computer\nVí nóng trên máy tính công cộng"}],"correctOptionId":"BC260-Q040-B","explanation":"Explanation (EN): A cold wallet keeps signing keys offline, reducing network-attack exposure for long-term holdings. Backups and physical security remain important.\nGiải thích (VI): Cold wallet giữ khóa ở môi trường không kết nối trực tuyến thường xuyên nên phù hợp lưu trữ dài hạn với ít giao dịch. Vẫn phải sao lưu seed an toàn trước rủi ro mất thiết bị.\n\nPhân tích từng đáp án:\n✗ A SAI. Lưu ảnh khóa riêng trong email có nguy cơ lộ.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Ví lạnh lưu ngoại tuyến.\n✗ C SAI. Giữ trên sàn phụ thuộc bên lưu ký và bảo mật của sàn.\n✗ D SAI. Ví nóng ở máy công cộng có rủi ro rất cao.","source":"Bộ đề Blockchain - Câu gốc 40/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q041","chapter":1,"number":41,"question":"Why is it said that ‘a wallet does not hold coins’?\nVì sao nói “ví không chứa các đồng coin”?","options":[{"id":"BC260-Q041-A","text":"Coins are stored by the exchange, never by users\nCoin luôn nằm trên sàn, người dùng không giữ"},{"id":"BC260-Q041-B","text":"Coins exist only as paper certificates\nCoin chỉ là chứng chỉ giấy"},{"id":"BC260-Q041-C","text":"Coins are held by miners until the owner decides to spend them\nThợ đào giữ coin cho đến khi chủ dùng"},{"id":"BC260-Q041-D","text":"Coins stay on the blockchain; the wallet holds the keys\nCoin nằm trên blockchain; ví giữ các khóa"}],"correctOptionId":"BC260-Q041-D","explanation":"Explanation (EN): Bitcoin balances and unspent outputs are represented on the shared ledger. A wallet primarily manages the keys required to authorize spending.\nGiải thích (VI): Bitcoin tồn tại trên sổ cái dưới dạng UTXO/quyền chi tiêu, không phải các tệp 'coin' nằm bên trong ứng dụng ví. Ví chủ yếu quản lý khóa giúp chứng minh quyền chi tiêu.\n\nPhân tích từng đáp án:\n✗ A SAI. Không phải coin của mọi ví đều được sàn lưu ký.\n✗ B SAI. Bitcoin không tồn tại dưới dạng chứng chỉ giấy.\n✗ C SAI. Thợ đào không giữ coin hộ mọi người.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Coin nằm trên blockchain; ví giữ các khóa.","source":"Bộ đề Blockchain - Câu gốc 41/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q042","chapter":1,"number":42,"question":"What is the average target time for producing a new Bitcoin block?\nThời gian mục tiêu trung bình để tạo khối Bitcoin mới là bao lâu?","options":[{"id":"BC260-Q042-A","text":"About 10 minutes\nKhoảng 10 phút"},{"id":"BC260-Q042-B","text":"About 1 hour\nKhoảng 1 giờ"},{"id":"BC260-Q042-C","text":"About 2.5 minutes\nKhoảng 2,5 phút"},{"id":"BC260-Q042-D","text":"About 1 minute\nKhoảng 1 phút"}],"correctOptionId":"BC260-Q042-A","explanation":"Explanation (EN): Bitcoin targets an average of approximately ten minutes between blocks. Actual intervals are variable because block discovery is probabilistic.\nGiải thích (VI): Mục tiêu tạo khối Bitcoin trung bình gần 10 phút; đó là mục tiêu xác suất, không phải từng khối đều đúng 10 phút. Độ khó được điều chỉnh theo chu kỳ.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Khoảng 10 phút.\n✗ B SAI. Một giờ không phải mục tiêu trung bình của Bitcoin.\n✗ C SAI. Khoảng 2,5 phút thường gắn với Litecoin.\n✗ D SAI. Một phút không phải thời gian mục tiêu Bitcoin.","source":"Bộ đề Blockchain - Câu gốc 42/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q043","chapter":1,"number":43,"question":"What are network participants that collect transactions and compete to create new blocks called?\nNhững người tham gia mạng thu thập giao dịch và cạnh tranh tạo khối mới gọi là gì?","options":[{"id":"BC260-Q043-A","text":"Miners\nThợ đào"},{"id":"BC260-Q043-B","text":"Custodians\nBên lưu ký"},{"id":"BC260-Q043-C","text":"Light clients\nMáy khách nhẹ"},{"id":"BC260-Q043-D","text":"Exchanges\nSàn giao dịch"}],"correctOptionId":"BC260-Q043-A","explanation":"Explanation (EN): Proof-of-Work miners collect candidate transactions and compete to find a valid block hash. Custodians, light clients and exchanges perform other roles.\nGiải thích (VI): Miners tập hợp giao dịch hợp lệ, thử tìm hash đáp ứng mục tiêu PoW và phát tán khối mới khi thành công. Full node không đào vẫn có thể tự xác minh giao dịch.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Thợ đào.\n✗ B SAI. Custodian giữ hộ tài sản, không nhất thiết đào.\n✗ C SAI. Light client xác minh hạn chế, không cạnh tranh PoW như miner.\n✗ D SAI. Sàn giao dịch môi giới mua bán, khác thợ đào.","source":"Bộ đề Blockchain - Câu gốc 43/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q044","chapter":2,"number":44,"question":"Why is a consensus mechanism needed in a decentralized network?\nVì sao mạng phi tập trung cần cơ chế đồng thuận?","options":[{"id":"BC260-Q044-A","text":"To make nodes trust a single leader\nKhiến các nút tin một lãnh đạo duy nhất"},{"id":"BC260-Q044-B","text":"To issue identity cards to users\nCấp giấy tờ tùy thân cho người dùng"},{"id":"BC260-Q044-C","text":"No central authority decides which records are valid\nKhông có cơ quan trung tâm quyết định bản ghi nào hợp lệ"},{"id":"BC260-Q044-D","text":"To speed Up internet connections between nodes\nTăng tốc kết nối Internet giữa các nút"}],"correctOptionId":"BC260-Q044-C","explanation":"Explanation (EN): A decentralized network needs agreement rules because no single trusted operator decides the ledger's valid state. Consensus is about validity and ordering, not faster Internet.\nGiải thích (VI): Vì thiếu cơ quan trung tâm, các nút cần cơ chế đồng thuận về chuỗi và trạng thái hợp lệ. Consensus không nhằm cấp danh tính hoặc tăng tốc Internet.\n\nPhân tích từng đáp án:\n✗ A SAI. Mạng phi tập trung không cần tin một thủ lĩnh duy nhất.\n✗ B SAI. Đồng thuận không phải hệ thống cấp giấy tờ danh tính.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Không có cơ quan trung tâm quyết định bản ghi nào hợp lệ.\n✗ D SAI. Đồng thuận giải quyết hợp lệ dữ liệu, không tăng tốc đường truyền.","source":"Bộ đề Blockchain - Câu gốc 44/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q045","chapter":1,"number":45,"question":"A single company needs a ledger for internal records, with strict control over who can write data. Which option fits best?\nMột công ty cần sổ cái nội bộ và kiểm soát chặt người được ghi dữ liệu. Lựa chọn nào phù hợp nhất?","options":[{"id":"BC260-Q045-A","text":"Consortium blockchain\nBlockchain liên minh"},{"id":"BC260-Q045-B","text":"Peer-to-peer file sharing\nChia sẻ tệp ngang hàng"},{"id":"BC260-Q045-C","text":"Public blockchain\nBlockchain công khai"},{"id":"BC260-Q045-D","text":"Private blockchain\nBlockchain riêng"}],"correctOptionId":"BC260-Q045-D","explanation":"Explanation (EN): A private blockchain is appropriate when one organization needs to control membership and writing permissions. A consortium blockchain is governed by multiple organizations.\nGiải thích (VI): Private blockchain phù hợp khi một tổ chức kiểm soát quyền tham gia, ghi và truy cập. Consortium thích hợp khi nhiều tổ chức cùng quản trị.\n\nPhân tích từng đáp án:\n✗ A SAI. Consortium phù hợp nhiều tổ chức cùng quản trị, không chỉ một công ty.\n✗ B SAI. Chia sẻ tệp P2P không đáp ứng phân quyền ghi dữ liệu theo sổ cái.\n✗ C SAI. Blockchain công khai cho nhiều người tham gia, khó kiểm soát chặt.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Blockchain riêng.","source":"Bộ đề Blockchain - Câu gốc 45/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q046","chapter":3,"number":46,"question":"Where do unconfirmed transactions wait before being included in a block?\nGiao dịch chưa xác nhận chờ ở đâu trước khi được đưa vào khối?","options":[{"id":"BC260-Q046-A","text":"In the memory pool (mempool)\nTrong vùng nhớ giao dịch chờ (mempool)"},{"id":"BC260-Q046-B","text":"In the coinbase transaction\nTrong giao dịch coinbase"},{"id":"BC260-Q046-C","text":"In the genesis block\nTrong khối genesis"},{"id":"BC260-Q046-D","text":"In the Merkle root\nTrong gốc Merkle"}],"correctOptionId":"BC260-Q046-A","explanation":"Explanation (EN): Unconfirmed Bitcoin transactions are commonly kept in each node's mempool until included, dropped or replaced. They are not stored as unconfirmed entries in the genesis block.\nGiải thích (VI): Mempool là tập giao dịch hợp lệ nhưng chưa được đưa vào khối mà một nút đang lưu. Nó không phải genesis block, Merkle root hay coinbase.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Trong vùng nhớ giao dịch chờ (mempool).\n✗ B SAI. Coinbase là giao dịch đặc biệt trong khối, không phải nơi chờ.\n✗ C SAI. Genesis là khối đầu tiên đã tồn tại.\n✗ D SAI. Merkle root là hash tổng hợp, không phải danh sách chờ.","source":"Bộ đề Blockchain - Câu gốc 46/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q047","chapter":2,"number":47,"question":"In public key cryptography, which key must the owner keep secret?\nTrong mật mã khóa công khai, khóa nào chủ sở hữu phải giữ bí mật?","options":[{"id":"BC260-Q047-A","text":"The transaction ID\nMã giao dịch"},{"id":"BC260-Q047-B","text":"The private key\nKhóa riêng"},{"id":"BC260-Q047-C","text":"The public key\nKhóa công khai"},{"id":"BC260-Q047-D","text":"The wallet address\nĐịa chỉ ví"}],"correctOptionId":"BC260-Q047-B","explanation":"Explanation (EN): A private key must remain secret because it is used to authorize spending through digital signatures. Addresses and public keys are intended to be shareable.\nGiải thích (VI): Private key phải được bảo mật vì nó cho phép tạo chữ ký chi tiêu. Public key và địa chỉ nhận tiền có thể chia sẻ theo quy tắc.\n\nPhân tích từng đáp án:\n✗ A SAI. Mã giao dịch là định danh công khai.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Khóa riêng.\n✗ C SAI. Khóa công khai dùng xác minh chữ ký.\n✗ D SAI. Địa chỉ nhận tiền phải chia sẻ được.","source":"Bộ đề Blockchain - Câu gốc 47/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q048","chapter":3,"number":48,"question":"How can blockchain improve cross-border payments for banks?\nBlockchain có thể cải thiện thanh toán xuyên biên giới cho ngân hàng như thế nào?","options":[{"id":"BC260-Q048-A","text":"A shared ledger cuts intermediaries and reconciliation\nSổ cái chung giảm trung gian và đối soát"},{"id":"BC260-Q048-B","text":"It eliminates the need for any regulation\nLoại bỏ mọi yêu cầu pháp lý"},{"id":"BC260-Q048-C","text":"4t guarantees zero fees for every cross-border payment\nBảo đảm mọi khoản chuyển tiền quốc tế đều miễn phí"},{"id":"BC260-Q048-D","text":"It removes all foreign exchange risk from each payment\nXóa bỏ mọi rủi ro tỷ giá"}],"correctOptionId":"BC260-Q048-A","explanation":"Explanation (EN): A shared ledger can reduce intermediary layers, reconciliation work and settlement friction across borders. It does not inherently eliminate regulation, fees or foreign-exchange exposure.\nGiải thích (VI): Sổ cái chung giúp các bên cùng thấy trạng thái giao dịch, từ đó giảm tầng trung gian và công đối soát. Tuy nhiên, blockchain không mặc nhiên xóa bỏ tất cả quy định hay rủi ro tỷ giá.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Sổ cái chung giảm trung gian và đối soát.\n✗ B SAI. Tuân thủ pháp lý vẫn cần thiết.\n✗ C SAI. Blockchain không bảo đảm phí bằng 0.\n✗ D SAI. Rủi ro tỷ giá vẫn tồn tại khi đổi giữa các đồng tiền.","source":"Bộ đề Blockchain - Câu gốc 48/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q049","chapter":2,"number":49,"question":"In Proof of Stake, what are the participants who confirm new blocks called?\nTrong Proof of Stake, người tham gia xác nhận khối mới gọi là gì?","options":[{"id":"BC260-Q049-A","text":"Validators\nNgười xác thực (validators)"},{"id":"BC260-Q049-B","text":"Miners\nThợ đào (miners)"}],"correctOptionId":"BC260-Q049-A","explanation":"Explanation (EN): In Proof of Stake, the block proposers or authenticators are generally called validators. The term miner is normally associated with Proof of Work.\nGiải thích (VI): Trong Proof of Stake (PoS), người có quyền đề xuất hoặc xác thực khối thường được gọi là validator. Miner là thuật ngữ thường dùng cho người đào trong Proof of Work (PoW). Ảnh gốc câu này chỉ có hai lựa chọn A và B.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Người xác thực (validators).\n✗ B SAI. Trong PoS người tham gia
