d in place. Immutability is a related but distinct security property.\nGiải thích (VI): Append-only là chỉ thêm dữ liệu mới, không sửa hay xóa trực tiếp bản ghi cũ đã xác nhận. Đây là một đặc điểm quan trọng của tính truy vết sổ cái.\n\nPhân tích từng đáp án:\n✗ A SAI. Tương tác là khả năng các hệ thống kết nối.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Chỉ cho phép ghi thêm.\n✗ C SAI. Khả năng mở rộng nói về lưu lượng xử lý.\n✗ D SAI. Tập trung hóa nói về quyền điều khiển.","source":"Bộ đề Blockchain - Câu gốc 217/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q218","chapter":1,"number":218,"question":"What does ‘decentralized’ mean in the context of Bitcoin?\n“Phi tập trung” trong ngữ cảnh Bitcoin có nghĩa gì?","options":[{"id":"BC260-Q218-A","text":"A group of central banks controls the network\nNhóm ngân hàng trung ương kiểm soát mạng"},{"id":"BC260-Q218-B","text":"No single party controls the network or ledger\nKhông bên đơn lẻ nào kiểm soát mạng hay sổ cái"},{"id":"BC260-Q218-C","text":"Each country runs its own separate Bitcoin ledger\nMỗi quốc gia chạy sổ Bitcoin riêng"},{"id":"BC260-Q218-D","text":"One main server approves every transaction\nMột máy chủ chính phê duyệt mọi khoản"}],"correctOptionId":"BC260-Q218-B","explanation":"Explanation (EN): Decentralization means no single participant has exclusive authority over Bitcoin's network and consensus ledger. A central server does not approve each transaction.\nGiải thích (VI): Phi tập trung trong Bitcoin nghĩa là không một đơn vị có quyền tuyệt đối điều hành và sửa sổ cái của toàn mạng. Các nút độc lập vẫn cần quy tắc chung để liên thông.\n\nPhân tích từng đáp án:\n✗ A SAI. Không có nhóm ngân hàng trung ương kiểm soát đồng thuận Bitcoin.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Không bên đơn lẻ nào kiểm soát mạng hay sổ cái.\n✗ C SAI. Bitcoin có sổ cái dùng chung xuyên biên giới.\n✗ D SAI. Không có máy chủ chính duy nhất phê duyệt giao dịch.","source":"Bộ đề Blockchain - Câu gốc 218/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q219","chapter":1,"number":219,"question":"Why is Bitcoin often described as resistant to inflation?\nVì sao Bitcoin thường được cho là có khả năng chống lạm phát?","options":[{"id":"BC260-Q219-A","text":"Its price never changes on any exchange\nGiá của nó không bao giờ thay đổi trên bất kỳ sàn nào"},{"id":"BC260-Q219-B","text":"A central bank controls its supply\nNgân hàng trung ương kiểm soát nguồn cung"},{"id":"BC260-Q219-C","text":"Its supply is capped and issuance declines\nNguồn cung có giới hạn và lượng phát hành giảm dần"},{"id":"BC260-Q219-D","text":"It is backed by gold reserves\nĐược bảo đảm bằng dự trữ vàng"}],"correctOptionId":"BC260-Q219-C","explanation":"Explanation (EN): Bitcoin has a protocol-defined supply limit and a declining issuance schedule. That constrains monetary issuance, but its market price can still fluctuate greatly.\nGiải thích (VI): Bitcoin có lịch phát hành theo giao thức và mức cung tối đa khoảng 21 triệu BTC; phần thưởng khối định kỳ giảm một nửa. Điều này không có nghĩa giá BTC không biến động hoặc chỉ số giá hàng hóa luôn giảm.\n\nPhân tích từng đáp án:\n✗ A SAI. Giá thị trường Bitcoin vẫn biến động.\n✗ B SAI. Không có ngân hàng trung ương điều chỉnh nguồn cung Bitcoin.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Nguồn cung có giới hạn và lượng phát hành giảm dần.\n✗ D SAI. Bitcoin không có dự trữ vàng bảo chứng.","source":"Bộ đề Blockchain - Câu gốc 219/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q220","chapter":3,"number":220,"question":"What is the first transaction in each block, which creates new bitcoin for the miner, called?\nGiao dịch đầu tiên mỗi khối tạo Bitcoin mới cho thợ đào gọi là gì?","options":[{"id":"BC260-Q220-A","text":"Genesis transaction\nGiao dịch genesis"},{"id":"BC260-Q220-B","text":"Coinbase transaction\nGiao dịch coinbase"},{"id":"BC260-Q220-C","text":"Fee transaction\nGiao dịch phí"},{"id":"BC260-Q220-D","text":"Change transaction\nGiao dịch trả tiền thừa"}],"correctOptionId":"BC260-Q220-B","explanation":"Explanation (EN): The coinbase transaction is the special first transaction in a Bitcoin block that creates new coins within the subsidy limit and claims associated transaction fees.\nGiải thích (VI): Coinbase transaction là giao dịch đặc biệt đầu tiên của mỗi khối Bitcoin, tạo trợ cấp khối và thu phí cho thợ đào. Không nhầm với genesis block, là khối đầu tiên của chuỗi.\n\nPhân tích từng đáp án:\n✗ A SAI. Genesis là tên khối đầu, không phải giao dịch tạo thưởng mỗi khối.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Giao dịch coinbase.\n✗ C SAI. Không tồn tại loại bắt buộc tên fee transaction thay coinbase.\n✗ D SAI. Change output là tiền trả lại người gửi, không tạo trợ cấp khối.","source":"Bộ đề Blockchain - Câu gốc 220/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q221","chapter":1,"number":221,"question":"What is the main trade-off between hot and cold wallets?\nĐánh đổi chính giữa ví nóng và ví lạnh là gì?","options":[{"id":"BC260-Q221-A","text":"Hot wallets are handy but more exposed to attacks\nVí nóng tiện nhưng dễ bị tấn công hơn"},{"id":"BC260-Q221-B","text":"Cold wallets are faster but cannot store keys\nVí lạnh nhanh hơn nhưng không lưu được khóa"},{"id":"BC260-Q221-C","text":"Hot wallets are offline and harder to use\nVí nóng luôn ngoại tuyến và khó dùng"},{"id":"BC260-Q221-D","text":"Cold wallets charge higher fees on every payment\nVí lạnh tính phí cao hơn ở mọi lần trả"}],"correctOptionId":"BC260-Q221-A","explanation":"Explanation (EN): Hot wallets are convenient for frequent spending but internet exposure increases attack risk. Cold wallets keep keys offline but may be less convenient for immediate transactions.\nGiải thích (VI): Hot wallet tiện cho giao dịch thường xuyên nhưng kết nối trực tuyến khiến nó dễ tiếp xúc với tấn công hơn. Cold wallet ít kết nối hơn nhưng thao tác chi tiêu kém thuận tiện.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Ví nóng tiện nhưng dễ bị tấn công hơn.\n✗ B SAI. Ví lạnh chính là thiết bị giữ khóa ngoại tuyến.\n✗ C SAI. Ví nóng thường có kết nối mạng, không phải offline.\n✗ D SAI. Phí Bitcoin không phụ thuộc trực tiếp ví lạnh.","source":"Bộ đề Blockchain - Câu gốc 221/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q222","chapter":1,"number":222,"question":"An analyst traces many payments to one Bitcoin address. What can the analyst learn without other information?\nNhà phân tích theo dõi nhiều khoản thanh toán tới một địa chỉ Bitcoin. Nếu không có thông tin khác, họ biết được gì?","options":[{"id":"BC260-Q222-A","text":"The private key that controls the address\nKhóa riêng kiểm soát địa chỉ"},{"id":"BC260-Q222-B","text":"The address's payment history, but not the owner's name\nLịch sử giao dịch của địa chỉ nhưng không biết tên chủ"},{"id":"BC260-Q222-C","text":"The owner's full name and home address\nHọ tên và địa chỉ nhà của chủ"},{"id":"BC260-Q222-D","text":"Nothing, because all amounts and addresses are hidden\nKhông biết gì vì địa chỉ và số tiền đều ẩn"}],"correctOptionId":"BC260-Q222-B","explanation":"Explanation (EN): The public chain reveals an address's transaction history and amounts, but not necessarily its owner's legal identity. Additional off-chain information can sometimes identify the user.\nGiải thích (VI): Từ blockchain công khai, nhà phân tích có thể thấy lịch sử một địa chỉ và các giao dịch liên quan. Không thể chỉ từ địa chỉ mà suy ra private key hoặc chắc chắn biết danh tính pháp lý.\n\nPhân tích từng đáp án:\n✗ A SAI. Khóa riêng không thể suy ra trực tiếp chỉ từ lịch sử địa chỉ.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Lịch sử giao dịch của địa chỉ nhưng không biết tên chủ.\n✗ C SAI. Sổ cái không hiển thị đầy đủ danh tính và địa chỉ nhà.\n✗ D SAI. Bitcoin công khai nhiều dữ liệu giao dịch và địa chỉ.","source":"Bộ đề Blockchain - Câu gốc 222/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q223","chapter":1,"number":223,"question":"Which definition best describes a blockchain?\nĐịnh nghĩa nào mô tả blockchain đúng nhất?","options":[{"id":"BC260-Q223-A","text":"A distributed ledger of linked blocks of transactions\nSổ cái phân tán gồm các khối giao dịch liên kết"},{"id":"BC260-Q223-B","text":"A central database managed by one bank\nCơ sở dữ liệu trung tâm do một ngân hàng quản lý"},{"id":"BC260-Q223-C","text":"A payment card network run by major banks\nMạng thẻ thanh toán do ngân hàng lớn vận hành"},{"id":"BC260-Q223-D","text":"A cloud storage service for business documents\nDịch vụ lưu tài liệu doanh nghiệp trên đám mây"}],"correctOptionId":"BC260-Q223-A","explanation":"Explanation (EN): A blockchain is a distributed ledger of cryptographically linked blocks containing transactions. It is not simply one bank's private database or a cloud storage site.\nGiải thích (VI): Blockchain là sổ cái phân tán, gồm các khối giao dịch liên kết mật mã theo thứ tự. Nó khác cơ sở dữ liệu một ngân hàng hoặc đơn thuần dịch vụ lưu tài liệu trên cloud.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Sổ cái phân tán gồm các khối giao dịch liên kết.\n✗ B SAI. Một ngân hàng kiểm soát là mô hình tập trung.\n✗ C SAI. Mạng thẻ ngân hàng không phản ánh chuỗi khối phi tập trung.\n✗ D SAI. Dịch vụ cloud chỉ là lưu tệp, không nhất thiết có liên kết hash và đồng thuận.","source":"Bộ đề Blockchain - Câu gốc 223/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q224","chapter":1,"number":224,"question":"What does ‘decentralized’ mean in the context of Bitcoin?\n“Phi tập trung” trong ngữ cảnh Bitcoin có nghĩa gì?","options":[{"id":"BC260-Q224-A","text":"One main server approves every transaction\nMột máy chủ chính phê duyệt mọi khoản"},{"id":"BC260-Q224-B","text":"A group of central banks controls the network\nNhóm ngân hàng trung ương kiểm soát mạng"},{"id":"BC260-Q224-C","text":"Each country runs its own separate Bitcoin ledger\nMỗi quốc gia chạy sổ Bitcoin riêng"},{"id":"BC260-Q224-D","text":"No single party controls the network or ledger\nKhông bên đơn lẻ nào kiểm soát mạng hay sổ cái"}],"correctOptionId":"BC260-Q224-D","explanation":"Explanation (EN): Decentralization means no single participant has exclusive authority over Bitcoin's network and consensus ledger. A central server does not approve each transaction.\nGiải thích (VI): Phi tập trung trong Bitcoin nghĩa là không một đơn vị có quyền tuyệt đối điều hành và sửa sổ cái của toàn mạng. Các nút độc lập vẫn cần quy tắc chung để liên thông.\n\nPhân tích từng đáp án:\n✗ A SAI. Không có máy chủ chính duy nhất phê duyệt giao dịch.\n✗ B SAI. Không có nhóm ngân hàng trung ương kiểm soát đồng thuận Bitcoin.\n✗ C SAI. Bitcoin có sổ cái dùng chung xuyên biên giới.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Không bên đơn lẻ nào kiểm soát mạng hay sổ cái.","source":"Bộ đề Blockchain - Câu gốc 224/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q225","chapter":1,"number":225,"question":"What is the average target time for producing a new Bitcoin block?\nThời gian mục tiêu trung bình để tạo khối Bitcoin mới là bao lâu?","options":[{"id":"BC260-Q225-A","text":"About 1 hour\nKhoảng 1 giờ"},{"id":"BC260-Q225-B","text":"About 10 minutes\nKhoảng 10 phút"},{"id":"BC260-Q225-C","text":"About 1 minute\nKhoảng 1 phút"},{"id":"BC260-Q225-D","text":"About 2.5 minutes\nKhoảng 2,5 phút"}],"correctOptionId":"BC260-Q225-B","explanation":"Explanation (EN): Bitcoin targets an average of approximately ten minutes between blocks. Actual intervals are variable because block discovery is probabilistic.\nGiải thích (VI): Mục tiêu tạo khối Bitcoin trung bình gần 10 phút; đó là mục tiêu xác suất, không phải từng khối đều đúng 10 phút. Độ khó được điều chỉnh theo chu kỳ.\n\nPhân tích từng đáp án:\n✗ A SAI. Một giờ không phải mục tiêu trung bình của Bitcoin.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Khoảng 10 phút.\n✗ C SAI. Một phút không phải thời gian mục tiêu Bitcoin.\n✗ D SAI. Khoảng 2,5 phút thường gắn với Litecoin.","source":"Bộ đề Blockchain - Câu gốc 225/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q226","chapter":3,"number":226,"question":"An attacker modifies a transaction in Block 100 of a chain of 120 blocks. What must they do for the change to go unnoticed?\nKẻ tấn công sửa giao dịch tại khối 100 trong chuỗi 120 khối. Họ phải làm gì để thay đổi không bị phát hiện?","options":[{"id":"BC260-Q226-A","text":"Delete the genesis block and restart the chain\nXóa khối genesis và khởi tạo lại chuỗi"},{"id":"BC260-Q226-B","text":"Ask one trusted node to accept the change on behalf of all nodes\nNhờ một nút đáng tin chấp nhận thay cho mọi nút"},{"id":"BC260-Q226-C","text":"Change only Block 100's timestamp to an earlier time\nChỉ đổi dấu thời gian khối 100 về sớm hơn"},{"id":"BC260-Q226-D","text":"Recompute Block 100 and all 20 later blocks faster than the network\nTính lại khối 100 và cả 20 khối sau nhanh hơn cả mạng"}],"correctOptionId":"BC260-Q226-D","explanation":"Explanation (EN): Changing an old transaction changes the Merkle root and block hash, breaking the links to later blocks. The attacker would need to redo the affected work and catch up with the honest chain; this is prohibitively hard under normal assumptions.\nGiải thích (VI): Đổi giao dịch trong khối cũ làm đổi Merkle root và hash khối, khiến các liên kết phía sau không còn khớp. Kẻ tấn công phải tái tính toán phần việc khối đó và các khối kế tiếp, đồng thời cạnh tranh với chuỗi hợp lệ.\n\nPhân tích từng đáp án:\n✗ A SAI. Không cần xóa genesis và cũng không đủ để thay dữ liệu cũ.\n✗ B SAI. Một nút không thay thế quy tắc xác minh của cả mạng.\n✗ C SAI. Sửa timestamp không làm Merkle root khớp trở lại.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Tính lại khối 100 và cả 20 khối sau nhanh hơn cả mạng.","source":"Bộ đề Blockchain - Câu gốc 226/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q227","chapter":1,"number":227,"question":"A university stores the hash of each degree certificate on a blockchain. An employer wants to check a certificate. What should it do?\nĐại học lưu hash của văn bằng lên blockchain. Nhà tuyển dụng kiểm tra văn bằng bằng cách nào?","options":[{"id":"BC260-Q227-A","text":"Ask miners to read and approve the certificate\nYêu cầu thợ đào đọc và phê duyệt chứng chỉ"},{"id":"BC260-Q227-B","text":"Check the graduate's private key\nKiểm tra khóa riêng của người tốt nghiệp"},{"id":"BC260-Q227-C","text":"Hash the certificate and compare it with the stored hash\nBăm chứng chỉ rồi so với hash đã lưu"},{"id":"BC260-Q227-D","text":"Look up the graduate's name in the genesis block\nTìm tên người tốt nghiệp ở khối genesis"}],"correctOptionId":"BC260-Q227-C","explanation":"Explanation (EN): A verifier hashes the presented document and compares its digest to the previously recorded digest. A match supports integrity, not necessarily the truth of the original claim.\nGiải thích (VI): Nhà tuyển dụng băm lại chứng chỉ được nộp rồi so sánh với hash đã neo trên blockchain. Nếu nội dung thay đổi, hash thường không trùng, giúp kiểm tra tính toàn vẹn; không tự chứng minh nội dung ban đầu là thật.\n\nPhân tích từng đáp án:\n✗ A SAI. Thợ đào không đóng vai trò cấp phép văn bằng.\n✗ B SAI. Không cần khóa riêng người học để băm tài liệu đã xuất trình.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Băm chứng chỉ rồi so với hash đã lưu.\n✗ D SAI. Khối genesis không chứa danh sách bằng tốt nghiệp.","source":"Bộ đề Blockchain - Câu gốc 227/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q228","chapter":1,"number":228,"question":"What is the maximum number of bitcoins that will ever be issued under the protocol?\nTối đa có bao nhiêu Bitcoin được phát hành theo giao thức?","options":[{"id":"BC260-Q228-A","text":"100 million\n100 triệu"},{"id":"BC260-Q228-B","text":"21 million\n21 triệu"},{"id":"BC260-Q228-C","text":"Unlimited, set by miners\nKhông giới hạn, do thợ đào đặt"},{"id":"BC260-Q228-D","text":"21 billion\n21 tỷ"}],"correctOptionId":"BC260-Q228-B","explanation":"Explanation (EN): Bitcoin's protocol limits total issuance to approximately 21 million BTC. The number is not 21 billion, and miners cannot vote unlimited coins into existence unilaterally.\nGiải thích (VI): Giao thức Bitcoin đặt mục tiêu phát hành tối đa xấp xỉ 21 triệu BTC. Điều này khác giới hạn 21 tỷ và không được tăng tùy ý theo quyết định thợ đào.\n\nPhân tích từng đáp án:\n✗ A SAI. 100 triệu không phải giới hạn Bitcoin.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: 21 triệu.\n✗ C SAI. Miner không được tự tăng không giới hạn.\n✗ D SAI. 21 tỷ lớn gấp 1.000 lần giới hạn.","source":"Bộ đề Blockchain - Câu gốc 228/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q229","chapter":1,"number":229,"question":"What does the phrase ‘trust without a middleman’ mean for Bitcoin?\nCụm từ “tin cậy không cần trung gian” trong Bitcoin có nghĩa gì?","options":[{"id":"BC260-Q229-A","text":"Users must trust the developers who wrote the software\nNgười dùng phải tin nhà phát triển phần mềm"},{"id":"BC260-Q229-B","text":"A licensed bank guarantees every Bitcoin transaction for users\nNgân hàng được cấp phép bảo đảm mọi giao dịch"},{"id":"BC260-Q229-C","text":"Trust is not needed because transactions are reversible\nKhông cần tin cậy vì giao dịch đảo được"},{"id":"BC260-Q229-D","text":"Trust rests on cryptography and network rules, not an institution\nNiềm tin dựa vào mật mã và quy tắc mạng chứ không phải tổ chức"}],"correctOptionId":"BC260-Q229-D","explanation":"Explanation (EN): Bitcoin replaces institutional trust with independently checked cryptographic proofs and consensus rules. It does not mean that all reversals are freely available.\nGiải thích (VI): Niềm tin không qua trung gian đến từ chữ ký mật mã, xác minh độc lập và đồng thuận về quy tắc sổ cái. Nó không có nghĩa mọi giao dịch đều có thể hủy hoặc ngân hàng cam kết bồi thường.\n\nPhân tích từng đáp án:\n✗ A SAI. Nhà phát triển không có quyền bắt mạng chấp nhận quy tắc sai.\n✗ B SAI. Không có ngân hàng được phép bảo lãnh mọi giao dịch Bitcoin.\n✗ C SAI. Tin cậy không đồng nghĩa giao dịch có thể đảo ngược.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Niềm tin dựa vào mật mã và quy tắc mạng chứ không phải tổ chức.","source":"Bộ đề Blockchain - Câu gốc 229/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q230","chapter":2,"number":230,"question":"How can a smart contract support escrow in a transaction?\nSmart contract có thể hỗ trợ ký quỹ trong giao dịch như thế nào?","options":[{"id":"BC260-Q230-A","text":"it removes the need to define release conditions\nKhông cần xác định điều kiện giải ngân"},{"id":"BC260-Q230-B","text":"It lets the bank keep funds indefinitely\nCho ngân hàng giữ tiền vô thời hạn"},{"id":"BC260-Q230-C","text":"It hides the transaction from both parties\nChe giấu giao dịch khỏi cả hai bên"},{"id":"BC260-Q230-D","text":"It releases funds automatically once conditions are met\nTự giải ngân khi các điều kiện được đáp ứng"}],"correctOptionId":"BC260-Q230-D","explanation":"Explanation (EN): A smart-contract escrow locks funds and releases them once programmed conditions are verified. It still needs reliable external information where conditions concern the physical world.\nGiải thích (VI): Smart contract có thể đóng vai trò escrow: giữ tài sản và chỉ giải phóng khi điều kiện được xác minh. Điều kiện phải được lập trình rõ, dữ liệu ngoài chuỗi có thể cần oracle.\n\nPhân tích từng đáp án:\n✗ A SAI. Smart contract vẫn phải có điều kiện xác định.\n✗ B SAI. Giữ tiền mãi mãi trái mục đích giải ngân theo điều kiện.\n✗ C SAI. Giao dịch ký quỹ không nhằm giấu khỏi hai bên.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Tự giải ngân khi các điều kiện được đáp ứng.","source":"Bộ đề Blockchain - Câu gốc 230/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q231","chapter":3,"number":231,"question":"Which tool usually creates and signs a Bitcoin transaction for the user?\nCông cụ nào thường tạo và ký giao dịch Bitcoin cho người dùng?","options":[{"id":"BC260-Q231-A","text":"The receiver's bank\nNgân hàng của người nhận"},{"id":"BC260-Q231-B","text":"The user's wallet software\nPhần mềm ví người dùng"},{"id":"BC260-Q231-C","text":"The Bitcoin Foundation\nQuỹ Bitcoin"},{"id":"BC260-Q231-D","text":"A mining pool\nNhóm đào"}],"correctOptionId":"BC260-Q231-B","explanation":"Explanation (EN): Wallet software constructs transactions, selects inputs and signs them with available private keys. Neither a mining pool nor a recipient's bank usually does this for the user.\nGiải thích (VI): Phần mềm ví thường tạo giao dịch, chọn UTXO và ký bằng khóa do người dùng kiểm soát. Miner sau đó có thể đưa giao dịch vào khối, nhưng không tạo chữ ký thay cho chủ tài sản.\n\nPhân tích từng đáp án:\n✗ A SAI. Ngân hàng người nhận không tạo chữ ký cho ví Bitcoin.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Phần mềm ví người dùng.\n✗ C SAI. Bitcoin Foundation không ký chi hộ người dùng.\n✗ D SAI. Pool đào không phải phần mềm ví giao dịch cá nhân.","source":"Bộ đề Blockchain - Câu gốc 231/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q232","chapter":2,"number":232,"question":"In Proof of Stake, what is mainly used to select validators?\nTrong Proof of Stake, chủ yếu dựa vào điều gì để chọn validator?","options":[{"id":"BC260-Q232-A","text":"The amount of electricity they consume\nĐiện năng họ tiêu thụ"},{"id":"BC260-Q232-B","text":"The amount of coins they lock up as stake\nLượng coin khóa làm stake"},{"id":"BC260-Q232-C","text":"The speed of their internet connection\nTốc độ Internet"},{"id":"BC260-Q232-D","text":"Their personal identity documents\nGiấy tờ nhận dạng cá nhân"}],"correctOptionId":"BC260-Q232-B","explanation":"Explanation (EN): Proof of Stake generally selects validators in relation to their committed stake, with randomness and other protocol rules. It does not primarily select by electricity consumption or ID documents.\nGiải thích (VI): Trong PoS, mức tài sản stake được khóa cùng quy tắc chọn và phạt ảnh hưởng cơ hội xác thực. Tài liệu nhấn mạnh lượng coin stake, không phải điện năng hay giấy tờ cá nhân.\n\nPhân tích từng đáp án:\n✗ A SAI. Tiêu thụ điện là cơ chế PoW, không phải tiêu chí chính PoS.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Lượng coin khóa làm stake.\n✗ C SAI. Tốc độ Internet không phải đại lượng stake chính.\n✗ D SAI. Giấy tờ tùy thân không tự tạo quyền xác thực PoS.","source":"Bộ đề Blockchain - Câu gốc 232/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q233","chapter":4,"number":233,"question":"A token gives holders a share of a company's future profits. How would it most likely be classified?\nToken cho người giữ quyền hưởng một phần lợi nhuận tương lai của công ty. Thường được xếp loại gì?","options":[{"id":"BC260-Q233-A","text":"Security token\nToken chứng khoán"},{"id":"BC260-Q233-B","text":"Utility token\nToken tiện ích"},{"id":"BC260-Q233-C","text":"Exchange token\nToken sàn giao dịch"},{"id":"BC260-Q233-D","text":"E-money token\nToken tiền điện tử"}],"correctOptionId":"BC260-Q233-A","explanation":"Explanation (EN): A token promising participation in future company profits has an investment-like claim and most closely resembles a security token. Legal classification depends on actual rights and jurisdiction.\nGiải thích (VI): Token thể hiện quyền chia sẻ lợi nhuận doanh nghiệp mang tính đầu tư nên thường được phân loại security token, tùy khung pháp lý. Nó khác utility token chỉ phục vụ sử dụng dịch vụ.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Token chứng khoán.\n✗ B SAI. Utility token trao quyền dùng sản phẩm, không phải lợi nhuận doanh nghiệp.\n✗ C SAI. Token sàn thường cho ưu đãi dịch vụ của sàn.\n✗ D SAI. E-money token gần tiền thanh toán, không phải cổ phần lợi nhuận.","source":"Bộ đề Blockchain - Câu gốc 233/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q234","chapter":1,"number":234,"question":"Why are Bitcoin users described as pseudonymous rather than fully anonymous?\nVì sao người dùng Bitcoin được gọi là bút danh chứ không hoàn toàn ẩn danh?","options":[{"id":"BC260-Q234-A","text":"Users must register with their national ID number\nNgười dùng phải đăng ký số căn cước"},{"id":"BC260-Q234-B","text":"Only miners can see the sender' s name\nChỉ thợ đào thấy tên người gửi"},{"id":"BC260-Q234-C","text":"Transactions are public but tied to addresses, not names\nGiao dịch công khai theo địa chỉ, không theo tên"},{"id":"BC260-Q234-D","text":"No transaction details are visible to anyone\nKhông ai xem được chi tiết giao dịch"}],"correctOptionId":"BC260-Q234-C","explanation":"Explanation (EN): Bitcoin addresses are pseudonyms visible on a public ledger; they usually do not directly state legal identity. Outside information can still link addresses to people.\nGiải thích (VI): Bitcoin gọi là pseudonymous vì địa chỉ và lịch sử thanh toán hiển thị công khai nhưng thường không trực tiếp ghi tên pháp lý. Dữ liệu ngoài chuỗi vẫn có thể liên kết địa chỉ với con người.\n\nPhân tích từng đáp án:\n✗ A SAI. Bitcoin không yêu cầu đưa số căn cước lên blockchain.\n✗ B SAI. Miner không nhất thiết biết tên thật người gửi.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Giao dịch công khai theo địa chỉ, không theo tên.\n✗ D SAI. Dữ liệu giao dịch Bitcoin được công khai.","source":"Bộ đề Blockchain - Câu gốc 234/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q235","chapter":1,"number":235,"question":"A supplier, a buyer and a bank all keep separate records of the same shipment. What does a shared blockchain mainly provide?\nNhà cung cấp, người mua và ngân hàng cùng ghi riêng dữ liệu một chuyến hàng. Blockchain chung cung cấp gì chủ yếu?","options":[{"id":"BC260-Q235-A","text":"Free insurance on all goods being shipped\nBảo hiểm miễn phí cho mọi hàng hóa"},{"id":"BC260-Q235-B","text":"Lower product prices that are fixed by the ledger\nGiá sản phẩm thấp hơn do sổ cái ấn định"},{"id":"BC260-Q235-C","text":"Faster internet connections for every party\nInternet nhanh hơn cho các bên"},{"id":"BC260-Q235-D","text":"One synchronized record that all parties can trust\nBản ghi đồng bộ để các bên cùng tin cậy"}],"correctOptionId":"BC260-Q235-D","explanation":"Explanation (EN): A common synchronized ledger helps the supplier, buyer and bank reconcile one shipment history. It cannot automatically insure goods or guarantee lower product prices.\nGiải thích (VI): Sổ cái đồng bộ dùng chung cho nhà cung cấp, khách hàng và ngân hàng tạo một lịch sử sự kiện nhất quán, giảm đối soát. Nó không tự mua bảo hiểm hay quyết định giá hàng hóa.\n\nPhân tích từng đáp án:\n✗ A SAI. Blockchain không tự cung cấp bảo hiểm miễn phí.\n✗ B SAI. Đồng thuận không cố định giá hàng hóa.\n✗ C SAI. Đồng thuận không tăng tốc Internet vật lý.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Bản ghi đồng bộ để các bên cùng tin cậy.","source":"Bộ đề Blockchain - Câu gốc 235/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q236","chapter":1,"number":236,"question":"Why is the value of bitcoin not guaranteed by any institution?\nVì sao không tổ chức nào bảo đảm giá trị Bitcoin?","options":[{"id":"BC260-Q236-A","text":"Miners vote each day to set its value\nThợ đào bỏ phiếu giá mỗi ngày"},{"id":"BC260-Q236-B","text":"It has no issuer that promises to redeem it\nKhông tổ chức phát hành nào cam kết mua lại theo giá cố định"},{"id":"BC260-Q236-C","text":"The protocol fixes its value at one dollar\nGiao thức cố định giá 1 USD"},{"id":"BC260-Q236-D","text":"Central bank reserves back each coin issued\nDự trữ ngân hàng trung ương bảo đảm mỗi coin"}],"correctOptionId":"BC260-Q236-B","explanation":"Explanation (EN): Bitcoin has no issuer promising redemption at a fixed value. Market supply and demand determine its price, unlike a central-bank liability or some redeemable stablecoins.\nGiải thích (VI): Bitcoin không có nhà phát hành đứng ra cam kết đổi một BTC lấy giá trị cố định. Giá phụ thuộc thị trường, khác tiền gửi hoặc công cụ do tổ chức phát hành bảo đảm.\n\nPhân tích từng đáp án:\n✗ A SAI. Miner không bỏ phiếu xác định giá thị trường BTC mỗi ngày.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Không tổ chức phát hành nào cam kết mua lại theo giá cố định.\n✗ C SAI. Bitcoin không neo giá 1 USD.\n✗ D SAI. Không có dự trữ ngân hàng trung ương bảo đảm từng BTC.","source":"Bộ đề Blockchain - Câu gốc 236/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q237","chapter":3,"number":237,"question":"Why does broadcasting a transaction to many peers matter?\nVì sao phát tán giao dịch tới nhiều nút ngang hàng quan trọng?","options":[{"id":"BC260-Q237-A","text":"It hides the transaction from miners until it is final\nGiấu giao dịch khỏi thợ đào đến lúc hoàn tất"},{"id":"BC260-Q237-B","text":"It allows the sender to cancel it later\nCho phép người gửi hủy sau"},{"id":"BC260-Q237-C","text":"It converts the transaction into fiat money\nChuyển giao dịch thành tiền pháp định"},{"id":"BC260-Q237-D","text":"It spreads the transaction so all nodes can check it\nLan truyền giao dịch cho mọi nút kiểm tra"}],"correctOptionId":"BC260-Q237-D","explanation":"Explanation (EN): Broadcasting sends a candidate transaction across peers so nodes can validate and propagate it. It does not convert it to fiat or grant a guaranteed cancellation right.\nGiải thích (VI): Phát tán giao dịch qua nhiều peer giúp nhiều nút nhận, kiểm tra và chuyển tiếp nó tới thợ đào; tăng tính lan truyền của mạng. Phát tán không phải cơ chế hủy thanh toán.\n\nPhân tích từng đáp án:\n✗ A SAI. Lan truyền giao dịch không nhằm giấu dữ liệu khỏi miner.\n✗ B SAI. Sau phát tán không có quyền hủy bảo đảm.\n✗ C SAI. Truyền trên mạng không tự chuyển thành tiền pháp định.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Lan truyền giao dịch cho mọi nút kiểm tra.","source":"Bộ đề Blockchain - Câu gốc 237/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q238","chapter":1,"number":238,"question":"Which term describes a ledger whose identical copies are held by many participants?\nThuật ngữ nào chỉ sổ cái mà các bản sao đồng nhất được nhiều bên lưu giữ?","options":[{"id":"BC260-Q238-A","text":"Centralized ledger\nSổ cái tập trung"},{"id":"BC260-Q238-B","text":"General journal\nSổ nhật ký chung"},{"id":"BC260-Q238-C","text":"Distributed ledger\nSổ cái phân tán"},{"id":"BC260-Q238-D","text":"Subsidiary ledger\nSổ cái chi tiết"}],"correctOptionId":"BC260-Q238-C","explanation":"Explanation (EN): A distributed ledger has synchronized copies maintained by multiple participants. This differs from one central operator or traditional accounting books.\nGiải thích (VI): Distributed ledger là sổ cái có bản sao được duy trì ở nhiều người tham gia. Centralized ledger chỉ có một đơn vị kiểm soát bản chính.\n\nPhân tích từng đáp án:\n✗ A SAI. Sổ cái tập trung do một chủ thể quản lý.\n✗ B SAI. Nhật ký chung là sổ kế toán truyền thống.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Sổ cái phân tán.\n✗ D SAI. Sổ chi tiết không mang nghĩa mạng bản sao phân tán.","source":"Bộ đề Blockchain - Câu gốc 238/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q239","chapter":1,"number":239,"question":"From which item is a Bitcoin address derived?\nĐịa chỉ Bitcoin được dẫn xuất từ thông tin nào?","options":[{"id":"BC260-Q239-A","text":"The user's email address\nEmail người dùng"},{"id":"BC260-Q239-B","text":"The public key\nKhóa công khai"},{"id":"BC260-Q239-C","text":"The private key directly without hashing\nKhóa riêng trực tiếp, không cần băm"},{"id":"BC260-Q239-D","text":"The block number\nSố khối"}],"correctOptionId":"BC260-Q239-B","explanation":"Explanation (EN): Bitcoin addresses are derived from public-key-related data using hashing and encoding. They are not derived directly from an email address or block number.\nGiải thích (VI): Địa chỉ Bitcoin thường được tạo từ thông tin public key thông qua các bước hash và mã hóa địa chỉ. Nó không phải địa chỉ email và không cần công bố private key.\n\nPhân tích từng đáp án:\n✗ A SAI. Email không phải nguồn dẫn xuất địa chỉ Bitcoin.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Khóa công khai.\n✗ C SAI. Địa chỉ thường có bước xử lý public key, không đơn thuần lộ private key.\n✗ D SAI. Số khối không dùng tạo địa chỉ nhận.","source":"Bộ đề Blockchain - Câu gốc 239/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q240","chapter":4,"number":240,"question":"How does a CBDC differ from a cryptocurrency such as Bitcoin?\nCBDC khác tiền mã hóa như Bitcoin thế nào?","options":[{"id":"BC260-Q240-A","text":"Both are issued by central banks as legal tender\nCả hai do ngân hàng trung ương phát hành làm tiền pháp định"},{"id":"BC260-Q240-B","text":"A CBDC is a central bank liability; Bitcoin has no issuer\nCBDC là nợ của ngân hàng trung ương; Bitcoin không có tổ chức phát hành"},{"id":"BC260-Q240-C","text":"Bitcoin iS backed by government bonds\nBitcoin được trái phiếu chính phủ bảo đảm"},{"id":"BC260-Q240-D","text":"A CBDC is created by miners; Bitcoin by the central bank\nCBDC do thợ đào tạo, Bitcoin do ngân hàng trung ương tạo"}],"correctOptionId":"BC260-Q240-B","explanation":"Explanation (EN): A CBDC is a direct liability of the issuing central bank; Bitcoin has no central issuer and follows network-defined issuance. They are institutionally different instruments.\nGiải thích (VI): CBDC là nghĩa vụ tiền tệ của ngân hàng trung ương, trong khi Bitcoin không có nhà phát hành trung tâm. Hai loại khác nhau về pháp lý, niềm tin và quyền kiểm soát.\n\nPhân tích từng đáp án:\n✗ A SAI. Bitcoin không do ngân hàng trung ương phát hành.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: CBDC là nợ của ngân hàng trung ương; Bitcoin không có tổ chức phát hành.\n✗ C SAI. Bitcoin không dựa vào trái phiếu chính phủ bảo đảm.\n✗ D SAI. Đảo ngược vai trò bên phát hành CBDC và Bitcoin.","source":"Bộ đề Blockchain - Câu gốc 240/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q241","chapter":3,"number":241,"question":"A node receives a transaction that spends an output already spent in a confirmed block. What does it do?\nNút nhận giao dịch chi tiêu đầu ra đã bị chi trong khối xác nhận. Nút làm gì?","options":[{"id":"BC260-Q241-A","text":"Accepts it and adds it to the next block\nNhận rồi đưa vào khối sau"},{"id":"BC260-Q241-B","text":"Reverses the earlier confirmed transaction\nĐảo giao dịch đã xác nhận trước"},{"id":"BC260-Q241-C","text":"Forwards it to a bank for review\nChuyển tới ngân hàng xem xét"},{"id":"BC260-Q241-D","text":"Rejects it as an attempted double spend\nTừ chối vì cố gắng chi tiêu kép"}],"correctOptionId":"BC260-Q241-D","explanation":"Explanation (EN): A transaction spending an already spent confirmed UTXO violates Bitcoin's no-double-spending rule and is rejected by validating nodes.\nGiải thích (VI): Giao dịch đã tiêu UTXO được xác nhận khiến các đầu ra đó không còn tiêu được nữa. Full node nhận giao dịch tiêu lặp phải từ chối, không hỏi ngân hàng hay đảo tùy tiện lịch sử.\n\nPhân tích từng đáp án:\n✗ A SAI. UTXO đã chi không thể tiêu lần nữa trong sổ cái hợp lệ.\n✗ B SAI. Nút không có quyền đảo tùy ý giao dịch đã xác nhận.\n✗ C SAI. Bitcoin không gửi giao dịch lỗi cho ngân hàng quyết định.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Từ chối vì cố gắng chi tiêu kép.","source":"Bộ đề Blockchain - Câu gốc 241/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q242","chapter":1,"number":242,"question":"Why can blockchain reduce the need for intermediaries in transactions?\nVì sao blockchain giảm nhu cầu trung gian khi giao dịch?","options":[{"id":"BC260-Q242-A","text":"It forces users to reveal their identity to all\nBuộc người dùng tiết lộ danh tính"},{"id":"BC260-Q242-B","text":"It stores data on paper ledgers\nLưu dữ liệu trong sổ giấy"},{"id":"BC260-Q242-C","text":"It requires a bank to approve every transaction\nCần ngân hàng phê duyệt mọi giao dịch"},{"id":"BC260-Q242-D","text":"Parties share one verified record, not a middleman\nCác bên chia sẻ bản ghi đã xác minh thay vì trung gian"}],"correctOptionId":"BC260-Q242-D","explanation":"Explanation (EN): Blockchain shares transaction history and uses cryptographic verification and consensus to reduce reliance on reconciliation intermediaries. It does not remove all institutions from every application.\nGiải thích (VI): Sổ cái chung được các bên xác minh giúp họ giao dịch dựa trên một nguồn dữ liệu nhất quán, giảm phụ thuộc bên trung gian đối soát. Blockchain không thay thế mọi yêu cầu luật pháp hay kiểm soát nội bộ.\n\nPhân tích từng đáp án:\n✗ A SAI. Blockchain không buộc mọi người công khai danh tính.\n✗ B SAI. Blockchain không chỉ là sổ giấy.\n✗ C SAI. Không cần ngân hàng kiểm duyệt mọi giao dịch.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Các bên chia sẻ bản ghi đã xác minh thay vì trung gian.","source":"Bộ đề Blockchain - Câu gốc 242/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q243","chapter":1,"number":243,"question":"What is the main weakness of a single point of failure in a centralized ledger?\nĐiểm yếu chính của “điểm lỗi đơn lẻ” trong sổ cái tập trung là gì?","options":[{"id":"BC260-Q243-A","text":"Every user can change the records at any time\nMọi người dùng có thể sửa mọi bản ghi"},{"id":"BC260-Q243-B","text":"One attack or outage can stop the whole system\nMột vụ tấn công hay mất điện có thể dừng cả hệ thống"},{"id":"BC260-Q243-C","text":"Transactions take ten minutes to be confirmed\nGiao dịch mất 10 phút mới xác nhận"},{"id":"BC260-Q243-D","text":"Records are copied to too many locations\nBản ghi được sao chép quá nhiều nơi"}],"correctOptionId":"BC260-Q243-B","explanation":"Explanation (EN): A central database can have one critical point whose failure disrupts the entire service. Replication across independent nodes reduces this type of vulnerability.\nGiải thích (VI): Điểm lỗi đơn nghĩa là máy chủ/kho dữ liệu chính bị tấn công hoặc gián đoạn có thể làm cả hệ thống ngừng hoạt động. Sổ cái phân tán giảm phụ thuộc vào một điểm như vậy.\n\nPhân tích từng đáp án:\n✗ A SAI. Sổ tập trung không cho mọi người sửa tự do theo định nghĩa.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Một vụ tấn công hay mất điện có thể dừng cả hệ thống.\n✗ C SAI. Bitcoin có mục tiêu 10 phút, không phải đặc tính mọi sổ tập trung.\n✗ D SAI. Quá ít bản sao mới làm tăng điểm lỗi đơn lẻ.","source":"Bộ đề Blockchain - Câu gốc 243/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q244","chapter":1,"number":244,"question":"Which value in the block header summarizes all transactions in the block?\nGiá trị nào trong phần đầu khối tóm tắt tất cả giao dịch trong khối?","options":[{"id":"BC260-Q244-A","text":"The version\nPhiên bản"},{"id":"BC260-Q244-B","text":"The Merkle root\nMerkle root (gốc Merkle)"},{"id":"BC260-Q244-C","text":"The nonce\nNonce"},{"id":"BC260-Q244-D","text":"The block size\nKích thước khối"}],"correctOptionId":"BC260-Q244-B","explanation":"Explanation (EN): The Merkle root summarizes transaction hashes inside the block header. The nonce, version and size fields have different functions.\nGiải thích (VI): Merkle root là giá trị băm tổng hợp tất cả giao dịch trong khối, nằm trong block header. Nonce phục vụ thử PoW, version chỉ phiên bản, block size là kích thước.\n\nPhân tích từng đáp án:\n✗ A SAI. Số phiên bản biểu thị quy tắc/định dạng.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Merkle root (gốc Merkle).\n✗ C SAI. Nonce dùng để thử tìm hash hợp lệ trong PoW.\n✗ D SAI. Kích thước khối không tóm tắt nội dung giao dịch bằng hash.","source":"Bộ đề Blockchain - Câu gốc 244/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q245","chapter":3,"number":245,"question":"A node receives a transaction that spends an output already spent in a confirmed block. What does it do?\nNút nhận giao dịch chi tiêu đầu ra đã bị chi trong khối xác nhận. Nút làm gì?","options":[{"id":"BC260-Q245-A","text":"Forwards it to a bank for review\nChuyển tới ngân hàng xem xét"},{"id":"BC260-Q245-B","text":"Accepts it and adds it to the next block\nNhận rồi đưa vào khối sau"},{"id":"BC260-Q245-C","text":"Reverses the earlier confirmed transaction\nĐảo giao dịch đã xác nhận trước"},{"id":"BC260-Q245-D","text":"Rejects it as an attempted double spend\nTừ chối vì cố gắng chi tiêu kép"}],"correctOptionId":"BC260-Q245-D","explanation":"Explanation (EN): A transaction spending an already spent confirmed UTXO violates Bitcoin's no-double-spending rule and is rejected by validating nodes.\nGiải thích (VI): Giao dịch đã tiêu UTXO được xác nhận khiến các đầu ra đó không còn tiêu được nữa. Full node nhận giao dịch tiêu lặp phải từ chối, không hỏi ngân hàng hay đảo tùy tiện lịch sử.\n\nPhân tích từng đáp án:\n✗ A SAI. Bitcoin không gửi giao dịch lỗi cho ngân hàng quyết định.\n✗ B SAI. UTXO đã chi không thể tiêu lần nữa trong sổ cái hợp lệ.\n✗ C SAI. Nút không có quyền đảo tùy ý giao dịch đã xác nhận.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Từ chối vì cố gắng chi tiêu kép.","source":"Bộ đề Blockchain - Câu gốc 245/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q246","chapter":3,"number":246,"question":"What happens to a new Bitcoin transaction before it becomes part of the ledger?\nGiao dịch Bitcoin mới trải qua quá trình gì trước khi vào sổ cái?","options":[{"id":"BC260-Q246-A","text":"It is sent directly to the receiver' s bank account\nGửi trực tiếp vào tài khoản ngân hàng người nhận"},{"id":"BC260-Q246-B","text":"It is broadcast, validated by nodes and grouped into a block\nPhát tán, được nút xác minh và gom vào khối"},{"id":"BC260-Q246-C","text":"It is printed and signed by both parties\nIn giấy để hai bên ký"},{"id":"BC260-Q246-D","text":"It is approved by the sender's bank and then posted to the ledger\nNgân hàng người gửi phê duyệt rồi ghi sổ"}],"correctOptionId":"BC260-Q246-B","explanation":"Explanation (EN): Before entering a block, a Bitcoin transaction is broadcast to peers, checked against validity rules, and selected for a block. Banks do not approve it in the normal protocol flow.\nGiải thích (VI): Giao dịch mới được phát tán, nút kiểm tra chữ ký/UTXO, rồi thợ đào tập hợp vào khối; sau khi khối hợp lệ được đồng thuận, giao dịch có xác nhận. Không cần ký giấy hoặc ngân hàng duyệt.\n\nPhân tích từng đáp án:\n✗ A SAI. Bitcoin không gửi thẳng vào tài khoản ngân hàng.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Phát tán, được nút xác minh và gom vào khối.\n✗ C SAI. Giao dịch được ký bằng số, không cần in giấy.\n✗ D SAI. Không cần ngân hàng người gửi phê duyệt.","source":"Bộ đề Blockchain - Câu gốc 246/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q247","chapter":2,"number":247,"question":"What happens if a user loses the only copy of their private key and backup phrase?\nNếu người dùng mất bản duy nhất của khóa riêng và seed phrase, điều gì xảy ra?","options":[{"id":"BC260-Q247-A","text":"The network sends a new key to the user\nMạng gửi cho người dùng khóa mới"},{"id":"BC260-Q247-B","text":"A bank can reset the key on request\nNgân hàng đặt lại khóa theo yêu cầu"},{"id":"BC260-Q247-C","text":"The coins return to the miner who created them\nCoin trả về thợ đào đã tạo"},{"id":"BC260-Q247-D","text":"The funds can no longer be spent by anyone\nKhông ai còn khả năng chi số tiền đó"}],"correctOptionId":"BC260-Q247-D","explanation":"Explanation (EN): Losing the only private-key or seed backup generally makes the associated Bitcoin permanently unspendable by the owner. No central bank can reset Bitcoin's private keys.\nGiải thích (VI): Nếu mất cả private key và bản sao seed phrase duy nhất, người dùng có thể vĩnh viễn mất khả năng chi tiêu tài sản. Blockchain không có tổng đài cấp lại khóa riêng.\n\nPhân tích từng đáp án:\n✗ A SAI. Mạng không có trung tâm cấp khóa mới cho ví tự quản.\n✗ B SAI. Ngân hàng không thể đặt lại khóa cá nhân Bitcoin.\n✗ C SAI. Coin không tự trả về miner.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Không ai còn khả năng chi số tiền đó.","source":"Bộ đề Blockchain - Câu gốc 247/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q248","chapter":4,"number":248,"question":"A real estate firm splits ownership of a building into digital tokens for many investors. What is this an example of?\nDoanh nghiệp bất động sản chia quyền sở hữu một tòa nhà thành nhiều token cho nhà đầu tư. Đây là ví dụ gì?","options":[{"id":"BC260-Q248-A","text":"Tokenization of real-world assets\nToken hóa tài sản thế giới thực"},{"id":"BC260-Q248-B","text":"Creating an algorithmic stablecoin\nTạo stablecoin thuật toán"},{"id":"BC260-Q248-C","text":"Mining a new cryptocurrency\nĐào tiền mã hóa mới"},{"id":"BC260-Q248-D","text":"Issuing a central bank digital currencY\nPhát hành CBDC"}],"correctOptionId":"BC260-Q248-A","explanation":"Explanation (EN): Representing fractional rights in a building with blockchain tokens is tokenization of a real-world asset. Token issuance does not automatically grant legally enforceable property rights.\nGiải thích (VI): Chia quyền sở hữu tòa nhà thành các đơn vị token là tokenization tài sản thực (RWA). Token có thể đại diện quyền lợi đầu tư, chịu yêu cầu pháp lý phù hợp.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Token hóa tài sản thế giới thực.\n✗ B SAI. Token hóa bất động sản không tạo stablecoin thuật toán.\n✗ C SAI. Chia quyền sở hữu không phải mining.\n✗ D SAI. Token bất động sản không phải CBDC phát hành bởi ngân hàng trung ương.","source":"Bộ đề Blockchain - Câu gốc 248/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q249","chapter":1,"number":249,"question":"Why do private blockchains usually process transactions faster than public ones?\nVì sao blockchain riêng thường xử lý giao dịch nhanh hơn blockchain công khai?","options":[{"id":"BC260-Q249-A","text":"They store no transaction data on any node\nKhông nút nào lưu dữ liệu giao dịch"},{"id":"BC260-Q249-B","text":"They use no cryptography at all\nHoàn toàn không sử dụng mật mã"},{"id":"BC260-Q249-C","text":"Fewer, known participants simplify validation\nÍt người tham gia, biết danh tính, xác minh đơn giản hơn"},{"id":"BC260-Q249-D","text":"They are not connected to any computer\nKhông kết nối với máy tính nào"}],"correctOptionId":"BC260-Q249-C","explanation":"Explanation (EN): Permissioned private chains can validate with fewer known participants and lighter governance overhead, often improving throughput. Speed depends on the particular architecture and consensus design.\nGiải thích (VI): Mạng private thường có ít người xác thực đã biết và các quy trình đồng thuận đơn giản hơn, nên độ trễ có thể thấp. Đổi lại, nó có thể giảm tính mở và mức chống kiểm duyệt.\n\nPhân tích từng đáp án:\n✗ A SAI. Blockchain riêng vẫn phải lưu giao dịch phù hợp.\n✗ B SAI. Blockchain vẫn có thể dùng mật mã và chữ ký.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Ít người tham gia, biết danh tính, xác minh đơn giản hơn.\n✗ D SAI. Các nút private blockchain vẫn là máy tính kết nối.","source":"Bộ đề Blockchain - Câu gốc 249/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q250","chapter":1,"number":250,"question":"What is a block in a blockchain?\nKhối trong blockchain là gì?","options":[{"id":"BC260-Q250-A","text":"A node that stores the ledger\nNút lưu sổ cái"},{"id":"BC260-Q250-B","text":"A single user's account balance\nSố dư tài khoản một người dùng"},{"id":"BC260-Q250-C","text":"A unit of cryptocurrency held in a wallet\nĐơn vị tiền mã hóa trong ví"},{"id":"BC260-Q250-D","text":"A group of validated transactions plus a header\nNhóm giao dịch được xác minh cùng phần đầu khối"}],"correctOptionId":"BC260-Q250-D","explanation":"Explanation (EN): A block combines validated transaction data with a header containing metadata such as the previous block hash and Merkle root. It is neither a wallet nor a node.\nGiải thích (VI): Khối Bitcoin gồm header chứa thông tin như previous hash, Merkle root, timestamp, bits, nonce và phần danh sách giao dịch. Một khối không chỉ là số dư của một người dùng.\n\nPhân tích từng đáp án:\n✗ A SAI. Nút là máy tham gia mạng, không phải tập giao dịch.\n✗ B SAI. Khối không đơn thuần là số dư một người.\n✗ C SAI. Đơn vị tiền trong ví không phải khối.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Nhóm giao dịch được xác minh cùng phần đầu khối.","source":"Bộ đề Blockchain - Câu gốc 250/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q251","chapter":1,"number":251,"question":"What is the main trade-off between hot and cold wallets?\nĐánh đổi chính giữa ví nóng và ví lạnh là gì?","options":[{"id":"BC260-Q251-A","text":"Hot wallets are offline and harder to use\nVí nóng luôn ngoại tuyến và khó dùng"},{"id":"BC260-Q251-B","text":"Hot wallets are handy but more exposed to attacks\nVí nóng tiện nhưng dễ bị tấn công hơn"},{"id":"BC260-Q251-C","text":"Cold wallets are faster but cannot store keys\nVí lạnh nhanh hơn nhưng không lưu được khóa"},{"id":"BC260-Q251-D","text":"Cold wallets charge higher fees on every payment\nVí lạnh tính phí cao hơn ở mọi lần trả"}],"correctOptionId":"BC260-Q251-B","explanation":"Explanation (EN): Hot wallets are convenient for frequent spending but internet exposure increases attack risk. Cold wallets keep keys offline but may be less convenient for immediate transactions.\nGiải thích (VI): Hot wallet tiện cho giao dịch thường xuyên nhưng kết nối trực tuyến khiến nó dễ tiếp xúc với tấn công hơn. Cold wallet ít kết nối hơn nhưng thao tác chi tiêu kém thuận tiện.\n\nPhân tích từng đáp án:\n✗ A SAI. Ví nóng thường có kết nối mạng, không phải offline.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Ví nóng tiện nhưng dễ bị tấn công hơn.\n✗ C SAI. Ví lạnh chính là thiết bị giữ khóa ngoại tuyến.\n✗ D SAI. Phí Bitcoin không phụ thuộc trực tiếp ví lạnh.","source":"Bộ đề Blockchain - Câu gốc 251/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q252","chapter":3,"number":252,"question":"Minh holds UTXOs of 1 BTC, 2 BTC and 3 BTC and must pay 4 BTC. Which choice can fund the payment?\nMinh có UTXO 1, 2 và 3 BTC, cần trả 4 BTC. Phương án nào đủ tiền?","options":[{"id":"BC260-Q252-A","text":"Combine the 2 BTC and 3 BTC UTXOs\nGộp UTXO 2 BTC và 3 BTC"},{"id":"BC260-Q252-B","text":"Split the 2 BTC UTXO in half\nChia đôi UTXO 2 BTC"},{"id":"BC260-Q252-C","text":"Use only the 3 BTC UTXO\nChỉ dùng UTXO 3 BTC"},{"id":"BC260-Q252-D","text":"Use part of the 1 BTC UTXO\nDùng một phần UTXO 1 BTC"}],"correctOptionId":"BC260-Q252-A","explanation":"Explanation (EN): The 2 BTC and 3 BTC UTXOs total 5 BTC, enough to pay 4 BTC and any fee within the 1 BTC remainder. A single 3 BTC UTXO cannot fund a 4 BTC payment.\nGiải thích (VI): Để trả 4 BTC, Minh có thể sử dụng các UTXO 2 BTC và 3 BTC, tạo đầu ra thanh toán và hoàn lại phần dư sau phí. UTXO 3 BTC riêng lẻ không đủ.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Gộp UTXO 2 BTC và 3 BTC.\n✗ B SAI. Chia nhỏ UTXO 2 BTC không đủ tổng 4 BTC.\n✗ C SAI. 3 BTC đơn lẻ thấp hơn khoản phải trả.\n✗ D SAI. Không thể chỉ tiêu một phần UTXO 1 BTC để thanh toán 4 BTC.","source":"Bộ đề Blockchain - Câu gốc 252/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q253","chapter":2,"number":253,"question":"Why is Proof of Work said to secure the network?\nVì sao Proof of Work được cho là bảo vệ mạng?","options":[{"id":"BC260-Q253-A","text":"Rewriting history would cost enormous computing power\nViết lại lịch sử sẽ tốn lượng tính toán khổng lồ"},{"id":"BC260-Q253-B","text":"It hides all transactions from the public\nGiấu mọi giao dịch khỏi công chúng"},{"id":"BC260-Q253-C","text":"It lets a central authority block attackers\nCho cơ quan trung tâm chặn kẻ tấn công"},{"id":"BC260-Q253-D","text":"It makes every transaction free of charge for users\nKhiến mọi giao dịch miễn phí"}],"correctOptionId":"BC260-Q253-A","explanation":"Explanation (EN): Proof of Work makes history rewrites computationally expensive. Security rests on the cost and cumulative work rather than censorship or fee elimination.\nGiải thích (VI): Proof of Work đòi chi phí tính toán thực để tạo và viết lại lịch sử khối, khiến tấn công tốn kém. Nó không dùng một nhà quản trị trung tâm cấp phép từng giao dịch.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Viết lại lịch sử sẽ tốn lượng tính toán khổng lồ.\n✗ B SAI. Giao dịch trên Bitcoin thường minh bạch.\n✗ C SAI. PoW không trao quyền kiểm duyệt cho một trung tâm.\n✗ D SAI. PoW không bảo đảm giao dịch miễn phí.","source":"Bộ đề Blockchain - Câu gốc 253/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q254","chapter":2,"number":254,"question":"In Proof of Stake, what is mainly used to select validators?\nTrong Proof of Stake, chủ yếu dựa vào điều gì để chọn validator?","options":[{"id":"BC260-Q254-A","text":"Their personal identity documents\nGiấy tờ nhận dạng cá nhân"},{"id":"BC260-Q254-B","text":"The amount of coins they lock up as stake\nLượng coin khóa làm stake"},{"id":"BC260-Q254-C","text":"The speed of their internet connection\nTốc độ Internet"},{"id":"BC260-Q254-D","text":"The amount of electricity they consume\nĐiện năng họ tiêu thụ"}],"correctOptionId":"BC260-Q254-B","explanation":"Explanation (EN): Proof of Stake generally selects validators in relation to their committed stake, with randomness and other protocol rules. It does not primarily select by electricity consumption or ID documents.\nGiải thích (VI): Trong PoS, mức tài sản stake được khóa cùng quy tắc chọn và phạt ảnh hưởng cơ hội xác thực. Tài liệu nhấn mạnh lượng coin stake, không phải điện năng hay giấy tờ cá nhân.\n\nPhân tích từng đáp án:\n✗ A SAI. Giấy tờ tùy thân không tự tạo quyền xác thực PoS.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Lượng coin khóa làm stake.\n✗ C SAI. Tốc độ Internet không phải đại lượng stake chính.\n✗ D SAI. Tiêu thụ điện là cơ chế PoW, không phải tiêu chí chính PoS.","source":"Bộ đề Blockchain - Câu gốc 254/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q255","chapter":1,"number":255,"question":"Two users hold equal coins in a PoS network, but only one locks them as stake. Who can earn validation rewards?\nHai người có số coin bằng nhau trên mạng PoS nhưng chỉ một người khóa làm stake. Ai có thể nhận thưởng xác thực?","options":[{"id":"BC260-Q255-A","text":"The user who locks coins as stake\nNgười khóa coin để stake"},{"id":"BC260-Q255-B","text":"Neither, since only miners earn rewards\nKhông ai vì chỉ thợ đào được thưởng"},{"id":"BC260-Q255-C","text":"Both users receive equal rewards\nHai người nhận thưởng ngang nhau"},{"id":"BC260-Q255-D","text":"The user who keeps coins on an exchange\nNgười giữ coin trên sàn"}],"correctOptionId":"BC260-Q255-A","explanation":"Explanation (EN): In Proof of Stake, a user generally must commit eligible coins as stake to participate in validation rewards. Merely holding equal unstaked balances does not automatically grant rewards.\nGiải thích (VI): Trong PoS, chỉ người thực sự stake theo giao thức và được chọn xác thực mới có cơ hội nhận thưởng, không phải ai có số dư bằng nhau cũng tự có thưởng.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Người khóa coin để stake.\n✗ B SAI. PoS có validator, không chỉ thợ đào PoW.\n✗ C SAI. Chỉ người stake đủ điều kiện mới có thể nhận thưởng xác thực.\n✗ D SAI. Giữ coin ở sàn không tự đồng nghĩa stake hợp lệ.","source":"Bộ đề Blockchain - Câu gốc 255/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q256","chapter":1,"number":256,"question":"A country's central bank expands the money supply during a crisis. Why could Bitcoin not do the same?\nNgân hàng trung ương mở rộng cung tiền trong khủng hoảng. Vì sao Bitcoin không thể làm tương tự?","options":[{"id":"BC260-Q256-A","text":"Bitcoin is controlled by the IMF\nBitcoin do IMF kiểm soát"},{"id":"BC260-Q256-B","text":"Bitcoin has no miners to create new coins\nBitcoin không có thợ đào tạo coin mới"},{"id":"BC260-Q256-C","text":"Its issuance schedule is fixed in the protocol\nLịch phát hành cố định trong giao thức"},{"id":"BC260-Q256-D","text":"Its supply has already fully run out\nNguồn cung đã hết hoàn toàn"}],"correctOptionId":"BC260-Q256-C","explanation":"Explanation (EN): Bitcoin cannot change issuance in response to crises because its supply schedule is established by consensus protocol rules. Its total supply has not yet all been mined.\nGiải thích (VI): Bitcoin không thể tăng phát hành tùy tình huống khủng hoảng như ngân hàng trung ương vì phần thưởng và lịch cung được ràng buộc bởi quy tắc đồng thuận hiện hành.\n\nPhân tích từng đáp án:\n✗ A SAI. IMF không điều hành chính sách cung Bitcoin.\n✗ B SAI. Miner vẫn tạo BTC theo lịch trợ cấp.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Lịch phát hành cố định trong giao thức.\n✗ D SAI. Nguồn cung tối đa chưa được khai thác hết ngay.","source":"Bộ đề Blockchain - Câu gốc 256/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q257","chapter":4,"number":257,"question":"How does a CBDC differ from a cryptocurrency such as Bitcoin?\nCBDC khác tiền mã hóa như Bitcoin thế nào?","options":[{"id":"BC260-Q257-A","text":"A CBDC is a central bank liability; Bitcoin has no issuer\nCBDC là nợ của ngân hàng trung ương; Bitcoin không có tổ chức phát hành"},{"id":"BC260-Q257-B","text":"A CBDC is created by miners; Bitcoin by the central bank\nCBDC do thợ đào tạo, Bitcoin do ngân hàng trung ương tạo"},{"id":"BC260-Q257-C","text":"Both are issued by central banks as legal tender\nCả hai do ngân hàng trung ương phát hành làm tiền pháp định"},{"id":"BC260-Q257-D","text":"Bitcoin iS backed by government bonds\nBitcoin được trái phiếu chính phủ bảo đảm"}],"correctOptionId":"BC260-Q257-A","explanation":"Explanation (EN): A CBDC is a direct liability of the issuing central bank; Bitcoin has no central issuer and follows network-defined issuance. They are institutionally different instruments.\nGiải thích (VI): CBDC là nghĩa vụ tiền tệ của ngân hàng trung ương, trong khi Bitcoin không có nhà phát hành trung tâm. Hai loại khác nhau về pháp lý, niềm tin và quyền kiểm soát.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: CBDC là nợ của ngân hàng trung ương; Bitcoin không có tổ chức phát hành.\n✗ B SAI. Đảo ngược vai trò bên phát hành CBDC và Bitcoin.\n✗ C SAI. Bitcoin không do ngân hàng trung ương phát hành.\n✗ D SAI. Bitcoin không dựa vào trái phiếu chính phủ bảo đảm.","source":"Bộ đề Blockchain - Câu gốc 257/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q258","chapter":1,"number":258,"question":"Why is it safe to publish a bitcoin address, for example on an invoice?\nVì sao an toàn khi công bố địa chỉ Bitcoin trên hóa đơn?","options":[{"id":"BC260-Q258-A","text":"It is encrypted so that no one can read it\nĐược mã hóa đến mức không ai đọc được"},{"id":"BC260-Q258-B","text":"It changes automatically after being published\nTự động thay đổi sau khi công bố"},{"id":"BC260-Q258-C","text":"It lets others send funds but not spend them\nCho phép người khác gửi nhưng không thể dùng địa chỉ để chi tiền"},{"id":"BC260-Q258-D","text":"It is linked to a bank that guards the funds\nGắn với ngân hàng bảo vệ tài sản"}],"correctOptionId":"BC260-Q258-C","explanation":"Explanation (EN): A receiving address allows others to direct funds toward the owner but does not itself authorize spending. The corresponding private key remains secret.\nGiải thích (VI): Địa chỉ dùng để nhận tiền, không phải bí mật có thể ký chi tiêu. Đăng địa chỉ trên hóa đơn là phù hợp; không đăng private key hoặc seed phrase.\n\nPhân tích từng đáp án:\n✗ A SAI. Địa chỉ công khai để người khác đọc, không phải bí mật mã hóa.\n✗ B SAI. Địa chỉ có thể dùng nhiều lần, không bắt buộc đổi khi công bố.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Cho phép người khác gửi nhưng không thể dùng địa chỉ để chi tiền.\n✗ D SAI. Địa chỉ Bitcoin không phải tài khoản ngân hàng được bảo lãnh.","source":"Bộ đề Blockchain - Câu gốc 258/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q259","chapter":1,"number":259,"question":"Which type of blockchain allows anyone to join, read and validate transactions?\nLoại blockchain nào cho phép bất kỳ ai tham gia, đọc và xác minh giao dịch?","options":[{"id":"BC260-Q259-A","text":"Private blockchain\nBlockchain riêng"},{"id":"BC260-Q259-B","text":"Centralized blockchain\nBlockchain tập trung"},{"id":"BC260-Q259-C","text":"Consortium blockchain\nBlockchain liên minh"},{"id":"BC260-Q259-D","text":"Public blockchain\nBlockchain công khai"}],"correctOptionId":"BC260-Q259-D","explanation":"Explanation (EN): A public permissionless blockchain permits broad access to read and participate under network rules. Private and consortium chains restrict access or validation roles.\nGiải thích (VI): Public/permissionless blockchain cho mọi người tham gia đọc và xác minh theo quy tắc công khai. Quyền ghi khối có thể phụ thuộc cơ chế đồng thuận nhưng không do một chủ sở hữu cấp phép.\n\nPhân tích từng đáp án:\n✗ A SAI. Private chain không mở cho mọi người tham gia.\n✗ B SAI. Hệ thống tập trung không mở cho các nút xác minh tự do.\n✗ C SAI. Consortium giới hạn thành viên đã được cho phép.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Blockchain công khai.","source":"Bộ đề Blockchain - Câu gốc 259/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q260","chapter":2,"number":260,"question":"An attacker changes the amount in a signed transaction. What will nodes find when checking it?\nKẻ tấn công thay đổi số tiền trong giao dịch đã ký. Các nút sẽ phát hiện điều gì khi kiểm tra?","options":[{"id":"BC260-Q260-A","text":"The signature still matches the new amount\nChữ ký vẫn hợp lệ với số tiền mới"},{"id":"BC260-Q260-B","text":"The transaction is accepted with a warning\nGiao dịch được chấp nhận kèm cảnh báo"},{"id":"BC260-Q260-C","text":"The signature fails to match, So it is rejected\nChữ ký không khớp nên giao dịch bị từ chối"},{"id":"BC260-Q260-D","text":"The miner corrects the amount automatically\nThợ đào tự sửa lại số tiền"}],"correctOptionId":"BC260-Q260-C","explanation":"Explanation (EN): A digital signature is tied to the specific signed transaction data. If an attacker changes the amount, verification fails and the altered transaction is invalid.\nGiải thích (VI): Chữ ký số được tạo trên nội dung giao dịch cụ thể. Nếu số tiền bị sửa sau khi ký thì nội dung không khớp chữ ký, giao dịch không vượt qua kiểm tra hợp lệ.\n\nPhân tích từng đáp án:\n✗ A SAI. Thay nội dung đã ký khiến chữ ký không thể vẫn khớp.\n✗ B SAI. Giao dịch có chữ ký sai phải bị từ chối chứ không chỉ cảnh báo.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Chữ ký không khớp nên giao dịch bị từ chối.\n✗ D SAI. Miner không tự sửa số tiền để hợp thức hóa chữ ký.","source":"Bộ đề Blockchain - Câu gốc 260/260","topic":"Foundational Technologies of Blockchain","needsReview":false}];

function renderDashboard(c){const o=overall();c.innerHTML=`<h1 class="page-title">Ôn ${QUESTIONS.length} câu Blockchain</h1><p class="sub">6 chương (chương chưa có câu sẽ hiện 0), xáo câu và đáp án độc lập, tự ghi nhớ câu sai và lịch sử từng câu.</p><div class="grid">

function setupHTML(){return `<h1 class="page-title">Tạo bài ôn / bài kiểm tra</h1><p class="sub">Chế độ ôn sẽ phản hồi ngay. Nếu chọn sai, lựa chọn sai chuyển đỏ, đáp án đúng chuyển xanh và giải thích hiện ngay bên dưới.</p>${languageControls()}<div class="setup"><div class="card"><h3 class="section-title">1. Chọn chương</h3><div class="chapter-grid">${[1,2,3,4,5,6].map(ch=>`<label class="chapter-item"><input type="checkbox" class="chpick" value="${ch}" checked><span><b>Chương ${ch}</b><small style="display:block;color:var(--muted)">${esc(CHAPTERS[ch])} • ${chapterQuestions(ch).length} câu</small></span></label>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn" id="allCh">Chọn tất cả</button><button class="btn" id="noneCh">Bỏ chọn</button></div></div><div class="card"><h3 class="section-title">2. Thiết lập</h3><div class="field"><label>Chế độ</label><select id="mode"><option value="practice">Ôn tập: hiện đúng/sai + giải thích ngay</option><option value="test">Kiểm tra: nộp bài mới hiện kết quả</option></select></div><div class="field" style="margin-top:10px"><label>Số câu</label><select id="count"><option>10</option><option>20</option><option>30</option><option selected>50</option><option>100</option><option value="all">Tất cả trong phạm vi</option></select></div><label class="toggle" style="margin-top:10px"><input id="shuffleQ" type="checkbox" ${state.shuffleQ?'checked':''}> Xáo thứ tự câu hỏi</label><label class="toggle" style="margin-top:8px"><input id="shuffleA" type="checkbox" ${state.shuffleA?'checked':''}> Xáo vị trí đáp án A, B, C, D</label><div class="field" style="margin-top:10px"><label>Giới hạn thời gian toàn bài</label><select id="timerMin"><option value="0">Không giới hạn</option><option value="10">10 phút</option><option value="20">20 phút</option><option value="30">30 phút</option><option value="45">45 phút</option><option value="60">60 phút</option></select></div><button class="btn primary" style="width:100%;margin-top:14px" id="startBtn">Bắt đầu</button></div></div>`}

function questionParts(q){
 const t=String(q.question||''),i=t.indexOf('\n');
 return i<0?[t,t]:[t.slice(0,i).trim(),t.slice(i+1).trim()];
}
function questionHTML(q){const p=questionParts(q);return languageText(p[0],p[1])}
function optionParts(raw){
 const t=String(raw||'').trim(),nl=t.indexOf('\n');
 if(nl>=0)return [t.slice(0,nl).trim(),t.slice(nl+1).trim().replace(/\s*\n\s*/g,' ')];
 if(t.endsWith(')')){
  let depth=0,opening=-1;
  for(let i=t.length-1;i>=0;i--){
   if(t[i]===')')depth++;
   else if(t[i]==='('){depth--;if(depth===0){opening=i;break}}
  }
  if(opening>0 && /[\u00C0-\u1EF9]/.test(t.slice(opening+1)))
   return [t.slice(0,opening).trim(),t.slice(opening+1,-1).trim()];
 }
 const accented=t.search(/[\u00C0-\u1EF9]/);
 if(accented>=0){
  const separator=t.lastIndexOf('. ',accented);
  if(separator>0 && separator+2<accented+1)
   return [t.slice(0,separator+1).trim(),t.slice(separator+2).trim()];
 }
 const parts=t.split(/\s+/);
 if(parts.length===2 && /[\d%]/.test(parts[0]) && /[\d%]/.test(parts[1]))return parts;
 if(parts.length===3 && /^\$[\d.]+$/.test(parts[0])&&parts[2]==='USD')return [parts[0],parts.slice(1).join(' ')];
 if(parts.length%2===0){const n=parts.length/2;if(parts.slice(0,n).join(' ')===parts.slice(n).join(' '))return [parts.slice(0,n).join(' '),parts.slice(n).join(' ')];}
 return [t,t];
}
