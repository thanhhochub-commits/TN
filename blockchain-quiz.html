s":[{"id":"BC260-Q106-A","text":"A central bank digital currencY\nTiền kỹ thuật số ngân hàng trung ương"},{"id":"BC260-Q106-B","text":"A stablecoin pegged to the US dollar\nStablecoin neo USD"},{"id":"BC260-Q106-C","text":"A privacy coin using zero-knowledge proofs\nPrivacy coin dùng bằng chứng không tiết lộ tri thức"},{"id":"BC260-Q106-D","text":"A lighter, faster version of Bitcoin for payments\nPhiên bản Bitcoin nhẹ hơn và nhanh hơn cho thanh toán"}],"correctOptionId":"BC260-Q106-D","explanation":"Explanation (EN): Litecoin was developed as a Bitcoin-derived digital currency with faster target blocks and payment-oriented differences. It is not a CBDC or a dollar-pegged stablecoin.\nGiải thích (VI): Litecoin phát triển từ hướng cải tiến khả năng dùng làm phương tiện thanh toán và thời gian tạo khối ngắn hơn Bitcoin. Nó không phải stablecoin, CBDC hay đồng privacy coin chuyên dụng.\n\nPhân tích từng đáp án:\n✗ A SAI. Litecoin không do ngân hàng trung ương phát hành.\n✗ B SAI. Litecoin không neo USD.\n✗ C SAI. Không phải dự án trọng tâm chứng minh không tiết lộ tri thức.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Phiên bản Bitcoin nhẹ hơn và nhanh hơn cho thanh toán.","source":"Bộ đề Blockchain - Câu gốc 106/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q107","chapter":1,"number":107,"question":"Why is enforcing the law against crypto-related crime difficult?\nVì sao khó thực thi pháp luật với tội phạm liên quan crypto?","options":[{"id":"BC260-Q107-A","text":"Cross-border transactions need cooperation among regulators\nGiao dịch xuyên biên giới cần phối hợp giữa các cơ quan quản lý"},{"id":"BC260-Q107-B","text":"Exchanges are not allowed to keep records [cần đối chiếu ảnh gốc]\nSàn không được phép lưu hồ sơ [cần đối chiếu ảnh]"},{"id":"BC260-Q107-C","text":"Cryptocurrencies are issued by foreign governments\nTiền mã hóa do chính phủ nước ngoài phát hành"},{"id":"BC260-Q107-D","text":"All transactions are hidden from the public and police [cần đối chiếu ảnh gốc]\nMọi giao dịch đều bị che giấu khỏi công chúng và cảnh sát [cần đối chiếu ảnh]"}],"correctOptionId":"BC260-Q107-A","explanation":"Explanation (EN): Crypto transactions can cross jurisdictional borders, requiring coordination among regulators and investigators. On-chain transparency alone may not identify the people behind addresses.\nGiải thích (VI): Giao dịch crypto xuyên biên giới khiến điều tra và thực thi pháp luật cần hợp tác giữa nhiều cơ quan có thẩm quyền. Việc sổ cái công khai không đồng nghĩa luôn biết danh tính người dùng.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Giao dịch xuyên biên giới cần phối hợp giữa các cơ quan quản lý.\n✗ B SAI. Quy định lưu hồ sơ của sàn tùy pháp luật; ảnh gốc cần kiểm tra.\n✗ C SAI. Crypto không đồng loạt do chính phủ nước ngoài phát hành.\n✗ D SAI. Blockchain công khai cho phép xem giao dịch, không che tất cả.\n\n⚠ Cần đối chiếu ảnh gốc: Một lựa chọn bị che hoặc có lỗi nhận dạng.","source":"Bộ đề Blockchain - Câu gốc 107/260","topic":"Overview of Blockchain","needsReview":true},{"id":"BC260-Q108","chapter":1,"number":108,"question":"Which definition best describes a blockchain?\nĐịnh nghĩa nào mô tả blockchain đúng nhất?","options":[{"id":"BC260-Q108-A","text":"A payment card network run by major banks\nMạng thẻ thanh toán do ngân hàng lớn vận hành"},{"id":"BC260-Q108-B","text":"A cloud storage service for business documents\nDịch vụ lưu tài liệu doanh nghiệp trên đám mây"},{"id":"BC260-Q108-C","text":"A central database managed by one bank\nCơ sở dữ liệu trung tâm do một ngân hàng quản lý"},{"id":"BC260-Q108-D","text":"A distributed ledger of linked blocks of transactions\nSổ cái phân tán gồm các khối giao dịch liên kết"}],"correctOptionId":"BC260-Q108-D","explanation":"Explanation (EN): A blockchain is a distributed ledger of cryptographically linked blocks containing transactions. It is not simply one bank's private database or a cloud storage site.\nGiải thích (VI): Blockchain là sổ cái phân tán, gồm các khối giao dịch liên kết mật mã theo thứ tự. Nó khác cơ sở dữ liệu một ngân hàng hoặc đơn thuần dịch vụ lưu tài liệu trên cloud.\n\nPhân tích từng đáp án:\n✗ A SAI. Mạng thẻ ngân hàng không phản ánh chuỗi khối phi tập trung.\n✗ B SAI. Dịch vụ cloud chỉ là lưu tệp, không nhất thiết có liên kết hash và đồng thuận.\n✗ C SAI. Một ngân hàng kiểm soát là mô hình tập trung.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Sổ cái phân tán gồm các khối giao dịch liên kết.","source":"Bộ đề Blockchain - Câu gốc 108/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q109","chapter":3,"number":109,"question":"A transaction in a block is changed after the block is created. Which header value will no longer match?\nMột giao dịch trong khối bị sửa sau khi tạo khối. Giá trị nào ở phần đầu khối không còn khớp?","options":[{"id":"BC260-Q109-A","text":"The Merkle root\nMerkle root"},{"id":"BC260-Q109-B","text":"The block's position number\nSố vị trí khối"},{"id":"BC260-Q109-C","text":"The previous block's nonce\nNonce của khối trước"},{"id":"BC260-Q109-D","text":"The version number\nSố phiên bản"}],"correctOptionId":"BC260-Q109-A","explanation":"Explanation (EN): Changing a transaction changes the computed Merkle root, so the original header value no longer matches the block contents. Other header fields do not summarize transactions.\nGiải thích (VI): Thay một giao dịch sẽ làm hash cây Merkle thay đổi, nên Merkle root trong header cũ không còn đại diện đúng bộ giao dịch. Số thứ tự khối hoặc phiên bản không phải trường tổng hợp này.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Merkle root.\n✗ B SAI. Vị trí khối không tổng hợp danh sách giao dịch bằng hash.\n✗ C SAI. Nonce của khối trước không thay thế Merkle root.\n✗ D SAI. Phiên bản khối không thể phát hiện sửa dữ liệu giao dịch.","source":"Bộ đề Blockchain - Câu gốc 109/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q110","chapter":4,"number":110,"question":"Which of the following is an example of a fiat-backed stablecoin?\nLựa chọn nào là ví dụ về stablecoin được bảo đảm bằng tiền pháp định?","options":[{"id":"BC260-Q110-A","text":"USDT (Tether)\nUSDT (Tether)"},{"id":"BC260-Q110-B","text":"Bitcoin\nBitcoin"},{"id":"BC260-Q110-C","text":"Litecoin\nLitecoin"},{"id":"BC260-Q110-D","text":"Zcash\nZcash"}],"correctOptionId":"BC260-Q110-A","explanation":"Explanation (EN): USDT is a fiat-referenced stablecoin intended to track the US dollar using an issuer and reserves. Bitcoin, Litecoin and Zcash are not dollar-backed stablecoins.\nGiải thích (VI): USDT (Tether) là ví dụ stablecoin gắn mục tiêu giá với USD và dựa vào cơ chế dự trữ. BTC, LTC và Zcash không thuộc nhóm stablecoin được đảm bảo bằng USD.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: USDT (Tether).\n✗ B SAI. BTC không được bảo đảm đổi theo USD ở giá cố định.\n✗ C SAI. LTC không neo USD.\n✗ D SAI. Zcash tập trung tính riêng tư hơn ổn định giá.","source":"Bộ đề Blockchain - Câu gốc 110/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q111","chapter":2,"number":111,"question":"What is ‘mining’ in the Bitcoin network?\n“Đào” trong mạng Bitcoin là gì?","options":[{"id":"BC260-Q111-A","text":"Extracting physical coins from the ground\nĐào các đồng xu vật lý từ đất"},{"id":"BC260-Q111-B","text":"Using computing power to add blocks for rewards\nDùng sức mạnh tính toán thêm khối để nhận thưởng"},{"id":"BC260-Q111-C","text":"Lending bitcoin to others for interest\nCho người khác vay Bitcoin lấy lãi"},{"id":"BC260-Q111-D","text":"Buying bitcoin from a crypto exchange\nMua Bitcoin trên sàn"}],"correctOptionId":"BC260-Q111-B","explanation":"Explanation (EN): Mining uses computation in Proof of Work to find valid block hashes and potentially earn block rewards and fees. It does not involve extracting physical coins.\nGiải thích (VI): Bitcoin mining là việc sử dụng sức mạnh tính toán tìm lời giải Proof of Work để đề xuất khối mới, đổi lấy trợ cấp khối và phí. Nó không phải đào đồng xu vật lý hay hoạt động cho vay.\n\nPhân tích từng đáp án:\n✗ A SAI. Đào coin vật lý không phải Bitcoin mining.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Dùng sức mạnh tính toán thêm khối để nhận thưởng.\n✗ C SAI. Cho vay lấy lãi không phải giải PoW.\n✗ D SAI. Mua trên sàn khác tạo khối qua tính toán.","source":"Bộ đề Blockchain - Câu gốc 111/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q112","chapter":2,"number":112,"question":"What do miners receive for successfully adding a block?\nThợ đào nhận gì khi thêm thành công một khối?","options":[{"id":"BC260-Q112-A","text":"A share of every user's balance\nMột phần số dư của mọi người"},{"id":"BC260-Q112-B","text":"Interest paid by the central bank\nLãi do ngân hàng trung ương trả"},{"id":"BC260-Q112-C","text":"The block reward plus transaction fees\nTrợ cấp/phần thưởng khối cộng phí giao dịch"},{"id":"BC260-Q112-D","text":"Free electricity from the network\nĐiện miễn phí từ mạng"}],"correctOptionId":"BC260-Q112-C","explanation":"Explanation (EN): A winning Bitcoin miner may collect the block subsidy together with transaction fees. It does not earn a percentage of every user's balance.\nGiải thích (VI): Thợ đào tìm được khối hợp lệ nhận trợ cấp khối theo lịch phát hành cộng phí của các giao dịch chứa trong khối. Đây không phải tiền lãi do ngân hàng trung ương trả.\n\nPhân tích từng đáp án:\n✗ A SAI. Miner không tự lấy một phần số dư người dùng.\n✗ B SAI. Không do ngân hàng trung ương trả lãi.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Trợ cấp/phần thưởng khối cộng phí giao dịch.\n✗ D SAI. Mạng không cấp điện miễn phí.","source":"Bộ đề Blockchain - Câu gốc 112/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q113","chapter":1,"number":113,"question":"Several clinics share patient records and want any unauthorized change to be noticed. Which blockchain feature helps most?\nCác phòng khám chia sẻ hồ sơ bệnh nhân và muốn phát hiện sửa đổi trái phép. Tính năng blockchain nào giúp nhất?","options":[{"id":"BC260-Q113-A","text":"A single administrator with full editing rights\nMột quản trị viên duy nhất có toàn quyền sửa"},{"id":"BC260-Q113-B","text":"Hash links that make any alteration detectable\nLiên kết hash giúp phát hiện mọi sửa đổi"},{"id":"BC260-Q113-C","text":"Letting each clinic edit past entries freely\nCho mỗi phòng khám tự do sửa bản ghi cũ"},{"id":"BC260-Q113-D","text":"Deleting old records regularly to save storage\nThường xuyên xóa bản ghi cũ để tiết kiệm"}],"correctOptionId":"BC260-Q113-B","explanation":"Explanation (EN): Hash links and integrity checks make unauthorized modifications detectable to the participating nodes. They do not prove that every original medical record was accurate.\nGiải thích (VI): Liên kết hash giữa dữ liệu và các khối giúp phát hiện sửa đổi không được phép. Blockchain không thể tự bảo đảm dữ liệu bệnh án nhập ban đầu đúng; việc quản trị quyền riêng tư cần thiết kế riêng.\n\nPhân tích từng đáp án:\n✗ A SAI. Một quản trị viên toàn quyền sửa không bảo vệ tính toàn vẹn phân tán.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Liên kết hash giúp phát hiện mọi sửa đổi.\n✗ C SAI. Cho phép sửa tự do làm mất khả năng kiểm chứng lịch sử.\n✗ D SAI. Xóa dữ liệu cũ không phải cách phát hiện sửa đổi.","source":"Bộ đề Blockchain - Câu gốc 113/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q114","chapter":1,"number":114,"question":"When two valid versions of the chain exist, which one does the network usually accept?\nKhi có hai phiên bản chuỗi đều hợp lệ, mạng thường chấp nhận chuỗi nào?","options":[{"id":"BC260-Q114-A","text":"The chain created first by any node\nChuỗi được bất kỳ nút nào tạo trước"},{"id":"BC260-Q114-B","text":"The chain with the most accumulated work\nChuỗi có tổng công việc tích lũy lớn nhất"},{"id":"BC260-Q114-C","text":"The chain chosen by the largest bank\nChuỗi do ngân hàng lớn nhất chọn"},{"id":"BC260-Q114-D","text":"The chain with the fewest transactions\nChuỗi ít giao dịch nhất"}],"correctOptionId":"BC260-Q114-B","explanation":"Explanation (EN): Bitcoin nodes prefer the valid chain with the greatest accumulated Proof-of-Work difficulty, not simply whichever fork appeared first or contains the fewest transactions.\nGiải thích (VI): Trong Bitcoin, chọn chuỗi hợp lệ có tổng công việc tích lũy nhiều nhất, không đơn thuần khối tạo sớm nhất hoặc có ít giao dịch. Đây là nguyên tắc giải quyết fork tạm thời.\n\nPhân tích từng đáp án:\n✗ A SAI. Thời điểm tạo trước không quyết định chuỗi có tổng công việc lớn nhất.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Chuỗi có tổng công việc tích lũy lớn nhất.\n✗ C SAI. Không có ngân hàng được quyền chọn nhánh Bitcoin.\n✗ D SAI. Số giao dịch ít không xác định lượng PoW tích lũy.","source":"Bộ đề Blockchain - Câu gốc 114/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q115","chapter":3,"number":115,"question":"How does the UTXO model differ from the account-based model?\nMô hình UTXO khác mô hình dựa trên tài khoản ra sao?","options":[{"id":"BC260-Q115-A","text":"Both track account balances in the same way\nCả hai theo dõi số dư giống nhau"},{"id":"BC260-Q115-B","text":"UTXO tracks balances 'the account model tracks outputs\nUTXO theo dõi số dư; tài khoản theo dõi đầu ra"},{"id":"BC260-Q115-C","text":"UTXO tracks unspent outputs; the account model tracks balances\nUTXO theo dõi đầu ra chưa tiêu; tài khoản theo dõi số dư"},{"id":"BC260-Q115-D","text":"UTXO is used only by banks for internal settlement records\nUTXO chỉ được ngân hàng dùng quyết toán nội bộ"}],"correctOptionId":"BC260-Q115-C","explanation":"Explanation (EN): Bitcoin's UTXO model tracks discrete unspent outputs. Account-based systems instead update balances associated with accounts; the two methods must not be reversed.\nGiải thích (VI): UTXO ghi nhận các đầu ra chưa tiêu và cho phép tiêu từng đầu ra đúng một lần; mô hình account-based theo dõi và cập nhật số dư tài khoản. Không được đảo hai mô hình.\n\nPhân tích từng đáp án:\n✗ A SAI. Hai mô hình cập nhật trạng thái theo cách khác nhau.\n✗ B SAI. Đảo vai trò UTXO và account-based.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: UTXO theo dõi đầu ra chưa tiêu; tài khoản theo dõi số dư.\n✗ D SAI. UTXO không giới hạn trong hệ thống ngân hàng.","source":"Bộ đề Blockchain - Câu gốc 115/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q116","chapter":1,"number":116,"question":"Which problem of digital cash did Bitcoin solve without relying on a trusted third party?\nBitcoin đã giải quyết vấn đề nào của tiền số mà không cần bên thứ ba đáng tin cậy?","options":[{"id":"BC260-Q116-A","text":"The problem of high transaction fees\nVấn đề phí giao dịch cao"},{"id":"BC260-Q116-B","text":"The problem of paper banknote forgery\nVấn đề tiền giấy giả"},{"id":"BC260-Q116-C","text":"The problem of currency exchange rates\nVấn đề tỷ giá hối đoái"},{"id":"BC260-Q116-D","text":"The double-spending problem\nVấn đề chi tiêu kép"}],"correctOptionId":"BC260-Q116-D","explanation":"Explanation (EN): Bitcoin addresses the double-spending problem without a central clearing party by validating spends and reaching consensus on transaction history.\nGiải thích (VI): Bitcoin giải quyết bài toán chi tiêu kép của tiền số không cần bên thứ ba đáng tin cậy, nhờ xác minh chữ ký, UTXO và thống nhất lịch sử giao dịch qua PoW.\n\nPhân tích từng đáp án:\n✗ A SAI. Phí là vấn đề hiệu quả, không phải chi tiêu kép.\n✗ B SAI. Tiền giả giấy khác tiền số chi trùng.\n✗ C SAI. Tỷ giá không phải bài toán sử dụng một UTXO hai lần.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Vấn đề chi tiêu kép.","source":"Bộ đề Blockchain - Câu gốc 116/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q117","chapter":1,"number":117,"question":"Lan wants to move her savings from an exchange account into a wallet she fully controls. Which option achieves this?\nLan muốn chuyển tiền từ sàn sang ví do mình hoàn toàn kiểm soát. Lựa chọn nào đáp ứng?","options":[{"id":"BC260-Q117-A","text":"A non-custodial wallet where she holds the keys\nVí không lưu ký do cô ấy tự giữ khóa"},{"id":"BC260-Q117-B","text":"A screenshot of her current exchange balance\nẢnh chụp số dư trên sàn"},{"id":"BC260-Q117-C","text":"A second account ata different exchange\nTài khoản thứ hai ở sàn khác"},{"id":"BC260-Q117-D","text":"A wallet whose keys are kept by the exchange\nVí có khóa do sàn giữ"}],"correctOptionId":"BC260-Q117-A","explanation":"Explanation (EN): A non-custodial wallet puts private keys under the user's control. Moving between exchange accounts alone does not establish self-custody.\nGiải thích (VI): Non-custodial wallet cho phép người dùng tự giữ private key/seed phrase, kiểm soát trực tiếp khả năng chi tiêu. Chuyển sang tài khoản sàn khác không thay đổi bản chất lưu ký.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Ví không lưu ký do cô ấy tự giữ khóa.\n✗ B SAI. Ảnh số dư không chuyển quyền quản lý private key.\n✗ C SAI. Đổi sàn không thành tự lưu ký.\n✗ D SAI. Ví do sàn giữ khóa vẫn là custodial.","source":"Bộ đề Blockchain - Câu gốc 117/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q118","chapter":4,"number":118,"question":"A business wants to pay overseas suppliers in crypto without exposure to large price swings. Which asset suits best?\nMột doanh nghiệp muốn trả tiền mã hóa cho nhà cung cấp nước ngoài nhưng tránh biến động giá lớn. Tài sản nào phù hợp nhất?","options":[{"id":"BC260-Q118-A","text":"A fiat-backed stablecoin\nStablecoin được bảo đảm bằng tiền pháp định"},{"id":"BC260-Q118-B","text":"A newly launched altcoin\nAltcoin mới ra mắt"},{"id":"BC260-Q118-C","text":"Bitcoin\nBitcoin"},{"id":"BC260-Q118-D","text":"An NFT\nNFT"}],"correctOptionId":"BC260-Q118-A","explanation":"Explanation (EN): A fiat-backed stablecoin targets a value close to the referenced currency, making it more useful for reducing price volatility than Bitcoin, speculative altcoins, or NFTs. Peg and reserve risks still remain.\nGiải thích (VI): Doanh nghiệp muốn hạn chế biến động tỷ giá crypto thường chọn stablecoin được bảo chứng bằng tiền pháp định. Cần nhớ stablecoin vẫn có rủi ro dự trữ và mất neo giá, không phải bảo đảm tuyệt đối.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Stablecoin được bảo đảm bằng tiền pháp định.\n✗ B SAI. Altcoin mới thường có biến động lớn.\n✗ C SAI. Bitcoin biến động giá đáng kể.\n✗ D SAI. NFT không nhằm duy trì giá trị ổn định để thanh toán.","source":"Bộ đề Blockchain - Câu gốc 118/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q119","chapter":4,"number":119,"question":"What is a stablecoin?\nStablecoin là gì?","options":[{"id":"BC260-Q119-A","text":"A coin whose price is fixed by its miners\nGiá coin được thợ đào cố định"},{"id":"BC260-Q119-B","text":"A coin that can never be traded or transferred\nCoin không bao giờ được mua bán hay chuyển"},{"id":"BC260-Q119-C","text":"A cryptocurrency designed to keep a stable value\nTiền mã hóa được thiết kế duy trì giá trị ổn định"},{"id":"BC260-Q119-D","text":"The digital currency issued by a central bank\nTiền số do ngân hàng trung ương phát hành"}],"correctOptionId":"BC260-Q119-C","explanation":"Explanation (EN): A stablecoin is designed to maintain a relatively stable reference value, often by tracking a currency. This design goal is not a guarantee that its peg cannot fail.\nGiải thích (VI): Stablecoin là tài sản mã hóa được thiết kế để bám theo một giá trị mục tiêu, thường là đồng tiền pháp định. 'Được thiết kế ổn định' không có nghĩa chắc chắn không bao giờ mất neo.\n\nPhân tích từng đáp án:\n✗ A SAI. Thợ đào không cố định giá bằng quy tắc đồng thuận.\n✗ B SAI. Stablecoin vẫn có thể được chuyển nhượng và giao dịch.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Tiền mã hóa được thiết kế duy trì giá trị ổn định.\n✗ D SAI. CBDC là tiền số của ngân hàng trung ương.","source":"Bộ đề Blockchain - Câu gốc 119/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q120","chapter":1,"number":120,"question":"Why do regulators classify cryptoassets before applying rules?\nVì sao cơ quan quản lý phân loại tài sản crypto trước khi áp dụng quy tắc?","options":[{"id":"BC260-Q120-A","text":"Different types carry different rights and risks\nCác nhóm tài sản có quyền lợi và rủi ro khác nhau"},{"id":"BC260-Q120-B","text":"Classification sets the price of each token\nViệc phân loại đặt giá token"},{"id":"BC260-Q120-C","text":"It determines which miner earns the reward\nQuyết định thợ đào nào nhận thưởng"},{"id":"BC260-Q120-D","text":"All crypto assets must be banned equally\nMọi tài sản crypto phải bị cấm như nhau"}],"correctOptionId":"BC260-Q120-A","explanation":"Explanation (EN): Different cryptoassets can confer very different legal rights and risks, so regulators classify them before deciding appropriate treatment. Classification is not price-setting.\nGiải thích (VI): Phân loại cryptoasset giúp xác định quyền lợi và rủi ro pháp lý khác nhau: token thanh toán, tiện ích, đầu tư hay stablecoin có thể chịu chế độ quản lý khác. Phân loại không ấn định giá thị trường.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Các nhóm tài sản có quyền lợi và rủi ro khác nhau.\n✗ B SAI. Phân loại không đặt giá thị trường token.\n✗ C SAI. Thợ đào nhận thưởng theo đồng thuận, không theo loại tài sản pháp lý.\n✗ D SAI. Không có nguyên tắc mọi tài sản crypto đều bị cấm như nhau.","source":"Bộ đề Blockchain - Câu gốc 120/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q121","chapter":2,"number":121,"question":"A government wants to reduce the environmental impact of a national blockchain. Which consensus choice fits best?\nChính phủ muốn giảm tác động môi trường của blockchain quốc gia. Nên chọn cơ chế đồng thuận nào?","options":[{"id":"BC260-Q121-A","text":"Proof of Work with more miners\nPoW với nhiều thợ đào hơn"},{"id":"BC260-Q121-B","text":"Solo mining by every citizen\nMỗi người dân tự đào riêng"},{"id":"BC260-Q121-C","text":"Proof of Stake\nPoS (bằng chứng cổ phần)"},{"id":"BC260-Q121-D","text":"Proof of Work with lower difficulty only\nPoW chỉ với độ khó thấp hơn"}],"correctOptionId":"BC260-Q121-C","explanation":"Explanation (EN): Proof of Stake usually requires much less energy than Proof of Work because it does not run a continuous hash-power race. Security and governance trade-offs still need assessment.\nGiải thích (VI): Proof of Stake thường sử dụng ít điện hơn Proof of Work do không cần cạnh tranh hash bằng phần cứng khổng lồ. Mức phân quyền, an toàn và quy mô cũng cần được đánh giá riêng.\n\nPhân tích từng đáp án:\n✗ A SAI. PoW với nhiều thợ đào thường dùng thêm điện.\n✗ B SAI. Solo mining ở từng công dân tăng cạnh tranh tính toán.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: PoS (bằng chứng cổ phần).\n✗ D SAI. Giảm độ khó đơn thuần không giải quyết kiến trúc tiêu thụ điện khi PoW cạnh tranh.","source":"Bộ đề Blockchain - Câu gốc 121/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q122","chapter":1,"number":122,"question":"Why can Bitcoin function without a bank keeping the accounts?\nVì sao Bitcoin hoạt động được khi không có ngân hàng giữ tài khoản?","options":[{"id":"BC260-Q122-A","text":"Exchanges confirm each payment on behalf of users\nSàn xác nhận thay mọi người dùng"},{"id":"BC260-Q122-B","text":"A software company backs every payment with deposits\nCông ty phần mềm bảo đảm mọi khoản bằng tiền ký quỹ"},{"id":"BC260-Q122-C","text":"Users trust the founder to correct any errors made\nNgười dùng tin nhà sáng lập sửa mọi lỗi"},{"id":"BC260-Q122-D","text":"Every node keeps and checks a copy of the same ledger\nMọi nút giữ và tự kiểm tra bản sao sổ cái chung"}],"correctOptionId":"BC260-Q122-D","explanation":"Explanation (EN): Bitcoin replaces a central bookkeeper with distributed copies and independent rule-based validation. No founder or exchange guarantees every payment.\nGiải thích (VI): Bitcoin thay thế vai trò đối soát trung tâm bằng sổ cái dùng chung mà các nút lưu và xác minh theo quy tắc. Không có nghĩa người dùng phải tin hoàn toàn vào nhà sáng lập.\n\nPhân tích từng đáp án:\n✗ A SAI. Sàn không phải bên xác thực duy nhất.\n✗ B SAI. Không có công ty nào phải bảo đảm mọi giao dịch bằng tiền ký quỹ.\n✗ C SAI. Người sáng lập không sửa lỗi tùy ý trên sổ cái.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Mọi nút giữ và tự kiểm tra bản sao sổ cái chung.","source":"Bộ đề Blockchain - Câu gốc 122/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q123","chapter":1,"number":123,"question":"A bank notices a client receiving many small crypto transfers from unknown sources. What should it apply?\nNgân hàng thấy khách nhận nhiều khoản crypto nhỏ từ nguồn không rõ. Nên áp dụng gì?","options":[{"id":"BC260-Q123-A","text":"Anti-money laundering and due diligence checks\nKiểm tra chống rửa tiền và thẩm định khách hàng"},{"id":"BC260-Q123-B","text":"No action, since crypto is unregulated\nBỏ qua vì crypto không được quản lý"},{"id":"BC260-Q123-C","text":"A reduction in the client's interest rate\nGiảm lãi suất cho vay của khách"},{"id":"BC260-Q123-D","text":"Immediate closure of all the client's loans\nĐóng ngay toàn bộ khoản vay của khách"}],"correctOptionId":"BC260-Q123-A","explanation":"Explanation (EN): Suspicious small transfers from unknown sources may trigger anti-money-laundering monitoring, source-of-funds checks and customer due diligence. Crypto activity is not exempt from compliance.\nGiải thích (VI): Giao dịch bất thường nhiều khoản nhỏ từ nguồn không rõ cần đánh giá theo AML/KYC, thẩm định và giám sát phù hợp. Không có căn cứ để mặc nhiên bỏ qua chỉ vì liên quan tiền mã hóa.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Kiểm tra chống rửa tiền và thẩm định khách hàng.\n✗ B SAI. Không thể bỏ qua cảnh báo AML chỉ vì tài sản là crypto.\n✗ C SAI. Lãi suất khách hàng không giải quyết dòng tiền đáng ngờ.\n✗ D SAI. Đóng mọi khoản vay tự động không phải biện pháp dựa trên đánh giá rủi ro.","source":"Bộ đề Blockchain - Câu gốc 123/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q124","chapter":4,"number":124,"question":"An algorithmic stablecoin loses its peg after a sudden collapse in demand. What is the main cause?\nStablecoin thuật toán mất neo giá sau khi cầu sụp đổ. Nguyên nhân chính là gì?","options":[{"id":"BC260-Q124-A","text":"Its reserves of US dollars were too large\nDự trữ USD quá lớn"},{"id":"BC260-Q124-B","text":"A central bank devalued it\nNgân hàng trung ương phá giá đồng này"},{"id":"BC260-Q124-C","text":"It has no reserve assets to support redemptions\nKhông có tài sản dự trữ để hỗ trợ quy đổi"},{"id":"BC260-Q124-D","text":"Miners refused to process its transactions\nThợ đào từ chối xử lý giao dịch"}],"correctOptionId":"BC260-Q124-C","explanation":"Explanation (EN): An algorithmic peg can collapse if incentives and demand fail without credible redemption reserves. Automatic supply adjustments cannot guarantee market trust during a run.\nGiải thích (VI): Stablecoin thuật toán có thể mất neo khi nhu cầu sụp đổ mà không có tài sản dự trữ đủ khả năng đổi ngang giá. Điều chỉnh cung theo công thức không thay thế được niềm tin và thanh khoản trong khủng hoảng.\n\nPhân tích từng đáp án:\n✗ A SAI. Dự trữ USD lớn sẽ là tài sản bảo đảm, trái vấn đề thiếu neo.\n✗ B SAI. Ngân hàng trung ương không trực tiếp điều chỉnh stablecoin thuật toán tư nhân.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Không có tài sản dự trữ để hỗ trợ quy đổi.\n✗ D SAI. Miner xử lý giao dịch không là nguyên nhân cốt lõi của mất neo do cầu sụp.","source":"Bộ đề Blockchain - Câu gốc 124/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q125","chapter":1,"number":125,"question":"Why does a blockchain group transactions into blocks rather than adding them one by one?\nVì sao blockchain gom các giao dịch thành khối thay vì ghi từng giao dịch riêng lẻ?","options":[{"id":"BC260-Q125-A","text":"Nodes can agree on many transactions at once\nCác nút đạt đồng thuận về nhiều giao dịch cùng lúc"},{"id":"BC260-Q125-B","text":"Grouping hides transactions from other nodes\nGom nhóm che giao dịch khỏi nút khác"},{"id":"BC260-Q125-C","text":"Each block belongs to one single user only\nMỗi khối chỉ thuộc một người dùng"},{"id":"BC260-Q125-D","text":"Blocks allow transactions to be edited later\nKhối cho phép sửa giao dịch về sau"}],"correctOptionId":"BC260-Q125-A","explanation":"Explanation (EN): Blocks let nodes agree on batches of transactions and extend one ordered ledger history. Grouping does not conceal transactions or permit editing them later.\nGiải thích (VI): Đóng gói nhiều giao dịch vào mỗi khối giúp mạng đạt đồng thuận và cập nhật lịch sử theo lô. Gộp giao dịch không có nghĩa che giấu nội dung hay cho sửa lại về sau.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Các nút đạt đồng thuận về nhiều giao dịch cùng lúc.\n✗ B SAI. Gom khối không làm giao dịch bí mật.\n✗ C SAI. Một khối có giao dịch của nhiều người.\n✗ D SAI. Blockchain chỉ-ghi-thêm không cho sửa giao dịch cũ.","source":"Bộ đề Blockchain - Câu gốc 125/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q126","chapter":1,"number":126,"question":"What does 'independent verification' mean in the Bitcoin network?\n“Xác minh độc lập” trong mạng Bitcoin có nghĩa là gì?","options":[{"id":"BC260-Q126-A","text":"Each full node checks every transaction itself\nMỗi full node tự kiểm tra mọi giao dịch"},{"id":"BC260-Q126-B","text":"Banks verify transactions for their clients\nNgân hàng xác minh giao dịch cho khách hàng"},{"id":"BC260-Q126-C","text":"A single auditor verifies all blocks\nMột kiểm toán viên xác minh tất cả khối"},{"id":"BC260-Q126-D","text":"Miners verify only their own transactions\nThợ đào chỉ xác minh giao dịch của chính họ"}],"correctOptionId":"BC260-Q126-A","explanation":"Explanation (EN): An independently verifying full node checks transactions and blocks against the protocol's rules instead of relying on miners, banks, or one auditor. This is central to trust minimization.\nGiải thích (VI): Xác minh độc lập nghĩa là full node tự kiểm tra chữ ký, UTXO và quy tắc đồng thuận thay vì mặc nhiên tin một ngân hàng, kiểm toán viên hay thợ đào khác.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Mỗi full node tự kiểm tra mọi giao dịch.\n✗ B SAI. Bitcoin không nhờ ngân hàng làm bên xác minh bắt buộc.\n✗ C SAI. Không có kiểm toán viên duy nhất kiểm tra tất cả khối.\n✗ D SAI. Nút xác minh cả giao dịch của người khác, không chỉ giao dịch mình.","source":"Bộ đề Blockchain - Câu gốc 126/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q127","chapter":2,"number":127,"question":"A transaction's signature does not match the public key linked to the input. What happens?\nChữ ký giao dịch không khớp khóa công khai của đầu vào. Điều gì xảy ra?","options":[{"id":"BC260-Q127-A","text":"It is confirmed after Six blocks\nĐược xác nhận sau sáu khối"},{"id":"BC260-Q127-B","text":"Miners include it with a higher fee\nThợ đào đưa vào khối nếu phí cao hơn"},{"id":"BC260-Q127-C","text":"The receiver is asked to approve it\nYêu cầu người nhận phê duyệt"},{"id":"BC260-Q127-D","text":"Nodes reject the transaction as invalid\nNút từ chối giao dịch không hợp lệ"}],"correctOptionId":"BC260-Q127-D","explanation":"Explanation (EN): If a transaction signature does not validate against the input's authorization conditions, validating nodes reject it. Extra fees or recipient approval cannot repair a bad signature.\nGiải thích (VI): Chữ ký không phù hợp với public key và thông điệp giao dịch sẽ làm giao dịch bị từ chối. Trả thêm phí hay đợi sáu khối không thể biến chữ ký sai thành hợp lệ.\n\nPhân tích từng đáp án:\n✗ A SAI. Giao dịch không có chữ ký đúng không tự trở nên hợp lệ sau sáu khối.\n✗ B SAI. Trả phí cao không sửa chữ ký sai.\n✗ C SAI. Người nhận không thể phê duyệt thay điều kiện chữ ký đầu vào.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Nút từ chối giao dịch không hợp lệ.","source":"Bộ đề Blockchain - Câu gốc 127/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q128","chapter":3,"number":128,"question":"What does UTXO stand for?\nUTXO là viết tắt của cụm từ gì?","options":[{"id":"BC260-Q128-A","text":"Universal token exchange\nTrao đổi token phổ quát"},{"id":"BC260-Q128-B","text":"Unverified transfer operation\nHoạt động chuyển chưa được xác minh"},{"id":"BC260-Q128-C","text":"Unspent transaction output\nĐầu ra giao dịch chưa chi tiêu"},{"id":"BC260-Q128-D","text":"Unified transaction order\nThứ tự giao dịch thống nhất"}],"correctOptionId":"BC260-Q128-C","explanation":"Explanation (EN): UTXO stands for Unspent Transaction Output: a discrete output of a prior transaction that has not yet been spent.\nGiải thích (VI): UTXO viết tắt của Unspent Transaction Output, nghĩa là đầu ra giao dịch chưa được dùng để chi tiêu. Đây là đơn vị kế toán quan trọng của Bitcoin.\n\nPhân tích từng đáp án:\n✗ A SAI. Tên này không phải cụm UTXO chính thức.\n✗ B SAI. Không phải định nghĩa UTXO.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Đầu ra giao dịch chưa chi tiêu.\n✗ D SAI. Thuật ngữ liên quan thứ tự, không phải đầu ra chưa tiêu.","source":"Bộ đề Blockchain - Câu gốc 128/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q129","chapter":1,"number":129,"question":"Where do retail crypto losses most commonly occur?\nCác khoản lỗ crypto của nhà đầu tư cá nhân thường xảy ra ở đâu?","options":[{"id":"BC260-Q129-A","text":"Central bank interventions\nCan thiệp của ngân hàng trung ương"},{"id":"BC260-Q129-B","text":"Mistakes made by miners\nSai sót do thợ đào"},{"id":"BC260-Q129-C","text":"Errors in the Bitcoin protocol itself\nLỗi ở chính giao thức Bitcoin"},{"id":"BC260-Q129-D","text":"Exchange hacks and lost or stolen keys\nSàn bị hack và khóa bị mất hoặc đánh cắp"}],"correctOptionId":"BC260-Q129-D","explanation":"Explanation (EN): Losses commonly arise from custodial exchange failures, hacks, stolen recovery phrases and lost keys. Such incidents are distinct from a flaw in Bitcoin's consensus itself.\nGiải thích (VI): Ngoài biến động giá, nhiều tổn thất của người dùng bắt nguồn từ sàn bị hack, lừa đảo và mất hoặc lộ khóa riêng. Không nên suy diễn rằng lỗi giao thức Bitcoin là nguyên nhân của mọi vụ mất tiền.\n\nPhân tích từng đáp án:\n✗ A SAI. Không phải can thiệp ngân hàng trung ương là nguyên nhân chủ đạo của mất crypto.\n✗ B SAI. Sai sót miner không phải cách mất tài sản cá nhân thường gặp.\n✗ C SAI. Lỗi giao thức không phải nguồn phổ biến nhất theo tình huống.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Sàn bị hack và khóa bị mất hoặc đánh cắp.","source":"Bộ đề Blockchain - Câu gốc 129/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q130","chapter":2,"number":130,"question":"A company plans to publish both its bitcoin address and its private key ‘for transparency’. What is the problem?\nCông ty định công bố cả địa chỉ Bitcoin lẫn khóa riêng “để minh bạch”. Có vấn đề gì?","options":[{"id":"BC260-Q130-A","text":"Publishing the address makes payments much slower\nCông bố địa chỉ khiến thanh toán chậm hơn"},{"id":"BC260-Q130-B","text":"Anyone could use the private key to take its funds\nAi có khóa riêng cũng có thể lấy tiền"},{"id":"BC260-Q130-C","text":"The address will stop working once it is published\nĐịa chỉ ngừng hoạt động khi công bố"},{"id":"BC260-Q130-D","text":"Nothing, since both keys are meant to be public\nKhông sao, cả hai khóa đều phải công khai"}],"correctOptionId":"BC260-Q130-B","explanation":"Explanation (EN): Publishing the private key gives others the ability to authorize spending from its controlled outputs. A public receiving address, unlike a private key, may safely be shared.\nGiải thích (VI): Địa chỉ công khai dùng để nhận tiền; private key dùng ký giao dịch chi tiền. Đăng khóa riêng để 'minh bạch' tạo điều kiện cho người khác đánh cắp tài sản.\n\nPhân tích từng đáp án:\n✗ A SAI. Công bố địa chỉ nhận không làm giao dịch tự chậm.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Ai có khóa riêng cũng có thể lấy tiền.\n✗ C SAI. Địa chỉ không hết hạn chỉ vì công khai.\n✗ D SAI. Khóa riêng không phải thứ được chia sẻ công khai.","source":"Bộ đề Blockchain - Câu gốc 130/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q131","chapter":2,"number":131,"question":"A miner invests heavily in hardware but has never found a block on his own. How is solo mining income best described?\nThợ đào đầu tư thiết bị lớn nhưng chưa tự tìm được khối. Thu nhập đào đơn lẻ của họ thế nào?","options":[{"id":"BC260-Q131-A","text":"Guaranteed, as every miner is paid each block\nĐược bảo đảm vì thợ đào đều nhận tiền mỗi khối"},{"id":"BC260-Q131-B","text":"Fixed, as the protocol pays a monthly salary\nCố định vì giao thức trả lương tháng"},{"id":"BC260-Q131-C","text":"Zero, as only banks can earn mining rewards\nBằng không vì chỉ ngân hàng được thưởng"},{"id":"BC260-Q131-D","text":"Uncertain, since finding a block depends on chance\nKhông chắc chắn vì tìm khối phụ thuộc may rủi"}],"correctOptionId":"BC260-Q131-D","explanation":"Explanation (EN): Solo mining block wins are random and can be rare with low hash power. Spending on hardware does not guarantee regular blocks or a fixed mining salary.\nGiải thích (VI): Thu nhập đào solo phụ thuộc vào xác suất hiếm khi tìm thấy khối; dù bỏ vốn máy móc, không có khoản lương hoặc phần thưởng đảm bảo cho mọi thợ đào.\n\nPhân tích từng đáp án:\n✗ A SAI. Đào đơn lẻ không được thưởng đều mỗi khối.\n✗ B SAI. Bitcoin không trả lương thợ đào theo tháng.\n✗ C SAI. Miner chứ không phải chỉ ngân hàng có quyền nhận thưởng.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Không chắc chắn vì tìm khối phụ thuộc may rủi.","source":"Bộ đề Blockchain - Câu gốc 131/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q132","chapter":2,"number":132,"question":"Which consensus mechanism does Bitcoin use?\nBitcoin sử dụng cơ chế đồng thuận nào?","options":[{"id":"BC260-Q132-A","text":"Proof of Authority\nBằng chứng thẩm quyền (PoA)"},{"id":"BC260-Q132-B","text":"Delegated Proof of Stake\nBằng chứng cổ phần ủy quyền (DPoS)"},{"id":"BC260-Q132-C","text":"Proof of Work\nBằng chứng công việc (PoW)"},{"id":"BC260-Q132-D","text":"Proof of Stake\nBằng chứng cổ phần (PoS)"}],"correctOptionId":"BC260-Q132-C","explanation":"Explanation (EN): Bitcoin's consensus uses Proof of Work. Proof of Stake and authority-based mechanisms appear in other blockchain designs.\nGiải thích (VI): Bitcoin dùng Proof of Work (PoW) để lựa chọn khối và bảo vệ lịch sử chuỗi. Không nhầm với Proof of Stake là cơ chế Ethereum đang dùng.\n\nPhân tích từng đáp án:\n✗ A SAI. PoA phù hợp một số mạng permissioned, không phải Bitcoin.\n✗ B SAI. DPoS không phải đồng thuận của Bitcoin.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Bằng chứng công việc (PoW).\n✗ D SAI. PoS không phải cơ chế đồng thuận của Bitcoin.","source":"Bộ đề Blockchain - Câu gốc 132/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q133","chapter":3,"number":133,"question":"A user runs a full node and receives a block with a reward larger than the protocol allows. What does the node do?\nFull node nhận khối có phần thưởng vượt quá giới hạn giao thức. Nút đó làm gì?","options":[{"id":"BC260-Q133-A","text":"Accepts it but reports it to the police\nChấp nhận rồi báo cảnh sát"},{"id":"BC260-Q133-B","text":"Waits fora bank to confirm it\nChờ ngân hàng xác nhận"},{"id":"BC260-Q133-C","text":"Accepts it because miners decide the reward\nChấp nhận vì thợ đào quyết định thưởng"},{"id":"BC260-Q133-D","text":"Rejects the block as invalid\nTừ chối khối không hợp lệ"}],"correctOptionId":"BC260-Q133-D","explanation":"Explanation (EN): A full node checks every candidate block against consensus rules. If the coinbase overpays the allowed subsidy and fees, the entire block is invalid and rejected.\nGiải thích (VI): Full node tự kiểm tra số BTC được phép tạo và mọi quy tắc đồng thuận. Khối có coinbase trả vượt mức bị từ chối cho dù thợ đào tìm được hash PoW hợp lệ.\n\nPhân tích từng đáp án:\n✗ A SAI. Chỉ báo cảnh sát không làm khối hợp lệ.\n✗ B SAI. Không cần ngân hàng quyết định tính hợp lệ.\n✗ C SAI. Thợ đào cũng chịu quy tắc thưởng và kiểm tra của nút.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Từ chối khối không hợp lệ.","source":"Bộ đề Blockchain - Câu gốc 133/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q134","chapter":1,"number":134,"question":"Why are confirmed Bitcoin transactions considered practically immutable?\nVì sao giao dịch Bitcoin đã xác nhận được xem là khó thay đổi trên thực tế?","options":[{"id":"BC260-Q134-A","text":"Altering one would require redoing the work for all later blocks\nSửa một giao dịch cần làm lại công việc cho tất cả khối sau"},{"id":"BC260-Q134-B","text":"A court order is needed before any transaction can be deleted\nCần lệnh tòa mới xóa được"},{"id":"BC260-Q134-C","text":"Each transaction is stored only on the sender's device\nMỗi giao dịch chỉ lưu trên máy người gửi"},{"id":"BC260-Q134-D","text":"The founder holds the only key that can edit records [cần đối chiếu ảnh gốc]\nNgười sáng lập giữ khóa duy nhất để sửa bản ghi [cần đối chiếu ảnh]"}],"correctOptionId":"BC260-Q134-A","explanation":"Explanation (EN): Changing a confirmed transaction requires changing its Merkle root and subsequent linked blocks and overcoming cumulative work. Immutability is practical rather than absolute.\nGiải thích (VI): Muốn thay đổi khối cũ, bên tấn công phải tái tạo công việc tính toán cho khối đó và các khối phía sau sao cho một nhánh gian lận vượt được nhánh trung thực. Vì thế tính bất biến là thực tiễn, không tuyệt đối toán học.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Sửa một giao dịch cần làm lại công việc cho tất cả khối sau.\n✗ B SAI. Khối không bị xóa bởi quyết định tòa án trên mạng phân tán.\n✗ C SAI. Không chỉ lưu giao dịch trên thiết bị người gửi.\n✗ D SAI. Không tồn tại khóa sửa lịch sử duy nhất của người sáng lập.\n\n⚠ Cần đối chiếu ảnh gốc: Một lựa chọn bị che hoặc có lỗi nhận dạng.","source":"Bộ đề Blockchain - Câu gốc 134/260","topic":"Overview of Blockchain","needsReview":true},{"id":"BC260-Q135","chapter":1,"number":135,"question":"What is Bitcoin best described as?\nMô tả nào đúng nhất về Bitcoin?","options":[{"id":"BC260-Q135-A","text":"A bank deposit account denominated in dollars\nTài khoản tiền gửi ngân hàng bằng USD"},{"id":"BC260-Q135-B","text":"A loyalty points scheme run by online retailers\nChương trình tích điểm cửa hàng trực tuyến"},{"id":"BC260-Q135-C","text":"A digital payment app operated by a central bank\nỨng dụng thanh toán số do ngân hàng trung ương vận hành"},{"id":"BC260-Q135-D","text":"A peer- to-peer digital currency with no central issuer\nTiền kỹ thuật số ngang hàng không có tổ chức phát hành trung tâm"}],"correctOptionId":"BC260-Q135-D","explanation":"Explanation (EN): Bitcoin is a peer-to-peer digital currency without a central issuer. It is not a bank deposit, retail loyalty scheme, or central-bank app.\nGiải thích (VI): Bitcoin là tiền kỹ thuật số P2P hoạt động trên mạng không có nhà phát hành trung tâm. Nó không phải tiền gửi USD, điểm thưởng hay ứng dụng ngân hàng trung ương.\n\nPhân tích từng đáp án:\n✗ A SAI. Tài khoản tiền gửi USD là nghĩa vụ nợ ngân hàng, khác Bitcoin.\n✗ B SAI. Điểm thưởng bán lẻ do doanh nghiệp phát hành, khác Bitcoin.\n✗ C SAI. Ứng dụng CBDC do ngân hàng trung ương phát hành khác Bitcoin.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Tiền kỹ thuật số ngang hàng không có tổ chức phát hành trung tâm.","source":"Bộ đề Blockchain - Câu gốc 135/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q136","chapter":1,"number":136,"question":"A merchant selling expensive goods waits for several confirmations before delivery. Why?\nNgười bán hàng giá trị cao chờ nhiều xác nhận mới giao. Vì sao?","options":[{"id":"BC260-Q136-A","text":"Confirmations reduce the transaction fee\nNhiều xác nhận giúp giảm phí"},{"id":"BC260-Q136-B","text":"Each extra block makes reversal less likely\nMỗi khối tiếp theo làm khả năng đảo ngược giảm"},{"id":"BC260-Q136-C","text":"The bank requires SIX confirmations by law\nPháp luật buộc sáu xác nhận"},{"id":"BC260-Q136-D","text":"Confirmations reveal the buyer's identity\nCác xác nhận tiết lộ danh tính người mua"}],"correctOptionId":"BC260-Q136-B","explanation":"Explanation (EN): Each added confirmation increases the work an attacker would need to reorganize the transaction out of the accepted chain. This reduces, but never mathematically eliminates, reversal risk.\nGiải thích (VI): Chờ thêm xác nhận là chờ nhiều khối mới được nối phía sau khối chứa giao dịch; số khối càng nhiều, việc đảo lịch sử càng khó và tốn kém. Xác nhận không làm giao dịch tự giảm phí.\n\nPhân tích từng đáp án:\n✗ A SAI. Xác nhận không trực tiếp làm phí đã trả giảm.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Mỗi khối tiếp theo làm khả năng đảo ngược giảm.\n✗ C SAI. Không có yêu cầu ngân hàng chung về đúng sáu xác nhận.\n✗ D SAI. Xác nhận bổ sung không công khai tên thật người mua.","source":"Bộ đề Blockchain - Câu gốc 136/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q137","chapter":2,"number":137,"question":"How can a smart contract support escrow in a transaction?\nSmart contract có thể hỗ trợ ký quỹ trong giao dịch như thế nào?","options":[{"id":"BC260-Q137-A","text":"it removes the need to define release conditions\nKhông cần xác định điều kiện giải ngân"},{"id":"BC260-Q137-B","text":"It hides the transaction from both parties\nChe giấu giao dịch khỏi cả hai bên"},{"id":"BC260-Q137-C","text":"It lets the bank keep funds indefinitely\nCho ngân hàng giữ tiền vô thời hạn"},{"id":"BC260-Q137-D","text":"It releases funds automatically once conditions are met\nTự giải ngân khi các điều kiện được đáp ứng"}],"correctOptionId":"BC260-Q137-D","explanation":"Explanation (EN): A smart-contract escrow locks funds and releases them once programmed conditions are verified. It still needs reliable external information where conditions concern the physical world.\nGiải thích (VI): Smart contract có thể đóng vai trò escrow: giữ tài sản và chỉ giải phóng khi điều kiện được xác minh. Điều kiện phải được lập trình rõ, dữ liệu ngoài chuỗi có thể cần oracle.\n\nPhân tích từng đáp án:\n✗ A SAI. Smart contract vẫn phải có điều kiện xác định.\n✗ B SAI. Giao dịch ký quỹ không nhằm giấu khỏi hai bên.\n✗ C SAI. Giữ tiền mãi mãi trái mục đích giải ngân theo điều kiện.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Tự giải ngân khi các điều kiện được đáp ứng.","source":"Bộ đề Blockchain - Câu gốc 137/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q138","chapter":1,"number":138,"question":"A game issues tokens that players can only use to buy items inside the game. What type of token is this?\nTrò chơi phát hành token chỉ dùng mua vật phẩm trong game. Đây là loại token nào?","options":[{"id":"BC260-Q138-A","text":"Utility token\nToken tiện ích"},{"id":"BC260-Q138-B","text":"Central bank digital currencY\nTiền kỹ thuật số ngân hàng trung ương"},{"id":"BC260-Q138-C","text":"Stablecoin\nStablecoin"},{"id":"BC260-Q138-D","text":"Security token\nToken chứng khoán"}],"correctOptionId":"BC260-Q138-A","explanation":"Explanation (EN): A game token used to buy in-game services is a utility token. It is not a security solely because it can be transferred or has a market value.\nGiải thích (VI): Token chỉ dùng để mua vật phẩm hoặc dịch vụ trong game thường là utility token. Nó không tự tạo quyền lợi cổ phần hoặc tư cách tiền ngân hàng trung ương.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Token tiện ích.\n✗ B SAI. CBDC do ngân hàng trung ương phát hành, khác token game.\n✗ C SAI. Token game không có mục tiêu neo giá.\n✗ D SAI. Mua vật phẩm không tự tạo quyền sở hữu/lợi nhuận như chứng khoán.","source":"Bộ đề Blockchain - Câu gốc 138/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q139","chapter":3,"number":139,"question":"What does ‘double spending’ mean for a digital currency?\n“Chi tiêu kép” trong tiền số có nghĩa là gì?","options":[{"id":"BC260-Q139-A","text":"Converting a coin into two different currencies\nĐổi coin sang hai loại tiền khác nhau"},{"id":"BC260-Q139-B","text":"Spending the same digital coin more than once\nTiêu cùng một đồng tiền số nhiều lần"},{"id":"BC260-Q139-C","text":"Sending one payment to two addresses by mistake\nVô ý gửi một khoản cho hai địa chỉ"},{"id":"BC260-Q139-D","text":"Paying two fees for one single transaction\nTrả hai khoản phí cho một giao dịch"}],"correctOptionId":"BC260-Q139-B","explanation":"Explanation (EN): Double spending means trying to use the same digital value in conflicting payments. Bitcoin's ledger and consensus select valid spends rather than accepting both.\nGiải thích (VI): Double spending là cố dùng cùng một giá trị tiền số cho hai khoản thanh toán không tương thích. Bitcoin dùng kiểm tra UTXO và đồng thuận để chỉ chấp nhận giao dịch hợp lệ.\n\nPhân tích từng đáp án:\n✗ A SAI. Đổi tiền là giao dịch khác, không phải chi cùng coin hai lần.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Tiêu cùng một đồng tiền số nhiều lần.\n✗ C SAI. Gửi cho nhiều người chỉ là chi tiêu kép nếu cùng đầu ra được dùng xung đột.\n✗ D SAI. Hai khoản phí không có nghĩa double spend.","source":"Bộ đề Blockchain - Câu gốc 139/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q140","chapter":1,"number":140,"question":"A partner disputes when goods left a warehouse that records each shipment step on a blockchain. What helps resolve this?\nĐối tác tranh cãi khi nào hàng rời kho, trong khi mỗi bước được ghi trên blockchain. Điều gì giải quyết tranh chấp?","options":[{"id":"BC260-Q140-A","text":"The logistics firm's own internal spreadsheet\nBảng tính nội bộ của hãng vận tải"},{"id":"BC260-Q140-B","text":"The partner 'S Own memory of the event\nTrí nhớ riêng của đối tác"},{"id":"BC260-Q140-C","text":"An email sent by the warehouse manage r\nEmail của quản lý kho"},{"id":"BC260-Q140-D","text":"The ledger's time-stamped unchangeable record\nBản ghi có dấu thời gian khó sửa trên sổ cái"}],"correctOptionId":"BC260-Q140-D","explanation":"Explanation (EN): A shared, time-stamped ledger preserves an auditable sequence of shipping events. It improves evidence and reconciliation, though the truth of entered data still matters.\nGiải thích (VI): Timestamp và lịch sử hash-linked cung cấp dấu vết thời điểm công bố và chuỗi thay đổi khó can thiệp, giúp đối chiếu tranh chấp logistics. Cần lưu ý thời điểm ghi blockchain không tự bảo đảm sự kiện ngoài đời đã xảy ra đúng.\n\nPhân tích từng đáp án:\n✗ A SAI. Bảng tính nội bộ không được các bên cùng xác thực.\n✗ B SAI. Trí nhớ riêng không phải chứng cứ khách quan.\n✗ C SAI. Email đơn lẻ có thể sửa và không là nhật ký chung.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Bản ghi có dấu thời gian khó sửa trên sổ cái.","source":"Bộ đề Blockchain - Câu gốc 140/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q141","chapter":2,"number":141,"question":"Why is Proof of Work said to secure the network?\nVì sao Proof of Work được cho là bảo vệ mạng?","options":[{"id":"BC260-Q141-A","text":"It lets a central authority block attackers\nCho cơ quan trung tâm chặn kẻ tấn công"},{"id":"BC260-Q141-B","text":"It hides all transactions from the public\nGiấu mọi giao dịch khỏi công chúng"},{"id":"BC260-Q141-C","text":"It makes every transaction free of charge for users\nKhiến mọi giao dịch miễn phí"},{"id":"BC260-Q141-D","text":"Rewriting history would cost enormous computing power\nViết lại lịch sử sẽ tốn lượng tính toán khổng lồ"}],"correctOptionId":"BC260-Q141-D","explanation":"Explanation (EN): Proof of Work makes history rewrites computationally expensive. Security rests on the cost and cumulative work rather than censorship or fee elimination.\nGiải thích (VI): Proof of Work đòi chi phí tính toán thực để tạo và viết lại lịch sử khối, khiến tấn công tốn kém. Nó không dùng một nhà quản trị trung tâm cấp phép từng giao dịch.\n\nPhân tích từng đáp án:\n✗ A SAI. PoW không trao quyền kiểm duyệt cho một trung tâm.\n✗ B SAI. Giao dịch trên Bitcoin thường minh bạch.\n✗ C SAI. PoW không bảo đảm giao dịch miễn phí.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Viết lại lịch sử sẽ tốn lượng tính toán khổng lồ.","source":"Bộ đề Blockchain - Câu gốc 141/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q142","chapter":1,"number":142,"question":"A merchant selling expensive goods waits for several confirmations before delivery. Why?\nNgười bán hàng giá trị cao chờ nhiều xác nhận mới giao. Vì sao?","options":[{"id":"BC260-Q142-A","text":"Confirmations reduce the transaction fee\nNhiều xác nhận giúp giảm phí"},{"id":"BC260-Q142-B","text":"Confirmations reveal the buyer's identity\nCác xác nhận tiết lộ danh tính người mua"},{"id":"BC260-Q142-C","text":"The bank requires SIX confirmations by law\nPháp luật buộc sáu xác nhận"},{"id":"BC260-Q142-D","text":"Each extra block makes reversal less likely\nMỗi khối tiếp theo làm khả năng đảo ngược giảm"}],"correctOptionId":"BC260-Q142-D","explanation":"Explanation (EN): Each added confirmation increases the work an attacker would need to reorganize the transaction out of the accepted chain. This reduces, but never mathematically eliminates, reversal risk.\nGiải thích (VI): Chờ thêm xác nhận là chờ nhiều khối mới được nối phía sau khối chứa giao dịch; số khối càng nhiều, việc đảo lịch sử càng khó và tốn kém. Xác nhận không làm giao dịch tự giảm phí.\n\nPhân tích từng đáp án:\n✗ A SAI. Xác nhận không trực tiếp làm phí đã trả giảm.\n✗ B SAI. Xác nhận bổ sung không công khai tên thật người mua.\n✗ C SAI. Không có yêu cầu ngân hàng chung về đúng sáu xác nhận.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Mỗi khối tiếp theo làm khả năng đảo ngược giảm.","source":"Bộ đề Blockchain - Câu gốc 142/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q143","chapter":1,"number":143,"question":"An investor compares a PoW coin with a PoS coin. Which statement about how they are secured is accurate?\nNhà đầu tư so sánh coin PoW và PoS. Phát biểu nào về cách bảo vệ mạng là đúng?","options":[{"id":"BC260-Q143-A","text":"PoW uses computing work; PoS uses staked coins\nPoW dùng công việc tính toán; PoS dùng coin được stake"},{"id":"BC260-Q143-B","text":"PoW needs no computers to secure the chain\nPoW không cần máy tính bảo vệ chuỗi"},{"id":"BC260-Q143-C","text":"Both secure the network by staking coins\nCả hai đều bảo vệ bằng staking"},{"id":"BC260-Q143-D","text":"PoS consumes more electricity than PoW\nPoS tiêu thụ điện nhiều hơn PoW"}],"correctOptionId":"BC260-Q143-A","explanation":"Explanation (EN): Proof of Work uses computational effort; Proof of Stake ties validation rights and penalties to coins committed as stake. The mechanisms have distinct resource requirements.\nGiải thích (VI): PoW dựa vào công việc tính toán; PoS dựa vào tài sản khóa làm stake và cơ chế chọn validator. Hai mô hình khác nhau về động lực kinh tế và tiêu thụ điện.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: PoW dùng công việc tính toán; PoS dùng coin được stake.\n✗ B SAI. PoW dựa vào tính toán của thiết bị.\n✗ C SAI. PoW không dựa vào coin stake theo cùng cách PoS.\n✗ D SAI. PoS thông thường tiết kiệm điện hơn PoW.","source":"Bộ đề Blockchain - Câu gốc 143/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q144","chapter":1,"number":144,"question":"Why do organizations using separate centralized ledgers often face high reconciliation costs?\nVì sao các tổ chức dùng sổ cái tập trung riêng thường tốn nhiều chi phí đối soát?","options":[{"id":"BC260-Q144-A","text":"Each party's own records must be matched and corrected\nBản ghi riêng các bên phải đối chiếu và sửa sai"},{"id":"BC260-Q144-B","text":"Centralized ledgers cannot store numbers precisely\nSổ cái tập trung không lưu số chính xác"},{"id":"BC260-Q144-C","text":"Every entry must be confirmed by miners\nMọi bản ghi phải được thợ đào xác nhận"},{"id":"BC260-Q144-D","text":"Regulators forbid sharing any records between firms\nCơ quan quản lý cấm mọi công ty chia sẻ bản ghi"}],"correctOptionId":"BC260-Q144-A","explanation":"Explanation (EN): Separate ledgers must be reconciled whenever entries differ in timing, content or status. A shared synchronized record reduces this duplication of work.\nGiải thích (VI): Khi mỗi tổ chức giữ một cơ sở dữ liệu riêng, số liệu phát sinh có thể lệch nhau và cần đối soát thủ công. Một sổ cái đồng bộ có thể giảm chi phí hòa giải.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Bản ghi riêng các bên phải đối chiếu và sửa sai.\n✗ B SAI. Cơ sở dữ liệu tập trung vẫn lưu số chính xác được.\n✗ C SAI. Đối soát riêng không nhất thiết do miner xác nhận.\n✗ D SAI. Có thể chia sẻ bản ghi theo thỏa thuận, vấn đề là thiếu đồng bộ.","source":"Bộ đề Blockchain - Câu gốc 144/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q145","chapter":3,"number":145,"question":"Why does the coinbase transaction have no ordinary inputs?\nVì sao giao dịch coinbase không có đầu vào thông thường?","options":[{"id":"BC260-Q145-A","text":"Its inputs are hidden for privacy\nĐầu vào bị giấu vì riêng tư"},{"id":"BC260-Q145-B","text":"It is paid for by the central bank\nDo ngân hàng trung ương thanh toán"},{"id":"BC260-Q145-C","text":"It is created by the receive r, not the sender\nDo người nhận tạo thay người gửi"},{"id":"BC260-Q145-D","text":"It creates new coins instead of spending old ones\nTạo coin mới chứ không tiêu coin cũ"}],"correctOptionId":"BC260-Q145-D","explanation":"Explanation (EN): A coinbase transaction creates the permitted block subsidy and collects fees rather than spending ordinary prior UTXOs. It therefore has no normal transaction inputs.\nGiải thích (VI): Coinbase transaction tạo số BTC mới theo trợ cấp khối và nhận phí, nên không tiêu các UTXO thông thường để lấy tiền đầu vào. Không được nhầm với giao dịch trả tiền từ người khác.\n\nPhân tích từng đáp án:\n✗ A SAI. Coinbase có cấu trúc đầu vào đặc biệt chứ không bị giấu.\n✗ B SAI. Không do ngân hàng trung ương trả tiền coinbase.\n✗ C SAI. Giao dịch coinbase do thợ đào tạo, không phải người nhận thông thường.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Tạo coin mới chứ không tiêu coin cũ.","source":"Bộ đề Blockchain - Câu gốc 145/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q146","chapter":1,"number":146,"question":"Why does independent verification let Bitcoin operate without a trusted third party?\nVì sao xác minh độc lập giúp Bitcoin hoạt động không cần bên thứ ba đáng tin cậy?","options":[{"id":"BC260-Q146-A","text":"A central server checks every transaction\nMáy chủ trung tâm kiểm tra mọi giao dịch"},{"id":"BC260-Q146-B","text":"Miners must be licensed by financial regulators first\nThợ đào phải được cơ quan quản lý cấp phép"},{"id":"BC260-Q146-C","text":"Honest nodes reject invalid transactions themselves\nNút trung thực tự loại giao dịch không hợp lệ"},{"id":"BC260-Q146-D","text":"Users must trust the software developers\nNgười dùng phải tin nhà phát triển phần mềm"}],"correctOptionId":"BC260-Q146-C","explanation":"Explanation (EN): Independent nodes enforce consensus rules for themselves and reject invalid records, minimizing reliance on one trusted bank, miner, or developer.\nGiải thích (VI): Full nodes tự kiểm tra và từ chối trạng thái sai, nên không cần dựa vào quyền quyết định duy nhất của một trung gian. Sự tin cậy đến từ quy tắc và xác minh có thể lặp lại.\n\nPhân tích từng đáp án:\n✗ A SAI. Vì có nhiều nút tự xác minh, không cần server duy nhất.\n✗ B SAI. Không cần cấp phép tài chính để trở thành validator Bitcoin theo giao thức.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Nút trung thực tự loại giao dịch không hợp lệ.\n✗ D SAI. Quy tắc mạng được máy xác minh, không dựa vào tin mù quáng nhà phát triển.","source":"Bộ đề Blockchain - Câu gốc 146/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q147","chapter":2,"number":147,"question":"What is a digital signature in a cryptocurrency transaction created with?\nChữ ký số của giao dịch crypto được tạo bằng gì?","options":[{"id":"BC260-Q147-A","text":"The miner's public key\nKhóa công khai của thợ đào"},{"id":"BC260-Q147-B","text":"The receiver's public key\nKhóa công khai người nhận"},{"id":"BC260-Q147-C","text":"The sender's private key\nKhóa riêng người gửi"},{"id":"BC260-Q147-D","text":"The block hash\nHash của khối"}],"correctOptionId":"BC260-Q147-C","explanation":"Explanation (EN): Digital signatures authorizing cryptocurrency spending are generated with the owner's private key, then checked using the matching public key.\nGiải thích (VI): Chữ ký số của giao dịch được tạo bằng private key của người có quyền chi tiêu, sau đó được xác minh bằng public key tương ứng. Không dùng khóa của thợ đào hay người nhận.\n\nPhân tích từng đáp án:\n✗ A SAI. Khóa công khai thợ đào không được dùng ký giao dịch của người gửi.\n✗ B SAI. Khóa công khai người nhận không ký đầu vào của người gửi.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Khóa riêng người gửi.\n✗ D SAI. Hash khối không phải khóa ký giao dịch.","source":"Bộ đề Blockchain - Câu gốc 147/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q148","chapter":2,"number":148,"question":"What risk is often associated with Proof of Stake?\nRủi ro thường gắn với Proof of Stake là gì?","options":[{"id":"BC260-Q148-A","text":"Mining hardware becomes too expensive \"\nThiết bị đào trở nên quá đắt"},{"id":"BC260-Q148-B","text":"Wealthy holders may gain more control over validation\nNgười giàu có thể kiểm soát việc xác thực nhiều hơn"},{"id":"BC260-Q148-C","text":"Blocks can never be confirmed\nKhông bao giờ xác nhận được khối"},{"id":"BC260-Q148-D","text":"All transactions must be made public with names\nMọi giao dịch phải công khai tên thật"}],"correctOptionId":"BC260-Q148-B","explanation":"Explanation (EN): Proof of Stake can concentrate validation influence among wealthy stakers. It does not use the same mining hardware race as Proof of Work.\nGiải thích (VI): Với Proof of Stake, người nắm nhiều token hơn có thể có lợi thế xác thực và nhận thêm phần thưởng, gây lo ngại tập trung quyền lực. PoS không cần ASIC như cách đào PoW truyền thống.\n\nPhân tích từng đáp án:\n✗ A SAI. Chi phí thiết bị PoW không phải rủi ro đặc trưng PoS.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Người giàu có thể kiểm soát việc xác thực nhiều hơn.\n✗ C SAI. PoS vẫn có thể xác nhận khối theo quy tắc.\n✗ D SAI. PoS không yêu cầu công bố tên thật mọi giao dịch.","source":"Bộ đề Blockchain - Câu gốc 148/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q149","chapter":1,"number":149,"question":"Who validates Bitcoin transactions in place of a bank?\nAi xác thực giao dịch Bitcoin thay cho ngân hàng?","options":[{"id":"BC260-Q149-A","text":"The central bank of the sender's country\nNgân hàng trung ương nước người gửi"},{"id":"BC260-Q149-B","text":"A licensed clearing house in each country\nTrung tâm bù trừ được cấp phép mỗi nước"},{"id":"BC260-Q149-C","text":"The software firm that created the user's wallet\nCông ty phần mềm làm ví"},{"id":"BC260-Q149-D","text":"The network of nodes following the protocol rules\nMạng các nút tuân theo quy tắc giao thức"}],"correctOptionId":"BC260-Q149-D","explanation":"Explanation (EN): Bitcoin transactions are verified by network nodes that enforce protocol rules; miners also verify candidate transactions when building blocks. No central bank replaces this role.\nGiải thích (VI): Các nút Bitcoin áp dụng quy tắc giao thức để xác minh chữ ký, trạng thái UTXO và khối; không ngân hàng trung ương nào cấp phép chung cho toàn mạng. Miner tạo khối, nhưng full node cũng kiểm tra.\n\nPhân tích từng đáp án:\n✗ A SAI. Không cần ngân hàng trung ương kiểm tra các giao dịch Bitcoin.\n✗ B SAI. Không cần trung tâm bù trừ được cấp phép mỗi nước.\n✗ C SAI. Nhà cung cấp ví không bắt buộc quyết định tính hợp lệ của Bitcoin.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Mạng các nút tuân theo quy tắc giao thức.","source":"Bộ đề Blockchain - Câu gốc 149/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q150","chapter":1,"number":150,"question":"Which type of blockchain is governed by a group of organizations rather than one?\nLoại blockchain nào do một nhóm tổ chức cùng quản trị chứ không phải một tổ chức?","options":[{"id":"BC260-Q150-A","text":"Private blockchain owned by one firm\nBlockchain riêng do một công ty sở hữu"},{"id":"BC260-Q150-B","text":"Consortium blockchain\nBlockchain liên minh"},{"id":"BC260-Q150-C","text":"Personal blockchain\nBlockchain cá nhân"},{"id":"BC260-Q150-D","text":"Public blockchain\nBlockchain công khai"}],"correctOptionId":"BC260-Q150-B","explanation":"Explanation (EN): A consortium blockchain distributes governance among a defined group of organizations. A single-owner private chain has different control arrangements.\nGiải thích (VI): Consortium blockchain được một nhóm tổ chức thống nhất quản trị, khác private blockchain do một chủ sở hữu và public blockchain mở. Tính phân quyền thường chỉ một phần.\n\nPhân tích từng đáp án:\n✗ A SAI. Một doanh nghiệp sở hữu là private chain.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Blockchain liên minh.\n✗ C SAI. Blockchain cá nhân không phải loại quản trị nhiều tổ chức.\n✗ D SAI. Blockchain công khai không có nhóm tổ chức quản trị độc quyền.","source":"Bộ đề Blockchain - Câu gốc 150/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q151","chapter":3,"number":151,"question":"Alice has one UTXO of 5 BTC and pays Bob 3 BTC with a 0.001 BTC fee. What is her change output?\nAlice có một UTXO 5 BTC, trả Bob 3 BTC và phí 0,001 BTC. Đầu ra tiền thừa là bao nhiêu?","options":[{"id":"BC260-Q151-A","text":"2 BIC\n2 BTC [ảnh lỗi nhận dạng]"},{"id":"BC260-Q151-B","text":"2.001 BTC\n2,001 BTC"},{"id":"BC260-Q151-C","text":"1.999 BTC\n1,999 BTC"},{"id":"BC260-Q151-D","text":"5 BIC\n5 BTC [ảnh lỗi nhận dạng]"}],"correctOptionId":"BC260-Q151-C","explanation":"Explanation (EN): The change output is 5 - 3 - 0.001 = 1.999 BTC. UTXO inputs are spent in full and any unused value is returned as a new output.\nGiải thích (VI): Đầu vào 5 BTC, trả Bob 3 BTC và phí 0,001 BTC thì tiền thối lại là 5 − 3 − 0,001 = 1,999 BTC. UTXO gốc bị tiêu toàn bộ.\n\nPhân tích từng đáp án:\n✗ A SAI. 2 BTC tính thiếu phí và tiền trả Bob.\n✗ B SAI. 2,001 BTC lớn hơn tiền còn sau khi trả 3 BTC.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: 1,999 BTC.\n✗ D SAI. 5 BTC là toàn bộ đầu vào, chưa trừ thanh toán và phí.","source":"Bộ đề Blockchain - Câu gốc 151/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q152","chapter":1,"number":152,"question":"Several banks want to share trade-finance records only among themselves, under joint governance. Which blockchain type fits best?\nNhiều ngân hàng muốn chia sẻ dữ liệu tài trợ thương mại trong nhóm và cùng quản trị. Loại blockchain nào thích hợp?","options":[{"id":"BC260-Q152-A","text":"No blockchain is suitable\nKhông blockchain nào phù hợp"},{"id":"BC260-Q152-B","text":"Public blockchain\nBlockchain công khai"},{"id":"BC260-Q152-C","text":"Consortium blockchain\nBlockchain liên minh"},{"id":"BC260-Q152-D","text":"A single bank's private database\nCơ sở dữ liệu riêng của một ngân hàng"}],"correctOptionId":"BC260-Q152-C","explanation":"Explanation (EN): A consortium blockchain suits multiple known institutions that jointly govern access and validation. It differs from a public permissionless chain and one firm's private ledger.\nGiải thích (VI): Nhiều ngân hàng đồng quản trị và chỉ các thành viên được phép truy cập là mô hình consortium/permissioned blockchain. Nó khác public blockchain mở cho mọi người.\n\nPhân tích từng đáp án:\n✗ A SAI. Blockchain liên minh phù hợp yêu cầu nhiều ngân hàng.\n✗ B SAI. Blockchain công khai cho người ngoài tham gia, trái điều kiện.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Blockchain liên minh.\n✗ D SAI. Cơ sở dữ liệu riêng một ngân hàng không chia quyền quản trị.","source":"Bộ đề Blockchain - Câu gốc 152/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q153","chapter":1,"number":153,"question":"What is a block in a blockchain?\nKhối trong blockchain là gì?","options":[{"id":"BC260-Q153-A","text":"A group of validated transactions plus a header\nNhóm giao dịch được xác minh cùng phần đầu khối"},{"id":"BC260-Q153-B","text":"A single user's account balance\nSố dư tài khoản một người dùng"},{"id":"BC260-Q153-C","text":"A unit of cryptocurrency held in a wallet\nĐơn vị tiền mã hóa trong ví"},{"id":"BC260-Q153-D","text":"A node that stores the ledger\nNút lưu sổ cái"}],"correctOptionId":"BC260-Q153-A","explanation":"Explanation (EN): A block combines validated transaction data with a header containing metadata such as the previous block hash and Merkle root. It is neither a wallet nor a node.\nGiải thích (VI): Khối Bitcoin gồm header chứa thông tin như previous hash, Merkle root, timestamp, bits, nonce và phần danh sách giao dịch. Một khối không chỉ là số dư của một người dùng.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Nhóm giao dịch được xác minh cùng phần đầu khối.\n✗ B SAI. Khối không đơn thuần là số dư một người.\n✗ C SAI. Đơn vị tiền trong ví không phải khối.\n✗ D SAI. Nút là máy tham gia mạng, không phải tập giao dịch.","source":"Bộ đề Blockchain - Câu gốc 153/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q154","chapter":3,"number":154,"question":"Why does changing a transaction in an old block break the chain?\nVì sao sửa giao dịch trong khối cũ làm đứt liên kết chuỗi?","options":[{"id":"BC260-Q154-A","text":"The nonce of all later blocks is reset to zero\nĐặt nonce mọi khối sau thành số không"},{"id":"BC260-Q154-B","text":"The timestamp of every block is reset\nĐặt lại dấu thời gian mọi khối"},{"id":"BC260-Q154-C","text":"Its hash no longer matches the next block's link\nHash không còn khớp liên kết ở khối sau"},{"id":"BC260-Q154-D","text":"The genesis block is deleted from every node\nXóa khối genesis khỏi mọi nút"}],"correctOptionId":"BC260-Q154-C","explanation":"Explanation (EN): A change to an old transaction changes its Merkle root and header hash. The next block points to the former hash, so the cryptographic link no longer matches.\nGiải thích (VI): Thay nội dung giao dịch làm thay đổi Merkle root và hash khối; hash trước đó đang được khối kế tiếp tham chiếu nên mối nối không khớp. Muốn sửa phải xử lý cả chuỗi phụ thuộc.\n\nPhân tích từng đáp án:\n✗ A SAI. Nonce các khối sau không tự reset về 0.\n✗ B SAI. Không có việc tự đặt lại timestamp tất cả khối.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Hash không còn khớp liên kết ở khối sau.\n✗ D SAI. Sửa giao dịch không xóa genesis khỏi mạng.","source":"Bộ đề Blockchain - Câu gốc 154/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q155","chapter":1,"number":155,"question":"Alice sends the same digital coin to Bob and Carol at nearly the same moment. What does the Bitcoin network do?\nAlice gần như cùng lúc gửi một đồng tiền số cho Bob và Carol. Mạng Bitcoin xử lý thế nào?","options":[{"id":"BC260-Q155-A","text":"Accepts only one and rejects the conflicting payment\nChỉ chấp nhận một giao dịch và từ chối khoản thanh toán xung đột"},{"id":"BC260-Q155-B","text":"Asks the sender's bank to decide which payment is valid\nNhờ ngân hàng người gửi phân xử"},{"id":"BC260-Q155-C","text":"Splits the coin equally between Bob and Carol\nChia coin đều cho Bob và Carol"},{"id":"BC260-Q155-D","text":"Accepts both payments and charges Alice a fee\nChấp nhận cả hai rồi thu phí Alice"}],"correctOptionId":"BC260-Q155-A","explanation":"Explanation (EN): When two payments try to spend the same UTXO, they conflict. Only one can be confirmed as a valid spend in the accepted Bitcoin history.\nGiải thích (VI): Hai giao dịch cố tiêu cùng một UTXO là xung đột; chỉ một lịch sử tiêu hợp lệ có thể được xác nhận. Mạng không nhân đôi tiền hoặc chia tùy ý giữa người nhận.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Chỉ chấp nhận một giao dịch và từ chối khoản thanh toán xung đột.\n✗ B SAI. Giao thức xử lý giao dịch xung đột, không nhờ ngân hàng.\n✗ C SAI. Không thể chia một UTXO bằng cách xác nhận hai khoản xung đột.\n✗ D SAI. Mạng không chấp nhận hai lần tiêu cùng đầu ra.","source":"Bộ đề Blockchain - Câu gốc 155/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q156","chapter":1,"number":156,"question":"What is the maximum number of bitcoins that will ever be issued under the protocol?\nTối đa có bao nhiêu Bitcoin được phát hành theo giao thức?","options":[{"id":"BC260-Q156-A","text":"21 billion\n21 tỷ"},{"id":"BC260-Q156-B","text":"21 million\n21 triệu"},{"id":"BC260-Q156-C","text":"Unlimited, set by miners\nKhông giới hạn, do thợ đào đặt"},{"id":"BC260-Q156-D","text":"100 million\n100 triệu"}],"correctOptionId":"BC260-Q156-B","explanation":"Explanation (EN): Bitcoin's protocol limits total issuance to approximately 21 million BTC. The number is not 21 billion, and miners cannot vote unlimited coins into existence unilaterally.\nGiải thích (VI): Giao thức Bitcoin đặt mục tiêu phát hành tối đa xấp xỉ 21 triệu BTC. Điều này khác giới hạn 21 tỷ và không được tăng tùy ý theo quyết định thợ đào.\n\nPhân tích từng đáp án:\n✗ A SAI. 21 tỷ lớn gấp 1.000 lần giới hạn.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: 21 triệu.\n✗ C SAI. Miner không được tự tăng không giới hạn.\n✗ D SAI. 100 triệu không phải giới hạn Bitcoin.","source":"Bộ đề Blockchain - Câu gốc 156/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q157","chapter":2,"number":157,"question":"A small miner with limited hardware wants a more predictable income. What is the best option?\nThợ đào nhỏ có thiết bị hạn chế muốn thu nhập ổn định hơn. Lựa chọn tốt nhất là gì?","options":[{"id":"BC260-Q157-A","text":"Mine alone and wait for a block\nĐào một mình và chờ khối"},{"id":"BC260-Q157-B","text":"Run a lightweight node\nChạy nút nhẹ"},{"id":"BC260-Q157-C","text":"Switch to a hot wallet\nChuyển sang ví nóng"},{"id":"BC260-Q157-D","text":"Join a mining pool\nTham gia mining pool"}],"correctOptionId":"BC260-Q157-D","explanation":"Explanation (EN): Joining a mining pool spreads block-finding uncertainty and usually generates smaller, more regular payouts for small miners. It does not make costs or risk disappear.\nGiải thích (VI): Mining pool giúp người đào có công suất nhỏ chia sẻ sức mạnh và nhận phần thưởng đều hơn tương ứng công sức. Đào một mình có rủi ro lâu không tìm được khối.\n\nPhân tích từng đáp án:\n✗ A SAI. Đào đơn lẻ thu nhập thất thường hơn.\n✗ B SAI. Nút nhẹ giúp xem/xác minh hạn chế chứ không chia thưởng đào.\n✗ C SAI. Ví nóng không làm đều thu nhập mining.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Tham gia mining pool.","source":"Bộ đề Blockchain - Câu gốc 157/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q158","chapter":1,"number":158,"question":"What are network participants that collect transactions and compete to create new blocks called?\nNhững người tham gia mạng thu thập giao dịch và cạnh tranh tạo khối mới gọi là gì?","options":[{"id":"BC260-Q158-A","text":"Exchanges\nSàn giao dịch"},{"id":"BC260-Q158-B","text":"Light clients\nMáy khách nhẹ"},{"id":"BC260-Q158-C","text":"Custodians\nBên lưu ký"},{"id":"BC260-Q158-D","text":"Miners\nThợ đào"}],"correctOptionId":"BC260-Q158-D","explanation":"Explanation (EN): Proof-of-Work miners collect candidate transactions and compete to find a valid block hash. Custodians, light clients and exchanges perform other roles.\nGiải thích (VI): Miners tập hợp giao dịch hợp lệ, thử tìm hash đáp ứng mục tiêu PoW và phát tán khối mới khi thành công. Full node không đào vẫn có thể tự xác minh giao dịch.\n\nPhân tích từng đáp án:\n✗ A SAI. Sàn giao dịch môi giới mua bán, khác thợ đào.\n✗ B SAI. Light client xác minh hạn chế, không cạnh tranh PoW như miner.\n✗ C SAI. Custodian giữ hộ tài sản, không nhất thiết đào.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Thợ đào.","source":"Bộ đề Blockchain - Câu gốc 158/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q159","chapter":3,"number":159,"question":"What is the first transaction in each block, which creates new bitcoin for the miner, called?\nGiao dịch đầu tiên mỗi khối tạo Bitcoin mới cho thợ đào gọi là gì?","options":[{"id":"BC260-Q159-A","text":"Coinbase transaction\nGiao dịch coinbase"},{"id":"BC260-Q159-B","text":"Genesis transaction\nGiao dịch genesis"},{"id":"BC260-Q159-C","text":"Fee transaction\nGiao dịch phí"},{"id":"BC260-Q159-D","text":"Change transaction\nGiao dịch trả tiền thừa"}],"correctOptionId":"BC260-Q159-A","explanation":"Explanation (EN): The coinbase transaction is the special first transaction in a Bitcoin block that creates new coins within the subsidy limit and claims associated transaction fees.\nGiải thích (VI): Coinbase transaction là giao dịch đặc biệt đầu tiên của mỗi khối Bitcoin, tạo trợ cấp khối và thu phí cho thợ đào. Không nhầm với genesis block, là khối đầu tiên của chuỗi.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Giao dịch coinbase.\n✗ B SAI. Genesis là tên khối đầu, không phải giao dịch tạo thưởng mỗi khối.\n✗ C SAI. Không tồn tại loại bắt buộc tên fee transaction thay coinbase.\n✗ D SAI. Change output là tiền trả lại người gửi, không tạo trợ cấp khối.","source":"Bộ đề Blockchain - Câu gốc 159/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q160","chapter":3,"number":160,"question":"A business wants to verify payments itself without trusting any third party. Which setup should it run?\nDoanh nghiệp muốn tự xác minh khoản thanh toán không tin bên thứ ba. Nên vận hành cấu hình gì?","options":[{"id":"BC260-Q160-A","text":"A full node\nFull node"},{"id":"BC260-Q160-B","text":"An exchange custodial account\nTài khoản lưu ký tại sàn"},{"id":"BC260-Q160-C","text":"A mining pool account\nTài khoản nhóm đào"},{"id":"BC260-Q160-D","text":"A light wallet connected to an exchange\nVí nhẹ kết nối sàn"}],"correctOptionId":"BC260-Q160-A","explanation":"Explanation (EN): Running a fully validating node lets a business independently check incoming Bitcoin payments and block validity. An exchange account or light wallet outsources part of that trust.\nGiải thích (VI): Chạy full node cho phép doanh nghiệp tự kiểm tra khối và giao dịch theo quy tắc, không cần tin sàn hay dịch vụ thứ ba. Light wallet có thể phải tin hơn vào dữ liệu nút bên ngoài.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Full node.\n✗ B SAI. Sàn lưu ký buộc tin bên giữ khóa/chuyển tiền.\n✗ C SAI. Mining pool không thay hoạt động kiểm tra full node độc lập.\n✗ D SAI. Ví nhẹ dựa vào nhiều dữ liệu từ nút khác.","source":"Bộ đề Blockchain - Câu gốc 160/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q161","chapter":1,"number":161,"question":"Which type of wallet is kept offline to reduce the risk of hacking?\nLoại ví nào được giữ ngoại tuyến để giảm rủi ro bị tấn công mạng?","options":[{"id":"BC260-Q161-A","text":"Web wallet\nVí trên web"},{"id":"BC260-Q161-B","text":"Cold wallet\nVí lạnh"},{"id":"BC260-Q161-C","text":"Exchange wallet\nVí trên sàn"},{"id":"BC260-Q161-D","text":"Hot wallet\nVí nóng"}],"correctOptionId":"BC260-Q161-B","explanation":"Explanation (EN): Cold wallets keep private keys offline, helping limit remote compromise. Hot and exchange wallets are connected to networked systems.\nGiải thích (VI): Cold wallet lưu
