được gọi là validator, không phải miner của PoW.\n\n⚠ Ảnh gốc chỉ hiển thị 2 lựa chọn; không tự thêm lựa chọn còn thiếu.","source":"Bộ đề Blockchain - Câu gốc 49/260","topic":"Foundational Technologies of Blockchain","needsReview":true},{"id":"BC260-Q050","chapter":3,"number":50,"question":"Why do transaction fees become more important for miners over time?\nVì sao phí giao dịch ngày càng quan trọng đối với thợ đào?","options":[{"id":"BC260-Q050-A","text":"Block rewards fall with each halving\nTrợ cấp khối giảm sau mỗi kỳ halving"},{"id":"BC260-Q050-B","text":"Fees are fixed by law to rise each year\nLuật buộc phí tăng hằng năm"},{"id":"BC260-Q050-C","text":"Miners stop receiving any coins\nThợ đào ngừng nhận mọi coin"},{"id":"BC260-Q050-D","text":"Mining costs fall to zero\nChi phí đào giảm về không"}],"correctOptionId":"BC260-Q050-A","explanation":"Explanation (EN): Bitcoin's block subsidy falls by half periodically, so transaction fees become a larger potential share of miners' revenue. Fees are not guaranteed to rise by law.\nGiải thích (VI): Bitcoin giảm phần thưởng trợ cấp khối qua các kỳ halving, nên phí giao dịch trở thành phần tương đối quan trọng hơn trong động lực kinh tế của thợ đào. Phí không tăng cố định theo luật.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Trợ cấp khối giảm sau mỗi kỳ halving.\n✗ B SAI. Phí Bitcoin không bị luật bắt tăng mỗi năm.\n✗ C SAI. Trợ cấp chưa về 0 ngay sau các kỳ halving.\n✗ D SAI. Chi phí đào không tự động biến mất.","source":"Bộ đề Blockchain - Câu gốc 50/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q051","chapter":1,"number":51,"question":"Which concern arises from the pseudonymous nature of cryptocurrency transactions?\nRủi ro nào xuất phát từ tính bút danh của giao dịch tiền mã hóa?","options":[{"id":"BC260-Q051-A","text":"Higher interest rates on bank loans\nLãi suất cho vay ngân hàng tăng cao"},{"id":"BC260-Q051-B","text":"Use in money laundering and financial crime\nBị lợi dụng để rửa tiền và phạm tội tài chính"},{"id":"BC260-Q051-C","text":"Lower energy use by miners on the network\nThợ đào tiêu thụ ít năng lượng hơn"},{"id":"BC260-Q051-D","text":"A shortage of paper banknotes in circulation\nThiếu tiền giấy đang lưu hành"}],"correctOptionId":"BC260-Q051-B","explanation":"Explanation (EN): Pseudonymous payment addresses may facilitate financial crime if identity controls and monitoring are weak. Public transaction histories do not always reveal real-world users.\nGiải thích (VI): Địa chỉ blockchain mang tính bút danh; khả năng theo dõi các dòng tiền có thể bị lợi dụng để che giấu danh tính thực trong hành vi rửa tiền. Tính công khai không xóa bỏ rủi ro tuân thủ AML.\n\nPhân tích từng đáp án:\n✗ A SAI. Lãi suất vay ngân hàng không do bút danh địa chỉ trực tiếp gây ra.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Bị lợi dụng để rửa tiền và phạm tội tài chính.\n✗ C SAI. Tiêu thụ điện của miner liên quan công nghệ đồng thuận.\n✗ D SAI. Tiền giấy không phải rủi ro xuất phát từ địa chỉ bút danh.","source":"Bộ đề Blockchain - Câu gốc 51/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q052","chapter":2,"number":52,"question":"Why does Bitcoin rely on cryptography in its operation?\nVì sao Bitcoin dựa vào mật mã học khi vận hành?","options":[{"id":"BC260-Q052-A","text":"To allow banks to reverse any disputed payment\nCho phép ngân hàng đảo mọi thanh toán có tranh chấp"},{"id":"BC260-Q052-B","text":"To prove ownership and protect records from tampering\nChứng minh quyền kiểm soát và ngăn sửa bản ghi"},{"id":"BC260-Q052-C","text":"To convert bitcoin automatically into fiat money\nTự đổi Bitcoin sang tiền pháp định"},{"id":"BC260-Q052-D","text":"To hide all transaction amounts from every node\nChe giấu mọi số tiền giao dịch khỏi mọi nút"}],"correctOptionId":"BC260-Q052-B","explanation":"Explanation (EN): Digital signatures and cryptographic hashes provide authorization checks and tamper evidence. Bitcoin does not use cryptography to make every transaction amount secret.\nGiải thích (VI): Mã hóa, chữ ký số và hash giúp xác thực quyền sở hữu/quyền chi tiêu và bảo vệ tính toàn vẹn bản ghi. Chúng không biến mọi dữ liệu trên blockchain thành tuyệt đối bí mật.\n\nPhân tích từng đáp án:\n✗ A SAI. Mạng Bitcoin không có ngân hàng quyền đảo thanh toán.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Chứng minh quyền kiểm soát và ngăn sửa bản ghi.\n✗ C SAI. Mã hóa không tự quy đổi BTC sang tiền pháp định.\n✗ D SAI. Bitcoin công khai giao dịch chứ không giấu mọi số tiền.","source":"Bộ đề Blockchain - Câu gốc 52/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q053","chapter":3,"number":53,"question":"A transaction has inputs of 2 BTC and outputs of 1.5 BTC and 0.49 BTC. What fee does the miner receive?\nGiao dịch có tổng đầu vào 2 BTC và đầu ra 1,5 BTC cùng 0,49 BTC. Thợ đào nhận phí bao nhiêu?","options":[{"id":"BC260-Q053-A","text":"0.5 BTC\n0,5 BTC"},{"id":"BC260-Q053-B","text":"0.01 BTC\n0,01 BTC"},{"id":"BC260-Q053-C","text":"0.49 BTC\n0,49 BTC"},{"id":"BC260-Q053-D","text":"No fee\nKhông có phí"}],"correctOptionId":"BC260-Q053-B","explanation":"Explanation (EN): The fee is 2.00 - (1.50 + 0.49) = 0.01 BTC. The fee is the value not assigned to a transaction output.\nGiải thích (VI): Phí = 2 − (1,5 + 0,49) = 0,01 BTC. Đây là chênh lệch đầu vào và đầu ra của giao dịch Bitcoin, không phải phần trăm cố định.\n\nPhân tích từng đáp án:\n✗ A SAI. 0,5 chỉ lấy 2 trừ 1,5 và bỏ sót đầu ra 0,49.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: 0,01 BTC.\n✗ C SAI. 0,49 là một khoản đầu ra chứ không phải phí.\n✗ D SAI. Chênh lệch còn 0,01 nên không thể nói miễn phí.","source":"Bộ đề Blockchain - Câu gốc 53/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q054","chapter":2,"number":54,"question":"What risk is often associated with Proof of Stake?\nRủi ro thường gắn với Proof of Stake là gì?","options":[{"id":"BC260-Q054-A","text":"Mining hardware becomes too expensive \"\nThiết bị đào trở nên quá đắt"},{"id":"BC260-Q054-B","text":"Wealthy holders may gain more control over validation\nNgười giàu có thể kiểm soát việc xác thực nhiều hơn"},{"id":"BC260-Q054-C","text":"All transactions must be made public with names\nMọi giao dịch phải công khai tên thật"},{"id":"BC260-Q054-D","text":"Blocks can never be confirmed\nKhông bao giờ xác nhận được khối"}],"correctOptionId":"BC260-Q054-B","explanation":"Explanation (EN): Proof of Stake can concentrate validation influence among wealthy stakers. It does not use the same mining hardware race as Proof of Work.\nGiải thích (VI): Với Proof of Stake, người nắm nhiều token hơn có thể có lợi thế xác thực và nhận thêm phần thưởng, gây lo ngại tập trung quyền lực. PoS không cần ASIC như cách đào PoW truyền thống.\n\nPhân tích từng đáp án:\n✗ A SAI. Chi phí thiết bị PoW không phải rủi ro đặc trưng PoS.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Người giàu có thể kiểm soát việc xác thực nhiều hơn.\n✗ C SAI. PoS không yêu cầu công bố tên thật mọi giao dịch.\n✗ D SAI. PoS vẫn có thể xác nhận khối theo quy tắc.","source":"Bộ đề Blockchain - Câu gốc 54/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q055","chapter":2,"number":55,"question":"An attacker changes the amount in a signed transaction. What will nodes find when checking it?\nKẻ tấn công thay đổi số tiền trong giao dịch đã ký. Các nút sẽ phát hiện điều gì khi kiểm tra?","options":[{"id":"BC260-Q055-A","text":"The signature still matches the new amount\nChữ ký vẫn hợp lệ với số tiền mới"},{"id":"BC260-Q055-B","text":"The signature fails to match, So it is rejected\nChữ ký không khớp nên giao dịch bị từ chối"},{"id":"BC260-Q055-C","text":"The transaction is accepted with a warning\nGiao dịch được chấp nhận kèm cảnh báo"},{"id":"BC260-Q055-D","text":"The miner corrects the amount automatically\nThợ đào tự sửa lại số tiền"}],"correctOptionId":"BC260-Q055-B","explanation":"Explanation (EN): A digital signature is tied to the specific signed transaction data. If an attacker changes the amount, verification fails and the altered transaction is invalid.\nGiải thích (VI): Chữ ký số được tạo trên nội dung giao dịch cụ thể. Nếu số tiền bị sửa sau khi ký thì nội dung không khớp chữ ký, giao dịch không vượt qua kiểm tra hợp lệ.\n\nPhân tích từng đáp án:\n✗ A SAI. Thay nội dung đã ký khiến chữ ký không thể vẫn khớp.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Chữ ký không khớp nên giao dịch bị từ chối.\n✗ C SAI. Giao dịch có chữ ký sai phải bị từ chối chứ không chỉ cảnh báo.\n✗ D SAI. Miner không tự sửa số tiền để hợp thức hóa chữ ký.","source":"Bộ đề Blockchain - Câu gốc 55/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q056","chapter":1,"number":56,"question":"A central bank wants to improve settlement only between commercial banks. Which design fits best?\nNgân hàng trung ương muốn cải thiện quyết toán chỉ giữa các ngân hàng thương mại. Thiết kế nào hợp nhất?","options":[{"id":"BC260-Q056-A","text":"Wholesale CBDC\nCBDC bán buôn"},{"id":"BC260-Q056-B","text":"Public cryptocurrency\nTiền mã hóa công khai"},{"id":"BC260-Q056-C","text":"General purpose CBDC\nCBDC cho công chúng"},{"id":"BC260-Q056-D","text":"Retail stablecoin\nStablecoin bán lẻ"}],"correctOptionId":"BC260-Q056-A","explanation":"Explanation (EN): Wholesale CBDC is designed for transfers and settlement among eligible financial institutions. A general-purpose or retail CBDC serves a wider public.\nGiải thích (VI): Wholesale CBDC hướng đến thanh toán và quyết toán giữa các tổ chức tài chính đủ điều kiện. Retail/general-purpose CBDC mới hướng tới đối tượng công chúng rộng hơn.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: CBDC bán buôn.\n✗ B SAI. Tiền mã hóa công khai không phải tiền ngân hàng trung ương dùng liên ngân hàng.\n✗ C SAI. CBDC cho công chúng hướng tới người dùng rộng hơn.\n✗ D SAI. Stablecoin tư nhân không đồng nghĩa CBDC bán buôn.","source":"Bộ đề Blockchain - Câu gốc 56/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q057","chapter":1,"number":57,"question":"Why are Bitcoin users described as pseudonymous rather than fully anonymous?\nVì sao người dùng Bitcoin được gọi là bút danh chứ không hoàn toàn ẩn danh?","options":[{"id":"BC260-Q057-A","text":"Users must register with their national ID number\nNgười dùng phải đăng ký số căn cước"},{"id":"BC260-Q057-B","text":"No transaction details are visible to anyone\nKhông ai xem được chi tiết giao dịch"},{"id":"BC260-Q057-C","text":"Only miners can see the sender' s name\nChỉ thợ đào thấy tên người gửi"},{"id":"BC260-Q057-D","text":"Transactions are public but tied to addresses, not names\nGiao dịch công khai theo địa chỉ, không theo tên"}],"correctOptionId":"BC260-Q057-D","explanation":"Explanation (EN): Bitcoin addresses are pseudonyms visible on a public ledger; they usually do not directly state legal identity. Outside information can still link addresses to people.\nGiải thích (VI): Bitcoin gọi là pseudonymous vì địa chỉ và lịch sử thanh toán hiển thị công khai nhưng thường không trực tiếp ghi tên pháp lý. Dữ liệu ngoài chuỗi vẫn có thể liên kết địa chỉ với con người.\n\nPhân tích từng đáp án:\n✗ A SAI. Bitcoin không yêu cầu đưa số căn cước lên blockchain.\n✗ B SAI. Dữ liệu giao dịch Bitcoin được công khai.\n✗ C SAI. Miner không nhất thiết biết tên thật người gửi.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Giao dịch công khai theo địa chỉ, không theo tên.","source":"Bộ đề Blockchain - Câu gốc 57/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q058","chapter":1,"number":58,"question":"Which field in a block header links it to the block before it?\nTrường nào trong phần đầu khối liên kết khối với khối trước?","options":[{"id":"BC260-Q058-A","text":"The nonce\nNonce"},{"id":"BC260-Q058-B","text":"The version number\nSố phiên bản"},{"id":"BC260-Q058-C","text":"The previous block hash\nHash của khối trước"},{"id":"BC260-Q058-D","text":"The timestamp\nDấu thời gian"}],"correctOptionId":"BC260-Q058-C","explanation":"Explanation (EN): The previous-block-hash field links a block header to its predecessor. The nonce, timestamp and version describe other header properties.\nGiải thích (VI): Trường Previous block hash trong header chứa hash của khối trước, tạo liên kết chuỗi. Merkle root liên kết các giao dịch bên trong cùng khối.\n\nPhân tích từng đáp án:\n✗ A SAI. Nonce dùng trong thử PoW, không liên kết khối trước.\n✗ B SAI. Số phiên bản nói về định dạng/quy tắc.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Hash của khối trước.\n✗ D SAI. Timestamp ghi thời gian khối, không là mối nối hash.","source":"Bộ đề Blockchain - Câu gốc 58/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q059","chapter":3,"number":59,"question":"A miner's block has a 3.125 BTC reward and includes 0.2 BTC in fees. What does the coinbase transaction pay the miner?\nMột khối có trợ cấp 3,125 BTC và phí 0,2 BTC. Giao dịch coinbase trả cho thợ đào bao nhiêu?","options":[{"id":"BC260-Q059-A","text":"3.125 BTC\n3,125 BTC"},{"id":"BC260-Q059-B","text":"3.325 BTC\n3,325 BTC"},{"id":"BC260-Q059-C","text":"0.2 BTC\n0,2 BTC"},{"id":"BC260-Q059-D","text":"2.925 BTC\n2,925 BTC"}],"correctOptionId":"BC260-Q059-B","explanation":"Explanation (EN): The maximum miner payout combines the 3.125 BTC block subsidy and 0.2 BTC transaction fees, totaling 3.325 BTC. A coinbase transaction may claim up to this amount.\nGiải thích (VI): Giá trị coinbase hợp lệ gồm block subsidy 3,125 BTC cộng phí 0,2 BTC, tổng 3,325 BTC. Không bỏ sót phí khi tính thu nhập khối.\n\nPhân tích từng đáp án:\n✗ A SAI. Chỉ tính trợ cấp mà bỏ phí giao dịch.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: 3,325 BTC.\n✗ C SAI. Chỉ tính phí mà bỏ trợ cấp.\n✗ D SAI. Trừ phí khỏi trợ cấp là ngược cơ chế trả thưởng.","source":"Bộ đề Blockchain - Câu gốc 59/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q060","chapter":3,"number":60,"question":"How does the UTXO model differ from the account-based model?\nMô hình UTXO khác mô hình dựa trên tài khoản ra sao?","options":[{"id":"BC260-Q060-A","text":"UTXO tracks unspent outputs; the account model tracks balances\nUTXO theo dõi đầu ra chưa tiêu; tài khoản theo dõi số dư"},{"id":"BC260-Q060-B","text":"UTXO tracks balances 'the account model tracks outputs\nUTXO theo dõi số dư; tài khoản theo dõi đầu ra"},{"id":"BC260-Q060-C","text":"Both track account balances in the same way\nCả hai theo dõi số dư giống nhau"},{"id":"BC260-Q060-D","text":"UTXO is used only by banks for internal settlement records\nUTXO chỉ được ngân hàng dùng quyết toán nội bộ"}],"correctOptionId":"BC260-Q060-A","explanation":"Explanation (EN): Bitcoin's UTXO model tracks discrete unspent outputs. Account-based systems instead update balances associated with accounts; the two methods must not be reversed.\nGiải thích (VI): UTXO ghi nhận các đầu ra chưa tiêu và cho phép tiêu từng đầu ra đúng một lần; mô hình account-based theo dõi và cập nhật số dư tài khoản. Không được đảo hai mô hình.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: UTXO theo dõi đầu ra chưa tiêu; tài khoản theo dõi số dư.\n✗ B SAI. Đảo vai trò UTXO và account-based.\n✗ C SAI. Hai mô hình cập nhật trạng thái theo cách khác nhau.\n✗ D SAI. UTXO không giới hạn trong hệ thống ngân hàng.","source":"Bộ đề Blockchain - Câu gốc 60/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q061","chapter":1,"number":61,"question":"Which statement correctly describes a Bitcoin address?\nPhát biểu nào mô tả đúng địa chỉ Bitcoin?","options":[{"id":"BC260-Q061-A","text":"A secret code used to sign and authorize transactions\nMật mã bí mật dùng ký và phê duyệt giao dịch"},{"id":"BC260-Q061-B","text":"An account number issued by the user's commercial bank\nSố tài khoản do ngân hàng thương mại cấp"},{"id":"BC260-Q061-C","text":"A string of letters and numbers for receiving bitcoin\nChuỗi chữ và số để nhận Bitcoin"},{"id":"BC260-Q061-D","text":"The physical location of a mining node\nVị trí vật lý của nút đào"}],"correctOptionId":"BC260-Q061-C","explanation":"Explanation (EN): A Bitcoin address is a public receiving identifier, typically a text string or QR code derived from key information. It is not the spending key itself.\nGiải thích (VI): Địa chỉ Bitcoin là chuỗi ký tự để người khác gửi BTC. Nó không phải private key, tọa độ máy đào hay số tài khoản ngân hàng.\n\nPhân tích từng đáp án:\n✗ A SAI. Mã bí mật ký giao dịch là private key, không phải địa chỉ.\n✗ B SAI. Bitcoin không cần ngân hàng cấp số tài khoản nhận.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Chuỗi chữ và số để nhận Bitcoin.\n✗ D SAI. Địa chỉ không phải tọa độ máy đào.","source":"Bộ đề Blockchain - Câu gốc 61/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q062","chapter":2,"number":62,"question":"Why do many miners join mining pools?\nVì sao nhiều thợ đào tham gia mining pool?","options":[{"id":"BC260-Q062-A","text":"To receive smaller but more regular rewards\nNhận phần thưởng nhỏ hơn nhưng thường xuyên hơn"},{"id":"BC260-Q062-B","text":"To avoid verifying transactions\nTránh phải xác minh giao dịch"},{"id":"BC260-Q062-C","text":"To control the Bitcoin protocol\nKiểm soát giao thức Bitcoin"},{"id":"BC260-Q062-D","text":"To pay lower electricity tariffs set by law\nĐược trả giá điện thấp hơn theo luật"}],"correctOptionId":"BC260-Q062-A","explanation":"Explanation (EN): Mining pools combine participants' hash power and distribute rewards according to agreed shares. Individual payouts tend to be smaller but more frequent than solo block wins.\nGiải thích (VI): Tham gia mining pool giúp thợ đào nhỏ nhận thu nhập đều hơn dựa trên phần đóng góp, thay vì chờ sự kiện tìm được khối rất hiếm. Tổng lợi nhuận vẫn chịu chi phí và phí pool.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Nhận phần thưởng nhỏ hơn nhưng thường xuyên hơn.\n✗ B SAI. Pool không miễn nghĩa vụ kiểm tra hợp lệ của mỗi thành viên.\n✗ C SAI. Pool không kiểm soát quy tắc của tất cả full node.\n✗ D SAI. Giá điện không giảm tự động theo luật khi vào pool.","source":"Bộ đề Blockchain - Câu gốc 62/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q063","chapter":3,"number":63,"question":"What does ‘double spending’ mean for a digital currency?\n“Chi tiêu kép” trong tiền số có nghĩa là gì?","options":[{"id":"BC260-Q063-A","text":"Spending the same digital coin more than once\nTiêu cùng một đồng tiền số nhiều lần"},{"id":"BC260-Q063-B","text":"Converting a coin into two different currencies\nĐổi coin sang hai loại tiền khác nhau"},{"id":"BC260-Q063-C","text":"Paying two fees for one single transaction\nTrả hai khoản phí cho một giao dịch"},{"id":"BC260-Q063-D","text":"Sending one payment to two addresses by mistake\nVô ý gửi một khoản cho hai địa chỉ"}],"correctOptionId":"BC260-Q063-A","explanation":"Explanation (EN): Double spending means trying to use the same digital value in conflicting payments. Bitcoin's ledger and consensus select valid spends rather than accepting both.\nGiải thích (VI): Double spending là cố dùng cùng một giá trị tiền số cho hai khoản thanh toán không tương thích. Bitcoin dùng kiểm tra UTXO và đồng thuận để chỉ chấp nhận giao dịch hợp lệ.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Tiêu cùng một đồng tiền số nhiều lần.\n✗ B SAI. Đổi tiền là giao dịch khác, không phải chi cùng coin hai lần.\n✗ C SAI. Hai khoản phí không có nghĩa double spend.\n✗ D SAI. Gửi cho nhiều người chỉ là chi tiêu kép nếu cùng đầu ra được dùng xung đột.","source":"Bộ đề Blockchain - Câu gốc 63/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q064","chapter":3,"number":64,"question":"Why does the UTXO model help prevent double spending?\nVì sao mô hình UTXO giúp ngăn chi tiêu kép?","options":[{"id":"BC260-Q064-A","text":"Each account balance is checked by a bank\nNgân hàng kiểm tra số dư từng tài khoản"},{"id":"BC260-Q064-B","text":"Each output can be spent only once\nMỗi đầu ra chỉ có thể được tiêu một lần"},{"id":"BC260-Q064-C","text":"Users must pay a deposit before spending\nNgười dùng phải đặt cọc trước khi chi"},{"id":"BC260-Q064-D","text":"Transactions are reversed after ten minutes\nGiao dịch bị đảo ngược sau 10 phút"}],"correctOptionId":"BC260-Q064-B","explanation":"Explanation (EN): Bitcoin nodes track which transaction outputs have already been spent. Reusing an already spent output is invalid under UTXO verification.\nGiải thích (VI): Trong mô hình UTXO, mỗi đầu ra chỉ được tiêu một lần; mạng từ chối giao dịch dùng UTXO đã chi. Việc 'đã tiêu' được ghi nhận trên sổ cái thay vì cần ngân hàng giám sát.\n\nPhân tích từng đáp án:\n✗ A SAI. Hệ UTXO không nhờ ngân hàng kiểm tra số dư.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Mỗi đầu ra chỉ có thể được tiêu một lần.\n✗ C SAI. Không có yêu cầu đặt cọc để tiêu UTXO.\n✗ D SAI. Giao dịch không tự đảo ngược sau 10 phút.","source":"Bộ đề Blockchain - Câu gốc 64/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q065","chapter":1,"number":65,"question":"Two banks find that their records of the same interbank transfer do not match. Which ledger design would most reduce this problem?\nHai ngân hàng có số liệu khác nhau về cùng một giao dịch liên ngân hàng. Thiết kế sổ cái nào giảm vấn đề này tốt nhất?","options":[{"id":"BC260-Q065-A","text":"A paper ledger kept by the sending bank\nSổ giấy do ngân hàng gửi giữ"},{"id":"BC260-Q065-B","text":"A shared ledger both banks see and update in sync\nMột sổ cái chung hai ngân hàng xem và cập nhật đồng bộ"},{"id":"BC260-Q065-C","text":"Two separate ledgers that are checked against each other yearly\nHai sổ cái riêng được so sánh mỗi năm"},{"id":"BC260-Q065-D","text":"A spreadsheet stored on one bank's server\nBảng tính trên máy chủ một ngân hàng"}],"correctOptionId":"BC260-Q065-B","explanation":"Explanation (EN): A shared, synchronized ledger gives both banks one consistent view of the transfer. Separate records require recurring reconciliation and can disagree.\nGiải thích (VI): Một sổ cái dùng chung, được đồng bộ và xác minh giữa hai ngân hàng, giảm tình trạng số liệu không khớp phải đối soát nhiều lần. Hai bản ghi biệt lập chỉ làm phát sinh thêm chi phí hòa giải.\n\nPhân tích từng đáp án:\n✗ A SAI. Sổ giấy một phía không cho hai ngân hàng cùng xác minh bản ghi.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Một sổ cái chung hai ngân hàng xem và cập nhật đồng bộ.\n✗ C SAI. Hai sổ riêng vẫn cần đối chiếu và có thể lệch nhau.\n✗ D SAI. Chỉ dùng bảng tính tại một ngân hàng không bảo đảm hai bên đồng bộ.","source":"Bộ đề Blockchain - Câu gốc 65/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q066","chapter":1,"number":66,"question":"What does a cryptocurrency wallet mainly store?\nVí tiền mã hóa chủ yếu lưu gì?","options":[{"id":"BC260-Q066-A","text":"The coins themselves as digital files\nBản thân coin dưới dạng tệp số"},{"id":"BC260-Q066-B","text":"The user's private keys\nKhóa riêng của người dùng"},{"id":"BC260-Q066-C","text":"The passwords of other users\nMật khẩu người dùng khác"},{"id":"BC260-Q066-D","text":"A copy of every block in the blockchain\nBản sao toàn bộ khối trong blockchain"}],"correctOptionId":"BC260-Q066-B","explanation":"Explanation (EN): A cryptocurrency wallet manages secret keys and often seed backups and receiving addresses. Coins themselves are recorded on the blockchain, not kept as files inside the wallet.\nGiải thích (VI): Ví tiền mã hóa quản lý private key, seed phrase và thông tin địa chỉ, không lưu coin như tệp bên trong điện thoại. Mất khóa có thể làm mất quyền chi tiêu.\n\nPhân tích từng đáp án:\n✗ A SAI. Coin được ghi trên sổ cái blockchain.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Khóa riêng của người dùng.\n✗ C SAI. Ví không chứa mật khẩu người dùng khác.\n✗ D SAI. Ví thông thường không cần lưu toàn bộ blockchain.","source":"Bộ đề Blockchain - Câu gốc 66/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q067","chapter":3,"number":67,"question":"Why does a Bitcoin transaction often include a ‘change’ output back to the sender?\nVì sao giao dịch Bitcoin thường có đầu ra “tiền thừa” trả lại người gửi?","options":[{"id":"BC260-Q067-A","text":"The receiver must return part of the payment\nNgười nhận phải hoàn lại một phần"},{"id":"BC260-Q067-B","text":"Miners require a refund on every transaction\nThợ đào yêu cầu hoàn tiền mọi giao dịch"},{"id":"BC260-Q067-C","text":"It is needed to pay the bank's commission\nCần để trả hoa hồng ngân hàng"},{"id":"BC260-Q067-D","text":"A UTXO is spent in full, so the excess comes back\nUTXO được tiêu toàn bộ nên phần dư được trả lại"}],"correctOptionId":"BC260-Q067-D","explanation":"Explanation (EN): A UTXO used as an input is consumed in full. After paying the recipient and the fee, the remainder is created as a new change output under the sender's control.\nGiải thích (VI): Trong UTXO, đầu vào được chi toàn bộ; phần còn dư sau khi trả người nhận và phí thường quay lại địa chỉ change của người gửi. Đây không phải tiền người nhận hoàn trả.\n\nPhân tích từng đáp án:\n✗ A SAI. Đầu ra change do người gửi tạo, không do người nhận hoàn lại.\n✗ B SAI. Miner không yêu cầu refund cho từng giao dịch.\n✗ C SAI. Không phải hoa hồng ngân hàng.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: UTXO được tiêu toàn bộ nên phần dư được trả lại.","source":"Bộ đề Blockchain - Câu gốc 67/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q068","chapter":3,"number":68,"question":"During busy periods, a user's low-fee transaction stays unconfirmed for hours. What best explains this?\nTrong giờ cao điểm, giao dịch phí thấp không được xác nhận hàng giờ. Nguyên nhân phù hợp nhất là gì?","options":[{"id":"BC260-Q068-A","text":"The transaction was deleted from the blockchain\nGiao dịch bị xóa khỏi blockchain"},{"id":"BC260-Q068-B","text":"Low-fee transactions are sent to banks first\nGiao dịch phí thấp được gửi cho ngân hàng trước"},{"id":"BC260-Q068-C","text":"Miners prioritize transactions offering higher fees\nThợ đào ưu tiên giao dịch trả phí cao hơn"},{"id":"BC260-Q068-D","text":"The network closes during busy periods\nMạng ngừng hoạt động khi đông"}],"correctOptionId":"BC260-Q068-C","explanation":"Explanation (EN): When block space is scarce, miners generally favor higher fee-rate transactions. Low-fee transactions can remain pending in mempools for a long time.\nGiải thích (VI): Khi mạng đông, thợ đào thường chọn giao dịch có mức phí theo kích thước dữ liệu cao hơn. Giao dịch phí thấp có thể chờ lâu trong mempool trước khi được xác nhận.\n\nPhân tích từng đáp án:\n✗ A SAI. Chưa xác nhận không đồng nghĩa đã bị xóa khỏi chuỗi.\n✗ B SAI. Mạng Bitcoin không chuyển giao dịch phí thấp tới ngân hàng.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Thợ đào ưu tiên giao dịch trả phí cao hơn.\n✗ D SAI. Mạng không đóng cửa khi bận, chỉ cạnh tranh không gian khối.","source":"Bộ đề Blockchain - Câu gốc 68/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q069","chapter":2,"number":69,"question":"What do miners receive for successfully adding a block?\nThợ đào nhận gì khi thêm thành công một khối?","options":[{"id":"BC260-Q069-A","text":"Interest paid by the central bank\nLãi do ngân hàng trung ương trả"},{"id":"BC260-Q069-B","text":"Free electricity from the network\nĐiện miễn phí từ mạng"},{"id":"BC260-Q069-C","text":"A share of every user's balance\nMột phần số dư của mọi người"},{"id":"BC260-Q069-D","text":"The block reward plus transaction fees\nTrợ cấp/phần thưởng khối cộng phí giao dịch"}],"correctOptionId":"BC260-Q069-D","explanation":"Explanation (EN): A winning Bitcoin miner may collect the block subsidy together with transaction fees. It does not earn a percentage of every user's balance.\nGiải thích (VI): Thợ đào tìm được khối hợp lệ nhận trợ cấp khối theo lịch phát hành cộng phí của các giao dịch chứa trong khối. Đây không phải tiền lãi do ngân hàng trung ương trả.\n\nPhân tích từng đáp án:\n✗ A SAI. Không do ngân hàng trung ương trả lãi.\n✗ B SAI. Mạng không cấp điện miễn phí.\n✗ C SAI. Miner không tự lấy một phần số dư người dùng.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Trợ cấp/phần thưởng khối cộng phí giao dịch.","source":"Bộ đề Blockchain - Câu gốc 69/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q070","chapter":3,"number":70,"question":"A bank employee wants to delete an old confirmed Bitcoin transaction. Why is this not feasible?\nVì sao nhân viên ngân hàng không thể xóa một giao dịch Bitcoin cũ đã được xác nhận?","options":[{"id":"BC260-Q070-A","text":"The transaction is protected by the bank's password\nGiao dịch được mật khẩu ngân hàng bảo vệ"},{"id":"BC260-Q070-B","text":"Only the original miner can delete it\nChỉ thợ đào ban đầu có thể xóa"},{"id":"BC260-Q070-C","text":"Every node holds a copy, So changes are detected\nMọi nút giữ bản sao nên phát hiện sửa đổi"},{"id":"BC260-Q070-D","text":"Bitcoin transactions automatically expire after a year\nGiao dịch tự hết hạn sau một năm"}],"correctOptionId":"BC260-Q070-C","explanation":"Explanation (EN): Validated blocks are replicated and linked by hashes. Deleting an old record from one machine cannot remove it from the consensus history.\nGiải thích (VI): Khối đã xác nhận được nhiều nút lưu và liên kết bằng hash; một cá nhân không thể chỉ xóa giao dịch khỏi một máy là khiến mạng chấp nhận. Lịch sử được bảo vệ bởi xác minh tập thể.\n\nPhân tích từng đáp án:\n✗ A SAI. Không cần mật khẩu ngân hàng để bảo vệ khối Bitcoin.\n✗ B SAI. Miner ban đầu không có quyền tự xóa giao dịch.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Mọi nút giữ bản sao nên phát hiện sửa đổi.\n✗ D SAI. Giao dịch Bitcoin không tự hết hạn sau một năm.","source":"Bộ đề Blockchain - Câu gốc 70/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q071","chapter":3,"number":71,"question":"What is the Bitcoin halving?\nBitcoin halving là gì?","options":[{"id":"BC260-Q071-A","text":"The number of miners is halved by law\nLuật giảm một nửa số thợ đào"},{"id":"BC260-Q071-B","text":"Transaction fees are halved at the start of every year\nPhí giao dịch giảm nửa đầu năm"},{"id":"BC260-Q071-C","text":"The block reward is cut in half every 210,000 blocks\nTrợ cấp khối giảm một nửa mỗi 210.000 khối"},{"id":"BC260-Q071-D","text":"Bitcoin' S price is halved every four years\nGiá Bitcoin giảm một nửa mỗi bốn năm"}],"correctOptionId":"BC260-Q071-C","explanation":"Explanation (EN): Bitcoin halving reduces the block subsidy by 50% every 210,000 blocks, approximately four years. It does not halve price, fees, or the number of miners.\nGiải thích (VI): Halving là sự kiện trợ cấp BTC mỗi khối giảm 50%, xảy ra sau mỗi 210.000 khối. Nó không trực tiếp buộc giá BTC giảm hoặc làm tổng số thợ đào giảm.\n\nPhân tích từng đáp án:\n✗ A SAI. Halving không giảm số người đào theo luật.\n✗ B SAI. Halving không buộc phí cắt đôi mỗi năm.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Trợ cấp khối giảm một nửa mỗi 210.000 khối.\n✗ D SAI. Giá thị trường không bị quy tắc halving chia đôi.","source":"Bộ đề Blockchain - Câu gốc 71/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q072","chapter":1,"number":72,"question":"A merchant shows a QR code so a customer can pay in bitcoin. What does the code most likely contain?\nMột cửa hàng hiện mã QR để khách trả Bitcoin. Mã này nhiều khả năng chứa gì?","options":[{"id":"BC260-Q072-A","text":"The merchant's bank account login details\nThông tin đăng nhập tài khoản ngân hàng của cửa hàng"},{"id":"BC260-Q072-B","text":"A copy of the latest block in the chain\nBản sao khối mới nhất"},{"id":"BC260-Q072-C","text":"The merchant's private key for the wallet\nKhóa riêng của ví cửa hàng"},{"id":"BC260-Q072-D","text":"The merchant's address and the amount due\nĐịa chỉ nhận tiền và số tiền cần trả"}],"correctOptionId":"BC260-Q072-D","explanation":"Explanation (EN): A payment QR code generally encodes a receiving address and may include a requested amount. It must never disclose the merchant's private key.\nGiải thích (VI): Mã QR nhận Bitcoin thường mã hóa địa chỉ người nhận, có thể kèm số tiền và thông tin yêu cầu thanh toán. Private key không bao giờ được tiết lộ trong mã QR nhận tiền.\n\nPhân tích từng đáp án:\n✗ A SAI. QR thanh toán không phải tài khoản ngân hàng.\n✗ B SAI. Không cần nhúng khối mới nhất.\n✗ C SAI. Khóa riêng không bao giờ được đưa cho khách.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Địa chỉ nhận tiền và số tiền cần trả.","source":"Bộ đề Blockchain - Câu gốc 72/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q073","chapter":1,"number":73,"question":"Several banks want to share trade-finance records only among themselves, under joint governance. Which blockchain type fits best?\nNhiều ngân hàng muốn chia sẻ dữ liệu tài trợ thương mại trong nhóm và cùng quản trị. Loại blockchain nào thích hợp?","options":[{"id":"BC260-Q073-A","text":"A single bank's private database\nCơ sở dữ liệu riêng của một ngân hàng"},{"id":"BC260-Q073-B","text":"Public blockchain\nBlockchain công khai"},{"id":"BC260-Q073-C","text":"Consortium blockchain\nBlockchain liên minh"},{"id":"BC260-Q073-D","text":"No blockchain is suitable\nKhông blockchain nào phù hợp"}],"correctOptionId":"BC260-Q073-C","explanation":"Explanation (EN): A consortium blockchain suits multiple known institutions that jointly govern access and validation. It differs from a public permissionless chain and one firm's private ledger.\nGiải thích (VI): Nhiều ngân hàng đồng quản trị và chỉ các thành viên được phép truy cập là mô hình consortium/permissioned blockchain. Nó khác public blockchain mở cho mọi người.\n\nPhân tích từng đáp án:\n✗ A SAI. Cơ sở dữ liệu riêng một ngân hàng không chia quyền quản trị.\n✗ B SAI. Blockchain công khai cho người ngoài tham gia, trái điều kiện.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Blockchain liên minh.\n✗ D SAI. Blockchain liên minh phù hợp yêu cầu nhiều ngân hàng.","source":"Bộ đề Blockchain - Câu gốc 73/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q074","chapter":1,"number":74,"question":"Why are confirmed Bitcoin transactions considered practically immutable?\nVì sao giao dịch Bitcoin đã xác nhận được xem là khó thay đổi trên thực tế?","options":[{"id":"BC260-Q074-A","text":"Altering one would require redoing the work for all later blocks\nSửa một giao dịch cần làm lại công việc cho tất cả khối sau"},{"id":"BC260-Q074-B","text":"A court order is needed before any transaction can be deleted\nCần lệnh tòa mới xóa được"},{"id":"BC260-Q074-C","text":"Each transaction is stored only on the sender's device\nMỗi giao dịch chỉ lưu trên máy người gửi"},{"id":"BC260-Q074-D","text":"The founder holds the only key that can edit records [cần đối chiếu ảnh gốc]\nNgười sáng lập giữ khóa duy nhất để sửa bản ghi [cần đối chiếu ảnh]"}],"correctOptionId":"BC260-Q074-A","explanation":"Explanation (EN): Changing a confirmed transaction requires changing its Merkle root and subsequent linked blocks and overcoming cumulative work. Immutability is practical rather than absolute.\nGiải thích (VI): Muốn thay đổi khối cũ, bên tấn công phải tái tạo công việc tính toán cho khối đó và các khối phía sau sao cho một nhánh gian lận vượt được nhánh trung thực. Vì thế tính bất biến là thực tiễn, không tuyệt đối toán học.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Sửa một giao dịch cần làm lại công việc cho tất cả khối sau.\n✗ B SAI. Khối không bị xóa bởi quyết định tòa án trên mạng phân tán.\n✗ C SAI. Không chỉ lưu giao dịch trên thiết bị người gửi.\n✗ D SAI. Không tồn tại khóa sửa lịch sử duy nhất của người sáng lập.\n\n⚠ Cần đối chiếu ảnh gốc: Một lựa chọn bị che hoặc có lỗi nhận dạng.","source":"Bộ đề Blockchain - Câu gốc 74/260","topic":"Overview of Blockchain","needsReview":true},{"id":"BC260-Q075","chapter":1,"number":75,"question":"What is the main role of the blockchain in Bitcoin?\nVai trò chính của blockchain trong Bitcoin là gì?","options":[{"id":"BC260-Q075-A","text":"To hold the private keys of every Bitcoin user\nGiữ khóa riêng của mọi người dùng"},{"id":"BC260-Q075-B","text":"To set the exchange rate of bitcoin to dollars\nĐịnh giá Bitcoin theo USD"},{"id":"BC260-Q075-C","text":"To serve as the shared public ledger of transactions\nLàm sổ cái giao dịch công khai dùng chung"},{"id":"BC260-Q075-D","text":"To store users' passwords and personal identities\nLưu mật khẩu và danh tính người dùng"}],"correctOptionId":"BC260-Q075-C","explanation":"Explanation (EN): Bitcoin's blockchain is the shared, independently checkable record of transactions. It does not store all users' passwords or determine a fixed exchange rate.\nGiải thích (VI): Blockchain chính là sổ cái giao dịch dùng chung của Bitcoin, ghi nhận các giao dịch được xác nhận theo chuỗi khối. Không chứa private key cá nhân hay ấn định tỷ giá.\n\nPhân tích từng đáp án:\n✗ A SAI. Blockchain không quản lý khóa riêng mọi người.\n✗ B SAI. Giá trao đổi do thị trường, không do sổ cái ấn định.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Làm sổ cái giao dịch công khai dùng chung.\n✗ D SAI. Sổ cái không cần lưu mật khẩu và danh tính thật.","source":"Bộ đề Blockchain - Câu gốc 75/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q076","chapter":3,"number":76,"question":"A startup wants a payment system that anyone in the world can join without permission. Which type should it use?\nMột công ty khởi nghiệp muốn hệ thống thanh toán mọi người đều tham gia được mà không xin phép. Nên dùng loại nào?","options":[{"id":"BC260-Q076-A","text":"Private blockchain\nBlockchain riêng"},{"id":"BC260-Q076-B","text":"Consortium blockchain\nBlockchain liên minh"},{"id":"BC260-Q076-C","text":"Centralized ledger\nSổ cái tập trung"},{"id":"BC260-Q076-D","text":"Public blockchain\nBlockchain công khai"}],"correctOptionId":"BC260-Q076-D","explanation":"Explanation (EN): A public permissionless blockchain allows participation without admission by one organization. A private or consortium system restricts membership or governance.\nGiải thích (VI): Với hệ thống cho mọi người tham gia mà không xin phép, public/permissionless blockchain đáp ứng yêu cầu. Private hoặc consortium đặt giới hạn thành viên.\n\nPhân tích từng đáp án:\n✗ A SAI. Blockchain riêng yêu cầu được cấp phép.\n✗ B SAI. Consortium chỉ mở cho nhóm quản trị.\n✗ C SAI. Sổ cái tập trung dựa vào một chủ thể.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Blockchain công khai.","source":"Bộ đề Blockchain - Câu gốc 76/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q077","chapter":3,"number":77,"question":"A user runs a full node and receives a block with a reward larger than the protocol allows. What does the node do?\nFull node nhận khối có phần thưởng vượt quá giới hạn giao thức. Nút đó làm gì?","options":[{"id":"BC260-Q077-A","text":"Waits fora bank to confirm it\nChờ ngân hàng xác nhận"},{"id":"BC260-Q077-B","text":"Rejects the block as invalid\nTừ chối khối không hợp lệ"},{"id":"BC260-Q077-C","text":"Accepts it but reports it to the police\nChấp nhận rồi báo cảnh sát"},{"id":"BC260-Q077-D","text":"Accepts it because miners decide the reward\nChấp nhận vì thợ đào quyết định thưởng"}],"correctOptionId":"BC260-Q077-B","explanation":"Explanation (EN): A full node checks every candidate block against consensus rules. If the coinbase overpays the allowed subsidy and fees, the entire block is invalid and rejected.\nGiải thích (VI): Full node tự kiểm tra số BTC được phép tạo và mọi quy tắc đồng thuận. Khối có coinbase trả vượt mức bị từ chối cho dù thợ đào tìm được hash PoW hợp lệ.\n\nPhân tích từng đáp án:\n✗ A SAI. Không cần ngân hàng quyết định tính hợp lệ.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Từ chối khối không hợp lệ.\n✗ C SAI. Chỉ báo cảnh sát không làm khối hợp lệ.\n✗ D SAI. Thợ đào cũng chịu quy tắc thưởng và kiểm tra của nút.","source":"Bộ đề Blockchain - Câu gốc 77/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q078","chapter":3,"number":78,"question":"A friend plans to ask Bitcoin's 'customer service' to reverse a mistaken payment. What is the most accurate response?\nMột người định nhờ “chăm sóc khách hàng Bitcoin” đảo ngược khoản gửi nhầm. Phản hồi nào chính xác nhất?","options":[{"id":"BC260-Q078-A","text":"The confirming miner can refund the payment\nThợ đào xác nhận có thể hoàn tiền"},{"id":"BC260-Q078-B","text":"The receiver' s bank must approve the reversal\nNgân hàng của người nhận phải đồng ý đảo ngược"},{"id":"BC260-Q078-C","text":"It can be reversed if requested within 24 hours\nCó thể đảo ngược trong 24 giờ"},{"id":"BC260-Q078-D","text":"No central party exists that can reverse it\nKhông có bên trung tâm nào có thể đảo ngược"}],"correctOptionId":"BC260-Q078-D","explanation":"Explanation (EN): Bitcoin has no central customer service with power to reverse a confirmed payment. Voluntary repayment by the recipient is separate from a network-level reversal.\nGiải thích (VI): Bitcoin không có bộ phận hỗ trợ trung tâm có quyền đảo giao dịch đã hoàn tất. Đôi bên có thể tự thỏa thuận gửi giao dịch hoàn tiền mới, nhưng không phải sửa giao dịch cũ.\n\nPhân tích từng đáp án:\n✗ A SAI. Thợ đào không có quyền đơn phương thu hồi tiền đã gửi.\n✗ B SAI. Ngân hàng người nhận không kiểm soát Bitcoin.\n✗ C SAI. Không có thời hạn chung 24 giờ để đảo giao dịch.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Không có bên trung tâm nào có thể đảo ngược.","source":"Bộ đề Blockchain - Câu gốc 78/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q079","chapter":2,"number":79,"question":"Why does Bitcoin adjust mining difficulty when total computing power rises?\nTại sao Bitcoin điều chỉnh độ khó đào khi tổng sức mạnh tính toán tăng?","options":[{"id":"BC260-Q079-A","text":"To increase the reward for miners\nTăng thưởng cho thợ đào"},{"id":"BC260-Q079-B","text":"To keep the average block time near 10 minutes\nGiữ thời gian khối trung bình gần 10 phút"},{"id":"BC260-Q079-C","text":"To make transactions cheaper for users\nLàm giao dịch rẻ hơn"},{"id":"BC260-Q079-D","text":"To reduce the number of nodes on the network\nGiảm số nút trong mạng"}],"correctOptionId":"BC260-Q079-B","explanation":"Explanation (EN): Bitcoin adjusts Proof-of-Work difficulty so blocks continue to arrive roughly every ten minutes despite changes in network hash power. Difficulty is not a fee or reward setting.\nGiải thích (VI): Khi tổng hashrate tăng, giao thức điều chỉnh độ khó nhằm duy trì thời gian tạo khối trung bình gần 10 phút trong dài hạn. Tăng sức mạnh đào không tự làm phần thưởng mỗi khối tăng.\n\nPhân tích từng đáp án:\n✗ A SAI. Phần thưởng được xác định bởi giao thức và phí, không theo độ khó.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Giữ thời gian khối trung bình gần 10 phút.\n✗ C SAI. Độ khó không được điều chỉnh để giảm phí người dùng.\n✗ D SAI. Mục tiêu không phải giảm số nút.","source":"Bộ đề Blockchain - Câu gốc 79/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q080","chapter":1,"number":80,"question":"Why does Bitcoin's fixed supply make it different from fiat money?\nVì sao nguồn cung cố định khiến Bitcoin khác tiền pháp định?","options":[{"id":"BC260-Q080-A","text":"Its supply rises automatically whenever the economy grows 4\nNguồn cung tự tăng khi kinh tế tăng trưởng [ảnh lỗi chữ]"},{"id":"BC260-Q080-B","text":"Vent al banks adjust its supply each quart\nNgân hàng trung ương điều chỉnh nguồn cung mỗi quý [ảnh lỗi chữ]"},{"id":"BC260-Q080-C","text":"No authority can issue coins beyond the protocol limit\nKhông cơ quan nào phát hành vượt giới hạn giao thức"},{"id":"BC260-Q080-D","text":"Miners vote yearly on how many coins to permit [cần đối chiếu ảnh gốc]\nThợ đào bỏ phiếu hằng năm về hạn mức coin [cần đối chiếu ảnh]"}],"correctOptionId":"BC260-Q080-C","explanation":"Explanation (EN): Bitcoin's issuance follows protocol rules rather than discretionary expansion by a monetary authority. Its finite limit does not imply a stable market price.\nGiải thích (VI): Giới hạn nguồn cung Bitcoin được thực thi bằng quy tắc đồng thuận: một tổ chức không thể đơn phương tăng trần phát hành như ngân hàng trung ương có thể điều chỉnh tiền pháp định.\n\nPhân tích từng đáp án:\n✗ A SAI. Nguồn cung không tự tăng theo tăng trưởng kinh tế; ảnh gốc mờ.\n✗ B SAI. Ngân hàng trung ương không điều chỉnh nguồn cung Bitcoin.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Không cơ quan nào phát hành vượt giới hạn giao thức.\n✗ D SAI. Miner không bỏ phiếu tùy ý để phát hành vượt giới hạn.\n\n⚠ Cần đối chiếu ảnh gốc: Một lựa chọn bị che hoặc có lỗi nhận dạng.","source":"Bộ đề Blockchain - Câu gốc 80/260","topic":"Overview of Blockchain","needsReview":true},{"id":"BC260-Q081","chapter":1,"number":81,"question":"Why is decentralization considered a key characteristic of blockchain?\nVì sao phi tập trung là đặc điểm then chốt của blockchain?","options":[{"id":"BC260-Q081-A","text":"One authority can quickly correct any error\nMột cơ quan có thể nhanh chóng sửa mọi lỗi"},{"id":"BC260-Q081-B","text":"Control and data are spread across many nodes\nQuyền kiểm soát và dữ liệu phân bố ở nhiều nút"},{"id":"BC260-Q081-C","text":"It allows anonymOus administrators to edit data\nCho quản trị viên ẩn danh sửa dữ liệu"},{"id":"BC260-Q081-D","text":"It reduces the number of copies of the ledger\nGiảm số bản sao sổ cái"}],"correctOptionId":"BC260-Q081-B","explanation":"Explanation (EN): Decentralization distributes records and decision-making across many participants, reducing single-party control. It is not the ability of an administrator to edit past transactions.\nGiải thích (VI): Phi tập trung nghĩa là dữ liệu và quyền kiểm tra được phân tán giữa nhiều nút, hạn chế phụ thuộc vào một người quản trị. Nó không đồng nghĩa không có bất kỳ giới hạn kỹ thuật hoặc tập trung kinh tế nào.\n\nPhân tích từng đáp án:\n✗ A SAI. Quyền sửa tập trung trái nguyên tắc phân quyền.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Quyền kiểm soát và dữ liệu phân bố ở nhiều nút.\n✗ C SAI. Quản trị viên không được tự sửa tùy ý lịch sử blockchain.\n✗ D SAI. Blockchain phân tán thường có nhiều bản sao chứ không giảm xuống một.","source":"Bộ đề Blockchain - Câu gốc 81/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q082","chapter":2,"number":82,"question":"What is the main purpose of a consensus mechanism in a blockchain?\nMục đích chính của cơ chế đồng thuận blockchain là gì?","options":[{"id":"BC260-Q082-A","text":"To set the price of the cryptocurrency\nĐặt giá đồng tiền mã hóa"},{"id":"BC260-Q082-B","text":"To make nodes agree on the valid ledger state\nLàm các nút thống nhất trạng thái sổ cái hợp lệ"},{"id":"BC260-Q082-C","text":"19 identifY users by their real name\nNhận dạng người dùng theo tên thật [ảnh lỗi chữ]"},{"id":"BC260-Q082-D","text":"+9 encrypt users' private keys on each nana\nMã hóa khóa riêng của người dùng ở mỗi nút [ảnh lỗi chữ]"}],"correctOptionId":"BC260-Q082-B","explanation":"Explanation (EN): Consensus rules help nodes agree on a valid ledger history and resolve competing blocks. They do not set exchange prices or disclose private keys.\nGiải thích (VI): Consensus giúp các nút chấp nhận trạng thái sổ cái và thứ tự giao dịch hợp lệ. Giá thị trường, danh tính pháp lý và khóa riêng không phải mục tiêu trực tiếp của thuật toán đồng thuận.\n\nPhân tích từng đáp án:\n✗ A SAI. Đồng thuận không định giá Bitcoin.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Làm các nút thống nhất trạng thái sổ cái hợp lệ.\n✗ C SAI. Đồng thuận không xác minh tên pháp lý người dùng.\n✗ D SAI. Đồng thuận không phải cơ chế mã hóa khóa riêng ở mỗi nút.","source":"Bộ đề Blockchain - Câu gốc 82/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q083","chapter":2,"number":83,"question":"Why does a wallet need the sender's private key to create a transaction?\nVì sao ví cần khóa riêng của người gửi để tạo giao dịch?","options":[{"id":"BC260-Q083-A","text":"To link the wallet to the sender' s bank\nLiên kết ví với ngân hàng người gửi"},{"id":"BC260-Q083-B","text":"To choose which miner will confirm it\nChọn thợ đào xác nhận giao dịch"},{"id":"BC260-Q083-C","text":"To work out the receiver's address\nTìm địa chỉ người nhận"},{"id":"BC260-Q083-D","text":"To sign it and prove the right to spend\nKý giao dịch và chứng minh quyền chi tiêu"}],"correctOptionId":"BC260-Q083-D","explanation":"Explanation (EN): The sender uses a private key to sign the transaction and demonstrate authority over the inputs. The receiver's address can be known without using the sender's key.\nGiải thích (VI): Người gửi cần private key để ký giao dịch, chứng minh quyền sử dụng UTXO hoặc tài sản ở địa chỉ tương ứng. Không phải để chọn miner hoặc tính địa chỉ người nhận.\n\nPhân tích từng đáp án:\n✗ A SAI. Khóa riêng không dùng liên kết ngân hàng.\n✗ B SAI. Chọn miner không phải mục đích chữ ký ví.\n✗ C SAI. Địa chỉ nhận tiền không cần khóa riêng người gửi để tìm.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Ký giao dịch và chứng minh quyền chi tiêu.","source":"Bộ đề Blockchain - Câu gốc 83/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q084","chapter":1,"number":84,"question":"Which type of blockchain is governed by a group of organizations rather than one?\nLoại blockchain nào do một nhóm tổ chức cùng quản trị chứ không phải một tổ chức?","options":[{"id":"BC260-Q084-A","text":"Personal blockchain\nBlockchain cá nhân"},{"id":"BC260-Q084-B","text":"Consortium blockchain\nBlockchain liên minh"},{"id":"BC260-Q084-C","text":"Private blockchain owned by one firm\nBlockchain riêng do một công ty sở hữu"},{"id":"BC260-Q084-D","text":"Public blockchain\nBlockchain công khai"}],"correctOptionId":"BC260-Q084-B","explanation":"Explanation (EN): A consortium blockchain distributes governance among a defined group of organizations. A single-owner private chain has different control arrangements.\nGiải thích (VI): Consortium blockchain được một nhóm tổ chức thống nhất quản trị, khác private blockchain do một chủ sở hữu và public blockchain mở. Tính phân quyền thường chỉ một phần.\n\nPhân tích từng đáp án:\n✗ A SAI. Blockchain cá nhân không phải loại quản trị nhiều tổ chức.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Blockchain liên minh.\n✗ C SAI. Một doanh nghiệp sở hữu là private chain.\n✗ D SAI. Blockchain công khai không có nhóm tổ chức quản trị độc quyền.","source":"Bộ đề Blockchain - Câu gốc 84/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q085","chapter":3,"number":85,"question":"A user receives an email asking for their wallet recovery phrase to ‘verify the account’. What should they do?\nNgười dùng nhận email yêu cầu seed phrase để “xác minh tài khoản”. Nên làm gì?","options":[{"id":"BC260-Q085-A","text":"Refuse, because anyone with the phrase can take the funds\nTừ chối vì ai có cụm từ này đều có thể lấy tiền"},{"id":"BC260-Q085-B","text":"Send only half of the phrase\nChỉ gửi một nửa cụm từ"},{"id":"BC260-Q085-C","text":"Post it on social media for safety\nĐăng lên mạng xã hội cho an toàn"},{"id":"BC260-Q085-D","text":"Send it, since wallets require periodic verification\nGửi vì ví phải xác minh định kỳ"}],"correctOptionId":"BC260-Q085-A","explanation":"Explanation (EN): A recovery phrase is a secret that can regenerate wallet keys. Sharing it with an email requester can hand over control of the assets.\nGiải thích (VI): Seed phrase có thể tái tạo khóa ví; gửi nó cho kẻ lạ đồng nghĩa trao quyền kiểm soát tài sản. Email 'xác minh tài khoản' xin seed là dấu hiệu lừa đảo, không có lý do tiết lộ nửa cụm từ.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Từ chối vì ai có cụm từ này đều có thể lấy tiền.\n✗ B SAI. Dù chia nửa cụm từ vẫn là hành vi nguy hiểm và không cần thiết.\n✗ C SAI. Đăng seed phrase công khai làm mất quyền kiểm soát.\n✗ D SAI. Không ví hợp pháp nào cần bạn tiết lộ seed phrase cho người lạ.","source":"Bộ đề Blockchain - Câu gốc 85/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q086","chapter":1,"number":86,"question":"Why is it said that ‘a wallet does not hold coins’?\nVì sao nói “ví không chứa các đồng coin”?","options":[{"id":"BC260-Q086-A","text":"Coins stay on the blockchain; the wallet holds the keys\nCoin nằm trên blockchain; ví giữ các khóa"},{"id":"BC260-Q086-B","text":"Coins are held by miners until the owner decides to spend them\nThợ đào giữ coin cho đến khi chủ dùng"},{"id":"BC260-Q086-C","text":"Coins exist only as paper certificates\nCoin chỉ là chứng chỉ giấy"},{"id":"BC260-Q086-D","text":"Coins are stored by the exchange, never by users\nCoin luôn nằm trên sàn, người dùng không giữ"}],"correctOptionId":"BC260-Q086-A","explanation":"Explanation (EN): Bitcoin balances and unspent outputs are represented on the shared ledger. A wallet primarily manages the keys required to authorize spending.\nGiải thích (VI): Bitcoin tồn tại trên sổ cái dưới dạng UTXO/quyền chi tiêu, không phải các tệp 'coin' nằm bên trong ứng dụng ví. Ví chủ yếu quản lý khóa giúp chứng minh quyền chi tiêu.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Coin nằm trên blockchain; ví giữ các khóa.\n✗ B SAI. Thợ đào không giữ coin hộ mọi người.\n✗ C SAI. Bitcoin không tồn tại dưới dạng chứng chỉ giấy.\n✗ D SAI. Không phải coin của mọi ví đều được sàn lưu ký.","source":"Bộ đề Blockchain - Câu gốc 86/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q087","chapter":4,"number":87,"question":"What is an altcoin?\nAltcoin là gì?","options":[{"id":"BC260-Q087-A","text":"Any cryptocurrency other than Bitcoin\nBất kỳ tiền mã hóa nào ngoài Bitcoin"},{"id":"BC260-Q087-B","text":"A paper certificate of bitcoin owners hip\nGiấy chứng nhận quyền sở hữu Bitcoin"},{"id":"BC260-Q087-C","text":"A stablecoin issued by a central bank\nStablecoin do ngân hàng trung ương phát hành"},{"id":"BC260-Q087-D","text":"A token used only for mining\nToken chỉ dùng để đào"}],"correctOptionId":"BC260-Q087-A","explanation":"Explanation (EN): An altcoin is a cryptocurrency other than Bitcoin. The term includes many different designs and does not automatically mean a stablecoin or CBDC.\nGiải thích (VI): Altcoin là tên chung của tiền mã hóa khác Bitcoin. Không nên đồng nhất altcoin với CBDC, thiết bị đào hay chỉ stablecoin.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Bất kỳ tiền mã hóa nào ngoài Bitcoin.\n✗ B SAI. Giấy chứng nhận giấy không phải crypto khác Bitcoin.\n✗ C SAI. CBDC do ngân hàng trung ương khác altcoin.\n✗ D SAI. Altcoin có nhiều chức năng, không chỉ phục vụ đào.","source":"Bộ đề Blockchain - Câu gốc 87/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q088","chapter":3,"number":88,"question":"Why are Bitcoin miners required to spend real resources such as electricity?\nVì sao thợ đào Bitcoin phải tiêu tốn tài nguyên thật như điện năng?","options":[{"id":"BC260-Q088-A","text":"Regulators charge every miner a special energy tax\nCơ quan quản lý thu thuế điện đặc biệt từ mọi thợ đào"},{"id":"BC260-Q088-B","text":"The cost makes cheating expensive and protects the ledger\nChi phí khiến gian lận trở nên đắt đỏ và bảo vệ sổ cái"},{"id":"BC260-Q088-C","text":"It lowers the price of bitcoin for all users\nHạ giá Bitcoin cho mọi người"},{"id":"BC260-Q088-D","text":"Electricity is needed to store bitcoin in wallets\nCần điện để cất Bitcoin trong ví"}],"correctOptionId":"BC260-Q088-B","explanation":"Explanation (EN): Proof of Work requires costly computation and electricity, making attacks on the transaction history expensive. Electricity does not physically store coins or establish their market price.\nGiải thích (VI): Trong Proof of Work, chi phí phần cứng và điện khiến việc gian lận hay viết lại lịch sử tốn kém, tạo động cơ kinh tế để tuân thủ quy tắc. Điện không phải cách lưu bitcoin trong ví.\n\nPhân tích từng đáp án:\n✗ A SAI. Không phải mọi nước áp dụng thuế điện đặc biệt như mô tả.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Chi phí khiến gian lận trở nên đắt đỏ và bảo vệ sổ cái.\n✗ C SAI. Điện năng không trực tiếp quyết định giá giao dịch.\n✗ D SAI. Coin nằm trên sổ cái, không cất bằng điện.","source":"Bộ đề Blockchain - Câu gốc 88/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q089","chapter":4,"number":89,"question":"What is a Central Bank Digital Currency (CBDC)?\nTiền kỹ thuật số ngân hàng trung ương (CBDC) là gì?","options":[{"id":"BC260-Q089-A","text":"An altcoin backed by gold\nAltcoin được vàng bảo đảm"},{"id":"BC260-Q089-B","text":"A cryptocurrency mined by commercial banks\nTiền mã hóa do ngân hàng thương mại đào"},{"id":"BC260-Q089-C","text":"Digital money that is a central bank liability\nTiền số là nghĩa vụ nợ của ngân hàng trung ương"},{"id":"BC260-Q089-D","text":"A stablecoin issued by a private companY\nStablecoin do công ty tư nhân phát hành"}],"correctOptionId":"BC260-Q089-C","explanation":"Explanation (EN): A CBDC is a digital form of central-bank money and a liability of the issuing central bank. It is not an ordinary privately issued stablecoin.\nGiải thích (VI): CBDC là tiền kỹ thuật số do ngân hàng trung ương phát hành và là nghĩa vụ của chính ngân hàng trung ương. CBDC không phải altcoin tự đào hay stablecoin tư nhân.\n\nPhân tích từng đáp án:\n✗ A SAI. Vàng bảo đảm không biến một altcoin thành CBDC.\n✗ B SAI. Ngân hàng thương mại không là cơ quan phát hành nợ trung ương.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Tiền số là nghĩa vụ nợ của ngân hàng trung ương.\n✗ D SAI. Stablecoin tư nhân khác nghĩa vụ nợ ngân hàng trung ương.","source":"Bộ đề Blockchain - Câu gốc 89/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q090","chapter":1,"number":90,"question":"Why does a small change in the input data matter for a hash function?\nVì sao thay đổi nhỏ trong dữ liệu đầu vào quan trọng với hàm băm?","options":[{"id":"BC260-Q090-A","text":"It slightly changes the last digit of the hash\nChỉ hơi thay chữ số cuối của hash"},{"id":"BC260-Q090-B","text":"It makes the hash function stop working\nKhiến hàm băm ngừng chạy"},{"id":"BC260-Q090-C","text":"It produces the same hash, hiding the change\nTạo cùng hash, che giấu thay đổi"},{"id":"BC260-Q090-D","text":"It gives a completely different hash, revealing it\nTạo hash hoàn toàn khác để bộc lộ thay đổi"}],"correctOptionId":"BC260-Q090-D","explanation":"Explanation (EN): Cryptographic hash functions exhibit an avalanche-like effect: small changes in input generally change the digest substantially. This makes tampering noticeable.\nGiải thích (VI): Hiệu ứng avalanche: thay đổi dù rất nhỏ ở đầu vào thường dẫn tới hash khác biệt lớn. Hash không chỉ đổi vài ký tự cuối theo tỷ lệ tương ứng.\n\nPhân tích từng đáp án:\n✗ A SAI. Hash không chỉ đổi một chữ số cuối.\n✗ B SAI. Thay đầu vào không làm hàm băm ngừng hoạt động.\n✗ C SAI. Khả năng cùng hash với thay đổi là cực kỳ thấp theo thiết kế an toàn.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Tạo hash hoàn toàn khác để bộc lộ thay đổi.","source":"Bộ đề Blockchain - Câu gốc 90/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q091","chapter":1,"number":91,"question":"Which type of blockchain requires approval before a node can join?\nLoại blockchain nào yêu cầu phê duyệt trước khi nút tham gia?","options":[{"id":"BC260-Q091-A","text":"Permissionless blockchain\nBlockchain không cần cấp quyền"},{"id":"BC260-Q091-B","text":"Open-access blockchain\nBlockchain truy cập mở"},{"id":"BC260-Q091-C","text":"Public blockchain\nBlockchain công khai"},{"id":"BC260-Q091-D","text":"Permissioned blockchain\nBlockchain cần cấp quyền"}],"correctOptionId":"BC260-Q091-D","explanation":"Explanation (EN): A permissioned chain requires authorization to join or perform certain roles. Public, permissionless participation has no such prior approval requirement.\nGiải thích (VI): Permissioned blockchain yêu cầu được cấp quyền trước khi gia nhập hoặc thực hiện chức năng nhất định. Permissionless/public cho phép tham gia theo quy tắc công khai.\n\nPhân tích từng đáp án:\n✗ A SAI. Mạng không cần cấp phép trái yêu cầu chờ duyệt.\n✗ B SAI. Open access không cần phê duyệt trước.\n✗ C SAI. Blockchain công khai thường mở cho mọi bên.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Blockchain cần cấp quyền.","source":"Bộ đề Blockchain - Câu gốc 91/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q092","chapter":4,"number":92,"question":"What is a Central Bank Digital Currency (CBDC)?\nTiền kỹ thuật số ngân hàng trung ương (CBDC) là gì?","options":[{"id":"BC260-Q092-A","text":"An altcoin backed by gold\nAltcoin được vàng bảo đảm"},{"id":"BC260-Q092-B","text":"Digital money that is a central bank liability\nTiền số là nghĩa vụ nợ của ngân hàng trung ương"},{"id":"BC260-Q092-C","text":"A stablecoin issued by a private companY\nStablecoin do công ty tư nhân phát hành"},{"id":"BC260-Q092-D","text":"A cryptocurrency mined by commercial banks\nTiền mã hóa do ngân hàng thương mại đào"}],"correctOptionId":"BC260-Q092-B","explanation":"Explanation (EN): A CBDC is a digital form of central-bank money and a liability of the issuing central bank. It is not an ordinary privately issued stablecoin.\nGiải thích (VI): CBDC là tiền kỹ thuật số do ngân hàng trung ương phát hành và là nghĩa vụ của chính ngân hàng trung ương. CBDC không phải altcoin tự đào hay stablecoin tư nhân.\n\nPhân tích từng đáp án:\n✗ A SAI. Vàng bảo đảm không biến một altcoin thành CBDC.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Tiền số là nghĩa vụ nợ của ngân hàng trung ương.\n✗ C SAI. Stablecoin tư nhân khác nghĩa vụ nợ ngân hàng trung ương.\n✗ D SAI. Ngân hàng thương mại không là cơ quan phát hành nợ trung ương.","source":"Bộ đề Blockchain - Câu gốc 92/260","topic":"Types of Cryptocurrencies","needsReview":false},{"id":"BC260-Q093","chapter":3,"number":93,"question":"Which two main parts does every Bitcoin transaction contain?\nMỗi giao dịch Bitcoin gồm hai phần chính nào?","options":[{"id":"BC260-Q093-A","text":"Sender name and receiver name\nTên người gửi và người nhận"},{"id":"BC260-Q093-B","text":"Header and nonce\nPhần đầu khối và nonce"},{"id":"BC260-Q093-C","text":"Debit and credit accounts\nTài khoản ghi Nợ và ghi Có"},{"id":"BC260-Q093-D","text":"Inputs and outputs\nĐầu vào và đầu ra"}],"correctOptionId":"BC260-Q093-D","explanation":"Explanation (EN): Bitcoin transactions consist primarily of inputs and outputs. Header fields such as nonce belong to a block, not the two main transaction components.\nGiải thích (VI): Một giao dịch Bitcoin sử dụng inputs (các UTXO đầu vào được chi tiêu) và tạo ra outputs (các UTXO đầu ra mới, gồm tiền trả cho người nhận và có thể có tiền thừa). Header và nonce là thành phần liên quan đến khối, không phải hai phần chính của giao dịch.\n\nPhân tích từng đáp án:\n✗ A SAI. Bitcoin không ghi tên thật người gửi và nhận trong hai trường chính.\n✗ B SAI. Header và nonce thuộc dữ liệu khối.\n✗ C SAI. Kế toán ghi nợ/có khác cấu trúc giao dịch Bitcoin.\n✓ D ĐÚNG. Đúng với tiêu chí cốt lõi: Đầu vào và đầu ra.","source":"Bộ đề Blockchain - Câu gốc 93/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q094","chapter":1,"number":94,"question":"Which type of wallet is kept offline to reduce the risk of hacking?\nLoại ví nào được giữ ngoại tuyến để giảm rủi ro bị tấn công mạng?","options":[{"id":"BC260-Q094-A","text":"Web wallet\nVí trên web"},{"id":"BC260-Q094-B","text":"Cold wallet\nVí lạnh"},{"id":"BC260-Q094-C","text":"Exchange wallet\nVí trên sàn"},{"id":"BC260-Q094-D","text":"Hot wallet\nVí nóng"}],"correctOptionId":"BC260-Q094-B","explanation":"Explanation (EN): Cold wallets keep private keys offline, helping limit remote compromise. Hot and exchange wallets are connected to networked systems.\nGiải thích (VI): Cold wallet lưu khóa offline, giảm bề mặt bị tấn công qua mạng. Hot/web/exchange wallet có các mức kết nối và rủi ro trực tuyến cao hơn.\n\nPhân tích từng đáp án:\n✗ A SAI. Ví web kết nối mạng thường là ví nóng.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Ví lạnh.\n✗ C SAI. Ví lưu ký trên sàn có rủi ro kết nối và lưu ký.\n✗ D SAI. Hot wallet đang trực tuyến, không phải ngoại tuyến.","source":"Bộ đề Blockchain - Câu gốc 94/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q095","chapter":1,"number":95,"question":"Which field in a block header links it to the block before it?\nTrường nào trong phần đầu khối liên kết khối với khối trước?","options":[{"id":"BC260-Q095-A","text":"The timestamp\nDấu thời gian"},{"id":"BC260-Q095-B","text":"The previous block hash\nHash của khối trước"},{"id":"BC260-Q095-C","text":"The nonce\nNonce"},{"id":"BC260-Q095-D","text":"The version number\nSố phiên bản"}],"correctOptionId":"BC260-Q095-B","explanation":"Explanation (EN): The previous-block-hash field links a block header to its predecessor. The nonce, timestamp and version describe other header properties.\nGiải thích (VI): Trường Previous block hash trong header chứa hash của khối trước, tạo liên kết chuỗi. Merkle root liên kết các giao dịch bên trong cùng khối.\n\nPhân tích từng đáp án:\n✗ A SAI. Timestamp ghi thời gian khối, không là mối nối hash.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Hash của khối trước.\n✗ C SAI. Nonce dùng trong thử PoW, không liên kết khối trước.\n✗ D SAI. Số phiên bản nói về định dạng/quy tắc.","source":"Bộ đề Blockchain - Câu gốc 95/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q096","chapter":3,"number":96,"question":"An importer and an exporter want payment released only after shipment is confirmed. What blockchain tool fits best?\nNhà nhập khẩu và xuất khẩu muốn chỉ giải ngân khi xác nhận hàng đã gửi. Công cụ blockchain nào phù hợp?","options":[{"id":"BC260-Q096-A","text":"A hard fork of the chain\nHard fork của chuỗi"},{"id":"BC260-Q096-B","text":"A smart contract escrow\nKý quỹ bằng smart contract"},{"id":"BC260-Q096-C","text":"A cold wallet for both parties\nVí lạnh cho cả hai bên"},{"id":"BC260-Q096-D","text":"A shared mining pool\nNhóm đào chung"}],"correctOptionId":"BC260-Q096-B","explanation":"Explanation (EN): A smart-contract escrow can automatically release funds after specified conditions, such as verified shipment, are met. Real-world data may require an oracle and dispute process.\nGiải thích (VI): Smart-contract escrow khóa và giải ngân theo các điều kiện xác định trước, như chứng từ giao hàng được xác thực. Cơ chế giải quyết tranh chấp và dữ liệu oracle vẫn cần thiết ngoài đời thực.\n\nPhân tích từng đáp án:\n✗ A SAI. Hard fork là sự thay đổi/tách quy tắc chuỗi.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Ký quỹ bằng smart contract.\n✗ C SAI. Ví lạnh chỉ lưu khóa, không tự giải ngân khi giao hàng.\n✗ D SAI. Pool đào không có logic ký quỹ thương mại.","source":"Bộ đề Blockchain - Câu gốc 96/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q097","chapter":1,"number":97,"question":"How does Bitcoin's monetary policy differ from that of a central bank?\nChính sách tiền tệ Bitcoin khác chính sách ngân hàng trung ương như thế nào?","options":[{"id":"BC260-Q097-A","text":"It follows fixed rules, not economic conditions\nTheo quy tắc cố định, không theo tình hình kinh tế"},{"id":"BC260-Q097-B","text":"It changes interest rates monthlY\nĐiều chỉnh lãi suất mỗi tháng"},{"id":"BC260-Q097-C","text":"It is set by finance ministers every year\nBộ trưởng tài chính đặt mỗi năm"},{"id":"BC260-Q097-D","text":"It targets a 2% inflation rate\nNhắm mục tiêu lạm phát 2%"}],"correctOptionId":"BC260-Q097-A","explanation":"Explanation (EN): Bitcoin's monetary issuance follows predetermined protocol rules, not monthly interest-rate decisions or inflation targets set by a central bank.\nGiải thích (VI): Chính sách tiền tệ Bitcoin được mã hóa bằng quy tắc phát hành, không tự thay đổi theo chu kỳ kinh tế nhằm ổn định lạm phát như ngân hàng trung ương.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Theo quy tắc cố định, không theo tình hình kinh tế.\n✗ B SAI. Bitcoin không điều chỉnh lãi suất chính sách.\n✗ C SAI. Bộ trưởng không đặt lịch phát hành Bitcoin.\n✗ D SAI. Không có mục tiêu lạm phát 2% của ngân hàng trung ương.","source":"Bộ đề Blockchain - Câu gốc 97/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q098","chapter":1,"number":98,"question":"Why must every node verify transactions independently?\nVì sao mọi nút phải tự xác minh giao dịch một cách độc lập?","options":[{"id":"BC260-Q098-A","text":"To allow banks to approve each payment\nĐể ngân hàng phê duyệt từng khoản"},{"id":"BC260-Q098-B","text":"So no node needs to trust other nodes\nĐể không nút nào phải tin nút khác"},{"id":"BC260-Q098-C","text":"To identify the real names of users\nĐể nhận dạng tên thật người dùng"},{"id":"BC260-Q098-D","text":"To reduce the size of the blockchain\nĐể giảm kích thước blockchain"}],"correctOptionId":"BC260-Q098-B","explanation":"Explanation (EN): Independent verification means that a node checks validity instead of taking another participant's claim on trust. This is essential where there is no central authority.\nGiải thích (VI): Nút Bitcoin tự xác minh vì một nút khác có thể sai hoặc có động cơ gian lận. Kiểm tra độc lập làm giảm nhu cầu tin một thực thể trung tâm.\n\nPhân tích từng đáp án:\n✗ A SAI. Bitcoin không cần ngân hàng phê duyệt từng khoản.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Để không nút nào phải tin nút khác.\n✗ C SAI. Full node không biết tên pháp lý người dùng nhờ tự xác minh.\n✗ D SAI. Việc tự kiểm tra không nhằm làm dữ liệu nhỏ hơn.","source":"Bộ đề Blockchain - Câu gốc 98/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q099","chapter":1,"number":99,"question":"How does Bitcoin’s network structure differ from a traditional banking system?\nCấu trúc mạng Bitcoin khác hệ thống ngân hàng truyền thống như thế nào?","options":[{"id":"BC260-Q099-A","text":"It is run by a consortium of central banks [cần đối chiếu ảnh gốc]\nDo liên minh ngân hàng trung ương vận hành [cần đối chiếu ảnh]"},{"id":"BC260-Q099-B","text":"It is a peer-to-peer network with no central server\nMạng ngang hàng không có máy chủ trung tâm"},{"id":"BC260-Q099-C","text":"It routes payments through the SWIFT network\nĐịnh tuyến thanh toán qua SWIFT"},{"id":"BC260-Q099-D","text":"It relies on one server owned by its founder\nDựa vào một máy chủ của người sáng lập"}],"correctOptionId":"BC260-Q099-B","explanation":"Explanation (EN): Bitcoin uses peer-to-peer dissemination and independent nodes rather than a central bank server or SWIFT as its consensus infrastructure.\nGiải thích (VI): Bitcoin là mạng P2P: các nút chuyển tiếp và kiểm tra giao dịch, không qua một máy chủ ngân hàng duy nhất. Điều này khác mạng SWIFT hay hệ thống core banking tập trung.\n\nPhân tích từng đáp án:\n✗ A SAI. Bitcoin không do liên minh ngân hàng trung ương điều hành.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Mạng ngang hàng không có máy chủ trung tâm.\n✗ C SAI. SWIFT là hệ thống truyền thông ngân hàng, không phải mạng Bitcoin.\n✗ D SAI. Không tồn tại máy chủ duy nhất của người sáng lập.\n\n⚠ Cần đối chiếu ảnh gốc: Một lựa chọn bị che hoặc có lỗi nhận dạng.","source":"Bộ đề Blockchain - Câu gốc 99/260","topic":"Overview of Blockchain","needsReview":true},{"id":"BC260-Q100","chapter":1,"number":100,"question":"What does a cryptocurrency wallet mainly store?\nVí tiền mã hóa chủ yếu lưu gì?","options":[{"id":"BC260-Q100-A","text":"A copy of every block in the blockchain\nBản sao toàn bộ khối trong blockchain"},{"id":"BC260-Q100-B","text":"The passwords of other users\nMật khẩu người dùng khác"},{"id":"BC260-Q100-C","text":"The user's private keys\nKhóa riêng của người dùng"},{"id":"BC260-Q100-D","text":"The coins themselves as digital files\nBản thân coin dưới dạng tệp số"}],"correctOptionId":"BC260-Q100-C","explanation":"Explanation (EN): A cryptocurrency wallet manages secret keys and often seed backups and receiving addresses. Coins themselves are recorded on the blockchain, not kept as files inside the wallet.\nGiải thích (VI): Ví tiền mã hóa quản lý private key, seed phrase và thông tin địa chỉ, không lưu coin như tệp bên trong điện thoại. Mất khóa có thể làm mất quyền chi tiêu.\n\nPhân tích từng đáp án:\n✗ A SAI. Ví thông thường không cần lưu toàn bộ blockchain.\n✗ B SAI. Ví không chứa mật khẩu người dùng khác.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Khóa riêng của người dùng.\n✗ D SAI. Coin được ghi trên sổ cái blockchain.","source":"Bộ đề Blockchain - Câu gốc 100/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q101","chapter":1,"number":101,"question":"A university stores the hash of each degree certificate on a blockchain. An employer wants to check a certificate. What should it do?\nĐại học lưu hash của văn bằng lên blockchain. Nhà tuyển dụng kiểm tra văn bằng bằng cách nào?","options":[{"id":"BC260-Q101-A","text":"Look up the graduate's name in the genesis block\nTìm tên người tốt nghiệp ở khối genesis"},{"id":"BC260-Q101-B","text":"Hash the certificate and compare it with the stored hash\nBăm chứng chỉ rồi so với hash đã lưu"},{"id":"BC260-Q101-C","text":"Ask miners to read and approve the certificate\nYêu cầu thợ đào đọc và phê duyệt chứng chỉ"},{"id":"BC260-Q101-D","text":"Check the graduate's private key\nKiểm tra khóa riêng của người tốt nghiệp"}],"correctOptionId":"BC260-Q101-B","explanation":"Explanation (EN): A verifier hashes the presented document and compares its digest to the previously recorded digest. A match supports integrity, not necessarily the truth of the original claim.\nGiải thích (VI): Nhà tuyển dụng băm lại chứng chỉ được nộp rồi so sánh với hash đã neo trên blockchain. Nếu nội dung thay đổi, hash thường không trùng, giúp kiểm tra tính toàn vẹn; không tự chứng minh nội dung ban đầu là thật.\n\nPhân tích từng đáp án:\n✗ A SAI. Khối genesis không chứa danh sách bằng tốt nghiệp.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Băm chứng chỉ rồi so với hash đã lưu.\n✗ C SAI. Thợ đào không đóng vai trò cấp phép văn bằng.\n✗ D SAI. Không cần khóa riêng người học để băm tài liệu đã xuất trình.","source":"Bộ đề Blockchain - Câu gốc 101/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q102","chapter":2,"number":102,"question":"In public key cryptography, which key must the owner keep secret?\nTrong mật mã khóa công khai, khóa nào chủ sở hữu phải giữ bí mật?","options":[{"id":"BC260-Q102-A","text":"The private key\nKhóa riêng"},{"id":"BC260-Q102-B","text":"The public key\nKhóa công khai"},{"id":"BC260-Q102-C","text":"The transaction ID\nMã giao dịch"},{"id":"BC260-Q102-D","text":"The wallet address\nĐịa chỉ ví"}],"correctOptionId":"BC260-Q102-A","explanation":"Explanation (EN): A private key must remain secret because it is used to authorize spending through digital signatures. Addresses and public keys are intended to be shareable.\nGiải thích (VI): Private key phải được bảo mật vì nó cho phép tạo chữ ký chi tiêu. Public key và địa chỉ nhận tiền có thể chia sẻ theo quy tắc.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Khóa riêng.\n✗ B SAI. Khóa công khai dùng xác minh chữ ký.\n✗ C SAI. Mã giao dịch là định danh công khai.\n✗ D SAI. Địa chỉ nhận tiền phải chia sẻ được.","source":"Bộ đề Blockchain - Câu gốc 102/260","topic":"Foundational Technologies of Blockchain","needsReview":false},{"id":"BC260-Q103","chapter":3,"number":103,"question":"Why does changing a transaction in an old block break the chain?\nVì sao sửa giao dịch trong khối cũ làm đứt liên kết chuỗi?","options":[{"id":"BC260-Q103-A","text":"The timestamp of every block is reset\nĐặt lại dấu thời gian mọi khối"},{"id":"BC260-Q103-B","text":"Its hash no longer matches the next block's link\nHash không còn khớp liên kết ở khối sau"},{"id":"BC260-Q103-C","text":"The genesis block is deleted from every node\nXóa khối genesis khỏi mọi nút"},{"id":"BC260-Q103-D","text":"The nonce of all later blocks is reset to zero\nĐặt nonce mọi khối sau thành số không"}],"correctOptionId":"BC260-Q103-B","explanation":"Explanation (EN): A change to an old transaction changes its Merkle root and header hash. The next block points to the former hash, so the cryptographic link no longer matches.\nGiải thích (VI): Thay nội dung giao dịch làm thay đổi Merkle root và hash khối; hash trước đó đang được khối kế tiếp tham chiếu nên mối nối không khớp. Muốn sửa phải xử lý cả chuỗi phụ thuộc.\n\nPhân tích từng đáp án:\n✗ A SAI. Không có việc tự đặt lại timestamp tất cả khối.\n✓ B ĐÚNG. Đúng với tiêu chí cốt lõi: Hash không còn khớp liên kết ở khối sau.\n✗ C SAI. Sửa giao dịch không xóa genesis khỏi mạng.\n✗ D SAI. Nonce các khối sau không tự reset về 0.","source":"Bộ đề Blockchain - Câu gốc 103/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q104","chapter":1,"number":104,"question":"When two valid versions of the chain exist, which one does the network usually accept?\nKhi có hai phiên bản chuỗi đều hợp lệ, mạng thường chấp nhận chuỗi nào?","options":[{"id":"BC260-Q104-A","text":"The chain with the most accumulated work\nChuỗi có tổng công việc tích lũy lớn nhất"},{"id":"BC260-Q104-B","text":"The chain created first by any node\nChuỗi được bất kỳ nút nào tạo trước"},{"id":"BC260-Q104-C","text":"The chain chosen by the largest bank\nChuỗi do ngân hàng lớn nhất chọn"},{"id":"BC260-Q104-D","text":"The chain with the fewest transactions\nChuỗi ít giao dịch nhất"}],"correctOptionId":"BC260-Q104-A","explanation":"Explanation (EN): Bitcoin nodes prefer the valid chain with the greatest accumulated Proof-of-Work difficulty, not simply whichever fork appeared first or contains the fewest transactions.\nGiải thích (VI): Trong Bitcoin, chọn chuỗi hợp lệ có tổng công việc tích lũy nhiều nhất, không đơn thuần khối tạo sớm nhất hoặc có ít giao dịch. Đây là nguyên tắc giải quyết fork tạm thời.\n\nPhân tích từng đáp án:\n✓ A ĐÚNG. Đúng với tiêu chí cốt lõi: Chuỗi có tổng công việc tích lũy lớn nhất.\n✗ B SAI. Thời điểm tạo trước không quyết định chuỗi có tổng công việc lớn nhất.\n✗ C SAI. Không có ngân hàng được quyền chọn nhánh Bitcoin.\n✗ D SAI. Số giao dịch ít không xác định lượng PoW tích lũy.","source":"Bộ đề Blockchain - Câu gốc 104/260","topic":"Overview of Blockchain","needsReview":false},{"id":"BC260-Q105","chapter":3,"number":105,"question":"Why does the UTXO model help prevent double spending?\nVì sao mô hình UTXO giúp ngăn chi tiêu kép?","options":[{"id":"BC260-Q105-A","text":"Transactions are reversed after ten minutes\nGiao dịch bị đảo ngược sau 10 phút"},{"id":"BC260-Q105-B","text":"Users must pay a deposit before spending\nNgười dùng phải đặt cọc trước khi chi"},{"id":"BC260-Q105-C","text":"Each output can be spent only once\nMỗi đầu ra chỉ có thể được tiêu một lần"},{"id":"BC260-Q105-D","text":"Each account balance is checked by a bank\nNgân hàng kiểm tra số dư từng tài khoản"}],"correctOptionId":"BC260-Q105-C","explanation":"Explanation (EN): Bitcoin nodes track which transaction outputs have already been spent. Reusing an already spent output is invalid under UTXO verification.\nGiải thích (VI): Trong mô hình UTXO, mỗi đầu ra chỉ được tiêu một lần; mạng từ chối giao dịch dùng UTXO đã chi. Việc 'đã tiêu' được ghi nhận trên sổ cái thay vì cần ngân hàng giám sát.\n\nPhân tích từng đáp án:\n✗ A SAI. Giao dịch không tự đảo ngược sau 10 phút.\n✗ B SAI. Không có yêu cầu đặt cọc để tiêu UTXO.\n✓ C ĐÚNG. Đúng với tiêu chí cốt lõi: Mỗi đầu ra chỉ có thể được tiêu một lần.\n✗ D SAI. Hệ UTXO không nhờ ngân hàng kiểm tra số dư.","source":"Bộ đề Blockchain - Câu gốc 105/260","topic":"Bitcoin Transactions & Network","needsReview":false},{"id":"BC260-Q106","chapter":4,"number":106,"question":"Litecoin was designed mainly as which of the following?\nLitecoin được thiết kế chủ yếu như loại tiền nào?","option
