function explanationParts(q){
 const t=String(q.explanation||''),r=/(Supplementary English explanation[^:\n]*:|Explanation \(EN\):|Giải thích chi tiết:|Giải thích \(VI\):|(?:Formula \/ Calculation \/ Công thức & tính toán|Công thức & tính toán \/ Formula & calculation):)/gi;
 const matches=[...t.matchAll(r)],result={en:'',vi:'',formula:''};
 for(let k=0;k<matches.length;k++){
  const m=matches[k],part=t.slice(m.index+m[0].length,k+1<matches.length?matches[k+1].index:t.length).trim();
  if(/Explanation \(EN\)|Supplementary English/i.test(m[0]))result.en+=(result.en?'\n':'')+part;
  else if(/Giải thích/i.test(m[0]))result.vi+=(result.vi?'\n':'')+part;
  else result.formula+=(result.formula?'\n':'')+part;
 }
 if(!result.en&&!result.vi)result.vi=t;
 return result;
}
function explanationHTML(q){
 const p=explanationParts(q),l=studyLocale();
 const value=l==='en'?p.en:l==='vi'?p.vi:null;
 let html='';
 if(l==='bi')html='<div class="explain-block"><strong>Explanation (EN)</strong><div class="lang-top">'+esc(p.en||'')+'</div></div><div class="explain-block"><strong>Giải thích (VI)</strong><div class="lang-bottom">'+esc(p.vi||'')+'</div></div>';
 else html='<div class="explain-block"><strong>'+(l==='en'?'Explanation':'Giải thích')+'</strong><div class="lang-only">'+esc(value||'')+'</div></div>';
 if(p.formula)html+='<div class="explain-block"><strong>'+(l==='en'?'Formula / Calculation':l==='vi'?'Công thức & tính toán':'Formula / Công thức')+'</strong><div class="lang-only">'+esc(p.formula)+'</div></div>';
 return html;
}
function languageLabel(en,vi){return studyLocale()==='en'?en:vi}

function renderQuiz(){const c=$('#content');if(!session)return renderSetup(c);const it=currentItem(),q=qById(it.qid);const practice=session.mode==='practice';const show=practice&&it.locked;const selected=it.selected;const correct=q.correctOptionId;const graded=!!correct;const answerIsCorrect=graded&&isCorrect(q,selected);const answered=session.items.filter(x=>x.selected).length;c.innerHTML=`<div class="quiz-wrap"><div class="quiz-head"><span>${session.index+1}/${session.items.length}</span><div class="progress"><span style="width:${(session.index+1)/session.items.length*100}%"></span></div><button class="icon-btn bookmark ${state.bookmarks.includes(q.id)?'active':''}" onclick="toggleBookmark('${q.id}')">★</button></div><div class="navigator">${session.items.map((x,i)=>{let cls=i===session.index?'current ':'';if(session.mode==='practice'&&x.locked){const qq=qById(x.qid);if(!qq.correctOptionId)cls+='answered';else cls+=isCorrect(qq,x.selected)?'correct':'wrong'}else if(x.selected)cls+='answered';return `<button class="navq ${cls}" onclick="goQ(${i})">${i+1}</button>`}).join('')}</div><div class="quiz-card">${languageControls()}<div class="q-meta"><span class="pill">Chương ${q.chapter}</span><span class="pill">${esc(q.source||'Blockchain')}</span><span class="pill">${esc(q.topic||"Tổng hợp")}</span><span class="pill">${esc(q.level||"Trắc nghiệm")}</span><span class="pill">${q.id}</span>${session.mode==='test'?'<span class="pill">Chế độ kiểm tra</span>':'<span class="pill">Chế độ ôn tập</span>'}</div><div class="question">${questionHTML(q)}</div><div class="options">${it.optionOrder.map((oid,idx)=>{let cls='';if(show){if(graded&&isCorrect(q,oid))cls='correct';else if(graded&&oid===selected)cls='wrong';else if(!graded&&oid===selected)cls='review'}else if(session.mode==='test'&&oid===selected)cls='selected';return `<button class="option ${cls}" ${show?'disabled':''} onclick="choose('${oid}')"><span class="opt-letter">${'ABCD'[idx]}</span><span>${optionHTML(q,oid)}${show&&graded&&isCorrect(q,oid)?' <b>✓ Đáp án đúng</b>':''}${show&&graded&&oid===selected&&!isCorrect(q,oid)?' <b>✕ Bạn đã chọn</b>':''}${show&&!graded&&oid===selected?' <b>• Bạn đã chọn</b>':''}</span></button>`}).join('')}</div>${show?(graded?`<div class="feedback ${answerIsCorrect?'good':'bad'}"><b>${answerIsCorrect?languageLabel('✓ Correct','✓ Chính xác'):languageLabel('✕ Incorrect','✕ Chưa đúng')}</b>${!answerIsCorrect?`${languageLabel('You selected:','Bạn đã chọn:')} <b>${optionHTML(q,selected)}</b>. ${languageLabel('The correct choice is highlighted in green above.','Đáp án đúng được tô xanh phía trên.')}`:''}<div class="explanation"><b>${languageLabel('Explanation (original answer letter can change when choices are shuffled):','Giải thích / Explanation (thứ tự chữ cái trong tài liệu gốc có thể khác sau khi xáo đáp án):')}</b>${explanationHTML(q)}</div></div>`:`<div class="feedback review"><b>⚠ Câu này chưa có đáp án chính thức đủ rõ để chốt duy nhất</b><div class="explanation"><b>Giải thích / lưu ý:</b>${explanationHTML(q)}</div></div>`):''}<div class="quiz-actions"><button class="btn" onclick="prevQ()" ${session.index===0?'disabled':''}>← Câu trước</button>${session.mode==='test'?`<button class="btn primary" onclick="${session.index===session.items.length-1?'submitTest()':'nextQ()'}">${session.index===session.items.length-1?'Nộp bài':'Câu tiếp →'}</button>`:`<button class="btn primary" onclick="nextQ()" ${!it.locked?'disabled':''}>${session.index===session.items.length-1?'Hoàn thành':'Câu tiếp →'}</button>`}</div></div><p class="muted" style="text-align:center">Đã trả lời ${answered}/${session.items.length}. Phím 1–4 chọn A–D; Enter sang câu tiếp.</p></div>`;$('#topTitle').textContent='Đang làm bài';state.activeSession=session;saveState()}
function choose(oid){const it=currentItem(),q=qById(it.qid);if(session.mode==='practice'&&it.locked)return;it.selected=oid;if(session.mode==='practice'){it.locked=true;if(q.correctOptionId)recordAttempt(q.id,isCorrect(q,oid));else recordReview(q.id)}state.activeSession=session;saveState();renderQuiz()}
function recordAttempt(qid,correct){const s=stat(qid);s.attempts++;s.lastAt=Date.now();if(correct){s.correct++;s.streak++;if(s.streak>=2)state.wrongIds=state.wrongIds.filter(x=>x!==qid)}else{s.wrong++;s.streak=0;if(!state.wrongIds.includes(qid))state.wrongIds.push(qid)}state.stats[qid]=s;saveState()}
function recordReview(qid){const s=stat(qid);s.attempts++;s.lastAt=Date.now();state.stats[qid]=s;saveState()}
function nextQ(){if(session.index<session.items.length-1){session.index++;renderQuiz()}else{if(session.mode==='practice')finishPractice();else submitTest()}}
function prevQ(){if(session.index>0){session.index--;renderQuiz()}}
function goQ(i){session.index=i;renderQuiz()}
function toggleBookmark(qid){if(state.bookmarks.includes(qid))state.bookmarks=state.bookmarks.filter(x=>x!==qid);else state.bookmarks.push(qid);saveState();renderQuiz()}
function finishPractice(){const gradable=session.items.filter(x=>qById(x.qid).correctOptionId);const correct=gradable.filter(x=>{const q=qById(x.qid);return isCorrect(q,x.selected)}).length;const ungraded=session.items.length-gradable.length;const done={id:session.id,date:Date.now(),mode:'practice',total:gradable.length,correct,ungraded};state.sessions.unshift(done);state.sessions=state.sessions.slice(0,50);state.activeSession=null;saveState();clearTimer();$('#topTimer').classList.add('hidden');showResult(correct,gradable.length,'Ôn tập hoàn thành',ungraded)}
function submitTest(auto=false){if(!session||session.submitted)return;const unanswered=session.items.filter(x=>!x.selected).length;if(!auto&&unanswered&&!confirm(`Bạn còn ${unanswered} câu chưa trả lời. Vẫn nộp bài?`))return;session.submitted=true;let correct=0,gradable=0,ungraded=0;session.items.forEach(x=>{const q=qById(x.qid);if(!q.correctOptionId){ungraded++;if(x.selected)recordReview(q.id);return}gradable++;const ok=isCorrect(q,x.selected);if(x.selected)recordAttempt(q.id,ok);if(ok)correct++});state.sessions.unshift({id:session.id,date:Date.now(),mode:'test',total:gradable,correct,ungraded});state.sessions=state.sessions.slice(0,50);state.activeSession=null;saveState();clearTimer();$('#topTimer').classList.add('hidden');showTestReview(correct,auto)}

function showResult(correct,total,title,ungraded=0){const c=$('#content');const pct=total?Math.round(correct/total*100):0;c.innerHTML=`<h1 class="page-title">${title}</h1><div class="test-summary"><div class="card"><div class="n" style="font-size:28px;font-weight:800">${correct}</div><div class="muted">Câu đúng</div></div><div class="card"><div class="n" style="font-size:28px;font-weight:800">${total-correct}</div><div class="muted">Câu sai</div></div><div class="card"><div class="n" style="font-size:28px;font-weight:800">${pct}%</div><div class="muted">Tỷ lệ đúng trên câu có đáp án chốt</div></div>${ungraded?`<div class="card"><div class="n" style="font-size:28px;font-weight:800">${ungraded}</div><div class="muted">Câu chưa chốt đáp án, không tính điểm</div></div>`:''}</div><div class="row" style="margin-top:16px"><button class="btn primary" onclick="navigate('practice')">Tạo bài mới</button><button class="btn" onclick="navigate('wrong')">Ôn câu sai</button><button class="btn" onclick="navigate('stats')">Xem thống kê</button></div>`}
function showTestReview(correct,auto){const c=$('#content');const gradable=session.items.filter(x=>qById(x.qid).correctOptionId);const total=gradable.length;const ungraded=session.items.length-total;const pct=total?Math.round(correct/total*100):0;c.innerHTML=`<h1 class="page-title">${auto?'Hết giờ - đã tự động nộp':'Kết quả kiểm tra'}</h1><div class="test-summary"><div class="card"><b>${correct}/${total}</b><div class="muted">Câu đúng / câu có đáp án chốt</div></div><div class="card"><b>${total-correct}</b><div class="muted">Câu sai hoặc bỏ trống</div></div><div class="card"><b>${pct}%</b><div class="muted">Tỷ lệ đúng</div></div>${ungraded?`<div class="card"><b>${ungraded}</b><div class="muted">Câu chưa chốt, không tính điểm</div></div>`:''}</div><h3>Xem lại từng câu</h3><div class="list">${session.items.map((it,i)=>{const q=qById(it.qid);if(!q.correctOptionId)return `<div class="q-row"><h4>Câu ${i+1}. ${questionHTML(q)}</h4><div class="meta">⚠ Chưa có đáp án chốt • Chương ${q.chapter} • ${esc(q.source||'Blockchain')}</div>${it.selected?`<p><b>Bạn chọn:</b> ${esc(optionText(q,it.selected))}</p>`:''}<p><b>Giải thích / lưu ý:</b> ${explanationHTML(q)}</p></div>`;const ok=isCorrect(q,it.selected);return `<div class="q-row"><h4>Câu ${i+1}. ${questionHTML(q)}</h4><div class="meta">${ok?'✓ Đúng':'✕ Sai'} • Chương ${q.chapter} • ${esc(q.source||'Blockchain')}</div><p><b>Đáp án đúng:</b> ${answerOptionsHTML(q)}</p>${it.selected&&!ok?`<p><b>Bạn chọn:</b> ${esc(optionText(q,it.selected))}</p>`:''}<p><b>Giải thích:</b> ${explanationHTML(q)}</p></div>`}).join('')}</div><div class="row" style="margin-top:16px"><button class="btn primary" onclick="navigate('practice')">Tạo bài mới</button><button class="btn" onclick="navigate('wrong')">Ôn câu sai</button></div>`}

function renderCollection(type){const c=$('#content');const ids=type==='wrong'?state.wrongIds:state.bookmarks;const title=type==='wrong'?'Câu sai / đang yếu':'Câu đã đánh dấu';const qs=QUESTIONS.filter(q=>ids.includes(q.id));c.innerHTML=`<h1 class="page-title">${title}</h1><p class="sub">${type==='wrong'?'Câu sai được lưu tự động. Khi trả lời đúng liên tiếp 2 lần, câu sẽ rời danh sách yếu nhưng lịch sử vẫn được giữ.':'Các câu bạn muốn xem lại riêng.'}</p>${qs.length?`<div class="row" style="margin-bottom:14px"><button class="btn primary" onclick="startSessionFromIds(${JSON.stringify(ids).replace(/"/g,'&quot;')},'practice',true,0)">Ôn tất cả (${qs.length})</button><button class="btn" onclick="startSessionFromIds(${JSON.stringify(ids.slice(0,20)).replace(/"/g,'&quot;')},'practice',true,0)">Ôn tối đa 20 câu</button></div><div class="list">${qs.map(q=>rowHTML(q)).join('')}</div>`:`<div class="empty">Chưa có câu nào trong mục này.</div>`}`}
function rowHTML(q){const s=stat(q.id);return `<div class="q-row"><h4>${questionHTML(q)}</h4><div class="meta">${q.id} • ${esc(q.source||'Blockchain')} • Chương ${q.chapter} • Đã làm ${s.attempts} lần • Đúng ${s.correct} • Sai ${s.wrong}</div><div class="actions"><button class="btn" onclick="openQuestion('${q.id}')">Xem câu</button><button class="btn" onclick="startSessionFromIds(['${q.id}'],'practice',true,0)">Làm lại</button></div></div>`}
function renderBank(c){let qs=QUESTIONS.filter(q=>(bankChapter==='all'||q.chapter==bankChapter));if(bankStatus!=='all')qs=qs.filter(q=>statusOf(q.id)===bankStatus);if(bankQuery.trim()){const t=bankQuery.toLowerCase();qs=qs.filter(q=>(q.question+' '+q.options.map(o=>o.text).join(' ')).toLowerCase().includes(t))}c.innerHTML=`<h1 class="page-title">Ngân hàng ${QUESTIONS.length} câu</h1><p class="sub">Tìm kiếm và xem từng câu. Đáp án mặc định được ẩn trong cửa sổ chi tiết.</p>${languageControls()}<div class="searchbar"><input id="bankSearch" placeholder="Tìm nội dung câu hỏi..." value="${esc(bankQuery)}"><select id="bankChapter"><option value="all">Tất cả chương</option>${[1,2,3,4,5,6].map(ch=>`<option value="${ch}" ${bankChapter==ch?'selected':''}>Chương ${ch}</option>`).join('')}</select><select id="bankStatus"><option value="all">Mọi trạng thái</option><option value="new" ${bankStatus==='new'?'selected':''}>Chưa làm</option><option value="weak" ${bankStatus==='weak'?'selected':''}>Đang yếu</option><option value="learning" ${bankStatus==='learning'?'selected':''}>Đang học</option><option value="mastered" ${bankStatus==='mastered'?'selected':''}>Thành thạo</option></select></div><div class="muted" style="margin-bottom:10px">Tìm thấy ${qs.length} câu</div><div class="list">${qs.slice(0,300).map(q=>rowHTML(q)).join('')}${qs.length>300?'<div class="empty">Đang hiển thị 300 kết quả đầu. Hãy lọc hoặc tìm kiếm để thu hẹp.</div>':''}</div>`;$('#bankSearch').oninput=e=>{bankQuery=e.target.value;clearTimeout(window._bs);window._bs=setTimeout(()=>renderBank(c),180)};$('#bankChapter').onchange=e=>{bankChapter=e.target.value;renderBank(c)};$('#bankStatus').onchange=e=>{bankStatus=e.target.value;renderBank(c)}}
function openQuestion(qid){const q=qById(qid);const m=$('#modal'),mc=$('#modalCard');const answerHtml=q.correctOptionId?`<p><b>Đáp án đúng:</b> ${answerOptionsHTML(q)}</p>`:`<p style="color:var(--warn)"><b>Chưa có đáp án chính thức đủ rõ để chốt duy nhất.</b></p>`;mc.innerHTML=`<div class="row"><b>${q.id} • ${esc(q.source||'Blockchain')} • Chương ${q.chapter}</b><div style="flex:1"></div><button class="icon-btn" onclick="closeModal()">✕</button></div><h3>${questionHTML(q)}</h3>${q.options.map((o,i)=>`<p><b>${'ABCD'[i]}.</b> ${optionHTML(q,o.id)}</p>`).join('')}<button class="btn primary" id="revealBtn">Hiện đáp án và giải thích</button><div id="reveal" class="hidden"><hr style="border:0;border-top:1px solid var(--line)">${answerHtml}<p><b>${q.correctOptionId?'Giải thích':'Giải thích / lưu ý'}:</b> ${explanationHTML(q)}</p></div>`;m.classList.add('open');$('#revealBtn').onclick=()=>$('#reveal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.remove('open')}
function renderStats(c){const rows=[1,2,3,4,5,6].map(ch=>{const qs=chapterQuestions(ch);let a=0,co=0;qs.forEach(q=>{const s=stat(q.id);a+=s.correct+s.wrong;co+=s.correct});const done=qs.filter(q=>stat(q.id).attempts).length;const weak=qs.filter(q=>state.wrongIds.includes(q.id)).length;return{ch,done,weak,acc:a?Math.round(co/a*100):0}});c.innerHTML=`<h1 class="page-title">Thống kê</h1><p class="sub">Theo dõi mức độ phủ câu hỏi và tỷ lệ đúng thực tế, không dùng điểm cộng/trừ.</p><div class="card"><table class="kpi-table"><thead><tr><th>Chương</th><th class="right">Đã học</th><th class="right">Câu yếu</th><th class="right">Độ chính xác</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>Chương ${r.ch}</b><div class="muted">${esc(CHAPTERS[r.ch])}</div></td><td class="right">${r.done}/${chapterQuestions(r.ch).length}</td><td class="right">${r.weak}</td><td class="right">${r.acc}%</td></tr>`).join('')}</tbody></table></div><h3>Lịch sử bài gần đây</h3>${state.sessions.length?`<div class="list">${state.sessions.slice(0,12).map(s=>`<div class="q-row"><b>${s.mode==='test'?'Kiểm tra':'Ôn tập'} • ${new Date(s.date).toLocaleString('vi-VN')}</b><div class="meta">${s.correct}/${s.total} đúng • ${Math.round(s.correct/s.total*100)}%</div></div>`).join('')}</div>`:'<div class="empty">Chưa có bài hoàn thành.</div>'}`}
function renderSettings(c){c.innerHTML=`<h1 class="page-title">Cài đặt</h1>${languageControls()}<div class="grid"><div class="card" style="grid-column:span 6"><h3 class="section-title">Giao diện</h3><div class="field"><label>Chế độ màu</label><select id="themeSel"><option value="light" ${state.theme==='light'?'selected':''}>Sáng</option><option value="dark" ${state.theme==='dark'?'selected':''}>Tối</option></select></div><div class="field" style="margin-top:10px"><label>Cỡ chữ</label><select id="fontSel"><option value="small" ${state.font==='small'?'selected':''}>Nhỏ</option><option value="normal" ${state.font==='normal'?'selected':''}>Vừa</option><option value="large" ${state.font==='large'?'selected':''}>Lớn</option></select></div></div><div class="card" style="grid-column:span 6"><h3 class="section-title">Sao lưu tiến độ</h3><div class="row"><button class="btn" id="exportBtn">Xuất dữ liệu JSON</button><label class="btn">Nhập dữ liệu<input id="importFile" type="file" accept="application/json" hidden></label></div><p class="muted">Dùng để chuyển tiến độ sang máy khác.</p></div><div class="card danger-zone" style="grid-column:span 12"><h3 class="section-title">Xóa dữ liệu học</h3><p class="muted">Xóa lịch sử đúng/sai, câu yếu, đánh dấu và bài đang dở. Ngân hàng ${QUESTIONS.length} câu vẫn còn nguyên.</p><button class="btn danger" id="resetBtn">Xóa toàn bộ tiến độ</button></div></div>`;$('#themeSel').onchange=e=>{state.theme=e.target.value;saveState();applyPrefs()};$('#fontSel').onchange=e=>{state.font=e.target.value;saveState();applyPrefs()};$('#exportBtn').onclick=exportData;$('#importFile').onchange=importData;$('#resetBtn').onclick=resetData}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='blockchain-260-tien-do.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state={...DEFAULT,...x};saveState();applyPrefs();toast('Đã nhập tiến độ');render()}catch{alert('File dữ liệu không hợp lệ')}};r.readAsText(f)}
function resetData(){if(!confirm('Xóa toàn bộ tiến độ học?'))return;if(!confirm('Xác nhận lần cuối: thao tác này không thể hoàn tác.'))return;localStorage.removeItem(KEY);state=structuredClone(DEFAULT);applyPrefs();toast('Đã xóa tiến độ');navigate('dashboard')}
$('#nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(b)navigate(b.dataset.page)};$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';saveState();applyPrefs()};$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(!session)return;if(['1','2','3','4'].includes(e.key)){const it=currentItem();const idx=+e.key-1;if(it.optionOrder[idx])choose(it.optionOrder[idx])}if(e.key==='Enter'&&session.mode==='practice'&&currentItem().locked)nextQ()});
render();
</script>
</body>
