<style>
:root{--bg:#f5f7fb;--panel:#ffffff;--panel2:#f9fafb;--text:#111827;--muted:#64748b;--line:#e5e7eb;--primary:#2563eb;--primary2:#1d4ed8;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--warn:#a16207;--shadow:0 10px 35px rgba(15,23,42,.08);--radius:18px;--font:16px}
html[data-theme="dark"]{--bg:#0b1020;--panel:#111827;--panel2:#182235;--text:#f8fafc;--muted:#9ca3af;--line:#263247;--primary:#60a5fa;--primary2:#93c5fd;--ok:#4ade80;--okbg:#0d2b1a;--bad:#fb7185;--badbg:#35151d;--warn:#facc15;--shadow:0 16px 42px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:var(--font)/1.52 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;overflow:auto;z-index:20}.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 18px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:800}.brand b{font-size:17px}.brand small{display:block;color:var(--muted)}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--text);padding:11px 12px;border-radius:12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center}.nav button:hover,.nav button.active{background:var(--panel2)}.nav button.active{font-weight:700;color:var(--primary)}.side-foot{margin-top:18px;padding:13px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px}.main{min-width:0}.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:10px}.menu-btn{display:none}.topbar .spacer{flex:1}.icon-btn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:12px;cursor:pointer;transition:.18s transform,.18s background,.18s border}.btn:hover,.icon-btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--primary) 45%,var(--line))}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}.btn.danger{color:var(--bad)}.content{max-width:1180px;margin:0 auto;padding:26px 22px 70px}.page-title{margin:0 0 6px;font-size:28px;letter-spacing:-.02em}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.stat{grid-column:span 3}.stat .n{font-size:28px;font-weight:800}.stat .l{color:var(--muted);font-size:13px}.progress{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);width:0}.section-title{font-size:18px;margin:0 0 12px}.chapter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chapter-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2)}.chapter-item input{width:18px;height:18px}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 11px;border-radius:11px;outline:none}.field input:focus,.field select:focus{border-color:var(--primary)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toggle{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.toggle input{width:18px;height:18px}.setup{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.quiz-wrap{max-width:900px;margin:0 auto}.quiz-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}.quiz-head .progress{flex:1}.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel2);padding:5px 8px;border-radius:999px}.question{font-size:20px;font-weight:760;line-height:1.45;margin:14px 0 16px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:13px 14px;border-radius:14px;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;transition:.16s transform,.16s border,.16s background}.option:hover:not(:disabled){transform:translateY(-1px);border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}.option:disabled{cursor:default}.option.selected{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--panel2))}.option.selected .opt-letter{border-color:var(--primary);color:var(--primary)}.opt-letter{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--panel)}.option.correct{border-color:var(--ok);background:var(--okbg)}.option.correct .opt-letter{border-color:var(--ok);color:var(--ok)}.option.wrong{border-color:var(--bad);background:var(--badbg)}.option.wrong .opt-letter{border-color:var(--bad);color:var(--bad)}.option.review{border-color:#d97706;background:color-mix(in srgb,#f59e0b 12%,var(--panel))}.option.review .opt-letter{border-color:#d97706;color:#d97706}.feedback.review{border-color:#d97706;background:color-mix(in srgb,#f59e0b 10%,var(--panel))}.feedback{margin-top:14px;border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--panel2)}.feedback.good{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}.feedback.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}.feedback b{display:block;margin-bottom:5px}.explanation{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}.quiz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.navigator{display:flex;gap:6px;overflow:auto;padding:10px 0 2px}.navq{min-width:34px;height:34px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;cursor:pointer}.navq.current{outline:2px solid var(--primary)}.navq.answered{background:color-mix(in srgb,var(--primary) 12%,var(--panel))}.navq.correct{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.navq.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}.list{display:grid;gap:10px}.q-row{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:14px}.q-row h4{margin:0 0 7px;font-size:15px}.q-row .meta{font-size:12px;color:var(--muted)}.q-row .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.searchbar{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;margin-bottom:14px}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.toast{position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--panel);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translateY(0)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;padding:20px;z-index:99}.modal.open{display:grid}.modal-card{max-width:620px;width:100%;max-height:85vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.kpi-table{width:100%;border-collapse:collapse}.kpi-table th,.kpi-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.right{text-align:right!important}.muted{color:var(--muted)}.hidden{display:none!important}.test-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.test-summary .card{box-shadow:none}.timer{font-variant-numeric:tabular-nums;font-weight:800}.bookmark.active{color:#eab308;border-color:#eab308}.danger-zone{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-280px;width:260px;transition:.22s left;box-shadow:var(--shadow)}.sidebar.open{left:0}.menu-btn{display:inline-flex}.stat{grid-column:span 6}.setup{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr 1fr}.searchbar>*:first-child{grid-column:1/-1}.content{padding:20px 14px 70px}.topbar{padding:10px 14px}.question{font-size:18px}}
@media(max-width:560px){.stat{grid-column:span 12}.chapter-grid{grid-template-columns:1fr}.test-summary{grid-template-columns:1fr}.quiz-card{padding:16px}.option{padding:11px}.quiz-actions{position:sticky;bottom:10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);padding:8px;border-radius:14px}.searchbar{grid-template-columns:1fr}.page-title{font-size:24px}}

.question{white-space:pre-line}
.option span:last-child{white-space:pre-line;overflow-wrap:anywhere}
.explanation{white-space:pre-line;line-height:1.75;overflow-wrap:anywhere}
.q-row h4{white-space:pre-line}

.language-controls{margin:14px 0 18px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--text)}
.language-controls>b{font-size:12px;letter-spacing:.65px}
.language-controls>small{display:block;margin-top:9px;color:var(--muted);font-size:12px}
.language-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.lang-mode.active{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--panel));color:var(--primary);font-weight:750}
.single-lang-label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.single-lang-label select{border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--panel);color:var(--text)}
.language-pair{display:block;white-space:normal;line-height:1.65}
.lang-top,.lang-bottom,.lang-only{display:block;white-space:pre-line;overflow-wrap:anywhere}
.lang-bottom{margin-top:6px;color:var(--muted);font-size:.94em}
.option .lang-bottom{font-size:.94em}
.explain-block+.explain-block{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.explain-block>strong{display:block;font-size:12px;margin-bottom:6px;color:var(--primary)}
.explanation .explain-block .lang-bottom{color:var(--text)}
.quiz-card .language-controls{margin:0 0 15px}
@media(max-width:560px){.language-controls{padding:13px}.language-actions{gap:7px}.lang-mode{flex:1;min-width:120px;text-align:center}.single-lang-label{width:100%}}
</style>

<script>
const QUESTIONS = [{"id":"LLM300-Q001","chapter":4,"number":1,"question":"Why should a bank send only needed data to an LLM?\nTại sao ngân hàng chỉ nên gửi dữ liệu cần thiết cho LLM?","options":[{"id":"LLM300-Q001-A","text":"To avoid all tests of output quality\nTránh mọi bài kiểm tra chất lượng đầu ra"},{"id":"LLM300-Q001-B","text":"To increase the size of every prompt\nTăng độ dài của mọi prompt"},{"id":"LLM300-Q001-C","text":"To make the model forget all grammar\nLàm mô hình quên toàn bộ ngữ pháp"},{"id":"LLM300-Q001-D","text":"To reduce exposure of private information\nGiảm nguy cơ lộ thông tin riêng tư"}],"correctOptionId":"LLM300-Q001-D","explanation":"Explanation (EN): Banking data can contain confidential customer identifiers or credentials. Data minimization, masking, legal safeguards and secure access reduce disclosure risks; an external service does not make these duties disappear.\nGiải thích (VI): Dữ liệu ngân hàng có thể chứa thông tin nhận dạng hoặc thông tin xác thực nhạy cảm. Giảm thiểu dữ liệu, che thông tin, bảo đảm cơ sở pháp lý và kiểm soát truy cập giúp hạn chế rò rỉ; dùng dịch vụ ngoài không làm mất trách nhiệm bảo vệ dữ liệu.\nSlide reference / Đối chiếu slide: Ch.4, pp.19–20; Ch.3, p.38","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q002","chapter":4,"number":2,"question":"What is a risk of using real bank data in a public chatbot?\nRủi ro nào phát sinh khi dùng dữ liệu ngân hàng thật trong chatbot công khai?","options":[{"id":"LLM300-Q002-A","text":"The report may take more pages\nBáo cáo có thể dài thêm nhiều trang"},{"id":"LLM300-Q002-B","text":"The computer may need a restart\nMáy tính có thể cần khởi động lại"},{"id":"LLM300-Q002-C","text":"Sensitive information may leak\nThông tin nhạy cảm có thể bị rò rỉ"},{"id":"LLM300-Q002-D","text":"The font may become too small\nCỡ chữ có thể trở nên quá nhỏ"}],"correctOptionId":"LLM300-Q002-C","explanation":"Explanation (EN): Banking data can contain confidential customer identifiers or credentials. Data minimization, masking, legal safeguards and secure access reduce disclosure risks; an external service does not make these duties disappear.\nGiải thích (VI): Dữ liệu ngân hàng có thể chứa thông tin nhận dạng hoặc thông tin xác thực nhạy cảm. Giảm thiểu dữ liệu, che thông tin, bảo đảm cơ sở pháp lý và kiểm soát truy cập giúp hạn chế rò rỉ; dùng dịch vụ ngoài không làm mất trách nhiệm bảo vệ dữ liệu.\nSlide reference / Đối chiếu slide: Ch.4, pp.19–20; Ch.3, p.38","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q003","chapter":2,"number":3,"question":"Why is a long context not always a guarantee of quality?\nVì sao ngữ cảnh dài không phải lúc nào cũng bảo đảm chất lượng?","options":[{"id":"LLM300-Q003-A","text":"It removes the need for checking\nKhông cần phải kiểm tra nữa"},{"id":"LLM300-Q003-B","text":"It always changes the model weights\nLuôn thay đổi trọng số mô hình"},{"id":"LLM300-Q003-C","text":"It turns every answer into code\nBiến mọi câu trả lời thành mã lập trình"},{"id":"LLM300-Q003-D","text":"Important details may still be missed\nThông tin quan trọng vẫn có thể bị bỏ sót"}],"correctOptionId":"LLM300-Q003-D","explanation":"Explanation (EN): A context window limits how much information the model can process in one interaction. More text may help, but also increases processing demands and does not ensure every important fact is noticed.\nGiải thích (VI): Cửa sổ ngữ cảnh giới hạn lượng thông tin mô hình xử lý trong một lần. Văn bản dài hơn có thể hữu ích nhưng tăng nhu cầu tính toán và không bảo đảm mô hình nhận ra mọi chi tiết quan trọng.\nSlide reference / Đối chiếu slide: Ch.2, pp.18–20; Ch.3, p.7","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q004","chapter":4,"number":4,"question":"What is a key risk when using an external AI API?\nRủi ro chính khi sử dụng API AI bên ngoài là gì?","options":[{"id":"LLM300-Q004-A","text":"Every answer will be in another language\nMọi câu trả lời đều bằng ngôn ngữ khác"},{"id":"LLM300-Q004-B","text":"The model will always lose its memory\nMô hình luôn mất trí nhớ"},{"id":"LLM300-Q004-C","text":"Bank data may leave the bank's systems\nDữ liệu ngân hàng có thể rời khỏi hệ thống của ngân hàng"},{"id":"LLM300-Q004-D","text":"The input can no longer contain text\nDữ liệu nhập không thể còn chứa văn bản"}],"correctOptionId":"LLM300-Q004-C","explanation":"Explanation (EN): Banking data can contain confidential customer identifiers or credentials. Data minimization, masking, legal safeguards and secure access reduce disclosure risks; an external service does not make these duties disappear.\nGiải thích (VI): Dữ liệu ngân hàng có thể chứa thông tin nhận dạng hoặc thông tin xác thực nhạy cảm. Giảm thiểu dữ liệu, che thông tin, bảo đảm cơ sở pháp lý và kiểm soát truy cập giúp hạn chế rò rỉ; dùng dịch vụ ngoài không làm mất trách nhiệm bảo vệ dữ liệu.\nSlide reference / Đối chiếu slide: Ch.4, pp.19–20; Ch.3, p.38","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q005","chapter":4,"number":5,"question":"What must a bank keep after buying an external AI service?\nNgân hàng vẫn phải duy trì điều gì sau khi mua dịch vụ AI bên ngoài?","options":[{"id":"LLM300-Q005-A","text":"Its own oversight and accountability\nDuy trì giám sát và trách nhiệm giải trình của chính mình"},{"id":"LLM300-Q005-B","text":"A rule that suppliers approve all loans\nQuy tắc nhà cung cấp phê duyệt mọi khoản vay"},{"id":"LLM300-Q005-C","text":"The right to ignore customer privacy\nQuyền bỏ qua quyền riêng tư khách hàng"},{"id":"LLM300-Q005-D","text":"A promise that no model testing is needed\nCam kết không cần kiểm thử mô hình"}],"correctOptionId":"LLM300-Q005-A","explanation":"Explanation (EN): An AI model provides support, but the institution must retain control, independent checking, audit records and accountability for important outcomes. Outsourcing does not transfer the bank’s final responsibility.\nGiải thích (VI): AI chỉ hỗ trợ; tổ chức phải duy trì quyền kiểm soát, kiểm tra độc lập, nhật ký kiểm toán và trách nhiệm giải trình đối với kết quả quan trọng. Thuê dịch vụ ngoài không chuyển hết trách nhiệm cuối cùng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.4, pp.19, 32, 52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q006","chapter":1,"number":6,"question":"What is one main difference between GPT and BERT?\nMột điểm khác biệt chính giữa GPT và BERT là gì?","options":[{"id":"LLM300-Q006-A","text":"GPT focuses on generation; BERT on understanding\nGPT tập trung tạo sinh; BERT tập trung hiểu ngôn ngữ"},{"id":"LLM300-Q006-B","text":"GPT works only with printed tables\nGPT chỉ hoạt động với bảng in giấy"},{"id":"LLM300-Q006-C","text":"Both are only document scanners\nCả hai chỉ là máy quét tài liệu"},{"id":"LLM300-Q006-D","text":"BERT can only process music files\nBERT chỉ xử lý tệp nhạc"}],"correctOptionId":"LLM300-Q006-A","explanation":"Explanation (EN): GPT belongs to the decoder-only Transformer family and is oriented toward text generation. BERT is an encoder-only model for language representations; T5/BART use encoder–decoder structures.\nGiải thích (VI): GPT thuộc họ Transformer decoder-only, thiên về tạo sinh văn bản. BERT thuộc nhóm encoder-only để biểu diễn và hiểu ngôn ngữ; T5/BART dùng kiến trúc encoder–decoder.\nSlide reference / Đối chiếu slide: Ch.1, p.12; Ch.2, pp.27–28","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q007","chapter":1,"number":7,"question":"A model does well on translation and then on a new text task. What does this show?\nMột mô hình làm tốt dịch thuật rồi tiếp tục làm tốt nhiệm vụ văn bản mới. Điều này cho thấy gì?","options":[{"id":"LLM300-Q007-A","text":"A fixed output template\nMẫu định dạng đầu ra cố định"},{"id":"LLM300-Q007-B","text":"A smaller token limit\nGiới hạn token nhỏ hơn"},{"id":"LLM300-Q007-C","text":"Generalization across tasks\nKhái quát hóa giữa các nhiệm vụ"},{"id":"LLM300-Q007-D","text":"A change in user accounts\nThay đổi tài khoản người dùng"}],"correctOptionId":"LLM300-Q007-C","explanation":"Explanation (EN): Generalization means applying patterns and abilities learned during training to new inputs or tasks, not simply repeating memorized outputs.\nGiải thích (VI): Khái quát hóa là áp dụng mẫu và năng lực đã học cho dữ liệu hoặc nhiệm vụ mới, chứ không phải chỉ lặp lại câu đã ghi nhớ.\nSlide reference / Đối chiếu slide: Ch.1, p.22","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q008","chapter":2,"number":8,"question":"Which part of ChatGPT lets users upload files and ask questions?\nBộ phận nào của ChatGPT cho phép người dùng tải tệp lên và đặt câu hỏi?","options":[{"id":"LLM300-Q008-A","text":"The user interface\nGiao diện người dùng"},{"id":"LLM300-Q008-B","text":"The tokenizer alone\nChỉ riêng bộ tách token"},{"id":"LLM300-Q008-C","text":"The training dataset alone\nChỉ riêng tập dữ liệu huấn luyện"},{"id":"LLM300-Q008-D","text":"The attention head alone\nChỉ riêng đầu attention"}],"correctOptionId":"LLM300-Q008-A","explanation":"Explanation (EN): ChatGPT is an AI application combining a language model with a user interface and supporting services. File upload, conversation display and memory are application features, not tasks performed by one attention head.\nGiải thích (VI): ChatGPT là ứng dụng AI kết hợp mô hình ngôn ngữ, giao diện và các dịch vụ hỗ trợ. Tải tệp, hiển thị hội thoại và ghi nhớ là tính năng ứng dụng, không phải chức năng riêng của một đầu attention.\nSlide reference / Đối chiếu slide: Ch.2, pp.15–24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q009","chapter":2,"number":9,"question":"What does self-attention help a model find?\nSelf-attention giúp mô hình tìm ra điều gì?","options":[{"id":"LLM300-Q009-A","text":"The user's bank card balance\nSố dư thẻ ngân hàng của người dùng"},{"id":"LLM300-Q009-B","text":"Links among words in the text\nMối liên hệ giữa các từ trong văn bản"},{"id":"LLM300-Q009-C","text":"A file's printing settings\nCài đặt in của tệp"},{"id":"LLM300-Q009-D","text":"A physical computer location\nVị trí vật lý của máy tính"}],"correctOptionId":"LLM300-Q009-B","explanation":"Explanation (EN): Self-attention measures relationships among tokens. Multiple attention heads can learn different relationships in parallel; a single head does not provide the same diversity.\nGiải thích (VI): Self-attention tính mối liên hệ giữa các token. Nhiều đầu attention học các kiểu quan hệ khác nhau song song; một đầu đơn lẻ không có cùng độ đa dạng biểu diễn.\nSlide reference / Đối chiếu slide: Ch.2, pp.35–37","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q010","chapter":1,"number":10,"question":"Why are smaller or cheaper models worth studying?\nVì sao nên nghiên cứu các mô hình nhỏ hơn hoặc rẻ hơn?","options":[{"id":"LLM300-Q010-A","text":"They make private records public by default\nTự động công khai dữ liệu riêng tư"},{"id":"LLM300-Q010-B","text":"They remove all requirements for testing\nLoại bỏ mọi yêu cầu kiểm thử"},{"id":"LLM300-Q010-C","text":"They always know more than larger models\nLuôn hiểu biết hơn mô hình lớn"},{"id":"LLM300-Q010-D","text":"They can reduce operating cost for suitable tasks\nGiảm chi phí vận hành cho nhiệm vụ phù hợp"}],"correctOptionId":"LLM300-Q010-D","explanation":"Explanation (EN): Model scale involves parameters, training tokens, compute and energy. Larger systems can be costly and do not automatically outperform smaller models on every task, so suitability and evaluation matter.\nGiải thích (VI): Quy mô mô hình liên quan đến tham số, token huấn luyện, năng lực tính toán và năng lượng. Mô hình lớn tốn kém và không tự động tốt hơn ở mọi tác vụ; cần xét tính phù hợp và đánh giá.\nSlide reference / Đối chiếu slide: Ch.1, pp.15–18, 30–31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q011","chapter":3,"number":11,"question":"What does Top-P limit?\nTop-P giới hạn điều gì?","options":[{"id":"LLM300-Q011-A","text":"The number of bank branches\nSố lượng chi nhánh ngân hàng"},{"id":"LLM300-Q011-B","text":"Next-token choices by total probability\nCác token kế tiếp dựa trên tổng xác suất tích lũy"},{"id":"LLM300-Q011-C","text":"The total size of a PDF file\nTổng dung lượng tệp PDF"},{"id":"LLM300-Q011-D","text":"The number of user passwords\nSố lượng mật khẩu người dùng"}],"correctOptionId":"LLM300-Q011-B","explanation":"Explanation (EN): Top-P (nucleus sampling) chooses from the smallest candidate set whose cumulative probability reaches a selected threshold, rather than a fixed number of tokens.\nGiải thích (VI): Top-P (lấy mẫu nucleus) chọn trong tập ứng viên nhỏ nhất có tổng xác suất tích lũy đạt ngưỡng đặt trước, không phải số token cố định.\nSlide reference / Đối chiếu slide: Ch.3, p.14","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q012","chapter":1,"number":12,"question":"What does a language model assign to a word sequence?\nMô hình ngôn ngữ gán gì cho một chuỗi từ?","options":[{"id":"LLM300-Q012-A","text":"A probability value\nMột giá trị xác suất"},{"id":"LLM300-Q012-B","text":"A bank account number\nSố tài khoản ngân hàng"},{"id":"LLM300-Q012-C","text":"A fixed legal status\nTư cách pháp lý cố định"},{"id":"LLM300-Q012-D","text":"A security access level\nCấp độ quyền truy cập bảo mật"}],"correctOptionId":"LLM300-Q012-A","explanation":"Explanation (EN): A language model assigns probabilities to text sequences. A conditional model estimates the next word or token using preceding context rather than unrelated account information.\nGiải thích (VI): Mô hình ngôn ngữ gán xác suất cho chuỗi văn bản. Mô hình có điều kiện ước lượng từ hoặc token tiếp theo dựa trên ngữ cảnh trước, không dựa vào thông tin tài khoản không liên quan.\nSlide reference / Đối chiếu slide: Ch.1, pp.6–11","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q013","chapter":2,"number":13,"question":"What is a challenge of very long context windows?\nThách thức của cửa sổ ngữ cảnh rất dài là gì?","options":[{"id":"LLM300-Q013-A","text":"Computing needs and costs can rise sharply\nNhu cầu tính toán và chi phí có thể tăng mạnh"},{"id":"LLM300-Q013-B","text":"All false statements disappear permanently\nMọi phát biểu sai biến mất vĩnh viễn"},{"id":"LLM300-Q013-C","text":"Every document becomes much shorter\nMọi tài liệu trở nên ngắn hơn"},{"id":"LLM300-Q013-D","text":"Bank policies become automatically correct\nChính sách ngân hàng tự động đúng"}],"correctOptionId":"LLM300-Q013-A","explanation":"Explanation (EN): A context window limits how much information the model can process in one interaction. More text may help, but also increases processing demands and does not ensure every important fact is noticed.\nGiải thích (VI): Cửa sổ ngữ cảnh giới hạn lượng thông tin mô hình xử lý trong một lần. Văn bản dài hơn có thể hữu ích nhưng tăng nhu cầu tính toán và không bảo đảm mô hình nhận ra mọi chi tiết quan trọng.\nSlide reference / Đối chiếu slide: Ch.2, pp.18–20; Ch.3, p.7","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q014","chapter":2,"number":14,"question":"What does a reward model in RLHF try to estimate?\nReward model trong RLHF cố gắng ước lượng điều gì?","options":[{"id":"LLM300-Q014-A","text":"The cost of a printed page\nChi phí của trang in"},{"id":"LLM300-Q014-B","text":"How many branches a bank has\nSố lượng chi nhánh ngân hàng"},{"id":"LLM300-Q014-C","text":"Which replies people prefer\nCác câu trả lời được con người ưa thích"},{"id":"LLM300-Q014-D","text":"The user's internet connection speed\nTốc độ Internet của người dùng"}],"correctOptionId":"LLM300-Q014-C","explanation":"Explanation (EN): Reinforcement Learning from Human Feedback uses human preference judgments and a reward model to align model responses with preferred behavior. Preference alignment does not guarantee that every fact is true.\nGiải thích (VI): RLHF dùng đánh giá sở thích con người và reward model để điều chỉnh câu trả lời theo hành vi được ưa thích. Phù hợp sở thích không bảo đảm mọi thông tin đều đúng.\nSlide reference / Đối chiếu slide: Ch.2, p.48","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q015","chapter":3,"number":15,"question":"What does prompt context help the model understand?\nNgữ cảnh trong prompt giúp mô hình hiểu điều gì?","options":[{"id":"LLM300-Q015-A","text":"The true value of missing data\nGiá trị thực của dữ liệu bị thiếu"},{"id":"LLM300-Q015-B","text":"The business situation and purpose\nTình huống nghiệp vụ và mục tiêu"},{"id":"LLM300-Q015-C","text":"The bank's future share price\nGiá cổ phiếu ngân hàng trong tương lai"},{"id":"LLM300-Q015-D","text":"The model's graphics card brand\nHãng card đồ họa của mô hình"}],"correctOptionId":"LLM300-Q015-B","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q016","chapter":4,"number":16,"question":"Which approach better protects a bank than one safety filter?\nCách tiếp cận nào bảo vệ ngân hàng tốt hơn chỉ một bộ lọc an toàn?","options":[{"id":"LLM300-Q016-A","text":"A single keyword block with no review\nMột bộ chặn từ khóa đơn lẻ không rà soát"},{"id":"LLM300-Q016-B","text":"Several layers of technical and human controls\nNhiều lớp kiểm soát kỹ thuật và con người"},{"id":"LLM300-Q016-C","text":"No access limits for internal systems\nKhông giới hạn quyền hệ thống nội bộ"},{"id":"LLM300-Q016-D","text":"Automatic trust in every model output\nTự động tin mọi đầu ra mô hình"}],"correctOptionId":"LLM300-Q016-B","explanation":"Explanation (EN): An AI model provides support, but the institution must retain control, independent checking, audit records and accountability for important outcomes. Outsourcing does not transfer the bank’s final responsibility.\nGiải thích (VI): AI chỉ hỗ trợ; tổ chức phải duy trì quyền kiểm soát, kiểm tra độc lập, nhật ký kiểm toán và trách nhiệm giải trình đối với kết quả quan trọng. Thuê dịch vụ ngoài không chuyển hết trách nhiệm cuối cùng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.4, pp.19, 32, 52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q017","chapter":1,"number":17,"question":"What happens in few-shot in-context learning?\nĐiều gì xảy ra trong học theo ngữ cảnh với vài ví dụ (few-shot)?","options":[{"id":"LLM300-Q017-A","text":"The model uses several prompt examples\nMô hình sử dụng một số ví dụ trong prompt"},{"id":"LLM300-Q017-B","text":"The model needs no input data\nMô hình không cần dữ liệu đầu vào"},{"id":"LLM300-Q017-C","text":"The model must update its weights\nMô hình phải cập nhật trọng số"},{"id":"LLM300-Q017-D","text":"The model cannot read task details\nMô hình không đọc được mô tả nhiệm vụ"}],"correctOptionId":"LLM300-Q017-A","explanation":"Explanation (EN): Few-shot in-context learning supplies several demonstrations inside the prompt. The model infers the desired pattern from these examples without changing its permanent weights.\nGiải thích (VI): Few-shot cung cấp một số ví dụ ngay trong prompt. Mô hình suy ra cách làm từ ví dụ mà không thay đổi vĩnh viễn trọng số đã huấn luyện.\nSlide reference / Đối chiếu slide: Ch.1, pp.24–25; Ch.3, p.27","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q018","chapter":4,"number":18,"question":"What is FinBERT mainly designed to handle?\nFinBERT chủ yếu được thiết kế xử lý điều gì?","options":[{"id":"LLM300-Q018-A","text":"Only satellite images\nChỉ hình ảnh vệ tinh"},{"id":"LLM300-Q018-B","text":"Only customer fingerprints\nChỉ dấu vân tay khách hàng"},{"id":"LLM300-Q018-C","text":"Only network hardware problems\nChỉ vấn đề phần cứng mạng"},{"id":"LLM300-Q018-D","text":"Financial language and sentiment\nNgôn ngữ và cảm xúc trong tài chính"}],"correctOptionId":"LLM300-Q018-D","explanation":"Explanation (EN): FinBERT adapts BERT-style language modeling to financial text, especially financial sentiment classification. It is not a hardware or image-only system.\nGiải thích (VI): FinBERT chuyên biệt hóa mô hình kiểu BERT cho ngôn ngữ tài chính, nhất là phân loại cảm xúc trong văn bản tài chính; không phải hệ thống phần cứng hay chỉ xử lý hình ảnh.\nSlide reference / Đối chiếu slide: Ch.4, p.46","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q019","chapter":1,"number":19,"question":"When is an ability called emergent?\nKhi nào một khả năng được gọi là khả năng nổi lên (emergent)?","options":[{"id":"LLM300-Q019-A","text":"It depends only on a longer prompt\nChỉ phụ thuộc prompt dài hơn"},{"id":"LLM300-Q019-B","text":"It appears at larger model sizes\nXuất hiện khi mô hình có quy mô lớn hơn"},{"id":"LLM300-Q019-C","text":"It is written directly by the user\nĐược người dùng trực tiếp viết ra"},{"id":"LLM300-Q019-D","text":"It works only on a phone\nChỉ hoạt động trên điện thoại"}],"correctOptionId":"LLM300-Q019-B","explanation":"Explanation (EN): Emergent abilities are capabilities observed at certain larger model scales rather than directly inserted by a user; scaling alone does not guarantee every benchmark will improve.\nGiải thích (VI): Khả năng nổi lên là năng lực được quan sát ở những mức quy mô lớn nhất định, không phải do người dùng trực tiếp viết vào; tăng quy mô không bảo đảm mọi thước đo đều tăng.\nSlide reference / Đối chiếu slide: Ch.1, p.23","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q020","chapter":3,"number":20,"question":"Why is a reusable prompt template helpful?\nVì sao mẫu prompt có thể tái sử dụng lại hữu ích?","options":[{"id":"LLM300-Q020-A","text":"It keeps repeated tasks consistent\nGiúp nhiệm vụ lặp lại nhất quán"},{"id":"LLM300-Q020-B","text":"It changes the model architecture\nThay đổi kiến trúc mô hình"},{"id":"LLM300-Q020-C","text":"It makes every answer a new fact\nBiến mọi câu trả lời thành sự thật mới"},{"id":"LLM300-Q020-D","text":"It removes all need to check data\nLoại bỏ nhu cầu kiểm tra dữ liệu"}],"correctOptionId":"LLM300-Q020-A","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q021","chapter":3,"number":21,"question":"Why evaluate a model after training?\nVì sao cần đánh giá mô hình sau huấn luyện?","options":[{"id":"LLM300-Q021-A","text":"To check how well it performs\nKiểm tra hiệu quả hoạt động của mô hình"},{"id":"LLM300-Q021-B","text":"To replace text with graphics\nThay văn bản bằng hình ảnh"},{"id":"LLM300-Q021-C","text":"To make every reply longer\nLàm mọi câu trả lời dài hơn"},{"id":"LLM300-Q021-D","text":"To remove all computing costs\nLoại bỏ mọi chi phí tính toán"}],"correctOptionId":"LLM300-Q021-A","explanation":"Explanation (EN): Evaluation checks model performance, failures and edge cases using test inputs, including inconsistent data. A convincing response should not replace actual verification.\nGiải thích (VI): Đánh giá kiểm tra hiệu năng, sai sót và trường hợp biên bằng dữ liệu thử, kể cả dữ liệu mâu thuẫn. Câu trả lời có vẻ thuyết phục không thay thế việc xác minh.\nSlide reference / Đối chiếu slide: Ch.3, pp.10, 24; Ch.4, p.32","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q022","chapter":1,"number":22,"question":"What is generalization in an LLM?\nKhả năng khái quát hóa (generalization) của LLM là gì?","options":[{"id":"LLM300-Q022-A","text":"Using learned skills on new tasks\nDùng kỹ năng đã học cho nhiệm vụ mới"},{"id":"LLM300-Q022-B","text":"Keeping every output unchanged\nGiữ mọi đầu ra không đổi"},{"id":"LLM300-Q022-C","text":"Changing a customer's identity\nThay đổi danh tính khách hàng"},{"id":"LLM300-Q022-D","text":"Repeating only a fixed sentence\nChỉ lặp lại một câu cố định"}],"correctOptionId":"LLM300-Q022-A","explanation":"Explanation (EN): Generalization means applying patterns and abilities learned during training to new inputs or tasks, not simply repeating memorized outputs.\nGiải thích (VI): Khái quát hóa là áp dụng mẫu và năng lực đã học cho dữ liệu hoặc nhiệm vụ mới, chứ không phải chỉ lặp lại câu đã ghi nhớ.\nSlide reference / Đối chiếu slide: Ch.1, p.22","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q023","chapter":2,"number":23,"question":"What does a decoder predict while writing text?\nBộ giải mã (decoder) dự đoán gì khi tạo văn bản?","options":[{"id":"LLM300-Q023-A","text":"A random bank address from memory\nĐịa chỉ ngân hàng bất kỳ từ bộ nhớ"},{"id":"LLM300-Q023-B","text":"The final page count of a report\nSố trang cuối cùng của báo cáo"},{"id":"LLM300-Q023-C","text":"The user's exact age from a title\nTuổi chính xác của người dùng từ tiêu đề"},{"id":"LLM300-Q023-D","text":"The next token from earlier tokens\nToken tiếp theo dựa trên các token trước"}],"correctOptionId":"LLM300-Q023-D","explanation":"Explanation (EN): Autoregressive decoder generation predicts the next token using earlier tokens and repeats until a stop condition. The sequence is not emitted all at once.\nGiải thích (VI): Bộ giải mã tự hồi quy dự đoán token kế tiếp từ các token trước và lặp đến điều kiện dừng; các token không xuất hiện đồng thời.\nSlide reference / Đối chiếu slide: Ch.2, pp.41–44","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q024","chapter":3,"number":24,"question":"What does AI misuse mean?\nViệc lạm dụng AI (AI misuse) nghĩa là gì?","options":[{"id":"LLM300-Q024-A","text":"Using AI abilities for harmful purposes\nDùng năng lực AI vào mục đích gây hại"},{"id":"LLM300-Q024-B","text":"Using a prompt to set output format\nDùng prompt quy định định dạng đầu ra"},{"id":"LLM300-Q024-C","text":"Updating the bank's internal manuals\nCập nhật sổ tay nội bộ ngân hàng"},{"id":"LLM300-Q024-D","text":"Checking a reply against its sources\nĐối chiếu câu trả lời với nguồn"}],"correctOptionId":"LLM300-Q024-A","explanation":"Explanation (EN): Model misuse is the use of AI capabilities for harmful or unauthorized purposes. It differs from normal formatting or legitimate review requests.\nGiải thích (VI): Lạm dụng mô hình là dùng năng lực AI cho mục đích gây hại hoặc trái thẩm quyền; khác với yêu cầu định dạng hay rà soát hợp lệ.\nSlide reference / Đối chiếu slide: Ch.3, pp.38–40","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q025","chapter":3,"number":25,"question":"For varied new ideas, which temperature setting is more suitable?\nMuốn có nhiều ý tưởng mới đa dạng, nên dùng mức temperature nào?","options":[{"id":"LLM300-Q025-A","text":"A lower temperature\nTemperature thấp hơn"},{"id":"LLM300-Q025-B","text":"A higher temperature\nTemperature cao hơn"},{"id":"LLM300-Q025-C","text":"A fixed one-word response\nCâu trả lời cố định một từ"},{"id":"LLM300-Q025-D","text":"No task description\nKhông mô tả nhiệm vụ"}],"correctOptionId":"LLM300-Q025-B","explanation":"Explanation (EN): Temperature controls randomness in token selection. A lower value is usually better for consistent extraction; a higher value produces more diverse ideas, but neither guarantees truth.\nGiải thích (VI): Temperature điều chỉnh độ ngẫu nhiên khi chọn token. Giá trị thấp thường phù hợp để trích xuất ổn định; giá trị cao tạo ý tưởng đa dạng hơn nhưng không bảo đảm độ đúng.\nSlide reference / Đối chiếu slide: Ch.3, pp.11–14","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q026","chapter":4,"number":26,"question":"Which channel is suitable for checking balance in a banking app?\nKênh nào phù hợp để kiểm tra số dư trong ứng dụng ngân hàng?","options":[{"id":"LLM300-Q026-A","text":"A public social-media comment\nBình luận công khai trên mạng xã hội"},{"id":"LLM300-Q026-B","text":"An outside message from a stranger\nTin nhắn ngoài ứng dụng từ người lạ"},{"id":"LLM300-Q026-C","text":"An in-app virtual assistant\nTrợ lý ảo trong ứng dụng ngân hàng"},{"id":"LLM300-Q026-D","text":"A printed stock market chart\nBiểu đồ chứng khoán in giấy"}],"correctOptionId":"LLM300-Q026-C","explanation":"Explanation (EN): Banking chatbots are best used for repeated customer requests and verified in-app assistance. Unresolved or sensitive issues should be escalated to authorized human staff, not resolved by inventing an answer.\nGiải thích (VI): Chatbot ngân hàng phù hợp với các yêu cầu lặp lại và hỗ trợ trong ứng dụng đã xác thực. Vấn đề nhạy cảm hoặc chưa xử lý được phải chuyển nhân viên có thẩm quyền, không được bịa câu trả lời.\nSlide reference / Đối chiếu slide: Ch.4, pp.11–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q027","chapter":4,"number":27,"question":"Why should a bank compare its processes with new regulations?\nVì sao ngân hàng cần đối chiếu quy trình với quy định mới?","options":[{"id":"LLM300-Q027-A","text":"To avoid reading official rules\nTránh đọc quy định chính thức"},{"id":"LLM300-Q027-B","text":"To remove all human approvals\nLoại bỏ mọi phê duyệt của con người"},{"id":"LLM300-Q027-C","text":"To invent new legal requirements\nTự sáng chế yêu cầu pháp lý mới"},{"id":"LLM300-Q027-D","text":"To spot possible compliance gaps\nPhát hiện khoảng trống tuân thủ có thể có"}],"correctOptionId":"LLM300-Q027-D","explanation":"Explanation (EN): An LLM can compare documents with rules and highlight possible compliance or legal gaps, but qualified reviewers must check authoritative regulations and make final judgments.\nGiải thích (VI): LLM có thể đối chiếu tài liệu với quy định và cảnh báo khoảng trống tuân thủ hoặc pháp lý, nhưng người có chuyên môn phải kiểm tra văn bản có thẩm quyền và ra kết luận cuối.\nSlide reference / Đối chiếu slide: Ch.4, pp.30–32","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q028","chapter":1,"number":28,"question":"What does a next-word probability depend on in a bigram model?\nXác suất từ tiếp theo trong mô hình bigram phụ thuộc vào gì?","options":[{"id":"LLM300-Q028-A","text":"The one word before it\nMột từ đứng ngay trước"},{"id":"LLM300-Q028-B","text":"The whole future sentence\nToàn bộ câu tương lai"},{"id":"LLM300-Q028-C","text":"The two words after it\nHai từ đứng sau"},{"id":"LLM300-Q028-D","text":"The number of bank branches\nSố lượng chi nhánh ngân hàng"}],"correctOptionId":"LLM300-Q028-A","explanation":"Explanation (EN): An N-gram uses a limited preceding context: an N-gram sequence contains N consecutive words, and a next-word prediction conditions on N−1 previous words. In a sentence of m words, there are m −N+1 overlapping N-grams.\nGiải thích (VI): N-gram dùng ngữ cảnh trước có giới hạn: một nhóm gồm N từ liên tiếp và việc đoán từ tiếp theo dựa vào N−1 từ trước. Câu có m từ tạo được m−N+1 nhóm N-gram chồng lấp.\nSlide reference / Đối chiếu slide: Ch.1, pp.6–9","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q029","chapter":3,"number":29,"question":"What happens if the output token limit is too small?\nĐiều gì xảy ra nếu giới hạn token đầu ra quá nhỏ?","options":[{"id":"LLM300-Q029-A","text":"All facts are checked by humans\nMọi sự thật được con người kiểm tra"},{"id":"LLM300-Q029-B","text":"The input file becomes encrypted\nTệp đầu vào được mã hóa"},{"id":"LLM300-Q029-C","text":"The model must learn new weights\nMô hình phải học trọng số mới"},{"id":"LLM300-Q029-D","text":"The answer may stop too early\nCâu trả lời có thể bị dừng quá sớm"}],"correctOptionId":"LLM300-Q029-D","explanation":"Explanation (EN): Output length or max output tokens caps how much text can be generated. A short cap may truncate the answer; generation also stops on an end token.\nGiải thích (VI): Độ dài đầu ra hoặc max output tokens giới hạn lượng văn bản tạo ra. Giới hạn thấp có thể làm câu trả lời bị cắt; token kết thúc cũng có thể dừng việc tạo sinh.\nSlide reference / Đối chiếu slide: Ch.3, pp.11–12; Ch.2, p.44","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q030","chapter":1,"number":30,"question":"Which group contains GPT models?\nNhóm kiến trúc nào chứa các mô hình GPT?","options":[{"id":"LLM300-Q030-A","text":"Encoder-only models\nMô hình chỉ có bộ mã hóa"},{"id":"LLM300-Q030-B","text":"Encoder-decoder models\nMô hình mã hóa-giải mã"},{"id":"LLM300-Q030-C","text":"Rule-based search models\nMô hình tìm kiếm theo quy tắc"},{"id":"LLM300-Q030-D","text":"Decoder-only models\nMô hình chỉ có bộ giải mã"}],"correctOptionId":"LLM300-Q030-D","explanation":"Explanation (EN): GPT belongs to the decoder-only Transformer family and is oriented toward text generation. BERT is an encoder-only model for language representations; T5/BART use encoder–decoder structures.\nGiải thích (VI): GPT thuộc họ Transformer decoder-only, thiên về tạo sinh văn bản. BERT thuộc nhóm encoder-only để biểu diễn và hiểu ngôn ngữ; T5/BART dùng kiến trúc encoder–decoder.\nSlide reference / Đối chiếu slide: Ch.1, p.12; Ch.2, pp.27–28","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q031","chapter":3,"number":31,"question":"What does a clear task statement tell the model?\nMô tả nhiệm vụ rõ ràng cho mô hình biết điều gì?","options":[{"id":"LLM300-Q031-A","text":"The work it must carry out\nCông việc mà mô hình phải thực hiện"},{"id":"LLM300-Q031-B","text":"The cost of training new weights\nChi phí huấn luyện trọng số mới"},{"id":"LLM300-Q031-C","text":"The number of active users\nSố lượng người dùng hoạt động"},{"id":"LLM300-Q031-D","text":"The physical address of a server\nĐịa chỉ vật lý của máy chủ"}],"correctOptionId":"LLM300-Q031-A","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q032","chapter":3,"number":32,"question":"For stable number extraction, which temperature setting is more suitable?\nMuốn trích xuất số liệu ổn định, nên dùng temperature nào?","options":[{"id":"LLM300-Q032-A","text":"A higher temperature\nTemperature cao hơn"},{"id":"LLM300-Q032-B","text":"A random value each time\nMỗi lần dùng một giá trị ngẫu nhiên"},{"id":"LLM300-Q032-C","text":"No input documents\nKhông có tài liệu đầu vào"},{"id":"LLM300-Q032-D","text":"A lower temperature\nTemperature thấp hơn"}],"correctOptionId":"LLM300-Q032-D","explanation":"Explanation (EN): Temperature controls randomness in token selection. A lower value is usually better for consistent extraction; a higher value produces more diverse ideas, but neither guarantees truth.\nGiải thích (VI): Temperature điều chỉnh độ ngẫu nhiên khi chọn token. Giá trị thấp thường phù hợp để trích xuất ổn định; giá trị cao tạo ý tưởng đa dạng hơn nhưng không bảo đảm độ đúng.\nSlide reference / Đối chiếu slide: Ch.3, pp.11–14","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q033","chapter":4,"number":33,"question":"Which risk means a borrower may fail to repay a loan?\nRủi ro nào chỉ khả năng người vay không trả được nợ?","options":[{"id":"LLM300-Q033-A","text":"Market risk\nRủi ro thị trường"},{"id":"LLM300-Q033-B","text":"Compliance risk\nRủi ro tuân thủ"},{"id":"LLM300-Q033-C","text":"Credit risk\nRủi ro tín dụng"},{"id":"LLM300-Q033-D","text":"Operational risk\nRủi ro hoạt động"}],"correctOptionId":"LLM300-Q033-C","explanation":"Explanation (EN): Credit risk is the risk that a borrower does not repay. LLMs can review loan files and flag missing or contradictory items for a loan officer, but must not autonomously invent data or approve loans.\nGiải thích (VI): Rủi ro tín dụng là khả năng người vay không trả nợ. LLM có thể rà hồ sơ, cảnh báo thông tin thiếu hoặc mâu thuẫn để cán bộ tín dụng kiểm tra nhưng không được tự bịa dữ liệu hay phê duyệt vay.\nSlide reference / Đối chiếu slide: Ch.4, pp.25–29","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q034","chapter":4,"number":34,"question":"Who is responsible for a bank's final credit decision?\nAi chịu trách nhiệm về quyết định tín dụng cuối cùng của ngân hàng?","options":[{"id":"LLM300-Q034-A","text":"Only the outside model supplier\nChỉ nhà cung cấp mô hình bên ngoài"},{"id":"LLM300-Q034-B","text":"Only the text-generation algorithm\nChỉ thuật toán tạo văn bản"},{"id":"LLM300-Q034-C","text":"Only the customer who applied\nChỉ khách hàng xin vay"},{"id":"LLM300-Q034-D","text":"The bank and its authorized decision maker\nNgân hàng và người ra quyết định được ủy quyền"}],"correctOptionId":"LLM300-Q034-D","explanation":"Explanation (EN): An AI model provides support, but the institution must retain control, independent checking, audit records and accountability for important outcomes. Outsourcing does not transfer the bank’s final responsibility.\nGiải thích (VI): AI chỉ hỗ trợ; tổ chức phải duy trì quyền kiểm soát, kiểm tra độc lập, nhật ký kiểm toán và trách nhiệm giải trình đối với kết quả quan trọng. Thuê dịch vụ ngoài không chuyển hết trách nhiệm cuối cùng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.4, pp.19, 32, 52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q035","chapter":4,"number":35,"question":"What should happen before a bank uses customer data for new AI work?\nTrước khi dùng dữ liệu khách hàng cho công việc AI mới, ngân hàng cần làm gì?","options":[{"id":"LLM300-Q035-A","text":"Assume all customer uses are allowed\nMặc định mọi cách dùng dữ liệu đều được phép"},{"id":"LLM300-Q035-B","text":"Check the legal basis and data safeguards\nKiểm tra cơ sở pháp lý và biện pháp bảo vệ dữ liệu"},{"id":"LLM300-Q035-C","text":"Ignore how the data was first collected\nBỏ qua mục đích thu thập ban đầu"},{"id":"LLM300-Q035-D","text":"Share all records with any public model\nChia sẻ tất cả hồ sơ với mọi mô hình công khai"}],"correctOptionId":"LLM300-Q035-B","explanation":"Explanation (EN): Banking data can contain confidential customer identifiers or credentials. Data minimization, masking, legal safeguards and secure access reduce disclosure risks; an external service does not make these duties disappear.\nGiải thích (VI): Dữ liệu ngân hàng có thể chứa thông tin nhận dạng hoặc thông tin xác thực nhạy cảm. Giảm thiểu dữ liệu, che thông tin, bảo đảm cơ sở pháp lý và kiểm soát truy cập giúp hạn chế rò rỉ; dùng dịch vụ ngoài không làm mất trách nhiệm bảo vệ dữ liệu.\nSlide reference / Đối chiếu slide: Ch.4, pp.19–20; Ch.3, p.38","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q036","chapter":4,"number":36,"question":"What should staff do with an AI-generated financial figure?\nNhân viên nên làm gì với số liệu tài chính do AI tạo ra?","options":[{"id":"LLM300-Q036-A","text":"Remove the original source file\nXóa tệp nguồn gốc"},{"id":"LLM300-Q036-B","text":"Round it without asking anyone\nTự làm tròn số không hỏi ai"},{"id":"LLM300-Q036-C","text":"Accept it because it sounds right\nChấp nhận vì nghe có vẻ đúng"},{"id":"LLM300-Q036-D","text":"Check it against the source report\nĐối chiếu với báo cáo gốc"}],"correctOptionId":"LLM300-Q036-D","explanation":"Explanation (EN): AI-generated financial figures must be checked against original source documents. Fluent writing is not evidence that an amount or percentage was correctly extracted.\nGiải thích (VI): Số liệu tài chính do AI tạo phải được đối chiếu với chứng từ gốc. Văn phong trôi chảy không chứng minh số tiền hay tỷ lệ đã được trích xuất chính xác.\nSlide reference / Đối chiếu slide: Ch.4, pp.8–10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q037","chapter":2,"number":37,"question":"Why check both prompts and generated replies for harmful content?\nVì sao cần kiểm tra nội dung có hại cả ở prompt lẫn câu trả lời tạo ra?","options":[{"id":"LLM300-Q037-A","text":"They make model outputs fully predictable\nLàm đầu ra hoàn toàn dự đoán được"},{"id":"LLM300-Q037-B","text":"They remove the need for bank policies\nLoại bỏ nhu cầu có chính sách ngân hàng"},{"id":"LLM300-Q037-C","text":"Both checks train all model weights again\nCả hai kiểm tra đều huấn luyện lại mọi trọng số"},{"id":"LLM300-Q037-D","text":"One check may miss a risky request or answer\nMột lần kiểm tra có thể bỏ sót yêu cầu hoặc câu trả lời rủi ro"}],"correctOptionId":"LLM300-Q037-D","explanation":"Explanation (EN): Content moderation and multiple technical/human safeguards screen unsafe requests and outputs. Checking only one side can miss a harmful instruction or an unsafe response.\nGiải thích (VI): Kiểm duyệt nội dung và nhiều lớp bảo vệ kỹ thuật/con người giúp sàng lọc yêu cầu và đầu ra không an toàn. Chỉ kiểm tra một phía có thể bỏ sót yêu cầu độc hại hoặc câu trả lời nguy hiểm.\nSlide reference / Đối chiếu slide: Ch.2, p.25; Ch.3, p.40","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q038","chapter":1,"number":38,"question":"What is generalization in an LLM?\nKhả năng khái quát hóa của LLM là gì?","options":[{"id":"LLM300-Q038-A","text":"Keeping every output unchanged\nGiữ mọi đầu ra không đổi"},{"id":"LLM300-Q038-B","text":"Repeating only a fixed sentence\nChỉ lặp lại câu cố định"},{"id":"LLM300-Q038-C","text":"Changing a customer's identity\nThay đổi danh tính khách hàng"},{"id":"LLM300-Q038-D","text":"Using learned skills on new tasks\nDùng kỹ năng đã học ở nhiệm vụ mới"}],"correctOptionId":"LLM300-Q038-D","explanation":"Explanation (EN): Generalization means applying patterns and abilities learned during training to new inputs or tasks, not simply repeating memorized outputs.\nGiải thích (VI): Khái quát hóa là áp dụng mẫu và năng lực đã học cho dữ liệu hoặc nhiệm vụ mới, chứ không phải chỉ lặp lại câu đã ghi nhớ.\nSlide reference / Đối chiếu slide: Ch.1, p.22","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q039","chapter":1,"number":39,"question":"Which model group includes T5 and BART?\nNhóm mô hình nào gồm T5 và BART?","options":[{"id":"LLM300-Q039-A","text":"Encoder-decoder models\nMô hình mã hóa-giải mã"},{"id":"LLM300-Q039-B","text":"Bag-of-words models\nMô hình túi từ"},{"id":"LLM300-Q039-C","text":"Decoder-only models\nMô hình chỉ có bộ giải mã"},{"id":"LLM300-Q039-D","text":"Encoder-only models\nMô hình chỉ có bộ mã hóa"}],"correctOptionId":"LLM300-Q039-A","explanation":"Explanation (EN): GPT belongs to the decoder-only Transformer family and is oriented toward text generation. BERT is an encoder-only model for language representations; T5/BART use encoder–decoder structures.\nGiải thích (VI): GPT thuộc họ Transformer decoder-only, thiên về tạo sinh văn bản. BERT thuộc nhóm encoder-only để biểu diễn và hiểu ngôn ngữ; T5/BART dùng kiến trúc encoder–decoder.\nSlide reference / Đối chiếu slide: Ch.1, p.12; Ch.2, pp.27–28","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q040","chapter":3,"number":40,"question":"A prompt is changed for a new reader, but the file is unchanged. What may change?\nPrompt thay đổi cho người đọc mới nhưng tệp không thay đổi. Điều gì có thể thay đổi?","options":[{"id":"LLM300-Q040-A","text":"The focus and detail of the reply\nTrọng tâm và mức độ chi tiết của câu trả lời"},{"id":"LLM300-Q040-B","text":"The figures in the original file\nSố liệu trong tệp gốc"},{"id":"LLM300-Q040-C","text":"The number of training examples\nSố lượng ví dụ huấn luyện"},{"id":"LLM300-Q040-D","text":"The model's base architecture\nKiến trúc cơ sở mô hình"}],"correctOptionId":"LLM300-Q040-A","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q041","chapter":3,"number":41,"question":"Which framework stands for Role, Context, Task and Format?\nKhung nào viết tắt của Role, Context, Task và Format?","options":[{"id":"LLM300-Q041-A","text":"BAB\nBAB"},{"id":"LLM300-Q041-B","text":"TAG\nTAG"},{"id":"LLM300-Q041-C","text":"RCTF\nRCTF"},{"id":"LLM300-Q041-D","text":"RACI\nRACI"}],"correctOptionId":"LLM300-Q041-C","explanation":"Explanation (EN): The RCTF structure states Role (perspective), Context (background), Task (required operation) and Format (output structure). Assigning a role does not change source facts or model weights.\nGiải thích (VI): RCTF gồm Role (vai trò/góc nhìn), Context (bối cảnh), Task (nhiệm vụ) và Format (cấu trúc đầu ra). Gán vai trò không thay đổi dữ kiện nguồn hoặc trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.3, pp.16–23","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q042","chapter":1,"number":42,"question":"For a 3-gram model, how many earlier words are used to predict a word?\nMô hình 3-gram dùng bao nhiêu từ trước đó để dự đoán một từ?","options":[{"id":"LLM300-Q042-A","text":"Two earlier words\nHai từ đứng trước"},{"id":"LLM300-Q042-B","text":"One earlier word\nMột từ đứng trước"},{"id":"LLM300-Q042-C","text":"Three earlier words\nBa từ đứng trước"},{"id":"LLM300-Q042-D","text":"Four earlier words\nBốn từ đứng trước"}],"correctOptionId":"LLM300-Q042-A","explanation":"Explanation (EN): An N-gram uses a limited preceding context: an N-gram sequence contains N consecutive words, and a next-word prediction conditions on N−1 previous words. In a sentence of m words, there are m −N+1 overlapping N-grams.\nGiải thích (VI): N-gram dùng ngữ cảnh trước có giới hạn: một nhóm gồm N từ liên tiếp và việc đoán từ tiếp theo dựa vào N−1 từ trước. Câu có m từ tạo được m−N+1 nhóm N-gram chồng lấp.\nSlide reference / Đối chiếu slide: Ch.1, pp.6–9","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q043","chapter":3,"number":43,"question":"What does assigning the role of an auditor mainly change?\nViệc giao vai trò kiểm toán viên chủ yếu làm thay đổi điều gì?","options":[{"id":"LLM300-Q043-A","text":"The view and focus of the answer\nGóc nhìn và trọng tâm câu trả lời"},{"id":"LLM300-Q043-B","text":"The facts in the source file\nCác sự kiện trong tệp nguồn"},{"id":"LLM300-Q043-C","text":"The legal status of the bank\nTư cách pháp lý ngân hàng"},{"id":"LLM300-Q043-D","text":"The model's stored parameters\nTham số đã lưu của mô hình"}],"correctOptionId":"LLM300-Q043-A","explanation":"Explanation (EN): The RCTF structure states Role (perspective), Context (background), Task (required operation) and Format (output structure). Assigning a role does not change source facts or model weights.\nGiải thích (VI): RCTF gồm Role (vai trò/góc nhìn), Context (bối cảnh), Task (nhiệm vụ) và Format (cấu trúc đầu ra). Gán vai trò không thay đổi dữ kiện nguồn hoặc trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.3, pp.16–23","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q044","chapter":1,"number":44,"question":"What is fine-tuning mainly used for?\nFine-tuning chủ yếu dùng để làm gì?","options":[{"id":"LLM300-Q044-A","text":"Adapting a trained model to a task\nĐiều chỉnh mô hình đã huấn luyện cho nhiệm vụ"},{"id":"LLM300-Q044-B","text":"Stopping every source of bias\nChặn mọi nguồn thiên lệch"},{"id":"LLM300-Q044-C","text":"Turning all files into images\nChuyển mọi tệp thành ảnh"},{"id":"LLM300-Q044-D","text":"Deleting the whole neural network\nXóa toàn bộ mạng nơ-ron"}],"correctOptionId":"LLM300-Q044-A","explanation":"Explanation (EN): Fine-tuning adjusts a pre-trained model for a target task, typically through training on specialized examples. Prompting instead changes the instructions without directly optimizing the model weights.\nGiải thích (VI): Fine-tuning điều chỉnh mô hình đã tiền huấn luyện cho nhiệm vụ đích bằng các ví dụ chuyên biệt. Prompting thay đổi chỉ dẫn mà không trực tiếp tối ưu trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.1, p.26; Ch.2, p.47","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q045","chapter":2,"number":45,"question":"What is the purpose of the model's context window?\nMục đích của cửa sổ ngữ cảnh của mô hình là gì?","options":[{"id":"LLM300-Q045-A","text":"Limit the text it can use at once\nGiới hạn lượng văn bản có thể dùng cùng lúc"},{"id":"LLM300-Q045-B","text":"Limit the number of bank employees\nGiới hạn số nhân viên ngân hàng"},{"id":"LLM300-Q045-C","text":"Fix the length of every training run\nCố định độ dài mọi lần huấn luyện"},{"id":"LLM300-Q045-D","text":"Decide a customer's credit score\nQuyết định điểm tín dụng khách hàng"}],"correctOptionId":"LLM300-Q045-A","explanation":"Explanation (EN): A context window limits how much information the model can process in one interaction. More text may help, but also increases processing demands and does not ensure every important fact is noticed.\nGiải thích (VI): Cửa sổ ngữ cảnh giới hạn lượng thông tin mô hình xử lý trong một lần. Văn bản dài hơn có thể hữu ích nhưng tăng nhu cầu tính toán và không bảo đảm mô hình nhận ra mọi chi tiết quan trọng.\nSlide reference / Đối chiếu slide: Ch.2, pp.18–20; Ch.3, p.7","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q046","chapter":1,"number":46,"question":"A model does well on translation and then on a new text task. What does this show?\nMột mô hình làm tốt dịch thuật rồi một nhiệm vụ văn bản mới. Điều này cho thấy gì?","options":[{"id":"LLM300-Q046-A","text":"A change in user accounts\nThay đổi tài khoản người dùng"},{"id":"LLM300-Q046-B","text":"Generalization across tasks\nKhái quát hóa giữa các nhiệm vụ"},{"id":"LLM300-Q046-C","text":"A smaller token limit\nGiới hạn token nhỏ hơn"},{"id":"LLM300-Q046-D","text":"A fixed output template\nMẫu định dạng đầu ra cố định"}],"correctOptionId":"LLM300-Q046-B","explanation":"Explanation (EN): Generalization means applying patterns and abilities learned during training to new inputs or tasks, not simply repeating memorized outputs.\nGiải thích (VI): Khái quát hóa là áp dụng mẫu và năng lực đã học cho dữ liệu hoặc nhiệm vụ mới, chứ không phải chỉ lặp lại câu đã ghi nhớ.\nSlide reference / Đối chiếu slide: Ch.1, p.22","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q047","chapter":4,"number":47,"question":"What should staff do when an LLM gives an uncertain legal answer?\nNhân viên nên làm gì khi LLM đưa ra câu trả lời pháp lý chưa chắc chắn?","options":[{"id":"LLM300-Q047-A","text":"Check the rule and ask a qualified reviewer\nKiểm tra quy định và hỏi người có chuyên môn"},{"id":"LLM300-Q047-B","text":"Accept it as a final legal decision\nChấp nhận như kết luận pháp lý cuối cùng"},{"id":"LLM300-Q047-C","text":"Raise randomness until it sounds clear\nTăng độ ngẫu nhiên đến khi nghe rõ ràng"},{"id":"LLM300-Q047-D","text":"Delete the source regulation\nXóa văn bản quy định nguồn"}],"correctOptionId":"LLM300-Q047-A","explanation":"Explanation (EN): An LLM can compare documents with rules and highlight possible compliance or legal gaps, but qualified reviewers must check authoritative regulations and make final judgments.\nGiải thích (VI): LLM có thể đối chiếu tài liệu với quy định và cảnh báo khoảng trống tuân thủ hoặc pháp lý, nhưng người có chuyên môn phải kiểm tra văn bản có thẩm quyền và ra kết luận cuối.\nSlide reference / Đối chiếu slide: Ch.4, pp.30–32","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q048","chapter":1,"number":48,"question":"Why are smaller or cheaper models worth studying?\nVì sao nên nghiên cứu các mô hình nhỏ hơn hoặc rẻ hơn?","options":[{"id":"LLM300-Q048-A","text":"They always know more than larger models\nLuôn biết nhiều hơn mô hình lớn"},{"id":"LLM300-Q048-B","text":"They remove all requirements for testing\nLoại bỏ toàn bộ kiểm thử"},{"id":"LLM300-Q048-C","text":"They can reduce operating cost for suitable tasks\nGiảm chi phí vận hành cho nhiệm vụ phù hợp"},{"id":"LLM300-Q048-D","text":"They make private records public by default\nMặc định công khai hồ sơ cá nhân"}],"correctOptionId":"LLM300-Q048-C","explanation":"Explanation (EN): Model scale involves parameters, training tokens, compute and energy. Larger systems can be costly and do not automatically outperform smaller models on every task, so suitability and evaluation matter.\nGiải thích (VI): Quy mô mô hình liên quan đến tham số, token huấn luyện, năng lực tính toán và năng lượng. Mô hình lớn tốn kém và không tự động tốt hơn ở mọi tác vụ; cần xét tính phù hợp và đánh giá.\nSlide reference / Đối chiếu slide: Ch.1, pp.15–18, 30–31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q049","chapter":3,"number":49,"question":"What should be changed during a careful prompt test?\nTrong quá trình kiểm thử prompt cẩn thận, nên thay đổi điều gì?","options":[{"id":"LLM300-Q049-A","text":"One part at a time\nMột thành phần tại một thời điểm"},{"id":"LLM300-Q049-B","text":"Every setting at the same time\nMọi thiết lập cùng lúc"},{"id":"LLM300-Q049-C","text":"All correct answers into errors\nBiến tất cả câu đúng thành sai"},{"id":"LLM300-Q049-D","text":"The original data after each run\nThay đổi dữ liệu gốc sau mỗi lần chạy"}],"correctOptionId":"LLM300-Q049-A","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q050","chapter":2,"number":50,"question":"What is the main aim of RLHF?\nMục tiêu chính của RLHF là gì?","options":[{"id":"LLM300-Q050-A","text":"Give a model access to bank accounts\nCho mô hình truy cập tài khoản ngân hàng"},{"id":"LLM300-Q050-B","text":"Make replies better fit human feedback\nLàm câu trả lời phù hợp hơn với phản hồi con người"},{"id":"LLM300-Q050-C","text":"Make all answers exactly the same\nLàm mọi đáp án giống hệt nhau"},{"id":"LLM300-Q050-D","text":"Remove the need for any training\nKhông cần huấn luyện gì nữa"}],"correctOptionId":"LLM300-Q050-B","explanation":"Explanation (EN): Reinforcement Learning from Human Feedback uses human preference judgments and a reward model to align model responses with preferred behavior. Preference alignment does not guarantee that every fact is true.\nGiải thích (VI): RLHF dùng đánh giá sở thích con người và reward model để điều chỉnh câu trả lời theo hành vi được ưa thích. Phù hợp sở thích không bảo đảm mọi thông tin đều đúng.\nSlide reference / Đối chiếu slide: Ch.2, p.48","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q051","chapter":3,"number":51,"question":"What keeps reports in a similar layout each month?\nĐiều gì giúp báo cáo giữ bố cục tương tự mỗi tháng?","options":[{"id":"LLM300-Q051-A","text":"A new random format each month\nMỗi tháng dùng một định dạng ngẫu nhiên mới"},{"id":"LLM300-Q051-B","text":"A fixed prompt template\nMẫu prompt cố định"},{"id":"LLM300-Q051-C","text":"No instructions about the output\nKhông có hướng dẫn về đầu ra"},{"id":"LLM300-Q051-D","text":"A different model for each figure\nMỗi số liệu dùng một mô hình khác"}],"correctOptionId":"LLM300-Q051-B","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q052","chapter":3,"number":52,"question":"What happens if the output token limit is too small?\nĐiều gì xảy ra nếu giới hạn token đầu ra quá nhỏ?","options":[{"id":"LLM300-Q052-A","text":"All facts are checked by humans\nMọi dữ kiện được con người kiểm tra"},{"id":"LLM300-Q052-B","text":"The answer may stop too early\nCâu trả lời có thể dừng quá sớm"},{"id":"LLM300-Q052-C","text":"The input file becomes encrypted\nTệp đầu vào được mã hóa"},{"id":"LLM300-Q052-D","text":"The model must learn new weights\nMô hình phải học trọng số mới"}],"correctOptionId":"LLM300-Q052-B","explanation":"Explanation (EN): Output length or max output tokens caps how much text can be generated. A short cap may truncate the answer; generation also stops on an end token.\nGiải thích (VI): Độ dài đầu ra hoặc max output tokens giới hạn lượng văn bản tạo ra. Giới hạn thấp có thể làm câu trả lời bị cắt; token kết thúc cũng có thể dừng việc tạo sinh.\nSlide reference / Đối chiếu slide: Ch.3, pp.11–12; Ch.2, p.44","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q053","chapter":2,"number":53,"question":"What does a reward model in RLHF try to estimate?\nReward model trong RLHF cố gắng ước lượng điều gì?","options":[{"id":"LLM300-Q053-A","text":"The cost of a printed page\nChi phí một trang in"},{"id":"LLM300-Q053-B","text":"The user's internet connection speed\nTốc độ Internet người dùng"},{"id":"LLM300-Q053-C","text":"Which replies people prefer\nCâu trả lời được con người ưa thích"},{"id":"LLM300-Q053-D","text":"How many branches a bank has\nSố lượng chi nhánh ngân hàng"}],"correctOptionId":"LLM300-Q053-C","explanation":"Explanation (EN): Reinforcement Learning from Human Feedback uses human preference judgments and a reward model to align model responses with preferred behavior. Preference alignment does not guarantee that every fact is true.\nGiải thích (VI): RLHF dùng đánh giá sở thích con người và reward model để điều chỉnh câu trả lời theo hành vi được ưa thích. Phù hợp sở thích không bảo đảm mọi thông tin đều đúng.\nSlide reference / Đối chiếu slide: Ch.2, p.48","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q054","chapter":4,"number":54,"question":"Which risk covers system failures and human process errors?\nRủi ro nào bao gồm sự cố hệ thống và sai sót quy trình của con người?","options":[{"id":"LLM300-Q054-A","text":"Credit risk\nRủi ro tín dụng"},{"id":"LLM300-Q054-B","text":"Exchange-rate risk\nRủi ro tỷ giá"},{"id":"LLM300-Q054-C","text":"Market risk\nRủi ro thị trường"},{"id":"LLM300-Q054-D","text":"Operational risk\nRủi ro hoạt động"}],"correctOptionId":"LLM300-Q054-D","explanation":"Explanation (EN): Operational risk includes failure of systems, procedures and people. It is separate from default risk (credit) and fluctuations in market prices or exchange rates.\nGiải thích (VI): Rủi ro hoạt động bao gồm sự cố hệ thống, quy trình và sai sót con người; khác rủi ro không trả nợ và biến động giá thị trường, tỷ giá.\nSlide reference / Đối chiếu slide: Ch.4, p.26","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q055","chapter":4,"number":55,"question":"How can LLMs help with fraud review?\nLLM có thể hỗ trợ rà soát gian lận như thế nào?","options":[{"id":"LLM300-Q055-A","text":"Hide all warnings from risk staff\nẨn mọi cảnh báo khỏi nhân viên rủi ro"},{"id":"LLM300-Q055-B","text":"Explain unusual transactions in clear words\nDiễn giải giao dịch bất thường bằng ngôn ngữ rõ ràng"},{"id":"LLM300-Q055-C","text":"Guarantee that no fraud can occur\nBảo đảm không bao giờ xảy ra gian lận"},{"id":"LLM300-Q055-D","text":"Remove the need for transaction data\nKhông cần dữ liệu giao dịch"}],"correctOptionId":"LLM300-Q055-B","explanation":"Explanation (EN): An LLM can describe suspicious patterns and explain alerts from fraud-detection models. A warning is not proof of fraud, so analysts must validate cases before taking consequential actions.\nGiải thích (VI): LLM có thể mô tả mẫu giao dịch đáng ngờ và giải thích cảnh báo của mô hình phát hiện gian lận. Cảnh báo không chứng minh chắc chắn có gian lận; nhân viên phải xác minh trước quyết định có tác động lớn.\nSlide reference / Đối chiếu slide: Ch.4, pp.33–39","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q056","chapter":2,"number":56,"question":"What does a token embedding provide?\nToken embedding cung cấp điều gì?","options":[{"id":"LLM300-Q056-A","text":"A list of bank interest rates\nDanh sách lãi suất ngân hàng"},{"id":"LLM300-Q056-B","text":"A password for a document\nMật khẩu tài liệu"},{"id":"LLM300-Q056-C","text":"A numeric vector for a token\nVectơ số của token"},{"id":"LLM300-Q056-D","text":"A rule to delete all tokens\nQuy tắc xóa toàn bộ token"}],"correctOptionId":"LLM300-Q056-C","explanation":"Explanation (EN): An embedding represents a word or token as a numerical vector learned from data, helping the model work with language representations rather than raw characters alone.\nGiải thích (VI): Embedding biểu diễn từ hoặc token dưới dạng vectơ số học được từ dữ liệu, giúp mô hình xử lý các biểu diễn ngôn ngữ thay vì chỉ ký tự thô.\nSlide reference / Đối chiếu slide: Ch.2, pp.32–33; Ch.1, p.5","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q057","chapter":3,"number":57,"question":"For varied new ideas, which temperature setting is more suitable?\nMuốn có nhiều ý tưởng mới đa dạng, nên dùng temperature nào?","options":[{"id":"LLM300-Q057-A","text":"A higher temperature\nTemperature cao hơn"},{"id":"LLM300-Q057-B","text":"A fixed one-word response\nCâu trả lời cố định một từ"},{"id":"LLM300-Q057-C","text":"A lower temperature\nTemperature thấp hơn"},{"id":"LLM300-Q057-D","text":"No task description\nKhông mô tả nhiệm vụ"}],"correctOptionId":"LLM300-Q057-A","explanation":"Explanation (EN): Temperature controls randomness in token selection. A lower value is usually better for consistent extraction; a higher value produces more diverse ideas, but neither guarantees truth.\nGiải thích (VI): Temperature điều chỉnh độ ngẫu nhiên khi chọn token. Giá trị thấp thường phù hợp để trích xuất ổn định; giá trị cao tạo ý tưởng đa dạng hơn nhưng không bảo đảm độ đúng.\nSlide reference / Đối chiếu slide: Ch.3, pp.11–14","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q058","chapter":1,"number":58,"question":"Which setting uses no worked task examples in a prompt?\nCách thiết lập nào không cung cấp ví dụ giải mẫu trong prompt?","options":[{"id":"LLM300-Q058-A","text":"One-shot learning\nHọc one-shot"},{"id":"LLM300-Q058-B","text":"Model fine-tuning\nFine-tuning mô hình"},{"id":"LLM300-Q058-C","text":"Zero-shot learning\nHọc zero-shot"},{"id":"LLM300-Q058-D","text":"Few-shot learning\nHọc few-shot"}],"correctOptionId":"LLM300-Q058-C","explanation":"Explanation (EN): Zero-shot prompting asks the model to perform a task without worked examples in the prompt; the instruction itself still describes the task.\nGiải thích (VI): Zero-shot yêu cầu mô hình làm nhiệm vụ mà không đưa ví dụ giải mẫu trong prompt; chỉ dẫn vẫn cần nêu nhiệm vụ.\nSlide reference / Đối chiếu slide: Ch.1, p.24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q059","chapter":1,"number":59,"question":"Which statement about large LLMs is most accurate?\nPhát biểu nào về LLM lớn là chính xác nhất?","options":[{"id":"LLM300-Q059-A","text":"Training may need major computing power\nHuấn luyện có thể cần năng lực tính toán lớn"},{"id":"LLM300-Q059-B","text":"All large models are free to train\nMọi mô hình lớn đều được huấn luyện miễn phí"},{"id":"LLM300-Q059-C","text":"More size removes every error\nMô hình lớn loại bỏ mọi lỗi"},{"id":"LLM300-Q059-D
