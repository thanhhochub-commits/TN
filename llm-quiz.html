ra"},{"id":"LLM300-Q259-B","text":"A responsible person checks the final draft\nNgười chịu trách nhiệm rà soát bản dự thảo"},{"id":"LLM300-Q259-C","text":"The customer becomes liable without notice\nKhách hàng tự chịu trách nhiệm không cần thông báo"},{"id":"LLM300-Q259-D","text":"The model signs the notice for the bank\nMô hình ký thông báo thay ngân hàng"}],"correctOptionId":"LLM300-Q259-B","explanation":"Explanation (EN): Human oversight keeps consequential credit, reporting and customer decisions with authorized staff. An AI draft or recommendation must be reviewed before final approval or sending.\nGiải thích (VI): Giám sát con người bảo đảm quyết định tín dụng, báo cáo và hỗ trợ khách hàng quan trọng thuộc nhân sự được ủy quyền. Bản nháp hoặc khuyến nghị AI phải được kiểm tra trước khi phê duyệt hoặc gửi.\nSlide reference / Đối chiếu slide: Ch.4, pp.8, 19, 27, 32","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q260","chapter":3,"number":260,"question":"What is self-consistency prompting?\nSelf-consistency prompting là gì?","options":[{"id":"LLM300-Q260-A","text":"Limiting the model to a single token\nGiới hạn mô hình chỉ tạo một token"},{"id":"LLM300-Q260-B","text":"Voting across multiple reasoning paths\nBỏ phiếu qua nhiều hướng suy luận"},{"id":"LLM300-Q260-C","text":"Reducing every problem to one fixed rule\nQuy mọi vấn đề về quy tắc cố định"},{"id":"LLM300-Q260-D","text":"Skipping any check of intermediate results\nBỏ mọi kiểm tra kết quả trung gian"}],"correctOptionId":"LLM300-Q260-B","explanation":"Explanation (EN): Self-checking reviews generated output for mistakes or missing evidence. Self-consistency compares several independent reasoning results, which may improve robustness but uses additional computation.\nGiải thích (VI): Tự kiểm tra rà soát đầu ra để tìm lỗi hoặc thiếu chứng cứ. Self-consistency so sánh nhiều kết quả suy luận để tăng độ vững nhưng cần thêm tài nguyên tính toán.\nSlide reference / Đối chiếu slide: Ch.3, pp.24, 30–32, 37","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q261","chapter":3,"number":261,"question":"What is prompt injection?\nPrompt injection là gì?","options":[{"id":"LLM300-Q261-A","text":"A harmless spelling mistake in source text\nLỗi chính tả vô hại trong tài liệu"},{"id":"LLM300-Q261-B","text":"Malicious instructions embedded in input data\nChỉ dẫn độc hại cài trong dữ liệu đầu vào"},{"id":"LLM300-Q261-C","text":"A normal request for an account statement\nYêu cầu sao kê tài khoản thông thường"},{"id":"LLM300-Q261-D","text":"A manual correction to the answer format\nSửa thủ công định dạng câu trả lời"}],"correctOptionId":"LLM300-Q261-B","explanation":"Explanation (EN): Prompt injection places malicious instructions inside less-trusted data or outside files. Separate that content from system instructions, restrict tool privileges and review external material.\nGiải thích (VI): Prompt injection cài chỉ dẫn độc hại vào dữ liệu ít đáng tin hoặc tệp bên ngoài. Cần tách nội dung này khỏi chỉ dẫn hệ thống, hạn chế quyền công cụ và rà soát tài liệu ngoài.\nSlide reference / Đối chiếu slide: Ch.3, p.39","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q262","chapter":1,"number":262,"question":"A model first learns general language patterns from broad text data. What is it?\nMô hình đầu tiên học mẫu ngôn ngữ tổng quát từ dữ liệu văn bản rộng. Đó là gì?","options":[{"id":"LLM300-Q262-A","text":"A model trained on broad text in advance\nMô hình được học trước trên văn bản đa dạng"},{"id":"LLM300-Q262-B","text":"A model that requires no language examples\nMô hình không cần ví dụ ngôn ngữ"},{"id":"LLM300-Q262-C","text":"A model fitted only to a single new customer\nMô hình chỉ điều chỉnh cho một khách hàng"},{"id":"LLM300-Q262-D","text":"A model containing only hand-written rules\nMô hình chỉ chứa quy tắc viết tay"}],"correctOptionId":"LLM300-Q262-A","explanation":"Explanation (EN): Pre-training learns broad language patterns from large text data, including self-supervised prediction objectives. It precedes specialization and does not mean memorizing only the current chat.\nGiải thích (VI): Tiền huấn luyện học mẫu ngôn ngữ tổng quát từ văn bản lớn, có thể dùng mục tiêu dự đoán tự giám sát. Giai đoạn này diễn ra trước điều chỉnh chuyên biệt, không chỉ ghi nhớ cuộc hội thoại hiện tại.\nSlide reference / Đối chiếu slide: Ch.1, p.14; Ch.2, pp.45–47","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q263","chapter":3,"number":263,"question":"What is prompt engineering?\nPrompt engineering là gì?","options":[{"id":"LLM300-Q263-A","text":"Training every model parameter from scratch\nHuấn luyện mọi tham số từ đầu"},{"id":"LLM300-Q263-B","text":"Buying larger hardware for model inference\nMua phần cứng lớn hơn để suy luận"},{"id":"LLM300-Q263-C","text":"Replacing the application user interface\nThay giao diện ứng dụng"},{"id":"LLM300-Q263-D","text":"Designing instructions for more useful outputs\nThiết kế hướng dẫn cho đầu ra hữu ích hơn"}],"correctOptionId":"LLM300-Q263-D","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q264","chapter":3,"number":264,"question":"The candidate pool contains tokens until cumulative probability reaches a threshold. What method is this?\nTập ứng viên chứa token cho đến khi xác suất tích lũy đạt ngưỡng. Phương pháp này là gì?","options":[{"id":"LLM300-Q264-A","text":"Nucleus sampling based on cumulative mass\nLấy mẫu nucleus theo xác suất tích lũy"},{"id":"LLM300-Q264-B","text":"Selecting only words that appear in the PDF\nChỉ chọn từ trong PDF"},{"id":"LLM300-Q264-C","text":"Restricting results to a fixed token count\nGiới hạn kết quả vào số token cố định"},{"id":"LLM300-Q264-D","text":"Sorting candidate tokens by their text length\nSắp token theo độ dài"}],"correctOptionId":"LLM300-Q264-A","explanation":"Explanation (EN): Top-P (nucleus sampling) chooses from the smallest candidate set whose cumulative probability reaches a selected threshold, rather than a fixed number of tokens.\nGiải thích (VI): Top-P (lấy mẫu nucleus) chọn trong tập ứng viên nhỏ nhất có tổng xác suất tích lũy đạt ngưỡng đặt trước, không phải số token cố định.\nSlide reference / Đối chiếu slide: Ch.3, p.14","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q265","chapter":2,"number":265,"question":"The same words appear in different orders in two sentences. What helps distinguish them?\nCác từ giống nhau xuất hiện theo thứ tự khác nhau trong hai câu. Điều gì giúp phân biệt?","options":[{"id":"LLM300-Q265-A","text":"The color selected for the chat interface\nMàu giao diện chat"},{"id":"LLM300-Q265-B","text":"The country where the processor was made\nQuốc gia sản xuất bộ xử lý"},{"id":"LLM300-Q265-C","text":"Information about each token's position\nThông tin vị trí của từng token"},{"id":"LLM300-Q265-D","text":"The date when the account was first opened\nNgày mở tài khoản lần đầu"}],"correctOptionId":"LLM300-Q265-C","explanation":"Explanation (EN): Positional encoding supplies information about token order. Word order can change sentence meaning even when the same words are present.\nGiải thích (VI): Mã hóa vị trí bổ sung thông tin thứ tự token. Trật tự từ có thể thay đổi nghĩa câu dù các từ giống nhau.\nSlide reference / Đối chiếu slide: Ch.2, p.34","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q266","chapter":3,"number":266,"question":"What does model misuse mean?\nLạm dụng mô hình (model misuse) nghĩa là gì?","options":[{"id":"LLM300-Q266-A","text":"An improvement in response auditability\nCải thiện khả năng kiểm toán câu trả lời"},{"id":"LLM300-Q266-B","text":"A missing file in a local document folder\nThiếu tệp trong thư mục cục bộ"},{"id":"LLM300-Q266-C","text":"A numerical error caused by low precision\nLỗi số học do độ chính xác thấp"},{"id":"LLM300-Q266-D","text":"Harmful use of otherwise permitted abilities\nDùng năng lực được phép vào mục đích gây hại"}],"correctOptionId":"LLM300-Q266-D","explanation":"Explanation (EN): Model misuse is the use of AI capabilities for harmful or unauthorized purposes. It differs from normal formatting or legitimate review requests.\nGiải thích (VI): Lạm dụng mô hình là dùng năng lực AI cho mục đích gây hại hoặc trái thẩm quyền; khác với yêu cầu định dạng hay rà soát hợp lệ.\nSlide reference / Đối chiếu slide: Ch.3, pp.38–40","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q267","chapter":1,"number":267,"question":"Which claim about model scale is safest?\nNhận định nào về quy mô mô hình là an toàn nhất?","options":[{"id":"LLM300-Q267-A","text":"Larger models need no quality evaluation\nMô hình lớn không cần đánh giá"},{"id":"LLM300-Q267-B","text":"Model size directly certifies answer truth\nQuy mô chứng nhận câu trả lời đúng"},{"id":"LLM300-Q267-C","text":"Greater size does not ensure every improvement\nQuy mô lớn không bảo đảm cải thiện mọi mặt"},{"id":"LLM300-Q267-D","text":"Every metric must rise as parameters rise\nMọi chỉ tiêu đều phải tăng theo tham số"}],"correctOptionId":"LLM300-Q267-C","explanation":"Explanation (EN): Model scale involves parameters, training tokens, compute and energy. Larger systems can be costly and do not automatically outperform smaller models on every task, so suitability and evaluation matter.\nGiải thích (VI): Quy mô mô hình liên quan đến tham số, token huấn luyện, năng lực tính toán và năng lượng. Mô hình lớn tốn kém và không tự động tốt hơn ở mọi tác vụ; cần xét tính phù hợp và đánh giá.\nSlide reference / Đối chiếu slide: Ch.1, pp.15–18, 30–31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q268","chapter":2,"number":268,"question":"What does a multimodal model accept?\nMô hình đa phương thức chấp nhận đầu vào nào?","options":[{"id":"LLM300-Q268-A","text":"Operating only on plain text sequences\nChỉ hoạt động với chuỗi văn bản thuần"},{"id":"LLM300-Q268-B","text":"Guaranteeing accurate chart interpretation\nBảo đảm diễn giải biểu đồ chính xác"},{"id":"LLM300-Q268-C","text":"Processing multiple forms of input data\nXử lý nhiều loại dữ liệu đầu vào"},{"id":"LLM300-Q268-D","text":"Automatically approving investment actions\nTự động duyệt đầu tư"}],"correctOptionId":"LLM300-Q268-C","explanation":"Explanation (EN): A multimodal AI system can accept or process more than one input type, such as text together with images. This capability does not by itself guarantee interpretation accuracy.\nGiải thích (VI): AI đa phương thức có thể xử lý nhiều loại đầu vào, như văn bản cùng hình ảnh. Năng lực này không tự bảo đảm phân tích luôn đúng.\nSlide reference / Đối chiếu slide: Ch.2, pp.18–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q269","chapter":2,"number":269,"question":"A Transformer examines different relationships between words in parallel. What is enabled?\nTransformer xem xét song song các mối quan hệ khác nhau giữa các từ. Điều gì được cho phép?","options":[{"id":"LLM300-Q269-A","text":"Several attention patterns in one layer\nNhiều kiểu attention trong một lớp"},{"id":"LLM300-Q269-B","text":"A single static rule for every token pair\nMột quy tắc cố định cho mọi cặp token"},{"id":"LLM300-Q269-C","text":"Unlimited memory without any constraints\nBộ nhớ vô hạn không ràng buộc"},{"id":"LLM300-Q269-D","text":"Direct access to every banking database\nTruy cập mọi cơ sở dữ liệu ngân hàng"}],"correctOptionId":"LLM300-Q269-A","explanation":"Explanation (EN): Self-attention measures relationships among tokens. Multiple attention heads can learn different relationships in parallel; a single head does not provide the same diversity.\nGiải thích (VI): Self-attention tính mối liên hệ giữa các token. Nhiều đầu attention học các kiểu quan hệ khác nhau song song; một đầu đơn lẻ không có cùng độ đa dạng biểu diễn.\nSlide reference / Đối chiếu slide: Ch.2, pp.35–37","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q270","chapter":3,"number":270,"question":"Why test with contradictory source data?\nVì sao thử nghiệm bằng dữ liệu nguồn mâu thuẫn?","options":[{"id":"LLM300-Q270-A","text":"Performance of the screen rendering engine\nHiệu suất bộ hiển thị màn hình"},{"id":"LLM300-Q270-B","text":"The accuracy of unrelated internet reports\nĐộ chính xác tin Internet không liên quan"},{"id":"LLM300-Q270-C","text":"Handling inconsistencies and edge cases\nKhả năng xử lý mâu thuẫn và trường hợp biên"},{"id":"LLM300-Q270-D","text":"Physical durability of computer hardware\nĐộ bền vật lý của phần cứng"}],"correctOptionId":"LLM300-Q270-C","explanation":"Explanation (EN): Evaluation checks model performance, failures and edge cases using test inputs, including inconsistent data. A convincing response should not replace actual verification.\nGiải thích (VI): Đánh giá kiểm tra hiệu năng, sai sót và trường hợp biên bằng dữ liệu thử, kể cả dữ liệu mâu thuẫn. Câu trả lời có vẻ thuyết phục không thay thế việc xác minh.\nSlide reference / Đối chiếu slide: Ch.3, pp.10, 24; Ch.4, p.32","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q271","chapter":3,"number":271,"question":"What is a useful rule for missing extraction fields?\nQuy tắc hữu ích với trường trích xuất bị thiếu là gì?","options":[{"id":"LLM300-Q271-A","text":"Leave the field blank or mark it missing\nĐể trống trường hoặc đánh dấu thiếu"},{"id":"LLM300-Q271-B","text":"Generate a plausible number without warning\nTự tạo số hợp lý không cảnh báo"},{"id":"LLM300-Q271-C","text":"Copy the principal amount into that field\nChép tiền gốc vào trường đó"},{"id":"LLM300-Q271-D","text":"Fill it using the market average rate\nDùng lãi suất trung bình thị trường"}],"correctOptionId":"LLM300-Q271-A","explanation":"Explanation (EN): Grounding bases claims and extracted fields on identifiable source material. When evidence is absent, state that fact or leave the field blank rather than inventing figures or citations.\nGiải thích (VI): Grounding yêu cầu khẳng định và trường trích xuất dựa trên nguồn xác định. Nếu không có bằng chứng, phải ghi thiếu hoặc để trống thay vì bịa số liệu hay trích dẫn.\nSlide reference / Đối chiếu slide: Ch.3, pp.35–37; Ch.4, p.10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q272","chapter":3,"number":272,"question":"What is a trade-off of self-consistency?\nSự đánh đổi của self-consistency là gì?","options":[{"id":"LLM300-Q272-A","text":"The size of the customer's verified balance\nQuy mô số dư khách hàng đã xác minh"},{"id":"LLM300-Q272-B","text":"The computation used for multiple outputs\nTài nguyên tính toán để tạo nhiều đầu ra"},{"id":"LLM300-Q272-C","text":"The number of physical bank documents\nSố tài liệu ngân hàng giấy"},{"id":"LLM300-Q272-D","text":"The number of permanent model parameters\nSố tham số cố định"}],"correctOptionId":"LLM300-Q272-B","explanation":"Explanation (EN): Self-checking reviews generated output for mistakes or missing evidence. Self-consistency compares several independent reasoning results, which may improve robustness but uses additional computation.\nGiải thích (VI): Tự kiểm tra rà soát đầu ra để tìm lỗi hoặc thiếu chứng cứ. Self-consistency so sánh nhiều kết quả suy luận để tăng độ vững nhưng cần thêm tài nguyên tính toán.\nSlide reference / Đối chiếu slide: Ch.3, pp.24, 30–32, 37","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q273","chapter":3,"number":273,"question":"What is reverse checking of AI output?\nKiểm tra ngược đầu ra AI là gì?","options":[{"id":"LLM300-Q273-A","text":"Automatically approving an unverified draft\nTự phê duyệt dự thảo chưa kiểm tra"},{"id":"LLM300-Q273-B","text":"Creating new values for empty input fields\nTạo giá trị mới cho trường trống"},{"id":"LLM300-Q273-C","text":"Changing the account's assigned risk score\nĐổi điểm rủi ro tài khoản"},{"id":"LLM300-Q273-D","text":"Reviewing an output for possible mistakes\nRà soát đầu ra để tìm sai sót"}],"correctOptionId":"LLM300-Q273-D","explanation":"Explanation (EN): Self-checking reviews generated output for mistakes or missing evidence. Self-consistency compares several independent reasoning results, which may improve robustness but uses additional computation.\nGiải thích (VI): Tự kiểm tra rà soát đầu ra để tìm lỗi hoặc thiếu chứng cứ. Self-consistency so sánh nhiều kết quả suy luận để tăng độ vững nhưng cần thêm tài nguyên tính toán.\nSlide reference / Đối chiếu slide: Ch.3, pp.24, 30–32, 37","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q274","chapter":1,"number":274,"question":"What role do demonstrations play in in-context learning?\nCác ví dụ minh họa đóng vai trò gì trong in-context learning?","options":[{"id":"LLM300-Q274-A","text":"It changes the underlying model architecture\nThay đổi kiến trúc mô hình nền"},{"id":"LLM300-Q274-B","text":"It accesses unpublished bank customer files\nTruy cập tệp khách hàng ngân hàng chưa công khai"},{"id":"LLM300-Q274-C","text":"It automatically retrains its full network\nTự huấn luyện lại toàn mạng"},{"id":"LLM300-Q274-D","text":"It infers the desired pattern from examples\nSuy ra mẫu mong muốn từ ví dụ"}],"correctOptionId":"LLM300-Q274-D","explanation":"Explanation (EN): Few-shot in-context learning supplies several demonstrations inside the prompt. The model infers the desired pattern from these examples without changing its permanent weights.\nGiải thích (VI): Few-shot cung cấp một số ví dụ ngay trong prompt. Mô hình suy ra cách làm từ ví dụ mà không thay đổi vĩnh viễn trọng số đã huấn luyện.\nSlide reference / Đối chiếu slide: Ch.1, pp.24–25; Ch.3, p.27","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q275","chapter":1,"number":275,"question":"What is a training token?\nTraining token là gì?","options":[{"id":"LLM300-Q275-A","text":"Text units processed during model training\nĐơn vị văn bản được xử lý trong huấn luyện"},{"id":"LLM300-Q275-B","text":"Individual processors installed on servers\nBộ xử lý riêng lẻ cài trên máy chủ"},{"id":"LLM300-Q275-C","text":"Encrypted keys stored by banking systems\nKhóa mã hóa trong ngân hàng"},{"id":"LLM300-Q275-D","text":"Finished reports reviewed by accountants\nBáo cáo cuối đã được kế toán viên duyệt"}],"correctOptionId":"LLM300-Q275-A","explanation":"Explanation (EN): Training tokens are text units processed when learning model parameters. Their count, alongside parameter count and computing resources, indicates training scale.\nGiải thích (VI): Token huấn luyện là các đơn vị văn bản được xử lý khi học tham số mô hình. Số token cùng số tham số và tài nguyên tính toán phản ánh quy mô huấn luyện.\nSlide reference / Đối chiếu slide: Ch.1, pp.15–17; Ch.2, p.31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q276","chapter":3,"number":276,"question":"What does max output tokens constrain?\nMax output tokens ràng buộc điều gì?","options":[{"id":"LLM300-Q276-A","text":"The number of documents in a folder\nSố lượng tài liệu trong thư mục"},{"id":"LLM300-Q276-B","text":"The size of the model's training corpus\nDung lượng tập dữ liệu huấn luyện"},{"id":"LLM300-Q276-C","text":"The count of GPUs installed in a rack\nSố GPU lắp trong giá máy"},{"id":"LLM300-Q276-D","text":"The maximum generated response length\nĐộ dài tối đa của câu trả lời tạo sinh"}],"correctOptionId":"LLM300-Q276-D","explanation":"Explanation (EN): Output length or max output tokens caps how much text can be generated. A short cap may truncate the answer; generation also stops on an end token.\nGiải thích (VI): Độ dài đầu ra hoặc max output tokens giới hạn lượng văn bản tạo ra. Giới hạn thấp có thể làm câu trả lời bị cắt; token kết thúc cũng có thể dừng việc tạo sinh.\nSlide reference / Đối chiếu slide: Ch.3, pp.11–12; Ch.2, p.44","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q277","chapter":3,"number":277,"question":"An API response stops after reaching an output token limit. Which setting caused this?\nPhản hồi API dừng vì đạt giới hạn token đầu ra. Thiết lập nào gây ra điều này?","options":[{"id":"LLM300-Q277-A","text":"The number of documents in a folder\nSố tài liệu trong thư mục"},{"id":"LLM300-Q277-B","text":"The size of the model's training corpus\nDung lượng dữ liệu huấn luyện mô hình"},{"id":"LLM300-Q277-C","text":"The count of GPUs installed in a rack\nSố GPU trong tủ máy chủ"},{"id":"LLM300-Q277-D","text":"The maximum generated response length\nĐộ dài tối đa của câu trả lời tạo sinh"}],"correctOptionId":"LLM300-Q277-D","explanation":"Explanation (EN): Output length or max output tokens caps how much text can be generated. A short cap may truncate the answer; generation also stops on an end token.\nGiải thích (VI): Độ dài đầu ra hoặc max output tokens giới hạn lượng văn bản tạo ra. Giới hạn thấp có thể làm câu trả lời bị cắt; token kết thúc cũng có thể dừng việc tạo sinh.\nSlide reference / Đối chiếu slide: Ch.3, pp.11–12; Ch.2, p.44","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q278","chapter":3,"number":278,"question":"Why apply least-privilege access to AI tools?\nVì sao áp dụng nguyên tắc quyền tối thiểu cho công cụ AI?","options":[{"id":"LLM300-Q278-A","text":"Share administrative passwords in prompts\nChia sẻ mật khẩu quản trị trong prompt"},{"id":"LLM300-Q278-B","text":"Give full write access to every database\nCấp quyền ghi mọi cơ sở dữ liệu"},{"id":"LLM300-Q278-C","text":"Allow only access essential for its task\nChỉ cho phép quyền thiết yếu để làm nhiệm vụ"},{"id":"LLM300-Q278-D","text":"Disable authentication for faster operation\nTắt xác thực để nhanh hơn"}],"correctOptionId":"LLM300-Q278-C","explanation":"Explanation (EN): Least-privilege access means granting users and tools only the permissions necessary for their jobs. Test on sample or separate data to avoid damaging live records.\nGiải thích (VI): Nguyên tắc quyền tối thiểu là chỉ cấp quyền cần thiết cho người dùng/công cụ. Cần thử trên dữ liệu mẫu hoặc bản sao để tránh làm hỏng dữ liệu đang vận hành.\nSlide reference / Đối chiếu slide: Ch.3, pp.38–39; Ch.4, p.20","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q279","chapter":3,"number":279,"question":"What is a purpose of standardized business prompts?\nMục đích của prompt nghiệp vụ tiêu chuẩn hóa là gì?","options":[{"id":"LLM300-Q279-A","text":"Permanent elimination of human involvement\nVĩnh viễn không có con người tham gia"},{"id":"LLM300-Q279-B","text":"Consistency of tone, terms and formatting\nNhất quán về giọng điệu, thuật ngữ và định dạng"},{"id":"LLM300-Q279-C","text":"Perfect prediction of market expectations\nDự đoán hoàn hảo kỳ vọng thị trường"},{"id":"LLM300-Q279-D","text":"Automatic approval of all legal obligations\nTự động duyệt mọi nghĩa vụ pháp lý"}],"correctOptionId":"LLM300-Q279-B","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q280","chapter":2,"number":280,"question":"What is a word embedding?\nWord embedding là gì?","options":[{"id":"LLM300-Q280-A","text":"A scanned picture containing printed words\nẢnh quét có chữ in"},{"id":"LLM300-Q280-B","text":"A table containing only punctuation marks\nBảng chỉ có dấu câu"},{"id":"LLM300-Q280-C","text":"A numerical vector representing a word\nVectơ số biểu diễn một từ"},{"id":"LLM300-Q280-D","text":"A password produced from user credentials\nMật khẩu sinh từ thông tin đăng nhập"}],"correctOptionId":"LLM300-Q280-C","explanation":"Explanation (EN): An embedding represents a word or token as a numerical vector learned from data, helping the model work with language representations rather than raw characters alone.\nGiải thích (VI): Embedding biểu diễn từ hoặc token dưới dạng vectơ số học được từ dữ liệu, giúp mô hình xử lý các biểu diễn ngôn ngữ thay vì chỉ ký tự thô.\nSlide reference / Đối chiếu slide: Ch.2, pp.32–33; Ch.1, p.5","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q281","chapter":1,"number":281,"question":"What is a potential environmental concern of very large models?\nVấn đề môi trường tiềm ẩn của mô hình rất lớn là gì?","options":[{"id":"LLM300-Q281-A","text":"The distance between a bank's local branches\nKhoảng cách giữa các chi nhánh"},{"id":"LLM300-Q281-B","text":"The cost of employee travel to meetings\nChi phí đi lại nhân viên"},{"id":"LLM300-Q281-C","text":"Changes to paper color during document printing\nMàu giấy in thay đổi"},{"id":"LLM300-Q281-D","text":"Energy use associated with heavy computation\nNăng lượng tiêu thụ do tính toán lớn"}],"correctOptionId":"LLM300-Q281-D","explanation":"Explanation (EN): Model scale involves parameters, training tokens, compute and energy. Larger systems can be costly and do not automatically outperform smaller models on every task, so suitability and evaluation matter.\nGiải thích (VI): Quy mô mô hình liên quan đến tham số, token huấn luyện, năng lực tính toán và năng lượng. Mô hình lớn tốn kém và không tự động tốt hơn ở mọi tác vụ; cần xét tính phù hợp và đánh giá.\nSlide reference / Đối chiếu slide: Ch.1, pp.15–18, 30–31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q282","chapter":4,"number":282,"question":"Why review generated SQL before execution?\nVì sao rà soát câu lệnh SQL do AI tạo trước khi thực thi?","options":[{"id":"LLM300-Q282-A","text":"Table names, field meanings and access scope\nTên bảng, ý nghĩa trường và phạm vi quyền truy cập"},{"id":"LLM300-Q282-B","text":"The background color of the database console\nMàu nền màn hình cơ sở dữ liệu"},{"id":"LLM300-Q282-C","text":"The font used in the chat's message bubbles\nPhông chữ bong bóng chat"},{"id":"LLM300-Q282-D","text":"The physical material of the storage drive\nChất liệu vật lý của ổ lưu trữ"}],"correctOptionId":"LLM300-Q282-A","explanation":"Explanation (EN): LLMs can assist with understanding, drafting, debugging and checking code, but generated code or SQL still needs verification of data structure and access permissions before execution.\nGiải thích (VI): LLM hỗ trợ hiểu, viết, sửa lỗi và kiểm tra mã nguồn; mã hoặc SQL tạo ra vẫn phải kiểm tra cấu trúc dữ liệu và quyền truy cập trước khi chạy.\nSlide reference / Đối chiếu slide: Ch.4, p.49","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q283","chapter":1,"number":283,"question":"Which item is usually part of pre-training data?\nThành phần nào thường có trong dữ liệu pre-training?","options":[{"id":"LLM300-Q283-A","text":"Encrypted banking passwords for customers\nMật khẩu ngân hàng đã mã hóa"},{"id":"LLM300-Q283-B","text":"Only manually rated model responses\nChỉ phản hồi mô hình được con người chấm"},{"id":"LLM300-Q283-C","text":"Only prompts from the current conversation\nChỉ prompt của hội thoại hiện tại"},{"id":"LLM300-Q283-D","text":"Text-based materials used for learning\nTài liệu văn bản dùng để học"}],"correctOptionId":"LLM300-Q283-D","explanation":"Explanation (EN): Pre-training learns broad language patterns from large text data, including self-supervised prediction objectives. It precedes specialization and does not mean memorizing only the current chat.\nGiải thích (VI): Tiền huấn luyện học mẫu ngôn ngữ tổng quát từ văn bản lớn, có thể dùng mục tiêu dự đoán tự giám sát. Giai đoạn này diễn ra trước điều chỉnh chuyên biệt, không chỉ ghi nhớ cuộc hội thoại hiện tại.\nSlide reference / Đối chiếu slide: Ch.1, p.14; Ch.2, pp.45–47","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q284","chapter":2,"number":284,"question":"What is a model's training-versus-inference distinction?\nPhân biệt training và inference của mô hình như thế nào?","options":[{"id":"LLM300-Q284-A","text":"Training displays chat windows; inference labels data\nHuấn luyện hiển thị cửa sổ chat; suy luận gán nhãn"},{"id":"LLM300-Q284-B","text":"Training uploads files; inference deletes databases\nHuấn luyện tải tệp; suy luận xóa cơ sở dữ liệu"},{"id":"LLM300-Q284-C","text":"Training learns parameters; inference uses them\nHuấn luyện học tham số; suy luận dùng tham số đó"},{"id":"LLM300-Q284-D","text":"Training grants credit; inference audits bank staff\nHuấn luyện cấp tín dụng; suy luận kiểm toán nhân viên"}],"correctOptionId":"LLM300-Q284-C","explanation":"Explanation (EN): Training updates model parameters from learning data, whereas inference applies those learned parameters to inputs to generate outputs.\nGiải thích (VI): Training cập nhật tham số mô hình từ dữ liệu học, còn inference dùng tham số đã học để xử lý đầu vào và tạo đầu ra.\nSlide reference / Đối chiếu slide: Ch.2, pp.44–48","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q285","chapter":3,"number":285,"question":"An assistant cannot find the interest rate in a source contract. How should it encode the field?\nTrợ lý không tìm thấy lãi suất trong hợp đồng nguồn. Nên điền trường này ra sao?","options":[{"id":"LLM300-Q285-A","text":"Generate a plausible number without warning\nBịa một con số có vẻ hợp lý"},{"id":"LLM300-Q285-B","text":"Fill it using the market average rate\nĐiền lãi suất trung bình thị trường"},{"id":"LLM300-Q285-C","text":"Copy the principal amount into that field\nChép số tiền gốc sang trường lãi suất"},{"id":"LLM300-Q285-D","text":"Leave the field blank or mark it missing\nĐể trống hoặc ghi thiếu dữ liệu"}],"correctOptionId":"LLM300-Q285-D","explanation":"Explanation (EN): Grounding bases claims and extracted fields on identifiable source material. When evidence is absent, state that fact or leave the field blank rather than inventing figures or citations.\nGiải thích (VI): Grounding yêu cầu khẳng định và trường trích xuất dựa trên nguồn xác định. Nếu không có bằng chứng, phải ghi thiếu hoặc để trống thay vì bịa số liệu hay trích dẫn.\nSlide reference / Đối chiếu slide: Ch.3, pp.35–37; Ch.4, p.10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q286","chapter":4,"number":286,"question":"Why maintain review logs for model-assisted work?\nVì sao duy trì nhật ký rà soát công việc có hỗ trợ mô hình?","options":[{"id":"LLM300-Q286-A","text":"Accountability and later verification\nTrách nhiệm giải trình và xác minh về sau"},{"id":"LLM300-Q286-B","text":"Guaranteed elimination of all process delays\nBảo đảm loại bỏ mọi chậm trễ"},{"id":"LLM300-Q286-C","text":"Unlimited retrieval of unrelated private data\nTruy xuất vô hạn dữ liệu riêng tư không liên quan"},{"id":"LLM300-Q286-D","text":"Automatic replacement of every employee role\nTự động thay thế mọi vai trò nhân viên"}],"correctOptionId":"LLM300-Q286-A","explanation":"Explanation (EN): An AI model provides support, but the institution must retain control, independent checking, audit records and accountability for important outcomes. Outsourcing does not transfer the bank’s final responsibility.\nGiải thích (VI): AI chỉ hỗ trợ; tổ chức phải duy trì quyền kiểm soát, kiểm tra độc lập, nhật ký kiểm toán và trách nhiệm giải trình đối với kết quả quan trọng. Thuê dịch vụ ngoài không chuyển hết trách nhiệm cuối cùng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.4, pp.19, 32, 52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q287","chapter":1,"number":287,"question":"Training uses extensive computing resources over a long period. Which concern follows?\nHuấn luyện dùng tài nguyên tính toán lớn trong thời gian dài. Mối lo ngại nào phát sinh?","options":[{"id":"LLM300-Q287-A","text":"Changes to paper color during document printing\nMàu giấy in thay đổi"},{"id":"LLM300-Q287-B","text":"Energy use associated with heavy computation\nNăng lượng tiêu thụ do tính toán lớn"},{"id":"LLM300-Q287-C","text":"The cost of employee travel to meetings\nChi phí đi lại nhân viên"},{"id":"LLM300-Q287-D","text":"The distance between a bank's local branches\nKhoảng cách giữa các chi nhánh"}],"correctOptionId":"LLM300-Q287-B","explanation":"Explanation (EN): Model scale involves parameters, training tokens, compute and energy. Larger systems can be costly and do not automatically outperform smaller models on every task, so suitability and evaluation matter.\nGiải thích (VI): Quy mô mô hình liên quan đến tham số, token huấn luyện, năng lực tính toán và năng lượng. Mô hình lớn tốn kém và không tự động tốt hơn ở mọi tác vụ; cần xét tính phù hợp và đánh giá.\nSlide reference / Đối chiếu slide: Ch.1, pp.15–18, 30–31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q288","chapter":1,"number":288,"question":"What is language generalization?\nKhả năng khái quát hóa ngôn ngữ là gì?","options":[{"id":"LLM300-Q288-A","text":"Removal of all task-specific instructions\nBỏ mọi chỉ dẫn riêng cho nhiệm vụ"},{"id":"LLM300-Q288-B","text":"Mandatory retraining for each user request\nPhải huấn luyện lại với mỗi yêu cầu"},{"id":"LLM300-Q288-C","text":"Perfect recollection of every seen sentence\nNhớ hoàn hảo mọi câu từng đọc"},{"id":"LLM300-Q288-D","text":"Transfer of learned ability to new tasks\nChuyển kỹ năng đã học sang nhiệm vụ mới"}],"correctOptionId":"LLM300-Q288-D","explanation":"Explanation (EN): Generalization means applying patterns and abilities learned during training to new inputs or tasks, not simply repeating memorized outputs.\nGiải thích (VI): Khái quát hóa là áp dụng mẫu và năng lực đã học cho dữ liệu hoặc nhiệm vụ mới, chứ không phải chỉ lặp lại câu đã ghi nhớ.\nSlide reference / Đối chiếu slide: Ch.1, p.22","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q289","chapter":3,"number":289,"question":"A draft credit analysis contains a fabricated customer figure. Which concern applies?\nDự thảo phân tích tín dụng có số liệu khách hàng bị bịa. Vấn đề nào phát sinh?","options":[{"id":"LLM300-Q289-A","text":"The model has verified the data independently\nMô hình đã tự xác minh dữ liệu"},{"id":"LLM300-Q289-B","text":"Decisions may rely on incorrect information\nQuyết định có thể dựa trên dữ liệu sai"},{"id":"LLM300-Q289-C","text":"Every user query must be publicly disclosed\nMọi yêu cầu phải được công khai"},{"id":"LLM300-Q289-D","text":"The document is automatically legally binding\nTài liệu tự có giá trị pháp lý"}],"correctOptionId":"LLM300-Q289-B","explanation":"Explanation (EN): Hallucination means plausible-sounding content is invented or unsupported by the source. It can mislead decisions, so missing information should be marked missing and critical claims checked.\nGiải thích (VI): Hallucination là nội dung nghe hợp lý nhưng bị bịa hoặc không có căn cứ trong nguồn. Nó có thể gây quyết định sai; phải ghi rõ phần thiếu và kiểm tra các khẳng định quan trọng.\nSlide reference / Đối chiếu slide: Ch.3, pp.34–37; Ch.4, p.10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q290","chapter":4,"number":290,"question":"What is the bank's responsibility when using a vendor model?\nTrách nhiệm của ngân hàng khi dùng mô hình bên cung cấp là gì?","options":[{"id":"LLM300-Q290-A","text":"Only the computer hardware manufacturer\nChỉ nhà sản xuất phần cứng"},{"id":"LLM300-Q290-B","text":"The bank and its authorized decision-makers\nNgân hàng và người ra quyết định được ủy quyền"},{"id":"LLM300-Q290-C","text":"No one because AI generated the suggestion\nKhông ai vì AI đã đề xuất"},{"id":"LLM300-Q290-D","text":"Only the software vendor in every situation\nChỉ nhà cung cấp phần mềm"}],"correctOptionId":"LLM300-Q290-B","explanation":"Explanation (EN): An AI model provides support, but the institution must retain control, independent checking, audit records and accountability for important outcomes. Outsourcing does not transfer the bank’s final responsibility.\nGiải thích (VI): AI chỉ hỗ trợ; tổ chức phải duy trì quyền kiểm soát, kiểm tra độc lập, nhật ký kiểm toán và trách nhiệm giải trình đối với kết quả quan trọng. Thuê dịch vụ ngoài không chuyển hết trách nhiệm cuối cùng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.4, pp.19, 32, 52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q291","chapter":2,"number":291,"question":"What is AGI intended to describe?\nAGI dùng để mô tả điều gì?","options":[{"id":"LLM300-Q291-A","text":"A text tokenizer for one specific language\nBộ tách token cho một ngôn ngữ"},{"id":"LLM300-Q291-B","text":"A graphics processor optimized for gaming\nGPU chuyên chơi game"},{"id":"LLM300-Q291-C","text":"Artificial general intelligence capabilities\nNăng lực trí tuệ nhân tạo tổng quát"},{"id":"LLM300-Q291-D","text":"A rule engine for a fixed banking workflow\nCông cụ quy tắc ngân hàng cố định"}],"correctOptionId":"LLM300-Q291-C","explanation":"Explanation (EN): Artificial General Intelligence refers to broad intelligence able to learn or reason across many kinds of work, rather than a narrow fixed-rule system.\nGiải thích (VI): AGI chỉ năng lực trí tuệ nhân tạo tổng quát có thể học hoặc suy luận trên nhiều dạng công việc, khác hệ thống quy tắc cố định chuyên biệt.\nSlide reference / Đối chiếu slide: Ch.2, pp.11–14","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q292","chapter":2,"number":292,"question":"What is a decoder-only model trained to predict?\nMô hình decoder-only được huấn luyện để dự đoán gì?","options":[{"id":"LLM300-Q292-A","text":"A future price with guaranteed precision\nGiá tương lai với độ chính xác bảo đảm"},{"id":"LLM300-Q292-B","text":"A user's identity from a token identifier\nDanh tính người dùng từ mã token"},{"id":"LLM300-Q292-C","text":"A document's true legal status without data\nTư cách pháp lý tài liệu khi thiếu dữ liệu"},{"id":"LLM300-Q292-D","text":"The next token from preceding context\nToken tiếp theo từ ngữ cảnh trước"}],"correctOptionId":"LLM300-Q292-D","explanation":"Explanation (EN): Autoregressive decoder generation predicts the next token using earlier tokens and repeats until a stop condition. The sequence is not emitted all at once.\nGiải thích (VI): Bộ giải mã tự hồi quy dự đoán token kế tiếp từ các token trước và lặp đến điều kiện dừng; các token không xuất hiện đồng thời.\nSlide reference / Đối chiếu slide: Ch.2, pp.41–44","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q293","chapter":3,"number":293,"question":"Why avoid changing multiple sampling settings at once?\nVì sao tránh thay đổi nhiều thiết lập lấy mẫu cùng lúc?","options":[{"id":"LLM300-Q293-A","text":"Measuring the physical weight of the GPU\nĐo trọng lượng vật lý của GPU"},{"id":"LLM300-Q293-B","text":"Reading the attached document's file name\nĐọc tên tệp đính kèm"},{"id":"LLM300-Q293-C","text":"Identifying which change affected the output\nXác định thay đổi nào làm ảnh hưởng đầu ra"},{"id":"LLM300-Q293-D","text":"Finding the customer's original account branch\nTìm chi nhánh gốc của khách hàng"}],"correctOptionId":"LLM300-Q293-C","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q294","chapter":1,"number":294,"question":"In a bigram model, what conditions the predicted word?\nTrong mô hình bigram, điều gì quyết định điều kiện của từ được dự đoán?","options":[{"id":"LLM300-Q294-A","text":"The final label assigned to the paragraph\nNhãn cuối gắn cho đoạn văn"},{"id":"LLM300-Q294-B","text":"The single word immediately before it\nMột từ đứng ngay trước nó"},{"id":"LLM300-Q294-C","text":"The single word immediately after it\nMột từ đứng ngay sau nó"},{"id":"LLM300-Q294-D","text":"The entire document without any limits\nToàn bộ tài liệu không giới hạn"}],"correctOptionId":"LLM300-Q294-B","explanation":"Explanation (EN): An N-gram uses a limited preceding context: an N-gram sequence contains N consecutive words, and a next-word prediction conditions on N−1 previous words. In a sentence of m words, there are m −N+1 overlapping N-grams.\nGiải thích (VI): N-gram dùng ngữ cảnh trước có giới hạn: một nhóm gồm N từ liên tiếp và việc đoán từ tiếp theo dựa vào N−1 từ trước. Câu có m từ tạo được m−N+1 nhóm N-gram chồng lấp.\nSlide reference / Đối chiếu slide: Ch.1, pp.6–9","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q295","chapter":4,"number":295,"question":"What is the role of human review in document drafting?\nVai trò của con người trong rà soát dự thảo tài liệu là gì?","options":[{"id":"LLM300-Q295-A","text":"No verification is needed for generated text\nKhông cần xác minh văn bản sinh"},{"id":"LLM300-Q295-B","text":"The model signs the notice for the bank\nMô hình ký văn bản thay ngân hàng"},{"id":"LLM300-Q295-C","text":"The customer becomes liable without notice\nKhách hàng tự chịu trách nhiệm không thông báo"},{"id":"LLM300-Q295-D","text":"A responsible person checks the final draft\nNgười có trách nhiệm kiểm tra bản cuối"}],"correctOptionId":"LLM300-Q295-D","explanation":"Explanation (EN): Human oversight keeps consequential credit, reporting and customer decisions with authorized staff. An AI draft or recommendation must be reviewed before final approval or sending.\nGiải thích (VI): Giám sát con người bảo đảm quyết định tín dụng, báo cáo và hỗ trợ khách hàng quan trọng thuộc nhân sự được ủy quyền. Bản nháp hoặc khuyến nghị AI phải được kiểm tra trước khi phê duyệt hoặc gửi.\nSlide reference / Đối chiếu slide: Ch.4, pp.8, 19, 27, 32","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q296","chapter":1,"number":296,"question":"Which model family is commonly encoder-only?\nHọ mô hình nào thường là encoder-only?","options":[{"id":"LLM300-Q296-A","text":"T5 and related encoder-decoder models\nT5 và mô hình mã hóa-giải mã"},{"id":"LLM300-Q296-B","text":"A simple count-based bigram predictor\nBộ dự đoán bigram đếm đơn giản"},{"id":"LLM300-Q296-C","text":"BERT and related encoder-based models\nBERT và mô hình dựa trên encoder"},{"id":"LLM300-Q296-D","text":"GPT and related decoder-based models\nGPT và mô hình dựa trên decoder"}],"correctOptionId":"LLM300-Q296-C","explanation":"Explanation (EN): GPT belongs to the decoder-only Transformer family and is oriented toward text generation. BERT is an encoder-only model for language representations; T5/BART use encoder–decoder structures.\nGiải thích (VI): GPT thuộc họ Transformer decoder-only, thiên về tạo sinh văn bản. BERT thuộc nhóm encoder-only để biểu diễn và hiểu ngôn ngữ; T5/BART dùng kiến trúc encoder–decoder.\nSlide reference / Đối chiếu slide: Ch.1, p.12; Ch.2, pp.27–28","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q297","chapter":3,"number":297,"question":"What is a typical effect of lowering temperature?\nTác động điển hình khi giảm temperature là gì?","options":[{"id":"LLM300-Q297-A","text":"Increase the likelihood of invented facts\nTăng khả năng bịa thông tin"},{"id":"LLM300-Q297-B","text":"Remove all constraints from the prompt\nBỏ mọi ràng buộc prompt"},{"id":"LLM300-Q297-C","text":"Allow unrestricted response creativity\nCho sáng tạo không giới hạn"},{"id":"LLM300-Q297-D","text":"Use less random output selection\nChọn đầu ra ít ngẫu nhiên hơn"}],"correctOptionId":"LLM300-Q297-D","explanation":"Explanation (EN): Temperature controls randomness in token selection. A lower value is usually better for consistent extraction; a higher value produces more diverse ideas, but neither guarantees truth.\nGiải thích (VI): Temperature điều chỉnh độ ngẫu nhiên khi chọn token. Giá trị thấp thường phù hợp để trích xuất ổn định; giá trị cao tạo ý tưởng đa dạng hơn nhưng không bảo đảm độ đúng.\nSlide reference / Đối chiếu slide: Ch.3, pp.11–14","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q298","chapter":4,"number":298,"question":"An AI reads customer documents with local abbreviations and debt classifications. What helps?\nAI đọc tài liệu khách hàng có chữ viết tắt địa phương và phân loại nợ. Điều gì hữu ích?","options":[{"id":"LLM300-Q298-A","text":"Remove all accents from every legal document\nBỏ mọi dấu trong văn bản luật"},{"id":"LLM300-Q298-B","text":"Depend solely on general English definitions\nChỉ dựa định nghĩa tiếng Anh chung"},{"id":"LLM300-Q298-C","text":"Give relevant local terms and conventions\nCung cấp thuật ngữ và quy ước địa phương"},{"id":"LLM300-Q298-D","text":"Assume that all abbreviations mean the same\nCho rằng mọi chữ viết tắt cùng nghĩa"}],"correctOptionId":"LLM300-Q298-C","explanation":"Explanation (EN): Vietnamese banking tasks benefit from local terms, abbreviations and conventions. Context prevents generic English meanings from misreading locally used financial language.\nGiải thích (VI): Tác vụ ngân hàng Việt Nam cần thuật ngữ, chữ viết tắt và quy ước địa phương. Ngữ cảnh giúp tránh hiểu sai thuật ngữ tài chính theo nghĩa tiếng Anh chung.\nSlide reference / Đối chiếu slide: Ch.4, pp.23, 45","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q299","chapter":4,"number":299,"question":"A customer disputes an ATM debit and the assistant cannot verify the case. What should it do?\nKhách hàng khiếu nại khoản ghi nợ ATM nhưng trợ lý không xác minh được. Nên làm gì?","options":[{"id":"LLM300-Q299-A","text":"Declare that the complaint is invalid\nTuyên bố khiếu nại không hợp lệ"},{"id":"LLM300-Q299-B","text":"Escalate the matter to a human support agent\nChuyển vụ việc cho nhân viên hỗ trợ"},{"id":"LLM300-Q299-C","text":"Request the customer's login password\nYêu cầu mật khẩu đăng nhập"},{"id":"LLM300-Q299-D","text":"Invent a completed reversal transaction\nBịa giao dịch hoàn tiền đã hoàn tất"}],"correctOptionId":"LLM300-Q299-B","explanation":"Explanation (EN): Banking chatbots are best used for repeated customer requests and verified in-app assistance. Unresolved or sensitive issues should be escalated to authorized human staff, not resolved by inventing an answer.\nGiải thích (VI): Chatbot ngân hàng phù hợp với các yêu cầu lặp lại và hỗ trợ trong ứng dụng đã xác thực. Vấn đề nhạy cảm hoặc chưa xử lý được phải chuyển nhân viên có thẩm quyền, không được bịa câu trả lời.\nSlide reference / Đối chiếu slide: Ch.4, pp.11–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q300","chapter":3,"number":300,"question":"What is a sensible prompt improvement workflow?\nQuy trình cải thiện prompt hợp lý là gì?","options":[{"id":"LLM300-Q300-A","text":"Assume the first response is always correct\nCho rằng câu trả lời đầu luôn đúng"},{"id":"LLM300-Q300-B","text":"Ignore user requirements during revision\nBỏ qua yêu cầu khi sửa"},{"id":"LLM300-Q300-C","text":"Remove all formatting and task boundaries\nBỏ hết định dạng và giới hạn nhiệm vụ"},{"id":"LLM300-Q300-D","text":"Test, evaluate and refine its instructions\nKiểm thử, đánh giá và tinh chỉnh chỉ dẫn"}],"correctOptionId":"LLM300-Q300-D","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"}];
function isCorrect(q,oid){return !!oid&&(oid===q.correctOptionId||oid===q.altCorrectOptionId)}
function answerOptionsHTML(q){return [q.correctOptionId,q.altCorrectOptionId].filter(Boolean).map(id=>optionHTML(q,id)).join(' <b>hoặc / or</b> ')}
const CHAPTERS = {1:'Overview of Large Language Models',2:'Components of ChatGPT',3:'Prompt Engineering',4:'LLMs in Banking & Finance'};
const KEY='llms_quiz_300_tran_trung_minh_20261101_v1';
const DEFAULT={theme:'light',font:'normal',langMode:'bi',singleLang:'en',shuffleQ:true,shuffleA:true,mode:'practice',stats:{},wrongIds:[],bookmarks:[],sessions:[],activeSession:null};
let state=loadState(); let page='dashboard'; let session=null; let timerHandle=null; let bankQuery=''; let bankChapter='all'; let bankStatus='all';
function loadState(){try{return {...DEFAULT,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(DEFAULT)}}
function saveState(){localStorage.setItem(KEY,JSON.stringify(state))}
function applyPrefs(){document.documentElement.dataset.theme=state.theme||'light'; const fs=state.font==='small'?14:state.font==='large'?18:16;document.documentElement.style.setProperty('--font',fs+'px')}
applyPrefs();
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function stat(qid){return state.stats[qid]||{attempts:0,correct:0,wrong:0,streak:0,lastAt:null}}
function statusOf(qid){const s=stat(qid);if(!s.attempts)return 'new';if(state.wrongIds.includes(qid))return 'weak';if(s.streak>=2)return 'mastered';return 'learning'}
function chapterQuestions(ch){return QUESTIONS.filter(q=>q.chapter===ch)}
function overall(){const done=QUESTIONS.filter(q=>stat(q.id).attempts>0).length;const mastered=QUESTIONS.filter(q=>statusOf(q.id)==='mastered').length;let a=0,c=0;QUESTIONS.forEach(q=>{const s=stat(q.id);a+=s.correct+s.wrong;c+=s.correct});return{done,mastered,wrong:state.wrongIds.length,accuracy:a?Math.round(c/a*100):0}}
function navigate(p){page=p;session=null;clearTimer();$('#topTimer').classList.add('hidden');$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#topTitle').textContent={dashboard:'Trang chủ',practice:'Ôn tập / Kiểm tra',wrong:'Câu sai',bookmarks:'Đã đánh dấu',bank:'Ngân hàng câu hỏi',stats:'Thống kê',settings:'Cài đặt'}[p]||'';render();$('#sidebar').classList.remove('open');scrollTo({top:0,behavior:'auto'})}
function render(){const c=$('#content');({dashboard:renderDashboard,practice:renderSetup,wrong:()=>renderCollection('wrong'),bookmarks:()=>renderCollection('bookmarks'),bank:renderBank,stats:renderStats,settings:renderSettings}[page]||renderDashboard)(c)}
function renderDashboard(c){const o=overall();c.innerHTML=`<h1 class="page-title">Ôn ${QUESTIONS.length} câu LLMs</h1><p class="sub">4 chương, xáo câu và đáp án độc lập, tự ghi nhớ câu sai và lịch sử từng câu.</p><div class="grid">
<div class="card stat"><div class="n">${o.done}/${QUESTIONS.length}</div><div class="l">Câu đã học</div></div><div class="card stat"><div class="n">${o.mastered}</div><div class="l">Câu thành thạo</div></div><div class="card stat"><div class="n">${o.wrong}</div><div class="l">Câu đang yếu</div></div><div class="card stat"><div class="n">${o.accuracy}%</div><div class="l">Độ chính xác toàn bộ lượt làm</div></div>
<div class="card" style="grid-column:span 12"><h3 class="section-title">Tiến độ toàn bộ ngân hàng</h3><div class="progress"><span style="width:${QUESTIONS.length?o.done/QUESTIONS.length*100:0}%"></span></div><p class="muted">${o.done} câu đã chạm tới • ${QUESTIONS.length-o.done} câu chưa làm</p><div class="row"><button class="btn primary" onclick="navigate('practice')">Bắt đầu ôn</button>${state.activeSession?'<button class="btn" onclick="resumeSaved()">Tiếp tục bài đang dở</button>':''}<button class="btn" onclick="quickWrong()">Ôn câu sai</button></div></div>
${[1,2,3,4].map(ch=>{const qs=chapterQuestions(ch);const done=qs.filter(q=>stat(q.id).attempts).length;const weak=qs.filter(q=>state.wrongIds.includes(q.id)).length;return `<div class="card" style="grid-column:span 6"><b>Chương ${ch}</b><div class="muted">${esc(CHAPTERS[ch])}</div><div class="row" style="margin-top:10px"><span class="pill">Đã học ${done}/${qs.length}</span><span class="pill">Câu yếu ${weak}</span><button class="btn" onclick="startChapter(${ch})">Ôn chương</button></div></div>`}).join('')}</div>`}
function setupHTML(){return `<h1 class="page-title">Tạo bài ôn / bài kiểm tra</h1><p class="sub">Chế độ ôn sẽ phản hồi ngay. Nếu chọn sai, lựa chọn sai chuyển đỏ, đáp án đúng chuyển xanh và giải thích hiện ngay bên dưới.</p>${languageControls()}<div class="setup"><div class="card"><h3 class="section-title">1. Chọn chương</h3><div class="chapter-grid">${[1,2,3,4].map(ch=>`<label class="chapter-item"><input type="checkbox" class="chpick" value="${ch}" checked><span><b>Chương ${ch}</b><small style="display:block;color:var(--muted)">${esc(CHAPTERS[ch])} • ${chapterQuestions(ch).length} câu</small></span></label>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn" id="allCh">Chọn tất cả</button><button class="btn" id="noneCh">Bỏ chọn</button></div></div><div class="card"><h3 class="section-title">2. Thiết lập</h3><div class="field"><label>Chế độ</label><select id="mode"><option value="practice">Ôn tập: hiện đúng/sai + giải thích ngay</option><option value="test">Kiểm tra: nộp bài mới hiện kết quả</option></select></div><div class="field" style="margin-top:10px"><label>Số câu</label><select id="count"><option>10</option><option>20</option><option>30</option><option selected>50</option><option>100</option><option value="all">Tất cả trong phạm vi</option></select></div><label class="toggle" style="margin-top:10px"><input id="shuffleQ" type="checkbox" ${state.shuffleQ?'checked':''}> Xáo thứ tự câu hỏi</label><label class="toggle" style="margin-top:8px"><input id="shuffleA" type="checkbox" ${state.shuffleA?'checked':''}> Xáo vị trí đáp án A, B, C, D</label><div class="field" style="margin-top:10px"><label>Giới hạn thời gian toàn bài</label><select id="timerMin"><option value="0">Không giới hạn</option><option value="10">10 phút</option><option value="20">20 phút</option><option value="30">30 phút</option><option value="45">45 phút</option><option value="60">60 phút</option></select></div><button class="btn primary" style="width:100%;margin-top:14px" id="startBtn">Bắt đầu</button></div></div>`}
function renderSetup(c){c.innerHTML=setupHTML();$('#allCh').onclick=()=>$$('.chpick').forEach(x=>x.checked=true);$('#noneCh').onclick=()=>$$('.chpick').forEach(x=>x.checked=false);$('#startBtn').onclick=()=>{const chapters=$$('.chpick:checked').map(x=>+x.value);if(!chapters.length)return toast('Hãy chọn ít nhất một chương');startSession({chapters,count:$('#count').value,mode:$('#mode').value,shuffleQ:$('#shuffleQ').checked,shuffleA:$('#shuffleA').checked,timerMin:+$('#timerMin').value})}}
function startChapter(ch){page='practice';startSession({chapters:[ch],count:'all',mode:'practice',shuffleQ:true,shuffleA:true,timerMin:0})}
function quickWrong(){if(!state.wrongIds.length)return toast('Chưa có câu sai để ôn');startSessionFromIds(state.wrongIds,'practice',true,true,0)}
function startSession(cfg){state.shuffleQ=cfg.shuffleQ;state.shuffleA=cfg.shuffleA;saveState();let pool=QUESTIONS.filter(q=>cfg.chapters.includes(q.chapter));if(cfg.shuffleQ)pool=shuffle(pool);const n=cfg.count==='all'?pool.length:Math.min(+cfg.count,pool.length);startSessionFromObjects(pool.slice(0,n),cfg.mode,cfg.shuffleA,cfg.timerMin)}
function startSessionFromIds(ids,mode='practice',shuffleA=true,timerMin=0){let pool=QUESTIONS.filter(q=>ids.includes(q.id));pool=shuffle(pool);startSessionFromObjects(pool,mode,shuffleA,timerMin)}
function startSessionFromObjects(qs,mode,shuffleA,timerMin){session={id:Date.now(),mode,index:0,startedAt:Date.now(),endsAt:timerMin?Date.now()+timerMin*60000:null,submitted:false,items:qs.map(q=>({qid:q.id,optionOrder:(shuffleA?shuffle(q.options):q.options).map(o=>o.id),selected:null,locked:false}))};state.activeSession=session;saveState();renderQuiz();startTimer()}
function resumeSaved(){if(!state.activeSession)return;session=state.activeSession;page='practice';renderQuiz();startTimer()}
function startTimer(){clearTimer();if(!session?.endsAt){$('#topTimer').classList.add('hidden');return}const el=$('#topTimer');el.classList.remove('hidden');const tick=()=>{const left=Math.max(0,session.endsAt-Date.now());const m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);el.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;if(left<=0){clearTimer();submitTest(true)}};tick();timerHandle=setInterval(tick,1000)}
function clearTimer(){if(timerHandle)clearInterval(timerHandle);timerHandle=null}
function currentItem(){return session.items[session.index]}
function qById(id){return QUESTIONS.find(q=>q.id===id)}
function optionText(q,oid){return q.options.find(o=>o.id===oid)?.text||''}

/* Isolated display-only language switch. The original 120 questions and answer IDs are untouched. */
function studyLocale(){return state.langMode==='single'?(state.singleLang==='vi'?'vi':'en'):'bi'}
function languageControls(){
 const single=state.langMode==='single', l=studyLocale();
 return '<div class="language-controls" role="group" aria-label="Ngôn ngữ ôn tập">'
  +'<b>NGÔN NGỮ LÀM BÀI</b>'
  +'<div class="language-actions">'
  +'<button type="button" class="btn lang-mode '+(single?'active':'')+'" aria-pressed="'+single+'" onclick="setLanguageMode(\'single\')">① Đơn ngữ</button>'
  +'<button type="button" class="btn lang-mode '+(!single?'active':'')+'" aria-pressed="'+(!single)+'" onclick="setLanguageMode(\'bi\')">② Song ngữ Anh – Việt</button>'
  +(single?'<label class="single-lang-label" for="singleLang">Chọn tiếng: <select id="singleLang" onchange="setSingleLanguage(this.value)"><option value="en" '+(l==='en'?'selected':'')+'>English only</option><option value="vi" '+(l==='vi'?'selected':'')+'>Chỉ tiếng Việt</option></select></label>':'')
  +'</div><small>'+(single?'Chỉ hiển thị câu hỏi, đáp án và lời giải bằng '+(l==='en'?'tiếng Anh.':'tiếng Việt.'):'Hiển thị tiếng Anh phía trên, tiếng Việt phía dưới.')+'</small></div>';
}
function refreshLanguage(){
 // A live quiz may be started from any page without changing the page variable.
 if(session && document.querySelector('.quiz-card')) renderQuiz();
 else render();
}
function setLanguageMode(mode){if(mode!=='single'&&mode!=='bi')return;state.langMode=mode;saveState();refreshLanguage()}
function setSingleLanguage(language){if(language!=='en'&&language!=='vi')return;state.singleLang=language;state.langMode='single';saveState();refreshLanguage()}
function languageText(en,vi){
 en=String(en||'').trim();vi=String(vi||en).trim();const l=studyLocale();
 if(l==='en')return '<span class="lang-only">'+esc(en)+'</span>';
 if(l==='vi')return '<span class="lang-only">'+esc(vi)+'</span>';
 if(en===vi)return '<span class="lang-only">'+esc(en)+'</span>';
 return '<span class="language-pair"><span class="lang-top" lang="en">'+esc(en)+'</span><span class="lang-bottom" lang="vi">'+esc(vi)+'</span></span>';
}
function questionParts(q){
 const t=String(q.question||''),i=t.indexOf('\n');
 return i<0?[t,t]:[t.slice(0,i).trim(),t.slice(i+1).trim()];
}
function questionHTML(q){const p=questionParts(q);return languageText(p[0],p[1])}
function optionParts(raw){
 const t=String(raw||'').trim(),nl=t.indexOf('\n');
 if(nl>=0)return [t.slice(0,nl).trim(),t.slice(nl+1).trim().replace(/\s*\n\s*/g,' ')];
 if(t.endsWith(')')){
  let depth=0,opening=-1;
  for(let i=t.length-1;i>=0;i--){
   if(t[i]===')')depth++;
   else if(t[i]==='('){depth--;if(depth===0){opening=i;break}}
  }
  if(opening>0 && /[\u00C0-\u1EF9]/.test(t.slice(opening+1)))
   return [t.slice(0,opening).trim(),t.slice(opening+1,-1).trim()];
 }
 const accented=t.search(/[\u00C0-\u1EF9]/);
 if(accented>=0){
  const separator=t.lastIndexOf('. ',accented);
  if(separator>0 && separator+2<accented+1)
   return [t.slice(0,separator+1).trim(),t.slice(separator+2).trim()];
 }
 const parts=t.split(/\s+/);
 if(parts.length===2 && /[\d%]/.test(parts[0]) && /[\d%]/.test(parts[1]))return parts;
 if(parts.length===3 && /^\$[\d.]+$/.test(parts[0])&&parts[2]==='USD')return [parts[0],parts.slice(1).join(' ')];
 if(parts.length%2===0){const n=parts.length/2;if(parts.slice(0,n).join(' ')===parts.slice(n).join(' '))return [parts.slice(0,n).join(' '),parts.slice(n).join(' ')];}
 return [t,t];
}
function optionHTML(q,oid){const p=optionParts(optionText(q,oid));return languageText(p[0],p[1])}
function explanationParts(q){
 const t=String(q.explanation||''),r=/(Supplementary English explanation[^:\n]*:|Explanation \(EN\):|Giải thích chi tiết:|Giải thích \(VI\):|(?:Formula \/ Calculation \/ Công thức & tính toán|Công thức & tính toán \/ Formula & calculation):)/gi;
 const matches=[...t.matchAll(r)],result={en:'',vi:'',formula:''};
 for(let k=0;k<matches.length;k++){
  const m=matches[k],part=t.slice(m.index+m[0].length,k+1<matches.length?matches[k+1].index:t.length).trim();
  if(/Explanation \(EN\)|Supplementary English/i.test(m[0]))result.en+=(result.en?'\n':'')+part;
  else if(/Giải thích/i.test(m[0]))result.vi+=(result.vi?'\n':'')+part;
  else result.formula+=(result.formula?'\n':'')+part;
 }
 if(!result.en&&!result.vi)result.vi=t;
 return result;
}
function explanationHTML(q){
 const p=explanationParts(q),l=studyLocale();
 const value=l==='en'?p.en:l==='vi'?p.vi:null;
 let html='';
 if(l==='bi')html='<div class="explain-block"><strong>Explanation (EN)</strong><div class="lang-top">'+esc(p.en||'')+'</div></div><div class="explain-block"><strong>Giải thích (VI)</strong><div class="lang-bottom">'+esc(p.vi||'')+'</div></div>';
 else html='<div class="explain-block"><strong>'+(l==='en'?'Explanation':'Giải thích')+'</strong><div class="lang-only">'+esc(value||'')+'</div></div>';
 if(p.formula)html+='<div class="explain-block"><strong>'+(l==='en'?'Formula / Calculation':l==='vi'?'Công thức & tính toán':'Formula / Công thức')+'</strong><div class="lang-only">'+esc(p.formula)+'</div></div>';
 return html;
}
function languageLabel(en,vi){return studyLocale()==='en'?en:vi}

function renderQuiz(){const c=$('#content');if(!session)return renderSetup(c);const it=currentItem(),q=qById(it.qid);const practice=session.mode==='practice';const show=practice&&it.locked;const selected=it.selected;const correct=q.correctOptionId;const graded=!!correct;const isCorrect=graded&&isCorrect(q,selected);const answered=session.items.filter(x=>x.selected).length;c.innerHTML=`<div class="quiz-wrap"><div class="quiz-head"><span>${session.index+1}/${session.items.length}</span><div class="progress"><span style="width:${(session.index+1)/session.items.length*100}%"></span></div><button class="icon-btn bookmark ${state.bookmarks.includes(q.id)?'active':''}" onclick="toggleBookmark('${q.id}')">★</button></div><div class="navigator">${session.items.map((x,i)=>{let cls=i===session.index?'current ':'';if(session.mode==='practice'&&x.locked){const qq=qById(x.qid);if(!qq.correctOptionId)cls+='answered';else cls+=isCorrect(qq,x.selected)?'correct':'wrong'}else if(x.selected)cls+='answered';return `<button class="navq ${cls}" onclick="goQ(${i})">${i+1}</button>`}).join('')}</div><div class="quiz-card">${languageControls()}<div class="q-meta"><span class="pill">Chương ${q.chapter}</span><span class="pill">${esc(q.source||'LLMs')}</span><span class="pill">${esc(q.topic||"Tổng hợp")}</span><span class="pill">${esc(q.level||"Trắc nghiệm")}</span><span class="pill">${q.id}</span>${session.mode==='test'?'<span class="pill">Chế độ kiểm tra</span>':'<span class="pill">Chế độ ôn tập</span>'}</div><div class="question">${questionHTML(q)}</div><div class="options">${it.optionOrder.map((oid,idx)=>{let cls='';if(show){if(graded&&isCorrect(q,oid))cls='correct';else if(graded&&oid===selected)cls='wrong';else if(!graded&&oid===selected)cls='review'}else if(session.mode==='test'&&oid===selected)cls='selected';return `<button class="option ${cls}" ${show?'disabled':''} onclick="choose('${oid}')"><span class="opt-letter">${'ABCD'[idx]}</span><span>${optionHTML(q,oid)}${show&&graded&&isCorrect(q,oid)?' <b>✓ Đáp án đúng</b>':''}${show&&graded&&oid===selected&&oid!==correct?' <b>✕ Bạn đã chọn</b>':''}${show&&!graded&&oid===selected?' <b>• Bạn đã chọn</b>':''}</span></button>`}).join('')}</div>${show?(graded?`<div class="feedback ${isCorrect?'good':'bad'}"><b>${isCorrect?languageLabel('✓ Correct','✓ Chính xác'):languageLabel('✕ Incorrect','✕ Chưa đúng')}</b>${!isCorrect?`${languageLabel('You selected:','Bạn đã chọn:')} <b>${optionHTML(q,selected)}</b>. ${languageLabel('The correct choice is highlighted in green above.','Đáp án đúng được tô xanh phía trên.')}`:''}<div class="explanation"><b>${languageLabel('Explanation (original answer letter can change when choices are shuffled):','Giải thích / Explanation (thứ tự chữ cái trong tài liệu gốc có thể khác sau khi xáo đáp án):')}</b>${explanationHTML(q)}</div></div>`:`<div class="feedback review"><b>⚠ Câu này chưa có đáp án chính thức đủ rõ để chốt duy nhất</b><div class="explanation"><b>Giải thích / lưu ý:</b>${explanationHTML(q)}</div></div>`):''}<div class="quiz-actions"><button class="btn" onclick="prevQ()" ${session.index===0?'disabled':''}>← Câu trước</button>${session.mode==='test'?`<button class="btn primary" onclick="${session.index===session.items.length-1?'submitTest()':'nextQ()'}">${session.index===session.items.length-1?'Nộp bài':'Câu tiếp →'}</button>`:`<button class="btn primary" onclick="nextQ()" ${!it.locked?'disabled':''}>${session.index===session.items.length-1?'Hoàn thành':'Câu tiếp →'}</button>`}</div></div><p class="muted" style="text-align:center">Đã trả lời ${answered}/${session.items.length}. Phím 1–4 chọn A–D; Enter sang câu tiếp.</p></div>`;$('#topTitle').textContent='Đang làm bài';state.activeSession=session;saveState()}
function choose(oid){const it=currentItem(),q=qById(it.qid);if(session.mode==='practice'&&it.locked)return;it.selected=oid;if(session.mode==='practice'){it.locked=true;if(q.correctOptionId)recordAttempt(q.id,isCorrect(q,oid));else recordReview(q.id)}state.activeSession=session;saveState();renderQuiz()}
function recordAttempt(qid,correct){const s=stat(qid);s.attempts++;s.lastAt=Date.now();if(correct){s.correct++;s.streak++;if(s.streak>=2)state.wrongIds=state.wrongIds.filter(x=>x!==qid)}else{s.wrong++;s.streak=0;if(!state.wrongIds.includes(qid))state.wrongIds.push(qid)}state.stats[qid]=s;saveState()}
function recordReview(qid){const s=stat(qid);s.attempts++;s.lastAt=Date.now();state.stats[qid]=s;saveState()}
function nextQ(){if(session.index<session.items.length-1){session.index++;renderQuiz()}else{if(session.mode==='practice')finishPractice();else submitTest()}}
function prevQ(){if(session.index>0){session.index--;renderQuiz()}}
function goQ(i){session.index=i;renderQuiz()}
function toggleBookmark(qid){if(state.bookmarks.includes(qid))state.bookmarks=state.bookmarks.filter(x=>x!==qid);else state.bookmarks.push(qid);saveState();renderQuiz()}
function finishPractice(){const gradable=session.items.filter(x=>qById(x.qid).correctOptionId);const correct=gradable.filter(x=>{const q=qById(x.qid);return isCorrect(q,x.selected)}).length;const ungraded=session.items.length-gradable.length;const done={id:session.id,date:Date.now(),mode:'practice',total:gradable.length,correct,ungraded};state.sessions.unshift(done);state.sessions=state.sessions.slice(0,50);state.activeSession=null;saveState();clearTimer();$('#topTimer').classList.add('hidden');showResult(correct,gradable.length,'Ôn tập hoàn thành',ungraded)}
function submitTest(auto=false){if(!session||session.submitted)return;const unanswered=session.items.filter(x=>!x.selected).length;if(!auto&&unanswered&&!confirm(`Bạn còn ${unanswered} câu chưa trả lời. Vẫn nộp bài?`))return;session.submitted=true;let correct=0,gradable=0,ungraded=0;session.items.forEach(x=>{const q=qById(x.qid);if(!q.correctOptionId){ungraded++;if(x.selected)recordReview(q.id);return}gradable++;const ok=isCorrect(q,x.selected);if(x.selected)recordAttempt(q.id,ok);if(ok)correct++});state.sessions.unshift({id:session.id,date:Date.now(),mode:'test',total:gradable,correct,ungraded});state.sessions=state.sessions.slice(0,50);state.activeSession=null;saveState();clearTimer();$('#topTimer').classList.add('hidden');showTestReview(correct,auto)}

function showResult(correct,total,title,ungraded=0){const c=$('#content');const pct=total?Math.round(correct/total*100):0;c.innerHTML=`<h1 class="page-title">${title}</h1><div class="test-summary"><div class="card"><div class="n" style="font-size:28px;font-weight:800">${correct}</div><div class="muted">Câu đúng</div></div><div class="card"><div class="n" style="font-size:28px;font-weight:800">${total-correct}</div><div class="muted">Câu sai</div></div><div class="card"><div class="n" style="font-size:28px;font-weight:800">${pct}%</div><div class="muted">Tỷ lệ đúng trên câu có đáp án chốt</div></div>${ungraded?`<div class="card"><div class="n" style="font-size:28px;font-weight:800">${ungraded}</div><div class="muted">Câu chưa chốt đáp án, không tính điểm</div></div>`:''}</div><div class="row" style="margin-top:16px"><button class="btn primary" onclick="navigate('practice')">Tạo bài mới</button><button class="btn" onclick="navigate('wrong')">Ôn câu sai</button><button class="btn" onclick="navigate('stats')">Xem thống kê</button></div>`}
function showTestReview(correct,auto){const c=$('#content');const gradable=session.items.filter(x=>qById(x.qid).correctOptionId);const total=gradable.length;const ungraded=session.items.length-total;const pct=total?Math.round(correct/total*100):0;c.innerHTML=`<h1 class="page-title">${auto?'Hết giờ - đã tự động nộp':'Kết quả kiểm tra'}</h1><div class="test-summary"><div class="card"><b>${correct}/${total}</b><div class="muted">Câu đúng / câu có đáp án chốt</div></div><div class="card"><b>${total-correct}</b><div class="muted">Câu sai hoặc bỏ trống</div></div><div class="card"><b>${pct}%</b><div class="muted">Tỷ lệ đúng</div></div>${ungraded?`<div class="card"><b>${ungraded}</b><div class="muted">Câu chưa chốt, không tính điểm</div></div>`:''}</div><h3>Xem lại từng câu</h3><div class="list">${session.items.map((it,i)=>{const q=qById(it.qid);if(!q.correctOptionId)return `<div class="q-row"><h4>Câu ${i+1}. ${questionHTML(q)}</h4><div class="meta">⚠ Chưa có đáp án chốt • Chương ${q.chapter} • ${esc(q.source||'LLMs')}</div>${it.selected?`<p><b>Bạn chọn:</b> ${esc(optionText(q,it.selected))}</p>`:''}<p><b>Giải thích / lưu ý:</b> ${explanationHTML(q)}</p></div>`;const ok=isCorrect(q,it.selected);return `<div class="q-row"><h4>Câu ${i+1}. ${questionHTML(q)}</h4><div class="meta">${ok?'✓ Đúng':'✕ Sai'} • Chương ${q.chapter} • ${esc(q.source||'LLMs')}</div><p><b>Đáp án đúng:</b> ${answerOptionsHTML(q)}</p>${it.selected&&!ok?`<p><b>Bạn chọn:</b> ${esc(optionText(q,it.selected))}</p>`:''}<p><b>Giải thích:</b> ${explanationHTML(q)}</p></div>`}).join('')}</div><div class="row" style="margin-top:16px"><button class="btn primary" onclick="navigate('practice')">Tạo bài mới</button><button class="btn" onclick="navigate('wrong')">Ôn câu sai</button></div>`}

function renderCollection(type){const c=$('#content');const ids=type==='wrong'?state.wrongIds:state.bookmarks;const title=type==='wrong'?'Câu sai / đang yếu':'Câu đã đánh dấu';const qs=QUESTIONS.filter(q=>ids.includes(q.id));c.innerHTML=`<h1 class="page-title">${title}</h1><p class="sub">${type==='wrong'?'Câu sai được lưu tự động. Khi trả lời đúng liên tiếp 2 lần, câu sẽ rời danh sách yếu nhưng lịch sử vẫn được giữ.':'Các câu bạn muốn xem lại riêng.'}</p>${qs.length?`<div class="row" style="margin-bottom:14px"><button class="btn primary" onclick="startSessionFromIds(${JSON.stringify(ids).replace(/"/g,'&quot;')},'practice',true,0)">Ôn tất cả (${qs.length})</button><button class="btn" onclick="startSessionFromIds(${JSON.stringify(ids.slice(0,20)).replace(/"/g,'&quot;')},'practice',true,0)">Ôn tối đa 20 câu</button></div><div class="list">${qs.map(q=>rowHTML(q)).join('')}</div>`:`<div class="empty">Chưa có câu nào trong mục này.</div>`}`}
function rowHTML(q){const s=stat(q.id);return `<div class="q-row"><h4>${questionHTML(q)}</h4><div class="meta">${q.id} • ${esc(q.source||'LLMs')} • Chương ${q.chapter} • Đã làm ${s.attempts} lần • Đúng ${s.correct} • Sai ${s.wrong}</div><div class="actions"><button class="btn" onclick="openQuestion('${q.id}')">Xem câu</button><button class="btn" onclick="startSessionFromIds(['${q.id}'],'practice',true,0)">Làm lại</button></div></div>`}
function renderBank(c){let qs=QUESTIONS.filter(q=>(bankChapter==='all'||q.chapter==bankChapter));if(bankStatus!=='all')qs=qs.filter(q=>statusOf(q.id)===bankStatus);if(bankQuery.trim()){const t=bankQuery.toLowerCase();qs=qs.filter(q=>(q.question+' '+q.options.map(o=>o.text).join(' ')).toLowerCase().includes(t))}c.innerHTML=`<h1 class="page-title">Ngân hàng ${QUESTIONS.length} câu</h1><p class="sub">Tìm kiếm và xem từng câu. Đáp án mặc định được ẩn trong cửa sổ chi tiết.</p>${languageControls()}<div class="searchbar"><input id="bankSearch" placeholder="Tìm nội dung câu hỏi..." value="${esc(bankQuery)}"><select id="bankChapter"><option value="all">Tất cả chương</option>${[1,2,3,4].map(ch=>`<option value="${ch}" ${bankChapter==ch?'selected':''}>Chương ${ch}</option>`).join('')}</select><select id="bankStatus"><option value="all">Mọi trạng thái</option><option value="new" ${bankStatus==='new'?'selected':''}>Chưa làm</option><option value="weak" ${bankStatus==='weak'?'selected':''}>Đang yếu</option><option value="learning" ${bankStatus==='learning'?'selected':''}>Đang học</option><option value="mastered" ${bankStatus==='mastered'?'selected':''}>Thành thạo</option></select></div><div class="muted" style="margin-bottom:10px">Tìm thấy ${qs.length} câu</div><div class="list">${qs.slice(0,300).map(q=>rowHTML(q)).join('')}${qs.length>300?'<div class="empty">Đang hiển thị 300 kết quả đầu. Hãy lọc hoặc tìm kiếm để thu hẹp.</div>':''}</div>`;$('#bankSearch').oninput=e=>{bankQuery=e.target.value;clearTimeout(window._bs);window._bs=setTimeout(()=>renderBank(c),180)};$('#bankChapter').onchange=e=>{bankChapter=e.target.value;renderBank(c)};$('#bankStatus').onchange=e=>{bankStatus=e.target.value;renderBank(c)}}
function openQuestion(qid){const q=qById(qid);const m=$('#modal'),mc=$('#modalCard');const answerHtml=q.correctOptionId?`<p><b>Đáp án đúng:</b> ${answerOptionsHTML(q)}</p>`:`<p style="color:var(--warn)"><b>Chưa có đáp án chính thức đủ rõ để chốt duy nhất.</b></p>`;mc.innerHTML=`<div class="row"><b>${q.id} • ${esc(q.source||'LLMs')} • Chương ${q.chapter}</b><div style="flex:1"></div><button class="icon-btn" onclick="closeModal()">✕</button></div><h3>${questionHTML(q)}</h3>${q.options.map((o,i)=>`<p><b>${'ABCD'[i]}.</b> ${optionHTML(q,o.id)}</p>`).join('')}<button class="btn primary" id="revealBtn">Hiện đáp án và giải thích</button><div id="reveal" class="hidden"><hr style="border:0;border-top:1px solid var(--line)">${answerHtml}<p><b>${q.correctOptionId?'Giải thích':'Giải thích / lưu ý'}:</b> ${explanationHTML(q)}</p></div>`;m.classList.add('open');$('#revealBtn').onclick=()=>$('#reveal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.remove('open')}
function renderStats(c){const rows=[1,2,3,4].map(ch=>{const qs=chapterQuestions(ch);let a=0,co=0;qs.forEach(q=>{const s=stat(q.id);a+=s.correct+s.wrong;co+=s.correct});const done=qs.filter(q=>stat(q.id).attempts).length;const weak=qs.filter(q=>state.wrongIds.includes(q.id)).length;return{ch,done,weak,acc:a?Math.round(co/a*100):0}});c.innerHTML=`<h1 class="page-title">Thống kê</h1><p class="sub">Theo dõi mức độ phủ câu hỏi và tỷ lệ đúng thực tế, không dùng điểm cộng/trừ.</p><div class="card"><table class="kpi-table"><thead><tr><th>Chương</th><th class="right">Đã học</th><th class="right">Câu yếu</th><th class="right">Độ chính xác</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>Chương ${r.ch}</b><div class="muted">${esc(CHAPTERS[r.ch])}</div></td><td class="right">${r.done}/${chapterQuestions(r.ch).length}</td><td class="right">${r.weak}</td><td class="right">${r.acc}%</td></tr>`).join('')}</tbody></table></div><h3>Lịch sử bài gần đây</h3>${state.sessions.length?`<div class="list">${state.sessions.slice(0,12).map(s=>`<div class="q-row"><b>${s.mode==='test'?'Kiểm tra':'Ôn tập'} • ${new Date(s.date).toLocaleString('vi-VN')}</b><div class="meta">${s.correct}/${s.total} đúng • ${Math.round(s.correct/s.total*100)}%</div></div>`).join('')}</div>`:'<div class="empty">Chưa có bài hoàn thành.</div>'}`}
function renderSettings(c){c.innerHTML=`<h1 class="page-title">Cài đặt</h1>${languageControls()}<div class="grid"><div class="card" style="grid-column:span 6"><h3 class="section-title">Giao diện</h3><div class="field"><label>Chế độ màu</label><select id="themeSel"><option value="light" ${state.theme==='light'?'selected':''}>Sáng</option><option value="dark" ${state.theme==='dark'?'selected':''}>Tối</option></select></div><div class="field" style="margin-top:10px"><label>Cỡ chữ</label><select id="fontSel"><option value="small" ${state.font==='small'?'selected':''}>Nhỏ</option><option value="normal" ${state.font==='normal'?'selected':''}>Vừa</option><option value="large" ${state.font==='large'?'selected':''}>Lớn</option></select></div></div><div class="card" style="grid-column:span 6"><h3 class="section-title">Sao lưu tiến độ</h3><div class="row"><button class="btn" id="exportBtn">Xuất dữ liệu JSON</button><label class="btn">Nhập dữ liệu<input id="importFile" type="file" accept="application/json" hidden></label></div><p class="muted">Dùng để chuyển tiến độ sang máy khác.</p></div><div class="card danger-zone" style="grid-column:span 12"><h3 class="section-title">Xóa dữ liệu học</h3><p class="muted">Xóa lịch sử đúng/sai, câu yếu, đánh dấu và bài đang dở. Ngân hàng ${QUESTIONS.length} câu vẫn còn nguyên.</p><button class="btn danger" id="resetBtn">Xóa toàn bộ tiến độ</button></div></div>`;$('#themeSel').onchange=e=>{state.theme=e.target.value;saveState();applyPrefs()};$('#fontSel').onchange=e=>{state.font=e.target.value;saveState();applyPrefs()};$('#exportBtn').onclick=exportData;$('#importFile').onchange=importData;$('#resetBtn').onclick=resetData}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='llms-300-tien-do.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state={...DEFAULT,...x};saveState();applyPrefs();toast('Đã nhập tiến độ');render()}catch{alert('File dữ liệu không hợp lệ')}};r.readAsText(f)}
function resetData(){if(!confirm('Xóa toàn bộ tiến độ học?'))return;if(!confirm('Xác nhận lần cuối: thao tác này không thể hoàn tác.'))return;localStorage.removeItem(KEY);state=structuredClone(DEFAULT);applyPrefs();toast('Đã xóa tiến độ');navigate('dashboard')}
$('#nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(b)navigate(b.dataset.page)};$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';saveState();applyPrefs()};$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(!session)return;if(['1','2','3','4'].includes(e.key)){const it=currentItem();const idx=+e.key-1;if(it.optionOrder[idx])choose(it.optionOrder[idx])}if(e.key==='Enter'&&session.mode==='practice'&&currentItem().locked)nextQ()});
render();
</script>
</body>
