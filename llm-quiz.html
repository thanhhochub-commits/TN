LMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q129","chapter":1,"number":129,"question":"What is self-supervised pre-training?\nSelf-supervised pre-training là gì?","options":[{"id":"LLM300-Q129-A","text":"Learning exclusively from annotated credit files\nChỉ học từ hồ sơ tín dụng đã gán nhãn"},{"id":"LLM300-Q129-B","text":"Learning only after deployment into production\nChỉ học sau khi triển khai"},{"id":"LLM300-Q129-C","text":"Learning solely from customer satisfaction polls\nChỉ học từ khảo sát hài lòng"},{"id":"LLM300-Q129-D","text":"Learning from objectives derived from text\nHọc từ mục tiêu suy ra từ văn bản"}],"correctOptionId":"LLM300-Q129-D","explanation":"Explanation (EN): Pre-training learns broad language patterns from large text data, including self-supervised prediction objectives. It precedes specialization and does not mean memorizing only the current chat.\nGiải thích (VI): Tiền huấn luyện học mẫu ngôn ngữ tổng quát từ văn bản lớn, có thể dùng mục tiêu dự đoán tự giám sát. Giai đoạn này diễn ra trước điều chỉnh chuyên biệt, không chỉ ghi nhớ cuộc hội thoại hiện tại.\nSlide reference / Đối chiếu slide: Ch.1, p.14; Ch.2, pp.45–47","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q130","chapter":2,"number":130,"question":"What does a reward model estimate?\nReward model ước lượng gì?","options":[{"id":"LLM300-Q130-A","text":"The temperature of physical GPU hardware\nNhiệt độ vật lý của GPU"},{"id":"LLM300-Q130-B","text":"The likely human preference for each answer\nKhả năng con người sẽ thích mỗi câu trả lời"},{"id":"LLM300-Q130-C","text":"The number of pixels on the user's display\nSố pixel màn hình người dùng"},{"id":"LLM300-Q130-D","text":"The fee charged for international transfers\nPhí chuyển tiền quốc tế"}],"correctOptionId":"LLM300-Q130-B","explanation":"Explanation (EN): Reinforcement Learning from Human Feedback uses human preference judgments and a reward model to align model responses with preferred behavior. Preference alignment does not guarantee that every fact is true.\nGiải thích (VI): RLHF dùng đánh giá sở thích con người và reward model để điều chỉnh câu trả lời theo hành vi được ưa thích. Phù hợp sở thích không bảo đảm mọi thông tin đều đúng.\nSlide reference / Đối chiếu slide: Ch.2, p.48","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q131","chapter":1,"number":131,"question":"What is the main purpose of a language model?\nMục đích chính của mô hình ngôn ngữ là gì?","options":[{"id":"LLM300-Q131-A","text":"Verify the physical origin of stored files\nKiểm chứng nguồn gốc vật lý của tệp"},{"id":"LLM300-Q131-B","text":"Encrypt sensitive records in large databases\nMã hóa hồ sơ nhạy cảm trong cơ sở dữ liệu"},{"id":"LLM300-Q131-C","text":"Estimate probabilities for sequences of text\nƯớc lượng xác suất của chuỗi văn bản"},{"id":"LLM300-Q131-D","text":"Execute fixed instructions in accounting software\nThực thi lệnh kế toán cố định"}],"correctOptionId":"LLM300-Q131-C","explanation":"Explanation (EN): A language model assigns probabilities to text sequences. A conditional model estimates the next word or token using preceding context rather than unrelated account information.\nGiải thích (VI): Mô hình ngôn ngữ gán xác suất cho chuỗi văn bản. Mô hình có điều kiện ước lượng từ hoặc token tiếp theo dựa trên ngữ cảnh trước, không dựa vào thông tin tài khoản không liên quan.\nSlide reference / Đối chiếu slide: Ch.1, pp.6–11","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q132","chapter":1,"number":132,"question":"What is a central role of an LLM in an AI system?\nVai trò cốt lõi của LLM trong hệ thống AI là gì?","options":[{"id":"LLM300-Q132-A","text":"Guaranteed accuracy of every data source\nĐộ chính xác được bảo đảm của mọi nguồn dữ liệu"},{"id":"LLM300-Q132-B","text":"Language understanding and generation\nHiểu và tạo sinh ngôn ngữ"},{"id":"LLM300-Q132-C","text":"Automatic approval of every high-risk action\nTự động phê duyệt hành động rủi ro cao"},{"id":"LLM300-Q132-D","text":"Physical authentication of user signatures\nXác thực chữ ký vật lý"}],"correctOptionId":"LLM300-Q132-B","explanation":"Explanation (EN): Natural Language Processing is an AI area concerned with analyzing, understanding and generating human language. LLMs provide language-related capabilities rather than guaranteed factual accuracy.\nGiải thích (VI): Xử lý ngôn ngữ tự nhiên là lĩnh vực AI nghiên cứu phân tích, hiểu và tạo sinh ngôn ngữ con người. LLM hỗ trợ tác vụ ngôn ngữ chứ không bảo đảm mọi dữ kiện chính xác.\nSlide reference / Đối chiếu slide: Ch.1, pp.5, 19; Ch.2, pp.18–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q133","chapter":2,"number":133,"question":"An assistant processes a chart image and accompanying text. Which capability is demonstrated?\nTrợ lý xử lý hình ảnh biểu đồ cùng văn bản đi kèm. Khả năng nào được thể hiện?","options":[{"id":"LLM300-Q133-A","text":"Automatically approving investment actions\nTự động duyệt hành động đầu tư"},{"id":"LLM300-Q133-B","text":"Guaranteeing accurate chart interpretation\nBảo đảm diễn giải biểu đồ chính xác"},{"id":"LLM300-Q133-C","text":"Operating only on plain text sequences\nChỉ xử lý chuỗi văn bản thuần"},{"id":"LLM300-Q133-D","text":"Processing multiple forms of input data\nXử lý nhiều dạng dữ liệu đầu vào"}],"correctOptionId":"LLM300-Q133-D","explanation":"Explanation (EN): A multimodal AI system can accept or process more than one input type, such as text together with images. This capability does not by itself guarantee interpretation accuracy.\nGiải thích (VI): AI đa phương thức có thể xử lý nhiều loại đầu vào, như văn bản cùng hình ảnh. Năng lực này không tự bảo đảm phân tích luôn đúng.\nSlide reference / Đối chiếu slide: Ch.2, pp.18–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q134","chapter":2,"number":134,"question":"What does conversation memory support?\nBộ nhớ hội thoại hỗ trợ điều gì?","options":[{"id":"LLM300-Q134-A","text":"Retaining useful user context when enabled\nLưu ngữ cảnh người dùng hữu ích khi được bật"},{"id":"LLM300-Q134-B","text":"Guaranteeing access to all private bank data\nBảo đảm truy cập toàn bộ dữ liệu riêng tư ngân hàng"},{"id":"LLM300-Q134-C","text":"Rewriting all neural weights after each reply\nViết lại trọng số nơ-ron sau mọi câu"},{"id":"LLM300-Q134-D","text":"Replacing authentication for financial transfers\nThay thế xác thực giao dịch tài chính"}],"correctOptionId":"LLM300-Q134-A","explanation":"Explanation (EN): Conversation memory can retain relevant user preferences and context when enabled, while remaining separate from the model’s permanent training weights.\nGiải thích (VI): Bộ nhớ hội thoại có thể lưu sở thích và ngữ cảnh hữu ích khi được bật, tách biệt với trọng số huấn luyện cố định của mô hình.\nSlide reference / Đối chiếu slide: Ch.2, p.24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q135","chapter":4,"number":135,"question":"What is a key concern in training-data preparation?\nMối quan tâm chính khi chuẩn bị dữ liệu huấn luyện là gì?","options":[{"id":"LLM300-Q135-A","text":"Publishing raw identity numbers with the dataset\nCông bố số định danh gốc cùng dữ liệu"},{"id":"LLM300-Q135-B","text":"Assuming every recorded field is correct\nMặc định mọi trường dữ liệu đúng"},{"id":"LLM300-Q135-C","text":"Cleaning data and protecting private details\nLàm sạch dữ liệu và bảo vệ thông tin riêng tư"},{"id":"LLM300-Q135-D","text":"Discarding all evaluation and quality checks\nBỏ mọi kiểm tra và đánh giá chất lượng"}],"correctOptionId":"LLM300-Q135-C","explanation":"Explanation (EN): Banking data can contain confidential customer identifiers or credentials. Data minimization, masking, legal safeguards and secure access reduce disclosure risks; an external service does not make these duties disappear.\nGiải thích (VI): Dữ liệu ngân hàng có thể chứa thông tin nhận dạng hoặc thông tin xác thực nhạy cảm. Giảm thiểu dữ liệu, che thông tin, bảo đảm cơ sở pháp lý và kiểm soát truy cập giúp hạn chế rò rỉ; dùng dịch vụ ngoài không làm mất trách nhiệm bảo vệ dữ liệu.\nSlide reference / Đối chiếu slide: Ch.4, pp.19–20; Ch.3, p.38","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q136","chapter":3,"number":136,"question":"A planner compares several candidate paths before choosing one. What is distinctive?\nBộ lập kế hoạch so sánh vài lộ trình ứng viên trước khi chọn một. Điểm đặc trưng là gì?","options":[{"id":"LLM300-Q136-A","text":"It explores branching candidate solutions\nKhám phá các nhánh lời giải ứng viên"},{"id":"LLM300-Q136-B","text":"It forbids comparing alternative decisions\nCấm so sánh các lựa chọn"},{"id":"LLM300-Q136-C","text":"It requires retraining the underlying model\nCần huấn luyện lại mô hình nền"},{"id":"LLM300-Q136-D","text":"It eliminates intermediate reasoning steps\nLoại bỏ mọi bước suy luận trung gian"}],"correctOptionId":"LLM300-Q136-A","explanation":"Explanation (EN): Tree of Thoughts explores multiple branching candidate reasoning paths before choosing one, unlike a single linear chain.\nGiải thích (VI): Tree of Thoughts khảo sát nhiều nhánh lời giải rồi chọn phương án, khác một chuỗi suy luận tuyến tính duy nhất.\nSlide reference / Đối chiếu slide: Ch.3, pp.30–33","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q137","chapter":4,"number":137,"question":"Why separate model development and approval roles?\nVì sao phải tách vai trò phát triển và phê duyệt mô hình?","options":[{"id":"LLM300-Q137-A","text":"Missing independent checks and accountability\nThiếu kiểm tra độc lập và trách nhiệm giải trình"},{"id":"LLM300-Q137-B","text":"Excessively high display resolution in the app\nĐộ phân giải ứng dụng quá cao"},{"id":"LLM300-Q137-C","text":"Inability to tokenize ordinary customer text\nKhông thể tách token văn bản thường"},{"id":"LLM300-Q137-D","text":"A shortage of colors in dashboard charts\nThiếu màu cho biểu đồ bảng điều khiển"}],"correctOptionId":"LLM300-Q137-A","explanation":"Explanation (EN): An AI model provides support, but the institution must retain control, independent checking, audit records and accountability for important outcomes. Outsourcing does not transfer the bank’s final responsibility.\nGiải thích (VI): AI chỉ hỗ trợ; tổ chức phải duy trì quyền kiểm soát, kiểm tra độc lập, nhật ký kiểm toán và trách nhiệm giải trình đối với kết quả quan trọng. Thuê dịch vụ ngoài không chuyển hết trách nhiệm cuối cùng của ngân hàng. QUESTION QUALITY NOTE / LƯU Ý ĐỀ: The wording asks why roles should be separated, but option A states the problem CAUSED BY failing to separate them. A is the intended choice, not a well-formed direct answer. Câu hỏi hỏi vì sao cần tách vai trò, nhưng A mô tả hệ quả khi KHÔNG tách vai trò. A là phương án được dự kiến, song diễn đạt chưa trực tiếp.\nLưu ý: Câu 137 có lỗi diễn đạt; phương án A mô tả vấn đề khi không kiểm tra độc lập.\nSlide reference / Đối chiếu slide: Ch.4, pp.19, 32, 52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q138","chapter":1,"number":138,"question":"What is supervised fine-tuning for?\nSupervised fine-tuning dùng để làm gì?","options":[{"id":"LLM300-Q138-A","text":"Adding more hardware fans to data centers\nThêm quạt phần cứng vào trung tâm dữ liệu"},{"id":"LLM300-Q138-B","text":"Reducing the screen width of the interface\nGiảm chiều rộng giao diện"},{"id":"LLM300-Q138-C","text":"Learning from curated task demonstrations\nHọc từ các ví dụ nhiệm vụ được tuyển chọn"},{"id":"LLM300-Q138-D","text":"Transferring a bank's legal responsibilities\nChuyển trách nhiệm pháp lý của ngân hàng"}],"correctOptionId":"LLM300-Q138-C","explanation":"Explanation (EN): Fine-tuning adjusts a pre-trained model for a target task, typically through training on specialized examples. Prompting instead changes the instructions without directly optimizing the model weights.\nGiải thích (VI): Fine-tuning điều chỉnh mô hình đã tiền huấn luyện cho nhiệm vụ đích bằng các ví dụ chuyên biệt. Prompting thay đổi chỉ dẫn mà không trực tiếp tối ưu trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.1, p.26; Ch.2, p.47","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q139","chapter":2,"number":139,"question":"Why are residual connections useful?\nVì sao residual connections có ích?","options":[{"id":"LLM300-Q139-A","text":"Replacing the entire training dataset\nThay toàn bộ dữ liệu huấn luyện"},{"id":"LLM300-Q139-B","text":"Supporting signal flow across deep layers\nHỗ trợ luồng tín hiệu qua các lớp sâu"},{"id":"LLM300-Q139-C","text":"Eliminating all hardware memory usage\nLoại bỏ mọi nhu cầu bộ nhớ"},{"id":"LLM300-Q139-D","text":"Guaranteeing that every sentence is true\nBảo đảm mọi câu đều đúng"}],"correctOptionId":"LLM300-Q139-B","explanation":"Explanation (EN): Residual connections preserve and combine a layer’s input with its transformed output, supporting information and gradient flow in deep Transformer networks.\nGiải thích (VI): Kết nối tắt (residual) kết hợp đầu vào lớp với đầu ra biến đổi, giúp tín hiệu và gradient truyền qua nhiều lớp Transformer sâu.\nSlide reference / Đối chiếu slide: Ch.2, pp.28, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q140","chapter":4,"number":140,"question":"How should a customer-service system handle out-of-scope questions?\nHệ thống chăm sóc khách hàng nên xử lý câu hỏi ngoài phạm vi như thế nào?","options":[{"id":"LLM300-Q140-A","text":"Pretend that it has approved every product\nGiả vờ đã duyệt mọi sản phẩm"},{"id":"LLM300-Q140-B","text":"Generate advice without indicating the limits\nĐưa lời khuyên mà không nêu giới hạn"},{"id":"LLM300-Q140-C","text":"Decline or transfer to an authorized channel\nTừ chối hoặc chuyển đến kênh có thẩm quyền"},{"id":"LLM300-Q140-D","text":"Change the institution's policy autonomously\nTự thay đổi chính sách tổ chức"}],"correctOptionId":"LLM300-Q140-C","explanation":"Explanation (EN): Banking chatbots are best used for repeated customer requests and verified in-app assistance. Unresolved or sensitive issues should be escalated to authorized human staff, not resolved by inventing an answer.\nGiải thích (VI): Chatbot ngân hàng phù hợp với các yêu cầu lặp lại và hỗ trợ trong ứng dụng đã xác thực. Vấn đề nhạy cảm hoặc chưa xử lý được phải chuyển nhân viên có thẩm quyền, không được bịa câu trả lời.\nSlide reference / Đối chiếu slide: Ch.4, pp.11–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q141","chapter":2,"number":141,"question":"Which task belongs to a content moderation system?\nNhiệm vụ nào thuộc hệ thống kiểm duyệt nội dung?","options":[{"id":"LLM300-Q141-A","text":"A safety and content screening layer\nLớp rà soát nội dung và an toàn"},{"id":"LLM300-Q141-B","text":"A token position representation table\nBảng biểu diễn vị trí token"},{"id":"LLM300-Q141-C","text":"A GPU memory-allocation subroutine\nHàm phân bổ bộ nhớ GPU"},{"id":"LLM300-Q141-D","text":"A pre-training text collection script\nTập lệnh thu thập văn bản tiền huấn luyện"}],"correctOptionId":"LLM300-Q141-A","explanation":"Explanation (EN): Content moderation and multiple technical/human safeguards screen unsafe requests and outputs. Checking only one side can miss a harmful instruction or an unsafe response.\nGiải thích (VI): Kiểm duyệt nội dung và nhiều lớp bảo vệ kỹ thuật/con người giúp sàng lọc yêu cầu và đầu ra không an toàn. Chỉ kiểm tra một phía có thể bỏ sót yêu cầu độc hại hoặc câu trả lời nguy hiểm.\nSlide reference / Đối chiếu slide: Ch.2, p.25; Ch.3, p.40","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q142","chapter":3,"number":142,"question":"What does model evaluation measure?\nĐánh giá mô hình đo lường gì?","options":[{"id":"LLM300-Q142-A","text":"Issuing permissions to individual customers\nCấp quyền cho từng khách hàng"},{"id":"LLM300-Q142-B","text":"Creating a new social media interface\nTạo giao diện mạng xã hội mới"},{"id":"LLM300-Q142-C","text":"Assessing the trained model's performance\nĐánh giá hiệu năng mô hình đã huấn luyện"},{"id":"LLM300-Q142-D","text":"Rewriting all labels in the evaluation set\nViết lại toàn bộ nhãn dữ liệu đánh giá"}],"correctOptionId":"LLM300-Q142-C","explanation":"Explanation (EN): Evaluation checks model performance, failures and edge cases using test inputs, including inconsistent data. A convincing response should not replace actual verification.\nGiải thích (VI): Đánh giá kiểm tra hiệu năng, sai sót và trường hợp biên bằng dữ liệu thử, kể cả dữ liệu mâu thuẫn. Câu trả lời có vẻ thuyết phục không thay thế việc xác minh.\nSlide reference / Đối chiếu slide: Ch.3, pp.10, 24; Ch.4, p.32","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q143","chapter":1,"number":143,"question":"What does a trigram typically contain?\nTrigram thường chứa gì?","options":[{"id":"LLM300-Q143-A","text":"Three consecutive words from a sequence\nBa từ liên tiếp trong một chuỗi"},{"id":"LLM300-Q143-B","text":"Three independent documents from a folder\nBa tài liệu độc lập trong thư mục"},{"id":"LLM300-Q143-C","text":"Three numeric outputs from a classifier\nBa đầu ra số từ bộ phân loại"},{"id":"LLM300-Q143-D","text":"Three separate labels assigned by experts\nBa nhãn riêng từ chuyên gia"}],"correctOptionId":"LLM300-Q143-A","explanation":"Explanation (EN): An N-gram uses a limited preceding context: an N-gram sequence contains N consecutive words, and a next-word prediction conditions on N−1 previous words. In a sentence of m words, there are m −N+1 overlapping N-grams.\nGiải thích (VI): N-gram dùng ngữ cảnh trước có giới hạn: một nhóm gồm N từ liên tiếp và việc đoán từ tiếp theo dựa vào N−1 từ trước. Câu có m từ tạo được m−N+1 nhóm N-gram chồng lấp.\nSlide reference / Đối chiếu slide: Ch.1, pp.6–9","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q144","chapter":2,"number":144,"question":"An assistant can use saved preferences during later interactions. What is the relevant function?\nTrợ lý dùng sở thích đã lưu trong những lần tương tác sau. Chức năng liên quan là gì?","options":[{"id":"LLM300-Q144-A","text":"Retaining useful user context when enabled\nLưu ngữ cảnh người dùng hữu ích khi được bật"},{"id":"LLM300-Q144-B","text":"Replacing authentication for financial transfers\nThay thế xác thực giao dịch tài chính"},{"id":"LLM300-Q144-C","text":"Guaranteeing access to all private bank data\nBảo đảm truy cập dữ liệu bí mật ngân hàng"},{"id":"LLM300-Q144-D","text":"Rewriting all neural weights after each reply\nViết lại trọng số nơ-ron sau mỗi lần trả lời"}],"correctOptionId":"LLM300-Q144-A","explanation":"Explanation (EN): Conversation memory can retain relevant user preferences and context when enabled, while remaining separate from the model’s permanent training weights.\nGiải thích (VI): Bộ nhớ hội thoại có thể lưu sở thích và ngữ cảnh hữu ích khi được bật, tách biệt với trọng số huấn luyện cố định của mô hình.\nSlide reference / Đối chiếu slide: Ch.2, p.24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q145","chapter":2,"number":145,"question":"Which architecture family underlies modern GPT models?\nHọ kiến trúc nào là nền tảng của GPT hiện đại?","options":[{"id":"LLM300-Q145-A","text":"The manually scripted decision-rule family\nHọ quy tắc quyết định viết tay"},{"id":"LLM300-Q145-B","text":"The purely statistical bigram model family\nHọ mô hình bigram thống kê thuần túy"},{"id":"LLM300-Q145-C","text":"The Transformer neural network family\nHọ mạng nơ-ron Transformer"},{"id":"LLM300-Q145-D","text":"The traditional spreadsheet formula family\nHọ công thức bảng tính truyền thống"}],"correctOptionId":"LLM300-Q145-C","explanation":"Explanation (EN): Transformer is the attention-based neural network architecture underlying GPT. It models token interactions rather than relying solely on N-gram count tables.\nGiải thích (VI): Transformer là kiến trúc mạng nơ-ron dùng attention làm nền tảng của GPT; mô hình hóa tương tác token thay vì chỉ dựa bảng đếm N-gram.\nSlide reference / Đối chiếu slide: Ch.2, pp.28, 38–41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q146","chapter":3,"number":146,"question":"What does a word limit accomplish in a prompt?\nGiới hạn số từ trong prompt giúp đạt điều gì?","options":[{"id":"LLM300-Q146-A","text":"The number of neural network attention heads\nSố đầu attention của mạng nơ-ron"},{"id":"LLM300-Q146-B","text":"The physical capacity of a document drive\nDung lượng vật lý ổ đĩa"},{"id":"LLM300-Q146-C","text":"The length of the generated response\nĐộ dài câu trả lời tạo ra"},{"id":"LLM300-Q146-D","text":"The amount of training data available\nLượng dữ liệu huấn luyện"}],"correctOptionId":"LLM300-Q146-C","explanation":"Explanation (EN): Output length or max output tokens caps how much text can be generated. A short cap may truncate the answer; generation also stops on an end token.\nGiải thích (VI): Độ dài đầu ra hoặc max output tokens giới hạn lượng văn bản tạo ra. Giới hạn thấp có thể làm câu trả lời bị cắt; token kết thúc cũng có thể dừng việc tạo sinh.\nSlide reference / Đối chiếu slide: Ch.3, pp.11–12; Ch.2, p.44","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q147","chapter":1,"number":147,"question":"Which task demonstrates text generation?\nNhiệm vụ nào thể hiện khả năng tạo văn bản?","options":[{"id":"LLM300-Q147-A","text":"Creating new language-based content\nTạo nội dung ngôn ngữ mới"},{"id":"LLM300-Q147-B","text":"Sorting physical letters by postmark\nSắp xếp thư giấy theo dấu bưu điện"},{"id":"LLM300-Q147-C","text":"Measuring a chip's electrical resistance\nĐo điện trở của chip"},{"id":"LLM300-Q147-D","text":"Scanning a paper form into an image\nQuét biểu mẫu giấy thành ảnh"}],"correctOptionId":"LLM300-Q147-A","explanation":"Explanation (EN): Natural Language Processing is an AI area concerned with analyzing, understanding and generating human language. LLMs provide language-related capabilities rather than guaranteed factual accuracy.\nGiải thích (VI): Xử lý ngôn ngữ tự nhiên là lĩnh vực AI nghiên cứu phân tích, hiểu và tạo sinh ngôn ngữ con người. LLM hỗ trợ tác vụ ngôn ngữ chứ không bảo đảm mọi dữ kiện chính xác.\nSlide reference / Đối chiếu slide: Ch.1, pp.5, 19; Ch.2, pp.18–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q148","chapter":3,"number":148,"question":"Customers interact with automated financial support. Which principle is served?\nKhách hàng tương tác với hỗ trợ tài chính tự động. Nguyên tắc nào được đáp ứng?","options":[{"id":"LLM300-Q148-A","text":"Transparency about the use of automation\nMinh bạch về việc sử dụng tự động hóa"},{"id":"LLM300-Q148-B","text":"Avoiding all data-protection requirements\nTránh mọi yêu cầu bảo vệ dữ liệu"},{"id":"LLM300-Q148-C","text":"Removing accountability from the bank\nLoại bỏ trách nhiệm ngân hàng"},{"id":"LLM300-Q148-D","text":"Guaranteeing that every suggestion is correct\nBảo đảm mọi gợi ý đều đúng"}],"correctOptionId":"LLM300-Q148-A","explanation":"Explanation (EN): Responsible AI requires fairness assessment, transparency and human control. Automation does not remove a bank’s obligations to explain and oversee high-stakes outcomes.\nGiải thích (VI): AI có trách nhiệm cần đánh giá công bằng, minh bạch và kiểm soát của con người. Tự động hóa không xóa nghĩa vụ giải thích và giám sát các quyết định quan trọng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.3, p.40; Ch.4, p.52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q149","chapter":3,"number":149,"question":"Why does prompt specificity matter?\nVì sao tính cụ thể của prompt quan trọng?","options":[{"id":"LLM300-Q149-A","text":"Elimination of every possible processing cost\nLoại bỏ mọi chi phí xử lý"},{"id":"LLM300-Q149-B","text":"Modification of the model's pretrained weights\nThay đổi trọng số tiền huấn luyện"},{"id":"LLM300-Q149-C","text":"Automatic access to confidential third-party data\nTự truy cập dữ liệu bí mật bên thứ ba"},{"id":"LLM300-Q149-D","text":"Less ambiguity about the desired response\nGiảm mơ hồ về đầu ra mong muốn"}],"correctOptionId":"LLM300-Q149-D","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q150","chapter":1,"number":150,"question":"Why might few-shot prompting improve consistency?\nVì sao few-shot prompting có thể tăng tính nhất quán?","options":[{"id":"LLM300-Q150-A","text":"The exact weights of all hidden layers\nTrọng số chính xác của mọi lớp ẩn"},{"id":"LLM300-Q150-B","text":"The desired pattern for task completion\nMẫu xử lý nhiệm vụ mong muốn"},{"id":"LLM300-Q150-C","text":"The total cost of training the base model\nTổng chi phí huấn luyện mô hình cơ sở"},{"id":"LLM300-Q150-D","text":"The amount of internet bandwidth available\nDung lượng Internet sẵn có"}],"correctOptionId":"LLM300-Q150-B","explanation":"Explanation (EN): Few-shot in-context learning supplies several demonstrations inside the prompt. The model infers the desired pattern from these examples without changing its permanent weights.\nGiải thích (VI): Few-shot cung cấp một số ví dụ ngay trong prompt. Mô hình suy ra cách làm từ ví dụ mà không thay đổi vĩnh viễn trọng số đã huấn luyện.\nSlide reference / Đối chiếu slide: Ch.1, pp.24–25; Ch.3, p.27","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q151","chapter":3,"number":151,"question":"What should a model do when its evidence is weak?\nMô hình nên làm gì khi bằng chứng yếu?","options":[{"id":"LLM300-Q151-A","text":"Fabricate a citation to look more reliable\nBịa trích dẫn để trông đáng tin"},{"id":"LLM300-Q151-B","text":"Remove all mention of missing information\nXóa mọi đề cập thông tin còn thiếu"},{"id":"LLM300-Q151-C","text":"Present an unsupported statement as certain\nNêu khẳng định thiếu căn cứ như chắc chắn"},{"id":"LLM300-Q151-D","text":"Acknowledge that support is insufficient\nThừa nhận chứng cứ chưa đủ"}],"correctOptionId":"LLM300-Q151-D","explanation":"Explanation (EN): Grounding bases claims and extracted fields on identifiable source material. When evidence is absent, state that fact or leave the field blank rather than inventing figures or citations.\nGiải thích (VI): Grounding yêu cầu khẳng định và trường trích xuất dựa trên nguồn xác định. Nếu không có bằng chứng, phải ghi thiếu hoặc để trống thay vì bịa số liệu hay trích dẫn.\nSlide reference / Đối chiếu slide: Ch.3, pp.35–37; Ch.4, p.10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q152","chapter":3,"number":152,"question":"What does top-p sampling restrict?\nTop-P sampling hạn chế điều gì?","options":[{"id":"LLM300-Q152-A","text":"Selecting only words that appear in the PDF\nChỉ chọn từ có trong PDF"},{"id":"LLM300-Q152-B","text":"Restricting results to a fixed token count\nGiới hạn kết quả vào số token cố định"},{"id":"LLM300-Q152-C","text":"Sorting candidate tokens by their text length\nSắp token theo độ dài văn bản"},{"id":"LLM300-Q152-D","text":"Nucleus sampling based on cumulative mass\nLấy mẫu nucleus dựa trên tổng xác suất tích lũy"}],"correctOptionId":"LLM300-Q152-D","explanation":"Explanation (EN): Top-P (nucleus sampling) chooses from the smallest candidate set whose cumulative probability reaches a selected threshold, rather than a fixed number of tokens.\nGiải thích (VI): Top-P (lấy mẫu nucleus) chọn trong tập ứng viên nhỏ nhất có tổng xác suất tích lũy đạt ngưỡng đặt trước, không phải số token cố định.\nSlide reference / Đối chiếu slide: Ch.3, p.14","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q153","chapter":1,"number":153,"question":"A model uses a Transformer encoder for language understanding. Which name fits?\nMô hình dùng bộ mã hóa Transformer để hiểu ngôn ngữ. Tên nào phù hợp?","options":[{"id":"LLM300-Q153-A","text":"GPT and related decoder-based models\nGPT và mô hình dùng decoder"},{"id":"LLM300-Q153-B","text":"BERT and related encoder-based models\nBERT và mô hình dùng encoder"},{"id":"LLM300-Q153-C","text":"A simple count-based bigram predictor\nMô hình bigram đếm đơn giản"},{"id":"LLM300-Q153-D","text":"T5 and related encoder-decoder models\nT5 và mô hình encoder-decoder"}],"correctOptionId":"LLM300-Q153-B","explanation":"Explanation (EN): GPT belongs to the decoder-only Transformer family and is oriented toward text generation. BERT is an encoder-only model for language representations; T5/BART use encoder–decoder structures.\nGiải thích (VI): GPT thuộc họ Transformer decoder-only, thiên về tạo sinh văn bản. BERT thuộc nhóm encoder-only để biểu diễn và hiểu ngôn ngữ; T5/BART dùng kiến trúc encoder–decoder.\nSlide reference / Đối chiếu slide: Ch.1, p.12; Ch.2, pp.27–28","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q154","chapter":4,"number":154,"question":"Which activity is sentiment analysis?\nHoạt động nào là phân tích cảm xúc?","options":[{"id":"LLM300-Q154-A","text":"Converting all text into image pixels\nChuyển mọi chữ thành pixel ảnh"},{"id":"LLM300-Q154-B","text":"Calculating a building's energy consumption\nTính năng lượng tiêu thụ của tòa nhà"},{"id":"LLM300-Q154-C","text":"Encrypting the source document for storage\nMã hóa tài liệu nguồn để lưu"},{"id":"LLM300-Q154-D","text":"Classifying the tone of financial text\nPhân loại sắc thái của văn bản tài chính"}],"correctOptionId":"LLM300-Q154-D","explanation":"Explanation (EN): Sentiment analysis classifies attitudes in financial texts, often positive, negative or neutral. Duplicate articles should not be counted repeatedly because they distort aggregate signals and do not guarantee future returns.\nGiải thích (VI): Phân tích cảm xúc phân loại sắc thái văn bản tài chính, thường là tích cực, tiêu cực hoặc trung lập. Tin trùng cần được loại vì đếm lặp làm lệch tín hiệu tổng hợp và không dự đoán chắc chắn lợi nhuận tương lai.\nSlide reference / Đối chiếu slide: Ch.4, pp.40–46","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q155","chapter":2,"number":155,"question":"What does token embedding provide?\nToken embedding cung cấp điều gì?","options":[{"id":"LLM300-Q155-A","text":"A real-time check against public databases\nKiểm tra thời gian thực với cơ sở dữ liệu công khai"},{"id":"LLM300-Q155-B","text":"A manual label entered for every sentence\nNhãn thủ công cho mỗi câu"},{"id":"LLM300-Q155-C","text":"A numeric representation for each token\nBiểu diễn số của mỗi token"},{"id":"LLM300-Q155-D","text":"A document signature issued by a lawyer\nChữ ký tài liệu từ luật sư"}],"correctOptionId":"LLM300-Q155-C","explanation":"Explanation (EN): An embedding represents a word or token as a numerical vector learned from data, helping the model work with language representations rather than raw characters alone.\nGiải thích (VI): Embedding biểu diễn từ hoặc token dưới dạng vectơ số học được từ dữ liệu, giúp mô hình xử lý các biểu diễn ngôn ngữ thay vì chỉ ký tự thô.\nSlide reference / Đối chiếu slide: Ch.2, pp.32–33; Ch.1, p.5","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q156","chapter":1,"number":156,"question":"A large system beats a smaller one on some tasks but not all. Which interpretation is sound?\nHệ thống lớn hơn vượt hệ thống nhỏ ở vài tác vụ nhưng không phải tất cả. Cách hiểu nào đúng?","options":[{"id":"LLM300-Q156-A","text":"Every metric must rise as parameters rise\nMọi thước đo phải tăng theo số tham số"},{"id":"LLM300-Q156-B","text":"Larger models need no quality evaluation\nMô hình lớn không cần kiểm định"},{"id":"LLM300-Q156-C","text":"Greater size does not ensure every improvement\nQuy mô lớn hơn không bảo đảm mọi mặt đều tốt hơn"},{"id":"LLM300-Q156-D","text":"Model size directly certifies answer truth\nKích thước mô hình trực tiếp chứng minh độ đúng"}],"correctOptionId":"LLM300-Q156-C","explanation":"Explanation (EN): Model scale involves parameters, training tokens, compute and energy. Larger systems can be costly and do not automatically outperform smaller models on every task, so suitability and evaluation matter.\nGiải thích (VI): Quy mô mô hình liên quan đến tham số, token huấn luyện, năng lực tính toán và năng lượng. Mô hình lớn tốn kém và không tự động tốt hơn ở mọi tác vụ; cần xét tính phù hợp và đánh giá.\nSlide reference / Đối chiếu slide: Ch.1, pp.15–18, 30–31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q157","chapter":2,"number":157,"question":"What is self-attention used for?\nSelf-attention được dùng để làm gì?","options":[{"id":"LLM300-Q157-A","text":"Saving a complete copy of every web page\nLưu bản sao mọi trang web"},{"id":"LLM300-Q157-B","text":"Computing relationships among token positions\nTính toán mối quan hệ giữa các vị trí token"},{"id":"LLM300-Q157-C","text":"Changing the screen theme for each user\nĐổi giao diện cho từng người"},{"id":"LLM300-Q157-D","text":"Assigning fixed transaction fees to customers\nẤn định phí giao dịch cho khách hàng"}],"correctOptionId":"LLM300-Q157-B","explanation":"Explanation (EN): Self-attention measures relationships among tokens. Multiple attention heads can learn different relationships in parallel; a single head does not provide the same diversity.\nGiải thích (VI): Self-attention tính mối liên hệ giữa các token. Nhiều đầu attention học các kiểu quan hệ khác nhau song song; một đầu đơn lẻ không có cùng độ đa dạng biểu diễn.\nSlide reference / Đối chiếu slide: Ch.2, pp.35–37","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q158","chapter":3,"number":158,"question":"What does the context element in RCTF provide?\nYếu tố Context trong RCTF cung cấp gì?","options":[{"id":"LLM300-Q158-A","text":"A database index for transaction records\nChỉ mục cơ sở dữ liệu giao dịch"},{"id":"LLM300-Q158-B","text":"A command to increase model parameters\nLệnh tăng tham số mô hình"},{"id":"LLM300-Q158-C","text":"Background needed to interpret the task\nBối cảnh cần thiết để hiểu nhiệm vụ"},{"id":"LLM300-Q158-D","text":"A requirement to discard source materials\nYêu cầu bỏ tài liệu nguồn"}],"correctOptionId":"LLM300-Q158-C","explanation":"Explanation (EN): The RCTF structure states Role (perspective), Context (background), Task (required operation) and Format (output structure). Assigning a role does not change source facts or model weights.\nGiải thích (VI): RCTF gồm Role (vai trò/góc nhìn), Context (bối cảnh), Task (nhiệm vụ) và Format (cấu trúc đầu ra). Gán vai trò không thay đổi dữ kiện nguồn hoặc trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.3, pp.16–23","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q159","chapter":2,"number":159,"question":"Which component introduces nonlinearity after attention?\nThành phần nào tạo tính phi tuyến sau attention?","options":[{"id":"LLM300-Q159-A","text":"A browser's local file-download dialog\nHộp thoại tải tệp từ trình duyệt"},{"id":"LLM300-Q159-B","text":"A position-wise feed-forward network\nMạng truyền thẳng theo vị trí"},{"id":"LLM300-Q159-C","text":"A database's fixed primary-key constraint\nKhóa chính cố định của cơ sở dữ liệu"},{"id":"LLM300-Q159-D","text":"A spreadsheet's conditional formatting rule\nQuy tắc định dạng có điều kiện bảng tính"}],"correctOptionId":"LLM300-Q159-B","explanation":"Explanation (EN): Transformer decoder layers include position-wise feed-forward transformations after attention. These add nonlinear processing to the token representations.\nGiải thích (VI): Các lớp decoder Transformer chứa mạng truyền thẳng theo vị trí sau attention, bổ sung phép biến đổi phi tuyến cho biểu diễn token.\nSlide reference / Đối chiếu slide: Ch.2, pp.28, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q160","chapter":4,"number":160,"question":"What helps mitigate numerical errors in LLM reports?\nĐiều gì giúp giảm lỗi số liệu trong báo cáo LLM?","options":[{"id":"LLM300-Q160-A","text":"Omit numeric references from the final report\nBỏ dẫn chứng số trong báo cáo"},{"id":"LLM300-Q160-B","text":"Accept all figures because wording is fluent\nTin mọi số vì câu chữ lưu loát"},{"id":"LLM300-Q160-C","text":"Verify each critical figure against its source\nĐối chiếu từng số quan trọng với nguồn"},{"id":"LLM300-Q160-D","text":"Increase temperature to maximize creativity\nTăng temperature để sáng tạo tối đa"}],"correctOptionId":"LLM300-Q160-C","explanation":"Explanation (EN): AI-generated financial figures must be checked against original source documents. Fluent writing is not evidence that an amount or percentage was correctly extracted.\nGiải thích (VI): Số liệu tài chính do AI tạo phải được đối chiếu với chứng từ gốc. Văn phong trôi chảy không chứng minh số tiền hay tỷ lệ đã được trích xuất chính xác.\nSlide reference / Đối chiếu slide: Ch.4, pp.8–10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q161","chapter":3,"number":161,"question":"What is prompt documentation for?\nTài liệu hóa prompt nhằm mục đích gì?","options":[{"id":"LLM300-Q161-A","text":"Manage prompts as reusable workflow assets\nQuản lý prompt như tài sản quy trình dùng lại"},{"id":"LLM300-Q161-B","text":"Guarantee that every future response is true\nBảo đảm mọi câu trả lời tương lai đều đúng"},{"id":"LLM300-Q161-C","text":"Stop updating any operational procedures\nNgừng cập nhật quy trình vận hành"},{"id":"LLM300-Q161-D","text":"Replace secure model access with a public link\nThay truy cập bảo mật bằng liên kết công khai"}],"correctOptionId":"LLM300-Q161-A","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q162","chapter":4,"number":162,"question":"Why include Vietnamese terminology context?\nVì sao cần cung cấp ngữ cảnh thuật ngữ tiếng Việt?","options":[{"id":"LLM300-Q162-A","text":"Remove all accents from every legal document\nBỏ toàn bộ dấu tiếng Việt trong văn bản luật"},{"id":"LLM300-Q162-B","text":"Give relevant local terms and conventions\nCung cấp thuật ngữ và quy ước địa phương liên quan"},{"id":"LLM300-Q162-C","text":"Depend solely on general English definitions\nChỉ dựa vào định nghĩa tiếng Anh chung"},{"id":"LLM300-Q162-D","text":"Assume that all abbreviations mean the same\nCho rằng mọi chữ viết tắt đều cùng nghĩa"}],"correctOptionId":"LLM300-Q162-B","explanation":"Explanation (EN): Vietnamese banking tasks benefit from local terms, abbreviations and conventions. Context prevents generic English meanings from misreading locally used financial language.\nGiải thích (VI): Tác vụ ngân hàng Việt Nam cần thuật ngữ, chữ viết tắt và quy ước địa phương. Ngữ cảnh giúp tránh hiểu sai thuật ngữ tài chính theo nghĩa tiếng Anh chung.\nSlide reference / Đối chiếu slide: Ch.4, pp.23, 45","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q163","chapter":2,"number":163,"question":"Information bypasses a transformation and is combined with its output. What is the purpose?\nThông tin đi đường tắt qua phép biến đổi rồi kết hợp với đầu ra. Mục đích là gì?","options":[{"id":"LLM300-Q163-A","text":"Supporting signal flow across deep layers\nHỗ trợ luồng tín hiệu qua các lớp sâu"},{"id":"LLM300-Q163-B","text":"Replacing the entire training dataset\nThay toàn bộ dữ liệu huấn luyện"},{"id":"LLM300-Q163-C","text":"Guaranteeing that every sentence is true\nBảo đảm mọi câu đều đúng"},{"id":"LLM300-Q163-D","text":"Eliminating all hardware memory usage\nLoại bỏ toàn bộ bộ nhớ phần cứng"}],"correctOptionId":"LLM300-Q163-A","explanation":"Explanation (EN): Residual connections preserve and combine a layer’s input with its transformed output, supporting information and gradient flow in deep Transformer networks.\nGiải thích (VI): Kết nối tắt (residual) kết hợp đầu vào lớp với đầu ra biến đổi, giúp tín hiệu và gradient truyền qua nhiều lớp Transformer sâu.\nSlide reference / Đối chiếu slide: Ch.2, pp.28, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q164","chapter":4,"number":164,"question":"Why should a loan decision involve human oversight?\nVì sao quyết định cho vay cần sự giám sát của con người?","options":[{"id":"LLM300-Q164-A","text":"The language model acting without review\nMô hình ngôn ngữ tự quyết không rà soát"},{"id":"LLM300-Q164-B","text":"An authorized bank decision-maker\nNgười ra quyết định ngân hàng được ủy quyền"},{"id":"LLM300-Q164-C","text":"A randomly selected internet user\nNgười dùng Internet chọn ngẫu nhiên"},{"id":"LLM300-Q164-D","text":"The file-upload interface controlling access\nGiao diện tải tệp kiểm soát truy cập"}],"correctOptionId":"LLM300-Q164-B","explanation":"Explanation (EN): Human oversight keeps consequential credit, reporting and customer decisions with authorized staff. An AI draft or recommendation must be reviewed before final approval or sending.\nGiải thích (VI): Giám sát con người bảo đảm quyết định tín dụng, báo cáo và hỗ trợ khách hàng quan trọng thuộc nhân sự được ủy quyền. Bản nháp hoặc khuyến nghị AI phải được kiểm tra trước khi phê duyệt hoặc gửi.\nSlide reference / Đối chiếu slide: Ch.4, pp.8, 19, 27, 32","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q165","chapter":3,"number":165,"question":"What happens when the output token limit is too small?\nĐiều gì xảy ra khi giới hạn token đầu ra quá nhỏ?","options":[{"id":"LLM300-Q165-A","text":"The screen width made the model forget\nChiều rộng màn hình khiến mô hình quên"},{"id":"LLM300-Q165-B","text":"The output was truncated by a length cap\nĐầu ra bị cắt bởi giới hạn độ dài"},{"id":"LLM300-Q165-C","text":"The account balance changed during output\nSố dư tài khoản thay đổi khi tạo văn bản"},{"id":"LLM300-Q165-D","text":"The model's training dataset was deleted\nDữ liệu huấn luyện bị xóa"}],"correctOptionId":"LLM300-Q165-B","explanation":"Explanation (EN): Output length or max output tokens caps how much text can be generated. A short cap may truncate the answer; generation also stops on an end token.\nGiải thích (VI): Độ dài đầu ra hoặc max output tokens giới hạn lượng văn bản tạo ra. Giới hạn thấp có thể làm câu trả lời bị cắt; token kết thúc cũng có thể dừng việc tạo sinh.\nSlide reference / Đối chiếu slide: Ch.3, pp.11–12; Ch.2, p.44","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q166","chapter":4,"number":166,"question":"Why deduplicate financial news before sentiment aggregation?\nVì sao cần loại tin trùng trước khi tổng hợp cảm xúc tài chính?","options":[{"id":"LLM300-Q166-A","text":"Converting all sentiment labels to neutral\nChuyển mọi nhãn cảm xúc thành trung tính"},{"id":"LLM300-Q166-B","text":"Automatically correcting the source's claims\nTự sửa mọi tuyên bố của nguồn"},{"id":"LLM300-Q166-C","text":"Reducing the vocabulary size of the model\nGiảm số từ vựng mô hình"},{"id":"LLM300-Q166-D","text":"Counting the same news event repeatedly\nĐếm lặp lại một sự kiện tin tức"}],"correctOptionId":"LLM300-Q166-D","explanation":"Explanation (EN): Sentiment analysis classifies attitudes in financial texts, often positive, negative or neutral. Duplicate articles should not be counted repeatedly because they distort aggregate signals and do not guarantee future returns.\nGiải thích (VI): Phân tích cảm xúc phân loại sắc thái văn bản tài chính, thường là tích cực, tiêu cực hoặc trung lập. Tin trùng cần được loại vì đếm lặp làm lệch tín hiệu tổng hợp và không dự đoán chắc chắn lợi nhuận tương lai.\nSlide reference / Đối chiếu slide: Ch.4, pp.40–46","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q167","chapter":3,"number":167,"question":"A model is asked to critique its completed extraction table. What control is used?\nYêu cầu mô hình phản biện bảng trích xuất vừa hoàn thành. Đây là biện pháp kiểm soát nào?","options":[{"id":"LLM300-Q167-A","text":"Automatically approving an unverified draft\nTự duyệt bản nháp chưa xác minh"},{"id":"LLM300-Q167-B","text":"Changing the account's assigned risk score\nThay đổi điểm rủi ro tài khoản"},{"id":"LLM300-Q167-C","text":"Reviewing an output for possible mistakes\nRà soát đầu ra tìm sai sót"},{"id":"LLM300-Q167-D","text":"Creating new values for empty input fields\nBịa giá trị cho trường đầu vào trống"}],"correctOptionId":"LLM300-Q167-C","explanation":"Explanation (EN): Self-checking reviews generated output for mistakes or missing evidence. Self-consistency compares several independent reasoning results, which may improve robustness but uses additional computation.\nGiải thích (VI): Tự kiểm tra rà soát đầu ra để tìm lỗi hoặc thiếu chứng cứ. Self-consistency so sánh nhiều kết quả suy luận để tăng độ vững nhưng cần thêm tài nguyên tính toán.\nSlide reference / Đối chiếu slide: Ch.3, pp.24, 30–32, 37","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q168","chapter":4,"number":168,"question":"Which is a common LLM application in finance?\nỨng dụng LLM phổ biến trong tài chính là gì?","options":[{"id":"LLM300-Q168-A","text":"Electronic replacement of payment terminals\nThay điện tử toàn bộ máy quẹt thẻ"},{"id":"LLM300-Q168-B","text":"Automatic creation of legal regulations\nTự động tạo quy định pháp luật"},{"id":"LLM300-Q168-C","text":"Physical transport of bank correspondence\nVận chuyển thư ngân hàng bằng tay"},{"id":"LLM300-Q168-D","text":"Summarization of financial documents\nTóm tắt tài liệu tài chính"}],"correctOptionId":"LLM300-Q168-D","explanation":"Explanation (EN): For business reports, LLMs should create drafts or structured summaries from supplied sources. A fixed template supports consistency, and staff must verify high-stakes numbers before publication.\nGiải thích (VI): Với báo cáo nghiệp vụ, LLM nên tạo bản nháp hoặc tóm tắt có cấu trúc dựa trên nguồn cung cấp. Mẫu cố định giữ sự nhất quán và nhân viên phải kiểm chứng số liệu quan trọng trước khi công bố.\nSlide reference / Đối chiếu slide: Ch.4, pp.6–10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q169","chapter":3,"number":169,"question":"What is meta-prompting?\nMeta-prompting là gì?","options":[{"id":"LLM300-Q169-A","text":"Generating one random completion per request\nTạo ngẫu nhiên một câu trả lời"},{"id":"LLM300-Q169-B","text":"Removing the need for any human review\nKhông cần người rà soát"},{"id":"LLM300-Q169-C","text":"Retraining the model from unlabeled articles\nHuấn luyện lại bằng bài báo không nhãn"},{"id":"LLM300-Q169-D","text":"Using AI to design another effective prompt\nDùng AI thiết kế một prompt hiệu quả khác"}],"correctOptionId":"LLM300-Q169-D","explanation":"Explanation (EN): Meta-prompting uses AI to propose or improve another prompt. The user must review, test and finalize that proposal instead of assuming it is verified.\nGiải thích (VI): Meta-prompting dùng AI để đề xuất hoặc cải thiện prompt khác. Người dùng vẫn phải rà soát, thử nghiệm và chốt prompt chứ không mặc định đề xuất đã đúng.\nSlide reference / Đối chiếu slide: Ch.3, pp.28–29","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q170","chapter":3,"number":170,"question":"What does the task element in RCTF define?\nYếu tố Task trong RCTF xác định điều gì?","options":[{"id":"LLM300-Q170-A","text":"The hardware where a model was trained\nPhần cứng nơi huấn luyện mô hình"},{"id":"LLM300-Q170-B","text":"The operation to be performed by the model\nThao tác mô hình phải thực hiện"},{"id":"LLM300-Q170-C","text":"The timestamp of the original PDF upload\nThời gian tải PDF gốc"},{"id":"LLM300-Q170-D","text":"The general tone of a professional persona\nGiọng điệu chung của vai trò chuyên môn"}],"correctOptionId":"LLM300-Q170-B","explanation":"Explanation (EN): The RCTF structure states Role (perspective), Context (background), Task (required operation) and Format (output structure). Assigning a role does not change source facts or model weights.\nGiải thích (VI): RCTF gồm Role (vai trò/góc nhìn), Context (bối cảnh), Task (nhiệm vụ) và Format (cấu trúc đầu ra). Gán vai trò không thay đổi dữ kiện nguồn hoặc trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.3, pp.16–23","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q171","chapter":3,"number":171,"question":"How can an AI assistant avoid biased outcomes?\nTrợ lý AI có thể tránh kết quả thiên lệch như thế nào?","options":[{"id":"LLM300-Q171-A","text":"Using only the longest possible response\nChỉ dùng câu trả lời dài nhất"},{"id":"LLM300-Q171-B","text":"Fairness review and human oversight\nRà soát tính công bằng và giám sát con người"},{"id":"LLM300-Q171-C","text":"Removal of all monitoring after deployment\nKhông giám sát sau triển khai"},{"id":"LLM300-Q171-D","text":"Automatic acceptance of every model output\nTự động chấp nhận mọi đầu ra"}],"correctOptionId":"LLM300-Q171-B","explanation":"Explanation (EN): Responsible AI requires fairness assessment, transparency and human control. Automation does not remove a bank’s obligations to explain and oversee high-stakes outcomes.\nGiải thích (VI): AI có trách nhiệm cần đánh giá công bằng, minh bạch và kiểm soát của con người. Tự động hóa không xóa nghĩa vụ giải thích và giám sát các quyết định quan trọng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.3, p.40; Ch.4, p.52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q172","chapter":4,"number":172,"question":"How should suspicious transaction text be handled?\nVăn bản giao dịch đáng ngờ nên được xử lý ra sao?","options":[{"id":"LLM300-Q172-A","text":"Declare fraud with certainty and no evidence\nKhẳng định gian lận không cần chứng cứ"},{"id":"LLM300-Q172-B","text":"Flag the case for an investigator to review\nĐánh dấu vụ việc để điều tra viên xem xét"},{"id":"LLM300-Q172-C","text":"Delete the original notes after generation\nXóa ghi chú gốc sau khi tạo"},{"id":"LLM300-Q172-D","text":"Freeze every related account automatically\nTự đóng băng mọi tài khoản liên quan"}],"correctOptionId":"LLM300-Q172-B","explanation":"Explanation (EN): An LLM can describe suspicious patterns and explain alerts from fraud-detection models. A warning is not proof of fraud, so analysts must validate cases before taking consequential actions.\nGiải thích (VI): LLM có thể mô tả mẫu giao dịch đáng ngờ và giải thích cảnh báo của mô hình phát hiện gian lận. Cảnh báo không chứng minh chắc chắn có gian lận; nhân viên phải xác minh trước quyết định có tác động lớn.\nSlide reference / Đối chiếu slide: Ch.4, pp.33–39","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q173","chapter":4,"number":173,"question":"A banking chatbot answers customer product questions. What is its primary use?\nChatbot ngân hàng trả lời câu hỏi về sản phẩm cho khách hàng. Công dụng chính là gì?","options":[{"id":"LLM300-Q173-A","text":"Guaranteeing the return on every investment\nBảo đảm lợi nhuận mọi khoản đầu tư"},{"id":"LLM300-Q173-B","text":"Making independent lending policy decisions\nTự quyết chính sách cho vay"},{"id":"LLM300-Q173-C","text":"Physically verifying identity documents\nXác minh giấy tờ trực tiếp"},{"id":"LLM300-Q173-D","text":"Supporting users through language dialogue\nHỗ trợ người dùng qua đối thoại ngôn ngữ"}],"correctOptionId":"LLM300-Q173-D","explanation":"Explanation (EN): Banking chatbots are best used for repeated customer requests and verified in-app assistance. Unresolved or sensitive issues should be escalated to authorized human staff, not resolved by inventing an answer.\nGiải thích (VI): Chatbot ngân hàng phù hợp với các yêu cầu lặp lại và hỗ trợ trong ứng dụng đã xác thực. Vấn đề nhạy cảm hoặc chưa xử lý được phải chuyển nhân viên có thẩm quyền, không được bịa câu trả lời.\nSlide reference / Đối chiếu slide: Ch.4, pp.11–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q174","chapter":3,"number":174,"question":"What does grounding mean?\nGrounding nghĩa là gì?","options":[{"id":"LLM300-Q174-A","text":"Increasing random variation in generation\nTăng biến thiên ngẫu nhiên trong tạo sinh"},{"id":"LLM300-Q174-B","text":"Assuming that every document is correct\nCho rằng mọi tài liệu đều đúng"},{"id":"LLM300-Q174-C","text":"Basing answers on provided source material\nDựa câu trả lời trên tài liệu nguồn cung cấp"},{"id":"LLM300-Q174-D","text":"Eliminating the need to review citations\nKhông cần kiểm tra trích dẫn"}],"correctOptionId":"LLM300-Q174-C","explanation":"Explanation (EN): Grounding bases claims and extracted fields on identifiable source material. When evidence is absent, state that fact or leave the field blank rather than inventing figures or citations.\nGiải thích (VI): Grounding yêu cầu khẳng định và trường trích xuất dựa trên nguồn xác định. Nếu không có bằng chứng, phải ghi thiếu hoặc để trống thay vì bịa số liệu hay trích dẫn.\nSlide reference / Đối chiếu slide: Ch.3, pp.35–37; Ch.4, p.10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q175","chapter":1,"number":175,"question":"What is natural language processing concerned with?\nXử lý ngôn ngữ tự nhiên quan tâm đến điều gì?","options":[{"id":"LLM300-Q175-A","text":"Managing physical documents in storage\nQuản lý tài liệu vật lý trong kho"},{"id":"LLM300-Q175-B","text":"Processing and generating natural language\nXử lý và tạo sinh ngôn ngữ tự nhiên"},{"id":"LLM300-Q175-C","text":"Designing printed circuit board layouts\nThiết kế mạch in"},{"id":"LLM300-Q175-D","text":"Maintaining electrical distribution networks\nBảo trì mạng phân phối điện"}],"correctOptionId":"LLM300-Q175-B","explanation":"Explanation (EN): Natural Language Processing is an AI area concerned with analyzing, understanding and generating human language. LLMs provide language-related capabilities rather than guaranteed factual accuracy.\nGiải thích (VI): Xử lý ngôn ngữ tự nhiên là lĩnh vực AI nghiên cứu phân tích, hiểu và tạo sinh ngôn ngữ con người. LLM hỗ trợ tác vụ ngôn ngữ chứ không bảo đảm mọi dữ kiện chính xác.\nSlide reference / Đối chiếu slide: Ch.1, pp.5, 19; Ch.2, pp.18–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q176","chapter":1,"number":176,"question":"What is conditional language modeling?\nMô hình hóa ngôn ngữ có điều kiện là gì?","options":[{"id":"LLM300-Q176-A","text":"The file size given its document format\nDung lượng tệp theo định dạng"},{"id":"LLM300-Q176-B","text":"The hardware cost given its power supply\nChi phí phần cứng theo nguồn điện"},{"id":"LLM300-Q176-C","text":"The next word given its surrounding context\nTừ tiếp theo theo ngữ cảnh xung quanh"},{"id":"LLM300-Q176-D","text":"The account owner given a transaction code\nChủ tài khoản theo mã giao dịch"}],"correctOptionId":"LLM300-Q176-C","explanation":"Explanation (EN): A language model assigns probabilities to text sequences. A conditional model estimates the next word or token using preceding context rather than unrelated account information.\nGiải thích (VI): Mô hình ngôn ngữ gán xác suất cho chuỗi văn bản. Mô hình có điều kiện ước lượng từ hoặc token tiếp theo dựa trên ngữ cảnh trước, không dựa vào thông tin tài khoản không liên quan.\nSlide reference / Đối chiếu slide: Ch.1, pp.6–11","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q177","chapter":4,"number":177,"question":"One team builds, operates and approves its own model. What governance concern arises?\nMột nhóm tự xây dựng, vận hành và duyệt mô hình của mình. Vấn đề quản trị nào phát sinh?","options":[{"id":"LLM300-Q177-A","text":"Inability to tokenize ordinary customer text\nKhông thể tách token văn bản"},{"id":"LLM300-Q177-B","text":"Excessively high display resolution in the app\nĐộ phân giải ứng dụng quá cao"},{"id":"LLM300-Q177-C","text":"A shortage of colors in dashboard charts\nThiếu màu trong bảng điều khiển"},{"id":"LLM300-Q177-D","text":"Missing independent checks and accountability\nThiếu rà soát độc lập và trách nhiệm giải trình"}],"correctOptionId":"LLM300-Q177-D","explanation":"Explanation (EN): An AI model provides support, but the institution must retain control, independent checking, audit records and accountability for important outcomes. Outsourcing does not transfer the bank’s final responsibility.\nGiải thích (VI): AI chỉ hỗ trợ; tổ chức phải duy trì quyền kiểm soát, kiểm tra độc lập, nhật ký kiểm toán và trách nhiệm giải trình đối với kết quả quan trọng. Thuê dịch vụ ngoài không chuyển hết trách nhiệm cuối cùng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.4, pp.19, 32, 52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q178","chapter":2,"number":178,"question":"Users interact through an interface connected to underlying AI services. Which description fits?\nNgười dùng tương tác qua giao diện kết nối các dịch vụ AI bên dưới. Mô tả nào phù hợp?","options":[{"id":"LLM300-Q178-A","text":"A single matrix of pretrained model weights\nMa trận trọng số tiền huấn luyện đơn lẻ"},{"id":"LLM300-Q178-B","text":"An application combining models and services\nỨng dụng kết hợp các mô hình và dịch vụ"},{"id":"LLM300-Q178-C","text":"A spreadsheet without computation services\nBảng tính không có dịch vụ tính toán"},{"id":"LLM300-Q178-D","text":"A stand-alone physical GPU manufacturing line\nDây chuyền sản xuất GPU vật lý"}],"correctOptionId":"LLM300-Q178-B","explanation":"Explanation (EN): ChatGPT is an AI application combining a language model with a user interface and supporting services. File upload, conversation display and memory are application features, not tasks performed by one attention head.\nGiải thích (VI): ChatGPT là ứng dụng AI kết hợp mô hình ngôn ngữ, giao diện và các dịch vụ hỗ trợ. Tải tệp, hiển thị hội thoại và ghi nhớ là tính năng ứng dụng, không phải chức năng riêng của một đầu attention.\nSlide reference / Đối chiếu slide: Ch.2, pp.15–24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q179","chapter":2,"number":179,"question":"Candidate responses receive scores reflecting human preferences. What does the model predict?\nCác câu trả lời ứng viên được chấm điểm theo sở thích con người. Mô hình dự đoán gì?","options":[{"id":"LLM300-Q179-A","text":"The fee charged for international transfers\nPhí chuyển tiền quốc tế"},{"id":"LLM300-Q179-B","text":"The number of pixels on the user's display\nSố pixel màn hình"},{"id":"LLM300-Q179-C","text":"The temperature of physical GPU hardware\nNhiệt độ vật lý GPU"},{"id":"LLM300-Q179-D","text":"The likely human preference for each answer\nKhả năng con người sẽ thích mỗi câu trả lời"}],"correctOptionId":"LLM300-Q179-D","explanation":"Explanation (EN): Reinforcement Learning from Human Feedback uses human preference judgments and a reward model to align model responses with preferred behavior. Preference alignment does not guarantee that every fact is true.\nGiải thích (VI): RLHF dùng đánh giá sở thích con người và reward model để điều chỉnh câu trả lời theo hành vi được ưa thích. Phù hợp sở thích không bảo đảm mọi thông tin đều đúng.\nSlide reference / Đối chiếu slide: Ch.2, p.48","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q180","chapter":1,"number":180,"question":"What is the memory assumption of an N-gram model?\nGiả định về bộ nhớ của mô hình N-gram là gì?","options":[{"id":"LLM300-Q180-A","text":"Dependence on a limited preceding context\nPhụ thuộc vào ngữ cảnh trước đó có giới hạn"},{"id":"LLM300-Q180-B","text":"Dependence on every future text position\nPhụ thuộc mọi vị trí văn bản tương lai"},{"id":"LLM300-Q180-C","text":"Dependence only on external search results\nChỉ phụ thuộc kết quả tìm kiếm ngoài"},{"id":"LLM300-Q180-D","text":"Dependence on labels added after generation\nPhụ thuộc nhãn gắn sau tạo sinh"}],"correctOptionId":"LLM300-Q180-A","explanation":"Explanation (EN): An N-gram uses a limited preceding context: an N-gram sequence contains N consecutive words, and a next-word prediction conditions on N−1 previous words. In a sentence of m words, there are m −N+1 overlapping N-grams.\nGiải thích (VI): N-gram dùng ngữ cảnh trước có giới hạn: một nhóm gồm N từ liên tiếp và việc đoán từ tiếp theo dựa vào N−1 từ trước. Câu có m từ tạo được m−N+1 nhóm N-gram chồng lấp.\nSlide reference / Đối chiếu slide: Ch.1, pp.6–9","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q181","chapter":4,"number":181,"question":"Why does deployment not end model governance?\nVì sao triển khai không phải điểm kết thúc của quản trị mô hình?","options":[{"id":"LLM300-Q181-A","text":"Removal of all test logs after release\nXóa toàn bộ nhật ký sau phát hành"},{"id":"LLM300-Q181-B","text":"A rule forbidding any future model updates\nQuy tắc cấm mọi cập nhật về sau"},{"id":"LLM300-Q181-C","text":"Ongoing monitoring and periodic review\nGiám sát thường xuyên và rà soát định kỳ"},{"id":"LLM300-Q181-D","text":"An assumption that performance stays fixed\nGiả định hiệu năng luôn cố định"}],"correctOptionId":"LLM300-Q181-C","explanation":"Explanation (EN): An AI model provides support, but the institution must retain control, independent checking, audit records and accountability for important outcomes. Outsourcing does not transfer the bank’s final responsibility.\nGiải thích (VI): AI chỉ hỗ trợ; tổ chức phải duy trì quyền kiểm soát, kiểm tra độc lập, nhật ký kiểm toán và trách nhiệm giải trình đối với kết quả quan trọng. Thuê dịch vụ ngoài không chuyển hết trách nhiệm cuối cùng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.4, pp.19, 32, 52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q182","chapter":1,"number":182,"question":"What is zero-shot prompting?\nZero-shot prompting là gì?","options":[{"id":"LLM300-Q182-A","text":"Training an entirely new language model\nHuấn luyện một mô hình ngôn ngữ mới"},{"id":"LLM300-Q182-B","text":"Performing a task without supplied examples\nLàm nhiệm vụ mà không có ví dụ kèm theo"},{"id":"LLM300-Q182-C","text":"Updating weights with a few labeled records\nCập nhật trọng số bằng vài mẫu gán nhãn"},{"id":"LLM300-Q182-D","text":"Running the same request on four servers\nChạy cùng yêu cầu trên bốn máy chủ"}],"correctOptionId":"LLM300-Q182-B","explanation":"Explanation (EN): Zero-shot prompting asks the model to perform a task without worked examples in the prompt; the instruction itself still describes the task.\nGiải thích (VI): Zero-shot yêu cầu mô hình làm nhiệm vụ mà không đưa ví dụ giải mẫu trong prompt; chỉ dẫn vẫn cần nêu nhiệm vụ.\nSlide reference / Đối chiếu slide: Ch.1, p.24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q183","chapter":4,"number":183,"question":"A model points out clauses that may conflict with an internal rule. What role is suitable?\nMô hình chỉ ra các điều khoản có thể xung đột với quy định nội bộ. Vai trò nào phù hợp?","options":[{"id":"LLM300-Q183-A","text":"Conceal uncertainty from compliance officers\nGiấu sự không chắc chắn khỏi cán bộ tuân thủ"},{"id":"LLM300-Q183-B","text":"Highlight potential issues for expert review\nNêu vấn đề tiềm ẩn để chuyên gia rà soát"},{"id":"LLM300-Q183-C","text":"Issue binding legal judgments automatically\nTự ban hành phán quyết pháp lý ràng buộc"},{"id":"LLM300-Q183-D","text":"Rewrite published regulations without approval\nTự sửa quy định đã công bố"}],"correctOptionId":"LLM300-Q183-B","explanation":"Explanation (EN): An LLM can compare documents with rules and highlight possible compliance or legal gaps, but qualified reviewers must check authoritative regulations and make final judgments.\nGiải thích (VI): LLM có thể đối chiếu tài liệu với quy định và cảnh báo khoảng trống tuân thủ hoặc pháp lý, nhưng người có chuyên môn phải kiểm tra văn bản có thẩm quyền và ra kết luận cuối.\nSlide reference / Đối chiếu slide: Ch.4, pp.30–32","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q184","chapter":3,"number":184,"question":"What does the temperature parameter affect?\nTham số temperature ảnh hưởng đến điều gì?","options":[{"id":"LLM300-Q184-A","text":"The physical temperature of the processor\nNhiệt độ vật lý bộ xử lý"},{"id":"LLM300-Q184-B","text":"The maximum allowed number of input files\nSố tệp đầu vào tối đa"},{"id":"LLM300-Q184-C","text":"The amount of historical model training\nLượng huấn luyện lịch sử"},{"id":"LLM300-Q184-D","text":"The diversity of token selection\nMức đa dạng khi chọn token"}],"correctOptionId":"LLM300-Q184-D","explanation":"Explanation (EN): Temperature controls randomness in token selection. A lower value is usually better for consistent extraction; a higher value produces more diverse ideas, but neither guarantees truth.\nGiải thích (VI): Temperature điều chỉnh độ ngẫu nhiên khi chọn token. Giá trị thấp thường phù hợp để trích xuất ổn định; giá trị cao tạo ý tưởng đa dạng hơn nhưng không bảo đảm độ đúng.\nSlide reference / Đối chiếu slide: Ch.3, pp.11–14","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q185","chapter":1,"number":185,"question":"A language system sees text from many topics and writing styles. What benefit is sought?\nHệ thống ngôn ngữ tiếp xúc văn bản thuộc nhiều chủ đề và phong cách. Lợi ích mong muốn là gì?","options":[{"id":"LLM300-Q185-A","text":"Permanent access to every new website\nTruy cập vĩnh viễn mọi website mới"},{"id":"LLM300-Q185-B","text":"Broader coverage of language patterns\nBao quát nhiều mẫu ngôn ngữ hơn"},{"id":"LLM300-Q185-C","text":"Removal of the need for model evaluation\nKhông cần đánh giá mô hình"},{"id":"LLM300-Q185-D","text":"Elimination of all possible model errors\nLoại bỏ mọi lỗi có thể xảy ra"}],"correctOptionId":"LLM300-Q185-B","explanation":"Explanation (EN): Pre-training learns broad language patterns from large text data, including self-supervised prediction objectives. It precedes specialization and does not mean memorizing only the current chat.\nGiải thích (VI): Tiền huấn luyện học mẫu ngôn ngữ tổng quát từ văn bản lớn, có thể dùng mục tiêu dự đoán tự giám sát. Giai đoạn này diễn ra trước điều chỉnh chuyên biệt, không chỉ ghi nhớ cuộc hội thoại hiện tại.\nSlide reference / Đối chiếu slide: Ch.1, p.14; Ch.2, pp.45–47","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q186","chapter":2,"number":186,"question":"What makes ChatGPT an application rather than only a model?\nĐiều gì khiến ChatGPT là ứng dụng chứ không chỉ là mô hình?","options":[{"id":"LLM300-Q186-A","text":"A single matrix of pretrained model weights\nMa trận trọng số đã học đơn lẻ"},{"id":"LLM300-Q186-B","text":"A spreadsheet without computation services\nBảng tính không có dịch vụ tính toán"},{"id":"LLM300-Q186-C","text":"An application combining models and services\nỨng dụng kết hợp mô hình và dịch vụ"},{"id":"LLM300-Q186-D","text":"A stand-alone physical GPU manufacturing line\nDây chuyền sản xuất GPU vật lý"}],"correctOptionId":"LLM300-Q186-C","explanation":"Explanation (EN): ChatGPT is an AI application combining a language model with a user interface and supporting services. File upload, conversation display and memory are application features, not tasks performed by one attention head.\nGiải thích (VI): ChatGPT là ứng dụng AI kết hợp mô hình ngôn ngữ, giao diện và các dịch vụ hỗ trợ. Tải tệp, hiển thị hội thoại và ghi nhớ là tính năng ứng dụng, không phải chức năng riêng của một đầu attention.\nSlide reference / Đối chiếu slide: Ch.2, pp.15–24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q187","chapter":3,"number":187,"question":"Which prompt helps structured extraction?\nPrompt nào giúp trích xuất có cấu trúc?","options":[{"id":"LLM300-Q187-A","text":"Specific fields in a defined JSON structure\nCác trường cụ thể trong cấu trúc JSON định sẵn"},{"id":"LLM300-Q187-B","text":"A creative story about a fictional borrower\nCâu chuyện sáng tạo về người vay hư cấu"},{"id":"LLM300-Q187-C","text":"A list of unrelated banking advertisements\nDanh sách quảng cáo ngân hàng không liên quan"},{"id":"LLM300-Q187-D","text":"An unrestricted essay without field labels\nBài luận tự do không nhãn trường"}],"correctOptionId":"LLM300-Q187-A","explanation":"Explanation (EN): The RCTF structure states Role (perspective), Context (background), Task (required operation) and Format (output structure). Assigning a role does not change source facts or model weights.\nGiải thích (VI): RCTF gồm Role (vai trò/góc nhìn), Context (bối cảnh), Task (nhiệm vụ) và Format (cấu trúc đầu ra). Gán vai trò không thay đổi dữ kiện nguồn hoặc trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.3, pp.16–23","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q188","chapter":3,"number":188,"question":"When is prompt engineering especially practical?\nKhi nào prompt engineering đặc biệt thực tiễn?","options":[{"id":"LLM300-Q188-A","text":"Change the instruction and output constraints\nThay đổi chỉ dẫn và ràng buộc đầu ra"},{"id":"LLM300-Q188-B","text":"Purchase a new GPU server for each request\nMua GPU mới cho mỗi yêu cầu"},{"id":"LLM300-Q188-C","text":"Rewrite the token embedding architecture\nViết lại kiến trúc embedding"},{"id":"LLM300-Q188-D","text":"Collect data to retrain the base model fully\nThu thập dữ liệu để huấn luyện lại toàn bộ"}],"correctOptionId":"LLM300-Q188-A","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q189","chapter":2,"number":189,"question":"What distinguishes representation learning from manual feature design?\nĐiều gì phân biệt representation learning với thiết kế đặc trưng thủ công?","options":[{"id":"LLM300-Q189-A","text":"Assigning every feature through fixed rules\nGán mọi đặc trưng bằng quy tắc cố định"},{"id":"LLM300-Q189-B","text":"Learning useful representations from data\nHọc biểu diễn hữu ích từ dữ liệu"},{"id":"LLM300-Q189-C","text":"Removing all contextual information from text\nBỏ mọi thông tin ngữ cảnh"},{"id":"LLM300-Q189-D","text":"Storing raw documents without transformation\nChỉ lưu tài liệu thô không biến đổi"}],"correctOptionId":"LLM300-Q189-B","explanation":"Explanation (EN): An embedding represents a word or token as a numerical vector learned from data, helping the model work with language representations rather than raw characters alone.\nGiải thích (VI): Embedding biểu diễn từ hoặc token dưới dạng vectơ số học được từ dữ liệu, giúp mô hình xử lý các biểu diễn ngôn ngữ thay vì chỉ ký tự thô.\nSlide reference / Đối chiếu slide: Ch.2, pp.32–33; Ch.1, p.5","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q190","chapter":2,"number":190,"question":"Why is a larger context window useful?\nVì sao cửa sổ ngữ cảnh lớn hữu ích?","options":[{"id":"LLM300-Q190-A","text":"Handling longer relevant document context\nXử lý ngữ cảnh tài liệu liên quan dài hơn"},{"id":"LLM300-Q190-B","text":"Guaranteeing elimination of all hallucinations\nBảo đảm không còn hallucination"},{"id":"LLM300-Q190-C","text":"Forcing every response to be shorter\nBuộc mọi câu trả lời ngắn hơn"},{"id":"LLM300-Q190-D","text":"Replacing all authorization controls for tools\nThay thế mọi kiểm soát quyền công cụ"}],"correctOptionId":"LLM300-Q190-A","explanation":"Explanation (EN): A context window limits how much information the model can process in one interaction. More text may help, but also increases processing demands and does not ensure every important fact is noticed.\nGiải thích (VI): Cửa sổ ngữ cảnh giới hạn lượng thông tin mô hình xử lý trong một lần. Văn bản dài hơn có thể hữu ích nhưng tăng nhu cầu tính toán và không bảo đảm mô hình nhận ra mọi chi tiết quan trọng.\nSlide reference / Đối chiếu slide: Ch.2, pp.18–20; Ch.3, p.7","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q191","chapter":1,"number":191,"question":"An LLM's training volume is described in tokens. What are they?\nKhối lượng huấn luyện LLM được mô tả bằng token. Chúng là gì?","options":[{"id":"LLM300-Q191-A","text":"Encrypted keys stored by banking systems\nKhóa mã hóa trong ngân hàng"},{"id":"LLM300-Q191-B","text":"Individual processors installed on servers\nBộ xử lý đơn lẻ trên máy chủ"},{"id":"LLM300-Q191-C","text":"Finished reports reviewed by accountants\nBáo cáo đã được kiểm toán viên duyệt"},{"id":"LLM300-Q191-D","text":"Text units processed during model training\nĐơn vị văn bản được xử lý trong huấn luyện"}],"correctOptionId":"LLM300-Q191-D","explanation":"Explanation (EN): Training tokens are text units processed when learning model parameters. Their count, alongside parameter count and computing resources, indicates training scale.\nGiải thích (VI): Token huấn luyện là các đơn vị văn bản được xử lý khi học tham số mô hình. Số token cùng số tham số và tài nguyên tính toán phản ánh quy mô huấn luyện.\nSlide reference / Đối chiếu slide: Ch.1, pp.15–17; Ch.2, p.31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q192","chapter":4,"number":192,"question":"What is an appropriate use of AI in compliance support?\nCách sử dụng AI phù hợp để hỗ trợ tuân thủ là gì?","options":[{"id":"LLM300-Q192-A","text":"Issue binding legal judgments automatically\nTự đưa phán quyết pháp lý ràng buộc"},{"id":"LLM300-Q192-B","text":"Conceal uncertainty from compliance officers\nGiấu sự không chắc chắn"},{"id":"LLM300-Q192-C","text":"Rewrite published regulations without approval\nTự sửa quy định công bố"},{"id":"LLM300-Q192-D","text":"Highlight potential issues for expert review\nNêu vấn đề tiềm ẩn để chuyên gia rà soát"}],"correctOptionId":"LLM300-Q192-D","explanation":"Explanation (EN): An LLM can compare documents with rules and highlight possible compliance or legal gaps, but qualified reviewers must check authoritative regulations and make final judgments.\nGiải thích (VI): LLM có thể đối chiếu tài liệu với quy định và cảnh báo khoảng trống tuân thủ hoặc pháp lý, nhưng người có chuyên môn phải kiểm tra văn bản có thẩm quyền và ra kết luận cuối.\nSlide reference / Đối chiếu slide: Ch.4, pp.30–32","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q193","chapter":3,"number":193,"question":"What should happen after a meta-prompt is proposed?\nSau khi đề xuất meta-prompt, cần làm gì?","options":[{"id":"LLM300-Q193-A","text":"The system permanently adopts the first text\nHệ thống vĩnh viễn dùng prompt đầu tiên"},{"id":"LLM300-Q193-B","text":"The model bypasses established data policies\nMô hình vượt qua chính sách dữ liệu"},{"id":"LLM300-Q193-C","text":"The user reviews and finalizes the prompt\nNgười dùng rà soát và chốt prompt"},{"id":"LLM300-Q193-D","text":"The proposed output is treated as verified\nĐầu ra đề xuất được coi là đã xác minh"}],"correctOptionId":"LLM300-Q193-C","explanation":"Explanation (EN): Meta-prompting uses AI to propose or improve another prompt. The user must review, test and finalize that proposal instead of assuming it is verified.\nGiải thích (VI): Meta-prompting dùng AI để đề xuất hoặc cải thiện prompt khác. Người dùng vẫn phải rà soát, thử nghiệm và chốt prompt chứ không mặc định đề xuất đã đúng.\nSlide reference / Đối chiếu slide: Ch.3, pp.28–29","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q194","chapter":4,"number":194,"question":"Which local privacy framework is cited in the materials?\nKhung pháp lý địa phương nào về quyền riêng tư được trích dẫn trong tài liệu?","options":[{"id":"L
