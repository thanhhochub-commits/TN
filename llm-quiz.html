LM300-Q194-A","text":"A banking guideline unrelated to privacy\nHướng dẫn ngân hàng không liên quan quyền riêng tư"},{"id":"LLM300-Q194-B","text":"Decree 13/2023/ND-CP on personal data\nNghị định 13/2023/NĐ-CP về dữ liệu cá nhân"},{"id":"LLM300-Q194-C","text":"A hypothetical regulation with no enactment\nQuy định giả định chưa ban hành"},{"id":"LLM300-Q194-D","text":"A software vendor's marketing brochure\nTài liệu quảng cáo phần mềm"}],"correctOptionId":"LLM300-Q194-B","explanation":"Explanation (EN): Banking data can contain confidential customer identifiers or credentials. Data minimization, masking, legal safeguards and secure access reduce disclosure risks; an external service does not make these duties disappear.\nGiải thích (VI): Dữ liệu ngân hàng có thể chứa thông tin nhận dạng hoặc thông tin xác thực nhạy cảm. Giảm thiểu dữ liệu, che thông tin, bảo đảm cơ sở pháp lý và kiểm soát truy cập giúp hạn chế rò rỉ; dùng dịch vụ ngoài không làm mất trách nhiệm bảo vệ dữ liệu.\nSlide reference / Đối chiếu slide: Ch.4, pp.19–20; Ch.3, p.38","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q195","chapter":1,"number":195,"question":"A model is asked to classify a complaint without demonstration items. Which approach is this?\nYêu cầu mô hình phân loại khiếu nại mà không cung cấp ví dụ. Đây là phương pháp nào?","options":[{"id":"LLM300-Q195-A","text":"Training an entirely new language model\nHuấn luyện mô hình ngôn ngữ hoàn toàn mới"},{"id":"LLM300-Q195-B","text":"Running the same request on four servers\nChạy yêu cầu trên bốn máy chủ"},{"id":"LLM300-Q195-C","text":"Performing a task without supplied examples\nThực hiện nhiệm vụ không có ví dụ mẫu"},{"id":"LLM300-Q195-D","text":"Updating weights with a few labeled records\nCập nhật trọng số bằng ít hồ sơ gán nhãn"}],"correctOptionId":"LLM300-Q195-C","explanation":"Explanation (EN): Zero-shot prompting asks the model to perform a task without worked examples in the prompt; the instruction itself still describes the task.\nGiải thích (VI): Zero-shot yêu cầu mô hình làm nhiệm vụ mà không đưa ví dụ giải mẫu trong prompt; chỉ dẫn vẫn cần nêu nhiệm vụ.\nSlide reference / Đối chiếu slide: Ch.1, p.24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q196","chapter":2,"number":196,"question":"Which operation belongs to the language model itself?\nHoạt động nào thuộc bản thân mô hình ngôn ngữ?","options":[{"id":"LLM300-Q196-A","text":"Saving a user's account profile in the app\nLưu hồ sơ tài khoản người dùng trong ứng dụng"},{"id":"LLM300-Q196-B","text":"Drawing the navigation menu in the browser\nVẽ menu điều hướng trình duyệt"},{"id":"LLM300-Q196-C","text":"Predicting and generating language tokens\nDự đoán và tạo sinh token ngôn ngữ"},{"id":"LLM300-Q196-D","text":"Displaying a file-upload button to the user\nHiển thị nút tải tệp lên"}],"correctOptionId":"LLM300-Q196-C","explanation":"Explanation (EN): Autoregressive decoder generation predicts the next token using earlier tokens and repeats until a stop condition. The sequence is not emitted all at once.\nGiải thích (VI): Bộ giải mã tự hồi quy dự đoán token kế tiếp từ các token trước và lặp đến điều kiện dừng; các token không xuất hiện đồng thời.\nSlide reference / Đối chiếu slide: Ch.2, pp.41–44","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q197","chapter":4,"number":197,"question":"Why should API keys stay out of prompts?\nVì sao không nên đưa API key vào prompt?","options":[{"id":"LLM300-Q197-A","text":"The file's content gains a digital signature\nTệp có thêm chữ ký số"},{"id":"LLM300-Q197-B","text":"The prompt automatically becomes encrypted\nPrompt tự được mã hóa"},{"id":"LLM300-Q197-C","text":"The model necessarily becomes more accurate\nMô hình chắc chắn chính xác hơn"},{"id":"LLM300-Q197-D","text":"The credential may be disclosed or misused\nThông tin xác thực có thể bị lộ hoặc lạm dụng"}],"correctOptionId":"LLM300-Q197-D","explanation":"Explanation (EN): Banking data can contain confidential customer identifiers or credentials. Data minimization, masking, legal safeguards and secure access reduce disclosure risks; an external service does not make these duties disappear.\nGiải thích (VI): Dữ liệu ngân hàng có thể chứa thông tin nhận dạng hoặc thông tin xác thực nhạy cảm. Giảm thiểu dữ liệu, che thông tin, bảo đảm cơ sở pháp lý và kiểm soát truy cập giúp hạn chế rò rỉ; dùng dịch vụ ngoài không làm mất trách nhiệm bảo vệ dữ liệu.\nSlide reference / Đối chiếu slide: Ch.4, pp.19–20; Ch.3, p.38","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q198","chapter":3,"number":198,"question":"What is a prompt?\nPrompt là gì?","options":[{"id":"LLM300-Q198-A","text":"A document signed by a financial regulator\nVăn bản ký bởi cơ quan quản lý tài chính"},{"id":"LLM300-Q198-B","text":"The model's permanent training dataset\nTập dữ liệu huấn luyện vĩnh viễn của mô hình"},{"id":"LLM300-Q198-C","text":"A request or instruction sent to the model\nYêu cầu hoặc chỉ dẫn gửi cho mô hình"},{"id":"LLM300-Q198-D","text":"A dedicated physical computing processor\nBộ xử lý phần cứng chuyên biệt"}],"correctOptionId":"LLM300-Q198-C","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q199","chapter":1,"number":199,"question":"What is pre-training in a ChatGPT training pipeline?\nPre-training trong quy trình huấn luyện ChatGPT là gì?","options":[{"id":"LLM300-Q199-A","text":"Assigning a human reviewer to every prompt\nPhân người kiểm tra cho mọi prompt"},{"id":"LLM300-Q199-B","text":"Permanent saving of each user preference\nLưu vĩnh viễn sở thích người dùng"},{"id":"LLM300-Q199-C","text":"Final approval of all user-facing responses\nDuyệt cuối mọi câu trả lời"},{"id":"LLM300-Q199-D","text":"Initial learning from large-scale text data\nHọc ban đầu từ văn bản quy mô lớn"}],"correctOptionId":"LLM300-Q199-D","explanation":"Explanation (EN): Pre-training learns broad language patterns from large text data, including self-supervised prediction objectives. It precedes specialization and does not mean memorizing only the current chat.\nGiải thích (VI): Tiền huấn luyện học mẫu ngôn ngữ tổng quát từ văn bản lớn, có thể dùng mục tiêu dự đoán tự giám sát. Giai đoạn này diễn ra trước điều chỉnh chuyên biệt, không chỉ ghi nhớ cuộc hội thoại hiện tại.\nSlide reference / Đối chiếu slide: Ch.1, p.14; Ch.2, pp.45–47","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q200","chapter":1,"number":200,"question":"What is an LLM's role in machine translation?\nLLM có vai trò gì trong dịch máy?","options":[{"id":"LLM300-Q200-A","text":"Estimating GPU usage from a PDF document\nƯớc lượng GPU dùng từ PDF"},{"id":"LLM300-Q200-B","text":"Generating a translation across languages\nTạo bản dịch giữa các ngôn ngữ"},{"id":"LLM300-Q200-C","text":"Assigning staff to operational departments\nPhân công nhân viên theo bộ phận"},{"id":"LLM300-Q200-D","text":"Converting a text file into a bank account\nBiến tệp văn bản thành tài khoản ngân hàng"}],"correctOptionId":"LLM300-Q200-B","explanation":"Explanation (EN): Machine translation is a language-generation task: the model produces equivalent text in another language rather than performing banking transactions.\nGiải thích (VI): Dịch máy là tác vụ tạo sinh ngôn ngữ: mô hình tạo văn bản tương ứng ở ngôn ngữ khác, không thực hiện giao dịch ngân hàng.\nSlide reference / Đối chiếu slide: Ch.1, pp.19–22; Ch.2, p.19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q201","chapter":3,"number":201,"question":"How does Tree of Thoughts differ from a simple chain?\nTree of Thoughts khác chuỗi suy luận đơn giản như thế nào?","options":[{"id":"LLM300-Q201-A","text":"It explores branching candidate solutions\nKhám phá các nhánh lời giải ứng viên"},{"id":"LLM300-Q201-B","text":"It eliminates intermediate reasoning steps\nLoại bỏ các bước suy luận trung gian"},{"id":"LLM300-Q201-C","text":"It requires retraining the underlying model\nCần huấn luyện lại mô hình nền"},{"id":"LLM300-Q201-D","text":"It forbids comparing alternative decisions\nCấm so sánh lựa chọn khác nhau"}],"correctOptionId":"LLM300-Q201-A","explanation":"Explanation (EN): Tree of Thoughts explores multiple branching candidate reasoning paths before choosing one, unlike a single linear chain.\nGiải thích (VI): Tree of Thoughts khảo sát nhiều nhánh lời giải rồi chọn phương án, khác một chuỗi suy luận tuyến tính duy nhất.\nSlide reference / Đối chiếu slide: Ch.3, pp.30–33","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q202","chapter":4,"number":202,"question":"Why must a bank examine customer satisfaction as well as chatbot automation?\nVì sao ngân hàng phải xem xét mức độ hài lòng của khách hàng cùng với mức độ tự động hóa chatbot?","options":[{"id":"LLM300-Q202-A","text":"Investigate quality and escalation failures\nĐiều tra lỗi chất lượng và chuyển tuyến hỗ trợ"},{"id":"LLM300-Q202-B","text":"Assume that fewer handoffs mean success\nCho rằng giảm chuyển cho người thật là thành công"},{"id":"LLM300-Q202-C","text":"Increase chat automation without diagnosis\nTăng tự động hóa không chẩn đoán nguyên nhân"},{"id":"LLM300-Q202-D","text":"Remove all access to human support staff\nBỏ mọi hỗ trợ từ nhân viên"}],"correctOptionId":"LLM300-Q202-A","explanation":"Explanation (EN): Banking chatbots are best used for repeated customer requests and verified in-app assistance. Unresolved or sensitive issues should be escalated to authorized human staff, not resolved by inventing an answer.\nGiải thích (VI): Chatbot ngân hàng phù hợp với các yêu cầu lặp lại và hỗ trợ trong ứng dụng đã xác thực. Vấn đề nhạy cảm hoặc chưa xử lý được phải chuyển nhân viên có thẩm quyền, không được bịa câu trả lời.\nSlide reference / Đối chiếu slide: Ch.4, pp.11–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q203","chapter":1,"number":203,"question":"How is model size commonly reported?\nQuy mô mô hình thường được báo cáo bằng gì?","options":[{"id":"LLM300-Q203-A","text":"The number of users in a training room\nSố người trong phòng huấn luyện"},{"id":"LLM300-Q203-B","text":"The number of trainable model parameters\nSố tham số có thể huấn luyện"},{"id":"LLM300-Q203-C","text":"The number of buttons in the interface\nSố nút trên giao diện"},{"id":"LLM300-Q203-D","text":"The number of citations in one response\nSố trích dẫn trong câu trả lời"}],"correctOptionId":"LLM300-Q203-B","explanation":"Explanation (EN): Model scale involves parameters, training tokens, compute and energy. Larger systems can be costly and do not automatically outperform smaller models on every task, so suitability and evaluation matter.\nGiải thích (VI): Quy mô mô hình liên quan đến tham số, token huấn luyện, năng lực tính toán và năng lượng. Mô hình lớn tốn kém và không tự động tốt hơn ở mọi tác vụ; cần xét tính phù hợp và đánh giá.\nSlide reference / Đối chiếu slide: Ch.1, pp.15–18, 30–31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q204","chapter":3,"number":204,"question":"A bank preserves prompt versions and test results for repeated use. Why do this?\nNgân hàng lưu phiên bản prompt và kết quả thử nghiệm để tái sử dụng. Vì sao?","options":[{"id":"LLM300-Q204-A","text":"Guarantee that every future response is true\nBảo đảm mọi câu trả lời tương lai đúng"},{"id":"LLM300-Q204-B","text":"Replace secure model access with a public link\nThay truy cập an toàn bằng link công khai"},{"id":"LLM300-Q204-C","text":"Stop updating any operational procedures\nDừng cập nhật quy trình"},{"id":"LLM300-Q204-D","text":"Manage prompts as reusable workflow assets\nQuản lý prompt như tài sản quy trình tái sử dụng"}],"correctOptionId":"LLM300-Q204-D","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q205","chapter":2,"number":205,"question":"What is RLHF designed to improve?\nRLHF được thiết kế để cải thiện điều gì?","options":[{"id":"LLM300-Q205-A","text":"Responses better aligned with human preferences\nCâu trả lời phù hợp hơn với sở thích con người"},{"id":"LLM300-Q205-B","text":"A permanent record of all private conversations\nBản ghi vĩnh viễn mọi trò chuyện riêng tư"},{"id":"LLM300-Q205-C","text":"A replacement for every system safety measure\nThay thế mọi biện pháp an toàn"},{"id":"LLM300-Q205-D","text":"A guaranteed perfect answer to every question\nBảo đảm mọi câu trả lời hoàn hảo"}],"correctOptionId":"LLM300-Q205-A","explanation":"Explanation (EN): Reinforcement Learning from Human Feedback uses human preference judgments and a reward model to align model responses with preferred behavior. Preference alignment does not guarantee that every fact is true.\nGiải thích (VI): RLHF dùng đánh giá sở thích con người và reward model để điều chỉnh câu trả lời theo hành vi được ưa thích. Phù hợp sở thích không bảo đảm mọi thông tin đều đúng.\nSlide reference / Đối chiếu slide: Ch.2, p.48","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q206","chapter":3,"number":206,"question":"What is a safe rule when information is missing?\nQuy tắc an toàn khi thiếu thông tin là gì?","options":[{"id":"LLM300-Q206-A","text":"Invent a typical value from similar contracts\nBịa giá trị điển hình từ hợp đồng tương tự"},{"id":"LLM300-Q206-B","text":"State that the requested detail is absent\nNêu rằng chi tiết yêu cầu không có"},{"id":"LLM300-Q206-C","text":"Insert a date based on general expectations\nĐiền ngày theo kỳ vọng chung"},{"id":"LLM300-Q206-D","text":"Hide the missing value from the reviewer\nGiấu giá trị thiếu với người rà soát"}],"correctOptionId":"LLM300-Q206-B","explanation":"Explanation (EN): Grounding bases claims and extracted fields on identifiable source material. When evidence is absent, state that fact or leave the field blank rather than inventing figures or citations.\nGiải thích (VI): Grounding yêu cầu khẳng định và trường trích xuất dựa trên nguồn xác định. Nếu không có bằng chứng, phải ghi thiếu hoặc để trống thay vì bịa số liệu hay trích dẫn.\nSlide reference / Đối chiếu slide: Ch.3, pp.35–37; Ch.4, p.10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q207","chapter":3,"number":207,"question":"What does top-k sampling restrict?\nTop-K sampling giới hạn gì?","options":[{"id":"LLM300-Q207-A","text":"Top-k limits the candidate token set\nTop-K giới hạn tập token ứng viên"},{"id":"LLM300-Q207-B","text":"Temperature directly limits file uploads\nTemperature trực tiếp giới hạn tệp tải lên"},{"id":"LLM300-Q207-C","text":"Role text determines GPU memory size\nVai trò quyết định dung lượng GPU"},{"id":"LLM300-Q207-D","text":"Max tokens selects database permissions\nMax tokens chọn quyền cơ sở dữ liệu"}],"correctOptionId":"LLM300-Q207-A","explanation":"Explanation (EN): Top-K keeps only a fixed number K of the highest-probability next-token candidates before sampling.\nGiải thích (VI): Top-K chỉ giữ K ứng viên token kế tiếp có xác suất cao nhất trước khi lấy mẫu.\nSlide reference / Đối chiếu slide: Ch.3, p.14","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q208","chapter":2,"number":208,"question":"What does tokenization do?\nTokenization làm gì?","options":[{"id":"LLM300-Q208-A","text":"Filtering network packets by destination\nLọc gói tin mạng theo đích"},{"id":"LLM300-Q208-B","text":"Estimating customer financial risk ratings\nƯớc lượng điểm rủi ro tài chính khách hàng"},{"id":"LLM300-Q208-C","text":"Splitting input text into model tokens\nTách văn bản đầu vào thành token của mô hình"},{"id":"LLM300-Q208-D","text":"Storing a chat's screen layout in a file\nLưu bố cục màn hình hội thoại"}],"correctOptionId":"LLM300-Q208-C","explanation":"Explanation (EN): Tokenization splits text into processing units, which may be full words, word parts or punctuation; tokenizers can map those units to numerical identifiers.\nGiải thích (VI): Tokenization chia văn bản thành đơn vị xử lý; chúng có thể là từ, một phần từ hoặc dấu câu; tokenizer ánh xạ những đơn vị đó sang mã số.\nSlide reference / Đối chiếu slide: Ch.2, p.31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q209","chapter":2,"number":209,"question":"A model uses attention-based blocks rather than an N-gram count table. Which family fits?\nMô hình dùng các khối attention thay cho bảng đếm N-gram thuộc họ nào?","options":[{"id":"LLM300-Q209-A","text":"The manually scripted decision-rule family\nHọ quy tắc quyết định viết tay"},{"id":"LLM300-Q209-B","text":"The purely statistical bigram model family\nHọ mô hình bigram thống kê"},{"id":"LLM300-Q209-C","text":"The Transformer neural network family\nHọ mạng nơ-ron Transformer"},{"id":"LLM300-Q209-D","text":"The traditional spreadsheet formula family\nHọ công thức bảng tính truyền thống"}],"correctOptionId":"LLM300-Q209-C","explanation":"Explanation (EN): Transformer is the attention-based neural network architecture underlying GPT. It models token interactions rather than relying solely on N-gram count tables.\nGiải thích (VI): Transformer là kiến trúc mạng nơ-ron dùng attention làm nền tảng của GPT; mô hình hóa tương tác token thay vì chỉ dựa bảng đếm N-gram.\nSlide reference / Đối chiếu slide: Ch.2, pp.28, 38–41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q210","chapter":1,"number":210,"question":"A team exposes the base model to extensive text before specialized adjustment. Which stage is this?\nNhóm cung cấp lượng lớn văn bản cho mô hình cơ sở trước khi điều chỉnh chuyên biệt. Đây là giai đoạn nào?","options":[{"id":"LLM300-Q210-A","text":"Permanent saving of each user preference\nLưu vĩnh viễn sở thích người dùng"},{"id":"LLM300-Q210-B","text":"Assigning a human reviewer to every prompt\nPhân người rà soát từng prompt"},{"id":"LLM300-Q210-C","text":"Initial learning from large-scale text data\nHọc ban đầu từ dữ liệu văn bản lớn"},{"id":"LLM300-Q210-D","text":"Final approval of all user-facing responses\nDuyệt cuối mọi câu trả lời"}],"correctOptionId":"LLM300-Q210-C","explanation":"Explanation (EN): Pre-training learns broad language patterns from large text data, including self-supervised prediction objectives. It precedes specialization and does not mean memorizing only the current chat.\nGiải thích (VI): Tiền huấn luyện học mẫu ngôn ngữ tổng quát từ văn bản lớn, có thể dùng mục tiêu dự đoán tự giám sát. Giai đoạn này diễn ra trước điều chỉnh chuyên biệt, không chỉ ghi nhớ cuộc hội thoại hiện tại.\nSlide reference / Đối chiếu slide: Ch.1, p.14; Ch.2, pp.45–47","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q211","chapter":3,"number":211,"question":"What does the role element in RCTF specify?\nYếu tố Role trong RCTF quy định gì?","options":[{"id":"LLM300-Q211-A","text":"The number of GPUs used for inference\nSố GPU phục vụ suy luận"},{"id":"LLM300-Q211-B","text":"The dataset used during pre-training\nTập dữ liệu dùng khi tiền huấn luyện"},{"id":"LLM300-Q211-C","text":"The role the model should adopt\nVai trò mà mô hình cần đảm nhận"},{"id":"LLM300-Q211-D","text":"The security setting of the web browser\nCài đặt an toàn trình duyệt"}],"correctOptionId":"LLM300-Q211-C","explanation":"Explanation (EN): The RCTF structure states Role (perspective), Context (background), Task (required operation) and Format (output structure). Assigning a role does not change source facts or model weights.\nGiải thích (VI): RCTF gồm Role (vai trò/góc nhìn), Context (bối cảnh), Task (nhiệm vụ) và Format (cấu trúc đầu ra). Gán vai trò không thay đổi dữ kiện nguồn hoặc trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.3, pp.16–23","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q212","chapter":1,"number":212,"question":"What does decoder-only refer to in GPT models?\nDecoder-only trong GPT có nghĩa là gì?","options":[{"id":"LLM300-Q212-A","text":"A Transformer built around decoder blocks\nTransformer xây dựng từ các khối decoder"},{"id":"LLM300-Q212-B","text":"A Transformer built around encoder blocks\nTransformer xây dựng từ các khối encoder"},{"id":"LLM300-Q212-C","text":"A system dedicated only to translation pairs\nHệ thống chỉ dành cho cặp dịch"},{"id":"LLM300-Q212-D","text":"A system with no neural network layers\nHệ thống không có lớp nơ-ron"}],"correctOptionId":"LLM300-Q212-A","explanation":"Explanation (EN): GPT belongs to the decoder-only Transformer family and is oriented toward text generation. BERT is an encoder-only model for language representations; T5/BART use encoder–decoder structures.\nGiải thích (VI): GPT thuộc họ Transformer decoder-only, thiên về tạo sinh văn bản. BERT thuộc nhóm encoder-only để biểu diễn và hiểu ngôn ngữ; T5/BART dùng kiến trúc encoder–decoder.\nSlide reference / Đối chiếu slide: Ch.1, p.12; Ch.2, pp.27–28","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q213","chapter":2,"number":213,"question":"Which component can connect models to external tools?\nThành phần nào kết nối mô hình với công cụ bên ngoài?","options":[{"id":"LLM300-Q213-A","text":"The positional embedding lookup alone\nChỉ phần tra cứu positional embedding"},{"id":"LLM300-Q213-B","text":"The orchestration and tool-calling layer\nLớp điều phối và gọi công cụ"},{"id":"LLM300-Q213-C","text":"The display theme of the chat interface\nGiao diện màu sắc trò chuyện"},{"id":"LLM300-Q213-D","text":"The raw training corpus stored on disk\nKho dữ liệu huấn luyện thô"}],"correctOptionId":"LLM300-Q213-B","explanation":"Explanation (EN): An API is an Application Programming Interface through which application components or services communicate; orchestration and tool-calling connect the model to approved capabilities.\nGiải thích (VI): API là giao diện lập trình ứng dụng giúp các thành phần/dịch vụ trao đổi; lớp điều phối và gọi công cụ kết nối mô hình với khả năng được cấp phép.\nSlide reference / Đối chiếu slide: Ch.2, p.23","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q214","chapter":3,"number":214,"question":"What does the format element in RCTF control?\nYếu tố Format trong RCTF kiểm soát điều gì?","options":[{"id":"LLM300-Q214-A","text":"The size of the training dataset stored\nQuy mô dữ liệu huấn luyện"},{"id":"LLM300-Q214-B","text":"The structure of the expected response\nCấu trúc câu trả lời dự kiến"},{"id":"LLM300-Q214-C","text":"The subject matter of the user account\nChủ đề tài khoản người dùng"},{"id":"LLM300-Q214-D","text":"The number of layers in the Transformer\nSố lớp Transformer"}],"correctOptionId":"LLM300-Q214-B","explanation":"Explanation (EN): The RCTF structure states Role (perspective), Context (background), Task (required operation) and Format (output structure). Assigning a role does not change source facts or model weights.\nGiải thích (VI): RCTF gồm Role (vai trò/góc nhìn), Context (bối cảnh), Task (nhiệm vụ) và Format (cấu trúc đầu ra). Gán vai trò không thay đổi dữ kiện nguồn hoặc trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.3, pp.16–23","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q215","chapter":3,"number":215,"question":"A prompt begins by assigning the model a professional perspective. Which element is this?\nPrompt bắt đầu bằng việc gán góc nhìn nghề nghiệp cho mô hình. Đó là yếu tố gì?","options":[{"id":"LLM300-Q215-A","text":"The security setting of the web browser\nCài đặt an toàn trình duyệt"},{"id":"LLM300-Q215-B","text":"The number of GPUs used for inference\nSố GPU suy luận"},{"id":"LLM300-Q215-C","text":"The dataset used during pre-training\nTập dữ liệu tiền huấn luyện"},{"id":"LLM300-Q215-D","text":"The role the model should adopt\nVai trò mô hình cần đảm nhận"}],"correctOptionId":"LLM300-Q215-D","explanation":"Explanation (EN): The RCTF structure states Role (perspective), Context (background), Task (required operation) and Format (output structure). Assigning a role does not change source facts or model weights.\nGiải thích (VI): RCTF gồm Role (vai trò/góc nhìn), Context (bối cảnh), Task (nhiệm vụ) và Format (cấu trúc đầu ra). Gán vai trò không thay đổi dữ kiện nguồn hoặc trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.3, pp.16–23","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q216","chapter":1,"number":216,"question":"What are emergent abilities in model scaling?\nKhả năng nổi lên khi tăng quy mô mô hình là gì?","options":[{"id":"LLM300-Q216-A","text":"A feature that exists only in rule systems\nĐặc trưng chỉ tồn tại trong hệ quy tắc"},{"id":"LLM300-Q216-B","text":"An ability that emerges at larger scale\nKhả năng xuất hiện khi quy mô lớn hơn"},{"id":"LLM300-Q216-C","text":"A capability caused by internet connection\nNăng lực do kết nối Internet"},{"id":"LLM300-Q216-D","text":"A guaranteed rise in every benchmark score\nBảo đảm mọi điểm benchmark tăng"}],"correctOptionId":"LLM300-Q216-B","explanation":"Explanation (EN): Emergent abilities are capabilities observed at certain larger model scales rather than directly inserted by a user; scaling alone does not guarantee every benchmark will improve.\nGiải thích (VI): Khả năng nổi lên là năng lực được quan sát ở những mức quy mô lớn nhất định, không phải do người dùng trực tiếp viết vào; tăng quy mô không bảo đảm mọi thước đo đều tăng.\nSlide reference / Đối chiếu slide: Ch.1, p.23","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q217","chapter":1,"number":217,"question":"A task is structured around intermediate reasoning steps before an answer. Which method fits?\nNhiệm vụ được tổ chức thành các bước suy luận trung gian trước kết luận. Phương pháp nào phù hợp?","options":[{"id":"LLM300-Q217-A","text":"Removing all context from the instruction\nBỏ mọi ngữ cảnh khỏi hướng dẫn"},{"id":"LLM300-Q217-B","text":"Guiding a sequence of reasoning steps\nĐịnh hướng chuỗi bước suy luận"},{"id":"LLM300-Q217-C","text":"Restricting output to random single words\nChỉ tạo từ ngẫu nhiên"},{"id":"LLM300-Q217-D","text":"Replacing the model with a keyword index\nThay mô hình bằng chỉ mục từ khóa"}],"correctOptionId":"LLM300-Q217-B","explanation":"Explanation (EN): Chain-of-thought prompting guides a problem through linked intermediate reasoning steps, unlike a simple keyword list or a change to model weights.\nGiải thích (VI): Chain-of-thought hướng dẫn bài toán qua các bước suy luận trung gian liên kết, không chỉ là danh sách từ khóa hay thay trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.1, pp.27–29; Ch.3, pp.27, 30","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q218","chapter":1,"number":218,"question":"What is few-shot prompting?\nFew-shot prompting là gì?","options":[{"id":"LLM300-Q218-A","text":"Including a few demonstrations in the prompt\nĐưa vài ví dụ minh họa vào prompt"},{"id":"LLM300-Q218-B","text":"Producing a single response without context\nChỉ tạo một câu trả lời không ngữ cảnh"},{"id":"LLM300-Q218-C","text":"Removing every example from the instruction\nBỏ mọi ví dụ khỏi yêu cầu"},{"id":"LLM300-Q218-D","text":"Rebuilding the model on a tiny dataset\nXây lại mô hình trên bộ dữ liệu nhỏ"}],"correctOptionId":"LLM300-Q218-A","explanation":"Explanation (EN): Few-shot in-context learning supplies several demonstrations inside the prompt. The model infers the desired pattern from these examples without changing its permanent weights.\nGiải thích (VI): Few-shot cung cấp một số ví dụ ngay trong prompt. Mô hình suy ra cách làm từ ví dụ mà không thay đổi vĩnh viễn trọng số đã huấn luyện.\nSlide reference / Đối chiếu slide: Ch.1, pp.24–25; Ch.3, p.27","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q219","chapter":3,"number":219,"question":"A user tries to bypass an AI system's established safety boundaries. What is this?\nNgười dùng tìm cách vượt qua các ranh giới an toàn của AI. Đây là gì?","options":[{"id":"LLM300-Q219-A","text":"An attempt to override safety restrictions\nNỗ lực vượt qua hạn chế an toàn"},{"id":"LLM300-Q219-B","text":"A normal request within authorized scope\nYêu cầu bình thường được cho phép"},{"id":"LLM300-Q219-C","text":"A technique for lowering GPU electricity use\nKỹ thuật giảm điện GPU"},{"id":"LLM300-Q219-D","text":"A way of encrypting a customer statement\nCách mã hóa sao kê khách hàng"}],"correctOptionId":"LLM300-Q219-A","explanation":"Explanation (EN): A jailbreak is an attempt to bypass the system’s safety rules. It differs from a legitimate request for normal content or formatting.\nGiải thích (VI): Jailbreak là nỗ lực vượt qua ranh giới an toàn của hệ thống, khác yêu cầu nội dung hay định dạng hợp lệ.\nSlide reference / Đối chiếu slide: Ch.3, pp.39–40","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q220","chapter":3,"number":220,"question":"A system evaluates several reasoning paths and selects their common answer. Which technique fits?\nHệ thống đánh giá nhiều đường suy luận và chọn kết quả chung. Kỹ thuật nào phù hợp?","options":[{"id":"LLM300-Q220-A","text":"Voting across multiple reasoning paths\nBỏ mô hình chỉ còn một token"},{"id":"LLM300-Q220-B","text":"Limiting the model to a single token\nBỏ phiếu trên nhiều lộ trình suy luận"},{"id":"LLM300-Q220-C","text":"Skipping any check of intermediate results\nBỏ kiểm tra kết quả trung gian"},{"id":"LLM300-Q220-D","text":"Reducing every problem to one fixed rule\nBiến mọi bài toán thành quy tắc cố định"}],"correctOptionId":"LLM300-Q220-A","explanation":"Explanation (EN): Self-checking reviews generated output for mistakes or missing evidence. Self-consistency compares several independent reasoning results, which may improve robustness but uses additional computation.\nGiải thích (VI): Tự kiểm tra rà soát đầu ra để tìm lỗi hoặc thiếu chứng cứ. Self-consistency so sánh nhiều kết quả suy luận để tăng độ vững nhưng cần thêm tài nguyên tính toán.\nSlide reference / Đối chiếu slide: Ch.3, pp.24, 30–32, 37","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q221","chapter":3,"number":221,"question":"What is hallucination in generated text?\nHallucination trong văn bản tạo sinh là gì?","options":[{"id":"LLM300-Q221-A","text":"Producing convincing but unsupported claims\nTạo khẳng định thuyết phục nhưng thiếu chứng cứ"},{"id":"LLM300-Q221-B","text":"Returning an empty field for missing data\nĐể trường trống khi thiếu dữ liệu"},{"id":"LLM300-Q221-C","text":"Refusing a request outside allowed policy\nTừ chối yêu cầu ngoài chính sách"},{"id":"LLM300-Q221-D","text":"Correctly quoting a number from the source\nTrích đúng số từ nguồn"}],"correctOptionId":"LLM300-Q221-A","explanation":"Explanation (EN): Hallucination means plausible-sounding content is invented or unsupported by the source. It can mislead decisions, so missing information should be marked missing and critical claims checked.\nGiải thích (VI): Hallucination là nội dung nghe hợp lý nhưng bị bịa hoặc không có căn cứ trong nguồn. Nó có thể gây quyết định sai; phải ghi rõ phần thiếu và kiểm tra các khẳng định quan trọng.\nSlide reference / Đối chiếu slide: Ch.3, pp.34–37; Ch.4, p.10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q222","chapter":4,"number":222,"question":"What supports reliable report summarization?\nĐiều gì hỗ trợ tóm tắt báo cáo đáng tin cậy?","options":[{"id":"LLM300-Q222-A","text":"Require invented details to fill information gaps\nBắt buộc bịa chi tiết khi thiếu"},{"id":"LLM300-Q222-B","text":"Discard the report and rely on model memory\nBỏ báo cáo và chỉ tin trí nhớ mô hình"},{"id":"LLM300-Q222-C","text":"Ask for any interesting text without limits\nHỏi nội dung tùy ý không giới hạn"},{"id":"LLM300-Q222-D","text":"Specify focus, number of points and sources\nChỉ rõ trọng tâm, số ý và nguồn"}],"correctOptionId":"LLM300-Q222-D","explanation":"Explanation (EN): For business reports, LLMs should create drafts or structured summaries from supplied sources. A fixed template supports consistency, and staff must verify high-stakes numbers before publication.\nGiải thích (VI): Với báo cáo nghiệp vụ, LLM nên tạo bản nháp hoặc tóm tắt có cấu trúc dựa trên nguồn cung cấp. Mẫu cố định giữ sự nhất quán và nhân viên phải kiểm chứng số liệu quan trọng trước khi công bố.\nSlide reference / Đối chiếu slide: Ch.4, pp.6–10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q223","chapter":4,"number":223,"question":"Why classify financial news by investor sentiment?\nVì sao phân loại tin tài chính theo cảm xúc nhà đầu tư?","options":[{"id":"LLM300-Q223-A","text":"A direct measurement of customer deposits\nĐo trực tiếp tiền gửi khách hàng"},{"id":"LLM300-Q223-B","text":"An automatic replacement for risk governance\nTự động thay thế quản trị rủi ro"},{"id":"LLM300-Q223-C","text":"A guarantee of future stock price changes\nBảo đảm biến động giá cổ phiếu tương lai"},{"id":"LLM300-Q223-D","text":"A structured view of reported market tone\nCái nhìn có cấu trúc về sắc thái thị trường trong tin"}],"correctOptionId":"LLM300-Q223-D","explanation":"Explanation (EN): Sentiment analysis classifies attitudes in financial texts, often positive, negative or neutral. Duplicate articles should not be counted repeatedly because they distort aggregate signals and do not guarantee future returns.\nGiải thích (VI): Phân tích cảm xúc phân loại sắc thái văn bản tài chính, thường là tích cực, tiêu cực hoặc trung lập. Tin trùng cần được loại vì đếm lặp làm lệch tín hiệu tổng hợp và không dự đoán chắc chắn lợi nhuận tương lai.\nSlide reference / Đối chiếu slide: Ch.4, pp.40–46","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q224","chapter":2,"number":224,"question":"What is a tokenizer's typical output?\nĐầu ra điển hình của tokenizer là gì?","options":[{"id":"LLM300-Q224-A","text":"A final loan contract and signed appendix\nHợp đồng vay cuối có phụ lục ký"},{"id":"LLM300-Q224-B","text":"A verified list of current market prices\nDanh sách giá thị trường đã xác minh"},{"id":"LLM300-Q224-C","text":"Token units and corresponding identifiers\nĐơn vị token và mã định danh tương ứng"},{"id":"LLM300-Q224-D","text":"A chart of bank employee working hours\nBiểu đồ giờ làm nhân viên"}],"correctOptionId":"LLM300-Q224-C","explanation":"Explanation (EN): Tokenization splits text into processing units, which may be full words, word parts or punctuation; tokenizers can map those units to numerical identifiers.\nGiải thích (VI): Tokenization chia văn bản thành đơn vị xử lý; chúng có thể là từ, một phần từ hoặc dấu câu; tokenizer ánh xạ những đơn vị đó sang mã số.\nSlide reference / Đối chiếu slide: Ch.2, p.31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q225","chapter":4,"number":225,"question":"Which task illustrates code-related LLM capabilities?\nNhiệm vụ nào minh họa năng lực liên quan đến mã nguồn của LLM?","options":[{"id":"LLM300-Q225-A","text":"Automatic installation of banking hardware\nTự lắp đặt phần cứng ngân hàng"},{"id":"LLM300-Q225-B","text":"Program understanding and debugging help\nHỗ trợ hiểu chương trình và sửa lỗi"},{"id":"LLM300-Q225-C","text":"Guaranteed certification of software security\nBảo đảm chứng nhận an ninh phần mềm"},{"id":"LLM300-Q225-D","text":"Physical repair of a computer processor\nSửa bộ xử lý máy tính vật lý"}],"correctOptionId":"LLM300-Q225-B","explanation":"Explanation (EN): LLMs can assist with understanding, drafting, debugging and checking code, but generated code or SQL still needs verification of data structure and access permissions before execution.\nGiải thích (VI): LLM hỗ trợ hiểu, viết, sửa lỗi và kiểm tra mã nguồn; mã hoặc SQL tạo ra vẫn phải kiểm tra cấu trúc dữ liệu và quyền truy cập trước khi chạy.\nSlide reference / Đối chiếu slide: Ch.4, p.49","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q226","chapter":4,"number":226,"question":"A banking team records source, output and approver for a critical decision. What does that help?\nNhóm ngân hàng lưu nguồn, đầu ra và người phê duyệt quyết định quan trọng. Việc này giúp ích gì?","options":[{"id":"LLM300-Q226-A","text":"Accountability and later verification\nTrách nhiệm giải trình và xác minh về sau"},{"id":"LLM300-Q226-B","text":"Automatic replacement of every employee role\nTự động thay thế mọi nhân viên"},{"id":"LLM300-Q226-C","text":"Guaranteed elimination of all process delays\nLoại bỏ hoàn toàn trì hoãn"},{"id":"LLM300-Q226-D","text":"Unlimited retrieval of unrelated private data\nTruy xuất không giới hạn dữ liệu riêng không liên quan"}],"correctOptionId":"LLM300-Q226-A","explanation":"Explanation (EN): An AI model provides support, but the institution must retain control, independent checking, audit records and accountability for important outcomes. Outsourcing does not transfer the bank’s final responsibility.\nGiải thích (VI): AI chỉ hỗ trợ; tổ chức phải duy trì quyền kiểm soát, kiểm tra độc lập, nhật ký kiểm toán và trách nhiệm giải trình đối với kết quả quan trọng. Thuê dịch vụ ngoài không chuyển hết trách nhiệm cuối cùng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.4, pp.19, 32, 52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q227","chapter":2,"number":227,"question":"What is the effect of using only one attention head?\nSử dụng chỉ một attention head có tác động gì?","options":[{"id":"LLM300-Q227-A","text":"Showing profile images in a chat window\nHiển thị ảnh hồ sơ trong chat"},{"id":"LLM300-Q227-B","text":"Applying user permissions to cloud folders\nÁp dụng quyền cho thư mục đám mây"},{"id":"LLM300-Q227-C","text":"Maintaining physical disk storage capacity\nDuy trì dung lượng đĩa vật lý"},{"id":"LLM300-Q227-D","text":"Capturing diverse relationships at once\nNắm bắt các mối quan hệ đa dạng đồng thời"}],"correctOptionId":null,"explanation":"Explanation (EN): Self-attention measures relationships among tokens. Multiple attention heads can learn different relationships in parallel; a single head does not provide the same diversity.\nGiải thích (VI): Self-attention tính mối liên hệ giữa các token. Nhiều đầu attention học các kiểu quan hệ khác nhau song song; một đầu đơn lẻ không có cùng độ đa dạng biểu diễn. QUESTION QUALITY NOTE / LƯU Ý ĐỀ: No option correctly answers the question as written. Option D describes the benefit of MULTIPLE attention heads, whereas the question asks about using ONLY ONE head. Therefore do not treat D as technically correct. Không phương án nào đúng với cách hỏi hiện tại. D là lợi ích của NHIỀU đầu attention, nhưng câu hỏi hỏi về CHỈ MỘT đầu. Vì vậy không thể coi D là đáp án đúng về kỹ thuật.\nLưu ý: Câu 227 không có phương án đúng; không tính điểm.\nSlide reference / Đối chiếu slide: Ch.2, pp.35–37","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q228","chapter":1,"number":228,"question":"What is the relationship between AI and NLP?\nMối quan hệ giữa AI và NLP là gì?","options":[{"id":"LLM300-Q228-A","text":"Artificial intelligence is a branch of spelling\nAI là một nhánh của chính tả"},{"id":"LLM300-Q228-B","text":"Language processing excludes machine learning\nXử lý ngôn ngữ không có machine learning"},{"id":"LLM300-Q228-C","text":"NLP is a hardware manufacturing standard\nNLP là tiêu chuẩn sản xuất phần cứng"},{"id":"LLM300-Q228-D","text":"NLP is an area within artificial intelligence\nNLP là lĩnh vực nằm trong AI"}],"correctOptionId":"LLM300-Q228-D","explanation":"Explanation (EN): Natural Language Processing is an AI area concerned with analyzing, understanding and generating human language. LLMs provide language-related capabilities rather than guaranteed factual accuracy.\nGiải thích (VI): Xử lý ngôn ngữ tự nhiên là lĩnh vực AI nghiên cứu phân tích, hiểu và tạo sinh ngôn ngữ con người. LLM hỗ trợ tác vụ ngôn ngữ chứ không bảo đảm mọi dữ kiện chính xác.\nSlide reference / Đối chiếu slide: Ch.1, pp.5, 19; Ch.2, pp.18–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q229","chapter":1,"number":229,"question":"What best describes chain-of-thought prompting?\nMô tả nào đúng nhất về chain-of-thought prompting?","options":[{"id":"LLM300-Q229-A","text":"Guiding a sequence of reasoning steps\nĐịnh hướng chuỗi các bước suy luận"},{"id":"LLM300-Q229-B","text":"Removing all context from the instruction\nBỏ toàn bộ ngữ cảnh"},{"id":"LLM300-Q229-C","text":"Replacing the model with a keyword index\nThay mô hình bằng chỉ mục từ khóa"},{"id":"LLM300-Q229-D","text":"Restricting output to random single words\nChỉ tạo từ ngẫu nhiên"}],"correctOptionId":"LLM300-Q229-A","explanation":"Explanation (EN): Chain-of-thought prompting guides a problem through linked intermediate reasoning steps, unlike a simple keyword list or a change to model weights.\nGiải thích (VI): Chain-of-thought hướng dẫn bài toán qua các bước suy luận trung gian liên kết, không chỉ là danh sách từ khóa hay thay trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.1, pp.27–29; Ch.3, pp.27, 30","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q230","chapter":2,"number":230,"question":"Why might a model still make mistakes after RLHF?\nVì sao mô hình vẫn có thể sai sau RLHF?","options":[{"id":"LLM300-Q230-A","text":"Human feedback removes every factual error\nPhản hồi con người loại bỏ mọi lỗi dữ kiện"},{"id":"LLM300-Q230-B","text":"Preference alignment does not guarantee truth\nPhù hợp sở thích không bảo đảm tính đúng sự thật"},{"id":"LLM300-Q230-C","text":"Reward models are equivalent to databases\nReward model tương đương cơ sở dữ liệu"},{"id":"LLM300-Q230-D","text":"The interface alone determines all answers\nChỉ giao diện quyết định mọi đáp án"}],"correctOptionId":"LLM300-Q230-B","explanation":"Explanation (EN): Reinforcement Learning from Human Feedback uses human preference judgments and a reward model to align model responses with preferred behavior. Preference alignment does not guarantee that every fact is true.\nGiải thích (VI): RLHF dùng đánh giá sở thích con người và reward model để điều chỉnh câu trả lời theo hành vi được ưa thích. Phù hợp sở thích không bảo đảm mọi thông tin đều đúng.\nSlide reference / Đối chiếu slide: Ch.2, p.48","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q231","chapter":3,"number":231,"question":"What is the risk of granting an assistant broad database access?\nRủi ro khi cho trợ lý quyền truy cập cơ sở dữ liệu quá rộng là gì?","options":[{"id":"LLM300-Q231-A","text":"A smaller icon on the file-upload control\nBiểu tượng tải tệp nhỏ hơn"},{"id":"LLM300-Q231-B","text":"Permissions exceeding the assistant's needs\nQuyền truy cập vượt quá nhu cầu của trợ lý"},{"id":"LLM300-Q231-C","text":"A shorter visible description of the user\nMô tả người dùng ngắn hơn"},{"id":"LLM300-Q231-D","text":"A different paragraph spacing in the prompt\nGiãn cách đoạn trong prompt khác"}],"correctOptionId":"LLM300-Q231-B","explanation":"Explanation (EN): Least-privilege access means granting users and tools only the permissions necessary for their jobs. Test on sample or separate data to avoid damaging live records.\nGiải thích (VI): Nguyên tắc quyền tối thiểu là chỉ cấp quyền cần thiết cho người dùng/công cụ. Cần thử trên dữ liệu mẫu hoặc bản sao để tránh làm hỏng dữ liệu đang vận hành.\nSlide reference / Đối chiếu slide: Ch.3, pp.38–39; Ch.4, p.20","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q232","chapter":3,"number":232,"question":"A bank needs repeatable extraction of figures. Which change often helps?\nNgân hàng cần trích xuất số liệu lặp lại ổn định. Thay đổi nào thường hữu ích?","options":[{"id":"LLM300-Q232-A","text":"Remove all constraints from the prompt\nBỏ mọi ràng buộc prompt"},{"id":"LLM300-Q232-B","text":"Use less random output selection\nChọn đầu ra ít ngẫu nhiên hơn"},{"id":"LLM300-Q232-C","text":"Allow unrestricted response creativity\nCho phép sáng tạo không giới hạn"},{"id":"LLM300-Q232-D","text":"Increase the likelihood of invented facts\nTăng khả năng bịa dữ kiện"}],"correctOptionId":"LLM300-Q232-B","explanation":"Explanation (EN): Temperature controls randomness in token selection. A lower value is usually better for consistent extraction; a higher value produces more diverse ideas, but neither guarantees truth.\nGiải thích (VI): Temperature điều chỉnh độ ngẫu nhiên khi chọn token. Giá trị thấp thường phù hợp để trích xuất ổn định; giá trị cao tạo ý tưởng đa dạng hơn nhưng không bảo đảm độ đúng.\nSlide reference / Đối chiếu slide: Ch.3, pp.11–14","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q233","chapter":1,"number":233,"question":"A system assigns likelihoods to possible word sequences. What is its function?\nHệ thống gán xác suất cho các chuỗi từ khả dĩ. Chức năng là gì?","options":[{"id":"LLM300-Q233-A","text":"Verify the physical origin of stored files\nKiểm chứng xuất xứ vật lý của tệp"},{"id":"LLM300-Q233-B","text":"Execute fixed instructions in accounting software\nThực thi lệnh kế toán cố định"},{"id":"LLM300-Q233-C","text":"Encrypt sensitive records in large databases\nMã hóa hồ sơ nhạy cảm"},{"id":"LLM300-Q233-D","text":"Estimate probabilities for sequences of text\nƯớc lượng xác suất cho chuỗi văn bản"}],"correctOptionId":"LLM300-Q233-D","explanation":"Explanation (EN): A language model assigns probabilities to text sequences. A conditional model estimates the next word or token using preceding context rather than unrelated account information.\nGiải thích (VI): Mô hình ngôn ngữ gán xác suất cho chuỗi văn bản. Mô hình có điều kiện ước lượng từ hoặc token tiếp theo dựa trên ngữ cảnh trước, không dựa vào thông tin tài khoản không liên quan.\nSlide reference / Đối chiếu slide: Ch.1, pp.6–11","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q234","chapter":1,"number":234,"question":"What is the purpose of fine-tuning?\nMục đích của fine-tuning là gì?","options":[{"id":"LLM300-Q234-A","text":"Increasing screen resolution for users\nTăng độ phân giải màn hình"},{"id":"LLM300-Q234-B","text":"Destroying learned weights before deployment\nXóa trọng số đã học trước triển khai"},{"id":"LLM300-Q234-C","text":"Adapting an existing model to a target task\nĐiều chỉnh mô hình hiện có cho nhiệm vụ đích"},{"id":"LLM300-Q234-D","text":"Replacing all documents with audio recordings\nThay mọi tài liệu bằng bản ghi âm"}],"correctOptionId":"LLM300-Q234-C","explanation":"Explanation (EN): Fine-tuning adjusts a pre-trained model for a target task, typically through training on specialized examples. Prompting instead changes the instructions without directly optimizing the model weights.\nGiải thích (VI): Fine-tuning điều chỉnh mô hình đã tiền huấn luyện cho nhiệm vụ đích bằng các ví dụ chuyên biệt. Prompting thay đổi chỉ dẫn mà không trực tiếp tối ưu trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.1, p.26; Ch.2, p.47","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q235","chapter":4,"number":235,"question":"What is an appropriate fallback when a chatbot cannot resolve an issue?\nCách dự phòng phù hợp khi chatbot không giải quyết được vấn đề là gì?","options":[{"id":"LLM300-Q235-A","text":"Declare that the complaint is invalid\nTuyên bố khiếu nại vô hiệu"},{"id":"LLM300-Q235-B","text":"Request the customer's login password\nYêu cầu mật khẩu đăng nhập"},{"id":"LLM300-Q235-C","text":"Escalate the matter to a human support agent\nChuyển vụ việc cho nhân viên hỗ trợ"},{"id":"LLM300-Q235-D","text":"Invent a completed reversal transaction\nBịa giao dịch hoàn tiền đã hoàn tất"}],"correctOptionId":"LLM300-Q235-C","explanation":"Explanation (EN): Banking chatbots are best used for repeated customer requests and verified in-app assistance. Unresolved or sensitive issues should be escalated to authorized human staff, not resolved by inventing an answer.\nGiải thích (VI): Chatbot ngân hàng phù hợp với các yêu cầu lặp lại và hỗ trợ trong ứng dụng đã xác thực. Vấn đề nhạy cảm hoặc chưa xử lý được phải chuyển nhân viên có thẩm quyền, không được bịa câu trả lời.\nSlide reference / Đối chiếu slide: Ch.4, pp.11–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q236","chapter":2,"number":236,"question":"What is meant by the GPT acronym?\nGPT là chữ viết tắt của cụm nào?","options":[{"id":"LLM300-Q236-A","text":"Guided Parameter Testing Template\nGuided Parameter Testing Template"},{"id":"LLM300-Q236-B","text":"Graph Processing Transfer Technology\nGraph Processing Transfer Technology"},{"id":"LLM300-Q236-C","text":"General Prediction Training Technique\nGeneral Prediction Training Technique"},{"id":"LLM300-Q236-D","text":"Generative Pre-trained Transformer\nGenerative Pre-trained Transformer"}],"correctOptionId":"LLM300-Q236-D","explanation":"Explanation (EN): GPT stands for Generative Pre-trained Transformer: it is pre-trained and uses Transformer- based generative modeling.\nGiải thích (VI): GPT viết tắt của Generative Pre-trained Transformer: mô hình được tiền huấn luyện và tạo sinh dựa trên kiến trúc Transformer.\nSlide reference / Đối chiếu slide: Ch.2, pp.5, 8","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q237","chapter":1,"number":237,"question":"What is inverse scaling?\nInverse scaling là gì?","options":[{"id":"LLM300-Q237-A","text":"Performance declining as model scale rises\nHiệu năng giảm khi quy mô mô hình tăng"},{"id":"LLM300-Q237-B","text":"Inference speed matching memory capacity\nTốc độ suy luận bằng dung lượng bộ nhớ"},{"id":"LLM300-Q237-C","text":"Training data becoming entirely unlabeled\nDữ liệu huấn luyện trở thành không gán nhãn"},{"id":"LLM300-Q237-D","text":"Performance always improving with model size\nHiệu năng luôn tăng khi mô hình lớn lên"}],"correctOptionId":"LLM300-Q237-A","explanation":"Explanation (EN): Inverse scaling describes cases where performance on a task worsens as model size increases. It is a caution against assuming larger always means better.\nGiải thích (VI): Inverse scaling là hiện tượng hiệu năng ở một số tác vụ xấu đi khi tăng quy mô mô hình; vì thế không thể mặc định càng lớn càng tốt.\nSlide reference / Đối chiếu slide: Ch.1, p.30","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q238","chapter":2,"number":238,"question":"What is the role of layer normalization?\nVai trò của layer normalization là gì?","options":[{"id":"LLM300-Q238-A","text":"Normalizing representations within layers\nChuẩn hóa biểu diễn trong các lớp"},{"id":"LLM300-Q238-B","text":"Displaying the final generated response\nHiển thị câu trả lời cuối"},{"id":"LLM300-Q238-C","text":"Encrypting customer identities before login\nMã hóa danh tính trước đăng nhập"},{"id":"LLM300-Q238-D","text":"Ranking loan files by their monetary value\nXếp hồ sơ vay theo giá trị tiền"}],"correctOptionId":"LLM300-Q238-A","explanation":"Explanation (EN): Layer normalization stabilizes the numerical representations within a Transformer layer; it is a model-internal mechanism, not an interface or banking operation.\nGiải thích (VI): Layer normalization chuẩn hóa các biểu diễn số trong lớp Transformer để hỗ trợ ổn định quá trình xử lý, không phải thao tác giao diện hay nghiệp vụ ngân hàng.\nSlide reference / Đối chiếu slide: Ch.2, pp.28, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q239","chapter":1,"number":239,"question":"Why can LLM training become expensive?\nVì sao huấn luyện LLM có thể tốn kém?","options":[{"id":"LLM300-Q239-A","text":"The volume of printed registration forms\nSố mẫu đăng ký in giấy"},{"id":"LLM300-Q239-B","text":"Compute capacity and memory requirements\nNhu cầu năng lực tính toán và bộ nhớ"},{"id":"LLM300-Q239-C","text":"The number of physical bank branches\nSố chi nhánh vật lý"},{"id":"LLM300-Q239-D","text":"The number of paragraph heading styles\nSố kiểu tiêu đề đoạn"}],"correctOptionId":"LLM300-Q239-B","explanation":"Explanation (EN): Model scale involves parameters, training tokens, compute and energy. Larger systems can be costly and do not automatically outperform smaller models on every task, so suitability and evaluation matter.\nGiải thích (VI): Quy mô mô hình liên quan đến tham số, token huấn luyện, năng lực tính toán và năng lượng. Mô hình lớn tốn kém và không tự động tốt hơn ở mọi tác vụ; cần xét tính phù hợp và đánh giá.\nSlide reference / Đối chiếu slide: Ch.1, pp.15–18, 30–31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q240","chapter":4,"number":240,"question":"One press release appears on several sites. What issue can duplicate removal prevent?\nMột thông cáo báo chí xuất hiện trên nhiều trang. Loại bỏ bản trùng giúp tránh vấn đề gì?","options":[{"id":"LLM300-Q240-A","text":"Automatically correcting the source's claims\nTự sửa mọi tuyên bố của nguồn"},{"id":"LLM300-Q240-B","text":"Reducing the vocabulary size of the model\nGiảm vốn từ của mô hình"},{"id":"LLM300-Q240-C","text":"Converting all sentiment labels to neutral\nĐổi mọi nhãn cảm xúc thành trung tính"},{"id":"LLM300-Q240-D","text":"Counting the same news event repeatedly\nĐếm lặp một sự kiện tin tức"}],"correctOptionId":"LLM300-Q240-D","explanation":"Explanation (EN): Sentiment analysis classifies attitudes in financial texts, often positive, negative or neutral. Duplicate articles should not be counted repeatedly because they distort aggregate signals and do not guarantee future returns.\nGiải thích (VI): Phân tích cảm xúc phân loại sắc thái văn bản tài chính, thường là tích cực, tiêu cực hoặc trung lập. Tin trùng cần được loại vì đếm lặp làm lệch tín hiệu tổng hợp và không dự đoán chắc chắn lợi nhuận tương lai.\nSlide reference / Đối chiếu slide: Ch.4, pp.40–46","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q241","chapter":4,"number":241,"question":"A user pastes a secret service credential into an AI request. Which risk arises?\nNgười dùng dán thông tin xác thực dịch vụ bí mật vào yêu cầu AI. Rủi ro nào phát sinh?","options":[{"id":"LLM300-Q241-A","text":"The prompt automatically becomes encrypted\nNội dung prompt tự mã hóa"},{"id":"LLM300-Q241-B","text":"The file's content gains a digital signature\nTệp được gắn chữ ký số"},{"id":"LLM300-Q241-C","text":"The credential may be disclosed or misused\nThông tin xác thực có thể bị lộ hoặc bị lạm dụng"},{"id":"LLM300-Q241-D","text":"The model necessarily becomes more accurate\nMô hình chắc chắn chính xác hơn"}],"correctOptionId":"LLM300-Q241-C","explanation":"Explanation (EN): Banking data can contain confidential customer identifiers or credentials. Data minimization, masking, legal safeguards and secure access reduce disclosure risks; an external service does not make these duties disappear.\nGiải thích (VI): Dữ liệu ngân hàng có thể chứa thông tin nhận dạng hoặc thông tin xác thực nhạy cảm. Giảm thiểu dữ liệu, che thông tin, bảo đảm cơ sở pháp lý và kiểm soát truy cập giúp hạn chế rò rỉ; dùng dịch vụ ngoài không làm mất trách nhiệm bảo vệ dữ liệu.\nSlide reference / Đối chiếu slide: Ch.4, pp.19–20; Ch.3, p.38","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q242","chapter":1,"number":242,"question":"What is in-context learning?\nIn-context learning là gì?","options":[{"id":"LLM300-Q242-A","text":"Copying permanent labels into its training set\nChép nhãn cố định vào dữ liệu huấn luyện"},{"id":"LLM300-Q242-B","text":"Replacing the tokenizer with a new program\nThay bộ tách token bằng chương trình mới"},{"id":"LLM300-Q242-C","text":"Learning task patterns from prompt context\nHọc mẫu nhiệm vụ từ ngữ cảnh prompt"},{"id":"LLM300-Q242-D","text":"Rewriting all model weights during a chat\nViết lại trọng số mô hình trong trò chuyện"}],"correctOptionId":"LLM300-Q242-C","explanation":"Explanation (EN): Few-shot in-context learning supplies several demonstrations inside the prompt. The model infers the desired pattern from these examples without changing its permanent weights.\nGiải thích (VI): Few-shot cung cấp một số ví dụ ngay trong prompt. Mô hình suy ra cách làm từ ví dụ mà không thay đổi vĩnh viễn trọng số đã huấn luyện.\nSlide reference / Đối chiếu slide: Ch.1, pp.24–25; Ch.3, p.27","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q243","chapter":2,"number":243,"question":"What is the purpose of human preference feedback?\nMục đích của phản hồi sở thích con người là gì?","options":[{"id":"LLM300-Q243-A","text":"Human judgments about response quality\nĐánh giá của con người về chất lượng câu trả lời"},{"id":"LLM300-Q243-B","text":"A guarantee of factual truth for every word\nBảo đảm mọi chữ đều đúng sự thật"},{"id":"LLM300-Q243-C","text":"A method for compressing customer images\nNén ảnh khách hàng"},{"id":"LLM300-Q243-D","text":"A substitute for all organizational policies\nThay thế mọi chính sách tổ chức"}],"correctOptionId":"LLM300-Q243-A","explanation":"Explanation (EN): Reinforcement Learning from Human Feedback uses human preference judgments and a reward model to align model responses with preferred behavior. Preference alignment does not guarantee that every fact is true.\nGiải thích (VI): RLHF dùng đánh giá sở thích con người và reward model để điều chỉnh câu trả lời theo hành vi được ưa thích. Phù hợp sở thích không bảo đảm mọi thông tin đều đúng.\nSlide reference / Đối chiếu slide: Ch.2, p.48","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q244","chapter":3,"number":244,"question":"Which practice reduces prompt-injection risk?\nThực hành nào giảm rủi ro prompt injection?","options":[{"id":"LLM300-Q244-A","text":"Separating untrusted content from instructions\nTách nội dung không đáng tin khỏi chỉ dẫn"},{"id":"LLM300-Q244-B","text":"Treating every uploaded sentence as policy\nXem mọi câu tải lên là chính sách"},{"id":"LLM300-Q244-C","text":"Disabling all output checks to save time\nTắt mọi kiểm tra đầu ra"},{"id":"LLM300-Q244-D","text":"Granting unrestricted access to bank systems\nCho truy cập ngân hàng không giới hạn"}],"correctOptionId":"LLM300-Q244-A","explanation":"Explanation (EN): Prompt injection places malicious instructions inside less-trusted data or outside files. Separate that content from system instructions, restrict tool privileges and review external material.\nGiải thích (VI): Prompt injection cài chỉ dẫn độc hại vào dữ liệu ít đáng tin hoặc tệp bên ngoài. Cần tách nội dung này khỏi chỉ dẫn hệ thống, hạn chế quyền công cụ và rà soát tài liệu ngoài.\nSlide reference / Đối chiếu slide: Ch.3, p.39","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q245","chapter":3,"number":245,"question":"Why request source citations?\nVì sao nên yêu cầu trích dẫn nguồn?","options":[{"id":"LLM300-Q245-A","text":"Increasing the number of model parameters\nTăng số tham số mô hình"},{"id":"LLM300-Q245-B","text":"Tracing statements back to source locations\nTruy vết phát biểu về vị trí nguồn"},{"id":"LLM300-Q245-C","text":"Automatically correcting all numerical errors\nTự động sửa mọi lỗi số"},{"id":"LLM300-Q245-D","text":"Bypassing the organization's review process\nVượt qua rà soát tổ chức"}],"correctOptionId":"LLM300-Q245-B","explanation":"Explanation (EN): Grounding bases claims and extracted fields on identifiable source material. When evidence is absent, state that fact or leave the field blank rather than inventing figures or citations.\nGiải thích (VI): Grounding yêu cầu khẳng định và trường trích xuất dựa trên nguồn xác định. Nếu không có bằng chứng, phải ghi thiếu hoặc để trống thay vì bịa số liệu hay trích dẫn.\nSlide reference / Đối chiếu slide: Ch.3, pp.35–37; Ch.4, p.10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q246","chapter":3,"number":246,"question":"An assistant reads outside documents with potential hidden commands. What protection helps?\nTrợ lý đọc tài liệu bên ngoài có thể chứa lệnh ẩn. Biện pháp bảo vệ nào hữu ích?","options":[{"id":"LLM300-Q246-A","text":"Separating untrusted content from instructions\nTách nội dung không đáng tin khỏi chỉ dẫn"},{"id":"LLM300-Q246-B","text":"Disabling all output checks to save time\nTắt mọi kiểm tra đầu ra"},{"id":"LLM300-Q246-C","text":"Treating every uploaded sentence as policy\nXem mọi câu tải lên là chính sách"},{"id":"LLM300-Q246-D","text":"Granting unrestricted access to bank systems\nCho truy cập ngân hàng không giới hạn"}],"correctOptionId":"LLM300-Q246-A","explanation":"Explanation (EN): Prompt injection places malicious instructions inside less-trusted data or outside files. Separate that content from system instructions, restrict tool privileges and review external material.\nGiải thích (VI): Prompt injection cài chỉ dẫn độc hại vào dữ liệu ít đáng tin hoặc tệp bên ngoài. Cần tách nội dung này khỏi chỉ dẫn hệ thống, hạn chế quyền công cụ và rà soát tài liệu ngoài.\nSlide reference / Đối chiếu slide: Ch.3, p.39","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q247","chapter":1,"number":247,"question":"What is a key difference between prompting and fine-tuning?\nKhác biệt chính giữa prompting và fine-tuning là gì?","options":[{"id":"LLM300-Q247-A","text":"Replacing the Transformer architecture\nThay thế kiến trúc Transformer"},{"id":"LLM300-Q247-B","text":"Pre-training a new base model on text\nTiền huấn luyện mô hình cơ sở mới"},{"id":"LLM300-Q247-C","text":"Prompting without model-weight updates\nPrompting không cập nhật trọng số mô hình"},{"id":"LLM300-Q247-D","text":"Fine-tuning by optimizing model weights\nFine-tuning bằng tối ưu trọng số mô hình"}],"correctOptionId":"LLM300-Q247-C","explanation":"Explanation (EN): Fine-tuning adjusts a pre-trained model for a target task, typically through training on specialized examples. Prompting instead changes the instructions without directly optimizing the model weights.\nGiải thích (VI): Fine-tuning điều chỉnh mô hình đã tiền huấn luyện cho nhiệm vụ đích bằng các ví dụ chuyên biệt. Prompting thay đổi chỉ dẫn mà không trực tiếp tối ưu trọng số mô hình. QUESTION QUALITY NOTE / LƯU Ý ĐỀ: Both C and D are true: prompting leaves weights unchanged and fine- tuning updates/optimizes weights. The question does not specify which side of the contrast to choose, so it has two defensible answers. C và D đều đúng: prompting không cập nhật trọng số, fine-tuning có tối ưu/cập nhật trọng số. Câu hỏi không xác định phải chọn vế nào, nên có hai phương án đúng.\nLưu ý: Câu 247 có hai phương án đúng C và D, chấp nhận cả hai.\nSlide reference / Đối chiếu slide: Ch.1, p.26; Ch.2, p.47","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc","altCorrectOptionId":"LLM300-Q247-D"},{"id":"LLM300-Q248","chapter":3,"number":248,"question":"Why specify the intended audience?\nVì sao cần chỉ rõ đối tượng độc giả mong muốn?","options":[{"id":"LLM300-Q248-A","text":"The permanent number of model parameters\nSố tham số mô hình cố định"},{"id":"LLM300-Q248-B","text":"The amount of memory in the GPU hardware\nDung lượng bộ nhớ GPU"},{"id":"LLM300-Q248-C","text":"Language complexity and explanation style\nĐộ phức tạp ngôn ngữ và phong cách giải thích"},{"id":"LLM300-Q248-D","text":"The physical location of the model server\nVị trí vật lý máy chủ"}],"correctOptionId":"LLM300-Q248-C","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q249","chapter":3,"number":249,"question":"Instructions change outputs without directly updating learned weights. Which approach is used?\nChỉ dẫn thay đổi đầu ra nhưng không trực tiếp cập nhật trọng số đã học. Cách tiếp cận nào được dùng?","options":[{"id":"LLM300-Q249-A","text":"Replacing the Transformer architecture\nThay kiến trúc Transformer"},{"id":"LLM300-Q249-B","text":"Fine-tuning by optimizing model weights\nFine-tuning bằng tối ưu trọng số"},{"id":"LLM300-Q249-C","text":"Pre-training a new base model on text\nTiền huấn luyện mô hình cơ sở mới"},{"id":"LLM300-Q249-D","text":"Prompting without model-weight updates\nPrompting không cập nhật trọng số mô hình"}],"correctOptionId":"LLM300-Q249-D","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q250","chapter":1,"number":250,"question":"Which family commonly uses encoder-decoder architecture?\nHọ mô hình nào thường dùng kiến trúc encoder-decoder?","options":[{"id":"LLM300-Q250-A","text":"BERT and RoBERTa encoder-only models\nBERT và RoBERTa thuộc encoder-only"},{"id":"LLM300-Q250-B","text":"GPT and similar decoder-only models\nGPT và mô hình tương tự thuộc decoder-only"},{"id":"LLM300-Q250-C","text":"T5 and BART sequence-to-sequence models\nT5 và BART thuộc sequence-to-sequence"},{"id":"LLM300-Q250-D","text":"Word2Vec standalone embedding models\nMô hình embedding Word2Vec độc lập"}],"correctOptionId":"LLM300-Q250-C","explanation":"Explanation (EN): GPT belongs to the decoder-only Transformer family and is oriented toward text generation. BERT is an encoder-only model for language representations; T5/BART use encoder–decoder structures.\nGiải thích (VI): GPT thuộc họ Transformer decoder-only, thiên về tạo sinh văn bản. BERT thuộc nhóm encoder-only để biểu diễn và hiểu ngôn ngữ; T5/BART dùng kiến trúc encoder–decoder.\nSlide reference / Đối chiếu slide: Ch.1, p.12; Ch.2, pp.27–28","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q251","chapter":2,"number":251,"question":"What is the purpose of an API in an AI application?\nMục đích của API trong ứng dụng AI là gì?","options":[{"id":"LLM300-Q251-A","text":"An automatic physical identity scanner\nMáy quét định danh vật lý tự động"},{"id":"LLM300-Q251-B","text":"A manual accounting policy instruction\nChỉ dẫn chính sách kế toán thủ công"},{"id":"LLM300-Q251-C","text":"An application programming interface\nGiao diện lập trình ứng dụng"},{"id":"LLM300-Q251-D","text":"An archive of printed credit agreements\nKho lưu hợp đồng tín dụng giấy"}],"correctOptionId":"LLM300-Q251-C","explanation":"Explanation (EN): An API is an Application Programming Interface through which application components or services communicate; orchestration and tool-calling connect the model to approved capabilities.\nGiải thích (VI): API là giao diện lập trình ứng dụng giúp các thành phần/dịch vụ trao đổi; lớp điều phối và gọi công cụ kết nối mô hình với khả năng được cấp phép.\nSlide reference / Đối chiếu slide: Ch.2, p.23","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q252","chapter":2,"number":252,"question":"Why is positional information useful?\nVì sao thông tin vị trí có ích?","options":[{"id":"LLM300-Q252-A","text":"The date when the account was first opened\nNgày tài khoản được mở lần đầu"},{"id":"LLM300-Q252-B","text":"The country where the processor was made\nQuốc gia sản xuất bộ xử lý"},{"id":"LLM300-Q252-C","text":"The color selected for the chat interface\nMàu giao diện chat"},{"id":"LLM300-Q252-D","text":"Information about each token's position\nThông tin vị trí của từng token"}],"correctOptionId":"LLM300-Q252-D","explanation":"Explanation (EN): Positional encoding supplies information about token order. Word order can change sentence meaning even when the same words are present.\nGiải thích (VI): Mã hóa vị trí bổ sung thông tin thứ tự token. Trật tự từ có thể thay đổi nghĩa câu dù các từ giống nhau.\nSlide reference / Đối chiếu slide: Ch.2, p.34","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q253","chapter":2,"number":253,"question":"What is document extraction in an assistant?\nTrích xuất tài liệu trong trợ lý là gì?","options":[{"id":"LLM300-Q253-A","text":"Teaching the neural network new weights live\nDạy mạng nơ-ron trọng số mới ngay lập tức"},{"id":"LLM300-Q253-B","text":"Issuing an electronic bank transfer receipt\nPhát hành biên lai chuyển khoản ngân hàng"},{"id":"LLM300-Q253-C","text":"Extracting usable content from documents\nTrích xuất nội dung có thể sử dụng từ tài liệu"},{"id":"LLM300-Q253-D","text":"Assigning permanent labels to all customers\nGán nhãn vĩnh viễn cho mọi khách hàng"}],"correctOptionId":"LLM300-Q253-C","explanation":"Explanation (EN): Document extraction turns source document content into usable text or structured fields; it does not automatically retrain the model or grant permission for unrelated actions.\nGiải thích (VI): Trích xuất tài liệu chuyển nội dung nguồn thành văn bản hoặc trường dữ liệu có thể sử dụng, không tự huấn luyện lại mô hình hay cấp quyền cho hành động khác.\nSlide reference / Đối chiếu slide: Ch.2, p.22; Ch.4, p.28","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q254","chapter":1,"number":254,"question":"What is a pre-trained language model?\nMô hình ngôn ngữ được tiền huấn luyện là gì?","options":[{"id":"LLM300-Q254-A","text":"A model containing only hand-written rules\nMô hình chỉ chứa quy tắc viết tay"},{"id":"LLM300-Q254-B","text":"A model fitted only to a single new customer\nMô hình chỉ học cho một khách hàng mới"},{"id":"LLM300-Q254-C","text":"A model that requires no language examples\nMô hình không cần ví dụ ngôn ngữ"},{"id":"LLM300-Q254-D","text":"A model trained on broad text in advance\nMô hình được học trước trên văn bản đa dạng"}],"correctOptionId":"LLM300-Q254-D","explanation":"Explanation (EN): Pre-training learns broad language patterns from large text data, including self-supervised prediction objectives. It precedes specialization and does not mean memorizing only the current chat.\nGiải thích (VI): Tiền huấn luyện học mẫu ngôn ngữ tổng quát từ văn bản lớn, có thể dùng mục tiêu dự đoán tự giám sát. Giai đoạn này diễn ra trước điều chỉnh chuyên biệt, không chỉ ghi nhớ cuộc hội thoại hiện tại.\nSlide reference / Đối chiếu slide: Ch.1, p.14; Ch.2, pp.45–47","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q255","chapter":2,"number":255,"question":"What does multi-head attention enable?\nMulti-head attention cho phép điều gì?","options":[{"id":"LLM300-Q255-A","text":"Several attention patterns in one layer\nNhiều mẫu attention trong cùng một lớp"},{"id":"LLM300-Q255-B","text":"Direct access to every banking database\nTruy cập trực tiếp mọi cơ sở dữ liệu ngân hàng"},{"id":"LLM300-Q255-C","text":"A single static rule for every token pair\nMột quy tắc cố định cho mọi cặp token"},{"id":"LLM300-Q255-D","text":"Unlimited memory without any constraints\nBộ nhớ không giới hạn"}],"correctOptionId":"LLM300-Q255-A","explanation":"Explanation (EN): Self-attention measures relationships among tokens. Multiple attention heads can learn different relationships in parallel; a single head does not provide the same diversity.\nGiải thích (VI): Self-attention tính mối liên hệ giữa các token. Nhiều đầu attention học các kiểu quan hệ khác nhau song song; một đầu đơn lẻ không có cùng độ đa dạng biểu diễn.\nSlide reference / Đối chiếu slide: Ch.2, pp.35–37","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q256","chapter":1,"number":256,"question":"A general model needs to follow a bank's specialized writing style. Which action fits?\nMột mô hình tổng quát cần theo văn phong chuyên biệt của ngân hàng. Hành động nào phù hợp?","options":[{"id":"LLM300-Q256-A","text":"Discard all data from the original training\nBỏ mọi dữ liệu huấn luyện gốc"},{"id":"LLM300-Q256-B","text":"Disable every constraint in the instructions\nTắt mọi ràng buộc trong chỉ dẫn"},{"id":"LLM300-Q256-C","text":"Adjust the model for the intended task\nĐiều chỉnh mô hình theo nhiệm vụ mong muốn"},{"id":"LLM300-Q256-D","text":"Turn the language model into a database\nBiến mô hình ngôn ngữ thành cơ sở dữ liệu"}],"correctOptionId":"LLM300-Q256-C","explanation":"Explanation (EN): Fine-tuning adjusts a pre-trained model for a target task, typically through training on specialized examples. Prompting instead changes the instructions without directly optimizing the model weights.\nGiải thích (VI): Fine-tuning điều chỉnh mô hình đã tiền huấn luyện cho nhiệm vụ đích bằng các ví dụ chuyên biệt. Prompting thay đổi chỉ dẫn mà không trực tiếp tối ưu trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.1, p.26; Ch.2, p.47","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q257","chapter":4,"number":257,"question":"Who should retain control over important financial decisions?\nAi nên giữ quyền kiểm soát các quyết định tài chính quan trọng?","options":[{"id":"LLM300-Q257-A","text":"The model because its output is fluent\nMô hình vì đầu ra trôi chảy"},{"id":"LLM300-Q257-B","text":"The prompt designer without formal authority\nNgười thiết kế prompt không có thẩm quyền"},{"id":"LLM300-Q257-C","text":"Any customer using the chat interface\nBất kỳ khách hàng nào sử dụng chat"},{"id":"LLM300-Q257-D","text":"Authorized humans under organizational rules\nCon người được ủy quyền theo quy định tổ chức"}],"correctOptionId":"LLM300-Q257-D","explanation":"Explanation (EN): Human oversight keeps consequential credit, reporting and customer decisions with authorized staff. An AI draft or recommendation must be reviewed before final approval or sending.\nGiải thích (VI): Giám sát con người bảo đảm quyết định tín dụng, báo cáo và hỗ trợ khách hàng quan trọng thuộc nhân sự được ủy quyền. Bản nháp hoặc khuyến nghị AI phải được kiểm tra trước khi phê duyệt hoặc gửi.\nSlide reference / Đối chiếu slide: Ch.4, pp.8, 19, 27, 32","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q258","chapter":3,"number":258,"question":"What is the purpose of informing users about AI use?\nMục đích của việc thông báo cho người dùng về AI là gì?","options":[{"id":"LLM300-Q258-A","text":"Transparency about the use of automation\nMinh bạch về sử dụng tự động hóa"},{"id":"LLM300-Q258-B","text":"Removing accountability from the bank\nLoại bỏ trách nhiệm của ngân hàng"},{"id":"LLM300-Q258-C","text":"Guaranteeing that every suggestion is correct\nBảo đảm mọi gợi ý đúng"},{"id":"LLM300-Q258-D","text":"Avoiding all data-protection requirements\nTránh mọi yêu cầu bảo vệ dữ liệu"}],"correctOptionId":"LLM300-Q258-A","explanation":"Explanation (EN): Responsible AI requires fairness assessment, transparency and human control. Automation does not remove a bank’s obligations to explain and oversee high-stakes outcomes.\nGiải thích (VI): AI có trách nhiệm cần đánh giá công bằng, minh bạch và kiểm soát của con người. Tự động hóa không xóa nghĩa vụ giải thích và giám sát các quyết định quan trọng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.3, p.40; Ch.4, p.52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q259","chapter":4,"number":259,"question":"AI prepares a formal overdue-payment email before it is sent. What remains necessary?\nAI soạn email nhắc trả nợ chính thức trước khi gửi. Điều gì vẫn cần thiết?","options":[{"id":"LLM300-Q259-A","text":"No verification is needed for generated text\nKhông cần kiểm tra nội dung tạo
