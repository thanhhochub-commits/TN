","text":"Training has no energy cost\nHuấn luyện không tiêu tốn năng lượng"}],"correctOptionId":"LLM300-Q059-A","explanation":"Explanation (EN): Model scale involves parameters, training tokens, compute and energy. Larger systems can be costly and do not automatically outperform smaller models on every task, so suitability and evaluation matter.\nGiải thích (VI): Quy mô mô hình liên quan đến tham số, token huấn luyện, năng lực tính toán và năng lượng. Mô hình lớn tốn kém và không tự động tốt hơn ở mọi tác vụ; cần xét tính phù hợp và đánh giá.\nSlide reference / Đối chiếu slide: Ch.1, pp.15–18, 30–31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q060","chapter":2,"number":60,"question":"What happens in autoregressive text generation?\nĐiều gì xảy ra trong quá trình tạo văn bản tự hồi quy?","options":[{"id":"LLM300-Q060-A","text":"The model never checks earlier tokens\nMô hình không bao giờ xem token trước"},{"id":"LLM300-Q060-B","text":"Each new token helps predict the next\nMỗi token mới giúp dự đoán token tiếp theo"},{"id":"LLM300-Q060-C","text":"User text is deleted before output\nVăn bản người dùng bị xóa trước đầu ra"},{"id":"LLM300-Q060-D","text":"All output tokens appear at once\nMọi token đầu ra xuất hiện đồng thời"}],"correctOptionId":"LLM300-Q060-B","explanation":"Explanation (EN): Autoregressive decoder generation predicts the next token using earlier tokens and repeats until a stop condition. The sequence is not emitted all at once.\nGiải thích (VI): Bộ giải mã tự hồi quy dự đoán token kế tiếp từ các token trước và lặp đến điều kiện dừng; các token không xuất hiện đồng thời.\nSlide reference / Đối chiếu slide: Ch.2, pp.41–44","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q061","chapter":4,"number":61,"question":"Which report type needs the most careful review?\nLoại báo cáo nào cần rà soát cẩn trọng nhất?","options":[{"id":"LLM300-Q061-A","text":"A simple list of article titles\nDanh sách đơn giản các tiêu đề bài báo"},{"id":"LLM300-Q061-B","text":"Published financial statements\nBáo cáo tài chính đã công bố"},{"id":"LLM300-Q061-C","text":"A draft list of meeting topics\nDanh sách chủ đề họp dự thảo"},{"id":"LLM300-Q061-D","text":"A short internal news brief\nBản tin nội bộ ngắn"}],"correctOptionId":"LLM300-Q061-B","explanation":"Explanation (EN): For business reports, LLMs should create drafts or structured summaries from supplied sources. A fixed template supports consistency, and staff must verify high-stakes numbers before publication.\nGiải thích (VI): Với báo cáo nghiệp vụ, LLM nên tạo bản nháp hoặc tóm tắt có cấu trúc dựa trên nguồn cung cấp. Mẫu cố định giữ sự nhất quán và nhân viên phải kiểm chứng số liệu quan trọng trước khi công bố.\nSlide reference / Đối chiếu slide: Ch.4, pp.6–10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q062","chapter":1,"number":62,"question":"Besides parameters, what helps show the scale of LLM training?\nNgoài số tham số, chỉ tiêu nào phản ánh quy mô huấn luyện LLM?","options":[{"id":"LLM300-Q062-A","text":"Number of training tokens\nSố lượng token huấn luyện"},{"id":"LLM300-Q062-B","text":"Number of menu buttons\nSố nút trên menu"},{"id":"LLM300-Q062-C","text":"Number of page headings\nSố tiêu đề trang"},{"id":"LLM300-Q062-D","text":"Number of account holders\nSố chủ tài khoản"}],"correctOptionId":"LLM300-Q062-A","explanation":"Explanation (EN): Training tokens are text units processed when learning model parameters. Their count, alongside parameter count and computing resources, indicates training scale.\nGiải thích (VI): Token huấn luyện là các đơn vị văn bản được xử lý khi học tham số mô hình. Số token cùng số tham số và tài nguyên tính toán phản ánh quy mô huấn luyện.\nSlide reference / Đối chiếu slide: Ch.1, pp.15–17; Ch.2, p.31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q063","chapter":4,"number":63,"question":"Which chatbot type mainly follows fixed scripts?\nLoại chatbot nào chủ yếu làm theo kịch bản cố định?","options":[{"id":"LLM300-Q063-A","text":"Third-generation LLM chatbot\nChatbot LLM thế hệ thứ ba"},{"id":"LLM300-Q063-B","text":"First-generation chatbot\nChatbot thế hệ thứ nhất"},{"id":"LLM300-Q063-C","text":"Second-generation chatbot\nChatbot thế hệ thứ hai"},{"id":"LLM300-Q063-D","text":"A model for financial sentiment\nMô hình phân tích cảm xúc tài chính"}],"correctOptionId":"LLM300-Q063-B","explanation":"Explanation (EN): Banking chatbots are best used for repeated customer requests and verified in-app assistance. Unresolved or sensitive issues should be escalated to authorized human staff, not resolved by inventing an answer.\nGiải thích (VI): Chatbot ngân hàng phù hợp với các yêu cầu lặp lại và hỗ trợ trong ứng dụng đã xác thực. Vấn đề nhạy cảm hoặc chưa xử lý được phải chuyển nhân viên có thẩm quyền, không được bịa câu trả lời.\nSlide reference / Đối chiếu slide: Ch.4, pp.11–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q064","chapter":1,"number":64,"question":"Which setting provides one worked example in a prompt?\nCách thiết lập nào cung cấp đúng một ví dụ trong prompt?","options":[{"id":"LLM300-Q064-A","text":"Full retraining\nHuấn luyện lại toàn bộ"},{"id":"LLM300-Q064-B","text":"One-shot learning\nHọc one-shot"},{"id":"LLM300-Q064-C","text":"Zero-shot learning\nHọc zero-shot"},{"id":"LLM300-Q064-D","text":"Random guessing\nĐoán ngẫu nhiên"}],"correctOptionId":"LLM300-Q064-B","explanation":"Explanation (EN): One-shot prompting gives exactly one demonstration to guide the model. It is prompting, not retraining the whole neural network.\nGiải thích (VI): One-shot đưa đúng một ví dụ minh họa để hướng dẫn mô hình. Đây là kỹ thuật prompt, không phải huấn luyện lại toàn bộ mạng.\nSlide reference / Đối chiếu slide: Ch.1, p.24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q065","chapter":1,"number":65,"question":"Which model group includes T5 and BART?\nNhóm mô hình nào gồm T5 và BART?","options":[{"id":"LLM300-Q065-A","text":"Bag-of-words models\nMô hình túi từ"},{"id":"LLM300-Q065-B","text":"Encoder-only models\nMô hình chỉ mã hóa"},{"id":"LLM300-Q065-C","text":"Decoder-only models\nMô hình chỉ giải mã"},{"id":"LLM300-Q065-D","text":"Encoder-decoder models\nMô hình mã hóa-giải mã"}],"correctOptionId":"LLM300-Q065-D","explanation":"Explanation (EN): GPT belongs to the decoder-only Transformer family and is oriented toward text generation. BERT is an encoder-only model for language representations; T5/BART use encoder–decoder structures.\nGiải thích (VI): GPT thuộc họ Transformer decoder-only, thiên về tạo sinh văn bản. BERT thuộc nhóm encoder-only để biểu diễn và hiểu ngôn ngữ; T5/BART dùng kiến trúc encoder–decoder.\nSlide reference / Đối chiếu slide: Ch.1, p.12; Ch.2, pp.27–28","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q066","chapter":3,"number":66,"question":"What is a prompt injection attempt?\nThế nào là một nỗ lực tấn công prompt injection?","options":[{"id":"LLM300-Q066-A","text":"Hidden instructions try to redirect the model\nChỉ dẫn ẩn tìm cách chuyển hướng mô hình"},{"id":"LLM300-Q066-B","text":"An auditor verifies reported figures\nKiểm toán viên kiểm tra số liệu"},{"id":"LLM300-Q066-C","text":"A user asks for a shorter summary\nNgười dùng yêu cầu tóm tắt ngắn hơn"},{"id":"LLM300-Q066-D","text":"A chatbot cites a bank policy\nChatbot trích dẫn chính sách ngân hàng"}],"correctOptionId":"LLM300-Q066-A","explanation":"Explanation (EN): Prompt injection places malicious instructions inside less-trusted data or outside files. Separate that content from system instructions, restrict tool privileges and review external material.\nGiải thích (VI): Prompt injection cài chỉ dẫn độc hại vào dữ liệu ít đáng tin hoặc tệp bên ngoài. Cần tách nội dung này khỏi chỉ dẫn hệ thống, hạn chế quyền công cụ và rà soát tài liệu ngoài.\nSlide reference / Đối chiếu slide: Ch.3, p.39","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q067","chapter":3,"number":67,"question":"What is a good defense against hidden commands in outside files?\nBiện pháp phòng vệ tốt trước lệnh ẩn trong tệp bên ngoài là gì?","options":[{"id":"LLM300-Q067-A","text":"Restrict tool rights and check outside content\nHạn chế quyền công cụ và kiểm tra nội dung ngoài"},{"id":"LLM300-Q067-B","text":"Stop keeping any record of model actions\nNgừng lưu nhật ký hành động mô hình"},{"id":"LLM300-Q067-C","text":"Allow the model to share private databases\nCho mô hình chia sẻ cơ sở dữ liệu riêng"},{"id":"LLM300-Q067-D","text":"Treat every file instruction as a system rule\nCoi mọi chỉ dẫn trong tệp là quy tắc hệ thống"}],"correctOptionId":"LLM300-Q067-A","explanation":"Explanation (EN): Prompt injection places malicious instructions inside less-trusted data or outside files. Separate that content from system instructions, restrict tool privileges and review external material.\nGiải thích (VI): Prompt injection cài chỉ dẫn độc hại vào dữ liệu ít đáng tin hoặc tệp bên ngoài. Cần tách nội dung này khỏi chỉ dẫn hệ thống, hạn chế quyền công cụ và rà soát tài liệu ngoài.\nSlide reference / Đối chiếu slide: Ch.3, p.39","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q068","chapter":3,"number":68,"question":"What does Top-K limit?\nTop-K giới hạn điều gì?","options":[{"id":"LLM300-Q068-A","text":"How many files are kept forever\nSố tệp lưu giữ vĩnh viễn"},{"id":"LLM300-Q068-B","text":"How many pages the model can print\nSố trang mô hình có thể in"},{"id":"LLM300-Q068-C","text":"How many next-token choices are considered\nSố ứng viên token tiếp theo được xét"},{"id":"LLM300-Q068-D","text":"How many users can open the website\nSố người dùng truy cập trang web"}],"correctOptionId":"LLM300-Q068-C","explanation":"Explanation (EN): Top-K keeps only a fixed number K of the highest-probability next-token candidates before sampling.\nGiải thích (VI): Top-K chỉ giữ K ứng viên token kế tiếp có xác suất cao nhất trước khi lấy mẫu.\nSlide reference / Đối chiếu slide: Ch.3, p.14","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q069","chapter":2,"number":69,"question":"Which item can be a token?\nThành phần nào có thể là một token?","options":[{"id":"LLM300-Q069-A","text":"Only a page number\nChỉ số trang"},{"id":"LLM300-Q069-B","text":"A part of a word\nMột phần của từ"},{"id":"LLM300-Q069-C","text":"Only a complete file\nChỉ một tệp hoàn chỉnh"},{"id":"LLM300-Q069-D","text":"Only a full paragraph\nChỉ toàn bộ đoạn văn"}],"correctOptionId":"LLM300-Q069-B","explanation":"Explanation (EN): Tokenization splits text into processing units, which may be full words, word parts or punctuation; tokenizers can map those units to numerical identifiers.\nGiải thích (VI): Tokenization chia văn bản thành đơn vị xử lý; chúng có thể là từ, một phần từ hoặc dấu câu; tokenizer ánh xạ những đơn vị đó sang mã số.\nSlide reference / Đối chiếu slide: Ch.2, p.31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q070","chapter":1,"number":70,"question":"Which model group includes BERT and RoBERTa?\nNhóm mô hình nào gồm BERT và RoBERTa?","options":[{"id":"LLM300-Q070-A","text":"Statistical N-gram models\nMô hình N-gram thống kê"},{"id":"LLM300-Q070-B","text":"Encoder-only models\nMô hình chỉ có bộ mã hóa"},{"id":"LLM300-Q070-C","text":"Decoder-only models\nMô hình chỉ có bộ giải mã"},{"id":"LLM300-Q070-D","text":"Encoder-decoder models\nMô hình mã hóa-giải mã"}],"correctOptionId":"LLM300-Q070-B","explanation":"Explanation (EN): GPT belongs to the decoder-only Transformer family and is oriented toward text generation. BERT is an encoder-only model for language representations; T5/BART use encoder–decoder structures.\nGiải thích (VI): GPT thuộc họ Transformer decoder-only, thiên về tạo sinh văn bản. BERT thuộc nhóm encoder-only để biểu diễn và hiểu ngôn ngữ; T5/BART dùng kiến trúc encoder–decoder.\nSlide reference / Đối chiếu slide: Ch.1, p.12; Ch.2, pp.27–28","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q071","chapter":4,"number":71,"question":"Why should teams building and checking AI models be separate?\nVì sao nhóm phát triển và nhóm kiểm tra mô hình AI nên tách biệt?","options":[{"id":"LLM300-Q071-A","text":"To remove the need for tests\nLoại bỏ nhu cầu kiểm thử"},{"id":"LLM300-Q071-B","text":"To allow independent review of model risks\nCho phép rà soát độc lập rủi ro mô hình"},{"id":"LLM300-Q071-C","text":"To keep all model errors secret\nGiấu kín mọi lỗi mô hình"},{"id":"LLM300-Q071-D","text":"To give suppliers final approval\nTrao quyền phê duyệt cuối cho nhà cung cấp"}],"correctOptionId":"LLM300-Q071-B","explanation":"Explanation (EN): An AI model provides support, but the institution must retain control, independent checking, audit records and accountability for important outcomes. Outsourcing does not transfer the bank’s final responsibility.\nGiải thích (VI): AI chỉ hỗ trợ; tổ chức phải duy trì quyền kiểm soát, kiểm tra độc lập, nhật ký kiểm toán và trách nhiệm giải trình đối với kết quả quan trọng. Thuê dịch vụ ngoài không chuyển hết trách nhiệm cuối cùng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.4, pp.19, 32, 52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q072","chapter":2,"number":72,"question":"What best describes ChatGPT as a product?\nMô tả nào phù hợp nhất về ChatGPT dưới góc độ sản phẩm?","options":[{"id":"LLM300-Q072-A","text":"A database that stores only images\nCơ sở dữ liệu chỉ lưu ảnh"},{"id":"LLM300-Q072-B","text":"A chip designed for training models\nCon chip để huấn luyện mô hình"},{"id":"LLM300-Q072-C","text":"An AI application with a model and interface\nỨng dụng AI gồm mô hình và giao diện"},{"id":"LLM300-Q072-D","text":"A website that only searches files\nWebsite chỉ tìm kiếm tệp"}],"correctOptionId":"LLM300-Q072-C","explanation":"Explanation (EN): ChatGPT is an AI application combining a language model with a user interface and supporting services. File upload, conversation display and memory are application features, not tasks performed by one attention head.\nGiải thích (VI): ChatGPT là ứng dụng AI kết hợp mô hình ngôn ngữ, giao diện và các dịch vụ hỗ trợ. Tải tệp, hiển thị hội thoại và ghi nhớ là tính năng ứng dụng, không phải chức năng riêng của một đầu attention.\nSlide reference / Đối chiếu slide: Ch.2, pp.15–24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q073","chapter":3,"number":73,"question":"What can stop a model from adding more output tokens?\nĐiều gì có thể khiến mô hình ngừng tạo thêm token đầu ra?","options":[{"id":"LLM300-Q073-A","text":"A spreadsheet adding a new row\nBảng tính thêm một dòng"},{"id":"LLM300-Q073-B","text":"An end token or a length limit\nToken kết thúc hoặc giới hạn độ dài"},{"id":"LLM300-Q073-C","text":"A new customer opening an account\nKhách hàng mới mở tài khoản"},{"id":"LLM300-Q073-D","text":"The screen changing its color\nMàn hình đổi màu"}],"correctOptionId":"LLM300-Q073-B","explanation":"Explanation (EN): Output length or max output tokens caps how much text can be generated. A short cap may truncate the answer; generation also stops on an end token.\nGiải thích (VI): Độ dài đầu ra hoặc max output tokens giới hạn lượng văn bản tạo ra. Giới hạn thấp có thể làm câu trả lời bị cắt; token kết thúc cũng có thể dừng việc tạo sinh.\nSlide reference / Đối chiếu slide: Ch.3, pp.11–12; Ch.2, p.44","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q074","chapter":2,"number":74,"question":"Why does a Transformer need position information?\nVì sao Transformer cần thông tin vị trí?","options":[{"id":"LLM300-Q074-A","text":"Every sentence has equal meaning\nMọi câu đều có cùng nghĩa"},{"id":"LLM300-Q074-B","text":"Words are always in fixed order\nCác từ luôn theo thứ tự cố định"},{"id":"LLM300-Q074-C","text":"Position removes the need for text\nVị trí khiến không cần văn bản"},{"id":"LLM300-Q074-D","text":"Word order can change meaning\nThứ tự từ có thể làm đổi nghĩa"}],"correctOptionId":"LLM300-Q074-D","explanation":"Explanation (EN): Positional encoding supplies information about token order. Word order can change sentence meaning even when the same words are present.\nGiải thích (VI): Mã hóa vị trí bổ sung thông tin thứ tự token. Trật tự từ có thể thay đổi nghĩa câu dù các từ giống nhau.\nSlide reference / Đối chiếu slide: Ch.2, p.34","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q075","chapter":1,"number":75,"question":"Which field includes language models within the wider field of AI?\nLĩnh vực nào bao gồm mô hình ngôn ngữ trong phạm vi AI rộng hơn?","options":[{"id":"LLM300-Q075-A","text":"Printed document storage\nLưu tài liệu giấy"},{"id":"LLM300-Q075-B","text":"Manual cash transport\nVận chuyển tiền mặt thủ công"},{"id":"LLM300-Q075-C","text":"Natural language processing\nXử lý ngôn ngữ tự nhiên"},{"id":"LLM300-Q075-D","text":"Physical branch security\nBảo vệ vật lý chi nhánh"}],"correctOptionId":"LLM300-Q075-C","explanation":"Explanation (EN): Natural Language Processing is an AI area concerned with analyzing, understanding and generating human language. LLMs provide language-related capabilities rather than guaranteed factual accuracy.\nGiải thích (VI): Xử lý ngôn ngữ tự nhiên là lĩnh vực AI nghiên cứu phân tích, hiểu và tạo sinh ngôn ngữ con người. LLM hỗ trợ tác vụ ngôn ngữ chứ không bảo đảm mọi dữ kiện chính xác.\nSlide reference / Đối chiếu slide: Ch.1, pp.5, 19; Ch.2, pp.18–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q076","chapter":2,"number":76,"question":"What is the basic function of tokenization?\nChức năng cơ bản của tokenization là gì?","options":[{"id":"LLM300-Q076-A","text":"Split text into units for processing\nChia văn bản thành đơn vị để xử lý"},{"id":"LLM300-Q076-B","text":"Send money to an account\nChuyển tiền vào tài khoản"},{"id":"LLM300-Q076-C","text":"Draw a chart from numbers\nVẽ biểu đồ từ số"},{"id":"LLM300-Q076-D","text":"Approve a new user password\nDuyệt mật khẩu mới"}],"correctOptionId":"LLM300-Q076-A","explanation":"Explanation (EN): Tokenization splits text into processing units, which may be full words, word parts or punctuation; tokenizers can map those units to numerical identifiers.\nGiải thích (VI): Tokenization chia văn bản thành đơn vị xử lý; chúng có thể là từ, một phần từ hoặc dấu câu; tokenizer ánh xạ những đơn vị đó sang mã số.\nSlide reference / Đối chiếu slide: Ch.2, p.31","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q077","chapter":4,"number":77,"question":"What is a key benefit of RAG for bank policy questions?\nLợi ích chính của RAG khi trả lời câu hỏi chính sách ngân hàng là gì?","options":[{"id":"LLM300-Q077-A","text":"It removes the need for any knowledge base\nKhông cần cơ sở tri thức"},{"id":"LLM300-Q077-B","text":"Answers can use current approved documents\nCâu trả lời dùng được tài liệu hiện hành đã phê duyệt"},{"id":"LLM300-Q077-C","text":"It stops all future policy updates\nChặn mọi cập nhật chính sách tương lai"},{"id":"LLM300-Q077-D","text":"It guarantees every output is legally valid\nBảo đảm mọi đầu ra có giá trị pháp lý"}],"correctOptionId":"LLM300-Q077-B","explanation":"Explanation (EN): Retrieval-Augmented Generation retrieves relevant approved documents to ground chatbot responses. When bank policies change, the knowledge base must be updated; retrieval does not remove the need for checking.\nGiải thích (VI): RAG truy xuất tài liệu liên quan đã được duyệt để làm căn cứ cho chatbot. Khi chính sách đổi phải cập nhật cơ sở tri thức; truy xuất không loại bỏ nhu cầu kiểm tra.\nSlide reference / Đối chiếu slide: Ch.4, pp.13, 18, 21","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q078","chapter":2,"number":78,"question":"What is the main aim of RLHF?\nMục tiêu chính của RLHF là gì?","options":[{"id":"LLM300-Q078-A","text":"Make replies better fit human feedback\nLàm câu trả lời phù hợp hơn với phản hồi con người"},{"id":"LLM300-Q078-B","text":"Make all answers exactly the same\nLàm mọi câu trả lời giống hệt"},{"id":"LLM300-Q078-C","text":"Remove the need for any training\nKhông cần huấn luyện"},{"id":"LLM300-Q078-D","text":"Give a model access to bank accounts\nCho mô hình truy cập tài khoản ngân hàng"}],"correctOptionId":"LLM300-Q078-A","explanation":"Explanation (EN): Reinforcement Learning from Human Feedback uses human preference judgments and a reward model to align model responses with preferred behavior. Preference alignment does not guarantee that every fact is true.\nGiải thích (VI): RLHF dùng đánh giá sở thích con người và reward model để điều chỉnh câu trả lời theo hành vi được ưa thích. Phù hợp sở thích không bảo đảm mọi thông tin đều đúng.\nSlide reference / Đối chiếu slide: Ch.2, p.48","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q079","chapter":4,"number":79,"question":"Which chatbot type uses intent and sentence patterns?\nLoại chatbot nào sử dụng ý định và mẫu câu?","options":[{"id":"LLM300-Q079-A","text":"An automated financial statement\nBáo cáo tài chính tự động"},{"id":"LLM300-Q079-B","text":"A paper form with no software\nBiểu mẫu giấy không có phần mềm"},{"id":"LLM300-Q079-C","text":"First-generation chatbot\nChatbot thế hệ thứ nhất"},{"id":"LLM300-Q079-D","text":"Second-generation chatbot\nChatbot thế hệ thứ hai"}],"correctOptionId":"LLM300-Q079-D","explanation":"Explanation (EN): Banking chatbots are best used for repeated customer requests and verified in-app assistance. Unresolved or sensitive issues should be escalated to authorized human staff, not resolved by inventing an answer.\nGiải thích (VI): Chatbot ngân hàng phù hợp với các yêu cầu lặp lại và hỗ trợ trong ứng dụng đã xác thực. Vấn đề nhạy cảm hoặc chưa xử lý được phải chuyển nhân viên có thẩm quyền, không được bịa câu trả lời.\nSlide reference / Đối chiếu slide: Ch.4, pp.11–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q080","chapter":1,"number":80,"question":"Which setting uses no worked task examples in a prompt?\nCách thiết lập nào không dùng ví dụ giải mẫu trong prompt?","options":[{"id":"LLM300-Q080-A","text":"Zero-shot learning\nHọc zero-shot"},{"id":"LLM300-Q080-B","text":"Few-shot learning\nHọc few-shot"},{"id":"LLM300-Q080-C","text":"Model fine-tuning\nFine-tuning mô hình"},{"id":"LLM300-Q080-D","text":"One-shot learning\nHọc one-shot"}],"correctOptionId":"LLM300-Q080-A","explanation":"Explanation (EN): Zero-shot prompting asks the model to perform a task without worked examples in the prompt; the instruction itself still describes the task.\nGiải thích (VI): Zero-shot yêu cầu mô hình làm nhiệm vụ mà không đưa ví dụ giải mẫu trong prompt; chỉ dẫn vẫn cần nêu nhiệm vụ.\nSlide reference / Đối chiếu slide: Ch.1, p.24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q081","chapter":4,"number":81,"question":"What is the safest role of an AI model in a bank loan decision?\nVai trò an toàn nhất của mô hình AI trong quyết định cho vay là gì?","options":[{"id":"LLM300-Q081-A","text":"Remove the bank's duty to explain\nLoại bỏ nghĩa vụ giải thích của ngân hàng"},{"id":"LLM300-Q081-B","text":"Support people who make and approve decisions\nHỗ trợ người ra và phê duyệt quyết định"},{"id":"LLM300-Q081-C","text":"Approve every loan with no human check\nDuyệt mọi khoản vay mà không cần con người"},{"id":"LLM300-Q081-D","text":"Hide how each decision was made\nGiấu cách thức ra quyết định"}],"correctOptionId":"LLM300-Q081-B","explanation":"Explanation (EN): Human oversight keeps consequential credit, reporting and customer decisions with authorized staff. An AI draft or recommendation must be reviewed before final approval or sending.\nGiải thích (VI): Giám sát con người bảo đảm quyết định tín dụng, báo cáo và hỗ trợ khách hàng quan trọng thuộc nhân sự được ủy quyền. Bản nháp hoặc khuyến nghị AI phải được kiểm tra trước khi phê duyệt hoặc gửi.\nSlide reference / Đối chiếu slide: Ch.4, pp.8, 19, 27, 32","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q082","chapter":4,"number":82,"question":"Which risk means a borrower may fail to repay a loan?\nRủi ro nào chỉ khả năng người vay không trả nợ?","options":[{"id":"LLM300-Q082-A","text":"Credit risk\nRủi ro tín dụng"},{"id":"LLM300-Q082-B","text":"Market risk\nRủi ro thị trường"},{"id":"LLM300-Q082-C","text":"Operational risk\nRủi ro hoạt động"},{"id":"LLM300-Q082-D","text":"Compliance risk\nRủi ro tuân thủ"}],"correctOptionId":"LLM300-Q082-A","explanation":"Explanation (EN): Credit risk is the risk that a borrower does not repay. LLMs can review loan files and flag missing or contradictory items for a loan officer, but must not autonomously invent data or approve loans.\nGiải thích (VI): Rủi ro tín dụng là khả năng người vay không trả nợ. LLM có thể rà hồ sơ, cảnh báo thông tin thiếu hoặc mâu thuẫn để cán bộ tín dụng kiểm tra nhưng không được tự bịa dữ liệu hay phê duyệt vay.\nSlide reference / Đối chiếu slide: Ch.4, pp.25–29","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q083","chapter":1,"number":83,"question":"If model size grows but task results get worse, what is this called?\nNếu mô hình lớn hơn nhưng kết quả nhiệm vụ tệ hơn, hiện tượng này gọi là gì?","options":[{"id":"LLM300-Q083-A","text":"Normal formatting\nĐịnh dạng thông thường"},{"id":"LLM300-Q083-B","text":"Simple translation\nDịch thuật đơn giản"},{"id":"LLM300-Q083-C","text":"Inverse scaling\nHiện tượng mở rộng ngược (inverse scaling)"},{"id":"LLM300-Q083-D","text":"Data encryption\nMã hóa dữ liệu"}],"correctOptionId":"LLM300-Q083-C","explanation":"Explanation (EN): Inverse scaling describes cases where performance on a task worsens as model size increases. It is a caution against assuming larger always means better.\nGiải thích (VI): Inverse scaling là hiện tượng hiệu năng ở một số tác vụ xấu đi khi tăng quy mô mô hình; vì thế không thể mặc định càng lớn càng tốt.\nSlide reference / Đối chiếu slide: Ch.1, p.30","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q084","chapter":4,"number":84,"question":"How can LLMs help with fraud review?\nLLM hỗ trợ rà soát gian lận như thế nào?","options":[{"id":"LLM300-Q084-A","text":"Remove the need for transaction data\nKhông cần dữ liệu giao dịch"},{"id":"LLM300-Q084-B","text":"Hide all warnings from risk staff\nẨn mọi cảnh báo khỏi nhân viên rủi ro"},{"id":"LLM300-Q084-C","text":"Explain unusual transactions in clear words\nDiễn giải giao dịch bất thường bằng lời dễ hiểu"},{"id":"LLM300-Q084-D","text":"Guarantee that no fraud can occur\nBảo đảm không gian lận xảy ra"}],"correctOptionId":"LLM300-Q084-C","explanation":"Explanation (EN): An LLM can describe suspicious patterns and explain alerts from fraud-detection models. A warning is not proof of fraud, so analysts must validate cases before taking consequential actions.\nGiải thích (VI): LLM có thể mô tả mẫu giao dịch đáng ngờ và giải thích cảnh báo của mô hình phát hiện gian lận. Cảnh báo không chứng minh chắc chắn có gian lận; nhân viên phải xác minh trước quyết định có tác động lớn.\nSlide reference / Đối chiếu slide: Ch.4, pp.33–39","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q085","chapter":3,"number":85,"question":"Which setting mainly changes how random text output is?\nThiết lập nào chủ yếu điều chỉnh độ ngẫu nhiên của văn bản đầu ra?","options":[{"id":"LLM300-Q085-A","text":"Temperature\nTemperature"},{"id":"LLM300-Q085-B","text":"Page margin\nLề trang"},{"id":"LLM300-Q085-C","text":"Screen width\nChiều rộng màn hình"},{"id":"LLM300-Q085-D","text":"File size\nKích thước tệp"}],"correctOptionId":"LLM300-Q085-A","explanation":"Explanation (EN): Temperature controls randomness in token selection. A lower value is usually better for consistent extraction; a higher value produces more diverse ideas, but neither guarantees truth.\nGiải thích (VI): Temperature điều chỉnh độ ngẫu nhiên khi chọn token. Giá trị thấp thường phù hợp để trích xuất ổn định; giá trị cao tạo ý tưởng đa dạng hơn nhưng không bảo đảm độ đúng.\nSlide reference / Đối chiếu slide: Ch.3, pp.11–14","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q086","chapter":4,"number":86,"question":"Why keep logs of important AI actions?\nVì sao cần lưu nhật ký những hành động AI quan trọng?","options":[{"id":"LLM300-Q086-A","text":"To let anyone approve a bank loan\nCho bất kỳ ai phê duyệt khoản vay"},{"id":"LLM300-Q086-B","text":"To make each response more creative\nLàm từng câu trả lời sáng tạo hơn"},{"id":"LLM300-Q086-C","text":"To replace every customer consent form\nThay thế mọi giấy đồng ý của khách hàng"},{"id":"LLM300-Q086-D","text":"To support review and accountability\nHỗ trợ rà soát và trách nhiệm giải trình"}],"correctOptionId":"LLM300-Q086-D","explanation":"Explanation (EN): An AI model provides support, but the institution must retain control, independent checking, audit records and accountability for important outcomes. Outsourcing does not transfer the bank’s final responsibility.\nGiải thích (VI): AI chỉ hỗ trợ; tổ chức phải duy trì quyền kiểm soát, kiểm tra độc lập, nhật ký kiểm toán và trách nhiệm giải trình đối với kết quả quan trọng. Thuê dịch vụ ngoài không chuyển hết trách nhiệm cuối cùng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.4, pp.19, 32, 52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q087","chapter":4,"number":87,"question":"What can sentiment analysis find in market news?\nPhân tích cảm xúc có thể tìm thấy gì trong tin tức thị trường?","options":[{"id":"LLM300-Q087-A","text":"Positive, negative, or neutral views\nQuan điểm tích cực, tiêu cực hoặc trung lập"},{"id":"LLM300-Q087-B","text":"The true future price of every stock\nGiá thực tương lai mọi cổ phiếu"},{"id":"LLM300-Q087-C","text":"A guaranteed return on an investment\nLợi nhuận đầu tư được bảo đảm"},{"id":"LLM300-Q087-D","text":"A customer's personal account password\nMật khẩu tài khoản khách hàng"}],"correctOptionId":"LLM300-Q087-A","explanation":"Explanation (EN): Sentiment analysis classifies attitudes in financial texts, often positive, negative or neutral. Duplicate articles should not be counted repeatedly because they distort aggregate signals and do not guarantee future returns.\nGiải thích (VI): Phân tích cảm xúc phân loại sắc thái văn bản tài chính, thường là tích cực, tiêu cực hoặc trung lập. Tin trùng cần được loại vì đếm lặp làm lệch tín hiệu tổng hợp và không dự đoán chắc chắn lợi nhuận tương lai.\nSlide reference / Đối chiếu slide: Ch.4, pp.40–46","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q088","chapter":4,"number":88,"question":"When a fraud model flags a payment, what can an LLM add?\nKhi mô hình gian lận cảnh báo một khoản thanh toán, LLM có thể bổ sung điều gì?","options":[{"id":"LLM300-Q088-A","text":"An automatic court ruling\nPhán quyết tòa án tự động"},{"id":"LLM300-Q088-B","text":"A guarantee the payment is criminal\nBảo đảm khoản thanh toán phạm pháp"},{"id":"LLM300-Q088-C","text":"A new hidden bank account\nTài khoản ngân hàng bí mật mới"},{"id":"LLM300-Q088-D","text":"A readable reason for the alert\nLý do cảnh báo dễ đọc"}],"correctOptionId":"LLM300-Q088-D","explanation":"Explanation (EN): An LLM can describe suspicious patterns and explain alerts from fraud-detection models. A warning is not proof of fraud, so analysts must validate cases before taking consequential actions.\nGiải thích (VI): LLM có thể mô tả mẫu giao dịch đáng ngờ và giải thích cảnh báo của mô hình phát hiện gian lận. Cảnh báo không chứng minh chắc chắn có gian lận; nhân viên phải xác minh trước quyết định có tác động lớn.\nSlide reference / Đối chiếu slide: Ch.4, pp.33–39","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q089","chapter":3,"number":89,"question":"Why ask a model to perform a self-check?\nVì sao yêu cầu mô hình tự kiểm tra?","options":[{"id":"LLM300-Q089-A","text":"To find errors and missing evidence\nTìm lỗi và bằng chứng còn thiếu"},{"id":"LLM300-Q089-B","text":"To replace all expert review\nThay thế mọi rà soát chuyên gia"},{"id":"LLM300-Q089-C","text":"To avoid reading input documents\nKhông cần đọc tài liệu nguồn"},{"id":"LLM300-Q089-D","text":"To raise randomness for new ideas\nTăng ngẫu nhiên để tạo ý tưởng mới"}],"correctOptionId":"LLM300-Q089-A","explanation":"Explanation (EN): Self-checking reviews generated output for mistakes or missing evidence. Self-consistency compares several independent reasoning results, which may improve robustness but uses additional computation.\nGiải thích (VI): Tự kiểm tra rà soát đầu ra để tìm lỗi hoặc thiếu chứng cứ. Self-consistency so sánh nhiều kết quả suy luận để tăng độ vững nhưng cần thêm tài nguyên tính toán.\nSlide reference / Đối chiếu slide: Ch.3, pp.24, 30–32, 37","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q090","chapter":1,"number":90,"question":"What makes a conditional language model different?\nĐiều gì phân biệt mô hình ngôn ngữ có điều kiện?","options":[{"id":"LLM300-Q090-A","text":"It always predicts the same word\nLuôn dự đoán cùng một từ"},{"id":"LLM300-Q090-B","text":"It uses context when giving a probability\nSử dụng ngữ cảnh khi gán xác suất"},{"id":"LLM300-Q090-C","text":"It only processes images\nChỉ xử lý hình ảnh"},{"id":"LLM300-Q090-D","text":"It ignores every earlier word\nBỏ qua mọi từ trước đó"}],"correctOptionId":"LLM300-Q090-B","explanation":"Explanation (EN): A language model assigns probabilities to text sequences. A conditional model estimates the next word or token using preceding context rather than unrelated account information.\nGiải thích (VI): Mô hình ngôn ngữ gán xác suất cho chuỗi văn bản. Mô hình có điều kiện ước lượng từ hoặc token tiếp theo dựa trên ngữ cảnh trước, không dựa vào thông tin tài khoản không liên quan.\nSlide reference / Đối chiếu slide: Ch.1, pp.6–11","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q091","chapter":3,"number":91,"question":"How is prompting different from keyword search?\nPrompting khác tìm kiếm từ khóa ở điểm nào?","options":[{"id":"LLM300-Q091-A","text":"It always finds an existing webpage\nLuôn tìm trang web sẵn có"},{"id":"LLM300-Q091-B","text":"It never needs task information\nKhông cần thông tin nhiệm vụ"},{"id":"LLM300-Q091-C","text":"It asks a model to create a response\nYêu cầu mô hình tạo câu trả lời"},{"id":"LLM300-Q091-D","text":"It can only return file names\nChỉ trả về tên tệp"}],"correctOptionId":"LLM300-Q091-C","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q092","chapter":4,"number":92,"question":"What should be updated after a bank policy change in RAG?\nCần cập nhật điều gì sau khi chính sách ngân hàng thay đổi trong hệ thống RAG?","options":[{"id":"LLM300-Q092-A","text":"The customer's account number\nSố tài khoản khách hàng"},{"id":"LLM300-Q092-B","text":"The model's keyboard setting\nCài đặt bàn phím mô hình"},{"id":"LLM300-Q092-C","text":"The colors of the bank website\nMàu trang web ngân hàng"},{"id":"LLM300-Q092-D","text":"The knowledge base documents\nTài liệu cơ sở tri thức"}],"correctOptionId":"LLM300-Q092-D","explanation":"Explanation (EN): Retrieval-Augmented Generation retrieves relevant approved documents to ground chatbot responses. When bank policies change, the knowledge base must be updated; retrieval does not remove the need for checking.\nGiải thích (VI): RAG truy xuất tài liệu liên quan đã được duyệt để làm căn cứ cho chatbot. Khi chính sách đổi phải cập nhật cơ sở tri thức; truy xuất không loại bỏ nhu cầu kiểm tra.\nSlide reference / Đối chiếu slide: Ch.4, pp.13, 18, 21","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q093","chapter":2,"number":93,"question":"Why use multiple attention heads?\nVì sao sử dụng nhiều attention heads?","options":[{"id":"LLM300-Q093-A","text":"To stop the model from reading words\nNgừng mô hình đọc từ"},{"id":"LLM300-Q093-B","text":"To replace text with pictures only\nChỉ thay văn bản bằng ảnh"},{"id":"LLM300-Q093-C","text":"To study different word links at once\nNghiên cứu đồng thời nhiều quan hệ giữa từ"},{"id":"LLM300-Q093-D","text":"To keep all word links identical\nGiữ mọi quan hệ từ giống nhau"}],"correctOptionId":"LLM300-Q093-C","explanation":"Explanation (EN): Self-attention measures relationships among tokens. Multiple attention heads can learn different relationships in parallel; a single head does not provide the same diversity.\nGiải thích (VI): Self-attention tính mối liên hệ giữa các token. Nhiều đầu attention học các kiểu quan hệ khác nhau song song; một đầu đơn lẻ không có cùng độ đa dạng biểu diễn.\nSlide reference / Đối chiếu slide: Ch.2, pp.35–37","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q094","chapter":2,"number":94,"question":"What is the main role of a user interface?\nVai trò chính của giao diện người dùng là gì?","options":[{"id":"LLM300-Q094-A","text":"Train all models from the beginning\nHuấn luyện mọi mô hình từ đầu"},{"id":"LLM300-Q094-B","text":"Replace the model's neural network\nThay thế mạng nơ-ron mô hình"},{"id":"LLM300-Q094-C","text":"Set a bank's lending interest rate\nĐặt lãi suất cho vay ngân hàng"},{"id":"LLM300-Q094-D","text":"Let people enter requests and view answers\nCho phép nhập yêu cầu và xem câu trả lời"}],"correctOptionId":"LLM300-Q094-D","explanation":"Explanation (EN): ChatGPT is an AI application combining a language model with a user interface and supporting services. File upload, conversation display and memory are application features, not tasks performed by one attention head.\nGiải thích (VI): ChatGPT là ứng dụng AI kết hợp mô hình ngôn ngữ, giao diện và các dịch vụ hỗ trợ. Tải tệp, hiển thị hội thoại và ghi nhớ là tính năng ứng dụng, không phải chức năng riêng của một đầu attention.\nSlide reference / Đối chiếu slide: Ch.2, pp.15–24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q095","chapter":1,"number":95,"question":"What does an N-gram model use to predict the next word?\nMô hình N-gram dùng gì để dự đoán từ tiếp theo?","options":[{"id":"LLM300-Q095-A","text":"A bank's customer account balance\nSố dư tài khoản khách hàng"},{"id":"LLM300-Q095-B","text":"A limited number of earlier words\nSố lượng giới hạn các từ đứng trước"},{"id":"LLM300-Q095-C","text":"A set of hidden user commands\nBộ lệnh ẩn của người dùng"},{"id":"LLM300-Q095-D","text":"A list of future sentences\nDanh sách các câu trong tương lai"}],"correctOptionId":"LLM300-Q095-B","explanation":"Explanation (EN): An N-gram uses a limited preceding context: an N-gram sequence contains N consecutive words, and a next-word prediction conditions on N−1 previous words. In a sentence of m words, there are m −N+1 overlapping N-grams.\nGiải thích (VI): N-gram dùng ngữ cảnh trước có giới hạn: một nhóm gồm N từ liên tiếp và việc đoán từ tiếp theo dựa vào N−1 từ trước. Câu có m từ tạo được m−N+1 nhóm N-gram chồng lấp.\nSlide reference / Đối chiếu slide: Ch.1, pp.6–9","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q096","chapter":4,"number":96,"question":"Why keep logs of important AI actions?\nVì sao cần lưu nhật ký hành động AI quan trọng?","options":[{"id":"LLM300-Q096-A","text":"To replace every customer consent form\nThay thế mọi giấy đồng ý khách hàng"},{"id":"LLM300-Q096-B","text":"To support review and accountability\nHỗ trợ rà soát và trách nhiệm giải trình"},{"id":"LLM300-Q096-C","text":"To make each response more creative\nLàm câu trả lời sáng tạo hơn"},{"id":"LLM300-Q096-D","text":"To let anyone approve a bank loan\nCho bất kỳ ai phê duyệt khoản vay"}],"correctOptionId":"LLM300-Q096-B","explanation":"Explanation (EN): An AI model provides support, but the institution must retain control, independent checking, audit records and accountability for important outcomes. Outsourcing does not transfer the bank’s final responsibility.\nGiải thích (VI): AI chỉ hỗ trợ; tổ chức phải duy trì quyền kiểm soát, kiểm tra độc lập, nhật ký kiểm toán và trách nhiệm giải trình đối với kết quả quan trọng. Thuê dịch vụ ngoài không chuyển hết trách nhiệm cuối cùng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.4, pp.19, 32, 52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q097","chapter":1,"number":97,"question":"Which field includes language models within the wider field of AI?\nLĩnh vực nào bao gồm mô hình ngôn ngữ trong phạm vi AI rộng hơn?","options":[{"id":"LLM300-Q097-A","text":"Printed document storage\nLưu trữ tài liệu in"},{"id":"LLM300-Q097-B","text":"Physical branch security\nAn ninh vật lý chi nhánh"},{"id":"LLM300-Q097-C","text":"Natural language processing\nXử lý ngôn ngữ tự nhiên"},{"id":"LLM300-Q097-D","text":"Manual cash transport\nVận chuyển tiền mặt thủ công"}],"correctOptionId":"LLM300-Q097-C","explanation":"Explanation (EN): Natural Language Processing is an AI area concerned with analyzing, understanding and generating human language. LLMs provide language-related capabilities rather than guaranteed factual accuracy.\nGiải thích (VI): Xử lý ngôn ngữ tự nhiên là lĩnh vực AI nghiên cứu phân tích, hiểu và tạo sinh ngôn ngữ con người. LLM hỗ trợ tác vụ ngôn ngữ chứ không bảo đảm mọi dữ kiện chính xác.\nSlide reference / Đối chiếu slide: Ch.1, pp.5, 19; Ch.2, pp.18–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q098","chapter":1,"number":98,"question":"If model size grows but task results get worse, what is this called?\nNếu quy mô mô hình tăng mà kết quả xấu đi, đó là gì?","options":[{"id":"LLM300-Q098-A","text":"Inverse scaling\nHiện tượng mở rộng ngược (inverse scaling)"},{"id":"LLM300-Q098-B","text":"Normal formatting\nĐịnh dạng thông thường"},{"id":"LLM300-Q098-C","text":"Simple translation\nDịch thuật đơn giản"},{"id":"LLM300-Q098-D","text":"Data encryption\nMã hóa dữ liệu"}],"correctOptionId":"LLM300-Q098-A","explanation":"Explanation (EN): Inverse scaling describes cases where performance on a task worsens as model size increases. It is a caution against assuming larger always means better.\nGiải thích (VI): Inverse scaling là hiện tượng hiệu năng ở một số tác vụ xấu đi khi tăng quy mô mô hình; vì thế không thể mặc định càng lớn càng tốt.\nSlide reference / Đối chiếu slide: Ch.1, p.30","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q099","chapter":4,"number":99,"question":"What is a safe reply when a chatbot cannot solve a card problem?\nChatbot nên phản hồi an toàn ra sao khi không xử lý được sự cố thẻ?","options":[{"id":"LLM300-Q099-A","text":"Pretend the issue has been fixed\nGiả vờ sự cố đã được khắc phục"},{"id":"LLM300-Q099-B","text":"Ask for a public post of the PIN\nYêu cầu công khai mã PIN"},{"id":"LLM300-Q099-C","text":"Offer a route to a staff member\nChuyển tiếp đến nhân viên hỗ trợ"},{"id":"LLM300-Q099-D","text":"Guess a new PIN for the customer\nĐoán mã PIN mới cho khách hàng"}],"correctOptionId":"LLM300-Q099-C","explanation":"Explanation (EN): Banking chatbots are best used for repeated customer requests and verified in-app assistance. Unresolved or sensitive issues should be escalated to authorized human staff, not resolved by inventing an answer.\nGiải thích (VI): Chatbot ngân hàng phù hợp với các yêu cầu lặp lại và hỗ trợ trong ứng dụng đã xác thực. Vấn đề nhạy cảm hoặc chưa xử lý được phải chuyển nhân viên có thẩm quyền, không được bịa câu trả lời.\nSlide reference / Đối chiếu slide: Ch.4, pp.11–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q100","chapter":1,"number":100,"question":"What is one main difference between GPT and BERT?\nKhác biệt chính giữa GPT và BERT là gì?","options":[{"id":"LLM300-Q100-A","text":"GPT works only with printed tables\nGPT chỉ hoạt động với bảng in"},{"id":"LLM300-Q100-B","text":"BERT can only process music files\nBERT chỉ xử lý nhạc"},{"id":"LLM300-Q100-C","text":"GPT focuses on generation; BERT on understanding\nGPT tập trung tạo sinh; BERT tập trung hiểu ngôn ngữ"},{"id":"LLM300-Q100-D","text":"Both are only document scanners\nCả hai chỉ là máy quét tài liệu"}],"correctOptionId":"LLM300-Q100-C","explanation":"Explanation (EN): GPT belongs to the decoder-only Transformer family and is oriented toward text generation. BERT is an encoder-only model for language representations; T5/BART use encoder–decoder structures.\nGiải thích (VI): GPT thuộc họ Transformer decoder-only, thiên về tạo sinh văn bản. BERT thuộc nhóm encoder-only để biểu diễn và hiểu ngôn ngữ; T5/BART dùng kiến trúc encoder–decoder.\nSlide reference / Đối chiếu slide: Ch.1, p.12; Ch.2, pp.27–28","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q101","chapter":4,"number":101,"question":"What is a good first use of an LLM for monthly reports?\nỨng dụng đầu tiên phù hợp của LLM cho báo cáo hằng tháng là gì?","options":[{"id":"LLM300-Q101-A","text":"Delete all earlier source records\nXóa mọi bản ghi nguồn trước đây"},{"id":"LLM300-Q101-B","text":"Change missing numbers into guesses\nBiến số còn thiếu thành số đoán"},{"id":"LLM300-Q101-C","text":"Create a draft for staff to review\nTạo bản dự thảo để nhân viên kiểm tra"},{"id":"LLM300-Q101-D","text":"Publish the final report without checks\nCông bố báo cáo cuối không rà soát"}],"correctOptionId":"LLM300-Q101-C","explanation":"Explanation (EN): For business reports, LLMs should create drafts or structured summaries from supplied sources. A fixed template supports consistency, and staff must verify high-stakes numbers before publication.\nGiải thích (VI): Với báo cáo nghiệp vụ, LLM nên tạo bản nháp hoặc tóm tắt có cấu trúc dựa trên nguồn cung cấp. Mẫu cố định giữ sự nhất quán và nhân viên phải kiểm chứng số liệu quan trọng trước khi công bố.\nSlide reference / Đối chiếu slide: Ch.4, pp.6–10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q102","chapter":4,"number":102,"question":"What should a bank chatbot handle first?\nChatbot ngân hàng nên xử lý loại yêu cầu nào trước?","options":[{"id":"LLM300-Q102-A","text":"Simple and repeated customer questions\nCâu hỏi đơn giản, lặp lại của khách hàng"},{"id":"LLM300-Q102-B","text":"Decisions on all customer complaints\nQuyết định toàn bộ khiếu nại khách hàng"},{"id":"LLM300-Q102-C","text":"Final approval of all credit decisions\nPhê duyệt cuối tất cả khoản vay"},{"id":"LLM300-Q102-D","text":"Cases that need legal expert judgement\nTrường hợp cần phán đoán của chuyên gia pháp lý"}],"correctOptionId":"LLM300-Q102-A","explanation":"Explanation (EN): Banking chatbots are best used for repeated customer requests and verified in-app assistance. Unresolved or sensitive issues should be escalated to authorized human staff, not resolved by inventing an answer.\nGiải thích (VI): Chatbot ngân hàng phù hợp với các yêu cầu lặp lại và hỗ trợ trong ứng dụng đã xác thực. Vấn đề nhạy cảm hoặc chưa xử lý được phải chuyển nhân viên có thẩm quyền, không được bịa câu trả lời.\nSlide reference / Đối chiếu slide: Ch.4, pp.11–19","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q103","chapter":3,"number":103,"question":"In the BAB framework, what does the final B mean?\nTrong khung BAB, chữ B cuối cùng có nghĩa là gì?","options":[{"id":"LLM300-Q103-A","text":"Bridge\nBridge (cầu nối)"},{"id":"LLM300-Q103-B","text":"Budget\nBudget (ngân sách)"},{"id":"LLM300-Q103-C","text":"Balance\nBalance (số dư/cân bằng)"},{"id":"LLM300-Q103-D","text":"Backup\nBackup (dự phòng)"}],"correctOptionId":"LLM300-Q103-A","explanation":"Explanation (EN): In the BAB framework, the three terms are Before – After – Bridge. The final B is Bridge, the actions linking the before-state to the desired after-state.\nGiải thích (VI): Khung BAB gồm Before – After – Bridge. Chữ B cuối là Bridge, tức bước/cách làm nối trạng thái trước và trạng thái mong muốn.\nSlide reference / Đối chiếu slide: Ch.3, p.16","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q104","chapter":4,"number":104,"question":"What is FinBERT mainly designed to handle?\nFinBERT chủ yếu được thiết kế xử lý điều gì?","options":[{"id":"LLM300-Q104-A","text":"Only network hardware problems\nChỉ vấn đề phần cứng mạng"},{"id":"LLM300-Q104-B","text":"Financial language and sentiment\nNgôn ngữ và cảm xúc tài chính"},{"id":"LLM300-Q104-C","text":"Only customer fingerprints\nChỉ dấu vân tay khách hàng"},{"id":"LLM300-Q104-D","text":"Only satellite images\nChỉ ảnh vệ tinh"}],"correctOptionId":"LLM300-Q104-B","explanation":"Explanation (EN): FinBERT adapts BERT-style language modeling to financial text, especially financial sentiment classification. It is not a hardware or image-only system.\nGiải thích (VI): FinBERT chuyên biệt hóa mô hình kiểu BERT cho ngôn ngữ tài chính, nhất là phân loại cảm xúc trong văn bản tài chính; không phải hệ thống phần cứng hay chỉ xử lý hình ảnh.\nSlide reference / Đối chiếu slide: Ch.4, p.46","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q105","chapter":3,"number":105,"question":"A prompt says 'use only the attached report.' What is being controlled?\nPrompt ghi 'chỉ dùng báo cáo đính kèm'. Điều này đang kiểm soát yếu tố nào?","options":[{"id":"LLM300-Q105-A","text":"The user's keyboard language\nNgôn ngữ bàn phím của người dùng"},{"id":"LLM300-Q105-B","text":"The model's number of layers\nSố lớp của mô hình"},{"id":"LLM300-Q105-C","text":"The file's screen resolution\nĐộ phân giải màn hình của tệp"},{"id":"LLM300-Q105-D","text":"The permitted source of information\nNguồn thông tin được phép sử dụng"}],"correctOptionId":"LLM300-Q105-D","explanation":"Explanation (EN): Grounding bases claims and extracted fields on identifiable source material. When evidence is absent, state that fact or leave the field blank rather than inventing figures or citations.\nGiải thích (VI): Grounding yêu cầu khẳng định và trường trích xuất dựa trên nguồn xác định. Nếu không có bằng chứng, phải ghi thiếu hoặc để trống thay vì bịa số liệu hay trích dẫn.\nSlide reference / Đối chiếu slide: Ch.3, pp.35–37; Ch.4, p.10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q106","chapter":4,"number":106,"question":"Why assess data risks before putting AI into production?\nVì sao phải đánh giá rủi ro dữ liệu trước khi đưa AI vào vận hành thật?","options":[{"id":"LLM300-Q106-A","text":"To let the model set its own policy\nCho mô hình tự đặt chính sách"},{"id":"LLM300-Q106-B","text":"To publish private customer details\nCông bố thông tin khách hàng riêng tư"},{"id":"LLM300-Q106-C","text":"To avoid all future model updates\nKhông phải cập nhật mô hình nữa"},{"id":"LLM300-Q106-D","text":"To find controls needed before live use\nXác định biện pháp kiểm soát cần có trước vận hành"}],"correctOptionId":"LLM300-Q106-D","explanation":"Explanation (EN): Banking data can contain confidential customer identifiers or credentials. Data minimization, masking, legal safeguards and secure access reduce disclosure risks; an external service does not make these duties disappear.\nGiải thích (VI): Dữ liệu ngân hàng có thể chứa thông tin nhận dạng hoặc thông tin xác thực nhạy cảm. Giảm thiểu dữ liệu, che thông tin, bảo đảm cơ sở pháp lý và kiểm soát truy cập giúp hạn chế rò rỉ; dùng dịch vụ ngoài không làm mất trách nhiệm bảo vệ dữ liệu.\nSlide reference / Đối chiếu slide: Ch.4, pp.19–20; Ch.3, p.38","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q107","chapter":3,"number":107,"question":"A request asks for a table with three named columns. Which prompt part is defined?\nYêu cầu tạo bảng có ba cột được đặt tên. Thành phần nào của prompt đã xác định?","options":[{"id":"LLM300-Q107-A","text":"Model size\nQuy mô mô hình"},{"id":"LLM300-Q107-B","text":"Word embedding\nWord embedding"},{"id":"LLM300-Q107-C","text":"Training cost\nChi phí huấn luyện"},{"id":"LLM300-Q107-D","text":"Output format\nĐịnh dạng đầu ra"}],"correctOptionId":"LLM300-Q107-D","explanation":"Explanation (EN): The RCTF structure states Role (perspective), Context (background), Task (required operation) and Format (output structure). Assigning a role does not change source facts or model weights.\nGiải thích (VI): RCTF gồm Role (vai trò/góc nhìn), Context (bối cảnh), Task (nhiệm vụ) và Format (cấu trúc đầu ra). Gán vai trò không thay đổi dữ kiện nguồn hoặc trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.3, pp.16–23","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q108","chapter":4,"number":108,"question":"Why use RAG in a customer-service chatbot?\nVì sao dùng RAG trong chatbot chăm sóc khách hàng?","options":[{"id":"LLM300-Q108-A","text":"To avoid updating internal policy files\nTránh cập nhật tệp chính sách nội bộ"},{"id":"LLM300-Q108-B","text":"To base answers on retrieved bank documents\nDựa câu trả lời trên tài liệu ngân hàng truy xuất được"},{"id":"LLM300-Q108-C","text":"To make every reply longer and creative\nLàm mọi câu trả lời dài và sáng tạo"},{"id":"LLM300-Q108-D","text":"To remove the need for customer questions\nKhông cần câu hỏi khách hàng"}],"correctOptionId":"LLM300-Q108-B","explanation":"Explanation (EN): Retrieval-Augmented Generation retrieves relevant approved documents to ground chatbot responses. When bank policies change, the knowledge base must be updated; retrieval does not remove the need for checking.\nGiải thích (VI): RAG truy xuất tài liệu liên quan đã được duyệt để làm căn cứ cho chatbot. Khi chính sách đổi phải cập nhật cơ sở tri thức; truy xuất không loại bỏ nhu cầu kiểm tra.\nSlide reference / Đối chiếu slide: Ch.4, pp.13, 18, 21","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q109","chapter":1,"number":109,"question":"What does chain-of-thought prompting add to a problem?\nChain-of-thought prompting bổ sung điều gì vào bài toán?","options":[{"id":"LLM300-Q109-A","text":"A new set of model weights\nBộ trọng số mô hình mới"},{"id":"LLM300-Q109-B","text":"Linked steps before the answer\nCác bước liên kết trước đáp án"},{"id":"LLM300-Q109-C","text":"Automatic proof of every fact\nBằng chứng tự động cho mọi dữ kiện"},{"id":"LLM300-Q109-D","text":"Only a longer list of keywords\nChỉ một danh sách từ khóa dài hơn"}],"correctOptionId":"LLM300-Q109-B","explanation":"Explanation (EN): Chain-of-thought prompting guides a problem through linked intermediate reasoning steps, unlike a simple keyword list or a change to model weights.\nGiải thích (VI): Chain-of-thought hướng dẫn bài toán qua các bước suy luận trung gian liên kết, không chỉ là danh sách từ khóa hay thay trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.1, pp.27–29; Ch.3, pp.27, 30","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q110","chapter":2,"number":110,"question":"Which part of ChatGPT lets users upload files and ask questions?\nPhần nào của ChatGPT cho phép người dùng tải tệp lên và đặt câu hỏi?","options":[{"id":"LLM300-Q110-A","text":"The user interface\nGiao diện người dùng"},{"id":"LLM300-Q110-B","text":"The training dataset alone\nChỉ tập dữ liệu huấn luyện"},{"id":"LLM300-Q110-C","text":"The tokenizer alone\nChỉ bộ tách token"},{"id":"LLM300-Q110-D","text":"The attention head alone\nChỉ đầu attention"}],"correctOptionId":"LLM300-Q110-A","explanation":"Explanation (EN): ChatGPT is an AI application combining a language model with a user interface and supporting services. File upload, conversation display and memory are application features, not tasks performed by one attention head.\nGiải thích (VI): ChatGPT là ứng dụng AI kết hợp mô hình ngôn ngữ, giao diện và các dịch vụ hỗ trợ. Tải tệp, hiển thị hội thoại và ghi nhớ là tính năng ứng dụng, không phải chức năng riêng của một đầu attention.\nSlide reference / Đối chiếu slide: Ch.2, pp.15–24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q111","chapter":3,"number":111,"question":"What does fairness testing aim to detect?\nKiểm thử công bằng (fairness testing) nhằm phát hiện gì?","options":[{"id":"LLM300-Q111-A","text":"Unfair differences in model results\nKhác biệt không công bằng giữa các kết quả mô hình"},{"id":"LLM300-Q111-B","text":"Only the cost of a computer chip\nChỉ chi phí chip máy tính"},{"id":"LLM300-Q111-C","text":"Only the number of words in a reply\nChỉ số từ trong câu trả lời"},{"id":"LLM300-Q111-D","text":"Only the document's page margins\nChỉ lề trang tài liệu"}],"correctOptionId":"LLM300-Q111-A","explanation":"Explanation (EN): Responsible AI requires fairness assessment, transparency and human control. Automation does not remove a bank’s obligations to explain and oversee high-stakes outcomes.\nGiải thích (VI): AI có trách nhiệm cần đánh giá công bằng, minh bạch và kiểm soát của con người. Tự động hóa không xóa nghĩa vụ giải thích và giám sát các quyết định quan trọng của ngân hàng.\nSlide reference / Đối chiếu slide: Ch.3, p.40; Ch.4, p.52","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q112","chapter":3,"number":112,"question":"What is a jailbreak attack?\nTấn công jailbreak là gì?","options":[{"id":"LLM300-Q112-A","text":"A normal request to shorten a paragraph\nYêu cầu bình thường để rút ngắn đoạn"},{"id":"LLM300-Q112-B","text":"A method for counting text tokens\nPhương pháp đếm token văn bản"},{"id":"LLM300-Q112-C","text":"An attempt to bypass a model's safety rules\nNỗ lực vượt qua quy tắc an toàn mô hình"},{"id":"LLM300-Q112-D","text":"A process for training on public data\nQuy trình huấn luyện dữ liệu công khai"}],"correctOptionId":"LLM300-Q112-C","explanation":"Explanation (EN): A jailbreak is an attempt to bypass the system’s safety rules. It differs from a legitimate request for normal content or formatting.\nGiải thích (VI): Jailbreak là nỗ lực vượt qua ranh giới an toàn của hệ thống, khác yêu cầu nội dung hay định dạng hợp lệ.\nSlide reference / Đối chiếu slide: Ch.3, pp.39–40","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q113","chapter":4,"number":113,"question":"How can an LLM support risk staff reviewing loan files?\nLLM hỗ trợ nhân viên rủi ro rà soát hồ sơ vay ra sao?","options":[{"id":"LLM300-Q113-A","text":"Replace the bank's risk policy\nThay thế chính sách rủi ro ngân hàng"},{"id":"LLM300-Q113-B","text":"Approve all loans with no review\nPhê duyệt mọi khoản vay không rà soát"},{"id":"LLM300-Q113-C","text":"Point out missing or conflicting text\nChỉ ra văn bản còn thiếu hoặc mâu thuẫn"},{"id":"LLM300-Q113-D","text":"Change loan amounts without records\nThay đổi số tiền vay mà không ghi nhận"}],"correctOptionId":"LLM300-Q113-C","explanation":"Explanation (EN): Credit risk is the risk that a borrower does not repay. LLMs can review loan files and flag missing or contradictory items for a loan officer, but must not autonomously invent data or approve loans.\nGiải thích (VI): Rủi ro tín dụng là khả năng người vay không trả nợ. LLM có thể rà hồ sơ, cảnh báo thông tin thiếu hoặc mâu thuẫn để cán bộ tín dụng kiểm tra nhưng không được tự bịa dữ liệu hay phê duyệt vay.\nSlide reference / Đối chiếu slide: Ch.4, pp.25–29","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q114","chapter":3,"number":114,"question":"What is the main aim of access control for an AI tool?\nMục đích chính của kiểm soát quyền truy cập công cụ AI là gì?","options":[{"id":"LLM300-Q114-A","text":"Give all users full system access\nCho mọi người dùng toàn quyền hệ thống"},{"id":"LLM300-Q114-B","text":"Share all passwords across teams\nChia sẻ mật khẩu giữa nhóm"},{"id":"LLM300-Q114-C","text":"Give each user only needed permissions\nChỉ cấp quyền cần thiết cho mỗi người dùng"},{"id":"LLM300-Q114-D","text":"Remove records of who used the tool\nXóa lịch sử ai đã dùng công cụ"}],"correctOptionId":"LLM300-Q114-C","explanation":"Explanation (EN): Least-privilege access means granting users and tools only the permissions necessary for their jobs. Test on sample or separate data to avoid damaging live records.\nGiải thích (VI): Nguyên tắc quyền tối thiểu là chỉ cấp quyền cần thiết cho người dùng/công cụ. Cần thử trên dữ liệu mẫu hoặc bản sao để tránh làm hỏng dữ liệu đang vận hành.\nSlide reference / Đối chiếu slide: Ch.3, pp.38–39; Ch.4, p.20","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q115","chapter":1,"number":115,"question":"A sentence has eight words. How many groups of three consecutive words can be formed?\nMột câu có tám từ. Có thể tạo bao nhiêu nhóm gồm ba từ liên tiếp?","options":[{"id":"LLM300-Q115-A","text":"Five groups\nNăm nhóm"},{"id":"LLM300-Q115-B","text":"Six groups\nSáu nhóm"},{"id":"LLM300-Q115-C","text":"Eight groups\nTám nhóm"},{"id":"LLM300-Q115-D","text":"Seven groups\nBảy nhóm"}],"correctOptionId":"LLM300-Q115-B","explanation":"Explanation (EN): An N-gram uses a limited preceding context: an N-gram sequence contains N consecutive words, and a next-word prediction conditions on N−1 previous words. In a sentence of m words, there are m −N+1 overlapping N-grams.\nGiải thích (VI): N-gram dùng ngữ cảnh trước có giới hạn: một nhóm gồm N từ liên tiếp và việc đoán từ tiếp theo dựa vào N−1 từ trước. Câu có m từ tạo được m−N+1 nhóm N-gram chồng lấp.\nSlide reference / Đối chiếu slide: Ch.1, pp.6–9","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q116","chapter":3,"number":116,"question":"What does Top-K limit?\nTop-K giới hạn điều gì?","options":[{"id":"LLM300-Q116-A","text":"How many files are kept forever\nSố tệp lưu mãi mãi"},{"id":"LLM300-Q116-B","text":"How many users can open the website\nSố người truy cập website"},{"id":"LLM300-Q116-C","text":"How many next-token choices are considered\nSố ứng viên token tiếp theo được xét"},{"id":"LLM300-Q116-D","text":"How many pages the model can print\nSố trang mô hình có thể in"}],"correctOptionId":"LLM300-Q116-C","explanation":"Explanation (EN): Top-K keeps only a fixed number K of the highest-probability next-token candidates before sampling.\nGiải thích (VI): Top-K chỉ giữ K ứng viên token kế tiếp có xác suất cao nhất trước khi lấy mẫu.\nSlide reference / Đối chiếu slide: Ch.3, p.14","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q117","chapter":1,"number":117,"question":"What is pre-training mainly used for?\nPre-training chủ yếu được sử dụng để làm gì?","options":[{"id":"LLM300-Q117-A","text":"Checking one final customer loan\nKiểm tra một khoản vay cuối cùng"},{"id":"LLM300-Q117-B","text":"Learning broad patterns from large data\nHọc mẫu tổng quát từ dữ liệu lớn"},{"id":"LLM300-Q117-C","text":"Publishing a bank's annual report\nCông bố báo cáo thường niên ngân hàng"},{"id":"LLM300-Q117-D","text":"Drawing a user login button\nVẽ nút đăng nhập của người dùng"}],"correctOptionId":"LLM300-Q117-B","explanation":"Explanation (EN): Pre-training learns broad language patterns from large text data, including self-supervised prediction objectives. It precedes specialization and does not mean memorizing only the current chat.\nGiải thích (VI): Tiền huấn luyện học mẫu ngôn ngữ tổng quát từ văn bản lớn, có thể dùng mục tiêu dự đoán tự giám sát. Giai đoạn này diễn ra trước điều chỉnh chuyên biệt, không chỉ ghi nhớ cuộc hội thoại hiện tại.\nSlide reference / Đối chiếu slide: Ch.1, p.14; Ch.2, pp.45–47","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q118","chapter":3,"number":118,"question":"What is a hallucination in an LLM reply?\nHallucination trong câu trả lời LLM là gì?","options":[{"id":"LLM300-Q118-A","text":"A table with correct source data\nBảng có dữ liệu nguồn đúng"},{"id":"LLM300-Q118-B","text":"A verified quote from a document\nTrích dẫn đã xác minh từ tài liệu"},{"id":"LLM300-Q118-C","text":"A made-up fact stated as true\nThông tin bịa đặt được phát biểu như sự thật"},{"id":"LLM300-Q118-D","text":"A request for a longer answer\nYêu cầu câu trả lời dài hơn"}],"correctOptionId":"LLM300-Q118-C","explanation":"Explanation (EN): Hallucination means plausible-sounding content is invented or unsupported by the source. It can mislead decisions, so missing information should be marked missing and critical claims checked.\nGiải thích (VI): Hallucination là nội dung nghe hợp lý nhưng bị bịa hoặc không có căn cứ trong nguồn. Nó có thể gây quyết định sai; phải ghi rõ phần thiếu và kiểm tra các khẳng định quan trọng.\nSlide reference / Đối chiếu slide: Ch.3, pp.34–37; Ch.4, p.10","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q119","chapter":2,"number":119,"question":"What best describes ChatGPT as a product?\nMô tả nào đúng nhất về ChatGPT như một sản phẩm?","options":[{"id":"LLM300-Q119-A","text":"A chip designed for training models\nChip để huấn luyện mô hình"},{"id":"LLM300-Q119-B","text":"A database that stores only images\nCơ sở dữ liệu chỉ lưu ảnh"},{"id":"LLM300-Q119-C","text":"An AI application with a model and interface\nỨng dụng AI có mô hình và giao diện"},{"id":"LLM300-Q119-D","text":"A website that only searches files\nWebsite chỉ tìm tệp"}],"correctOptionId":"LLM300-Q119-C","explanation":"Explanation (EN): ChatGPT is an AI application combining a language model with a user interface and supporting services. File upload, conversation display and memory are application features, not tasks performed by one attention head.\nGiải thích (VI): ChatGPT là ứng dụng AI kết hợp mô hình ngôn ngữ, giao diện và các dịch vụ hỗ trợ. Tải tệp, hiển thị hội thoại và ghi nhớ là tính năng ứng dụng, không phải chức năng riêng của một đầu attention.\nSlide reference / Đối chiếu slide: Ch.2, pp.15–24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q120","chapter":2,"number":120,"question":"Why does a Transformer need position information?\nVì sao Transformer cần thông tin vị trí?","options":[{"id":"LLM300-Q120-A","text":"Words are always in fixed order\nCác từ luôn theo thứ tự cố định"},{"id":"LLM300-Q120-B","text":"Word order can change meaning\nThứ tự từ có thể đổi nghĩa"},{"id":"LLM300-Q120-C","text":"Every sentence has equal meaning\nMọi câu có nghĩa giống nhau"},{"id":"LLM300-Q120-D","text":"Position removes the need for text\nThông tin vị trí khiến không cần văn bản"}],"correctOptionId":"LLM300-Q120-B","explanation":"Explanation (EN): Positional encoding supplies information about token order. Word order can change sentence meaning even when the same words are present.\nGiải thích (VI): Mã hóa vị trí bổ sung thông tin thứ tự token. Trật tự từ có thể thay đổi nghĩa câu dù các từ giống nhau.\nSlide reference / Đối chiếu slide: Ch.2, p.34","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Components of ChatGPT","level":"Original / Đề gốc"},{"id":"LLM300-Q121","chapter":3,"number":121,"question":"What is a jailbreak attempt?\nNỗ lực jailbreak là gì?","options":[{"id":"LLM300-Q121-A","text":"A normal request within authorized scope\nYêu cầu thông thường trong phạm vi cho phép"},{"id":"LLM300-Q121-B","text":"A technique for lowering GPU electricity use\nKỹ thuật giảm điện năng GPU"},{"id":"LLM300-Q121-C","text":"An attempt to override safety restrictions\nNỗ lực vượt qua hạn chế an toàn"},{"id":"LLM300-Q121-D","text":"A way of encrypting a customer statement\nCách mã hóa sao kê khách hàng"}],"correctOptionId":"LLM300-Q121-C","explanation":"Explanation (EN): A jailbreak is an attempt to bypass the system’s safety rules. It differs from a legitimate request for normal content or formatting.\nGiải thích (VI): Jailbreak là nỗ lực vượt qua ranh giới an toàn của hệ thống, khác yêu cầu nội dung hay định dạng hợp lệ.\nSlide reference / Đối chiếu slide: Ch.3, pp.39–40","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q122","chapter":1,"number":122,"question":"A model adapts to task demonstrations supplied in the prompt. What is this?\nMô hình thích nghi với các ví dụ nhiệm vụ có trong prompt. Đây là gì?","options":[{"id":"LLM300-Q122-A","text":"Replacing the tokenizer with a new program\nThay tokenizer bằng chương trình mới"},{"id":"LLM300-Q122-B","text":"Rewriting all model weights during a chat\nViết lại toàn bộ trọng số trong cuộc trò chuyện"},{"id":"LLM300-Q122-C","text":"Copying permanent labels into its training set\nChép nhãn cố định vào dữ liệu huấn luyện"},{"id":"LLM300-Q122-D","text":"Learning task patterns from prompt context\nHọc mẫu nhiệm vụ từ ngữ cảnh prompt"}],"correctOptionId":"LLM300-Q122-D","explanation":"Explanation (EN): Few-shot in-context learning supplies several demonstrations inside the prompt. The model infers the desired pattern from these examples without changing its permanent weights.\nGiải thích (VI): Few-shot cung cấp một số ví dụ ngay trong prompt. Mô hình suy ra cách làm từ ví dụ mà không thay đổi vĩnh viễn trọng số đã huấn luyện.\nSlide reference / Đối chiếu slide: Ch.1, pp.24–25; Ch.3, p.27","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q123","chapter":3,"number":123,"question":"What is a safe testing practice for workflows?\nThực hành kiểm thử quy trình nào là an toàn?","options":[{"id":"LLM300-Q123-A","text":"Use sample data or a separate working copy\nDùng dữ liệu mẫu hoặc bản sao làm việc riêng"},{"id":"LLM300-Q123-B","text":"Run it immediately on the only live dataset\nChạy ngay trên bộ dữ liệu thật duy nhất"},{"id":"LLM300-Q123-C","text":"Give the model permanent administrator rights\nCấp quyền quản trị vĩnh viễn"},{"id":"LLM300-Q123-D","text":"Disable review of generated changes entirely\nTắt toàn bộ rà soát thay đổi"}],"correctOptionId":"LLM300-Q123-A","explanation":"Explanation (EN): Least-privilege access means granting users and tools only the permissions necessary for their jobs. Test on sample or separate data to avoid damaging live records.\nGiải thích (VI): Nguyên tắc quyền tối thiểu là chỉ cấp quyền cần thiết cho người dùng/công cụ. Cần thử trên dữ liệu mẫu hoặc bản sao để tránh làm hỏng dữ liệu đang vận hành.\nSlide reference / Đối chiếu slide: Ch.3, pp.38–39; Ch.4, p.20","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q124","chapter":3,"number":124,"question":"The user requests a two-column table with specific headers. What is constrained?\nNgười dùng yêu cầu bảng hai cột với tiêu đề cụ thể. Yếu tố nào bị ràng buộc?","options":[{"id":"LLM300-Q124-A","text":"The subject matter of the user account\nChủ đề tài khoản người dùng"},{"id":"LLM300-Q124-B","text":"The number of layers in the Transformer\nSố lớp Transformer"},{"id":"LLM300-Q124-C","text":"The size of the training dataset stored\nQuy mô tập dữ liệu huấn luyện lưu trữ"},{"id":"LLM300-Q124-D","text":"The structure of the expected response\nCấu trúc câu trả lời dự kiến"}],"correctOptionId":"LLM300-Q124-D","explanation":"Explanation (EN): The RCTF structure states Role (perspective), Context (background), Task (required operation) and Format (output structure). Assigning a role does not change source facts or model weights.\nGiải thích (VI): RCTF gồm Role (vai trò/góc nhìn), Context (bối cảnh), Task (nhiệm vụ) và Format (cấu trúc đầu ra). Gán vai trò không thay đổi dữ kiện nguồn hoặc trọng số mô hình.\nSlide reference / Đối chiếu slide: Ch.3, pp.16–23","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q125","chapter":4,"number":125,"question":"What is a good approach to credit-file screening?\nCách tiếp cận tốt khi sàng lọc hồ sơ tín dụng là gì?","options":[{"id":"LLM300-Q125-A","text":"Approve loans without responsible staff review\nDuyệt vay không có nhân viên chịu trách nhiệm"},{"id":"LLM300-Q125-B","text":"Identify missing items for officer verification\nChỉ ra mục còn thiếu để cán bộ kiểm tra"},{"id":"LLM300-Q125-C","text":"Invent absent employment records for clients\nBịa hồ sơ việc làm còn thiếu"},{"id":"LLM300-Q125-D","text":"Replace the institution's lending regulations\nThay quy định cho vay của tổ chức"}],"correctOptionId":"LLM300-Q125-B","explanation":"Explanation (EN): Credit risk is the risk that a borrower does not repay. LLMs can review loan files and flag missing or contradictory items for a loan officer, but must not autonomously invent data or approve loans.\nGiải thích (VI): Rủi ro tín dụng là khả năng người vay không trả nợ. LLM có thể rà hồ sơ, cảnh báo thông tin thiếu hoặc mâu thuẫn để cán bộ tín dụng kiểm tra nhưng không được tự bịa dữ liệu hay phê duyệt vay.\nSlide reference / Đối chiếu slide: Ch.4, pp.25–29","source":"LLMs.docx | TS. Trần Trung Minh","topic":"LLMs in Banking & Finance","level":"Original / Đề gốc"},{"id":"LLM300-Q126","chapter":1,"number":126,"question":"What is one-shot prompting?\nOne-shot prompting là gì?","options":[{"id":"LLM300-Q126-A","text":"Providing no demonstrations of the task\nKhông cung cấp ví dụ nào"},{"id":"LLM300-Q126-B","text":"Training a new model using one sentence\nHuấn luyện mô hình mới bằng một câu"},{"id":"LLM300-Q126-C","text":"Returning only one word in the answer\nChỉ trả lời bằng một từ"},{"id":"LLM300-Q126-D","text":"Providing one demonstration of the task\nCung cấp một ví dụ minh họa nhiệm vụ"}],"correctOptionId":"LLM300-Q126-D","explanation":"Explanation (EN): One-shot prompting gives exactly one demonstration to guide the model. It is prompting, not retraining the whole neural network.\nGiải thích (VI): One-shot đưa đúng một ví dụ minh họa để hướng dẫn mô hình. Đây là kỹ thuật prompt, không phải huấn luyện lại toàn bộ mạng.\nSlide reference / Đối chiếu slide: Ch.1, p.24","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Overview of Large Language Models","level":"Original / Đề gốc"},{"id":"LLM300-Q127","chapter":3,"number":127,"question":"A user improves wording, context and format constraints to guide responses. What is this?\nNgười dùng cải thiện câu chữ, ngữ cảnh và ràng buộc định dạng để định hướng câu trả lời. Đây là gì?","options":[{"id":"LLM300-Q127-A","text":"Replacing the application user interface\nThay giao diện ứng dụng"},{"id":"LLM300-Q127-B","text":"Designing instructions for more useful outputs\nThiết kế hướng dẫn để có đầu ra hữu ích hơn"},{"id":"LLM300-Q127-C","text":"Training every model parameter from scratch\nHuấn luyện mọi tham số từ đầu"},{"id":"LLM300-Q127-D","text":"Buying larger hardware for model inference\nMua phần cứng lớn hơn để suy luận"}],"correctOptionId":"LLM300-Q127-B","explanation":"Explanation (EN): A clear prompt specifies the task, context, constraints and required output. Testing one change at a time and saving reusable templates helps make results consistent and auditable without retraining model weights.\nGiải thích (VI): Prompt rõ ràng nêu nhiệm vụ, ngữ cảnh, ràng buộc và đầu ra. Kiểm thử từng thay đổi và lưu mẫu để tái sử dụng giúp kết quả nhất quán, dễ đối chiếu mà không cần huấn luyện lại trọng số.\nSlide reference / Đối chiếu slide: Ch.3, pp.4–12, 24–25, 41","source":"LLMs.docx | TS. Trần Trung Minh","topic":"Prompt Engineering","level":"Original / Đề gốc"},{"id":"LLM300-Q128","chapter":4,"number":128,"question":"AI compares uploaded applications with an internal document checklist. What should it do?\nAI so sánh hồ sơ nộp lên với danh sách tài liệu nội bộ. AI nên làm gì?","options":[{"id":"LLM300-Q128-A","text":"Approve loans without responsible staff review\nDuyệt vay không có nhân viên chịu trách nhiệm"},{"id":"LLM300-Q128-B","text":"Invent absent employment records for clients\nBịa hồ sơ việc làm còn thiếu"},{"id":"LLM300-Q128-C","text":"Identify missing items for officer verification\nChỉ ra mục còn thiếu để cán bộ kiểm tra"},{"id":"LLM300-Q128-D","text":"Replace the institution's lending regulations\nThay quy định cho vay của tổ chức"}],"correctOptionId":"LLM300-Q128-C","explanation":"Explanation (EN): Credit risk is the risk that a borrower does not repay. LLMs can review loan files and flag missing or contradictory items for a loan officer, but must not autonomously invent data or approve loans.\nGiải thích (VI): Rủi ro tín dụng là khả năng người vay không trả nợ. LLM có thể rà hồ sơ, cảnh báo thông tin thiếu hoặc mâu thuẫn để cán bộ tín dụng kiểm tra nhưng không được tự bịa dữ liệu hay phê duyệt vay.\nSlide reference / Đối chiếu slide: Ch.4, pp.25–29","source":"LLMs.docx | TS. Trần Trung Minh","topic":"L
