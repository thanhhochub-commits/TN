<style>
:root{--bg:#f5f7fb;--panel:#ffffff;--panel2:#f9fafb;--text:#111827;--muted:#64748b;--line:#e5e7eb;--primary:#2563eb;--primary2:#1d4ed8;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--warn:#a16207;--shadow:0 10px 35px rgba(15,23,42,.08);--radius:18px;--font:16px}
html[data-theme="dark"]{--bg:#0b1020;--panel:#111827;--panel2:#182235;--text:#f8fafc;--muted:#9ca3af;--line:#263247;--primary:#60a5fa;--primary2:#93c5fd;--ok:#4ade80;--okbg:#0d2b1a;--bad:#fb7185;--badbg:#35151d;--warn:#facc15;--shadow:0 16px 42px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:var(--font)/1.52 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;overflow:auto;z-index:20}.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 18px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:800}.brand b{font-size:17px}.brand small{display:block;color:var(--muted)}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--text);padding:11px 12px;border-radius:12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center}.nav button:hover,.nav button.active{background:var(--panel2)}.nav button.active{font-weight:700;color:var(--primary)}.side-foot{margin-top:18px;padding:13px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px}.main{min-width:0}.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:10px}.menu-btn{display:none}.topbar .spacer{flex:1}.icon-btn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:12px;cursor:pointer;transition:.18s transform,.18s background,.18s border}.btn:hover,.icon-btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--primary) 45%,var(--line))}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}.btn.danger{color:var(--bad)}.content{max-width:1180px;margin:0 auto;padding:26px 22px 70px}.page-title{margin:0 0 6px;font-size:28px;letter-spacing:-.02em}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.stat{grid-column:span 3}.stat .n{font-size:28px;font-weight:800}.stat .l{color:var(--muted);font-size:13px}.progress{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);width:0}.section-title{font-size:18px;margin:0 0 12px}.chapter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chapter-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2)}.chapter-item input{width:18px;height:18px}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 11px;border-radius:11px;outline:none}.field input:focus,.field select:focus{border-color:var(--primary)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toggle{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.toggle input{width:18px;height:18px}.setup{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.quiz-wrap{max-width:900px;margin:0 auto}.quiz-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}.quiz-head .progress{flex:1}.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel2);padding:5px 8px;border-radius:999px}.question{font-size:20px;font-weight:760;line-height:1.45;margin:14px 0 16px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:13px 14px;border-radius:14px;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;transition:.16s transform,.16s border,.16s background}.option:hover:not(:disabled){transform:translateY(-1px);border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}.option:disabled{cursor:default}.option.selected{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--panel2))}.option.selected .opt-letter{border-color:var(--primary);color:var(--primary)}.opt-letter{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--panel)}.option.correct{border-color:var(--ok);background:var(--okbg)}.option.correct .opt-letter{border-color:var(--ok);color:var(--ok)}.option.wrong{border-color:var(--bad);background:var(--badbg)}.option.wrong .opt-letter{border-color:var(--bad);color:var(--bad)}.option.review{border-color:#d97706;background:color-mix(in srgb,#f59e0b 12%,var(--panel))}.option.review .opt-letter{border-color:#d97706;color:#d97706}.feedback.review{border-color:#d97706;background:color-mix(in srgb,#f59e0b 10%,var(--panel))}.feedback{margin-top:14px;border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--panel2)}.feedback.good{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}.feedback.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}.feedback b{display:block;margin-bottom:5px}.explanation{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}.quiz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.navigator{display:flex;gap:6px;overflow:auto;padding:10px 0 2px}.navq{min-width:34px;height:34px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;cursor:pointer}.navq.current{outline:2px solid var(--primary)}.navq.answered{background:color-mix(in srgb,var(--primary) 12%,var(--panel))}.navq.correct{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.navq.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}.list{display:grid;gap:10px}.q-row{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:14px}.q-row h4{margin:0 0 7px;font-size:15px}.q-row .meta{font-size:12px;color:var(--muted)}.q-row .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.searchbar{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;margin-bottom:14px}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.toast{position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--panel);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translateY(0)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;padding:20px;z-index:99}.modal.open{display:grid}.modal-card{max-width:620px;width:100%;max-height:85vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.kpi-table{width:100%;border-collapse:collapse}.kpi-table th,.kpi-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.right{text-align:right!important}.muted{color:var(--muted)}.hidden{display:none!important}.test-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.test-summary .card{box-shadow:none}.timer{font-variant-numeric:tabular-nums;font-weight:800}.bookmark.active{color:#eab308;border-color:#eab308}.danger-zone{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-280px;width:260px;transition:.22s left;box-shadow:var(--shadow)}.sidebar.open{left:0}.menu-btn{display:inline-flex}.stat{grid-column:span 6}.setup{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr 1fr}.searchbar>*:first-child{grid-column:1/-1}.content{padding:20px 14px 70px}.topbar{padding:10px 14px}.question{font-size:18px}}
@media(max-width:560px){.stat{grid-column:span 12}.chapter-grid{grid-template-columns:1fr}.test-summary{grid-template-columns:1fr}.quiz-card{padding:16px}.option{padding:11px}.quiz-actions{position:sticky;bottom:10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);padding:8px;border-radius:14px}.searchbar{grid-template-columns:1fr}.page-title{font-size:24px}}
</style>

<script>
const QUESTIONS = [{"id":"PM-C1-0001","chapter":1,"number":1,"question":"Why is an IPS useful when evaluating a portfolio manager?","options":[{"id":"PM-C1-0001-O1","text":"It provides predetermined objectives and benchmarks against which decisions and results can be assessed."},{"id":"PM-C1-0001-O2","text":"It eliminates all investment constraints."},{"id":"PM-C1-0001-O3","text":"It ensures that the manager always beats the market."},{"id":"PM-C1-0001-O4","text":"It allows the manager to change the client’s objectives without consultation."}],"correctOptionId":"PM-C1-0001-O1","explanation":"IPS thiết lập mục tiêu, giới hạn và benchmark để đánh giá nhà quản lý, không bảo đảm đánh bại thị trường.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0002","chapter":1,"number":2,"question":"Which statement best describes the relationship between risk and expected return in investment decision-making?","options":[{"id":"PM-C1-0002-O1","text":"Investors normally require more expected return for accepting more risk."},{"id":"PM-C1-0002-O2","text":"Low-risk assets should always provide the highest return."},{"id":"PM-C1-0002-O3","text":"Expected return is unrelated to investor risk preferences."},{"id":"PM-C1-0002-O4","text":"Higher risk always produces higher realized return."}],"correctOptionId":"PM-C1-0002-O1","explanation":"Nhà đầu tư ngại rủi ro thường yêu cầu lợi nhuận KỲ VỌNG cao hơn nếu nhận rủi ro cao hơn; không có bảo đảm lợi nhuận thực tế.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0003","chapter":1,"number":3,"question":"An investor is 28 years old, has stable employment, adequate insurance, an emergency reserve, and a retirement goal 35 years away. Which investment orientation is most consistent with these circumstances?","options":[{"id":"PM-C1-0003-O1","text":"Strong emphasis on capital preservation only."},{"id":"PM-C1-0003-O2","text":"Exclusive investment in short-term cash instruments."},{"id":"PM-C1-0003-O3","text":"Complete avoidance of equities."},{"id":"PM-C1-0003-O4","text":"Relatively high tolerance for growth-oriented investments."}],"correctOptionId":"PM-C1-0003-O4","explanation":"Giai đoạn tích lũy (accumulation), chân trời dài và có dự phòng hỗ trợ khả năng chịu rủi ro để tăng trưởng.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0004","chapter":1,"number":4,"question":"Why should both risk and return objectives be considered together when developing an investment plan?","options":[{"id":"PM-C1-0004-O1","text":"Because all investors have the same optimal risk level."},{"id":"PM-C1-0004-O2","text":"Because higher return objectives generally involve accepting greater investment risk."},{"id":"PM-C1-0004-O3","text":"Because return objectives can be set independently of investor constraints."},{"id":"PM-C1-0004-O4","text":"Because risk matters only after securities have been purchased."}],"correctOptionId":"PM-C1-0004-O2","explanation":"Mục tiêu lợi nhuận và khả năng chịu rủi ro phải tương thích ngay khi lập kế hoạch.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0005","chapter":1,"number":5,"question":"Which activity belongs primarily to the planning stage of portfolio management?","options":[{"id":"PM-C1-0005-O1","text":"Selling a security because its portfolio weight has exceeded its target."},{"id":"PM-C1-0005-O2","text":"Executing an order to purchase shares."},{"id":"PM-C1-0005-O3","text":"Calculating the portfolio’s realized return after one year."},{"id":"PM-C1-0005-O4","text":"Establishing long-term asset-class weights consistent with the investor’s objectives."}],"correctOptionId":"PM-C1-0005-O4","explanation":"Planning: xác lập mục tiêu, IPS, tỷ trọng chính sách dài hạn. Implementation: giao dịch. Feedback: giám sát, tái cân bằng.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0006","chapter":1,"number":6,"question":"A security analyst estimates that a share is worth $60 based on expected future cash flows, while its current market price is $48. Which analytical approach has most directly produced this comparison?","options":[{"id":"PM-C1-0006-O1","text":"Portfolio rebalancing."},{"id":"PM-C1-0006-O2","text":"Passive indexing."},{"id":"PM-C1-0006-O3","text":"Fundamental analysis."},{"id":"PM-C1-0006-O4","text":"Tactical asset allocation."}],"correctOptionId":"PM-C1-0006-O3","explanation":"Phân tích cơ bản (fundamental analysis) định giá nội tại bằng dòng tiền kỳ vọng rồi so với giá thị trường.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0007","chapter":1,"number":7,"question":"A portfolio manager studies economic growth, interest rates, and inflation, then identifies attractive industries, and finally selects individual companies. Which approach is the manager using?","options":[{"id":"PM-C1-0007-O1","text":"Random security selection."},{"id":"PM-C1-0007-O2","text":"Bottom-up analysis."},{"id":"PM-C1-0007-O3","text":"Top-down analysis."},{"id":"PM-C1-0007-O4","text":"Passive indexing."}],"correctOptionId":"PM-C1-0007-O3","explanation":"Top-down: kinh tế vĩ mô → ngành → doanh nghiệp; bottom-up đi từ từng công ty.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0008","chapter":1,"number":8,"question":"Which sequence most logically describes the broad portfolio management process?","options":[{"id":"PM-C1-0008-O1","text":"Rebalancing → asset allocation → defining investor needs."},{"id":"PM-C1-0008-O2","text":"Planning → implementation → monitoring and feedback."},{"id":"PM-C1-0008-O3","text":"Performance evaluation → planning → security trading."},{"id":"PM-C1-0008-O4","text":"Security selection → planning → setting objectives."}],"correctOptionId":"PM-C1-0008-O2","explanation":"Trình tự quản lý: lập kế hoạch → triển khai → giám sát và phản hồi.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0009","chapter":1,"number":9,"question":"Which group consists entirely of financial assets?","options":[{"id":"PM-C1-0009-O1","text":"Real estate, commodities, and corporate bonds."},{"id":"PM-C1-0009-O2","text":"Land, gold, and common shares."},{"id":"PM-C1-0009-O3","text":"Common shares, corporate bonds, and mutual fund certificates."},{"id":"PM-C1-0009-O4","text":"Art, government bonds, and residential property."}],"correctOptionId":"PM-C1-0009-O3","explanation":"Cổ phiếu, trái phiếu và chứng chỉ quỹ là tài sản tài chính; vàng, đất, bất động sản trực tiếp là tài sản thực.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0010","chapter":1,"number":10,"question":"In a pooled investment fund, Investor A owns 20% of the fund and Investor B owns 10%. If the fund earns a gain, how should the economic benefit normally be distributed?","options":[{"id":"PM-C1-0010-O1","text":"According to each investor’s personal risk tolerance."},{"id":"PM-C1-0010-O2","text":"According to each investor’s ownership share."},{"id":"PM-C1-0010-O3","text":"Equally between A and B."},{"id":"PM-C1-0010-O4","text":"According to the date each investor joined the fund."}],"correctOptionId":"PM-C1-0010-O2","explanation":"Lợi ích quỹ phân bổ theo tỷ lệ sở hữu (ownership interest) phù hợp quy định quỹ, không chia đều tùy ý.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0011","chapter":1,"number":11,"question":"An investor is approaching retirement, has accumulated substantial wealth, and wants continued growth without putting accumulated capital at excessive risk. This investor is most likely in the:","options":[{"id":"PM-C1-0011-O1","text":"Accumulation phase."},{"id":"PM-C1-0011-O2","text":"Consolidation phase."},{"id":"PM-C1-0011-O3","text":"Gifting phase only."},{"id":"PM-C1-0011-O4","text":"Initial saving phase."}],"correctOptionId":"PM-C1-0011-O2","explanation":"Consolidation phase: giai đoạn củng cố, ưu tiên tăng trưởng có kiểm soát và bảo toàn tài sản đã tích lũy.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0012","chapter":1,"number":12,"question":"A manager constructs a portfolio designed to closely follow a broad stock-market index while keeping deviations from that index small. Which management approach is being used?","options":[{"id":"PM-C1-0012-O1","text":"Passive management."},{"id":"PM-C1-0012-O2","text":"Bottom-up speculation."},{"id":"PM-C1-0012-O3","text":"Tactical market timing."},{"id":"PM-C1-0012-O4","text":"Active management."}],"correctOptionId":"PM-C1-0012-O1","explanation":"Passive management mô phỏng benchmark, quản lý sai lệch bám sát (tracking error), không chủ đích vượt chỉ số.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0013","chapter":1,"number":13,"question":"An analyst begins by identifying companies with strong earnings, competitive advantages, and attractive valuations, with relatively little emphasis on the current macroeconomic outlook. This approach is best described as:","options":[{"id":"PM-C1-0013-O1","text":"Index replication."},{"id":"PM-C1-0013-O2","text":"Strategic asset allocation."},{"id":"PM-C1-0013-O3","text":"Bottom-up analysis."},{"id":"PM-C1-0013-O4","text":"Top-down analysis."}],"correctOptionId":"PM-C1-0013-O3","explanation":"Bottom-up bắt đầu từ nền tảng doanh nghiệp, khác top-down bắt đầu từ vĩ mô.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0014","chapter":1,"number":14,"question":"For two investments with similar expected returns, a risk-averse investor would generally prefer the investment with:","options":[{"id":"PM-C1-0014-O1","text":"Higher volatility."},{"id":"PM-C1-0014-O2","text":"Higher transaction costs."},{"id":"PM-C1-0014-O3","text":"Lower risk."},{"id":"PM-C1-0014-O4","text":"A shorter trading history."}],"correctOptionId":"PM-C1-0014-O3","explanation":"Cùng mức kỳ vọng lợi nhuận, nhà đầu tư ngại rủi ro ưu tiên tài sản rủi ro thấp hơn.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0015","chapter":1,"number":15,"question":"Which return measure is generally most useful for assessing a portfolio manager when the timing and size of client deposits and withdrawals are outside the manager’s control?","options":[{"id":"PM-C1-0015-O1","text":"Simple average of portfolio values."},{"id":"PM-C1-0015-O2","text":"Total amount of money contributed by the client."},{"id":"PM-C1-0015-O3","text":"Percentage change in the investor’s cash balance."},{"id":"PM-C1-0015-O4","text":"Time-weighted rate of return."}],"correctOptionId":"PM-C1-0015-O4","explanation":"TWRR giảm ảnh hưởng của dòng tiền nạp/rút bên ngoài, phù hợp đánh giá năng lực nhà quản lý.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0016","chapter":1,"number":16,"question":"Which activity is most closely associated with the implementation stage?","options":[{"id":"PM-C1-0016-O1","text":"Establishing the original investment policy statement."},{"id":"PM-C1-0016-O2","text":"Identifying the investor's risk tolerance."},{"id":"PM-C1-0016-O3","text":"Writing the investor's long-term objectives."},{"id":"PM-C1-0016-O4","text":"Selecting securities and executing portfolio transactions."}],"correctOptionId":"PM-C1-0016-O4","explanation":"Lựa chọn chứng khoán và thực hiện lệnh thuộc implementation, khác planning/feedback.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0017","chapter":1,"number":17,"question":"Which statement best explains why investors combine different investments into a portfolio rather than holding only one asset?","options":[{"id":"PM-C1-0017-O1","text":"To avoid monitoring investment performance."},{"id":"PM-C1-0017-O2","text":"To eliminate all market risk."},{"id":"PM-C1-0017-O3","text":"To guarantee a positive return every year."},{"id":"PM-C1-0017-O4","text":"To manage the overall risk–return characteristics of their investments."}],"correctOptionId":"PM-C1-0017-O4","explanation":"Đa dạng hóa kiểm soát hồ sơ rủi ro–lợi nhuận tổng thể, không đảm bảo lãi và không loại được mọi rủi ro hệ thống.","source":"Câu gốc · bộ 120 câu"},{"id":"PM-C1-0018","chapter":1,"number":18,"question":"What is the primary purpose of an Investment Policy Statement (IPS)?","options":[{"id":"PM-C1-0018-O1","text":"Specify agreed objectives and constraints"},{"id":"PM-C1-0018-O2","text":"Guarantee portfolio profits"},{"id":"PM-C1-0018-O3","text":"Predict next week's prices"},{"id":"PM-C1-0018-O4","text":"Eliminate volatility"}],"correctOptionId":"PM-C1-0018-O1","explanation":"IPS là cơ sở chính sách quản lý đầu tư; không phải lời hứa lợi nhuận.","source":"Từ slide · IPS"},{"id":"PM-C1-0019","chapter":1,"number":19,"question":"Which is normally classified as a liquidity constraint?","options":[{"id":"PM-C1-0019-O1","text":"Need to pay tuition within six months"},{"id":"PM-C1-0019-O2","text":"Tolerance for volatility"},{"id":"PM-C1-0019-O3","text":"Long-run target return"},{"id":"PM-C1-0019-O4","text":"Benchmark selection"}],"correctOptionId":"PM-C1-0019-O1","explanation":"Nhu cầu chi tiền trong thời gian ngắn ràng buộc thanh khoản (liquidity needs).","source":"Từ slide · IPS"},{"id":"PM-C1-0020","chapter":1,"number":20,"question":"Which item is a real asset rather than a financial security?","options":[{"id":"PM-C1-0020-O1","text":"Corporate bond"},{"id":"PM-C1-0020-O2","text":"Common stock"},{"id":"PM-C1-0020-O3","text":"Directly owned apartment"},{"id":"PM-C1-0020-O4","text":"Mutual fund certificate"}],"correctOptionId":"PM-C1-0020-O3","explanation":"Căn hộ sở hữu trực tiếp là real asset; các lựa chọn kia là financial assets.","source":"Từ slide · Asset classes"},{"id":"PM-C1-0021","chapter":1,"number":21,"question":"Which security represents a creditor claim against the issuer?","options":[{"id":"PM-C1-0021-O1","text":"Ordinary share"},{"id":"PM-C1-0021-O2","text":"Corporate bond"},{"id":"PM-C1-0021-O3","text":"ETF unit"},{"id":"PM-C1-0021-O4","text":"Real estate deed"}],"correctOptionId":"PM-C1-0021-O2","explanation":"Bondholders là chủ nợ, không phải chủ sở hữu doanh nghiệp.","source":"Từ slide · Asset classes"},{"id":"PM-C1-0022","chapter":1,"number":22,"question":"Which position is best described as equity ownership?","options":[{"id":"PM-C1-0022-O1","text":"Treasury bill"},{"id":"PM-C1-0022-O2","text":"Bank certificate of deposit"},{"id":"PM-C1-0022-O3","text":"Common share"},{"id":"PM-C1-0022-O4","text":"Corporate bond"}],"correctOptionId":"PM-C1-0022-O3","explanation":"Cổ phiếu phổ thông là equity claim, trái phiếu là debt claim.","source":"Từ slide · Asset classes"},{"id":"PM-C1-0023","chapter":1,"number":23,"question":"An investor's goal changes after having a child. What should a responsible portfolio manager review first?","options":[{"id":"PM-C1-0023-O1","text":"Client IPS and constraints"},{"id":"PM-C1-0023-O2","text":"Tomorrow's stock prices"},{"id":"PM-C1-0023-O3","text":"Brokerage advertising"},{"id":"PM-C1-0023-O4","text":"Only last week's return"}],"correctOptionId":"PM-C1-0023-O1","explanation":"Khi hoàn cảnh thay đổi, cần rà soát IPS trước khi đổi danh mục.","source":"Từ slide · IPS"},{"id":"PM-C1-0024","chapter":1,"number":24,"question":"What is the defining feature of tactical asset allocation?","options":[{"id":"PM-C1-0024-O1","text":"Permanent policy weights"},{"id":"PM-C1-0024-O2","text":"Temporary deviations based on opportunities"},{"id":"PM-C1-0024-O3","text":"Never changing allocations"},{"id":"PM-C1-0024-O4","text":"Only investing in Treasury bonds"}],"correctOptionId":"PM-C1-0024-O2","explanation":"Tactical là điều chỉnh ngắn hạn so với strategic policy weights.","source":"Từ slide · Allocation"},{"id":"PM-C1-0025","chapter":1,"number":25,"question":"Strategic asset allocation primarily establishes:","options":[{"id":"PM-C1-0025-O1","text":"Daily trading signals"},{"id":"PM-C1-0025-O2","text":"Long-term target mix across asset classes"},{"id":"PM-C1-0025-O3","text":"Single winning stock"},{"id":"PM-C1-0025-O4","text":"Guaranteed returns"}],"correctOptionId":"PM-C1-0025-O2","explanation":"Strategic phân bổ chính sách dài hạn, phù hợp IPS.","source":"Từ slide · Allocation"},{"id":"PM-C1-0026","chapter":1,"number":26,"question":"Portfolio rebalancing most directly means:","options":[{"id":"PM-C1-0026-O1","text":"Bringing asset weights back toward targets"},{"id":"PM-C1-0026-O2","text":"Buying only the best-performing asset"},{"id":"PM-C1-0026-O3","text":"Guaranteeing a higher Sharpe ratio"},{"id":"PM-C1-0026-O4","text":"Closing the investment account"}],"correctOptionId":"PM-C1-0026-O1","explanation":"Rebalancing đưa trọng số hiện hành về gần mục tiêu, xét thêm chi phí và thuế.","source":"Từ slide · Allocation"},{"id":"PM-C1-0027","chapter":1,"number":27,"question":"Which strategy most directly aims to outperform its benchmark?","options":[{"id":"PM-C1-0027-O1","text":"Pure index replication"},{"id":"PM-C1-0027-O2","text":"Active portfolio management"},{"id":"PM-C1-0027-O3","text":"Fixed deposit holding"},{"id":"PM-C1-0027-O4","text":"Cash-only policy"}],"correctOptionId":"PM-C1-0027-O2","explanation":"Active thường cố gắng tạo lợi nhuận vượt benchmark, đổi lại chi phí/rủi ro lệch chỉ số.","source":"Từ slide · Strategy"},{"id":"PM-C1-0028","chapter":1,"number":28,"question":"Which risk is most closely linked to having concentrated exposure to one company?","options":[{"id":"PM-C1-0028-O1","text":"Only systematic market risk"},{"id":"PM-C1-0028-O2","text":"Idiosyncratic company risk"},{"id":"PM-C1-0028-O3","text":"Risk-free rate"},{"id":"PM-C1-0028-O4","text":"Pure inflation"}],"correctOptionId":"PM-C1-0028-O2","explanation":"Rủi ro riêng doanh nghiệp có thể giảm qua đa dạng hóa.","source":"Từ slide · Diversification"},{"id":"PM-C1-0029","chapter":1,"number":29,"question":"When should a manager normally evaluate performance against the IPS benchmark?","options":[{"id":"PM-C1-0029-O1","text":"Only before the first trade"},{"id":"PM-C1-0029-O2","text":"During ongoing monitoring and feedback"},{"id":"PM-C1-0029-O3","text":"Never, if returns are positive"},{"id":"PM-C1-0029-O4","text":"Only if there is a market crash"}],"correctOptionId":"PM-C1-0029-O2","explanation":"Giai đoạn feedback đo hiệu quả so với mục tiêu đã thỏa thuận.","source":"Từ slide · Feedback"},{"id":"PM-C1-0030","chapter":1,"number":30,"question":"A manager selects individual stocks only after defining client constraints. This sequencing reflects:","options":[{"id":"PM-C1-0030-O1","text":"An investment process"},{"id":"PM-C1-0030-O2","text":"Guaranteed market timing"},{"id":"PM-C1-0030-O3","text":"Illegal diversification"},{"id":"PM-C1-0030-O4","text":"Random guessing"}],"correctOptionId":"PM-C1-0030-O1","explanation":"Investment process bắt đầu với nhu cầu khách hàng rồi mới triển khai.","source":"Từ slide · Process"},{"id":"PM-C1-0031","chapter":1,"number":31,"question":"A retiree mainly funding near-term living costs is likely to value:","options":[{"id":"PM-C1-0031-O1","text":"Liquidity and capital preservation"},{"id":"PM-C1-0031-O2","text":"Maximum leverage by default"},{"id":"PM-C1-0031-O3","text":"No emergency reserve"},{"id":"PM-C1-0031-O4","text":"Highest possible volatility"}],"correctOptionId":"PM-C1-0031-O1","explanation":"Giai đoạn spending thường nhấn mạnh khả năng chi tiêu, thanh khoản và mức chịu lỗ.","source":"Từ slide · Life cycle"},{"id":"PM-C1-0032","chapter":1,"number":32,"question":"Which investment fund can commonly be bought and sold on an exchange intraday?","options":[{"id":"PM-C1-0032-O1","text":"ETF"},{"id":"PM-C1-0032-O2","text":"Direct rental apartment"},{"id":"PM-C1-0032-O3","text":"Physical gold bar"},{"id":"PM-C1-0032-O4","text":"Personal savings deposit"}],"correctOptionId":"PM-C1-0032-O1","explanation":"Exchange-Traded Fund là quỹ giao dịch trên sàn, nhưng thanh khoản tùy ETF.","source":"Từ slide · Funds"},{"id":"PM-C1-0033","chapter":1,"number":33,"question":"The investor's ability to bear losses is best described as:","options":[{"id":"PM-C1-0033-O1","text":"Risk capacity"},{"id":"PM-C1-0033-O2","text":"Random loss prediction"},{"id":"PM-C1-0033-O3","text":"Tracking index"},{"id":"PM-C1-0033-O4","text":"Historical return"}],"correctOptionId":"PM-C1-0033-O1","explanation":"Risk capacity khác risk willingness (sự sẵn lòng chịu rủi ro).","source":"Từ slide · Risk tolerance"},{"id":"PM-C1-0034","chapter":1,"number":34,"question":"Which statement about risk tolerance is most accurate?","options":[{"id":"PM-C1-0034-O1","text":"It never changes"},{"id":"PM-C1-0034-O2","text":"It depends on both capacity and willingness"},{"id":"PM-C1-0034-O3","text":"It equals expected return"},{"id":"PM-C1-0034-O4","text":"It can be ignored by the manager"}],"correctOptionId":"PM-C1-0034-O2","explanation":"Risk tolerance nên đánh giá cả năng lực và thái độ chịu rủi ro.","source":"Từ slide · Risk tolerance"},{"id":"PM-C1-0035","chapter":1,"number":35,"question":"Which of the following is a typical tax-related IPS constraint?","options":[{"id":"PM-C1-0035-O1","text":"Capital gains tax consequences of frequent trading"},{"id":"PM-C1-0035-O2","text":"Number of equity issuers in an index"},{"id":"PM-C1-0035-O3","text":"Share price notation"},{"id":"PM-C1-0035-O4","text":"Annualized volatility formula"}],"correctOptionId":"PM-C1-0035-O1","explanation":"Giao dịch có thể gây chi phí thuế, làm ảnh hưởng quyết định danh mục.","source":"Từ slide · IPS"},{"id":"PM-C1-0036","chapter":1,"number":36,"question":"What does top-down security analysis begin with?","options":[{"id":"PM-C1-0036-O1","text":"A single company's earnings call"},{"id":"PM-C1-0036-O2","text":"Macroeconomic conditions"},{"id":"PM-C1-0036-O3","text":"A random ticker"},{"id":"PM-C1-0036-O4","text":"Dividend record only"}],"correctOptionId":"PM-C1-0036-O2","explanation":"Top-down bắt đầu từ vĩ mô rồi xuống ngành và doanh nghiệp.","source":"Từ slide · Strategy"},{"id":"PM-C1-0037","chapter":1,"number":37,"question":"A portfolio’s market value drifted away from policy weights. Which activity addresses that drift?","options":[{"id":"PM-C1-0037-O1","text":"Rebalancing"},{"id":"PM-C1-0037-O2","text":"Initial IPS signing only"},{"id":"PM-C1-0037-O3","text":"Random stock selection"},{"id":"PM-C1-0037-O4","text":"Ending benchmark evaluation"}],"correctOptionId":"PM-C1-0037-O1","explanation":"Cân bằng lại là bước kiểm soát lệch tỷ trọng.","source":"Từ slide · Feedback"},{"id":"PM-C2-0001","chapter":2,"number":1,"question":"What does holding-period return include for a dividend-paying stock?","options":[{"id":"PM-C2-0001-O1","text":"Price change and cash distributions"},{"id":"PM-C2-0001-O2","text":"Only ending price"},{"id":"PM-C2-0001-O3","text":"Only expected dividend"},{"id":"PM-C2-0001-O4","text":"Only volatility"}],"correctOptionId":"PM-C2-0001-O1","explanation":"HPR=(P1-P0+D)/P0, gồm cổ tức (nếu có).","source":"Từ slide · HPR"},{"id":"PM-C2-0002","chapter":2,"number":2,"question":"Which mean captures compound multi-period growth?","options":[{"id":"PM-C2-0002-O1","text":"Arithmetic mean"},{"id":"PM-C2-0002-O2","text":"Geometric mean"},{"id":"PM-C2-0002-O3","text":"Median only"},{"id":"PM-C2-0002-O4","text":"Covariance"}],"correctOptionId":"PM-C2-0002-O2","explanation":"Geometric mean là mức tăng trưởng lũy kế bình quân theo kỳ.","source":"Từ slide · Return"},{"id":"PM-C2-0003","chapter":2,"number":3,"question":"For volatile multi-period returns, the geometric mean is generally:","options":[{"id":"PM-C2-0003-O1","text":"Greater than the arithmetic mean"},{"id":"PM-C2-0003-O2","text":"At most the arithmetic mean"},{"id":"PM-C2-0003-O3","text":"Always identical to volatility"},{"id":"PM-C2-0003-O4","text":"Unrelated to compounding"}],"correctOptionId":"PM-C2-0003-O2","explanation":"G ≤ A với các hệ số tăng trưởng dương, đẳng thức nếu lợi suất bằng nhau.","source":"Từ slide · Return"},{"id":"PM-C2-0004","chapter":2,"number":4,"question":"What is the standard deviation of return?","options":[{"id":"PM-C2-0004-O1","text":"Square root of variance"},{"id":"PM-C2-0004-O2","text":"Square of covariance"},{"id":"PM-C2-0004-O3","text":"Sum of probabilities"},{"id":"PM-C2-0004-O4","text":"Mean return divided by risk-free rate"}],"correctOptionId":"PM-C2-0004-O1","explanation":"σ=√Var(R).","source":"Từ slide · Risk"},{"id":"PM-C2-0005","chapter":2,"number":5,"question":"What does a covariance greater than zero generally indicate?","options":[{"id":"PM-C2-0005-O1","text":"Returns tend to move together"},{"id":"PM-C2-0005-O2","text":"Returns move exactly opposite"},{"id":"PM-C2-0005-O3","text":"Both assets are risk-free"},{"id":"PM-C2-0005-O4","text":"No relationship can exist"}],"correctOptionId":"PM-C2-0005-O1","explanation":"Cov>0 nghĩa là cùng biến động theo chiều dương tuyến tính, không nhất thiết tương quan hoàn hảo.","source":"Từ slide · Covariance"},{"id":"PM-C2-0006","chapter":2,"number":6,"question":"Which correlation coefficient indicates perfect negative linear dependence?","options":[{"id":"PM-C2-0006-O1","text":"+1"},{"id":"PM-C2-0006-O2","text":"+0.5"},{"id":"PM-C2-0006-O3","text":"0"},{"id":"PM-C2-0006-O4","text":"−1"}],"correctOptionId":"PM-C2-0006-O4","explanation":"ρ=−1 là tương quan âm hoàn hảo.","source":"Từ slide · Correlation"},{"id":"PM-C2-0007","chapter":2,"number":7,"question":"In mean-variance theory, an efficient portfolio offers:","options":[{"id":"PM-C2-0007-O1","text":"Highest risk for its return"},{"id":"PM-C2-0007-O2","text":"Maximum expected return for its risk"},{"id":"PM-C2-0007-O3","text":"The lowest possible dividend"},{"id":"PM-C2-0007-O4","text":"Zero volatility always"}],"correctOptionId":"PM-C2-0007-O2","explanation":"Efficient frontier: suất sinh lợi cao nhất với mức rủi ro cho trước, hoặc rủi ro thấp nhất với mức sinh lợi.","source":"Từ slide · Efficient frontier"},{"id":"PM-C2-0008","chapter":2,"number":8,"question":"What is the Global Minimum Variance (GMV) portfolio?","options":[{"id":"PM-C2-0008-O1","text":"Portfolio with lowest feasible variance"},{"id":"PM-C2-0008-O2","text":"Portfolio with guaranteed return"},{"id":"PM-C2-0008-O3","text":"Portfolio with maximum beta"},{"id":"PM-C2-0008-O4","text":"Highest-priced security"}],"correctOptionId":"PM-C2-0008-O1","explanation":"GMV giảm phương sai nhỏ nhất trong tập các danh mục khả thi.","source":"Từ slide · Efficient frontier"},{"id":"PM-C2-0009","chapter":2,"number":9,"question":"Diversification is most effective when asset returns:","options":[{"id":"PM-C2-0009-O1","text":"Are perfectly positively correlated"},{"id":"PM-C2-0009-O2","text":"Are less than perfectly positively correlated"},{"id":"PM-C2-0009-O3","text":"Have equal market prices"},{"id":"PM-C2-0009-O4","text":"Are all identical"}],"correctOptionId":"PM-C2-0009-O2","explanation":"Tương quan dưới +1 cho khả năng đa dạng hóa, mức hiệu quả phụ thuộc σ và tỷ trọng.","source":"Từ slide · Diversification"},{"id":"PM-C2-0010","chapter":2,"number":10,"question":"Which type of risk is not eliminated simply by holding many unrelated stocks?","options":[{"id":"PM-C2-0010-O1","text":"Firm-specific risk"},{"id":"PM-C2-0010-O2","text":"Market systematic risk"},{"id":"PM-C2-0010-O3","text":"Pure accounting noise"},{"id":"PM-C2-0010-O4","text":"Unique production failure"}],"correctOptionId":"PM-C2-0010-O2","explanation":"Rủi ro hệ thống gắn với biến động thị trường, không loại hết nhờ đa dạng hóa.","source":"Từ slide · Risk"},{"id":"PM-C2-0011","chapter":2,"number":11,"question":"For equal expected returns, a risk-averse investor generally selects:","options":[{"id":"PM-C2-0011-O1","text":"The lower-variance portfolio"},{"id":"PM-C2-0011-O2","text":"The higher-variance portfolio"},{"id":"PM-C2-0011-O3","text":"The higher-priced share"},{"id":"PM-C2-0011-O4","text":"The lower turnover security irrespective of risk"}],"correctOptionId":"PM-C2-0011-O1","explanation":"Mean-variance dominance: cùng E(R), chọn σ thấp hơn.","source":"Từ slide · Dominance"},{"id":"PM-C2-0012","chapter":2,"number":12,"question":"The optimal risky portfolio for an individual depends on:","options":[{"id":"PM-C2-0012-O1","text":"Risk aversion and investment opportunity set"},{"id":"PM-C2-0012-O2","text":"Only its ticker symbol"},{"id":"PM-C2-0012-O3","text":"Only market capitalization"},{"id":"PM-C2-0012-O4","text":"The most recent trading price"}],"correctOptionId":"PM-C2-0012-O1","explanation":"Tối ưu phụ thuộc sở thích rủi ro và tập cơ hội/đường bàng quan.","source":"Từ slide · Utility"},{"id":"PM-C2-0013","chapter":2,"number":13,"question":"Which point sits at the leftmost part of the feasible minimum-variance boundary?","options":[{"id":"PM-C2-0013-O1","text":"GMV portfolio"},{"id":"PM-C2-0013-O2","text":"Maximum beta asset"},{"id":"PM-C2-0013-O3","text":"Risk-free asset by definition"},{"id":"PM-C2-0013-O4","text":"An arbitrary stock"}],"correctOptionId":"PM-C2-0013-O1","explanation":"GMV có σ nhỏ nhất trong miền khả thi các danh mục rủi ro.","source":"Từ slide · GMV"},{"id":"PM-C2-0014","chapter":2,"number":14,"question":"What does a negative correlation imply for portfolio diversification?","options":[{"id":"PM-C2-0014-O1","text":"Potential risk-reduction benefit"},{"id":"PM-C2-0014-O2","text":"Guaranteed positive gains"},{"id":"PM-C2-0014-O3","text":"Elimination of all financial risk"},{"id":"PM-C2-0014-O4","text":"All weights must be negative"}],"correctOptionId":"PM-C2-0014-O1","explanation":"Tương quan âm có thể giảm σp khi phối hợp tài sản, không đảm bảo lãi.","source":"Từ slide · Correlation"},{"id":"PM-C2-0015","chapter":2,"number":15,"question":"If portfolio weights must sum to one, what is the second weight when the first is 0.65?","options":[{"id":"PM-C2-0015-O1","text":"0.35"},{"id":"PM-C2-0015-O2","text":"0.65"},{"id":"PM-C2-0015-O3","text":"1.65"},{"id":"PM-C2-0015-O4","text":"−0.65"}],"correctOptionId":"PM-C2-0015-O1","explanation":"w1+w2=1; w2=0.35.","source":"Từ slide · Weights"},{"id":"PM-C2-0016","chapter":2,"number":16,"question":"Which statistic measures risk relative to expected return?","options":[{"id":"PM-C2-0016-O1","text":"Coefficient of variation"},{"id":"PM-C2-0016-O2","text":"Covariance only"},{"id":"PM-C2-0016-O3","text":"Arithmetic sum"},{"id":"PM-C2-0016-O4","text":"Price-to-earnings ratio"}],"correctOptionId":"PM-C2-0016-O1","explanation":"CV=σ/E(R) khi E(R)>0; cân nhắc hạn chế khi E(R) nhỏ hoặc âm.","source":"Từ slide · CV"},{"id":"PM-C2-0017","chapter":2,"number":17,"question":"Why are correlations important in Markowitz optimization?","options":[{"id":"PM-C2-0017-O1","text":"Portfolio variance includes cross-covariance terms"},{"id":"PM-C2-0017-O2","text":"They determine cash dividends exactly"},{"id":"PM-C2-0017-O3","text":"They eliminate investment constraints"},{"id":"PM-C2-0017-O4","text":"They predict risk-free rates"}],"correctOptionId":"PM-C2-0017-O1","explanation":"Phương sai danh mục có 2wiwjCovij nên phụ thuộc tương tác giữa tài sản.","source":"Từ slide · Markowitz"},{"id":"PM-C3-0001","chapter":3,"number":1,"question":"The Capital Market Line (CML) relates expected return to:","options":[{"id":"PM-C3-0001-O1","text":"Total risk measured by standard deviation"},{"id":"PM-C3-0001-O2","text":"Beta of every stock"},{"id":"PM-C3-0001-O3","text":"Price-to-earnings ratio"},{"id":"PM-C3-0001-O4","text":"Idiosyncratic volatility only"}],"correctOptionId":"PM-C3-0001-O1","explanation":"CML dùng σ và áp dụng cho danh mục hiệu quả là phối hợp tài sản phi rủi ro với danh mục thị trường.","source":"Từ slide · CML"},{"id":"PM-C3-0002","chapter":3,"number":2,"question":"The Security Market Line (SML) uses which horizontal-axis risk measure?","options":[{"id":"PM-C3-0002-O1","text":"Standard deviation"},{"id":"PM-C3-0002-O2","text":"Correlation only"},{"id":"PM-C3-0002-O3","text":"Beta"},{"id":"PM-C3-0002-O4","text":"Nominal price"}],"correctOptionId":"PM-C3-0002-O3","explanation":"SML dùng β để định giá rủi ro hệ thống của cả chứng khoán riêng lẻ.","source":"Từ slide · SML"},{"id":"PM-C3-0003","chapter":3,"number":3,"question":"Which formula represents CAPM required return?","options":[{"id":"PM-C3-0003-O1","text":"Rf + βi(E(Rm)−Rf)"},{"id":"PM-C3-0003-O2","text":"Rf + σi"},{"id":"PM-C3-0003-O3","text":"σi² + dividends"},{"id":"PM-C3-0003-O4","text":"βi × market capitalization"}],"correctOptionId":"PM-C3-0003-O1","explanation":"CAPM: E(Ri)=Rf+βi×MRP.","source":"Từ slide · CAPM"},{"id":"PM-C3-0004","chapter":3,"number":4,"question":"What is beta of the market portfolio with respect to itself?","options":[{"id":"PM-C3-0004-O1","text":"0"},{"id":"PM-C3-0004-O2","text":"−1"},{"id":"PM-C3-0004-O3","text":"1"},{"id":"PM-C3-0004-O4","text":"Cannot be calculated"}],"correctOptionId":"PM-C3-0004-O3","explanation":"βM=Cov(RM,RM)/Var(RM)=1.","source":"Từ slide · Beta"},{"id":"PM-C3-0005","chapter":3,"number":5,"question":"An estimated return above the CAPM-required return implies:","options":[{"id":"PM-C3-0005-O1","text":"Positive alpha"},{"id":"PM-C3-0005-O2","text":"Negative alpha"},{"id":"PM-C3-0005-O3","text":"Beta equal to zero"},{"id":"PM-C3-0005-O4","text":"Zero total risk"}],"correctOptionId":"PM-C3-0005-O1","explanation":"Alpha dương theo giả định dự báo, tài sản nằm trên SML.","source":"Từ slide · Alpha"},{"id":"PM-C3-0006","chapter":3,"number":6,"question":"What is a stock with beta equal to zero expected to earn under standard CAPM?","options":[{"id":"PM-C3-0006-O1","text":"Risk-free rate"},{"id":"PM-C3-0006-O2","text":"Zero in every case"},{"id":"PM-C3-0006-O3","text":"Twice market return"},{"id":"PM-C3-0006-O4","text":"Market return"}],"correctOptionId":"PM-C3-0006-O1","explanation":"β=0 thì phần bù rủi ro CAPM bằng 0, nhưng không có nghĩa σ=0.","source":"Từ slide · CAPM"},{"id":"PM-C3-0007","chapter":3,"number":7,"question":"Which factor measures company size in the Fama–French three-factor model?","options":[{"id":"PM-C3-0007-O1","text":"SMB"},{"id":"PM-C3-0007-O2","text":"HML"},{"id":"PM-C3-0007-O3","text":"RMW"},{"id":"PM-C3-0007-O4","text":"CMA"}],"correctOptionId":"PM-C3-0007-O1","explanation":"SMB = Small Minus Big, phần bù nhân tố quy mô.","source":"Từ slide · Fama-French"},{"id":"PM-C3-0008","chapter":3,"number":8,"question":"Which factor represents value versus growth in Fama–French 3-factor?","options":[{"id":"PM-C3-0008-O1","text":"RMW"},{"id":"PM-C3-0008-O2","text":"HML"},{"id":"PM-C3-0008-O3","text":"CMA"},{"id":"PM-C3-0008-O4","text":"Risk-free rate"}],"correctOptionId":"PM-C3-0008-O2","explanation":"HML = High Minus Low, nhân tố giá trị theo book-to-market.","source":"Từ slide · Fama-French"},{"id":"PM-C3-0009","chapter":3,"number":9,"question":"Which added factors appear in Fama–French five-factor versus three-factor?","options":[{"id":"PM-C3-0009-O1","text":"RMW and CMA"},{"id":"PM-C3-0009-O2","text":"CAPM and CML"},{"id":"PM-C3-0009-O3","text":"ROE and market price"},{"id":"PM-C3-0009-O4","text":"Beta and cash"}],"correctOptionId":"PM-C3-0009-O1","explanation":"RMW là profitability; CMA là investment factor.","source":"Từ slide · Fama-French"},{"id":"PM-C3-0010","chapter":3,"number":10,"question":"Which principle is central to Arbitrage Pricing Theory (APT)?","options":[{"id":"PM-C3-0010-O1","text":"No-arbitrage pricing using systematic factors"},{"id":"PM-C3-0010-O2","text":"A single stock must have zero volatility"},{"id":"PM-C3-0010-O3","text":"Market timing always works"},{"id":"PM-C3-0010-O4","text":"Only one risk factor can exist"}],"correctOptionId":"PM-C3-0010-O1","explanation":"APT dựa trên điều kiện không tồn tại kinh doanh chênh lệch giá và nhiều nhân tố rủi ro hệ thống.","source":"Từ slide · APT"},{"id":"PM-C3-0011","chapter":3,"number":11,"question":"What does the Single Index Model express?","options":[{"id":"PM-C3-0011-O1","text":"Stock return as alpha + beta × market return + residual"},{"id":"PM-C3-0011-O2","text":"Risk-free rate only"},{"id":"PM-C3-0011-O3","text":"Return independent of market"},{"id":"PM-C3-0011-O4","text":"Only industry price levels"}],"correctOptionId":"PM-C3-0011-O1","explanation":"SIM: Ri=αi+βiRm+εi (cách viết theo mô hình).","source":"Từ slide · Single Index"},{"id":"PM-C3-0012","chapter":3,"number":12,"question":"A stock whose expected return is below SML is considered, under CAPM assumptions:","options":[{"id":"PM-C3-0012-O1","text":"Undervalued"},{"id":"PM-C3-0012-O2","text":"Overvalued"},{"id":"PM-C3-0012-O3","text":"Risk-free"},{"id":"PM-C3-0012-O4","text":"Definitely bankrupt"}],"correctOptionId":"PM-C3-0012-O2","explanation":"Nếu lợi suất kỳ vọng thấp hơn lợi suất yêu cầu CAPM, stock ở dưới SML: overvalued theo mô hình.","source":"Từ slide · SML"},{"id":"PM-C3-0013","chapter":3,"number":13,"question":"Which statement about CML is correct?","options":[{"id":"PM-C3-0013-O1","text":"It applies to all individual stocks"},{"id":"PM-C3-0013-O2","text":"It applies to efficient portfolios combining market and risk-free assets"},{"id":"PM-C3-0013-O3","text":"It uses beta on x-axis"},{"id":"PM-C3-0013-O4","text":"It guarantees realized return"}],"correctOptionId":"PM-C3-0013-O2","explanation":"CML là đường tập hợp danh mục hiệu quả với tài sản phi rủi ro và thị trường.","source":"Từ slide · CML"},{"id":"PM-C3-0014","chapter":3,"number":14,"question":"Which statement about SML is correct?","options":[{"id":"PM-C3-0014-O1","text":"It evaluates only efficient funds"},{"id":"PM-C3-0014-O2","text":"It plots expected return against beta for individual securities or portfolios"},{"id":"PM-C3-0014-O3","text":"It requires σ on x-axis"},{"id":"PM-C3-0014-O4","text":"It is an accounting identity"}],"correctOptionId":"PM-C3-0014-O2","explanation":"SML áp dụng cho chứng khoán riêng lẻ và danh mục bất kể hiệu quả hay không, theo kỳ vọng cân bằng CAPM.","source":"Từ slide · SML"},{"id":"PM-C3-0015","chapter":3,"number":15,"question":"How is a portfolio's beta computed?","options":[{"id":"PM-C3-0015-O1","text":"Weighted sum of component betas"},{"id":"PM-C3-0015-O2","text":"Product of all betas"},{"id":"PM-C3-0015-O3","text":"Highest component beta only"},{"id":"PM-C3-0015-O4","text":"Mean correlation coefficient"}],"correctOptionId":"PM-C3-0015-O1","explanation":"βp=Σwiβi theo tính tuyến tính của covariance.","source":"Từ slide · Beta"},{"id":"PM-C3-0016","chapter":3,"number":16,"question":"If beta is negative and the market risk premium is positive, CAPM required return is:","options":[{"id":"PM-C3-0016-O1","text":"Below the risk-free rate"},{"id":"PM-C3-0016-O2","text":"Always above the market return"},{"id":"PM-C3-0016-O3","text":"Exactly market return"},{"id":"PM-C3-0016-O4","text":"Undefined"}],"correctOptionId":"PM-C3-0016-O1","explanation":"E(Ri)=Rf+βi×MRP nên β âm cho expected CAPM dưới Rf.","source":"Từ slide · CAPM"},{"id":"PM-C3-0017","chapter":3,"number":17,"question":"What is the market risk premium?","options":[{"id":"PM-C3-0017-O1","text":"E(Rm)−Rf"},{"id":"PM-C3-0017-O2","text":"Rf−E(Rm)"},{"id":"PM-C3-0017-O3","text":"β/σ"},{"id":"PM-C3-0017-O4","text":"σ−Rf"}],"correctOptionId":"PM-C3-0017-O1","explanation":"MRP là chênh lệch lợi suất kỳ vọng thị trường với suất phi rủi ro.","source":"Từ slide · CAPM"},{"id":"PM-C3-0018","chapter":3,"number":18,"question":"Which item is NOT itself a Fama–French five-factor portfolio premium?","options":[{"id":"PM-C3-0018-O1","text":"Market excess return"},{"id":"PM-C3-0018-O2","text":"SMB"},{"id":"PM-C3-0018-O3","text":"HML"},{"id":"PM-C3-0018-O4","text":"The stock's nominal market price"}],"correctOptionId":"PM-C3-0018-O4","explanation":"Mô hình dùng market, SMB, HML, RMW, CMA; giá danh nghĩa không phải factor premium.","source":"Từ slide · Fama-French"},{"id":"PM-C3-0019","chapter":3,"number":19,"question":"APT and Fama–French are similar in that both:","options":[{"id":"PM-C3-0019-O1","text":"Can include multiple systematic factors"},{"id":"PM-C3-0019-O2","text":"Require zero firm-specific risk in each stock"},{"id":"PM-C3-0019-O3","text":"Always have identical factors"},{"id":"PM-C3-0019-O4","text":"Use only total standard deviation"}],"correctOptionId":"PM-C3-0019-O1","explanation":"Cả hai có thể sử dụng đa nhân tố, nhưng cơ sở lý thuyết và nhân tố khác nhau.","source":"Từ slide · Models"},{"id":"PM-C1-0038","chapter":1,"number":38,"question":"An investor owns 10% of a pooled fund. The fund realizes a distributable gain of $10,000. What is the investor's proportional share?","options":[{"id":"PM-C1-0038-O1","text":"500 USD"},{"id":"PM-C1-0038-O2","text":"1000 USD"},{"id":"PM-C1-0038-O3","text":"1250 USD"},{"id":"PM-C1-0038-O4","text what is modeled realized return?","options":[{"id":"PM-C3-0103-O1","text":"14,9%"},{"id":"PM-C3-0103-O2","text":"9,24%"},{"id":"PM-C3-0103-O3","text":"19,37%"},{"id":"PM-C3-0103-O4","text":"25,33%"}],"correctOptionId":"PM-C3-0103-O1","explanation":"Single Index: Ri=2+1,1×9+3=14,9%.","source":"Bài tính biến thể · Single Index"},{"id":"PM-C3-0104","chapter":3,"number":104,"question":"A portfolio puts 25% in a stock with beta 0,7 and the rest in a stock with beta 1,3. Calculate portfolio beta.","options":[{"id":"PM-C3-0104-O1","text":"0,69"},{"id":"PM-C3-0104-O2","text":"1,44"},{"id":"PM-C3-0104-O3","text":"1,84"},{"id":"PM-C3-0104-O4","text":"1,15"}],"correctOptionId":"PM-C3-0104-O4","explanation":"βp=w1β1+w2β2=1,15.","source":"Bài tính biến thể · Portfolio beta"},{"id":"PM-C3-0105","chapter":3,"number":105,"question":"A portfolio puts 35% in a stock with beta 0,9 and the rest in a stock with beta 1,45. Calculate portfolio beta.","options":[{"id":"PM-C3-0105-O1","text":"0,75"},{"id":"PM-C3-0105-O2","text":"1,57"},{"id":"PM-C3-0105-O3","text":"1,26"},{"id":"PM-C3-0105-O4","text":"2,01"}],"correctOptionId":"PM-C3-0105-O3","explanation":"βp=w1β1+w2β2=1,26.","source":"Bài tính biến thể · Portfolio beta"},{"id":"PM-C3-0106","chapter":3,"number":106,"question":"A portfolio puts 45% in a stock with beta 1,1 and the rest in a stock with beta 1,6. Calculate portfolio beta.","options":[{"id":"PM-C3-0106-O1","text":"0,83"},{"id":"PM-C3-0106-O2","text":"1,38"},{"id":"PM-C3-0106-O3","text":"1,72"},{"id":"PM-C3-0106-O4","text":"2,2"}],"correctOptionId":"PM-C3-0106-O2","explanation":"βp=w1β1+w2β2=1,38.","source":"Bài tính biến thể · Portfolio beta"},{"id":"PM-C3-0107","chapter":3,"number":107,"question":"A portfolio puts 55% in a stock with beta 1,3 and the rest in a stock with beta 1,75. Calculate portfolio beta.","options":[{"id":"PM-C3-0107-O1","text":"1,5"},{"id":"PM-C3-0107-O2","text":"0,9"},{"id":"PM-C3-0107-O3","text":"1,88"},{"id":"PM-C3-0107-O4","text":"2,4"}],"correctOptionId":"PM-C3-0107-O1","explanation":"βp=w1β1+w2β2=1,5.","source":"Bài tính biến thể · Portfolio beta"},{"id":"PM-C3-0108","chapter":3,"number":108,"question":"A portfolio puts 65% in a stock with beta 1,5 and the rest in a stock with beta 1,3. Calculate portfolio beta.","options":[{"id":"PM-C3-0108-O1","text":"0,86"},{"id":"PM-C3-0108-O2","text":"1,79"},{"id":"PM-C3-0108-O3","text":"2,29"},{"id":"PM-C3-0108-O4","text":"1,43"}],"correctOptionId":"PM-C3-0108-O4","explanation":"βp=w1β1+w2β2=1,43.","source":"Bài tính biến thể · Portfolio beta"},{"id":"PM-C3-0109","chapter":3,"number":109,"question":"A portfolio puts 75% in a stock with beta 0,7 and the rest in a stock with beta 1,45. Calculate portfolio beta.","options":[{"id":"PM-C3-0109-O1","text":"0,53"},{"id":"PM-C3-0109-O2","text":"1,11"},{"id":"PM-C3-0109-O3","text":"0,89"},{"id":"PM-C3-0109-O4","text":"1,42"}],"correctOptionId":"PM-C3-0109-O3","explanation":"βp=w1β1+w2β2=0,89.","source":"Bài tính biến thể · Portfolio beta"},{"id":"PM-C3-0110","chapter":3,"number":110,"question":"A portfolio puts 25% in a stock with beta 0,9 and the rest in a stock with beta 1,6. Calculate portfolio beta.","options":[{"id":"PM-C3-0110-O1","text":"0,86"},{"id":"PM-C3-0110-O2","text":"1,43"},{"id":"PM-C3-0110-O3","text":"1,78"},{"id":"PM-C3-0110-O4","text":"2,28"}],"correctOptionId":"PM-C3-0110-O2","explanation":"βp=w1β1+w2β2=1,43.","source":"Bài tính biến thể · Portfolio beta"},{"id":"PM-C3-0111","chapter":3,"number":111,"question":"A portfolio puts 35% in a stock with beta 1,1 and the rest in a stock with beta 1,75. Calculate portfolio beta.","options":[{"id":"PM-C3-0111-O1","text":"1,52"},{"id":"PM-C3-0111-O2","text":"0,91"},{"id":"PM-C3-0111-O3","text":"1,9"},{"id":"PM-C3-0111-O4","text":"2,44"}],"correctOptionId":"PM-C3-0111-O1","explanation":"βp=w1β1+w2β2=1,52.","source":"Bài tính biến thể · Portfolio beta"},{"id":"PM-C3-0112","chapter":3,"number":112,"question":"A portfolio puts 45% in a stock with beta 1,3 and the rest in a stock with beta 1,3. Calculate portfolio beta.","options":[{"id":"PM-C3-0112-O1","text":"0,78"},{"id":"PM-C3-0112-O2","text":"1,63"},{"id":"PM-C3-0112-O3","text":"2,08"},{"id":"PM-C3-0112-O4","text":"1,3"}],"correctOptionId":"PM-C3-0112-O4","explanation":"βp=w1β1+w2β2=1,3.","source":"Bài tính biến thể · Portfolio beta"},{"id":"PM-C3-0113","chapter":3,"number":113,"question":"A portfolio puts 55% in a stock with beta 1,5 and the rest in a stock with beta 1,45. Calculate portfolio beta.","options":[{"id":"PM-C3-0113-O1","text":"0,89"},{"id":"PM-C3-0113-O2","text":"1,85"},{"id":"PM-C3-0113-O3","text":"1,48"},{"id":"PM-C3-0113-O4","text":"2,36"}],"correctOptionId":"PM-C3-0113-O3","explanation":"βp=w1β1+w2β2=1,48.","source":"Bài tính biến thể · Portfolio beta"},{"id":"PM-C3-0114","chapter":3,"number":114,"question":"A portfolio puts 65% in a stock with beta 0,7 and the rest in a stock with beta 1,6. Calculate portfolio beta.","options":[{"id":"PM-C3-0114-O1","text":"0,61"},{"id":"PM-C3-0114-O2","text":"1,01"},{"id":"PM-C3-0114-O3","text":"1,27"},{"id":"PM-C3-0114-O4","text":"1,62"}],"correctOptionId":"PM-C3-0114-O2","explanation":"βp=w1β1+w2β2=1,01.","source":"Bài tính biến thể · Portfolio beta"},{"id":"PM-C1-0066","chapter":1,"number":66,"topic":"Portfolio & Asset Classes","level":"Basic","question":"An investment case describes the following: A client owns bonds, equities and investment property in one coordinated holding. Which concept BEST fits?","options":[{"id":"PM-C1-0066-O1","text":"Investment portfolio"},{"id":"PM-C1-0066-O2","text":"Common equity"},{"id":"PM-C1-0066-O3","text":"Asset class"},{"id":"PM-C1-0066-O4","text":"Commodity exposure"}],"correctOptionId":"PM-C1-0066-O1","explanation":"Investment portfolio: A portfolio brings together different investment assets under a common strategy. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio & Asset Classes.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0067","chapter":1,"number":67,"topic":"Portfolio & Asset Classes","level":"Basic","question":"An investment case describes the following: An investor acquires a corporate note that gives contractual rights to future payments. Which concept BEST fits?","options":[{"id":"PM-C1-0067-O1","text":"Diversification"},{"id":"PM-C1-0067-O2","text":"Financial asset"},{"id":"PM-C1-0067-O3","text":"Debt security"},{"id":"PM-C1-0067-O4","text":"Direct property holding"}],"correctOptionId":"PM-C1-0067-O2","explanation":"Financial asset: A financial asset is a claim or financial contract rather than direct ownership of a physical resource. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio & Asset Classes.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0068","chapter":1,"number":68,"topic":"Portfolio & Asset Classes","level":"Basic","question":"An investment case describes the following: An individual directly purchases an apartment and receives rental income. Which concept BEST fits?","options":[{"id":"PM-C1-0068-O1","text":"Commodity exposure"},{"id":"PM-C1-0068-O2","text":"Concentrated position"},{"id":"PM-C1-0068-O3","text":"Real asset"},{"id":"PM-C1-0068-O4","text":"Asset class"}],"correctOptionId":"PM-C1-0068-O3","explanation":"Real asset: Real assets have intrinsic physical or productive form, unlike claims issued by others. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio & Asset Classes.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0069","chapter":1,"number":69,"topic":"Portfolio & Asset Classes","level":"Basic","question":"An investment case describes the following: A shareholder votes in a company's annual general meeting and participates in residual profit. Which concept BEST fits?","options":[{"id":"PM-C1-0069-O1","text":"Direct property holding"},{"id":"PM-C1-0069-O2","text":"Diversification"},{"id":"PM-C1-0069-O3","text":"Investment portfolio"},{"id":"PM-C1-0069-O4","text":"Common equity"}],"correctOptionId":"PM-C1-0069-O4","explanation":"Common equity: Common shares represent ownership and residual corporate claims. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio & Asset Classes.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0070","chapter":1,"number":70,"topic":"Portfolio & Asset Classes","level":"Basic","question":"An investment case describes the following: A company issues a five-year bond promising interest and principal repayment. Which concept BEST fits?","options":[{"id":"PM-C1-0070-O1","text":"Debt security"},{"id":"PM-C1-0070-O2","text":"Commodity exposure"},{"id":"PM-C1-0070-O3","text":"Concentrated position"},{"id":"PM-C1-0070-O4","text":"Financial asset"}],"correctOptionId":"PM-C1-0070-O1","explanation":"Debt security: Bonds are creditor claims with contractual payment terms. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio & Asset Classes.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0071","chapter":1,"number":71,"topic":"Portfolio & Asset Classes","level":"Basic","question":"An investment case describes the following: An allocator groups domestic equities and investment-grade bonds into separate exposure buckets. Which concept BEST fits?","options":[{"id":"PM-C1-0071-O1","text":"Real asset"},{"id":"PM-C1-0071-O2","text":"Asset class"},{"id":"PM-C1-0071-O3","text":"Diversification"},{"id":"PM-C1-0071-O4","text":"Investment portfolio"}],"correctOptionId":"PM-C1-0071-O2","explanation":"Asset class: Asset classes group investments with broadly similar economic characteristics. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio & Asset Classes.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0072","chapter":1,"number":72,"topic":"Portfolio & Asset Classes","level":"Basic","question":"An investment case describes the following: An investor owns and manages a warehouse, rather than purchasing a property-fund unit. Which concept BEST fits?","options":[{"id":"PM-C1-0072-O1","text":"Financial asset"},{"id":"PM-C1-0072-O2","text":"Common equity"},{"id":"PM-C1-0072-O3","text":"Direct property holding"},{"id":"PM-C1-0072-O4","text":"Concentrated position"}],"correctOptionId":"PM-C1-0072-O3","explanation":"Direct property holding: Direct property exposure means owning the underlying real estate itself. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio & Asset Classes.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0073","chapter":1,"number":73,"topic":"Portfolio & Asset Classes","level":"Basic","question":"An investment case describes the following: A portfolio holds a physical gold allocation to diversify exposure to company cash flows. Which concept BEST fits?","options":[{"id":"PM-C1-0073-O1","text":"Investment portfolio"},{"id":"PM-C1-0073-O2","text":"Real asset"},{"id":"PM-C1-0073-O3","text":"Debt security"},{"id":"PM-C1-0073-O4","text":"Commodity exposure"}],"correctOptionId":"PM-C1-0073-O4","explanation":"Commodity exposure: Gold is a commodity and differs from a claim on a corporate issuer. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio & Asset Classes.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0074","chapter":1,"number":74,"topic":"Portfolio & Asset Classes","level":"Basic","question":"An investment case describes the following: A client's capital is spread across several imperfectly correlated investment holdings. Which concept BEST fits?","options":[{"id":"PM-C1-0074-O1","text":"Diversification"},{"id":"PM-C1-0074-O2","text":"Financial asset"},{"id":"PM-C1-0074-O3","text":"Common equity"},{"id":"PM-C1-0074-O4","text":"Asset class"}],"correctOptionId":"PM-C1-0074-O1","explanation":"Diversification: Diversification combines exposures to manage overall portfolio risk, without guaranteeing profits. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio & Asset Classes.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0075","chapter":1,"number":75,"topic":"Portfolio & Asset Classes","level":"Basic","question":"An investment case describes the following: Seventy percent of a portfolio is invested in a single listed company. Which concept BEST fits?","options":[{"id":"PM-C1-0075-O1","text":"Direct property holding"},{"id":"PM-C1-0075-O2","text":"Concentrated position"},{"id":"PM-C1-0075-O3","text":"Real asset"},{"id":"PM-C1-0075-O4","text":"Debt security"}],"correctOptionId":"PM-C1-0075-O2","explanation":"Concentrated position: Concentration creates a large dependence on one issuer or exposure. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio & Asset Classes.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0076","chapter":1,"number":76,"topic":"Investment Funds & Services","level":"Basic","question":"An investment case describes the following: Hundreds of investors contribute capital that is managed as one portfolio. Which concept BEST fits?","options":[{"id":"PM-C1-0076-O1","text":"Pooled investment fund"},{"id":"PM-C1-0076-O2","text":"Mutual fund net asset value"},{"id":"PM-C1-0076-O3","text":"Fund expense ratio"},{"id":"PM-C1-0076-O4","text":"Fund mandate"}],"correctOptionId":"PM-C1-0076-O1","explanation":"Pooled investment fund: A pooled fund combines investors' money into a common investment vehicle. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Funds & Services.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0077","chapter":1,"number":77,"topic":"Investment Funds & Services","level":"Basic","question":"An investment case describes the following: Two investors receive fund units in proportion to their subscriptions. Which concept BEST fits?","options":[{"id":"PM-C1-0077-O1","text":"Custody arrangement"},{"id":"PM-C1-0077-O2","text":"Fund ownership units"},{"id":"PM-C1-0077-O3","text":"Exchange-traded fund"},{"id":"PM-C1-0077-O4","text":"Index-tracking fund"}],"correctOptionId":"PM-C1-0077-O2","explanation":"Fund ownership units: Fund interests represent proportional participation, subject to the fund terms. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Funds & Services.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0078","chapter":1,"number":78,"topic":"Investment Funds & Services","level":"Basic","question":"An investment case describes the following: A regulated manager selects securities and monitors pooled investments on investors' behalf. Which concept BEST fits?","options":[{"id":"PM-C1-0078-O1","text":"Fund mandate"},{"id":"PM-C1-0078-O2","text":"Liquidity of fund units"},{"id":"PM-C1-0078-O3","text":"Professional management"},{"id":"PM-C1-0078-O4","text":"Fund expense ratio"}],"correctOptionId":"PM-C1-0078-O3","explanation":"Professional management: Professional managers make allocation and security decisions according to mandate. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Funds & Services.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0079","chapter":1,"number":79,"topic":"Investment Funds & Services","level":"Basic","question":"An investment case describes the following: A fund values portfolio assets, subtracts liabilities and divides the remainder by outstanding units. Which concept BEST fits?","options":[{"id":"PM-C1-0079-O1","text":"Index-tracking fund"},{"id":"PM-C1-0079-O2","text":"Custody arrangement"},{"id":"PM-C1-0079-O3","text":"Pooled investment fund"},{"id":"PM-C1-0079-O4","text":"Mutual fund net asset value"}],"correctOptionId":"PM-C1-0079-O4","explanation":"Mutual fund net asset value: NAV per unit is net fund asset value divided by the number of units. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Funds & Services.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0080","chapter":1,"number":80,"topic":"Investment Funds & Services","level":"Basic","question":"An investment case describes the following: A fund share is bought during a market session through an exchange order. Which concept BEST fits?","options":[{"id":"PM-C1-0080-O1","text":"Exchange-traded fund"},{"id":"PM-C1-0080-O2","text":"Fund mandate"},{"id":"PM-C1-0080-O3","text":"Liquidity of fund units"},{"id":"PM-C1-0080-O4","text":"Fund ownership units"}],"correctOptionId":"PM-C1-0080-O1","explanation":"Exchange-traded fund: ETF shares can trade on a securities exchange during the trading day. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Funds & Services.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0081","chapter":1,"number":81,"topic":"Investment Funds & Services","level":"Basic","question":"An investment case describes the following: A fund deducts recurring operating costs from assets, reducing the investor's net return. Which concept BEST fits?","options":[{"id":"PM-C1-0081-O1","text":"Professional management"},{"id":"PM-C1-0081-O2","text":"Fund expense ratio"},{"id":"PM-C1-0081-O3","text":"Custody arrangement"},{"id":"PM-C1-0081-O4","text":"Pooled investment fund"}],"correctOptionId":"PM-C1-0081-O2","explanation":"Fund expense ratio: Operating expenses reduce the investor's return compared with gross portfolio performance. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Funds & Services.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0082","chapter":1,"number":82,"topic":"Investment Funds & Services","level":"Basic","question":"An investment case describes the following: A manager aims to replicate the weights and returns of a specified index. Which concept BEST fits?","options":[{"id":"PM-C1-0082-O1","text":"Fund ownership units"},{"id":"PM-C1-0082-O2","text":"Mutual fund net asset value"},{"id":"PM-C1-0082-O3","text":"Index-tracking fund"},{"id":"PM-C1-0082-O4","text":"Liquidity of fund units"}],"correctOptionId":"PM-C1-0082-O3","explanation":"Index-tracking fund: An index fund pursues benchmark exposure rather than discretionary stock outperformance. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Funds & Services.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0083","chapter":1,"number":83,"topic":"Investment Funds & Services","level":"Basic","question":"An investment case describes the following: Investors sign up to a fund that is permitted to hold only investment-grade fixed income. Which concept BEST fits?","options":[{"id":"PM-C1-0083-O1","text":"Pooled investment fund"},{"id":"PM-C1-0083-O2","text":"Professional management"},{"id":"PM-C1-0083-O3","text":"Exchange-traded fund"},{"id":"PM-C1-0083-O4","text":"Fund mandate"}],"correctOptionId":"PM-C1-0083-O4","explanation":"Fund mandate: The mandate specifies eligible assets, objectives and constraints for fund operations. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Funds & Services.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0084","chapter":1,"number":84,"topic":"Investment Funds & Services","level":"Basic","question":"An investment case describes the following: A designated independent institution safeguards portfolio assets while a manager decides investments. Which concept BEST fits?","options":[{"id":"PM-C1-0084-O1","text":"Custody arrangement"},{"id":"PM-C1-0084-O2","text":"Fund ownership units"},{"id":"PM-C1-0084-O3","text":"Mutual fund net asset value"},{"id":"PM-C1-0084-O4","text":"Fund expense ratio"}],"correctOptionId":"PM-C1-0084-O1","explanation":"Custody arrangement: Custody concerns safekeeping of holdings rather than strategy selection. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Funds & Services.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0085","chapter":1,"number":85,"topic":"Investment Funds & Services","level":"Basic","question":"An investment case describes the following: An investor checks redemption frequency, settlement dates and exchange trading depth. Which concept BEST fits?","options":[{"id":"PM-C1-0085-O1","text":"Index-tracking fund"},{"id":"PM-C1-0085-O2","text":"Liquidity of fund units"},{"id":"PM-C1-0085-O3","text":"Professional management"},{"id":"PM-C1-0085-O4","text":"Exchange-traded fund"}],"correctOptionId":"PM-C1-0085-O2","explanation":"Liquidity of fund units: Fund liquidity reflects the ability to convert units into cash under applicable rules. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Funds & Services.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0086","chapter":1,"number":86,"topic":"Portfolio Management Process","level":"Basic","question":"An investment case describes the following: Before placing trades, an adviser documents goals, constraints and the investment policy. Which concept BEST fits?","options":[{"id":"PM-C1-0086-O1","text":"Planning stage"},{"id":"PM-C1-0086-O2","text":"Investment policy statement"},{"id":"PM-C1-0086-O3","text":"Security-selection decision"},{"id":"PM-C1-0086-O4","text":"Performance evaluation"}],"correctOptionId":"PM-C1-0086-O1","explanation":"Planning stage: Planning establishes requirements and the policy for managing capital. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio Management Process.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0087","chapter":1,"number":87,"topic":"Portfolio Management Process","level":"Basic","question":"An investment case describes the following: A manager implements target weights by buying approved securities. Which concept BEST fits?","options":[{"id":"PM-C1-0087-O1","text":"Rebalancing implementation"},{"id":"PM-C1-0087-O2","text":"Implementation stage"},{"id":"PM-C1-0087-O3","text":"Asset-allocation decision"},{"id":"PM-C1-0087-O4","text":"Portfolio monitoring"}],"correctOptionId":"PM-C1-0087-O2","explanation":"Implementation stage: Implementation puts approved asset and security strategies into effect. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio Management Process.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0088","chapter":1,"number":88,"topic":"Portfolio Management Process","level":"Basic","question":"An investment case describes the following: A manager evaluates actual results and updates allocations when justified. Which concept BEST fits?","options":[{"id":"PM-C1-0088-O1","text":"Performance evaluation"},{"id":"PM-C1-0088-O2","text":"Client circumstances review"},{"id":"PM-C1-0088-O3","text":"Feedback stage"},{"id":"PM-C1-0088-O4","text":"Security-selection decision"}],"correctOptionId":"PM-C1-0088-O3","explanation":"Feedback stage: Feedback includes monitoring, measurement and appropriate corrective actions. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio Management Process.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0089","chapter":1,"number":89,"topic":"Portfolio Management Process","level":"Basic","question":"An investment case describes the following: An adviser and client agree in writing on objectives, limitations and monitoring standards. Which concept BEST fits?","options":[{"id":"PM-C1-0089-O1","text":"Portfolio monitoring"},{"id":"PM-C1-0089-O2","text":"Rebalancing implementation"},{"id":"PM-C1-0089-O3","text":"Planning stage"},{"id":"PM-C1-0089-O4","text":"Investment policy statement"}],"correctOptionId":"PM-C1-0089-O4","explanation":"Investment policy statement: The IPS is a governing document for consistent portfolio decisions. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio Management Process.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0090","chapter":1,"number":90,"topic":"Portfolio Management Process","level":"Basic","question":"An investment case describes the following: A committee determines how much capital goes to shares, bonds and cash. Which concept BEST fits?","options":[{"id":"PM-C1-0090-O1","text":"Asset-allocation decision"},{"id":"PM-C1-0090-O2","text":"Performance evaluation"},{"id":"PM-C1-0090-O3","text":"Client circumstances review"},{"id":"PM-C1-0090-O4","text":"Implementation stage"}],"correctOptionId":"PM-C1-0090-O1","explanation":"Asset-allocation decision: Asset allocation distributes funds among asset classes. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio Management Process.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0091","chapter":1,"number":91,"topic":"Portfolio Management Process","level":"Basic","question":"An investment case describes the following: Within the equity budget, an analyst chooses specific listed companies to purchase. Which concept BEST fits?","options":[{"id":"PM-C1-0091-O1","text":"Feedback stage"},{"id":"PM-C1-0091-O2","text":"Security-selection decision"},{"id":"PM-C1-0091-O3","text":"Rebalancing implementation"},{"id":"PM-C1-0091-O4","text":"Planning stage"}],"correctOptionId":"PM-C1-0091-O2","explanation":"Security-selection decision: Security selection decides which individual instruments to own. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio Management Process.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0092","chapter":1,"number":92,"topic":"Portfolio Management Process","level":"Basic","question":"An investment case describes the following: Monthly reviews compare current holdings and exposures with permitted ranges. Which concept BEST fits?","options":[{"id":"PM-C1-0092-O1","text":"Implementation stage"},{"id":"PM-C1-0092-O2","text":"Investment policy statement"},{"id":"PM-C1-0092-O3","text":"Portfolio monitoring"},{"id":"PM-C1-0092-O4","text":"Client circumstances review"}],"correctOptionId":"PM-C1-0092-O3","explanation":"Portfolio monitoring: Monitoring observes positions, risk and compliance through time. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio Management Process.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0093","chapter":1,"number":93,"topic":"Portfolio Management Process","level":"Basic","question":"An investment case describes the following: An investment committee calculates return and compares it with an agreed reference. Which concept BEST fits?","options":[{"id":"PM-C1-0093-O1","text":"Planning stage"},{"id":"PM-C1-0093-O2","text":"Feedback stage"},{"id":"PM-C1-0093-O3","text":"Asset-allocation decision"},{"id":"PM-C1-0093-O4","text":"Performance evaluation"}],"correctOptionId":"PM-C1-0093-O4","explanation":"Performance evaluation: Performance evaluation assesses achieved outcomes against appropriate measures. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio Management Process.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0094","chapter":1,"number":94,"topic":"Portfolio Management Process","level":"Basic","question":"An investment case describes the following: A drifted portfolio trades some holdings to restore policy weights. Which concept BEST fits?","options":[{"id":"PM-C1-0094-O1","text":"Rebalancing implementation"},{"id":"PM-C1-0094-O2","text":"Implementation stage"},{"id":"PM-C1-0094-O3","text":"Investment policy statement"},{"id":"PM-C1-0094-O4","text":"Security-selection decision"}],"correctOptionId":"PM-C1-0094-O1","explanation":"Rebalancing implementation: Rebalancing trades are corrective actions restoring the intended allocation. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio Management Process.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0095","chapter":1,"number":95,"topic":"Portfolio Management Process","level":"Basic","question":"An investment case describes the following: The manager checks whether divorce, a new child or job loss changes client needs. Which concept BEST fits?","options":[{"id":"PM-C1-0095-O1","text":"Portfolio monitoring"},{"id":"PM-C1-0095-O2","text":"Client circumstances review"},{"id":"PM-C1-0095-O3","text":"Feedback stage"},{"id":"PM-C1-0095-O4","text":"Asset-allocation decision"}],"correctOptionId":"PM-C1-0095-O2","explanation":"Client circumstances review: Substantial life changes can require revision of objectives and constraints. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Portfolio Management Process.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0096","chapter":1,"number":96,"topic":"IPS Objectives and Constraints","level":"Basic","question":"An investment case describes the following: A client asks to fund a known retirement spending goal while preserving purchasing power. Which concept BEST fits?","options":[{"id":"PM-C1-0096-O1","text":"Return objective"},{"id":"PM-C1-0096-O2","text":"Time-horizon constraint"},{"id":"PM-C1-0096-O3","text":"Legal constraint"},{"id":"PM-C1-0096-O4","text":"Investment benchmark"}],"correctOptionId":"PM-C1-0096-O1","explanation":"Return objective: The return objective expresses required or desired investment performance. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề IPS Objectives and Constraints.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0097","chapter":1,"number":97,"topic":"IPS Objectives and Constraints","level":"Basic","question":"An investment case describes the following: An investor wants to avoid more than a specified level of portfolio volatility or drawdown. Which concept BEST fits?","options":[{"id":"PM-C1-0097-O1","text":"Required return"},{"id":"PM-C1-0097-O2","text":"Risk objective"},{"id":"PM-C1-0097-O3","text":"Tax constraint"},{"id":"PM-C1-0097-O4","text":"Unique circumstances"}],"correctOptionId":"PM-C1-0097-O2","explanation":"Risk objective: The risk objective expresses risk limits and acceptable uncertainty. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề IPS Objectives and Constraints.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0098","chapter":1,"number":98,"topic":"IPS Objectives and Constraints","level":"Basic","question":"An investment case describes the following: A business owner must withdraw cash for a tax payment in eight weeks. Which concept BEST fits?","options":[{"id":"P
