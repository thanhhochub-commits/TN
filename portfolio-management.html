expresses required or desired investment performance. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0197","chapter":1,"number":197,"topic":"IPS Objectives and Constraints","level":"Intermediate","question":"Which example MOST directly demonstrates \"Risk objective\"?","options":[{"id":"PM-C1-0197-O1","text":"A household calculates the annual return needed to reach a defined education-funding amount."},{"id":"PM-C1-0197-O2","text":"An investor wants to avoid more than a specified level of portfolio volatility or drawdown."},{"id":"PM-C1-0197-O3","text":"A high-tax-rate client wants portfolio turnover assessed for capital-gains taxes."},{"id":"PM-C1-0197-O4","text":"A client excludes tobacco stocks because of stated personal preferences."}],"correctOptionId":"PM-C1-0197-O2","explanation":"Tình huống chính: An investor wants to avoid more than a specified level of portfolio volatility or drawdown. The risk objective expresses risk limits and acceptable uncertainty. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0198","chapter":1,"number":198,"topic":"IPS Objectives and Constraints","level":"Intermediate","question":"Which example MOST directly demonstrates \"Liquidity constraint\"?","options":[{"id":"PM-C1-0198-O1","text":"An IPS names a bond index against which its bond mandate will be evaluated."},{"id":"PM-C1-0198-O2","text":"A client wants high returns but may need all invested cash next month."},{"id":"PM-C1-0198-O3","text":"A business owner must withdraw cash for a tax payment in eight weeks."},{"id":"PM-C1-0198-O4","text":"A pension mandate prohibits specific securities under applicable regulations."}],"correctOptionId":"PM-C1-0198-O3","explanation":"Tình huống chính: A business owner must withdraw cash for a tax payment in eight weeks. Near-term cash obligations create liquidity constraints. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0199","chapter":1,"number":199,"topic":"IPS Objectives and Constraints","level":"Intermediate","question":"Which example MOST directly demonstrates \"Time-horizon constraint\"?","options":[{"id":"PM-C1-0199-O1","text":"A client excludes tobacco stocks because of stated personal preferences."},{"id":"PM-C1-0199-O2","text":"A household calculates the annual return needed to reach a defined education-funding amount."},{"id":"PM-C1-0199-O3","text":"A client asks to fund a known retirement spending goal while preserving purchasing power."},{"id":"PM-C1-0199-O4","text":"An investor must repay a property deposit within six months."}],"correctOptionId":"PM-C1-0199-O4","explanation":"Tình huống chính: An investor must repay a property deposit within six months. The horizon identifies how long capital can remain invested. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0200","chapter":1,"number":200,"topic":"IPS Objectives and Constraints","level":"Intermediate","question":"Which example MOST directly demonstrates \"Tax constraint\"?","options":[{"id":"PM-C1-0200-O1","text":"A high-tax-rate client wants portfolio turnover assessed for capital-gains taxes."},{"id":"PM-C1-0200-O2","text":"An IPS names a bond index against which its bond mandate will be evaluated."},{"id":"PM-C1-0200-O3","text":"A client wants high returns but may need all invested cash next month."},{"id":"PM-C1-0200-O4","text":"An investor wants to avoid more than a specified level of portfolio volatility or drawdown."}],"correctOptionId":"PM-C1-0200-O1","explanation":"Tình huống chính: A high-tax-rate client wants portfolio turnover assessed for capital-gains taxes. Tax circumstances can restrict otherwise attractive strategies. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0201","chapter":1,"number":201,"topic":"IPS Objectives and Constraints","level":"Intermediate","question":"Which example MOST directly demonstrates \"Legal constraint\"?","options":[{"id":"PM-C1-0201-O1","text":"A business owner must withdraw cash for a tax payment in eight weeks."},{"id":"PM-C1-0201-O2","text":"A pension mandate prohibits specific securities under applicable regulations."},{"id":"PM-C1-0201-O3","text":"A household calculates the annual return needed to reach a defined education-funding amount."},{"id":"PM-C1-0201-O4","text":"A client asks to fund a known retirement spending goal while preserving purchasing power."}],"correctOptionId":"PM-C1-0201-O2","explanation":"Tình huống chính: A pension mandate prohibits specific securities under applicable regulations. Legal requirements restrict the eligible portfolio and management process. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0202","chapter":1,"number":202,"topic":"IPS Objectives and Constraints","level":"Intermediate","question":"Which example MOST directly demonstrates \"Unique circumstances\"?","options":[{"id":"PM-C1-0202-O1","text":"An investor wants to avoid more than a specified level of portfolio volatility or drawdown."},{"id":"PM-C1-0202-O2","text":"An investor must repay a property deposit within six months."},{"id":"PM-C1-0202-O3","text":"A client excludes tobacco stocks because of stated personal preferences."},{"id":"PM-C1-0202-O4","text":"A client wants high returns but may need all invested cash next month."}],"correctOptionId":"PM-C1-0202-O3","explanation":"Tình huống chính: A client excludes tobacco stocks because of stated personal preferences. Special preferences or circumstances can shape a permissible portfolio. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0203","chapter":1,"number":203,"topic":"IPS Objectives and Constraints","level":"Intermediate","question":"Which example MOST directly demonstrates \"Investment benchmark\"?","options":[{"id":"PM-C1-0203-O1","text":"A client asks to fund a known retirement spending goal while preserving purchasing power."},{"id":"PM-C1-0203-O2","text":"A business owner must withdraw cash for a tax payment in eight weeks."},{"id":"PM-C1-0203-O3","text":"A high-tax-rate client wants portfolio turnover assessed for capital-gains taxes."},{"id":"PM-C1-0203-O4","text":"An IPS names a bond index against which its bond mandate will be evaluated."}],"correctOptionId":"PM-C1-0203-O4","explanation":"Tình huống chính: An IPS names a bond index against which its bond mandate will be evaluated. A benchmark offers an agreed reference for measuring performance. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0204","chapter":1,"number":204,"topic":"IPS Objectives and Constraints","level":"Intermediate","question":"Which example MOST directly demonstrates \"Required return\"?","options":[{"id":"PM-C1-0204-O1","text":"A household calculates the annual return needed to reach a defined education-funding amount."},{"id":"PM-C1-0204-O2","text":"An investor wants to avoid more than a specified level of portfolio volatility or drawdown."},{"id":"PM-C1-0204-O3","text":"An investor must repay a property deposit within six months."},{"id":"PM-C1-0204-O4","text":"A pension mandate prohibits specific securities under applicable regulations."}],"correctOptionId":"PM-C1-0204-O1","explanation":"Tình huống chính: A household calculates the annual return needed to reach a defined education-funding amount. Required return is linked to financial goals and cash-flow needs. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0205","chapter":1,"number":205,"topic":"IPS Objectives and Constraints","level":"Intermediate","question":"Which example MOST directly demonstrates \"Constraint trade-off\"?","options":[{"id":"PM-C1-0205-O1","text":"A client excludes tobacco stocks because of stated personal preferences."},{"id":"PM-C1-0205-O2","text":"A client wants high returns but may need all invested cash next month."},{"id":"PM-C1-0205-O3","text":"A business owner must withdraw cash for a tax payment in eight weeks."},{"id":"PM-C1-0205-O4","text":"A high-tax-rate client wants portfolio turnover assessed for capital-gains taxes."}],"correctOptionId":"PM-C1-0205-O2","explanation":"Tình huống chính: A client wants high returns but may need all invested cash next month. Objectives must be evaluated jointly with constraints, not in isolation. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0206","chapter":1,"number":206,"topic":"Risk Tolerance","level":"Intermediate","question":"Which example MOST directly demonstrates \"Risk capacity\"?","options":[{"id":"PM-C1-0206-O1","text":"An investor has stable income, a large emergency fund and few immediate liabilities."},{"id":"PM-C1-0206-O2","text":"A wealthy client can afford losses but is unwilling to accept equity volatility."},{"id":"PM-C1-0206-O3","text":"An investor keeps near-term living costs in readily available cash outside volatile holdings."},{"id":"PM-C1-0206-O4","text":"An adviser uses responses about hypothetical losses to assess emotional reactions."}],"correctOptionId":"PM-C1-0206-O1","explanation":"Tình huống chính: An investor has stable income, a large emergency fund and few immediate liabilities. Capacity concerns financial ability to withstand investment losses. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0207","chapter":1,"number":207,"topic":"Risk Tolerance","level":"Intermediate","question":"Which example MOST directly demonstrates \"Risk willingness\"?","options":[{"id":"PM-C1-0207-O1","text":"Two clients of equal age receive different portfolios because their liabilities differ."},{"id":"PM-C1-0207-O2","text":"An investor has ample wealth but loses sleep over temporary stock-price declines."},{"id":"PM-C1-0207-O3","text":"A foundation's board sets a portfolio drawdown limit in its mandate."},{"id":"PM-C1-0207-O4","text":"A retiree must withdraw money immediately after a sharp market decline."}],"correctOptionId":"PM-C1-0207-O2","explanation":"Tình huống chính: An investor has ample wealth but loses sleep over temporary stock-price declines. Willingness reflects psychological comfort with risk. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0208","chapter":1,"number":208,"topic":"Risk Tolerance","level":"Intermediate","question":"Which example MOST directly demonstrates \"Risk aversion\"?","options":[{"id":"PM-C1-0208-O1","text":"An adviser uses responses about hypothetical losses to assess emotional reactions."},{"id":"PM-C1-0208-O2","text":"A client requests equity-like growth with almost no tolerable downside."},{"id":"PM-C1-0208-O3","text":"Given the same expected payoff, a client chooses the less volatile investment."},{"id":"PM-C1-0208-O4","text":"An investor keeps near-term living costs in readily available cash outside volatile holdings."}],"correctOptionId":"PM-C1-0208-O3","explanation":"Tình huống chính: Given the same expected payoff, a client chooses the less volatile investment. Risk aversion means preferring less uncertainty when expected returns are equal. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0209","chapter":1,"number":209,"topic":"Risk Tolerance","level":"Intermediate","question":"Which example MOST directly demonstrates \"Tolerance mismatch\"?","options":[{"id":"PM-C1-0209-O1","text":"A retiree must withdraw money immediately after a sharp market decline."},{"id":"PM-C1-0209-O2","text":"Two clients of equal age receive different portfolios because their liabilities differ."},{"id":"PM-C1-0209-O3","text":"An investor has stable income, a large emergency fund and few immediate liabilities."},{"id":"PM-C1-0209-O4","text":"A wealthy client can afford losses but is unwilling to accept equity volatility."}],"correctOptionId":"PM-C1-0209-O4","explanation":"Tình huống chính: A wealthy client can afford losses but is unwilling to accept equity volatility. Capacity and willingness can diverge and both should be assessed. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0210","chapter":1,"number":210,"topic":"Risk Tolerance","level":"Intermediate","question":"Which example MOST directly demonstrates \"Loss constraint\"?","options":[{"id":"PM-C1-0210-O1","text":"A foundation's board sets a portfolio drawdown limit in its mandate."},{"id":"PM-C1-0210-O2","text":"An adviser uses responses about hypothetical losses to assess emotional reactions."},{"id":"PM-C1-0210-O3","text":"A client requests equity-like growth with almost no tolerable downside."},{"id":"PM-C1-0210-O4","text":"An investor has ample wealth but loses sleep over temporary stock-price declines."}],"correctOptionId":"PM-C1-0210-O1","explanation":"Tình huống chính: A foundation's board sets a portfolio drawdown limit in its mandate. Loss limits translate risk preferences into explicit controls. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0211","chapter":1,"number":211,"topic":"Risk Tolerance","level":"Intermediate","question":"Which example MOST directly demonstrates \"Emergency reserve\"?","options":[{"id":"PM-C1-0211-O1","text":"Given the same expected payoff, a client chooses the less volatile investment."},{"id":"PM-C1-0211-O2","text":"An investor keeps near-term living costs in readily available cash outside volatile holdings."},{"id":"PM-C1-0211-O3","text":"Two clients of equal age receive different portfolios because their liabilities differ."},{"id":"PM-C1-0211-O4","text":"An investor has stable income, a large emergency fund and few immediate liabilities."}],"correctOptionId":"PM-C1-0211-O2","explanation":"Tình huống chính: An investor keeps near-term living costs in readily available cash outside volatile holdings. A cash reserve protects near-term spending from market fluctuations. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0212","chapter":1,"number":212,"topic":"Risk Tolerance","level":"Intermediate","question":"Which example MOST directly demonstrates \"Sequence-of-returns concern\"?","options":[{"id":"PM-C1-0212-O1","text":"An investor has ample wealth but loses sleep over temporary stock-price declines."},{"id":"PM-C1-0212-O2","text":"A wealthy client can afford losses but is unwilling to accept equity volatility."},{"id":"PM-C1-0212-O3","text":"A retiree must withdraw money immediately after a sharp market decline."},{"id":"PM-C1-0212-O4","text":"A client requests equity-like growth with almost no tolerable downside."}],"correctOptionId":"PM-C1-0212-O3","explanation":"Tình huống chính: A retiree must withdraw money immediately after a sharp market decline. Portfolio losses near required withdrawals can disproportionately harm future spending. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0213","chapter":1,"number":213,"topic":"Risk Tolerance","level":"Intermediate","question":"Which example MOST directly demonstrates \"Risk questionnaire\"?","options":[{"id":"PM-C1-0213-O1","text":"An investor has stable income, a large emergency fund and few immediate liabilities."},{"id":"PM-C1-0213-O2","text":"Given the same expected payoff, a client chooses the less volatile investment."},{"id":"PM-C1-0213-O3","text":"A foundation's board sets a portfolio drawdown limit in its mandate."},{"id":"PM-C1-0213-O4","text":"An adviser uses responses about hypothetical losses to assess emotional reactions."}],"correctOptionId":"PM-C1-0213-O4","explanation":"Tình huống chính: An adviser uses responses about hypothetical losses to assess emotional reactions. Questionnaires help elicit willingness but should not replace financial-capacity analysis. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0214","chapter":1,"number":214,"topic":"Risk Tolerance","level":"Intermediate","question":"Which example MOST directly demonstrates \"Investor-specific suitability\"?","options":[{"id":"PM-C1-0214-O1","text":"Two clients of equal age receive different portfolios because their liabilities differ."},{"id":"PM-C1-0214-O2","text":"An investor has ample wealth but loses sleep over temporary stock-price declines."},{"id":"PM-C1-0214-O3","text":"A wealthy client can afford losses but is unwilling to accept equity volatility."},{"id":"PM-C1-0214-O4","text":"An investor keeps near-term living costs in readily available cash outside volatile holdings."}],"correctOptionId":"PM-C1-0214-O1","explanation":"Tình huống chính: Two clients of equal age receive different portfolios because their liabilities differ. Suitable risk exposure depends on personal circumstances, not age alone. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0215","chapter":1,"number":215,"topic":"Risk Tolerance","level":"Intermediate","question":"Which example MOST directly demonstrates \"Risk-return consistency\"?","options":[{"id":"PM-C1-0215-O1","text":"A retiree must withdraw money immediately after a sharp market decline."},{"id":"PM-C1-0215-O2","text":"A client requests equity-like growth with almost no tolerable downside."},{"id":"PM-C1-0215-O3","text":"Given the same expected payoff, a client chooses the less volatile investment."},{"id":"PM-C1-0215-O4","text":"A foundation's board sets a portfolio drawdown limit in its mandate."}],"correctOptionId":"PM-C1-0215-O2","explanation":"Tình huống chính: A client requests equity-like growth with almost no tolerable downside. Return ambition must be reconciled with risk constraints and achievable opportunities. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0216","chapter":1,"number":216,"topic":"Investor Life Cycle","level":"Intermediate","question":"Which example MOST directly demonstrates \"Accumulation phase\"?","options":[{"id":"PM-C1-0216-O1","text":"A graduate beginning a career contributes monthly savings toward a distant retirement."},{"id":"PM-C1-0216-O2","text":"A wealthy retired client plans charitable transfers and bequests."},{"id":"PM-C1-0216-O3","text":"A couple plans to purchase a house within nine months."},{"id":"PM-C1-0216-O4","text":"An individual shifts from regular contributions to recurring withdrawals."}],"correctOptionId":"PM-C1-0216-O1","explanation":"Tình huống chính: A graduate beginning a career contributes monthly savings toward a distant retirement. Accumulation generally emphasizes building capital over a long horizon. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0217","chapter":1,"number":217,"topic":"Investor Life Cycle","level":"Intermediate","question":"Which example MOST directly demonstrates \"Consolidation phase\"?","options":[{"id":"PM-C1-0217-O1","text":"A client decides which assets should pass to family members in future."},{"id":"PM-C1-0217-O2","text":"A mid-career saver has built substantial wealth and adjusts toward balanced growth."},{"id":"PM-C1-0217-O3","text":"An investor has no expected withdrawals from retirement savings for 35 years."},{"id":"PM-C1-0217-O4","text":"A household with predictable employment income can fund normal expenses without selling investments."}],"correctOptionId":"PM-C1-0217-O2","explanation":"Tình huống chính: A mid-career saver has built substantial wealth and adjusts toward balanced growth. Consolidation focuses on growing and protecting accumulated capital. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0218","chapter":1,"number":218,"topic":"Investor Life Cycle","level":"Intermediate","question":"Which example MOST directly demonstrates \"Spending phase\"?","options":[{"id":"PM-C1-0218-O1","text":"An individual shifts from regular contributions to recurring withdrawals."},{"id":"PM-C1-0218-O2","text":"An unexpected medical bill changes the amount of money a family needs accessible."},{"id":"PM-C1-0218-O3","text":"A recently retired person withdraws money to meet recurring living expenses."},{"id":"PM-C1-0218-O4","text":"A couple plans to purchase a house within nine months."}],"correctOptionId":"PM-C1-0218-O3","explanation":"Tình huống chính: A recently retired person withdraws money to meet recurring living expenses. Spending requires portfolio cash flows and a workable withdrawal plan. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0219","chapter":1,"number":219,"topic":"Investor Life Cycle","level":"Intermediate","question":"Which example MOST directly demonstrates \"Gifting phase\"?","options":[{"id":"PM-C1-0219-O1","text":"A household with predictable employment income can fund normal expenses without selling investments."},{"id":"PM-C1-0219-O2","text":"A client decides which assets should pass to family members in future."},{"id":"PM-C1-0219-O3","text":"A graduate beginning a career contributes monthly savings toward a distant retirement."},{"id":"PM-C1-0219-O4","text":"A wealthy retired client plans charitable transfers and bequests."}],"correctOptionId":"PM-C1-0219-O4","explanation":"Tình huống chính: A wealthy retired client plans charitable transfers and bequests. Gifting concerns distributing wealth to beneficiaries and causes. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0220","chapter":1,"number":220,"topic":"Investor Life Cycle","level":"Intermediate","question":"Which example MOST directly demonstrates \"Long investment horizon\"?","options":[{"id":"PM-C1-0220-O1","text":"An investor has no expected withdrawals from retirement savings for 35 years."},{"id":"PM-C1-0220-O2","text":"An individual shifts from regular contributions to recurring withdrawals."},{"id":"PM-C1-0220-O3","text":"An unexpected medical bill changes the amount of money a family needs accessible."},{"id":"PM-C1-0220-O4","text":"A mid-career saver has built substantial wealth and adjusts toward balanced growth."}],"correctOptionId":"PM-C1-0220-O1","explanation":"Tình huống chính: An investor has no expected withdrawals from retirement savings for 35 years. A long horizon can increase capacity for illiquid or volatile exposures, subject to circumstances. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0221","chapter":1,"number":221,"topic":"Investor Life Cycle","level":"Intermediate","question":"Which example MOST directly demonstrates \"Short investment horizon\"?","options":[{"id":"PM-C1-0221-O1","text":"A recently retired person withdraws money to meet recurring living expenses."},{"id":"PM-C1-0221-O2","text":"A couple plans to purchase a house within nine months."},{"id":"PM-C1-0221-O3","text":"A client decides which assets should pass to family members in future."},{"id":"PM-C1-0221-O4","text":"A graduate beginning a career contributes monthly savings toward a distant retirement."}],"correctOptionId":"PM-C1-0221-O2","explanation":"Tình huống chính: A couple plans to purchase a house within nine months. Short horizons put greater weight on liquidity and principal preservation. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0222","chapter":1,"number":222,"topic":"Investor Life Cycle","level":"Intermediate","question":"Which example MOST directly demonstrates \"Income stability\"?","options":[{"id":"PM-C1-0222-O1","text":"A mid-career saver has built substantial wealth and adjusts toward balanced growth."},{"id":"PM-C1-0222-O2","text":"A wealthy retired client plans charitable transfers and bequests."},{"id":"PM-C1-0222-O3","text":"A household with predictable employment income can fund normal expenses without selling investments."},{"id":"PM-C1-0222-O4","text":"An unexpected medical bill changes the amount of money a family needs accessible."}],"correctOptionId":"PM-C1-0222-O3","explanation":"Tình huống chính: A household with predictable employment income can fund normal expenses without selling investments. Reliable external cash flows can support greater financial risk capacity. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0223","chapter":1,"number":223,"topic":"Investor Life Cycle","level":"Intermediate","question":"Which example MOST directly demonstrates \"Retirement transition\"?","options":[{"id":"PM-C1-0223-O1","text":"A graduate beginning a career contributes monthly savings toward a distant retirement."},{"id":"PM-C1-0223-O2","text":"A recently retired person withdraws money to meet recurring living expenses."},{"id":"PM-C1-0223-O3","text":"An investor has no expected withdrawals from retirement savings for 35 years."},{"id":"PM-C1-0223-O4","text":"An individual shifts from regular contributions to recurring withdrawals."}],"correctOptionId":"PM-C1-0223-O4","explanation":"Tình huống chính: An individual shifts from regular contributions to recurring withdrawals. Retirement changes portfolio cash-flow requirements and risk management. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0224","chapter":1,"number":224,"topic":"Investor Life Cycle","level":"Intermediate","question":"Which example MOST directly demonstrates \"Estate-planning goal\"?","options":[{"id":"PM-C1-0224-O1","text":"A client decides which assets should pass to family members in future."},{"id":"PM-C1-0224-O2","text":"A mid-career saver has built substantial wealth and adjusts toward balanced growth."},{"id":"PM-C1-0224-O3","text":"A wealthy retired client plans charitable transfers and bequests."},{"id":"PM-C1-0224-O4","text":"A couple plans to purchase a house within nine months."}],"correctOptionId":"PM-C1-0224-O1","explanation":"Tình huống chính: A client decides which assets should pass to family members in future. Estate objectives affect planning beyond the investor's own lifetime. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0225","chapter":1,"number":225,"topic":"Investor Life Cycle","level":"Intermediate","question":"Which example MOST directly demonstrates \"Life-event reassessment\"?","options":[{"id":"PM-C1-0225-O1","text":"A household with predictable employment income can fund normal expenses without selling investments."},{"id":"PM-C1-0225-O2","text":"An unexpected medical bill changes the amount of money a family needs accessible."},{"id":"PM-C1-0225-O3","text":"A recently retired person withdraws money to meet recurring living expenses."},{"id":"PM-C1-0225-O4","text":"An investor has no expected withdrawals from retirement savings for 35 years."}],"correctOptionId":"PM-C1-0225-O2","explanation":"Tình huống chính: An unexpected medical bill changes the amount of money a family needs accessible. Material life events can change investment constraints and allocation suitability. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0226","chapter":1,"number":226,"topic":"Asset Allocation","level":"Intermediate","question":"Which example MOST directly demonstrates \"Strategic asset allocation\"?","options":[{"id":"PM-C1-0226-O1","text":"A pension fund adopts a 55/35/10 equity/bond/cash policy for the long term."},{"id":"PM-C1-0226-O2","text":"The portfolio's equity weight is 65% while its strategic target is 55%."},{"id":"PM-C1-0226-O3","text":"An IPS permits equities to move between 45% and 55% around a 50% target."},{"id":"PM-C1-0226-O4","text":"A committee chooses equity, fixed-income, cash and real-estate proportions for its client."}],"correctOptionId":"PM-C1-0226-O1","explanation":"Tình huống chính: A pension fund adopts a 55/35/10 equity/bond/cash policy for the long term. Strategic allocation sets long-term target exposures consistent with policy. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0227","chapter":1,"number":227,"topic":"Asset Allocation","level":"Intermediate","question":"Which example MOST directly demonstrates \"Tactical asset allocation\"?","options":[{"id":"PM-C1-0227-O1","text":"An adviser estimates trading costs and taxes before restoring a portfolio's exact weights."},{"id":"PM-C1-0227-O2","text":"An investment committee temporarily increases bonds because it expects weaker equity returns."},{"id":"PM-C1-0227-O3","text":"The portfolio's bond weight is 20% versus a long-run policy target of 35%."},{"id":"PM-C1-0227-O4","text":"A manager substantially reduces equity risk because of a short-term market forecast."}],"correctOptionId":"PM-C1-0227-O2","explanation":"Tình huống chính: An investment committee temporarily increases bonds because it expects weaker equity returns. Tactical allocation makes temporary departures from strategic weights based on opportunities. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0228","chapter":1,"number":228,"topic":"Asset Allocation","level":"Intermediate","question":"Which example MOST directly demonstrates \"Rebalancing\"?","options":[{"id":"PM-C1-0228-O1","text":"A committee chooses equity, fixed-income, cash and real-estate proportions for its client."},{"id":"PM-C1-0228-O2","text":"A manager resists chasing last month's winning asset and follows IPS allocations."},{"id":"PM-C1-0228-O3","text":"Shares rise and exceed their policy band; the fund trims shares toward target."},{"id":"PM-C1-0228-O4","text":"An IPS permits equities to move between 45% and 55% around a 50% target."}],"correctOptionId":"PM-C1-0228-O3","explanation":"Tình huống chính: Shares rise and exceed their policy band; the fund trims shares toward target. Rebalancing restores policy allocations after market movements. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0229","chapter":1,"number":229,"topic":"Asset Allocation","level":"Intermediate","question":"Which example MOST directly demonstrates \"Overweight position\"?","options":[{"id":"PM-C1-0229-O1","text":"A manager substantially reduces equity risk because of a short-term market forecast."},{"id":"PM-C1-0229-O2","text":"An adviser estimates trading costs and taxes before restoring a portfolio's exact weights."},{"id":"PM-C1-0229-O3","text":"A pension fund adopts a 55/35/10 equity/bond/cash policy for the long term."},{"id":"PM-C1-0229-O4","text":"The portfolio's equity weight is 65% while its strategic target is 55%."}],"correctOptionId":"PM-C1-0229-O4","explanation":"Tình huống chính: The portfolio's equity weight is 65% while its strategic target is 55%. An overweight is an exposure above the reference or target allocation. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0230","chapter":1,"number":230,"topic":"Asset Allocation","level":"Intermediate","question":"Which example MOST directly demonstrates \"Underweight position\"?","options":[{"id":"PM-C1-0230-O1","text":"The portfolio's bond weight is 20% versus a long-run policy target of 35%."},{"id":"PM-C1-0230-O2","text":"A committee chooses equity, fixed-income, cash and real-estate proportions for its client."},{"id":"PM-C1-0230-O3","text":"A manager resists chasing last month's winning asset and follows IPS allocations."},{"id":"PM-C1-0230-O4","text":"An investment committee temporarily increases bonds because it expects weaker equity returns."}],"correctOptionId":"PM-C1-0230-O1","explanation":"Tình huống chính: The portfolio's bond weight is 20% versus a long-run policy target of 35%. An underweight is an exposure below the benchmark or policy weight. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0231","chapter":1,"number":231,"topic":"Asset Allocation","level":"Intermediate","question":"Which example MOST directly demonstrates \"Policy range\"?","options":[{"id":"PM-C1-0231-O1","text":"Shares rise and exceed their policy band; the fund trims shares toward target."},{"id":"PM-C1-0231-O2","text":"An IPS permits equities to move between 45% and 55% around a 50% target."},{"id":"PM-C1-0231-O3","text":"An adviser estimates trading costs and taxes before restoring a portfolio's exact weights."},{"id":"PM-C1-0231-O4","text":"A pension fund adopts a 55/35/10 equity/bond/cash policy for the long term."}],"correctOptionId":"PM-C1-0231-O2","explanation":"Tình huống chính: An IPS permits equities to move between 45% and 55% around a 50% target. Tolerance bands define acceptable drift before intervention. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0232","chapter":1,"number":232,"topic":"Asset Allocation","level":"Intermediate","question":"Which example MOST directly demonstrates \"Market-timing decision\"?","options":[{"id":"PM-C1-0232-O1","text":"An investment committee temporarily increases bonds because it expects weaker equity returns."},{"id":"PM-C1-0232-O2","text":"The portfolio's equity weight is 65% while its strategic target is 55%."},{"id":"PM-C1-0232-O3","text":"A manager substantially reduces equity risk because of a short-term market forecast."},{"id":"PM-C1-0232-O4","text":"A manager resists chasing last month's winning asset and follows IPS allocations."}],"correctOptionId":"PM-C1-0232-O3","explanation":"Tình huống chính: A manager substantially reduces equity risk because of a short-term market forecast. Market timing attempts to change exposure based on expected market movements. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0233","chapter":1,"number":233,"topic":"Asset Allocation","level":"Intermediate","question":"Which example MOST directly demonstrates \"Asset-class mix\"?","options":[{"id":"PM-C1-0233-O1","text":"A pension fund adopts a 55/35/10 equity/bond/cash policy for the long term."},{"id":"PM-C1-0233-O2","text":"Shares rise and exceed their policy band; the fund trims shares toward target."},{"id":"PM-C1-0233-O3","text":"The portfolio's bond weight is 20% versus a long-run policy target of 35%."},{"id":"PM-C1-0233-O4","text":"A committee chooses equity, fixed-income, cash and real-estate proportions for its client."}],"correctOptionId":"PM-C1-0233-O4","explanation":"Tình huống chính: A committee chooses equity, fixed-income, cash and real-estate proportions for its client. Asset-class mix is a cross-asset distribution decision. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0234","chapter":1,"number":234,"topic":"Asset Allocation","level":"Intermediate","question":"Which example MOST directly demonstrates \"Rebalancing cost\"?","options":[{"id":"PM-C1-0234-O1","text":"An adviser estimates trading costs and taxes before restoring a portfolio's exact weights."},{"id":"PM-C1-0234-O2","text":"An investment committee temporarily increases bonds because it expects weaker equity returns."},{"id":"PM-C1-0234-O3","text":"The portfolio's equity weight is 65% while its strategic target is 55%."},{"id":"PM-C1-0234-O4","text":"An IPS permits equities to move between 45% and 55% around a 50% target."}],"correctOptionId":"PM-C1-0234-O1","explanation":"Tình huống chính: An adviser estimates trading costs and taxes before restoring a portfolio's exact weights. Rebalancing has implementation costs that may alter the best timing. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0235","chapter":1,"number":235,"topic":"Asset Allocation","level":"Intermediate","question":"Which example MOST directly demonstrates \"Policy discipline\"?","options":[{"id":"PM-C1-0235-O1","text":"A manager substantially reduces equity risk because of a short-term market forecast."},{"id":"PM-C1-0235-O2","text":"A manager resists chasing last month's winning asset and follows IPS allocations."},{"id":"PM-C1-0235-O3","text":"Shares rise and exceed their policy band; the fund trims shares toward target."},{"id":"PM-C1-0235-O4","text":"The portfolio's bond weight is 20% versus a long-run policy target of 35%."}],"correctOptionId":"PM-C1-0235-O2","explanation":"Tình huống chính: A manager resists chasing last month's winning asset and follows IPS allocations. Policy discipline prevents temporary performance from overriding agreed strategy. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0236","chapter":1,"number":236,"topic":"Investment Strategies","level":"Intermediate","question":"Which example MOST directly demonstrates \"Active management\"?","options":[{"id":"PM-C1-0236-O1","text":"A fund selects stocks with the explicit aim of beating its market benchmark."},{"id":"PM-C1-0236-O2","text":"An analyst begins with individual company finances and valuations, not economic forecasts."},{"id":"PM-C1-0236-O3","text":"A trader studies historical prices, volumes and chart patterns."},{"id":"PM-C1-0236-O4","text":"A manager buys a security because estimated intrinsic value exceeds market quotation."}],"correctOptionId":"PM-C1-0236-O1","explanation":"Tình huống chính: A fund selects stocks with the explicit aim of beating its market benchmark. Active management seeks excess performance through discretionary decisions. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0237","chapter":1,"number":237,"topic":"Investment Strategies","level":"Intermediate","question":"Which example MOST directly demonstrates \"Passive management\"?","options":[{"id":"PM-C1-0237-O1","text":"A manager targets outperformance against a named market index, after costs."},{"id":"PM-C1-0237-O2","text":"A fund broadly replicates a market index at relatively low turnover."},{"id":"PM-C1-0237-O3","text":"An analyst values a business using cash flows, profitability and financial strength."},{"id":"PM-C1-0237-O4","text":"An equity portfolio buys its benchmark's constituent shares in nearly matching proportions."}],"correctOptionId":"PM-C1-0237-O2","explanation":"Tình huống chính: A fund broadly replicates a market index at relatively low turnover. Passive management aims to track an index rather than outperform it. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0238","chapter":1,"number":238,"topic":"Investment Strategies","level":"Intermediate","question":"Which example MOST directly demonstrates \"Top-down analysis\"?","options":[{"id":"PM-C1-0238-O1","text":"A manager buys a security because estimated intrinsic value exceeds market quotation."},{"id":"PM-C1-0238-O2","text":"An allocator increases equity weight after predicting improving aggregate earnings."},{"id":"PM-C1-0238-O3","text":"A research team starts with inflation, then sectors, and finally particular stocks."},{"id":"PM-C1-0238-O4","text":"A trader studies historical prices, volumes and chart patterns."}],"correctOptionId":"PM-C1-0238-O3","explanation":"Tình huống chính: A research team starts with inflation, then sectors, and finally particular stocks. Top-down analysis moves from macroeconomic views to industries and securities. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0239","chapter":1,"number":239,"topic":"Investment Strategies","level":"Intermediate","question":"Which example MOST directly demonstrates \"Bottom-up analysis\"?","options":[{"id":"PM-C1-0239-O1","text":"An equity portfolio buys its benchmark's constituent shares in nearly matching proportions."},{"id":"PM-C1-0239-O2","text":"A manager targets outperformance against a named market index, after costs."},{"id":"PM-C1-0239-O3","text":"A fund selects stocks with the explicit aim of beating its market benchmark."},{"id":"PM-C1-0239-O4","text":"An analyst begins with individual company finances and valuations, not economic forecasts."}],"correctOptionId":"PM-C1-0239-O4","explanation":"Tình huống chính: An analyst begins with individual company finances and valuations, not economic forecasts. Bottom-up analysis starts at security or company level. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0240","chapter":1,"number":240,"topic":"Investment Strategies","level":"Intermediate","question":"Which example MOST directly demonstrates \"Fundamental analysis\"?","options":[{"id":"PM-C1-0240-O1","text":"An analyst values a business using cash flows, profitability and financial strength."},{"id":"PM-C1-0240-O2","text":"A manager buys a security because estimated intrinsic value exceeds market quotation."},{"id":"PM-C1-0240-O3","text":"An allocator increases equity weight after predicting improving aggregate earnings."},{"id":"PM-C1-0240-O4","text":"A fund broadly replicates a market index at relatively low turnover."}],"correctOptionId":"PM-C1-0240-O1","explanation":"Tình huống chính: An analyst values a business using cash flows, profitability and financial strength. Fundamental analysis attempts to estimate intrinsic economic value. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0241","chapter":1,"number":241,"topic":"Investment Strategies","level":"Intermediate","question":"Which example MOST directly demonstrates \"Technical analysis\"?","options":[{"id":"PM-C1-0241-O1","text":"A research team starts with inflation, then sectors, and finally particular stocks."},{"id":"PM-C1-0241-O2","text":"A trader studies historical prices, volumes and chart patterns."},{"id":"PM-C1-0241-O3","text":"A manager targets outperformance against a named market index, after costs."},{"id":"PM-C1-0241-O4","text":"A fund selects stocks with the explicit aim of beating its market benchmark."}],"correctOptionId":"PM-C1-0241-O2","explanation":"Tình huống chính: A trader studies historical prices, volumes and chart patterns. Technical analysis studies market-price and volume information. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0242","chapter":1,"number":242,"topic":"Investment Strategies","level":"Intermediate","question":"Which example MOST directly demonstrates \"Index replication\"?","options":[{"id":"PM-C1-0242-O1","text":"A fund broadly replicates a market index at relatively low turnover."},{"id":"PM-C1-0242-O2","text":"An analyst begins with individual company finances and valuations, not economic forecasts."},{"id":"PM-C1-0242-O3","text":"An equity portfolio buys its benchmark's constituent shares in nearly matching proportions."},{"id":"PM-C1-0242-O4","text":"An allocator increases equity weight after predicting improving aggregate earnings."}],"correctOptionId":"PM-C1-0242-O3","explanation":"Tình huống chính: An equity portfolio buys its benchmark's constituent shares in nearly matching proportions. Replication is a passive way to obtain index exposure. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0243","chapter":1,"number":243,"topic":"Investment Strategies","level":"Intermediate","question":"Which example MOST directly demonstrates \"Security mispricing strategy\"?","options":[{"id":"PM-C1-0243-O1","text":"A fund selects stocks with the explicit aim of beating its market benchmark."},{"id":"PM-C1-0243-O2","text":"A research team starts with inflation, then sectors, and finally particular stocks."},{"id":"PM-C1-0243-O3","text":"An analyst values a business using cash flows, profitability and financial strength."},{"id":"PM-C1-0243-O4","text":"A manager buys a security because estimated intrinsic value exceeds market quotation."}],"correctOptionId":"PM-C1-0243-O4","explanation":"Tình huống chính: A manager buys a security because estimated intrinsic value exceeds market quotation. Seeking mispricing is an active valuation-based security decision. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0244","chapter":1,"number":244,"topic":"Investment Strategies","level":"Intermediate","question":"Which example MOST directly demonstrates \"Benchmark-relative objective\"?","options":[{"id":"PM-C1-0244-O1","text":"A manager targets outperformance against a named market index, after costs."},{"id":"PM-C1-0244-O2","text":"A fund broadly replicates a market index at relatively low turnover."},{"id":"PM-C1-0244-O3","text":"An analyst begins with individual company finances and valuations, not economic forecasts."},{"id":"PM-C1-0244-O4","text":"A trader studies historical prices, volumes and chart patterns."}],"correctOptionId":"PM-C1-0244-O1","explanation":"Tình huống chính: A manager targets outperformance against a named market index, after costs. A relative objective compares returns with a chosen benchmark. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0245","chapter":1,"number":245,"topic":"Investment Strategies","level":"Intermediate","question":"Which example MOST directly demonstrates \"Market forecast exposure\"?","options":[{"id":"PM-C1-0245-O1","text":"An equity portfolio buys its benchmark's constituent shares in nearly matching proportions."},{"id":"PM-C1-0245-O2","text":"An allocator increases equity weight after predicting improving aggregate earnings."},{"id":"PM-C1-0245-O3","text":"A research team starts with inflation, then sectors, and finally particular stocks."},{"id":"PM-C1-0245-O4","text":"An analyst values a business using cash flows, profitability and financial strength."}],"correctOptionId":"PM-C1-0245-O2","explanation":"Tình huống chính: An allocator increases equity weight after predicting improving aggregate earnings. Forecast-driven changing exposure is tactical or active allocation. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0246","chapter":1,"number":246,"topic":"Security Analysis","level":"Intermediate","question":"Which example MOST directly demonstrates \"Intrinsic value estimate\"?","options":[{"id":"PM-C1-0246-O1","text":"Projected cash flows are discounted to estimate an equity's economic worth."},{"id":"PM-C1-0246-O2","text":"An analyst estimates a stock's value at $38 while it trades for $51."},{"id":"PM-C1-0246-O3","text":"A researcher examines margins, profitability and earnings quality."},{"id":"PM-C1-0246-O4","text":"An analyst compares airline-sector competition and demand before naming specific stocks."}],"correctOptionId":"PM-C1-0246-O1","explanation":"Tình huống chính: Projected cash flows are discounted to estimate an equity's economic worth. Intrinsic value is an analyst's estimate, distinct from observed market price. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0247","chapter":1,"number":247,"topic":"Security Analysis","level":"Intermediate","question":"Which example MOST directly demonstrates \"Market quotation\"?","options":[{"id":"PM-C1-0247-O1","text":"An analyst studies a firm's balance sheet and competitive advantage."},{"id":"PM-C1-0247-O2","text":"A listed share trades at an observable exchange price of $42."},{"id":"PM-C1-0247-O3","text":"An analyst projects free cash flows and discounts them to present value."},{"id":"PM-C1-0247-O4","text":"An equity report starts by evaluating economic growth, inflation and rates."}],"correctOptionId":"PM-C1-0247-O2","explanation":"Tình huống chính: A listed share trades at an observable exchange price of $42. Market price is the current transacted or quoted price. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0248","chapter":1,"number":248,"topic":"Security Analysis","level":"Intermediate","question":"Which example MOST directly demonstrates \"Undervalued hypothesis\"?","options":[{"id":"PM-C1-0248-O1","text":"An analyst compares airline-sector competition and demand before naming specific stocks."},{"id":"PM-C1-0248-O2","text":"A manager chooses among approved stocks after comparing expected upside and risk."},{"id":"PM-C1-0248-O3","text":"An analyst estimates intrinsic value of $65 for a security offered at $50."},{"id":"PM-C1-0248-O4","text":"A researcher examines margins, profitability and earnings quality."}],"correctOptionId":"PM-C1-0248-O3","explanation":"Tình huống chính: An analyst estimates intrinsic value of $65 for a security offered at $50. Estimated value above price suggests undervaluation given the assumptions. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0249","chapter":1,"number":249,"topic":"Security Analysis","level":"Intermediate","question":"Which example MOST directly demonstrates \"Overvalued hypothesis\"?","options":[{"id":"PM-C1-0249-O1","text":"An equity report starts by evaluating economic growth, inflation and rates."},{"id":"PM-C1-0249-O2","text":"An analyst studies a firm's balance sheet and competitive advantage."},{"id":"PM-C1-0249-O3","text":"Projected cash flows are discounted to estimate an equity's economic worth."},{"id":"PM-C1-0249-O4","text":"An analyst estimates a stock's value at $38 while it trades for $51."}],"correctOptionId":"PM-C1-0249-O4","explanation":"Tình huống chính: An analyst estimates a stock's value at $38 while it trades for $51. Estimated value below price suggests overvaluation under the model. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0250","chapter":1,"number":250,"topic":"Security Analysis","level":"Intermediate","question":"Which example MOST directly demonstrates \"Discounted cash-flow approach\"?","options":[{"id":"PM-C1-0250-O1","text":"An analyst projects free cash flows and discounts them to present value."},{"id":"PM-C1-0250-O2","text":"An analyst compares airline-sector competition and demand before naming specific stocks."},{"id":"PM-C1-0250-O3","text":"A manager chooses among approved stocks after comparing expected upside and risk."},{"id":"PM-C1-0250-O4","text":"A listed share trades at an observable exchange price of $42."}],"correctOptionId":"PM-C1-0250-O1","explanation":"Tình huống chính: An analyst projects free cash flows and discounts them to present value. DCF estimates value from forecast future cash flows and discount rates. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0251","chapter":1,"number":251,"topic":"Security Analysis","level":"Intermediate","question":"Which example MOST directly demonstrates \"Earnings assessment\"?","options":[{"id":"PM-C1-0251-O1","text":"An analyst estimates intrinsic value of $65 for a security offered at $50."},{"id":"PM-C1-0251-O2","text":"A researcher examines margins, profitability and earnings quality."},{"id":"PM-C1-0251-O3","text":"An analyst studies a firm's balance sheet and competitive advantage."},{"id":"PM-C1-0251-O4","text":"Projected cash flows are discounted to estimate an equity's economic worth."}],"correctOptionId":"PM-C1-0251-O2","explanation":"Tình huống chính: A researcher examines margins, profitability and earnings quality. Earnings analysis studies the business's capacity to generate sustainable profit. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0252","chapter":1,"number":252,"topic":"Security Analysis","level":"Intermediate","question":"Which example MOST directly demonstrates \"Macroeconomic assessment\"?","options":[{"id":"PM-C1-0252-O1","text":"A listed share trades at an observable exchange price of $42."},{"id":"PM-C1-0252-O2","text":"An analyst estimates a stock's value at $38 while it trades for $51."},{"id":"PM-C1-0252-O3","text":"An equity report starts by evaluating economic growth, inflation and rates."},{"id":"PM-C1-0252-O4","text":"A manager chooses among approved stocks after comparing expected upside and risk."}],"correctOptionId":"PM-C1-0252-O3","explanation":"Tình huống chính: An equity report starts by evaluating economic growth, inflation and rates. Macroeconomic review considers economy-wide drivers of returns. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0253","chapter":1,"number":253,"topic":"Security Analysis","level":"Intermediate","question":"Which example MOST directly demonstrates \"Industry analysis\"?","options":[{"id":"PM-C1-0253-O1","text":"Projected cash flows are discounted to estimate an equity's economic worth."},{"id":"PM-C1-0253-O2","text":"An analyst estimates intrinsic value of $65 for a security offered at $50."},{"id":"PM-C1-0253-O3","text":"An analyst projects free cash flows and discounts them to present value."},{"id":"PM-C1-0253-O4","text":"An analyst compares airline-sector competition and demand before naming specific stocks."}],"correctOptionId":"PM-C1-0253-O4","explanation":"Tình huống chính: An analyst compares airline-sector competition and demand before naming specific stocks. Industry analysis evaluates prospects at the sector level. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0254","chapter":1,"number":254,"topic":"Security Analysis","level":"Intermediate","question":"Which example MOST directly demonstrates \"Company analysis\"?","options":[{"id":"PM-C1-0254-O1","text":"An analyst studies a firm's balance sheet and competitive advantage."},{"id":"PM-C1-0254-O2","text":"A listed share trades at an observable exchange price of $42."},{"id":"PM-C1-0254-O3","text":"An analyst estimates a stock's value at $38 while it trades for $51."},{"id":"PM-C1-0254-O4","text":"A researcher examines margins, profitability and earnings quality."}],"correctOptionId":"PM-C1-0254-O1","explanation":"Tình huống chính: An analyst studies a firm's balance sheet and competitive advantage. Company-level analysis evaluates individual issuer fundamentals. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0255","chapter":1,"number":255,"topic":"Security Analysis","level":"Intermediate","question":"Which example MOST directly demonstrates \"Security selection\"?","options":[{"id":"PM-C1-0255-O1","text":"An equity report starts by evaluating economic growth, inflation and rates."},{"id":"PM-C1-0255-O2","text":"A manager chooses among approved stocks after comparing expected upside and risk."},{"id":"PM-C1-0255-O3","text":"An analyst estimates intrinsic value of $65 for a security offered at $50."},{"id":"PM-C1-0255-O4","text":"An analyst projects free cash flows and discounts them to present value."}],"correctOptionId":"PM-C1-0255-O2","explanation":"Tình huống chính: A manager chooses among approved stocks after comparing expected upside and risk. Security selection ranks individual instruments for portfolio inclusion. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0256","chapter":1,"number":256,"topic":"Performance and Feedback","level":"Intermediate","question":"Which example MOST directly demonstrates \"Absolute return\"?","options":[{"id":"PM-C1-0256-O1","text":"A portfolio earned 8% over the calendar year, without reference to a benchmark."},{"id":"PM-C1-0256-O2","text":"An investor calculates an IRR that accounts for personal contributions and withdrawals."},{"id":"PM-C1-0256-O3","text":"A passive fund measures variability of its returns relative to an index."},{"id":"PM-C1-0256-O4","text":"Two portfolios' returns are compared after accounting for differences in volatility."}],"correctOptionId":"PM-C1-0256-O1","explanation":"Tình huống chính: A portfolio earned 8% over the calendar year, without reference to a benchmark. Absolute return reports performance on its own. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0257","chapter":1,"number":257,"topic":"Performance and Feedback","level":"Intermediate","question":"Which example MOST directly demonstrates \"Relative return\"?","options":[{"id":"PM-C1-0257-O1","text":"A review separates the manager's results into allocation and stock-selection contributions."},{"id":"PM-C1-0257-O2","text":"A portfolio returned 9% while its benchmark gained 7%, yielding 2 percentage points of excess return."},{"id":"PM-C1-0257-O3","text":"A global equity manager is evaluated against an agreed global stock index."},{"id":"PM-C1-0257-O4","text":"A portfolio's gross return is reduced by advisory and trading fees to calculate investor experience."}],"correctOptionId":"PM-C1-0257-O2","explanation":"Tình huống chính: A portfolio returned 9% while its benchmark gained 7%, yielding 2 percentage points of excess return. Relative performance compares the investment to a reference. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0258","chapter":1,"number":258,"topic":"Performance and Feedback","level":"Intermediate","question":"Which example MOST directly demonstrates \"Time-weighted return\"?","options":[{"id":"PM-C1-0258-O1","text":"Two portfolios' returns are compared after accounting for differences in volatility."},{"id":"PM-C1-0258-O2","text":"The investor updates allocation policy after evaluating changing goals and results."},{"id":"PM-C1-0258-O3","text":"A manager wants to measure performance without rewarding client cash deposits made at lucky times."},{"id":"PM-C1-0258-O4","text":"A passive fund measures variability of its returns relative to an index."}],"correctOptionId":"PM-C1-0258-O3","explanation":"Tình huống chính: A manager wants to measure performance without rewarding client cash deposits made at lucky times. Time-weighted return reduces the effect of the timing of external cash flows. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0259","chapter":1,"number":259,"topic":"Performance and Feedback","level":"Intermediate","question":"Which example MOST directly demonstrates \"Money-weighted return\"?","options":[{"id":"PM-C1-0259-O1","text":"A portfolio's gross return is reduced by advisory and trading fees to calculate investor experience."},{"id":"PM-C1-0259-O2","text":"A review separates the manager's results into allocation and stock-selection contributions."},{"id":"PM-C1-0259-O3","text":"A portfolio earned 8% over the calendar year, without reference to a benchmark."},{"id":"PM-C1-0259-O4","text":"An investor calculates an IRR that accounts for personal contributions and withdrawals."}],"correctOptionId":"PM-C1-0259-O4","explanation":"Tình huống chính: An investor calculates an IRR that accounts for personal contributions and withdrawals. Money-weighted return reflects the timing and sizes of the investor's cash flows. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0260","chapter":1,"number":260,"topic":"Performance and Feedback","level":"Intermediate","question":"Which example MOST directly demonstrates \"Benchmark selection\"?","options":[{"id":"PM-C1-0260-O1","text":"A global equity manager is evaluated against an agreed global stock index."},{"id":"PM-C1-0260-O2","text":"Two portfolios' returns are compared after accounting for differences in volatility."},{"id":"PM-C1-0260-O3","text":"The investor updates allocation policy after evaluating changing goals and results."},{"id":"PM-C1-0260-O4","text":"A portfolio returned 9% while its benchmark gained 7%, yielding 2 percentage points of excess return."}],"correctOptionId":"PM-C1-0260-O1","explanation":"Tình huống chính: A global equity manager is evaluated against an agreed global stock index. A relevant benchmark matches the investment mandate. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0261","chapter":1,"number":261,"topic":"Performance and Feedback","level":"Intermediate","question":"Which example MOST directly demonstrates \"Tracking error\"?","options":[{"id":"PM-C1-0261-O1","text":"A manager wants to measure performance without rewarding client cash deposits made at lucky times."},{"id":"PM-C1-0261-O2","text":"A passive fund measures variability of its returns relative to an index."},{"id":"PM-C1-0261-O3","text":"A review separates the manager's results into allocation and stock-selection contributions."},{"id":"PM-C1-0261-O4","text":"A portfolio earned 8% over the calendar year, without reference to a benchmark."}],"correctOptionId":"PM-C1-0261-O2","explanation":"Tình huống chính: A passive fund measures variability of its returns relative to an index. Tracking error quantifies dispersion of active returns around benchmark returns. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0262","chapter":1,"number":262,"topic":"Performance and Feedback","level":"Intermediate","question":"Which example MOST directly demonstrates \"Net performance\"?","options":[{"id":"PM-C1-0262-O1","text":"A portfolio returned 9% while its benchmark gained 7%, yielding 2 percentage points of excess return."},{"id":"PM-C1-0262-O2","text":"An investor calculates an IRR that accounts for personal contributions and withdrawals."},{"id":"PM-C1-0262-O3","text":"A portfolio's gross return is reduced by advisory and trading fees to calculate investor experience."},{"id":"PM-C1-0262-O4","text":"The investor updates allocation policy after evaluating changing goals and results."}],"correctOptionId":"PM-C1-0262-O3","explanation":"Tình huống chính: A portfolio's gross return is reduced by advisory and trading fees to calculate investor experience. Net return reflects relevant investment costs. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0263","chapter":1,"number":263,"topic":"Performance and Feedback","level":"Intermediate","question":"Which example MOST directly demonstrates \"Risk-adjusted evaluation\"?","options":[{"id":"PM-C1-0263-O1","text":"A portfolio earned 8% over the calendar year, without reference to a benchmark."},{"id":"PM-C1-0263-O2","text":"A manager wants to measure performance without rewarding client cash deposits made at lucky times."},{"id":"PM-C1-0263-O3","text":"A global equity manager is evaluated against an agreed global stock index."},{"id":"PM-C1-0263-O4","text":"Two portfolios' returns are compared after accounting for differences in volatility."}],"correctOptionId":"PM-C1-0263-O4","explanation":"Tình huống chính: Two portfolios' returns are compared after accounting for differences in volatility. Risk-adjusted evaluation considers risk undertaken to earn returns. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0264","chapter":1,"number":264,"topic":"Performance and Feedback","level":"Intermediate","question":"Which example MOST directly demonstrates \"Attribution analysis\"?","options":[{"id":"PM-C1-0264-O1","text":"A review separates the manager's results into allocation and stock-selection contributions."},{"id":"PM-C1-0264-O2","text":"A portfolio returned 9% while its benchmark gained 7%, yielding 2 percentage points of excess return."},{"id":"PM-C1-0264-O3","text":"An investor calculates an IRR that accounts for personal contributions and withdrawals."},{"id":"PM-C1-0264-O4","text":"A passive fund measures variability of its returns relative to an index."}],"correctOptionId":"PM-C1-0264-O1","explanation":"Tình huống chính: A review separates the manager's results into allocation and stock-selection contributions. Attribution analyzes sources of relative performance. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0265","chapter":1,"number":265,"topic":"Performance and Feedback","level":"Intermediate","question":"Which example MOST directly demonstrates \"Monitoring feedback\"?","options":[{"id":"PM-C1-0265-O1","text":"A portfolio's gross return is reduced by advisory and trading fees to calculate investor experience."},{"id":"PM-C1-0265-O2","text":"The investor updates allocation policy after evaluating changing goals and results."},{"id":"PM-C1-0265-O3","text":"A manager wants to measure performance without rewarding client cash deposits made at lucky times."},{"id":"PM-C1-0265-O4","text":"A global equity manager is evaluated against an agreed global stock index."}],"correctOptionId":"PM-C1-0265-O2","explanation":"Tình huống chính: The investor updates allocation policy after evaluating changing goals and results. Feedback combines evaluation with suitable revisions to implementation. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0266","chapter":1,"number":266,"topic":"Portfolio & Asset Classes","level":"Intermediate","question":"Why does this situation qualify as \"Investment portfolio\"? A client owns bonds, equities and investment property in one coordinated holding.","options":[{"id":"PM-C1-0266-O1","text":"A portfolio brings together different investment assets under a common strategy."},{"id":"PM-C1-0266-O2","text":"Common shares represent ownership and residual corporate claims."},{"id":"PM-C1-0266-O3","text":"Asset classes group investments with broadly similar economic characteristics."},{"id":"PM-C1-0266-O4","text":"Gold is a commodity and differs from a claim on a corporate issuer."}],"correctOptionId":"PM-C1-0266-O1","explanation":"Nguyên nhân cốt lõi: A portfolio brings together different investment assets under a common strategy. Không đánh đồng với các giải thích thuộc khái niệm khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0267","chapter":1,"number":267,"topic":"Portfolio & Asset Classes","level":"Intermediate","question":"Why does this situation qualify as \"Financial asset\"? An investor acquires a corporate note that gives re."},{"id":"PM-C1-0275-O3","text":"Real assets have intrinsic physical or productive form, unlike claims issued by others."},{"id":"PM-C1-0275-O4","text":"Bonds are creditor claims with contractual payment terms."}],"correctOptionId":"PM-C1-0275-O2","explanation":"Nguyên nhân cốt lõi: Concentration creates a large dependence on one issuer or exposure. Không đánh đồng với các giải thích thuộc khái niệm khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0276","chapter":1,"number":276,"topic":"Investment Funds & Services","level":"Intermediate","question":"Why does this situation qualify as \"Pooled investment fund\"? Hundreds of investors contribute capital that is managed as one portfolio.","options":[{"id":"PM-C1-0276-O1","text":"A pooled fund combines investors' money into a common investment vehicle."},{"id":"PM-C1-0276-O2","text":"NAV per unit is net fund asset value divided by the number of units."},{"id":"PM-C1-0276-O3","text":"Operating expenses reduce the investor's return compared with gross portfolio performance."},{"id":"PM-C1-0276-O4","text":"The mandate specifies eligible assets, objectives and constraints for fund operations."}],"correctOptionId":"PM-C1-0276-O1","explanation":"Nguyên nhân cốt lõi: A pooled fund combines investors' money into a common investment vehicle. Không đánh đồng với các giải thích thuộc khái niệm khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0277","chapter":1,"number":277,"topic":"Investment Funds & Services","level":"Intermediate","question":"Why does this situation qualify as \"Fund ownership units\"? Two investors receive fund units in proportion to their subscriptions.","options":[{"id":"PM-C1-0277-O1","text":"Custody concerns safekeeping of holdings rather than strategy selection."},{"id":"PM-C1-0277-O2","text":"Fund interests represent proportional participation, subject to the fund terms."},{"id":"PM-C1-0277-O3","text":"ETF shares can trade on a securities exchange during the trading day."},{"id":"PM-C1-0277-O4","text":"An index fund pursues benchmark exposure rather than discretionary stock outperformance."}],"correctOptionId":"PM-C1-0277-O2","explanation":"Nguyên nhân cốt lõi: Fund interests represent proportional participation, subject to the fund terms. Không đánh đồng với các giải thích thuộc khái niệm khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0278","chapter":1,"number":278,"topic":"Investment Funds & Services","level":"Intermediate","question":"Why does this situation qualify as \"Professional management\"? A regulated manager selects securities and monitors pooled investments on investors' behalf.","options":[{"id":"PM-C1-0278-O1","text":"The mandate specifies eligible assets, objectives and constraints for fund operations."},{"id":"PM-C1-0278-O2","text":"Fund liquidity reflects the ability to convert units into cash under applicable rules."},{"id":"PM-C1-0278-O3","text":"Professional managers make allocation and security decisions according to mandate."},{"id":"PM-C1-0278-O4","text":"Operating expenses reduce the investor's return compared with gross portfolio performance."}],"correctOptionId":"PM-C1-0278-O3","explanation":"Nguyên nhân cốt lõi: Professional managers make allocation and security decisions according to mandate. Không đánh đồng với các giải thích thuộc khái niệm khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0279","chapter":1,"number":279,"topic":"Investment Funds & Services","level":"Intermediate","question":"Why does this situation qualify as \"Mutual fund net asset value\"? A fund values portfolio assets, subtracts liabilities and divides the remainder by outstanding units.","options":[{"id":"PM-C1-0279-O1","text":"An index fund pursues benchmark exposure rather than discretionary stock outperformance."},{"id":"PM-C1-0279-O2","text":"Custody concerns safekeeping of holdings rather than strategy selection."},{"id":"PM-C1-0279-O3","text":"A pooled fund combines investors' money into a common investment vehicle."},{"id":"PM-C1-0279-O4","text":"NAV per unit is net fund asset value divided by the number of units."}],"correctOptionId":"PM-C1-0279-O4","explanation":"Nguyên nhân cốt lõi: NAV per unit is net fund asset value divided by the number of units. Không đánh đồng với các giải thích thuộc khái niệm khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0280","chapter":1,"number":280,"topic":"Investment Funds & Services","level":"Intermediate","question":"Why does this situation qualify as \"Exchange-traded fund\"? A fund share is bought during a market session through an exchange order.","options":[{"id":"PM-C1-0280-O1","text":"ETF shares can trade on a securities exchange during the trading day."},{"id":"PM-C1-0280-O2","text":"The mandate specifies eligible assets, objectives and constraints for fund operations."},{"id":"PM-C1-0280-O3","text":"Fund liquidity reflects the ability to convert units into cash under applicable rules."},{"id":"PM-C1-0280-O4","text":"Fund interests represent proportional participation, subject to the fund terms."}],"correctOptionId":"PM-C1-0280-O1","explanation":"Nguyên nhân cốt lõi: ETF shares can trade on a securities exchange during the trading day. Không đánh đồng với các giải thích thuộc khái niệm khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0281","chapter":1,"number":281,"topic":"Investment Funds & Services","level":"Intermediate","question":"Why does this situation qualify as \"Fund expense ratio\"? A fund deducts recurring operating costs from assets, reducing the investor's net return.","options":[{"id":"PM-C1-0281-O1","text":"Professional managers make allocation and security decisions according to mandate."},{"id":"PM-C1-0281-O2","text":"Operating expenses reduce the investor's return compared with gross portfolio performance."},{"id":"PM-C1-0281-O3","text":"Custody concerns safekeeping of holdings rather than strategy selection."},{"id":"PM-C1-0281-O4","text":"A pooled fund combines investors' money into a common investment vehicle."}],"correctOptionId":"PM-C1-0281-O2","explanation":"Nguyên nhân cốt lõi: Operating expenses reduce the investor's return compared with gross portfolio performance. Không đánh đồng với các giải thích thuộc khái niệm khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0282","chapter":1,"number":282,"topic":"Investment Funds & Services","level":"Intermediate","question":"Why does this situation qualify as \"Index-tracking fund\"? A manager aims to replicate the weights and returns of a specified index.","options":[{"id":"PM-C1-0282-O1","text":"Fund interests represent proportional participation, subject to the fund terms."},{"id":"PM-C1-0282-O2","text":"NAV per unit is net fund asset value divided by the number of units."},{"id":"PM-C1-0282-O3","text":"An index fund pursues benchmark exposure rather than discretionary stock outperformance."},{"id":"PM-C1-0282-O4","text":"Fund liquidity reflects the ability to convert units into cash under applicable rules."}],"correctOptionId":"PM-C1-0282-O3","explanation":"Nguyên nhân cốt lõi: An index fund pursues benchmark exposure rather than discretionary stock outperformance. Không đánh đồng với các giải thích thuộc khái niệm khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0283","chapter":1,"number":283,"topic":"Investment Funds & Services","level":"Intermediate","question":"Why does this situation qualify as \"Fund mandate\"? Investors sign up to a fund that is permitted to hold only investment-grade fixed income.","options":[{"id":"PM-C1-0283-O1","text":"A pooled fund combines investors' money into a common investment vehicle."},{"id":"PM-C1-0283-O2","text":"Professional managers make allocation and security decisions according to mandate."},{"id":"PM-C1-0283-O3","text":"ETF shares can trade on a securities exchange during the trading day."},{"id":"PM-C1-0283-O4","text":"The mandate specifies eligible assets, objectives and constraints for fund operations."}],"correctOptionId":"PM-C1-0283-O4","explanation":"Nguyên nhân cốt lõi: The mandate specifies eligible assets, objectives and constraints for fund operations. Không đánh đồng với các giải thích thuộc khái niệm khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0284","chapter":1,"number":284,"topic":"Investment Funds & Services","level":"Intermediate","question":"Why does this situation qualify as \"Custody arrangement\"? A designated independent institution safeguards portfolio assets while a manager decides investments.","options":[{"id":"PM-C1-0284-O1","text":"Custody concerns safekeeping of holdings rather than strategy selection."},{"id":"PM-C1-0284-O2","text":"Fund interests represent proportional participation, subject to the fund terms."},{"id":"PM-C1-0284-O3","text":"NAV per unit is net fund asset value divided by the number of units."},{"id":"PM-C1-0284-O4","text":"Operating expenses reduce the investor's return compared with gross portfolio performance."}],"correctOptionId":"PM-C1-0284-O1","explanation":"Nguyên nhân cốt lõi: Custody concerns safekeeping of holdings rather than strategy selection. Không đánh đồng với các giải thích thuộc khái niệm khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0285","chapter":1,"number":285,"topic":"Investment Funds & Services","level":"Intermediate","question":"Why does this situation qualify as \"Liquidity of fund units\"? An investor checks redemption frequency, settlement dates and exchange trading depth.","options":[{"id":"PM-C1-0285-O1","text":"An index fund pursues benchmark exposure rather than discretionary stock outperformance."},{"id":"PM-C1-0285-O2","text":"Fund liquidity reflects the ability to convert units into cash under applicable rules."},{"id":"PM-C1-0285-O3","text":"Professional managers make allocation and security decisions according to mandate."},{"id":"PM-C1-0285-O4","text":"ETF shares can trade on a securities exchange during the trading day."}],"correc ans owning the underlying real estate itself."},{"id":"PM-C1-0375-O2","text":"Concentrated position: Concentration creates a large dependence on one issuer or exposure."},{"id":"PM-C1-0375-O3","text":"Real asset: Real assets have intrinsic physical or productive form, unlike claims issued by others."},{"id":"PM-C1-0375-O4","text":"Debt security: Bonds are creditor claims with contractual payment terms."}],"correctOptionId":"PM-C1-0375-O2","explanation":"Phân loại đúng là Concentrated position: Concentration creates a large dependence on one issuer or exposure. Nhận dạng theo bản chất sự việc, không dựa vào từ khóa gây nhiễu.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0376","chapter":1,"number":376,"topic":"Investment Funds & Services","level":"Advanced","question":"A trainee labels the case below as \"Mutual fund net asset value\": Hundreds of investors contribute capital that is managed as one portfolio. Which concept-and-explanation pair corrects the classification?","options":[{"id":"PM-C1-0376-O1","text":"Pooled investment fund: A pooled fund combines investors' money into a common investment vehicle."},{"id":"PM-C1-0376-O2","text":"Mutual fund net asset value: NAV per unit is net fund asset value divided by the number of units."},{"id":"PM-C1-0376-O3","text":"Fund expense ratio: Operating expenses reduce the investor's return compared with gross portfolio performance."},{"id":"PM-C1-0376-O4","text":"Fund mandate: The mandate specifies eligible assets, objectives and constraints for fund operations."}],"correctOptionId":"PM-C1-0376-O1","explanation":"Phân loại đúng là Pooled investment fund: A pooled fund combines investors' money into a common investment vehicle. Nhận dạng theo bản chất sự việc, không dựa vào từ khóa gây nhiễu.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0377","chapter":1,"number":377,"topic":"Investment Funds & Services","level":"Advanced","question":"A trainee labels the case below as \"Exchange-traded fund\": T const DEFAULT={theme:'light',font:'normal',shuffleQ:true,shuffleA:true,mode:'practice',stats:{},wrongIds:[],bookmarks:[],sessions:[],activeSession:null};
let state=loadState(); let page='dashboard'; let session=null; let timerHandle=null; let bankQuery=''; let bankChapter='all'; let bankStatus='all';
