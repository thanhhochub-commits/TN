<style>
:root{--bg:#f5f7fb;--panel:#ffffff;--panel2:#f9fafb;--text:#111827;--muted:#64748b;--line:#e5e7eb;--primary:#2563eb;--primary2:#1d4ed8;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--warn:#a16207;--shadow:0 10px 35px rgba(15,23,42,.08);--radius:18px;--font:16px}

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:var(--font)/1.52 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;overflow:auto;z-index:20}.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 18px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:800}.brand b{font-size:17px}.brand small{display:block;color:var(--muted)}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--text);padding:11px 12px;border-radius:12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center}.nav button:hover,.nav button.active{background:var(--panel2)}.nav button.active{font-weight:700;color:var(--primary)}.side-foot{margin-top:18px;padding:13px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px}.main{min-width:0}.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:10px}.menu-btn{display:none}.topbar .spacer{flex:1}.icon-btn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:12px;cursor:pointer;transition:.18s transform,.18s background,.18s border}.btn:hover,.icon-btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--primary) 45%,var(--line))}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}.btn.danger{color:var(--bad)}.content{max-width:1180px;margin:0 auto;padding:26px 22px 70px}.page-title{margin:0 0 6px;font-size:28px;letter-spacing:-.02em}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.stat{grid-column:span 3}.stat .n{font-size:28px;font-weight:800}.stat .l{color:var(--muted);font-size:13px}.progress{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);width:0}.section-title{font-size:18px;margin:0 0 12px}.chapter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chapter-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2)}.chapter-item input{width:18px;height:18px}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 11px;border-radius:11px;outline:none}.field input:focus,.field select:focus{border-color:var(--primary)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toggle{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.toggle input{width:18px;height:18px}.setup{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.quiz-wrap{max-width:900px;margin:0 auto}.quiz-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}.quiz-head .progress{flex:1}.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel2);padding:5px 8px;border-radius:999px}.question{font-size:20px;font-weight:760;line-height:1.45;margin:14px 0 16px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:13px 14px;border-radius:14px;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;transition:.16s transform,.16s border,.16s background}.option:hover:not(:disabled){transform:translateY(-1px);border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}.option:disabled{cursor:default}.option.selected{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--panel2))}.option.selected .opt-letter{border-color:var(--primary);color:var(--primary)}.opt-letter{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--panel)}.option.correct{border-color:var(--ok);background:var(--okbg)}.option.correct .opt-letter{border-color:var(--ok);color:var(--ok)}.option.wrong{border-color:var(--bad);background:var(--badbg)}.option.wrong .opt-letter{border-color:var(--bad);color:var(--bad)}.option.review{border-color:#d97706;background:color-mix(in srgb,#f59e0b 12%,var(--panel))}.option.review .opt-letter{border-color:#d97706;color:#d97706}.feedback.review{border-color:#d97706;background:color-mix(in srgb,#f59e0b 10%,var(--panel))}.feedback{margin-top:14px;border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--panel2)}.feedback.good{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}.feedback.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}.feedback b{display:block;margin-bottom:5px}.explanation{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}.quiz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.navigator{display:flex;gap:6px;overflow:auto;padding:10px 0 2px}.navq{min-width:34px;height:34px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;cursor:pointer}.navq.current{outline:2px solid var(--primary)}.navq.answered{background:color-mix(in srgb,var(--primary) 12%,var(--panel))}.navq.correct{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.navq.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}.list{display:grid;gap:10px}.q-row{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:14px}.q-row h4{margin:0 0 7px;font-size:15px}.q-row .meta{font-size:12px;color:var(--muted)}.q-row .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.searchbar{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;margin-bottom:14px}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.toast{position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--panel);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translateY(0)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;padding:20px;z-index:99}.modal.open{display:grid}.modal-card{max-width:620px;width:100%;max-height:85vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.kpi-table{width:100%;border-collapse:collapse}.kpi-table th,.kpi-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.right{text-align:right!important}.muted{color:var(--muted)}.hidden{display:none!important}.test-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.test-summary .card{box-shadow:none}.timer{font-variant-numeric:tabular-nums;font-weight:800}.bookmark.active{color:#eab308;border-color:#eab308}.danger-zone{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-280px;width:260px;transition:.22s left;box-shadow:var(--shadow)}.sidebar.open{left:0}.menu-btn{display:inline-flex}.stat{grid-column:span 6}.setup{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr 1fr}.searchbar>*:first-child{grid-column:1/-1}.content{padding:20px 14px 70px}.topbar{padding:10px 14px}.question{font-size:18px}}
@media(max-width:560px){.stat{grid-column:span 12}.chapter-grid{grid-template-columns:1fr}.test-summary{grid-template-columns:1fr}.quiz-card{padding:16px}.option{padding:11px}.quiz-actions{position:sticky;bottom:10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);padding:8px;border-radius:14px}.searchbar{grid-template-columns:1fr}.page-title{font-size:24px}}

<script>
const QUESTIONS = [{"id":"PM120-C1-Q01","chapter":1,"number":1,"question":"Why is an IPS useful when evaluating a portfolio manager?\nTại sao Tuyên bố Chính sách Đầu tư (IPS) lại hữu ích khi đánh giá một nhà quản lý danh mục đầu tư?","options":[{"id":"PM120-C1-Q01-O1","text":"It provides predetermined objectives and benchmarks against which decisions and results can be assessed. (Nó cung cấp các mục tiêu và chỉ số tham chiếu (benchmark) được xác định trước để đánh giá các quyết định và kết quả.)"},{"id":"PM120-C1-Q01-O2","text":"It eliminates all investment constraints. (Nó loại bỏ tất cả các hạn chế đầu tư.)"},{"id":"PM120-C1-Q01-O3","text":"It ensures that the manager always beats the market. (Nó đảm bảo nhà quản lý luôn đánh bại thị trường.)"},{"id":"PM120-C1-Q01-O4","text":"It allows the manager to change the client’s objectives without consultation. (Nó cho phép nhà quản lý thay đổi mục tiêu của khách hàng mà không cần thảo luận.)"}],"correctOptionId":"PM120-C1-Q01-O1","explanation":"Giải thích chi tiết:\n• a. ĐÚNG: IPS thiết lập các tiêu chuẩn, mục tiêu lợi nhuận/rủi ro và chỉ số benchmark cụ thể ngay từ đầu để làm cơ sở đo\nlường và đánh giá hiệu quả hoạt động của nhà quản lý.\n• b. SAI: IPS không loại bỏ các hạn chế, mà ngược lại, IPS dùng để xác định và làm rõ các hạn chế (thanh khoản, thuế, pháp\nlý, thời gian, v.v.).\n• c. SAI: Không có văn bản nào có thể đảm bảo 100% việc luôn đánh bại thị trường.\n• d. SAI: IPS được tạo ra để bảo vệ nhà đầu tư, ngăn chặn việc nhà quản lý tự ý đưa ra quyết định không phù hợp hoặc tự đổi\nmục tiêu của khách hàng.\nSupplementary English explanation (added, not part of the original file): An IPS defines objectives, constraints and\nbenchmarks before management decisions, allowing performance to be evaluated consistently.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q02","chapter":1,"number":2,"question":"Which statement best describes the relationship between risk and expected return in investment decision-making?\nPhát biểu nào mô tả đúng nhất mối quan hệ giữa rủi ro và lợi nhuận kỳ vọng trong việc đưa ra quyết định đầu tư?","options":[{"id":"PM120-C1-Q02-O1","text":"Investors normally require more expected return for accepting more risk. (Nhà đầu tư thường yêu cầu lợi nhuận kỳ vọng cao hơn khi chấp nhận nhiều rủi ro hơn.)"},{"id":"PM120-C1-Q02-O2","text":"Low-risk assets should always provide the highest return. (Các tài sản rủi ro thấp luôn mang lại lợi nhuận cao nhất.)"},{"id":"PM120-C1-Q02-O3","text":"Expected return is unrelated to investor risk preferences. (Lợi nhuận kỳ vọng không liên quan đến mức độ chấp nhận rủi ro của nhà đầu tư.)"},{"id":"PM120-C1-Q02-O4","text":"Higher risk always produces higher realized return. (Rủi ro cao hơn luôn tạo ra lợi nhuận thực tế (realized return) cao hơn.)"}],"correctOptionId":"PM120-C1-Q02-O1","explanation":"Giải thích chi tiết:\n• a. ĐÚNG: Theo lý thuyết tài chính và lý thuyết Markowitz, nhà đầu tư có tâm lý ngại rủi ro (risk-averse) chỉ chấp nhận rủi\nro cao hơn nếu họ được bù đắp bằng một mức lợi nhuận kỳ vọng cao hơn.\n• b. SAI: Tài sản rủi ro thấp (như tín phiếu kho bạc) thường có lợi nhuận kỳ vọng thấp nhất.\n• c. SAI: Lợi nhuận kỳ vọng và mức độ chấp nhận rủi ro có mối quan hệ trực tiếp và phải được xem xét đồng thời khi lập kế\nhoạch.\n• d. SAI: Cần phân biệt *Lợi nhuận kỳ vọng (Expected return) và *Lợi nhuận thực tế (Realized return). Rủi ro cao nghĩa là\nbiên độ biến động rộng, rủi ro cao không đảm bảo lợi nhuận thực tế thu về sẽ cao (có thể thua lỗ nặng).\nSupplementary English explanation (added, not part of the original file): Risk-averse investors generally demand higher\nexpected returns for bearing more risk. Higher realized returns are not guaranteed.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q03","chapter":1,"number":3,"question":"An investor is 28 years old, has stable employment, adequate insurance, an emergency reserve, and a retirement goal 35 years away. Which investment orientation is most consistent with these circumstances?\nMột nhà đầu tư 28 tuổi, có công việc ổn định, bảo hiểm đầy đủ, quỹ dự phòng khẩn cấp và mục tiêu nghỉ hưu sau 35 năm nữa. Định hướng đầu tư nào phù hợp nhất với hoàn cảnh này?","options":[{"id":"PM120-C1-Q03-O1","text":"Strong emphasis on capital preservation only. (Chỉ tập trung mạnh vào việc bảo toàn vốn.)"},{"id":"PM120-C1-Q03-O2","text":"Exclusive investment in short-term cash instruments. (Chỉ đầu tư duy nhất vào các công cụ tiền mặt ngắn hạn.)"},{"id":"PM120-C1-Q03-O3","text":"Complete avoidance of equities. (Hoàn toàn tránh xa cổ phiếu.)"},{"id":"PM120-C1-Q03-O4","text":"Relatively high tolerance for growth-oriented investments. (Mức độ chấp nhận tương đối cao đối với các khoản đầu tư hướng tới tăng trưởng.)"}],"correctOptionId":"PM120-C1-Q03-O4","explanation":"Giải thích chi tiết:\n• d. ĐÚNG: Nhà đầu tư đang ở Giai đoạn Tích lũy (Accumulation phase) trong chu kỳ đời sống (20–40 tuổi). Với thời gian\nđầu tư dài (35 năm), thu nhập ổn định và đã có bảo hiểm/quỹ dự phòng, nhà đầu tư có khả năng chịu đựng rủi ro cao và nên\ntập trung vào các tài sản tăng trưởng (như cổ phiếu) để tích lũy tài sản dài hạn.\n• a, b, c. SAI: Các lựa chọn này mang tính quá an toàn/thủ hiểm (capital preservation), chỉ phù hợp cho người đã về nghỉ hưu\n(Spending phase) hoặc những người có rủi ro thanh khoản cao.\nSupplementary English explanation (added, not part of the original file): The long horizon, stable income, insurance and\nemergency reserves support greater risk capacity and a growth-oriented allocation.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q04","chapter":1,"number":4,"question":"Why should both risk and return objectives be considered together when developing an investment plan?\nTại sao cả mục tiêu rủi ro và mục tiêu lợi nhuận phải được xem xét cùng nhau khi xây dựng kế hoạch đầu tư?","options":[{"id":"PM120-C1-Q04-O1","text":"Because all investors have the same optimal risk level. (Vì tất cả nhà đầu tư đều có cùng một mức rủi ro tối ưu.)"},{"id":"PM120-C1-Q04-O2","text":"Because higher return objectives generally involve accepting greater investment risk. (Vì các mục tiêu lợi nhuận cao hơn thường đòi hỏi phải chấp nhận rủi ro đầu tư lớn hơn.)"},{"id":"PM120-C1-Q04-O3","text":"Because return objectives can be set independently of investor constraints. (Vì mục tiêu lợi nhuận có thể được đặt ra độc lập với các hạn chế của nhà đầu tư.)"},{"id":"PM120-C1-Q04-O4","text":"Because risk matters only after securities have been purchased. (Vì rủi ro chỉ quan trọng sau khi chứng khoán đã được mua.)"}],"correctOptionId":"PM120-C1-Q04-O2","explanation":"Giải thích chi tiết:\n• b. ĐÚNG: Trong quản lý danh mục, rủi ro và lợi nhuận là hai mặt của một đồng xu. Đặt mục tiêu lợi nhuận cao hơn đồng\nnghĩa với việc phải phân bổ vào các tài sản rủi ro hơn.\n• a. SAI: Mỗi nhà đầu tư có tuổi tác, thu nhập, tâm lý và hạn chế khác nhau nên mức rủi ro tối ưu là hoàn toàn khác nhau.\n• c. SAI: Mục tiêu lợi nhuận bị ràng buộc chặt chẽ bởi mức độ chấp nhận rủi ro và các hạn chế (thời gian, thanh khoản,\nthuế...).\n• d. SAI: Rủi ro phải được phân tích, đo lường và lập kế hoạch trước khi ra quyết định mua chứng khoán.\nSupplementary English explanation (added, not part of the original file): Risk and return objectives must be consistent: a\nhigher return target generally requires accepting more investment risk.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q05","chapter":1,"number":5,"question":"Which activity belongs primarily to the planning stage of portfolio management?\nHoạt động nào thuộc về giai đoạn Lập kế hoạch (Planning stage) trong quy trình quản lý danh mục đầu tư?","options":[{"id":"PM120-C1-Q05-O1","text":"Selling a security because its portfolio weight has exceeded its target. (Bán một chứng khoán vì tỷ trọng của nó trong danh mục đã vượt quá mục tiêu.)"},{"id":"PM120-C1-Q05-O2","text":"Executing an order to purchase shares. (Thực thi lệnh mua cổ phiếu.)"},{"id":"PM120-C1-Q05-O3","text":"Calculating the portfolio’s realized return after one year. (Tính toán lợi nhuận thực tế của danh mục sau một năm.)"},{"id":"PM120-C1-Q05-O4","text":"Establishing long-term asset-class weights consistent with the investor’s objectives. (Thiết lập tỷ trọng các lớp tài sản dài hạn phù hợp với mục tiêu của nhà đầu tư.)"}],"correctOptionId":"PM120-C1-Q05-O4","explanation":"Giải thích chi tiết:\n• d. ĐÚNG: Quy trình quản lý danh mục gồm 3 giai đoạn: Lập kế hoạch (Planning) -> Thực thi (Implementation) -> Phản hồi\n(Feedback). Việc xác định mục tiêu, các hạn chế, lập IPS và đưa ra Phân bổ tài sản chiến lược (Strategic Asset Allocation -\nthiết lập tỷ trọng tài sản dài hạn) thuộc bước Planning.\n• a. SAI: Đây là hành động tái cân bằng (Rebalancing), thuộc giai đoạn Feedback.\n• b. SAI: Thực thi giao dịch mua/bán thuộc giai đoạn Implementation.\n• c. SAI: Đánh giá hiệu quả đầu tư thuộc giai đoạn Feedback.\nSupplementary English explanation (added, not part of the original file): Establishing long-term asset-class weights is strategic\nallocation and belongs to the planning stage of the portfolio process.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q06","chapter":1,"number":6,"question":"A security analyst estimates that a share is worth $60 based on expected future cash flows, while its current market price is $48. Which analytical approach has most directly produced this comparison?\nMột nhà phân tích chứng khoán ước tính một cổ phiếu có giá trị $60 dựa trên dòng tiền tương lai dự kiến, trong khi giá thị trường hiện tại là $48. Phương pháp phân tích nào đã trực tiếp tạo ra sự so sánh này?","options":[{"id":"PM120-C1-Q06-O1","text":"Portfolio rebalancing. (Tái cân bằng danh mục.)"},{"id":"PM120-C1-Q06-O2","text":"Passive indexing. (Đầu tư chỉ số thụ động.)"},{"id":"PM120-C1-Q06-O3","text":"Fundamental analysis. (Phân tích cơ bản.)"},{"id":"PM120-C1-Q06-O4","text":"Tactical asset allocation. (Phân bổ tài sản chiến thuật.)"}],"correctOptionId":"PM120-C1-Q06-O3","explanation":"Giải thích chi tiết:\n• c. ĐÚNG: Phân tích cơ bản (Fundamental analysis) sử dụng dòng tiền dự kiến, cổ tức, sự tăng trưởng và rủi ro để ước tính\nGiá trị nội tại (Intrinsic value = $60). Sau đó so sánh giá trị nội tại này với Giá thị trường ($48) để đưa ra quyết định Mua\n(nếu Giá trị nội tại > Giá thị trường).\n• a. SAI: Tái cân bằng là điều chỉnh tỷ trọng danh mục về mức mục tiêu.\n• b. SAI: Đầu tư thụ động mô phỏng theo chỉ số thị trường, không tìm kiếm cổ phiếu định giá sai.\n• d. SAI: Phân bổ tài sản chiến thuật là việc lệch tỷ trọng ngắn hạn giữa các lớp tài sản dựa trên dự báo vĩ mô.\nSupplementary English explanation (added, not part of the original file): Fundamental analysis estimates intrinsic value using\nexpected cash flows and compares that value with the quoted market price.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q07","chapter":1,"number":7,"question":"A portfolio manager studies economic growth, interest rates, and inflation, then identifies attractive industries, and finally selects individual companies. Which approach is the manager using?\nMột nhà quản lý danh mục nghiên cứu tăng trưởng kinh tế, lãi suất và lạm phát, sau đó xác định các ngành hấp dẫn, và cuối cùng chọn các công ty cụ thể. Nhà quản lý đang sử dụng phương pháp nào?","options":[{"id":"PM120-C1-Q07-O1","text":"Random security selection (Lựa chọn chứng khoán ngẫu nhiên)"},{"id":"PM120-C1-Q07-O2","text":"Bottom-up analysis (Phân tích từ dưới lên)"},{"id":"PM120-C1-Q07-O3","text":"Top-down analysis (Phân tích từ trên xuống)"},{"id":"PM120-C1-Q07-O4","text":"Passive indexing (Đầu tư chỉ số thụ động)"}],"correctOptionId":"PM120-C1-Q07-O3","explanation":"Giải thích chi tiết:\n• c. ĐÚNG: Quy trình Top-down (Từ trên xuống) bắt đầu bằng việc phân tích các chỉ báo kinh tế vĩ mô (tăng trưởng, lãi\nsuất, lạm phát) → xác định ngành tiềm năng → chọn lọc cổ phiếu của các công ty cụ thể.\n• a. SAI: Đây là phương pháp phân tích có hệ thống, không ngẫu nhiên.\n• b. SAI: Phân tích Bottom-up tập trung vào tài chính và lợi thế của từng công ty trước tiên, ít chú trọng vĩ mô.\n• d. SAI: Đầu tư thụ động chỉ mô phỏng chỉ số mà không phân tích vĩ mô để chọn cổ phiếu.\nSupplementary English explanation (added, not part of the original file): Top-down analysis begins with macroeconomic\nconditions, then industries, and finally individual companies.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q08","chapter":1,"number":8,"question":"Which sequence most logically describes the broad portfolio management process?\nTrình tự nào mô tả hợp lý nhất quy trình quản lý danh mục đầu tư tổng quát?","options":[{"id":"PM120-C1-Q08-O1","text":"Rebalancing → asset allocation → defining investor needs (Tái cân bằng → Phân bổ tài sản → Xác định nhu cầu nhà đầu tư)"},{"id":"PM120-C1-Q08-O2","text":"Planning → implementation → monitoring and feedback (Lập kế hoạch → Thực thi → Giám sát và phản hồi)"},{"id":"PM120-C1-Q08-O3","text":"Performance evaluation → planning → security trading (Đánh giá hiệu quả → Lập kế hoạch → Giao dịch chứng khoán)"},{"id":"PM120-C1-Q08-O4","text":"Security selection → planning → setting objectives (Chọn lọc chứng khoán → Lập kế hoạch → Thiết lập mục tiêu)"}],"correctOptionId":"PM120-C1-Q08-O2","explanation":"Giải thích chi tiết:\n• b. ĐÚNG: 3 giai đoạn lớn theo trình tự logic duy nhất của quy trình quản lý danh mục đầu tư là: Planning (Lập kế hoạch)\n→ Implementation (Thực thi) → Monitoring and Feedback (Giám sát & Phản hồi).\n• a, c, d. SAI: Tất cả các lựa chọn này đều xáo trộn thứ tự logic (ví dụ: không thể thực thi hay đánh giá trước khi lập kế hoạch\nvà xác định mục tiêu).\nSupplementary English explanation (added, not part of the original file): The portfolio management process follows planning,\nimplementation, and ongoing monitoring and feedback.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q09","chapter":1,"number":9,"question":"Which group consists entirely of financial assets?\nNhóm nào dưới đây bao gồm toàn bộ là các tài sản tài chính (financial assets)?","options":[{"id":"PM120-C1-Q09-O1","text":"Real estate, commodities, and corporate bonds (Bất động sản, hàng hóa và trái phiếu doanh nghiệp)"},{"id":"PM120-C1-Q09-O2","text":"Land, gold, and common shares (Đất đai, vàng và cổ phiếu phổ thông)"},{"id":"PM120-C1-Q09-O3","text":"Common shares, corporate bonds, and mutual fund certificates (Cổ phiếu phổ thông, trái phiếu doanh nghiệp và chứng chỉ quỹ đầu tư)"},{"id":"PM120-C1-Q09-O4","text":"Art, government bonds, and residential property (Tác phẩm nghệ thuật, trái phiếu chính phủ và bất động sản nhà ở)"}],"correctOptionId":"PM120-C1-Q09-O3","explanation":"Giải thích chi tiết:\n• c. ĐÚNG: Cổ phiếu, trái phiếu doanh nghiệp và chứng chỉ quỹ đều là các tài sản tài chính (financial assets/securities) đại\ndiện cho quyền đòi nợ hoặc quyền sở hữu hợp pháp.\n• a. SAI: Bất động sản (Real estate) và Hàng hóa (Commodities) là tài sản thực/tài sản thay thế (Real/Alternative assets).\n• b. SAI: Đất đai (Land) và Vàng (Gold) là tài sản thực.\n• d. SAI: Tác phẩm nghệ thuật (Art) và Bất động sản (Residential property) là tài sản thực.\nSupplementary English explanation (added, not part of the original file): Stocks, bonds and mutual fund certificates are\nfinancial assets; physical property and gold are real assets.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q10","chapter":1,"number":10,"question":"In a pooled investment fund, Investor A owns 20% of the fund and Investor B owns 10%. If the fund earns a gain, how should the economic benefit normally be distributed?\nTrong một quỹ đầu tư tập trung (quỹ gom vốn), Nhà đầu tư A sở hữu 20% quỹ và Nhà đầu tư B sở hữu 10%. Nếu quỹ phát sinh lợi nhuận, lợi ích kinh tế thường sẽ được phân phối như thế nào?","options":[{"id":"PM120-C1-Q10-O1","text":"According to each investor’s personal risk tolerance (Theo mức độ chấp nhận rủi ro cá nhân của từng nhà đầu tư)"},{"id":"PM120-C1-Q10-O2","text":"According to each investor’s ownership share (Theo tỷ lệ sở hữu/góp vốn của mỗi nhà đầu tư)"},{"id":"PM120-C1-Q10-O3","text":"Equally between A and B (Chia đều cho cả A và B)"},{"id":"PM120-C1-Q10-O4","text":"According to the date each investor joined the fund (Theo ngày mà mỗi nhà đầu tư gia nhập quỹ)"}],"correctOptionId":"PM120-C1-Q10-O2","explanation":"Giải thích chi tiết:\n• b. ĐÚNG: Trong các quỹ đầu tư gom vốn (pooled funds/mutual funds), rủi ro và lợi nhuận thu được luôn được chia theo tỷ\nlệ vốn góp hay tỷ lệ sở hữu chứng chỉ quỹ (ownership share) của từng nhà đầu tư.\n• a, c, d. SAI: Nguyên tắc phân phối lợi nhuận của quỹ tập trung không phụ thuộc vào tâm lý rủi ro cá nhân, việc chia đều vô\nlý hay thời điểm tham gia.\nSupplementary English explanation (added, not part of the original file): Returns and losses in pooled funds are normally\ndistributed in proportion to each investor’s ownership share.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q11","chapter":1,"number":11,"question":"An investor is approaching retirement, has accumulated substantial wealth, and wants continued growth without putting accumulated capital at excessive risk. This investor is most likely in the:\nMột nhà đầu tư đang tiến gần đến tuổi nghỉ hưu, đã tích lũy được lượng tài sản lớn và muốn tiếp tục tăng trưởng mà không đặt vốn đã tích lũy vào rủi ro quá mức. Nhà đầu tư này nhiều khả năng đang ở trong:","options":[{"id":"PM120-C1-Q11-O1","text":"Accumulation phase (Giai đoạn tích lũy)"},{"id":"PM120-C1-Q11-O2","text":"Consolidation phase (Giai đoạn củng cố)"},{"id":"PM120-C1-Q11-O3","text":"Gifting phase only (Chỉ giai đoạn chuyển giao/tặng cho)"},{"id":"PM120-C1-Q11-O4","text":"Initial saving phase (Giai đoạn tiết kiệm ban đầu)"}],"correctOptionId":"PM120-C1-Q11-O2","explanation":"Giải thích chi tiết:\n• b. ĐÚNG: Theo chu kỳ đời sống nhà đầu tư, Giai đoạn củng cố (Consolidation phase) (khoảng 40–60 tuổi) diễn ra khi nhà\nđầu tư vượt qua giữa sự nghiệp, thu nhập vượt chi phí, nợ giảm và tiến gần đến nghỉ hưu. Mục tiêu giai đoạn này là tăng\ntrưởng vừa phải đi đôi với bảo tồn vốn, tránh rủi ro quá lớn endangered số tài sản đã tích lũy.\n• a. SAI: Giai đoạn tích lũy (Accumulation phase) diễn ra ở đầu/giữa sự nghiệp (20–40 tuổi), khi tài sản còn ít và sẵn sàng\nchấp nhận rủi ro cao để tăng trưởng vốn.\n• c. SAI: Giai đoạn chuyển giao (Gifting phase) diễn ra song song với giai đoạn chi dùng (Spending phase) lúc đã nghỉ hưu\nhoàn toàn và muốn chuyển giao tài sản cho con cháu hoặc từ thiện.\n• d. SAI: Đây không phải là một thuật ngữ chuẩn trong mô hình chu kỳ đời sống nhà đầu tư của lý thuyết quản lý danh mục.\nSupplementary English explanation (added, not part of the original file): The consolidation phase emphasizes balanced growth\nand protection of accumulated wealth while approaching retirement.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q12","chapter":1,"number":12,"question":"A manager constructs a portfolio designed to closely follow a broad stock-market index while keeping deviations from that index small. Which management approach is being used?\nMột nhà quản lý xây dựng một danh mục đầu tư được thiết kế để bám sát một chỉ số thị trường chứng khoán rộng lớn đồng thời giữ cho sự sai lệch so với chỉ số đó ở mức nhỏ. Phương pháp quản lý nào đang được sử dụng?","options":[{"id":"PM120-C1-Q12-O1","text":"Passive management (Quản lý thụ động)"},{"id":"PM120-C1-Q12-O2","text":"Bottom-up speculation (Đầu cơ từ dưới lên)"},{"id":"PM120-C1-Q12-O3","text":"Tactical market timing (Căn thời điểm thị trường chiến thuật)"},{"id":"PM120-C1-Q12-O4","text":"Active management (Quản lý chủ động)"}],"correctOptionId":"PM120-C1-Q12-O1","explanation":"Giải thích chi tiết:\n• a. ĐÚNG: Chiến lược Quản lý thụ động (Passive management) có mục tiêu mô phỏng/bám sát một chỉ số tham chiếu\n(benchmark/index) và tối thiểu hóa lỗi bám sát (tracking error) cũng như chi phí giao dịch.\n• b. SAI: \"Đầu cơ từ dưới lên\" không phải là thuật ngữ chuẩn và trái ngược với nguyên tắc mô phỏng chỉ số thụ động.\n• c. SAI: Căn thời điểm thị trường (Market timing) là một chiến lược quản lý chủ động nhằm cố gắng dự báo đỉnh/đáy của thị\ntrường.\n• d. SAI: Quản lý chủ động (Active management) cố gắng đánh bại chỉ số tham chiếu chứ không phải bám sát nó.\nSupplementary English explanation (added, not part of the original file): Passive management seeks to track a benchmark\nclosely, rather than actively select securities to outperform it.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q13","chapter":1,"number":13,"question":"An analyst begins by identifying companies with strong earnings, competitive advantages, and attractive valuations, with relatively little emphasis on the current macroeconomic outlook. This approach is best described as:\nMột nhà phân tích bắt đầu bằng cách xác định các công ty có lợi nhuận mạnh mẽ, lợi thế cạnh tranh và định giá hấp dẫn, đồng thời ít chú trọng hơn đến triển vọng kinh tế vĩ mô hiện tại. Phương pháp này được mô tả tốt nhất là:","options":[{"id":"PM120-C1-Q13-O1","text":"Index replication (Mô phỏng chỉ số)"},{"id":"PM120-C1-Q13-O2","text":"Strategic asset allocation (Phân bổ tài sản chiến lược)"},{"id":"PM120-C1-Q13-O3","text":"Bottom-up analysis (Phân tích từ dưới lên)"},{"id":"PM120-C1-Q13-O4","text":"Top-down analysis (Phân tích từ trên xuống)"}],"correctOptionId":"PM120-C1-Q13-O3","explanation":"Giải thích chi tiết:\n• c. ĐÚNG: Phương pháp Bottom-up (Từ dưới lên) tập trung phân tích nền tảng của từng doanh nghiệp cụ thể (dòng tiền, lợi\nnhuận, lợi thế cạnh tranh, định giá) làm trọng tâm mà ít phụ thuộc vào dự báo kinh tế vĩ mô.\n• a. SAI: Mô phỏng chỉ số là phương pháp thụ động, không phân tích để chọn lọc doanh nghiệp riêng lẻ.\n• b. SAI: Phân bổ tài sản chiến lược là việc xác định tỷ trọng dài hạn giữa các lớp tài sản (cổ phiếu, trái phiếu, tiền mặt),\nkhông phải phân tích cổ phiếu cụ thể.\n• d. SAI: Phương pháp Top-down bắt đầu bằng việc phân tích kinh tế vĩ mô trước, sau đó chọn ngành rồi mới chọn công ty.\nSupplementary English explanation (added, not part of the original file): Bottom-up analysis starts with the fundamentals and\nvaluation of individual businesses instead of macroeconomic forecasting.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q14","chapter":1,"number":14,"question":"For two investments with similar expected returns, a risk-averse investor would generally prefer the investment with:\nĐối với hai khoản đầu tư có lợi nhuận kỳ vọng tương đương nhau, một nhà đầu tư ngại rủi ro (risk- averse) thường sẽ ưu tiên khoản đầu tư có:","options":[{"id":"PM120-C1-Q14-O1","text":"Higher volatility (Độ biến động cao hơn)"},{"id":"PM120-C1-Q14-O2","text":"Higher transaction costs (Chi phí giao dịch cao hơn)"},{"id":"PM120-C1-Q14-O3","text":"Lower risk (Rủi ro thấp hơn)"},{"id":"PM120-C1-Q14-O4","text":"A shorter trading history (Lịch sử giao dịch ngắn hơn)"}],"correctOptionId":"PM120-C1-Q14-O3","explanation":"Giải thích chi tiết:\n• c. ĐÚNG: Định nghĩa về nhà đầu tư ngại rủi ro (risk-averse) theo lý thuyết MPT của Markowitz là người luôn ưu tiên chọn\nkhoản đầu tư có rủi ro thấp hơn khi hai khoản đầu tư có cùng mức lợi nhuận kỳ vọng.\n• a. SAI: Độ biến động cao hơn tương đương với mức rủi ro cao hơn.\n• b. SAI: Chi phí giao dịch cao làm giảm lợi nhuận ròng.\n• d. SAI: Lịch sử ngắn hơn thường làm tăng tính bất định.\nSupplementary English explanation (added, not part of the original file): For the same expected return, a risk-averse investor\nnormally prefers the asset with the lower risk.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q15","chapter":1,"number":15,"question":"Which return measure is generally most useful for assessing a portfolio manager when the timing and size of client deposits and withdrawals are outside the manager’s control?\nThước đo lợi nhuận nào thường hữu ích nhất để đánh giá một nhà quản lý danh mục đầu tư khi thời điểm và quy mô nạp/rút tiền của khách hàng nằm ngoài tầm kiểm soát của nhà quản lý?","options":[{"id":"PM120-C1-Q15-O1","text":"Simple average of portfolio values (Trung bình cộng đơn giản giá trị danh mục)"},{"id":"PM120-C1-Q15-O2","text":"Total amount of money contributed by the client (Tổng số tiền do khách hàng đóng góp)"},{"id":"PM120-C1-Q15-O3","text":"Percentage change in the investor’s cash balance (Tỷ lệ phần trăm thay đổi trong số dư tiền mặt của nhà đầu tư)"},{"id":"PM120-C1-Q15-O4","text":"Time-weighted rate of return (Tỷ lệ sinh lời bình quân theo thời gian - TWRR)"}],"correctOptionId":"PM120-C1-Q15-O4","explanation":"Giải thích chi tiết:\n• d. ĐÚNG: Tỷ lệ sinh lời bình quân theo thời gian (Time-weighted rate of return - TWRR) đo lường hiệu quả quản lý\nbằng cách loại bỏ ảnh hưởng từ thời điểm và quy mô của các dòng tiền nạp/rút do khách hàng quyết định.\n• a. SAI: Trung bình cộng đơn giản giá trị danh mục không phản ánh chính xác tỷ lệ sinh lời thực tế.\n• b, c. SAI: Tổng tiền đóng góp và phần trăm thay đổi số dư tiền mặt bị chi phối bởi việc khách hàng nạp/rút tiền, không thể\nhiện chính xác năng lực điều hành của nhà quản lý.\nSupplementary English explanation (added, not part of the original file): Time-weighted return measures investment\nperformance while reducing distortions from client-controlled deposits and withdrawals.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q16","chapter":1,"number":16,"question":"Which activity is most closely associated with the implementation stage?\nHoạt động nào gắn liền nhất với giai đoạn thực thi (implementation stage)?","options":[{"id":"PM120-C1-Q16-O1","text":"Establishing the original investment policy statement (Thiết lập tuyên bố chính sách đầu tư ban đầu)"},{"id":"PM120-C1-Q16-O2","text":"Identifying the investor's risk tolerance (Xác định mức độ chấp nhận rủi ro của nhà đầu tư)"},{"id":"PM120-C1-Q16-O3","text":"Writing the investor's long-term objectives (Viết các mục tiêu dài hạn của nhà đầu tư)"},{"id":"PM120-C1-Q16-O4","text":"Selecting securities and executing portfolio transactions (Lựa chọn chứng khoán và thực thi các giao dịch danh mục)"}],"correctOptionId":"PM120-C1-Q16-O4","explanation":"Giải thích chi tiết:\n• d. ĐÚNG: Giai đoạn Thực thi (Implementation phase) là quá trình chuyển hóa các chính sách thành hành động thực tế,\nbao gồm phân bổ tài sản, chọn lọc chứng khoán/quỹ và thực thi giao dịch.\n• a, b, c. SAI: Cả 3 hoạt động này (Lập IPS, xác định rủi ro chấp nhận, thiết lập mục tiêu) đều thuộc về giai đoạn Lập kế\nhoạch (Planning phase).\nSupplementary English explanation (added, not part of the original file): Implementation turns the investment policy into\nholdings through security selection and transaction execution.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q17","chapter":1,"number":17,"question":"Which statement best explains why investors combine different investments into a portfolio rather than holding only one asset?\nPhát biểu nào giải thích đúng nhất lý do tại sao các nhà đầu tư kết hợp nhiều khoản đầu tư khác nhau thành một danh mục thay vì chỉ nắm giữ một tài sản?","options":[{"id":"PM120-C1-Q17-O1","text":"To avoid monitoring investment performance (Để tránh phải giám sát hiệu quả đầu tư)"},{"id":"PM120-C1-Q17-O2","text":"To eliminate all market risk (Để loại bỏ tất cả rủi ro thị trường)"},{"id":"PM120-C1-Q17-O3","text":"To guarantee a positive return every year (Để đảm bảo lợi nhuận dương mỗi năm)"},{"id":"PM120-C1-Q17-O4","text":"To manage the overall risk–return characteristics of their investments (Để quản lý các đặc tính rủi ro - lợi nhuận tổng thể cho khoản đầu tư của họ)"}],"correctOptionId":"PM120-C1-Q17-O4","explanation":"Giải thích chi tiết:\n• d. ĐÚNG: Mục đích kinh tế cốt lõi của việc nắm giữ danh mục đầu tư là kết hợp các tài sản lại với nhau để tạo ra hồ sơ rủi\nro - lợi nhuận tổng thể tối ưu và phù hợp hơn so với việc nắm giữ đơn lẻ một tài sản (nhờ hiệu ứng đa dạng hóa).\n• a. SAI: Việc nắm giữ danh mục đòi hỏi vẫn phải giám sát định kỳ ở giai đoạn Feedback.\n• b. SAI: Đa dạng hóa chỉ loại bỏ rủi ro phi hệ thống (unsystematic risk), không thể loại bỏ rủi ro thị trường/rủi ro hệ\nthống (systematic risk).\n• c. SAI: Danh mục đầu tư không thể đảm bảo chắc chắn 100% sinh lời dương hàng năm.\nSupplementary English explanation (added, not part of the original file): Diversification combines assets to improve the\noverall risk-return profile, without guaranteeing gains or eliminating market risk.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q18","chapter":1,"number":18,"question":"Which situation would normally reduce an investor’s capacity to take risk?\nTình huống nào dưới đây thường làm giảm khả năng chấp nhận rủi ro (capacity/ability to take risk) của một nhà đầu tư?","options":[{"id":"PM120-C1-Q18-O1","text":"Greater financial wealth (Tài sản tài chính lớn hơn)"},{"id":"PM120-C1-Q18-O2","text":"More comprehensive insurance coverage (Phạm vi bảo hiểm toàn diện hơn)"},{"id":"PM120-C1-Q18-O3","text":"Higher required near-term expenditures (Chi tiêu ngắn hạn bắt buộc cao hơn)"},{"id":"PM120-C1-Q18-O4","text":"Fewer financial dependents (Ít người phụ thuộc tài chính hơn)"}],"correctOptionId":"PM120-C1-Q18-O3","explanation":"Giải thích chi tiết:\n• c. ĐÚNG: Khả năng chấp nhận rủi ro (Ability/Capacity to take risk) là yếu tố khách quan dựa trên tài sản, thời gian và nhu\ncầu thanh khoản. Nhu cầu chi tiêu ngắn hạn cao đòi hỏi tính thanh khoản cao và sự an toàn của nguồn vốn, do đó làm giảm\nkhả năng chịu đựng rủi ro của nhà đầu tư.\n• a. SAI: Tài sản lớn hơn làm tăng khả năng chấp nhận rủi ro.\n• b. SAI: Bảo hiểm toàn diện bảo vệ nguồn vốn dự phòng, làm tăng khả năng chịu đựng rủi ro.\n• d. SAI: Ít gánh nặng phụ thuộc làm tăng khả năng chịu đựng rủi ro.\nSupplementary English explanation (added, not part of the original file): Large unavoidable near-term expenses reduce\nliquidity reserves and the investor’s financial ability to bear losses.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q19","chapter":1,"number":19,"question":"Which development represented the first major step toward modern portfolio theory?\nSự phát triển nào đại diện cho bước tiến lớn đầu tiên hướng tới lý thuyết danh mục đầu tư hiện đại (MPT)?","options":[{"id":"PM120-C1-Q19-O1","text":"Markowitz’s mean–variance portfolio framework (Khung danh mục đầu tư trung bình - phương sai của Markowitz)"},{"id":"PM120-C1-Q19-O2","text":"The introduction of the Fama–French model (Sự ra đời của mô hình Fama–French)"},{"id":"PM120-C1-Q19-O3","text":"The development of Arbitrage Pricing Theory (Sự phát triển của Lý thuyết kinh doanh chênh lệch giá - APT)"},{"id":"PM120-C1-Q19-O4","text":"The introduction of a multifactor asset-pricing model (Sự ra đời của mô hình định giá tài sản đa nhân tố)"}],"correctOptionId":"PM120-C1-Q19-O1","explanation":"Giải thích chi tiết:\n• a. ĐÚNG: Công trình nghiên cứu của Harry Markowitz (1952–1959) về lý thuyết trung bình - phương sai (Mean-variance\ntheory) chính là bước tiến lớn đầu tiên nền móng cho Lý thuyết danh mục hiện đại (Modern Portfolio Theory - MPT).\n• b, c, d. SAI: Mô hình CAPM, APT và Fama-French (đa nhân tố) là các bước phát triển kế thừa ra đời sau đó (vào thập niên\n1960–1970 trở về sau) để hoàn thiện lý thuyết định giá tài sản.\nSupplementary English explanation (added, not part of the original file): Markowitz introduced the formal mean-variance\nframework and the importance of covariance in portfolio diversification.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q20","chapter":1,"number":20,"question":"What best distinguishes strategic asset allocation from tactical asset allocation?\nĐiều gì phân biệt rõ nhất giữa phân bổ tài sản chiến lược (strategic asset allocation) và phân bổ tài sản chiến thuật (tactical asset allocation)?","options":[{"id":"PM120-C1-Q20-O1","text":"Strategic allocation is always an active stock-selection technique (Phân bổ chiến lược luôn là một kỹ thuật chọn lọc cổ phiếu chủ động)"},{"id":"PM120-C1-Q20-O2","text":"Strategic allocation establishes long-term target exposures, whereas tactical allocation permits temporary deviations based on market views (Phân bổ chiến lược thiết lập tỷ trọng mục tiêu dài hạn, trong khi phân bổ chiến thuật cho phép sai lệch tạm thời dựa trên nhận định thị trường)"},{"id":"PM120-C1-Q20-O3","text":"Tactical allocation never changes portfolio weights (Phân bổ chiến thuật không bao giờ thay đổi tỷ trọng danh mục)"},{"id":"PM120-C1-Q20-O4","text":"Strategic allocation applies only to bonds, whereas tactical allocation applies only to equities (Phân bổ chiến lược chỉ áp dụng cho trái phiếu, trong khi phân bổ chiến thuật chỉ áp dụng cho cổ phiếu)"}],"correctOptionId":"PM120-C1-Q20-O2","explanation":"Giải thích chi tiết:\n• b. ĐÚNG: Strategic Asset Allocation (SAA) thiết lập tỷ trọng cơ cấu tài sản dài hạn dựa trên IPS. Trong khi Tactical\nAsset Allocation (TAA) cho phép điều chính tăng/giảm tỷ trọng ngắn hạn so với mức chiến lược để tận dụng các cơ hội ngắn\nhạn trên thị trường.\n• a. SAI: Phân bổ chiến lược quyết định tỷ trọng các *lớp tài sản*, không phải chọn từng cổ phiếu.\n• c. SAI: Phân bổ chiến thuật chính là việc chủ động thay đổi tỷ trọng tài sản ngắn hạn.\n• d. SAI: Cả hai phương pháp phân bổ đều áp dụng cho toàn bộ các lớp tài sản trong danh mục (cổ phiếu, trái phiếu, tiền mặt,\nbất động sản...).\nSupplementary English explanation (added, not part of the original file): Strategic allocation sets long-term targets, while\ntactical allocation temporarily departs from them in response to market expectations.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q21","chapter":1,"number":21,"question":"Which portfolio objective is generally most important for a retired investor who depends on accumulated assets for living expenses?\nMục tiêu danh mục đầu tư nào thường quan trọng nhất đối với một nhà đầu tư đã nghỉ hưu, người phụ thuộc vào tài sản tích lũy để chi trả chi phí sinh hoạt?","options":[{"id":"PM120-C1-Q21-O1","text":"Concentration in a small number of high-growth stocks (Tập trung vào một số lượng nhỏ cổ phiếu tăng trưởng cao)"},{"id":"PM120-C1-Q21-O2","text":"Maximum use of leverage (Sử dụng đòn bẩy tối đa)"},{"id":"PM120-C1-Q21-O3","text":"Capital preservation with adequate income (Bảo toàn vốn đi kèm thu nhập đầy đủ)"},{"id":"PM120-C1-Q21-O4","text":"Maximum speculative growth (Tăng trưởng đầu cơ tối đa)"}],"correctOptionId":"PM120-C1-Q21-O3","explanation":"Giải thích chi tiết:\n• c. ĐÚNG: Người đã nghỉ hưu nằm ở giai đoạn chi dùng (Spending phase). Mục tiêu chính là bảo toàn vốn (capital\npreservation) để tránh mất tài sản, đồng thời tạo ra dòng tiền thu nhập thường xuyên (current income) để trang trải cuộc sống.\n• a. SAI: Tập trung vào ít cổ phiếu tăng trưởng gây ra rủi ro tập trung cao, không phù hợp với người cần sự an toàn.\n• b. SAI: Sử dụng đòn bẩy làm tăng nguy cơ cháy tài khoản và thua lỗ nặng.\n• d. SAI: Đầu cơ mang tính rủi ro cao, đi ngược lại hoàn toàn nhu cầu bảo vệ tài sản tích lũy.\nSupplementary English explanation (added, not part of the original file): A retiree who depends on savings typically\nprioritizes capital preservation and adequate income over aggressive speculation.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q22","chapter":1,"number":22,"question":"What was a central contribution of Markowitz’s portfolio theory?\nĐóng góp trung tâm của lý thuyết danh mục đầu tư Markowitz là gì?","options":[{"id":"PM120-C1-Q22-O1","text":"It proved that all investors should hold only risk-free assets (Nó chứng minh rằng tất cả nhà đầu tư chỉ nên nắm giữ tài sản phi rủi ro)"},{"id":"PM120-C1-Q22-O2","text":"It showed that investors should evaluate securities independently from one another (Nó cho thấy nhà đầu tư nên đánh giá các chứng khoán độc lập với nhau)"},{"id":"PM120-C1-Q22-O3","text":"It replaced diversification with market timing (Nó thay thế sự đa dạng hóa bằng việc căn thời điểm thị trường)"},{"id":"PM120-C1-Q22-O4","text":"It demonstrated that portfolio risk depends partly on relationships among asset returns (Nó chứng minh rằng rủi ro danh mục phụ thuộc một phần vào mối quan hệ giữa lợi nhuận của các tài sản)"}],"correctOptionId":"PM120-C1-Q22-O4","explanation":"Giải thích chi tiết:\n• d. ĐÚNG: Đóng góp cốt lõi của Harry Markowitz là chứng minh rằng rủi ro danh mục phụ thuộc vào mối quan hệ tương\nquan và hiệp biến (covariance/correlation) giữa các tài sản, chứ không chỉ là trung bình cộng rủi ro riêng lẻ từng tài sản.\n• a. SAI: Markowitz hướng đến việc xây dựng danh mục tài sản rủi ro tối ưu (efficient frontier).\n• b. SAI: Markowitz cho rằng phải đánh giá đóng góp của một chứng khoán vào toàn bộ danh mục chứ không đánh giá độc\nlập.\n• c. SAI: Lý thuyết của Markowitz giải thích và phát triển nguyên lý đa dạng hóa (diversification) dựa trên cơ sở toán học.\nSupplementary English explanation (added, not part of the original file): Markowitz demonstrated that portfolio risk depends\non covariances and correlations between returns, not just standalone risks.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q23","chapter":1,"number":23,"question":"A portfolio has a long-term policy weight of 50% equities. The manager temporarily increases equities to 55% because the manager expects unusually strong equity performance over the next several months. This is an example of:\nMột danh mục đầu tư có tỷ trọng chính sách dài hạn là 50% cổ phiếu. Nhà quản lý tạm thời tăng tỷ trọng cổ phiếu lên 55% vì kỳ vọng hiệu suất của cổ phiếu sẽ tăng trưởng mạnh bất thường trong vài tháng tới. Đây là một ví dụ về:","options":[{"id":"PM120-C1-Q23-O1","text":"Tactical asset allocation (Phân bổ tài sản chiến thuật)"},{"id":"PM120-C1-Q23-O2","text":"Strategic asset allocation (Phân bổ tài sản chiến lược)"},{"id":"PM120-C1-Q23-O3","text":"Security indexing (Lập chỉ số chứng khoán)"},{"id":"PM120-C1-Q23-O4","text":"Passive rebalancing (Tái cân bằng thụ động)"}],"correctOptionId":"PM120-C1-Q23-O1","explanation":"Giải thích chi tiết:\n• a. ĐÚNG: Phân bổ tài sản chiến thuật (Tactical Asset Allocation - TAA) cho phép nhà quản lý lệch tỷ trọng tạm thời\n(như tăng từ 50% lên 55%) so với mục tiêu chiến lược dài hạn nhằm tận dụng nhận định/cơ hội thị trường ngắn hạn.\n• c. SAI: Lập chỉ số chứng khoán (Indexing) là chiến lược thụ động mô phỏng theo chỉ số.\n• b. SAI: Phân bổ chiến lược (Strategic Asset Allocation) là việc đưa ra tỷ trọng mục tiêu dài hạn (50%), không phải hành\nđộng điều chỉnh lệch tỷ trọng ngắn hạn.\n• d. SAI: Tái cân bằng thụ động là hành động đưa tỷ trọng bị lệch về lại mức chuẩn 50%, thay vì chủ động làm lệch tỷ trọng\nđi như trong đề bài.\nSupplementary English explanation (added, not part of the original file): A deliberate short-term increase from the 50%\nstrategic equity target to 55% is a tactical overweight.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q24","chapter":1,"number":24,"question":"Which sequence best reflects the historical development of major portfolio and asset-pricing theories?\nTrình tự nào phản ánh tốt nhất sự phát triển lịch sử của các lý thuyết chính về danh mục đầu tư và định giá tài sản?","options":[{"id":"PM120-C1-Q24-O1","text":"CAPM → Markowitz → Fama–French → APT"},{"id":"PM120-C1-Q24-O2","text":"Markowitz → APT → CAPM → Fama–French"},{"id":"PM120-C1-Q24-O3","text":"Markowitz → CAPM → APT → Fama–French"},{"id":"PM120-C1-Q24-O4","text":"APT → Markowitz → CAPM → Fama–French"}],"correctOptionId":"PM120-C1-Q24-O3","explanation":"Giải thích chi tiết:\n• c. ĐÚNG: Thứ tự xuất hiện theo lịch sử lý thuyết tài chính: Lý thuyết danh mục Markowitz (1952) → Mô hình định giá\ntài sản vốn CAPM (1960s) → Lý thuyết kinh doanh chênh lệch giá APT (1976) → Mô hình Fama–French (1992/1993).\n• a, b, d. SAI: Đều sắp xếp sai dòng thời gian ra đời của các mô hình tài chính.\nSupplementary English explanation (added, not part of the original file): The historical sequence is Markowitz, CAPM, APT,\nand then the Fama–French asset-pricing models.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q25","chapter":1,"number":25,"question":"What is the main purpose of an Investment Policy Statement (IPS)?\nMục đích chính của Tuyên bố Chính sách Đầu tư (IPS) là gì?","options":[{"id":"PM120-C1-Q25-O1","text":"To predict daily security prices (Dự báo giá chứng khoán hàng ngày)"},{"id":"PM120-C1-Q25-O2","text":"To provide a formal framework linking investor objectives, constraints, and portfolio decisions (Cung cấp một khung chính thức kết nối các mục tiêu, hạn chế của nhà đầu tư và các quyết định danh mục)"},{"id":"PM120-C1-Q25-O3","text":"To replace the need for performance evaluation (Thay thế nhu cầu đánh giá hiệu quả đầu tư)"},{"id":"PM120-C1-Q25-O4","text":"To guarantee a minimum portfolio return (Đảm bảo một mức lợi nhuận danh mục tối thiểu)"}],"correctOptionId":"PM120-C1-Q25-O2","explanation":"Giải thích chi tiết:\n• b. ĐÚNG: Mục đích chính của IPS là tạo ra một khung văn bản chính thức giúp kết nối mục tiêu lợi nhuận/rủi ro của nhà\nđầu tư với các hạn chế thực tế, từ đó định hướng cho tất cả các quyết định quản lý danh mục.\n• a. SAI: IPS không có chức năng dự báo giá chứng khoán hàng ngày.\n• c. SAI: IPS cung cấp tiêu chuẩn để tiến hành đánh giá hiệu quả, chứ không thay thế bước này.\n• d. SAI: IPS thiết lập kỷ luật đầu tư chứ không thể đưa ra lời cam kết/đảm bảo mức lợi nhuận tối thiểu.\nSupplementary English explanation (added, not part of the original file): The IPS formally connects the investor’s objectives\nand constraints with asset allocation and portfolio decisions.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q26","chapter":1,"number":26,"question":"An investor owns shares, bonds, a rental property, and gold. How should this collection be viewed?\nMột nhà đầu tư sở hữu cổ phiếu, trái phiếu, một bất động sản cho thuê và vàng. Bộ sưu tập này nên được nhìn nhận như thế nào?","options":[{"id":"PM120-C1-Q26-O1","text":"It is a diversified portfolio containing different categories of investment assets (Nó là một danh mục đầu tư đa dạng hóa bao gồm các loại tài sản đầu tư khác nhau)"},{"id":"PM120-C1-Q26-O2","text":"It is a securities portfolio consisting only of financial claims (Nó là một danh mục chứng khoán chỉ bao gồm các quyền đòi tài chính)"},{"id":"PM120-C1-Q26-O3","text":"It cannot be considered a portfolio because it contains real assets (Nó không thể được coi là một danh mục đầu tư vì nó chứa các tài sản thực)"},{"id":"PM120-C1-Q26-O4","text":"It is a portfolio only if all assets are publicly traded (Nó chỉ là một danh mục đầu tư nếu tất cả các tài sản đều được giao dịch công khai)"}],"correctOptionId":"PM120-C1-Q26-O1","explanation":"Giải thích chi tiết:\n• a. ĐÚNG: Một danh mục đầu tư (investment portfolio) theo nghĩa rộng có thể bao gồm tài sản tài chính (cổ phiếu, trái\nphiếu), tài sản thực (bất động sản) và hàng hóa (vàng) để đạt được hiệu quả đa dạng hóa.\n• c. SAI: Danh mục đầu tư rộng hoàn toàn có thể bao gồm tài sản thực.\n• b. SAI: Bộ sưu tập này chứa cả bất động sản và vàng, do đó không chỉ bao gồm riêng chứng khoán/quyền đòi tài chính.\n• d. SAI: Bất động sản trực tiếp không cần niêm yết công khai vẫn được tính là một thành phần trong danh mục đầu tư tổng\nthể.\nSupplementary English explanation (added, not part of the original file): An investment portfolio can include both financial\nassets (stocks and bonds) and real assets (rental property and gold).","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q27","chapter":1,"number":27,"question":"Which item would most appropriately be included in an IPS?\nMục nào dưới đây phù hợp nhất để đưa vào một Tuyên bố Chính sách Đầu tư (IPS)?","options":[{"id":"PM120-C1-Q27-O1","text":"A guarantee of positive investment performance (Lời đảm bảo về hiệu quả đầu tư dương)"},{"id":"PM120-C1-Q27-O2","text":"The exact closing price of every security next year (Giá đóng cửa chính xác của mọi chứng khoán vào năm tới)"},{"id":"PM120-C1-Q27-O3","text":"The investor’s return requirement and risk tolerance (Yêu cầu về lợi nhuận và mức độ chấp nhận rủi ro của nhà đầu tư)"},{"id":"PM120-C1-Q27-O4","text":"The future market capitalization of every listed company (Vốn hóa thị trường trong tương lai của mọi công ty niêm yết)"}],"correctOptionId":"PM120-C1-Q27-O3","explanation":"Giải thích chi tiết:\n• c. ĐÚNG: Hai yếu tố đầu vào cốt lõi thuộc phần Mục tiêu (Objectives) trong IPS chính là Yêu cầu về lợi nhuận (return\nrequirement) và Mức độ chấp nhận rủi ro (risk tolerance) của khách hàng.\n• a. SAI: IPS không bao giờ chứa lời đảm bảo chắc chắn về hiệu suất sinh lời.\n• b, d. SAI: IPS là văn bản định hướng chiến lược quản lý danh mục, không chứa các dữ liệu dự báo tương lai phi thực tế như\ngiá chính xác hay vốn hóa tương lai của mọi công ty.\nSupplementary English explanation (added, not part of the original file): Required return and tolerance for risk are important\nparts of an IPS; the statement does not predict exact future prices.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q28","chapter":1,"number":28,"question":"Which activity belongs mainly to the feedback stage of the portfolio management process?\nHoạt động nào chủ yếu thuộc về giai đoạn phản hồi (feedback stage) trong quy trình quản lý danh mục đầu tư?","options":[{"id":"PM120-C1-Q28-O1","text":"Measuring performance and determining whether rebalancing is necessary (Đo lường hiệu quả hoạt động và xác định xem việc tái cân bằng có cần thiết hay không)"},{"id":"PM120-C1-Q28-O2","text":"Establishing the client’s investment objectives for the first time (Xác định các mục tiêu đầu tư của khách hàng lần đầu tiên)"},{"id":"PM120-C1-Q28-O3","text":"Determining the investor’s initial liquidity requirement (Xác định yêu cầu thanh khoản ban đầu của nhà đầu tư)"},{"id":"PM120-C1-Q28-O4","text":"Selecting the original strategic asset allocation (Lựa chọn phân bổ tài sản chiến lược ban đầu)"}],"correctOptionId":"PM120-C1-Q28-O1","explanation":"Giải thích chi tiết:\n• a. ĐÚNG: Giai đoạn Feedback (Phản hồi) bao gồm việc giám sát các điều kiện thị trường/hoàn cảnh nhà đầu tư, đánh giá\nhiệu quả (performance evaluation) và thực hiện tái cân bằng danh mục (rebalancing) khi cần.\n• b, c, d. SAI: Tất cả các hoạt động như thiết lập mục tiêu ban đầu, xác định nhu cầu thanh khoản ban đầu và chọn phân bổ tài\nsản chiến lược ban đầu đều thuộc về giai đoạn Planning (Lập kế hoạch).\nSupplementary English explanation (added, not part of the original file): Monitoring, performance evaluation and necessary\nrebalancing are activities in the feedback stage.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q29","chapter":1,"number":29,"question":"Which activity is most clearly part of professional portfolio management services?\nHoạt động nào thể hiện rõ nhất là một phần của dịch vụ quản lý danh mục đầu tư chuyên nghiệp?","options":[{"id":"PM120-C1-Q29-O1","text":"Guaranteeing that investors will outperform the market (Đảm bảo rằng nhà đầu tư sẽ đạt hiệu suất vượt trội so với thị trường)"},{"id":"PM120-C1-Q29-O2","text":"Designing, monitoring, and adjusting an investor’s portfolio (Thiết kế, giám sát và điều chỉnh danh mục đầu tư của nhà đầu tư)"},{"id":"PM120-C1-Q29-O3","text":"Determining tax rates for the entire economy (Xác định thuế suất cho toàn bộ nền kinh tế)"},{"id":"PM120-C1-Q29-O4","text":"Setting the market prices of listed securities (Ấn định giá thị trường của các chứng khoán niêm yết)"}],"correctOptionId":"PM120-C1-Q29-O2","explanation":"Giải thích chi tiết:\n• b. ĐÚNG: Dịch vụ quản lý danh mục đầu tư chuyên nghiệp là một quá trình liên tục bao gồm xây dựng/thiết kế, giám sát\nvà điều chỉnh/tái cấu trúc danh mục nhằm đáp ứng mục tiêu của khách hàng.\n• a. SAI: Nhà quản lý không được phép đưa ra lời hứa chắc chắn sẽ đánh bại thị trường.\n• c. SAI: Thuế suất do chính phủ quy định, không thuộc phạm vi dịch vụ quản lý danh mục.\n• d. SAI: Giá chứng khoán do cung cầu thị trường quyết định.\nSupplementary English explanation (added, not part of the original file): Professional portfolio management involves\nconstructing, monitoring and adjusting portfolios in line with client objectives.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q30","chapter":1,"number":30,"question":"All else being equal, which change would most likely increase an individual’s ability to accept investment risk?\nTrong điều kiện các yếu tố khác không đổi, sự thay đổi nào nhiều khả năng nhất sẽ làm tăng khả năng chấp nhận rủi ro đầu tư của một cá nhân?","options":[{"id":"PM120-C1-Q30-O1","text":"A sharp reduction in insurance protection (Sự sụt giảm mạnh trong việc bảo vệ bằng bảo hiểm)"},{"id":"PM120-C1-Q30-O2","text":"A substantial increase in financial wealth (Sự gia tăng đáng kể về tài sản tài chính)"},{"id":"PM120-C1-Q30-O3","text":"A large increase in unavoidable spending commitments (Sự gia tăng lớn trong các cam kết chi tiêu bắt buộc)"},{"id":"PM120-C1-Q30-O4","text":"A shorter investment horizon (Thời gian đầu tư ngắn hơn)"}],"correctOptionId":"PM120-C1-Q30-O2","explanation":"Giải thích chi tiết:\n• b. ĐÚNG: Khả năng chấp nhận rủi ro (Ability/capacity to take risk) phụ thuộc vào yếu tố tài chính khách quan. Tài sản tài\nchính gia tăng tạo vùng đệm an toàn lớn hơn, giúp tăng khả năng chịu đựng rủi ro thua lỗ.\n• a. SAI: Sụt giảm bảo hiểm khiến rủi ro cá nhân tăng lên, làm giảm khả năng chấp nhận rủi ro đầu tư.\n• c. SAI: Tăng chi tiêu bắt buộc làm giảm tính linh hoạt tài chính, dẫn đến giảm khả năng chịu rủi ro.\n• d. SAI: Thời gian đầu tư ngắn hơn làm giảm khả năng phục hồi sau các đợt sụt giảm thị trường, do đó làm giảm khả năng\nchịu rủi ro.\nSupplementary English explanation (added, not part of the original file): Higher financial wealth normally increases the buffer\navailable to absorb investment losses and can raise financial risk capacity.\nPHẦN B. BỔ SUNG CÂU 31–40 / NEW PRACTICE QUESTIONS\nCác câu dưới đây được biên soạn thêm theo trọng tâm học tập; không phải câu trong nguồn gốc hoặc đề LMS đã được xác nhận.","source":"Câu gốc / Original","topic":"Investment Process","level":"Nguyên gốc"},{"id":"PM120-C1-Q31","chapter":1,"number":31,"question":"Which statement best distinguishes ability to take risk from willingness to take risk?\nPhát biểu nào phân biệt chính xác khả năng tài chính chịu rủi ro và mức sẵn sàng chịu rủi ro?","options":[{"id":"PM120-C1-Q31-O1","text":"They both depend solely on age. Cả hai chỉ phụ thuộc vào tuổi."},{"id":"PM120-C1-Q31-O2","text":"Ability reflects financial resources; willingness reflects psychological comfort with risk. Khả năng phản ánh nguồn lực tài chính; mức sẵn sàng phản ánh tâm lý trước rủi ro."},{"id":"PM120-C1-Q31-O3","text":"Ability is determined only by trading experience. Khả năng chỉ do kinh nghiệm giao dịch quyết định."},{"id":"PM120-C1-Q31-O4","text":"Willingness is determined only by net worth. Mức sẵn sàng chỉ phụ thuộc tài sản ròng."}],"correctOptionId":"PM120-C1-Q31-O2","explanation":"Explanation (EN): Ability is financial capacity to endure losses. Willingness is the investor’s psychological attitude toward\nrisk. The two may differ.\nGiải thích (VI): Khả năng chịu rủi ro dựa trên thu nhập, tài sản và nhu cầu thanh khoản; mức sẵn sàng thể hiện tâm lý chấp\nnhận biến động. Không nên đánh đồng hai yếu tố.","source":"Câu bổ sung / New","topic":"Investment Process","level":"Bổ sung"},{"id":"PM120-C1-Q32","chapter":1,"number":32,"question":"Which investor has the greatest immediate liquidity requirement?\nNhà đầu tư nào có nhu cầu thanh khoản trước mắt lớn nhất?","options":[{"id":"PM120-C1-Q32-O1","text":"A young investor with no planned withdrawals for 20 years. Người trẻ không dự kiến rút vốn trong 20 năm."},{"id":"PM120-C1-Q32-O2","text":"An investor increasing long-term retirement savings. Người tăng tiết kiệm nghỉ hưu dài hạn."},{"id":"PM120-C1-Q32-O3","text":"An investor with a large tuition bill due in two months. Người cần khoản tiền lớn đóng học phí sau hai tháng."},{"id":"PM120-C1-Q32-O4","text":"An investor with no near-term spending commitments. Người không có khoản chi bắt buộc sắp tới."}],"correctOptionId":"PM120-C1-Q32-O3","explanation":"Explanation (EN): A known near-term cash payment creates a strong liquidity constraint, requiring sufficient cash or readily\nsaleable assets.\nGiải thích (VI): Khoản chi lớn đáo hạn trong thời gian gần buộc nhà đầu tư ưu tiên tiền mặt hoặc tài sản có thể chuyển đổi\nnhanh thành tiền.","source":"Câu bổ sung / New","topic":"Investment Process","level":"Bổ sung"},{"id":"PM120-C1-Q33","chapter":1,"number":33,"question":"A portfolio has a strategic equity target of 40%. After price appreciation, equities reach 55%. Selling equities to return to 40% is called:\nTỷ trọng cổ phiếu mục tiêu 40% tăng thành 55% do giá tăng. Bán cổ phiếu để trở về 40% gọi là gì?","options":[{"id":"PM120-C1-Q33-O1","text":"Tactical overweighting. Tăng tỷ trọng chiến thuật."},{"id":"PM120-C1-Q33-O2","text":"Rebalancing. Tái cân bằng."},{"id":"PM120-C1-Q33-O3","text":"Market timing. Chọn thời điểm thị trường."},{"id":"PM120-C1-Q33-O4","text":"Bottom-up analysis. Phân tích từ dưới lên."}],"correctOptionId":"PM120-C1-Q33-O2","explanation":"Explanation (EN): Rebalancing restores actual weights to the strategic policy weights. Tactical allocation intentionally moves\naway from targets.\nGiải thích (VI): Tái cân bằng đưa tỷ trọng thực tế về tỷ trọng mục tiêu, khác với phân bổ chiến thuật là chủ động lệch mục\ntiêu.\nFormula / Calculation / Công thức & tính toán: Equity weight: 55% → 40%.","source":"Câu bổ sung / New","topic":"Investment Process","level":"Bổ sung"},{"id":"PM120-C1-Q34","chapter":1,"number":34,"question":"Which data are primarily used in technical analysis?\nPhân tích kỹ thuật chủ yếu sử dụng dữ liệu nào?","options":[{"id":"PM120-C1-Q34-O1","text":"Historical prices, trading volume and price patterns. Giá lịch sử, khối lượng và mô hình biến động giá."},{"id":"PM120-C1-Q34-O2","text":"Only forecasted cash flows. Chỉ dòng tiền dự báo."},{"id":"PM120-C1-Q34-O3","text":"Only the firm’s corporate charter. Chỉ điều lệ công ty."},{"id":"PM120-C1-Q34-O4","text":"Only the investor’s investment horizon. Chỉ thời hạn đầu tư."}],"correctOptionId":"PM120-C1-Q34-O1","explanation":"Explanation (EN): Technical analysis emphasizes market trading information, whereas fundamental analysis emphasizes\nvaluation and business fundamentals.\nGiải thích (VI): Phân tích kỹ thuật dựa trên dữ liệu giao dịch, còn phân tích cơ bản dựa vào dòng tiền, định giá và yếu tố\ndoanh nghiệp.","source":"Câu bổ sung / New","topic":"Investment Process","level":"Bổ sung"},{"id":"PM120-C1-Q35","chapter":1,"number":35,"question":"What does tracking error measure for an index-tracking portfolio?\nTracking Error đo lường điều gì đối với danh mục bám chỉ số?","options":[{"id":"PM120-C1-Q35-O1","text":"The guaranteed difference in annual returns. Khoảng chênh lệch lợi nhuận hằng năm được bảo đảm."},{"id":"PM120-C1-Q35-O2","text":"The variance of the benchmark alone. Phương sai riêng chỉ số tham chiếu."},{"id":"PM120-C1-Q35-O3","text":"The volatility of the portfolio-minus-benchmark return difference. Độ biến động chênh lệch lợi nhuận danh mục so với benchmark."},{"id":"PM120-C1-Q35-O4","text":"The total number of securities held. Tổng số chứng khoán nắm giữ."}],"correctOptionId":"PM120-C1-Q35-O3","explanation":"Explanation (EN): Tracking error is conventionally the standard deviation of active returns, R_portfolio − R_benchmark.\nGiải thích (VI): Tracking Error thường là độ lệch chuẩn của chênh lệch lợi nhuận từng kỳ giữa danh mục và benchmark.\nFormula / Calculation / Công thức & tính toán: TE = StdDev(R_p − R_benchmark).","source":"Câu bổ sung / New","topic":"Investment Process","level":"Bổ sung"},{"id":"PM120-C1-Q36","chapter":1,"number":36,"question":"Why does a short investment horizon affect the asset allocation decision?\nVì sao thời hạn đầu tư ngắn ảnh hưởng đến quyết định phân bổ tài sản?","options":[{"id":"PM120-C1-Q36-O1","text":"It guarantees that cash instruments outperform equities. Bảo đảm tiền mặt vượt cổ phiếu."},{"id":"PM120-C1-Q36-O2","text":"It removes all inflation risk. Loại bỏ mọi rủi ro lạm phát."},{"id":"PM120-C1-Q36-O3","text":"It permits unlimited risk-taking. Cho phép chịu rủi ro không giới hạn."},{"id":"PM120-C1-Q36-O4","text":"It may reduce the ability to recover from market losses before funds are needed. Nó có thể hạn chế khả năng phục hồi sau thua lỗ trước ngày cần dùng tiền."}],"correctOptionId":"PM120-C1-Q36-O4","explanation":"Explanation (EN): A short horizon increases the importance of liquidity and near-term loss tolerance; it does not ensure any\nparticular return.\nGiải thích (VI): Khi thời gian ngắn, khó chờ tài sản phục hồi trước khi cần tiền, vì vậy phải cân nhắc thanh khoản và mức chịu\nlỗ.","source":"Câu bổ sung / New","topic":"Investment Process","level":"Bổ sung"},{"id":"PM120-C1-Q37","chapter":1,"number":37,"question":"An analyst estimates a stock’s intrinsic value at $45 while its market price is $55. What does the comparison suggest?\nGiá trị nội tại ước tính của cổ phiếu là 45 USD nhưng giá thị trường 55 USD. So sánh này gợi ý điều gì?","options":[{"id":"PM120-C1-Q37-O1","text":"Potential undervaluation. Có thể bị định giá thấp."},{"id":"PM120-C1-Q37-O2","text":"Potential overvaluation. Có thể bị định giá cao."},{"id":"PM120-C1-Q37-O3","text":"No valuation difference. Không có chênh lệch định giá."},{"id":"PM120-C1-Q37-O4","text":"The stock has zero market risk. Cổ phiếu không có rủi ro thị trường."}],"correctOptionId":"PM120-C1-Q37-O2","explanation":"Explanation (EN): A market price higher than estimated intrinsic value indicates potential overvaluation, assuming the\nvaluation estimate is reliable.\nGiải thích (VI): Giá thị trường 55 USD cao hơn giá trị nội tại 45 USD, nên có thể bị định giá cao nếu ước tính đáng tin cậy.\nFormula / Calculation / Công thức & tính toán: 55 − 45 = $10 above intrinsic value.","source":"Câu bổ sung / New","topic":"Investment Process","level":"Bổ sung"},{"id":"PM120-C1-Q38","chapter":1,"number":38,"question":"Which item is an investment constraint rather than a return objective?\nYếu tố nào là ràng buộc đầu tư thay vì mục tiêu lợi nhuận?","options":[{"id":"PM120-C1-Q38-O1","text":"Capital appreciation. Tăng giá trị vốn."},{"id":"PM120-C1-Q38-O2","text":"Current income. Thu nhập hiện tại."},{"id":"PM120-C1-Q38-O3","text":"Legal restrictions. Hạn chế pháp luật."},{"id":"PM120-C1-Q38-O4","text":"Total return. Tổng lợi nhuận."}],"correctOptionId":"PM120-C1-Q38-O3","explanation":"Explanation (EN): Legal restrictions constrain permissible investment decisions. Capital appreciation, income and total return\nare investment objectives.\nGiải thích (VI): Hạn chế pháp lý quy định phạm vi được đầu tư. Tăng trưởng vốn, thu nhập và tổng lợi nhuận là mục tiêu.","source":"Câu bổ sung / New","topic":"Investment Process","level":"Bổ sung"},{"id":"PM120-C1-Q39","chapter":1,"number":39,"question":"An actively managed fund beats its benchmark before fees but trails it after fees. What does this show?\nMột quỹ chủ động vượt benchmark trước phí nhưng thua sau phí. Điều này thể hiện điều gì?","options":[{"id":"PM120-C1-Q39-O1","text":"Trading activity guarantees net gains. Giao dịch nhiều bảo đảm lợi nhuận ròng."},{"id":"PM120-C1-Q39-O2","text":"Gross outperformance always proves investment skill. Vượt benchmark trước phí luôn chứng minh kỹ năng."},{"id":"PM120-C1-Q39-O3","text":"Fees never matter when comparing funds. Phí không quan trọng khi so sánh quỹ."},{"id":"PM120-C1-Q39-O4","text":"Trading costs and management fees can erase gross outperformance. Chi phí giao dịch và quản lý có thể xóa lợi thế trước phí."}],"correctOptionId":"PM120-C1-Q39-O4","explanation":"Explanation (EN): Performance should be compared net of relevant fees and trading costs. Positive gross alpha may not\ntranslate into net outperformance.\nGiải thích (VI): Nên so sánh hiệu quả sau phí và chi phí giao dịch. Phần vượt trội trước phí có thể không còn sau khi trừ chi\nphí.","source":"Câu bổ sung / New","topic":"Investment Process","level":"Bổ sung"},{"id":"PM120-C1-Q40","chapter":1,"number":40,"question":"Why should an investment manager periodically review a client’s IPS?\nVì sao nhà quản lý cần định kỳ xem xét lại IPS của khách hàng?","options":[{"id":"PM120-C1-Q40-O1","text":"Every portfolio must trade every day. Mọi danh mục phải giao dịch mỗi ngày."},{"id":"PM120-C1-Q40-O2","text":"The original IPS automatically expires monthly. IPS tự động hết hạn hàng tháng."},{"id":"PM120-C1-Q40-O3","text":"Client circumstances, liquidity needs or risk preferences may change. Hoàn cảnh, thanh khoản hoặc mức chấp nhận rủi ro có thể thay đổi."},{"id":"PM120-C1-Q40-O4","text":"Monitoring guarantees a positive return. Giám sát bảo đảm lợi nhuận dương."}],"correctOptionId":"PM120-C1-Q40-O3","explanation":"Explanation (EN): The IPS should remain aligned with changes in investor objectives, finances, constraints and risk tolerance.\nGiải thích (VI): IPS phải phản ánh các thay đổi về mục tiêu, điều kiện tài chính, ràng buộc và mức chấp nhận rủi ro.","source":"Câu bổ sung / New","topic":"Investment Process","level":"Bổ sung"},{"id":"PM120-C2-Q01","chapter":2,"number":1,"question":"A stock is purchased for $80, pays a dividend of $2 during the year, and is sold for $86 at year-end. What is the holding-period return?\nMột cổ phiếu được mua với giá 80 USD, trả cổ tức 2 USD trong năm và bán với giá 86 USD vào cuối năm. Tỷ suất sinh lời trong thời gian nắm giữ là bao nhiêu?","options":[{"id":"PM120-C2-Q01-O1","text":"10.0% \n10,0%"},{"id":"PM120-C2-Q01-O2","text":"12.5% \n12,5%"},{"id":"PM120-C2-Q01-O3","text":"8.0% \n8,0%"},{"id":"PM120-C2-Q01-O4","text":"7.5% \n7,5%"}],"correctOptionId":"PM120-C2-Q01-O1","explanation":"Giải thích (VI): Tỷ suất sinh lời thời gian nắm giữ (HPR) gồm lãi hoặc lỗ chênh lệch giá và cổ tức. Cổ phiếu tăng giá 6 USD,\nnhận thêm 2 USD cổ tức nên tổng lợi nhuận là 8 USD trên vốn ban đầu 80 USD.\nExplanation (EN): Holding-period return (HPR) includes both the capital gain or loss and dividends. The price rises by $6\nand the stock pays a $2 dividend, so the total gain is $8 on an initial $80 investment.\nCông thức & tính toán / Formula & calculation:\nHPR = (P₁ − P₀ + D) / P₀\nHPR = (86 − 80 + 2) / 80 = 0.10 = 10.0%","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q02","chapter":2,"number":2,"question":"An investment earns annual returns of 6%, −2%, 8%, and 4%. What is the arithmetic mean return?\nMột khoản đầu tư có tỷ suất sinh lời hằng năm lần lượt là 6%, −2%, 8% và 4%. Tỷ suất sinh lời trung bình cộng bằng bao nhiêu?","options":[{"id":"PM120-C2-Q02-O1","text":"5.0% \n5,0%"},{"id":"PM120-C2-Q02-O2","text":"6.0% \n6,0%"},{"id":"PM120-C2-Q02-O3","text":"4.0% \n4,0%"},{"id":"PM120-C2-Q02-O4","text":"3.0% \n3,0%"}],"correctOptionId":"PM120-C2-Q02-O3","explanation":"Giải thích (VI): Trung bình cộng bằng tổng các tỷ suất sinh lời chia cho số kỳ. Phải giữ dấu âm của năm thua lỗ. Khác trung\nbình nhân, phương pháp này không phản ánh trực tiếp hiệu ứng lãi kép.\nExplanation (EN): The arithmetic mean equals the sum of period returns divided by the number of periods. The negative\nreturn must retain its sign. Unlike the geometric mean, it does not directly measure compound growth.\nCông thức & tính toán / Formula & calculation:\nArithmetic mean / Trung bình cộng = Σ Rₜ / n\n(6% − 2% + 8% + 4%) / 4 = 16% / 4 = 4.0%","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q03","chapter":2,"number":3,"question":"An investment earns 10%, 5%, and −4% over three consecutive years. What is the approximate geometric mean return?\nMột khoản đầu tư có tỷ suất sinh lời 10%, 5% và −4% trong ba năm liên tiếp. Tỷ suất sinh lời trung bình nhân xấp xỉ bao nhiêu?","options":[{"id":"PM120-C2-Q03-O1","text":"5.0% \n5,0%"},{"id":"PM120-C2-Q03-O2","text":"3.5% \n3,5%"},{"id":"PM120-C2-Q03-O3","text":"4.0% \n4,0%"},{"id":"PM120-C2-Q03-O4","text":"2.7% \n2,7%"}],"correctOptionId":"PM120-C2-Q03-O2","explanation":"Giải thích (VI): Trung bình nhân phản ánh tốc độ tăng trưởng bình quân có tính lãi kép. Chuyển tỷ suất sinh lời từng năm\nthành hệ số tăng trưởng, nhân ba hệ số rồi lấy căn bậc ba; kết quả xấp xỉ 3,5%/năm.\nExplanation (EN): The geometric mean measures the compounded average annual growth rate. Multiply the three annual\ngrowth factors, take the cube root, and subtract one; the result is approximately 3.5% per year.\nCông thức & tính toán / Formula & calculation:\nGeometric mean / Trung bình nhân = [∏(1 + Rₜ)]^(1/n) − 1\n(1.10 × 1.05 × 0.96)^(1/3) − 1 = (1.1088)^(1/3) − 1 ≈ 3.50%","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q04","chapter":2,"number":4,"question":"A stock may earn 20%, 10%, or −5% with probabilities of 0.20, 0.50, and 0.30, respectively. What is its expected return?\nMột cổ phiếu có thể đạt lợi nhuận 20%, 10% hoặc −5% với xác suất tương ứng 0,20; 0,50 và 0,30. Lợi nhuận kỳ vọng là bao nhiêu?","options":[{"id":"PM120-C2-Q04-O1","text":"7.5% \n7,5%"},{"id":"PM120-C2-Q04-O2","text":"10.0% \n10,0%"},{"id":"PM120-C2-Q04-O3","text":"6.5% \n6,5%"},{"id":"PM120-C2-Q04-O4","text":"5.0% \n5,0%"}],"correctOptionId":"PM120-C2-Q04-O1","explanation":"Giải thích (VI): Lợi nhuận kỳ vọng là trung bình có trọng số xác suất của các kết quả. Không lấy trung bình cộng giản đơn vì\nba kết quả có xác suất khác nhau.\nExplanation (EN): Expected return is the probability-weighted average of possible returns. An unweighted arithmetic\naverage is incorrect because the probabilities differ.\nCông thức & tính toán / Formula & calculation:\nE(R) = Σ pᵢRᵢ\nE(R) = 0.20 × 20% + 0.50 × 10% + 0.30 × (−5%)\nE(R) = 4% + 5% − 1.5% = 7.5%","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q05","chapter":2,"number":5,"question":"Two equally likely outcomes for a stock are 5% and 15%. What is the standard deviation of return?\nMột cổ phiếu có hai mức lợi nhuận có xác suất xảy ra bằng nhau là 5% và 15%. Độ lệch chuẩn của tỷ suất sinh lời là bao nhiêu?","options":[{"id":"PM120-C2-Q05-O1","text":"7.5% \n7,5%"},{"id":"PM120-C2-Q05-O2","text":"2.5% \n2,5%"},{"id":"PM120-C2-Q05-O3","text":"10.0% \n10,0%"},{"id":"PM120-C2-Q05-O4","text":"5.0% \n5,0%"}],"correctOptionId":"PM120-C2-Q05-O4","explanation":"Giải thích (VI): Hai kết quả có xác suất 50% mỗi trường hợp. Lợi nhuận kỳ vọng là 10%; mỗi kết quả cách giá trị này 5 điểm\nphần trăm. Lấy căn bậc hai của phương sai xác suất được độ lệch chuẩn 5%.\nExplanation (EN): Each outcome has a probability of 50%. Expected return is 10%; both outcomes are five percentage points\naway. The square root of the probability-weighted variance is 5%.\nCông thức & tính toán / Formula & calculation:\nE(R) = 0.5 × 5% + 0.5 × 15% = 10%\nσ² = 0.5 × (0.05 − 0.10)² + 0.5 × (0.15 − 0.10)² = 0.0025\nσ = √0.0025 = 0.05 = 5.0%","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q06","chapter":2,"number":6,"question":"Asset A has an expected return of 8% and a standard deviation of 12%. What is its coefficient of variation?\nTài sản A có lợi nhuận kỳ vọng 8% và độ lệch chuẩn 12%. Hệ số biến thiên của tài sản là bao nhiêu?","options":[{"id":"PM120-C2-Q06-O1","text":"2.00 \n2,00"},{"id":"PM120-C2-Q06-O2","text":"1.50 \n1,50"},{"id":"PM120-C2-Q06-O3","text":"0.67 \n0,67"},{"id":"PM120-C2-Q06-O4","text":"1.00 \n1,00"}],"correctOptionId":"PM120-C2-Q06-O2","explanation":"Giải thích (VI): Hệ số biến thiên (CV) đo rủi ro trên mỗi đơn vị lợi nhuận kỳ vọng. Lấy độ lệch chuẩn chia lợi nhuận kỳ\nvọng. CV là tỷ số không có đơn vị, không phải tỷ suất sinh lời 150%.\nExplanation (EN): The coefficient of variation (CV) measures risk per unit of expected return. Divide standard deviation by\nexpected return. CV is a dimensionless ratio, not a 150% return.\nCông thức & tính toán / Formula & calculation:\nCV = σ / E(R)\nCV = 12% / 8% = 0.12 / 0.08 = 1.50","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q07","chapter":2,"number":7,"question":"A portfolio invests 40% in Asset A with an expected return of 9% and 60% in Asset B with an expected return of 15%. What is the portfolio expected return?\nMột danh mục đầu tư phân bổ 40% vào tài sản A có lợi nhuận kỳ vọng 9% và 60% vào tài sản B có lợi nhuận kỳ vọng 15%. Lợi nhuận kỳ vọng danh mục là bao nhiêu?","options":[{"id":"PM120-C2-Q07-O1","text":"13.2% \n13,2%"},{"id":"PM120-C2-Q07-O2","text":"11.4% \n11,4%"},{"id":"PM120-C2-Q07-O3","text":"12.6% \n12,6%"},{"id":"PM120-C2-Q07-O4","text":"10.8% \n10,8%"}],"correctOptionId":"PM120-C2-Q07-O3","explanation":"Giải thích (VI): Lợi nhuận kỳ vọng danh mục là trung bình có trọng số theo tỷ trọng đầu tư. A đóng góp 3,6 điểm phần trăm,\nB đóng góp 9
