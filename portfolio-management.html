 sót SMB và HML, alpha ban đầu có thể chứa đóng\ngóp của hai nhân tố này. Khi đưa chúng vào hồi quy và alpha biến mất, thành tích của quỹ có thể đến từ thiên lệch cổ phiếu\nnhỏ hoặc cổ phiếu giá trị chứ không nhất thiết từ kỹ năng quản lý độc lập.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q24","chapter":3,"number":24,"question":"In capital market theory, two investors agree about asset returns but differ in risk tolerance. Why can their optimal complete portfolios differ while their risky holdings have the same proportions?\nHai nhà đầu tư trong lý thuyết thị trường vốn đồng thuận về lợi suất tài sản nhưng khác mức chịu rủi ro. Vì sao danh mục hoàn chỉnh tối ưu của họ khác nhau trong khi tỷ trọng tương đối của các tài sản rủi ro vẫn giống nhau?","options":[{"id":"PM120-C3-Q24-O1","text":"They ignore common market information. \nHọ bỏ qua thông tin thị trường chung."},{"id":"PM120-C3-Q24-O2","text":"They choose different market forecasts. \nHọ có các dự báo thị trường khác nhau."},{"id":"PM120-C3-Q24-O3","text":"They use incompatible valuation methods. \nHọ dùng phương pháp định giá không tương thích."},{"id":"PM120-C3-Q24-O4","text":"They mix different risk-free weights. \nHọ phân bổ tỷ trọng tài sản phi rủi ro khác nhau."}],"correctOptionId":"PM120-C3-Q24-O4","explanation":"Explanation (EN): Under the two-fund separation result and shared market assumptions, investors can hold the same optimal\nrisky fund but choose different mixes between that fund and the risk-free asset. Greater risk aversion implies a higher risk-free\nallocation.\nGiải thích (VI): Nguyên lý phân tách hai quỹ cho phép các nhà đầu tư cùng lựa chọn một danh mục rủi ro tối ưu nhưng phân\nbổ mức vốn khác nhau vào tài sản phi rủi ro. Người thận trọng tăng tỷ trọng phi rủi ro; người chấp nhận rủi ro cao tăng tỷ\ntrọng danh mục rủi ro. Cơ cấu nội bộ danh mục rủi ro vẫn giữ nguyên.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q25","chapter":3,"number":25,"question":"A portfolio has strong positive exposure to the value factor in the Fama–French model. What investment style is it most associated with?\nMột danh mục có mức tiếp xúc dương mạnh với nhân tố giá trị trong Fama–French. Danh mục đó gắn nhất với phong cách đầu tư nào?","options":[{"id":"PM120-C3-Q25-O1","text":"Value shares with high book-to-market ratios. \nCổ phiếu giá trị có tỷ số giá trị sổ sách/giá trị thị trường cao."},{"id":"PM120-C3-Q25-O2","text":"Growth shares with low book-to-market ratios. \nCổ phiếu tăng trưởng có tỷ số giá trị sổ sách/giá trị thị trường thấp."},{"id":"PM120-C3-Q25-O3","text":"Cash investments protected from unexpected inflation. \nTiền mặt được bảo vệ khỏi lạm phát bất ngờ."},{"id":"PM120-C3-Q25-O4","text":"Bonds selected for low interest-rate duration. \nTrái phiếu có duration thấp được lựa chọn."}],"correctOptionId":"PM120-C3-Q25-O1","explanation":"Explanation (EN): HML stands for High Minus Low book-to-market. Positive loading on HML is associated with value\nstocks, which typically have higher book value relative to market price than growth stocks. A high ratio does not by itself\nprove mispricing.\nGiải thích (VI): HML đo chênh lệch lợi suất giữa nhóm có Book-to-Market (B/M) cao và nhóm B/M thấp. B/M = Giá trị sổ\nsách vốn chủ sở hữu / Giá trị thị trường vốn chủ sở hữu. Danh mục tải HML dương mạnh thường thiên về cổ phiếu giá trị,\nkhông đồng nghĩa chắc chắn có cổ phiếu bị định giá thấp.\nPHẦN B. BỔ SUNG CÂU 26–40 / NEW PRACTICE QUESTIONS\nCác câu dưới đây được biên soạn thêm theo trọng tâm học tập; không phải câu trong nguồn gốc hoặc đề LMS đã được xác nhận.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q26","chapter":3,"number":26,"question":"A stock’s covariance with the market is 0.024 and the market variance is 0.016. What is the stock’s beta?\nHiệp phương sai cổ phiếu với thị trường là 0,024, phương sai thị trường 0,016. Beta cổ phiếu bằng bao nhiêu?","options":[{"id":"PM120-C3-Q26-O1","text":"0.67 0,67"},{"id":"PM120-C3-Q26-O2","text":"1.50 1,50"},{"id":"PM120-C3-Q26-O3","text":"2.40 2,40"},{"id":"PM120-C3-Q26-O4","text":"0.40 0,40"}],"correctOptionId":"PM120-C3-Q26-O2","explanation":"Explanation (EN): Beta is Cov(Ri,Rm)/Var(Rm); divide 0.024 by 0.016 to obtain 1.50.\nGiải thích (VI): Beta bằng hiệp phương sai cổ phiếu–thị trường chia phương sai thị trường: 0,024/0,016 = 1,50.\nFormula / Calculation / Công thức & tính toán: β = 0.024 / 0.016 = 1.50","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"},{"id":"PM120-C3-Q27","chapter":3,"number":27,"question":"A portfolio invests 25% in beta 0.6 stock and 75% in beta 1.4 stock. What is the portfolio beta?\nDanh mục đầu tư 25% vào cổ phiếu beta 0,6 và 75% vào cổ phiếu beta 1,4. Beta danh mục là bao nhiêu?","options":[{"id":"PM120-C3-Q27-O1","text":"1.20 1,20"},{"id":"PM120-C3-Q27-O2","text":"0.80 0,80"},{"id":"PM120-C3-Q27-O3","text":"1.00 1,00"},{"id":"PM120-C3-Q27-O4","text":"1.40 1,40"}],"correctOptionId":"PM120-C3-Q27-O1","explanation":"Explanation (EN): Portfolio beta is the weighted average: 0.25×0.6 + 0.75×1.4 = 0.15 + 1.05 = 1.20.\nGiải thích (VI): Beta danh mục là trung bình trọng số: 0,25×0,6 + 0,75×1,4 = 1,20.\nFormula / Calculation / Công thức & tính toán: βp = Σ wiβi = 1.20","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"},{"id":"PM120-C3-Q28","chapter":3,"number":28,"question":"The risk-free rate is 3%, expected market return is 11%, market standard deviation 20%, and an efficient portfolio standard deviation is 10%. What is the CML expected return?\nRf=3%, lợi nhuận kỳ vọng thị trường 11%, độ lệch chuẩn thị trường 20%, danh mục hiệu quả có độ lệch chuẩn 10%. Lợi nhuận kỳ vọng trên CML là bao nhiêu?","options":[{"id":"PM120-C3-Q28-O1","text":"5% 5%"},{"id":"PM120-C3-Q28-O2","text":"8% 8%"},{"id":"PM120-C3-Q28-O3","text":"7% 7%"},{"id":"PM120-C3-Q28-O4","text":"11% 11%"}],"correctOptionId":"PM120-C3-Q28-O3","explanation":"Explanation (EN): Use the CML: 3% + (10%/20%)×(11%−3%) = 3%+4% = 7%.\nGiải thích (VI): Theo CML: 3% + (10%/20%)×(11%−3%) = 7%.\nFormula / Calculation / Công thức & tính toán: E(Rp)=Rf+[σp/σM]×[E(RM)−Rf] = 7%","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"},{"id":"PM120-C3-Q29","chapter":3,"number":29,"question":"What is the beta of the market portfolio with respect to itself, assuming positive market variance?\nBeta của danh mục thị trường so với chính nó bằng bao nhiêu, giả sử phương sai thị trường dương?","options":[{"id":"PM120-C3-Q29-O1","text":"0 0"},{"id":"PM120-C3-Q29-O2","text":"−1 −1"},{"id":"PM120-C3-Q29-O3","text":"It varies with each stock. Nó thay đổi theo từng cổ phiếu."},{"id":"PM120-C3-Q29-O4","text":"1 1"}],"correctOptionId":"PM120-C3-Q29-O4","explanation":"Explanation (EN): βM = Cov(RM,RM)/Var(RM) = Var(RM)/Var(RM) = 1.\nGiải thích (VI): Beta thị trường so với chính nó bằng 1 vì hiệp phương sai của Rm với chính nó bằng phương sai thị trường.\nFormula / Calculation / Công thức & tính toán: βM=Var(RM)/Var(RM)=1","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"},{"id":"PM120-C3-Q30","chapter":3,"number":30,"question":"Assuming CAPM and a stock beta of zero, what is the asset’s required return?\nGiả sử CAPM đúng và cổ phiếu có Beta bằng 0, lợi nhuận yêu cầu bằng bao nhiêu?","options":[{"id":"PM120-C3-Q30-O1","text":"Zero in all cases. Luôn bằng 0."},{"id":"PM120-C3-Q30-O2","text":"The risk-free rate. Lãi suất phi rủi ro."},{"id":"PM120-C3-Q30-O3","text":"The full market return. Toàn bộ lợi nhuận thị trường."},{"id":"PM120-C3-Q30-O4","text":"Twice the market premium. Hai lần phần bù thị trường."}],"correctOptionId":"PM120-C3-Q30-O2","explanation":"Explanation (EN): For β=0, CAPM becomes E(Ri)=Rf+0×(E(RM)−Rf)=Rf. Zero beta does not mean zero total risk.\nGiải thích (VI): Với β=0, phần bù rủi ro hệ thống biến mất và lợi nhuận yêu cầu bằng Rf. Beta 0 không đồng nghĩa tài sản\nkhông có tổng rủi ro.\nFormula / Calculation / Công thức & tính toán: E(Ri)=Rf+0×MRP=Rf","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"},{"id":"PM120-C3-Q31","chapter":3,"number":31,"question":"An investor puts 65% of wealth in the market portfolio and the rest in a risk-free asset. What is the risk-free weight?\nNhà đầu tư phân bổ 65% vốn vào danh mục thị trường và phần còn lại vào tài sản phi rủi ro. Tỷ trọng phi rủi ro bằng bao nhiêu?","options":[{"id":"PM120-C3-Q31-O1","text":"65% 65%"},{"id":"PM120-C3-Q31-O2","text":"25% 25%"},{"id":"PM120-C3-Q31-O3","text":"35% 35%"},{"id":"PM120-C3-Q31-O4","text":"165% 165%"}],"correctOptionId":"PM120-C3-Q31-O3","explanation":"Explanation (EN): Weights of the market portfolio and risk-free asset add to 100%; 1−0.65=0.35.\nGiải thích (VI): Tỷ trọng danh mục thị trường và tài sản phi rủi ro cộng lại bằng 100%; 1−0,65=0,35.\nFormula / Calculation / Công thức & tính toán: w_rf = 1 − y = 35%","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"},{"id":"PM120-C3-Q32","chapter":3,"number":32,"question":"An investor borrows $20 at an annual rate of 8% to enlarge a risky position. What annual interest cost is due on this borrowing?\nNhà đầu tư vay 20 USD với lãi suất 8%/năm để tăng vị thế rủi ro. Tiền lãi phải trả sau một năm là bao nhiêu?","options":[{"id":"PM120-C3-Q32-O1","text":"$0.80 0,80 USD"},{"id":"PM120-C3-Q32-O2","text":"$2.00 2,00 USD"},{"id":"PM120-C3-Q32-O3","text":"$8.00 8,00 USD"},{"id":"PM120-C3-Q32-O4","text":"$1.60 1,60 USD"}],"correctOptionId":"PM120-C3-Q32-O4","explanation":"Explanation (EN): Financing cost equals borrowed principal times the borrowing interest rate: $20×0.08=$1.60.\nGiải thích (VI): Chi phí vay bằng tiền gốc nhân lãi suất: 20×8%=1,60 USD.\nFormula / Calculation / Công thức & tính toán: Interest = 20×0.08 = $1.60","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"},{"id":"PM120-C3-Q33","chapter":3,"number":33,"question":"In a fitted Single-Index regression, R-squared is 0.36. What is the correct interpretation?\nTrong hồi quy chỉ số đơn, R² bằng 0,36. Cách diễn giải đúng nhất là gì?","options":[{"id":"PM120-C3-Q33-O1","text":"The model explains about 36% of sample return variation. Mô hình giải thích khoảng 36% biến động lợi nhuận trong mẫu."},{"id":"PM120-C3-Q33-O2","text":"The probability of a profitable trade is 36%. Xác suất giao dịch có lãi là 36%."},{"id":"PM120-C3-Q33-O3","text":"The stock has a 36% expected return. Cổ phiếu có lợi nhuận kỳ vọng 36%."},{"id":"PM120-C3-Q33-O4","text":"The regression alpha is 36%. Alpha hồi quy bằng 36%."}],"correctOptionId":"PM120-C3-Q33-O1","explanation":"Explanation (EN): R-squared is a goodness-of-fit measure of explained sample variation, not classification accuracy or return\nprobability.\nGiải thích (VI): R² đo tỷ lệ biến động mẫu được mô hình giải thích, không phải xác suất lãi hay tỷ lệ dự báo đúng.\nFormula / Calculation / Công thức & tính toán: R²=1−SSE/SST=0.36","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"},{"id":"PM120-C3-Q34","chapter":3,"number":34,"question":"Under the Single-Index Model with market-uncorrelated residuals, which expression gives a stock’s total return variance?\nTrong mô hình chỉ số đơn với phần dư không tương quan với thị trường, biểu thức nào cho phương sai tổng của cổ phiếu?","options":[{"id":"PM120-C3-Q34-O1","text":"Var(Ri)=βi Var(RM) Var(Ri)=βi Var(RM)"},{"id":"PM120-C3-Q34-O2","text":"Var(Ri)=αi+Var(RM) Var(Ri)=αi+Var(RM)"},{"id":"PM120-C3-Q34-O3","text":"Var(Ri)=βi²Var(RM)+Var(ei) Var(Ri)=βi²Var(RM)+Var(ei)"},{"id":"PM120-C3-Q34-O4","text":"Var(Ri)=Rf+βi Var(Ri)=Rf+βi"}],"correctOptionId":"PM120-C3-Q34-O3","explanation":"Explanation (EN): The market-driven and residual components are uncorrelated, so the variance equals beta squared times\nmarket variance plus residual variance.\nGiải thích (VI): Khi phần dư không tương quan với thị trường, phương sai tổng bằng β² nhân phương sai thị trường cộng\nphương sai phần dư.\nFormula / Calculation / Công thức & tính toán: σi²=βi²σM²+σε²","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"},{"id":"PM120-C3-Q35","chapter":3,"number":35,"question":"In a two-factor APT, Rf=2%, factor premiums are 3% and 4%, and factor sensitivities are 1.5 and 0.5. What is required return?\nTrong APT hai nhân tố, Rf=2%, phần bù rủi ro là 3% và 4%, hệ số nhạy 1,5 và 0,5. Lợi nhuận yêu cầu là bao nhiêu?","options":[{"id":"PM120-C3-Q35-O1","text":"7.5% 7,5%"},{"id":"PM120-C3-Q35-O2","text":"8.5% 8,5%"},{"id":"PM120-C3-Q35-O3","text":"10.5% 10,5%"},{"id":"PM120-C3-Q35-O4","text":"12.0% 12,0%"}],"correctOptionId":"PM120-C3-Q35-O2","explanation":"Explanation (EN): APT required return = 2% + 1.5×3% + 0.5×4% = 8.5%.\nGiải thích (VI): APT: lợi nhuận yêu cầu = 2% + 1,5×3% + 0,5×4% = 8,5%.\nFormula / Calculation / Công thức & tính toán: E(Ri)=Rf+b1λ1+b2λ2=8.5%","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"},{"id":"PM120-C3-Q36","chapter":3,"number":36,"question":"A three-factor regression has zero alpha and residual. Market excess return is 5%, SMB=2%, HML=−1%, with loadings 1.0, 0.5 and −0.5. What is predicted excess return?\nMô hình ba nhân tố có Alpha và phần dư bằng 0. Phần bù thị trường 5%, SMB=2%, HML=−1%; hệ số tải 1,0; 0,5; −0,5. Lợi nhuận vượt Rf dự báo bằng bao nhiêu?","options":[{"id":"PM120-C3-Q36-O1","text":"5.5% 5,5%"},{"id":"PM120-C3-Q36-O2","text":"6.0% 6,0%"},{"id":"PM120-C3-Q36-O3","text":"6.5% 6,5%"},{"id":"PM120-C3-Q36-O4","text":"7.5% 7,5%"}],"correctOptionId":"PM120-C3-Q36-O3","explanation":"Explanation (EN): Compute 1.0×5% + 0.5×2% + (−0.5)×(−1%) = 5%+1%+0.5%=6.5%.\nGiải thích (VI): Tính đóng góp mỗi nhân tố: 1×5% + 0,5×2% + (−0,5)×(−1%) = 6,5%.\nFormula / Calculation / Công thức & tính toán: Ri−Rf=bM(RM−Rf)+bS SMB+bH HML=6.5%","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"},{"id":"PM120-C3-Q37","chapter":3,"number":37,"question":"A manager wants positive exposure to the CMA factor in the Fama–French Five-Factor Model. Which tilt is most consistent?\nNhà quản lý muốn tiếp xúc dương với nhân tố CMA của mô hình Fama–French năm nhân tố. Nên thiên về nhóm nào?","options":[{"id":"PM120-C3-Q37-O1","text":"Firms investing aggressively relative to assets. Doanh nghiệp đầu tư mạnh so với tài sản."},{"id":"PM120-C3-Q37-O2","text":"Companies selected only by high beta. Doanh nghiệp chỉ được chọn theo beta cao."},{"id":"PM120-C3-Q37-O3","text":"Firms investing conservatively. Doanh nghiệp đầu tư thận trọng."},{"id":"PM120-C3-Q37-O4","text":"Only short-maturity bonds. Chỉ trái phiếu ngắn hạn."}],"correctOptionId":"PM120-C3-Q37-O3","explanation":"Explanation (EN): CMA stands for Conservative Minus Aggressive, so positive exposure favors conservative investing firms.\nGiải thích (VI): CMA là chênh lệch lợi suất giữa nhóm đầu tư thận trọng và nhóm đầu tư mạnh. Tiếp xúc dương tương ứng\nthiên về nhóm thận trọng.","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"},{"id":"PM120-C3-Q38","chapter":3,"number":38,"question":"A stock’s forecast return is 9%, while CAPM requires 13%. What is its expected alpha?\nCổ phiếu dự báo lợi nhuận 9% còn CAPM yêu cầu 13%. Alpha kỳ vọng bằng bao nhiêu?","options":[{"id":"PM120-C3-Q38-O1","text":"+4 percentage points. +4 điểm phần trăm."},{"id":"PM120-C3-Q38-O2","text":"−4 percentage points. −4 điểm phần trăm."},{"id":"PM120-C3-Q38-O3","text":"22 percentage points. 22 điểm phần trăm."},{"id":"PM120-C3-Q38-O4","text":"Zero. Bằng 0."}],"correctOptionId":"PM120-C3-Q38-O2","explanation":"Explanation (EN): Expected alpha is forecast minus required return, 9%−13%=−4 percentage points. Under the model, the\nstock is overvalued relative to its forecast.\nGiải thích (VI): Alpha kỳ vọng = 9%−13%=−4 điểm phần trăm; theo mô hình và dự báo, mức lợi nhuận chưa đủ so với yêu\ncầu.\nFormula / Calculation / Công thức & tính toán: α=Rforecast−RCAPM=−4pp","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"},{"id":"PM120-C3-Q39","chapter":3,"number":39,"question":"In APT, what fundamental idea restricts persistent price differences among portfolios with identical factor exposures?\nTrong APT, nguyên lý nào hạn chế chênh lệch giá kéo dài giữa các danh mục có cùng mức tiếp xúc nhân tố?","options":[{"id":"PM120-C3-Q39-O1","text":"Arbitrage-free pricing. Định giá không có cơ hội arbitrage."},{"id":"PM120-C3-Q39-O2","text":"Guaranteed stock profits. Lợi nhuận cổ phiếu được bảo đảm."},{"id":"PM120-C3-Q39-O3","text":"Unlimited idiosyncratic premiums. Phần bù rủi ro đặc thù không giới hạn."},{"id":"PM120-C3-Q39-O4","text":"Ignoring all systematic risks. Bỏ qua mọi rủi ro hệ thống."}],"correctOptionId":"PM120-C3-Q39-O1","explanation":"Explanation (EN): No-arbitrage arguments imply that sufficiently similar factor-risk payoffs cannot offer persistent,\nexploitable mispricing in equilibrium.\nGiải thích (VI): Nguyên lý không arbitrage hàm ý các danh mục có mức tiếp xúc nhân tố tương đương không thể duy trì chênh\nlệch giá có thể khai thác mãi trong cân bằng.","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"},{"id":"PM120-C3-Q40","chapter":3,"number":40,"question":"The market portfolio has standard deviation 20%. Under risk-free mixing without short sales, which risky weight gives a complete-portfolio standard deviation of 12%?\nĐộ lệch chuẩn danh mục thị trường 20%. Khi phối hợp với tài sản phi rủi ro không bán khống, tỷ trọng danh mục rủi ro để đạt độ lệch chuẩn 12% là bao nhiêu?","options":[{"id":"PM120-C3-Q40-O1","text":"40% 40%"},{"id":"PM120-C3-Q40-O2","text":"50% 50%"},{"id":"PM120-C3-Q40-O3","text":"60% 60%"},{"id":"PM120-C3-Q40-O4","text":"80% 80%"}],"correctOptionId":"PM120-C3-Q40-O3","explanation":"Explanation (EN): With a zero-volatility risk-free asset and y≥0, complete-portfolio standard deviation is yσM, so\ny=12%/20%=0.60.\nGiải thích (VI): Vì tài sản phi rủi ro có độ lệch chuẩn bằng 0, σc=yσM. Suy ra y=12%/20%=60%.\nFormula / Calculation / Công thức & tính toán: σc=yσM ⇒ y=0.12/0.20=0.60","source":"Câu bổ sung / New","topic":"Asset Pricing Models","level":"Bổ sung"}];

const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function chapterQuestions(ch){return QUESTIONS.filter(q=>q.chapter===ch)}

function navigate(p){page=p;session=null;clearTimer();$('#topTimer').classList.add('hidden');$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#topTitle').textContent={dashboard:'Trang chủ',practice:'Ôn tập / Kiểm tra',wrong:'Câu sai',bookmarks:'Đã đánh dấu',bank:'Ngân hàng câu hỏi',stats:'Thống kê',settings:'Cài đặt'}[p]||'';render();$('#sidebar').classList.remove('open');scrollTo({top:0,behavior:'auto'})}

function renderDashboard(c){const o=overall();c.innerHTML=`<h1 class="page-title">Ôn ${QUESTIONS.length} câu Portfolio Management</h1><p class="sub">3 chương, xáo câu và đáp án độc lập, tự ghi nhớ câu sai và lịch sử từng câu.</p><div class="grid">

<div class="card" style="grid-column:span 12"><h3 class="section-title">Tiến độ toàn bộ ngân hàng</h3><div class="progress"><span style="width:${QUESTIONS.length?o.done/QUESTIONS.length*100:0}%"></span></div><p class="muted">${o.done} câu đã chạm tới • ${QUESTIONS.length-o.done} câu chưa làm</p><div class="row"><button class="btn primary" onclick="navigate('practice')">Bắt đầu ôn</button>${state.activeSession?'<button class="btn" onclick="resumeSaved()">Tiếp tục bài đang dở</button>':''}<button class="btn" onclick="quickWrong()">Ôn câu sai</button></div></div>
${[1,2,3].map(ch=>{const qs=chapterQuestions(ch);const done=qs.filter(q=>stat(q.id).attempts).length;const weak=qs.filter(q=>state.wrongIds.includes(q.id)).length;return `<div class="card" style="grid-column:span 6"><b>Chương ${ch}</b><div class="muted">${esc(CHAPTERS[ch])}</div><div class="row" style="margin-top:10px"><span class="pill">Đã học ${done}/${qs.length}</span><span class="pill">Câu yếu ${weak}</span><button class="btn" onclick="startChapter(${ch})">Ôn chương</button></div></div>`}).join('')}</div>`}
function setupHTML(){return `<h1 class="page-title">Tạo bài ôn / bài kiểm tra</h1><p class="sub">Chế độ ôn sẽ phản hồi ngay. Nếu chọn sai, lựa chọn sai chuyển đỏ, đáp án đúng chuyển xanh và giải thích hiện ngay bên dưới.</p>${languageControls()}<div class="setup"><div class="card"><h3 class="section-title">1. Chọn chương</h3><div class="chapter-grid">${[1,2,3].map(ch=>`<label class="chapter-item"><input type="checkbox" class="chpick" value="${ch}" checked><span><b>Chương ${ch}</b><small style="display:block;color:var(--muted)">${esc(CHAPTERS[ch])} • ${chapterQuestions(ch).length} câu</small></span></label>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn" id="allCh">Chọn tất cả</button><button class="btn" id="noneCh">Bỏ chọn</button></div></div><div class="card"><h3 class="section-title">2. Thiết lập</h3><div class="field"><label>Chế độ</label><select id="mode"><option value="practice">Ôn tập: hiện đúng/sai + giải thích ngay</option><option value="test">Kiểm tra: nộp bài mới hiện kết quả</option></select></div><div class="field" style="margin-top:10px"><label>Số câu</label><select id="count"><option>10</option><option>20</option><option>30</option><option selected>50</option><option>100</option><option value="all">Tất cả trong phạm vi</option></select></div><label class="toggle" style="margin-top:10px"><input id="shuffleQ" type="checkbox" ${state.shuffleQ?'checked':''}> Xáo thứ tự câu hỏi</label><label class="toggle" style="margin-top:8px"><input id="shuffleA" type="checkbox" ${state.shuffleA?'checked':''}> Xáo vị trí đáp án A, B, C, D</label><div class="field" style="margin-top:10px"><label>Giới hạn thời gian toàn bài</label><select id="timerMin"><option value="0">Không giới hạn</option><option value="10">10 phút</option><option value="20">20 phút</option><option value="30">30 phút</option><option value="45">45 phút</option><option value="60">60 phút</option></select></div><button class="btn primary" style="width:100%;margin-top:14px" id="startBtn">Bắt đầu</button></div></div>`}
function renderSetup(c){c.innerHTML=setupHTML();$('#allCh').onclick=()=>$$('.chpick').forEach(x=>x.checked=true);$('#noneCh').onclick=()=>$$('.chpick').forEach(x=>x.checked=false);$('#startBtn').onclick=()=>{const chapters=$$('.chpick:checked').map(x=>+x.value);if(!chapters.length)return toast('Hãy chọn ít nhất một chương');startSession({chapters,count:$('#count').value,mode:$('#mode').value,shuffleQ:$('#shuffleQ').checked,shuffleA:$('#shuffleA').checked,timerMin:+$('#timerMin').value})}}

function questionParts(q){
 const t=String(q.question||''),i=t.indexOf('\n');
 return i<0?[t,t]:[t.slice(0,i).trim(),t.slice(i+1).trim()];

function optionParts(raw){
 const t=String(raw||'').trim(),nl=t.indexOf('\n');
 if(nl>=0)return [t.slice(0,nl).trim(),t.slice(nl+1).trim().replace(/\s*\n\s*/g,' ')];
 if(t.endsWith(')')){
  let depth=0,opening=-1;
  for(let i=t.length-1;i>=0;i--){
   if(t[i]===')')depth++;
   else if(t[i]==='('){depth--;if(depth===0){opening=i;break}}
  }
  if(opening>0 && /[\u00C0-\u1EF9]/.test(t.slice(opening+1)))
   return [t.slice(0,opening).trim(),t.slice(opening+1,-1).trim()];
 }
 const accented=t.search(/[\u00C0-\u1EF9]/);
 if(accented>=0){
  const separator=t.lastIndexOf('. ',accented);
  if(separator>0 && separator+2<accented+1)
   return [t.slice(0,separator+1).trim(),t.slice(separator+2).trim()];
 }
 const parts=t.split(/\s+/);
 if(parts.length===2 && /[\d%]/.test(parts[0]) && /[\d%]/.test(parts[1]))return parts;
 if(parts.length===3 && /^\$[\d.]+$/.test(parts[0])&&parts[2]==='USD')return [parts[0],parts.slice(1).join(' ')];
 if(parts.length%2===0){const n=parts.length/2;if(parts.slice(0,n).join(' ')===parts.slice(n).join(' '))return [parts.slice(0,n).join(' '),parts.slice(n).join(' ')];}
 return [t,t];
}
function optionHTML(q,oid){const p=optionParts(optionText(q,oid));return languageText(p[0],p[1])}
function explanationParts(q){
 const t=String(q.explanation||''),r=/(Supplementary English explanation[^:\n]*:|Explanation \(EN\):|Giải thích chi tiết:|Giải thích \(VI\):|(?:Formula \/ Calculation \/ Công thức & tính toán|Công thức & tính toán \/ Formula & calculation):)/gi;
 const matches=[...t.matchAll(r)],result={en:'',vi:'',formula:''};
 for(let k=0;k<matches.length;k++){
  const m=matches[k],part=t.slice(m.index+m[0].length,k+1<matches.length?matches[k+1].index:t.length).trim();
  if(/Explanation \(EN\)|Supplementary English/i.test(m[0]))result.en+=(result.en?'\n':'')+part;
  else if(/Giải thích/i.test(m[0]))result.vi+=(result.vi?'\n':'')+part;
  else result.formula+=(result.formula?'\n':'')+part;
 }
 if(!result.en&&!result.vi)result.vi=t;
 return result;
}
function explanationHTML(q){
 const p=explanationParts(q),l=studyLocale();
 const value=l==='en'?p.en:l==='vi'?p.vi:null;
 let html='';
 if(l==='bi')html='<div class="explain-block"><strong>Explanation (EN)</strong><div class="lang-top">'+esc(p.en||'')+'</div></div><div class="explain-block"><strong>Giải thích (VI)</strong><div class="lang-bottom">'+esc(p.vi||'')+'</div></div>';
 else html='<div class="explain-block"><strong>'+(l==='en'?'Explanation':'Giải thích')+'</strong><div class="lang-only">'+esc(value||'')+'</div></div>';
 if(p.formula)html+='<div class="explain-block"><strong>'+(l==='en'?'Formula / Calculation':l==='vi'?'Công thức & tính toán':'Formula / Công thức')+'</strong><div class="lang-only">'+esc(p.formula)+'</div></div>';
 return html;
}
function languageLabel(en,vi){return studyLocale()==='en'?en:vi}

function renderQuiz(){const c=$('#content');if(!session)return renderSetup(c);const it=currentItem(),q=qById(it.qid);const practice=session.mode==='practice';const show=practice&&it.locked;const selected=it.selected;const correct=q.correctOptionId;const graded=!!correct;const isCorrect=graded&&selected===correct;const answered=session.items.filter(x=>x.selected).length;c.innerHTML=`<div class="quiz-wrap"><div class="quiz-head"><span>${session.index+1}/${session.items.length}</span><div class="progress"><span style="width:${(session.index+1)/session.items.length*100}%"></span></div><button class="icon-btn bookmark ${state.bookmarks.includes(q.id)?'active':''}" onclick="toggleBookmark('${q.id}')">★</button></div><div class="navigator">${session.items.map((x,i)=>{let cls=i===session.index?'current ':'';if(session.mode==='practice'&&x.locked){const qq=qById(x.qid);if(!qq.correctOptionId)cls+='answered';else cls+=x.selected===qq.correctOptionId?'correct':'wrong'}else if(x.selected)cls+='answered';return `<button class="navq ${cls}" onclick="goQ(${i})">${i+1}</button>`}).join('')}</div><div class="quiz-card">${languageControls()}<div class="q-meta"><span class="pill">Chương ${q.chapter}</span><span class="pill">${esc(q.source||'Portfolio Management')}</span><span class="pill">${esc(q.topic||"Tổng hợp")}</span><span class="pill">${esc(q.level||"Trắc nghiệm")}</span><span class="pill">${q.id}</span>${session.mode==='test'?'<span class="pill">Chế độ kiểm tra</span>':'<span class="pill">Chế độ ôn tập</span>'}</div><div class="question">${questionHTML(q)}</div><div class="options">${it.optionOrder.map((oid,idx)=>{let cls='';if(show){if(graded&&oid===correct)cls='correct';else if(graded&&oid===selected)cls='wrong';else if(!graded&&oid===selected)cls='review'}else if(session.mode==='test'&&oid===selected)cls='selected';return `<button class="option ${cls}" ${show?'disabled':''} onclick="choose('${oid}')"><span class="opt-letter">${'ABCD'[idx]}</span><span>${optionHTML(q,oid)}${show&&graded&&oid===correct?' <b>✓ Đáp án đúng</b>':''}${show&&graded&&oid===selected&&oid!==correct?' <b>✕ Bạn đã chọn</b>':''}${show&&!graded&&oid===selected?' <b>• Bạn đã chọn</b>':''}</span></button>`}).join('')}</div>${show?(graded?`<div class="feedback ${isCorrect?'good':'bad'}"><b>${isCorrect?languageLabel('✓ Correct','✓ Chính xác'):languageLabel('✕ Incorrect','✕ Chưa đúng')}</b>${!isCorrect?`${languageLabel('You selected:','Bạn đã chọn:')} <b>${optionHTML(q,selected)}</b>. ${languageLabel('The correct choice is highlighted in green above.','Đáp án đúng được tô xanh phía trên.')}`:''}<div class="explanation"><b>${languageLabel('Explanation (original answer letter can change when choices are shuffled):','Giải thích / Explanation (thứ tự chữ cái trong tài liệu gốc có thể khác sau khi xáo đáp án):')}</b>${explanationHTML(q)}</div></div>`:`<div class="feedback review"><b>⚠ Câu này chưa có đáp án chính thức đủ rõ để chốt duy nhất</b><div class="explanation"><b>Giải thích / lưu ý:</b>${explanationHTML(q)}</div></div>`):''}<div class="quiz-actions"><button class="btn" onclick="prevQ()" ${session.index===0?'disabled':''}>← Câu trước</button>${session.mode==='test'?`<button class="btn primary" onclick="${session.index===session.items.length-1?'submitTest()':'nextQ()'}">${session.index===session.items.length-1?'Nộp bài':'Câu tiếp →'}</button>`:`<button class="btn primary" onclick="nextQ()" ${!it.locked?'disabled':''}>${session.index===session.items.length-1?'Hoàn thành':'Câu tiếp →'}</button>`}</div></div><p class="muted" style="text-align:center">Đã trả lời ${answered}/${session.items.length}. Phím 1–4 chọn A–D; Enter sang câu tiếp.</p></div>`;$('#topTitle').textContent='Đang làm bài';state.activeSession=session;saveState()}
function choose(oid){const it=currentItem(),q=qById(it.qid);if(session.mode==='practice'&&it.locked)return;it.selected=oid;if(session.mode==='practice'){it.locked=true;if(q.correctOptionId)recordAttempt(q.id,oid===q.correctOptionId);else recordReview(q.id)}state.activeSession=session;saveState();renderQuiz()}
function recordAttempt(qid,correct){const s=stat(qid);s.attempts++;s.lastAt=Date.now();if(correct){s.correct++;s.streak++;if(s.streak>=2)state.wrongIds=state.wrongIds.filter(x=>x!==qid)}else{s.wrong++;s.streak=0;if(!state.wrongIds.includes(qid))state.wrongIds.push(qid)}state.stats[qid]=s;saveState()}
function recordReview(qid){const s=stat(qid);s.attempts++;s.lastAt=Date.now();state.stats[qid]=s;saveState()}
function nextQ(){if(session.index<session.items.length-1){session.index++;renderQuiz()}else{if(session.mode==='practice')finishPractice();else submitTest()}}
function prevQ(){if(session.index>0){session.index--;renderQuiz()}}
function goQ(i){session.index=i;renderQuiz()}
function toggleBookmark(qid){if(state.bookmarks.includes(qid))state.bookmarks=state.bookmarks.filter(x=>x!==qid);else state.bookmarks.push(qid);saveState();renderQuiz()}
function finishPractice(){const gradable=session.items.filter(x=>qById(x.qid).correctOptionId);const correct=gradable.filter(x=>{const q=qById(x.qid);return x.selected===q.correctOptionId}).length;const ungraded=session.items.length-gradable.length;const done={id:session.id,date:Date.now(),mode:'practice',total:gradable.length,correct,ungraded};state.sessions.unshift(done);state.sessions=state.sessions.slice(0,50);state.activeSession=null;saveState();clearTimer();$('#topTimer').classList.add('hidden');showResult(correct,gradable.length,'Ôn tập hoàn thành',ungraded)}
function submitTest(auto=false){if(!session||session.submitted)return;const unanswered=session.items.filter(x=>!x.selected).length;if(!auto&&unanswered&&!confirm(`Bạn còn ${unanswered} câu chưa trả lời. Vẫn nộp bài?`))return;session.submitted=true;let correct=0,gradable=0,ungraded=0;session.items.forEach(x=>{const q=qById(x.qid);if(!q.correctOptionId){ungraded++;if(x.selected)recordReview(q.id);return}gradable++;const ok=x.selected===q.correctOptionId;if(x.selected)recordAttempt(q.id,ok);if(ok)correct++});state.sessions.unshift({id:session.id,date:Date.now(),mode:'test',total:gradable,correct,ungraded});state.sessions=state.sessions.slice(0,50);state.activeSession=null;saveState();clearTimer();$('#topTimer').classList.add('hidden');showTestReview(correct,auto)}

function showResult(correct,total,title,ungraded=0){const c=$('#content');const pct=total?Math.round(correct/total*100):0;c.innerHTML=`<h1 class="page-title">${title}</h1><div class="test-summary"><div class="card"><div class="n" style="font-size:28px;font-weight:800">${correct}</div><div class="muted">Câu đúng</div></div><div class="card"><div class="n" style="font-size:28px;font-weight:800">${total-correct}</div><div class="muted">Câu sai</div></div><div class="card"><div class="n" style="font-size:28px;font-weight:800">${pct}%</div><div class="muted">Tỷ lệ đúng trên câu có đáp án chốt</div></div>${ungraded?`<div class="card"><div class="n" style="font-size:28px;font-weight:800">${ungraded}</div><div class="muted">Câu chưa chốt đáp án, không tính điểm</div></div>`:''}</div><div class="row" style="margin-top:16px"><button class="btn primary" onclick="navigate('practice')">Tạo bài mới</button><button class="btn" onclick="navigate('wrong')">Ôn câu sai</button><button class="btn" onclick="navigate('stats')">Xem thống kê</button></div>`}
function showTestReview(correct,auto){const c=$('#content');const gradable=session.items.filter(x=>qById(x.qid).correctOptionId);const total=gradable.length;const ungraded=session.items.length-total;const pct=total?Math.round(correct/total*100):0;c.innerHTML=`<h1 class="page-title">${auto?'Hết giờ - đã tự động nộp':'Kết quả kiểm tra'}</h1><div class="test-summary"><div class="card"><b>${correct}/${total}</b><div class="muted">Câu đúng / câu có đáp án chốt</div></div><div class="card"><b>${total-correct}</b><div class="muted">Câu sai hoặc bỏ trống</div></div><div class="card"><b>${pct}%</b><div class="muted">Tỷ lệ đúng</div></div>${ungraded?`<div class="card"><b>${ungraded}</b><div class="muted">Câu chưa chốt, không tính điểm</div></div>`:''}</div><h3>Xem lại từng câu</h3><div class="list">${session.items.map((it,i)=>{const q=qById(it.qid);if(!q.correctOptionId)return `<div class="q-row"><h4>Câu ${i+1}. ${questionHTML(q)}</h4><div class="meta">⚠ Chưa có đáp án chốt • Chương ${q.chapter} • ${esc(q.source||'Portfolio Management')}</div>${it.selected?`<p><b>Bạn chọn:</b> ${esc(optionText(q,it.selected))}</p>`:''}<p><b>Giải thích / lưu ý:</b> ${explanationHTML(q)}</p></div>`;const ok=it.selected===q.correctOptionId;return `<div class="q-row"><h4>Câu ${i+1}. ${questionHTML(q)}</h4><div class="meta">${ok?'✓ Đúng':'✕ Sai'} • Chương ${q.chapter} • ${esc(q.source||'Portfolio Management')}</div><p><b>Đáp án đúng:</b> ${optionHTML(q,q.correctOptionId)}</p>${it.selected&&!ok?`<p><b>Bạn chọn:</b> ${esc(optionText(q,it.selected))}</p>`:''}<p><b>Giải thích:</b> ${explanationHTML(q)}</p></div>`}).join('')}</div><div class="row" style="margin-top:16px"><button class="btn primary" onclick="navigate('practice')">Tạo bài mới</button><button class="btn" onclick="navigate('wrong')">Ôn câu sai</button></div>`}

function renderCollection(type){const c=$('#content');const ids=type==='wrong'?state.wrongIds:state.bookmarks;const title=type==='wrong'?'Câu sai / đang yếu':'Câu đã đánh dấu';const qs=QUESTIONS.filter(q=>ids.includes(q.id));c.innerHTML=`<h1 class="page-title">${title}</h1><p class="sub">${type==='wrong'?'Câu sai được lưu tự động. Khi trả lời đúng liên tiếp 2 lần, câu sẽ rời danh sách yếu nhưng lịch sử vẫn được giữ.':'Các câu bạn muốn xem lại riêng.'}</p>${qs.length?`<div class="row" style="margin-bottom:14px"><button class="btn primary" onclick="startSessionFromIds(${JSON.stringify(ids).replace(/"/g,'&quot;')},'practice',true,0)">Ôn tất cả (${qs.length})</button><button class="btn" onclick="startSessionFromIds(${JSON.stringify(ids.slice(0,20)).replace(/"/g,'&quot;')},'practice',true,0)">Ôn tối đa 20 câu</button></div><div class="list">${qs.map(q=>rowHTML(q)).join('')}</div>`:`<div class="empty">Chưa có câu nào trong mục này.</div>`}`}
function rowHTML(q){const s=stat(q.id);return `<div class="q-row"><h4>${questionHTML(q)}</h4><div class="meta">${q.id} • ${esc(q.source||'Portfolio Management')} • Chương ${q.chapter} • Đã làm ${s.attempts} lần • Đúng ${s.correct} • Sai ${s.wrong}</div><div class="actions"><button class="btn" onclick="openQuestion('${q.id}')">Xem câu</button><button class="btn" onclick="startSessionFromIds(['${q.id}'],'practice',true,0)">Làm lại</button></div></div>`}
function renderBank(c){let qs=QUESTIONS.filter(q=>(bankChapter==='all'||q.chapter==bankChapter));if(bankStatus!=='all')qs=qs.filter(q=>statusOf(q.id)===bankStatus);if(bankQuery.trim()){const t=bankQuery.toLowerCase();qs=qs.filter(q=>(q.question+' '+q.options.map(o=>o.text).join(' ')).toLowerCase().includes(t))}c.innerHTML=`<h1 class="page-title">Ngân hàng ${QUESTIONS.length} câu</h1><p class="sub">Tìm kiếm và xem từng câu. Đáp án mặc định được ẩn trong cửa sổ chi tiết.</p>${languageControls()}<div class="searchbar"><input id="bankSearch" placeholder="Tìm nội dung câu hỏi..." value="${esc(bankQuery)}"><select id="bankChapter"><option value="all">Tất cả chương</option>${[1,2,3].map(ch=>`<option value="${ch}" ${bankChapter==ch?'selected':''}>Chương ${ch}</option>`).join('')}</select><select id="bankStatus"><option value="all">Mọi trạng thái</option><option value="new" ${bankStatus==='new'?'selected':''}>Chưa làm</option><option value="weak" ${bankStatus==='weak'?'selected':''}>Đang yếu</option><option value="learning" ${bankStatus==='learning'?'selected':''}>Đang học</option><option value="mastered" ${bankStatus==='mastered'?'selected':''}>Thành thạo</option></select></div><div class="muted" style="margin-bottom:10px">Tìm thấy ${qs.length} câu</div><div class="list">${qs.slice(0,120).map(q=>rowHTML(q)).join('')}${qs.length>120?'<div class="empty">Đang hiển thị 120 kết quả đầu. Hãy lọc hoặc tìm kiếm để thu hẹp.</div>':''}</div>`;$('#bankSearch').oninput=e=>{bankQuery=e.target.value;clearTimeout(window._bs);window._bs=setTimeout(()=>renderBank(c),180)};$('#bankChapter').onchange=e=>{bankChapter=e.target.value;renderBank(c)};$('#bankStatus').onchange=e=>{bankStatus=e.target.value;renderBank(c)}}
function openQuestion(qid){const q=qById(qid);const m=$('#modal'),mc=$('#modalCard');const answerHtml=q.correctOptionId?`<p><b>Đáp án đúng:</b> ${optionHTML(q,q.correctOptionId)}</p>`:`<p style="color:var(--warn)"><b>Chưa có đáp án chính thức đủ rõ để chốt duy nhất.</b></p>`;mc.innerHTML=`<div class="row"><b>${q.id} • ${esc(q.source||'Portfolio Management')} • Chương ${q.chapter}</b><div style="flex:1"></div><button class="icon-btn" onclick="closeModal()">✕</button></div><h3>${questionHTML(q)}</h3>${q.options.map((o,i)=>`<p><b>${'ABCD'[i]}.</b> ${optionHTML(q,o.id)}</p>`).join('')}<button class="btn primary" id="revealBtn">Hiện đáp án và giải thích</button><div id="reveal" class="hidden"><hr style="border:0;border-top:1px solid var(--line)">${answerHtml}<p><b>${q.correctOptionId?'Giải thích':'Giải thích / lưu ý'}:</b> ${explanationHTML(q)}</p></div>`;m.classList.add('open');$('#revealBtn').onclick=()=>$('#reveal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.remove('open')}
function renderStats(c){const rows=[1,2,3].map(ch=>{const qs=chapterQuestions(ch);let a=0,co=0;qs.forEach(q=>{const s=stat(q.id);a+=s.correct+s.wrong;co+=s.correct});const done=qs.filter(q=>stat(q.id).attempts).length;const weak=qs.filter(q=>state.wrongIds.includes(q.id)).length;return{ch,done,weak,acc:a?Math.round(co/a*100):0}});c.innerHTML=`<h1 class="page-title">Thống kê</h1><p class="sub">Theo dõi mức độ phủ câu hỏi và tỷ lệ đúng thực tế, không dùng điểm cộng/trừ.</p><div class="card"><table class="kpi-table"><thead><tr><th>Chương</th><th class="right">Đã học</th><th class="right">Câu yếu</th><th class="right">Độ chính xác</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>Chương ${r.ch}</b><div class="muted">${esc(CHAPTERS[r.ch])}</div></td><td class="right">${r.done}/${chapterQuestions(r.ch).length}</td><td class="right">${r.weak}</td><td class="right">${r.acc}%</td></tr>`).join('')}</tbody></table></div><h3>Lịch sử bài gần đây</h3>${state.sessions.length?`<div class="list">${state.sessions.slice(0,12).map(s=>`<div class="q-row"><b>${s.mode==='test'?'Kiểm tra':'Ôn tập'} • ${new Date(s.date).toLocaleString('vi-VN')}</b><div class="meta">${s.correct}/${s.total} đúng • ${Math.round(s.correct/s.total*100)}%</div></div>`).join('')}</div>`:'<div class="empty">Chưa có bài hoàn thành.</div>'}`}
function renderSettings(c){c.innerHTML=`<h1 class="page-title">Cài đặt</h1>${languageControls()}<div class="grid"><div class="card" style="grid-column:span 6"><h3 class="section-title">Giao diện</h3><div class="field"><label>Chế độ màu</label><select id="themeSel"><option value="light" ${state.theme==='light'?'selected':''}>Sáng</option><option value="dark" ${state.theme==='dark'?'selected':''}>Tối</option></select></div><div class="field" style="margin-top:10px"><label>Cỡ chữ</label><select id="fontSel"><option value="small" ${state.font==='small'?'selected':''}>Nhỏ</option><option value="normal" ${state.font==='normal'?'selected':''}>Vừa</option><option value="large" ${state.font==='large'?'selected':''}>Lớn</option></select></div></div><div class="card" style="grid-column:span 6"><h3 class="section-title">Sao lưu tiến độ</h3><div class="row"><button class="btn" id="exportBtn">Xuất dữ liệu JSON</button><label class="btn">Nhập dữ liệu<input id="importFile" type="file" accept="application/json" hidden></label></div><p class="muted">Dùng để chuyển tiến độ sang máy khác.</p></div><div class="card danger-zone" style="grid-column:span 12"><h3 class="section-title">Xóa dữ liệu học</h3><p class="muted">Xóa lịch sử đúng/sai, câu yếu, đánh dấu và bài đang dở. Ngân hàng ${QUESTIONS.length} câu vẫn còn nguyên.</p><button class="btn danger" id="resetBtn">Xóa toàn bộ tiến độ</button></div></div>`;$('#themeSel').onchange=e=>{state.theme=e.target.value;saveState();applyPrefs()};$('#fontSel').onchange=e=>{state.font=e.target.value;saveState();applyPrefs()};$('#exportBtn').onclick=exportData;$('#importFile').onchange=importData;$('#resetBtn').onclick=resetData}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='portfolio-management-tien-do.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state={...DEFAULT,...x};saveState();applyPrefs();toast('Đã nhập tiến độ');render()}catch{alert('File dữ liệu không hợp lệ')}};r.readAsText(f)}
function resetData(){if(!confirm('Xóa toàn bộ tiến độ học?'))return;if(!confirm('Xác nhận lần cuối: thao tác này không thể hoàn tác.'))return;localStorage.removeItem(KEY);state=structuredClone(DEFAULT);applyPrefs();toast('Đã xóa tiến độ');navigate('dashboard')}
$('#nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(b)navigate(b.dataset.page)};$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';saveState();applyPrefs()};$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(!session)return;if(['1','2','3','4'].includes(e.key)){const it=currentItem();const idx=+e.key-1;if(it.optionOrder[idx])choose(it.optionOrder[idx])}if(e.key==='Enter'&&session.mode==='practice'&&currentItem().locked)nextQ()});
render();
</script>
