M-C1-0098-O1","text":"Investment benchmark"},{"id":"PM-C1-0098-O2","text":"Constraint trade-off"},{"id":"PM-C1-0098-O3","text":"Liquidity constraint"},{"id":"PM-C1-0098-O4","text":"Legal constraint"}],"correctOptionId":"PM-C1-0098-O3","explanation":"Liquidity constraint: Near-term cash obligations create liquidity constraints. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề IPS Objectives and Constraints.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0099","chapter":1,"number":99,"topic":"IPS Objectives and Constraints","level":"Basic","question":"An investment case describes the following: An investor must repay a property deposit within six months. Which concept BEST fits?","options":[{"id":"PM-C1-0099-O1","text":"Unique circumstances"},{"id":"PM-C1-0099-O2","text":"Required return"},{"id":"PM-C1-0099-O3","text":"Return objective"},{"id":"PM-C1-0099-O4","text":"Time-horizon constraint"}],"correctOptionId":"PM-C1-0099-O4","explanation":"Time-horizon constraint: The horizon identifies how long capital can remain invested. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề IPS Objectives and Constraints.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0100","chapter":1,"number":100,"topic":"IPS Objectives and Constraints","level":"Basic","question":"An investment case describes the following: A high-tax-rate client wants portfolio turnover assessed for capital-gains taxes. Which concept BEST fits?","options":[{"id":"PM-C1-0100-O1","text":"Tax constraint"},{"id":"PM-C1-0100-O2","text":"Investment benchmark"},{"id":"PM-C1-0100-O3","text":"Constraint trade-off"},{"id":"PM-C1-0100-O4","text":"Risk objective"}],"correctOptionId":"PM-C1-0100-O1","explanation":"Tax constraint: Tax circumstances can restrict otherwise attractive strategies. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề IPS Objectives and Constraints.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0101","chapter":1,"number":101,"topic":"IPS Objectives and Constraints","level":"Basic","question":"An investment case describes the following: A pension mandate prohibits specific securities under applicable regulations. Which concept BEST fits?","options":[{"id":"PM-C1-0101-O1","text":"Liquidity constraint"},{"id":"PM-C1-0101-O2","text":"Legal constraint"},{"id":"PM-C1-0101-O3","text":"Required return"},{"id":"PM-C1-0101-O4","text":"Return objective"}],"correctOptionId":"PM-C1-0101-O2","explanation":"Legal constraint: Legal requirements restrict the eligible portfolio and management process. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề IPS Objectives and Constraints.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0102","chapter":1,"number":102,"topic":"IPS Objectives and Constraints","level":"Basic","question":"An investment case describes the following: A client excludes tobacco stocks because of stated personal preferences. Which concept BEST fits?","options":[{"id":"PM-C1-0102-O1","text":"Risk objective"},{"id":"PM-C1-0102-O2","text":"Time-horizon constraint"},{"id":"PM-C1-0102-O3","text":"Unique circumstances"},{"id":"PM-C1-0102-O4","text":"Constraint trade-off"}],"correctOptionId":"PM-C1-0102-O3","explanation":"Unique circumstances: Special preferences or circumstances can shape a permissible portfolio. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề IPS Objectives and Constraints.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0103","chapter":1,"number":103,"topic":"IPS Objectives and Constraints","level":"Basic","question":"An investment case describes the following: An IPS names a bond index against which its bond mandate will be evaluated. Which concept BEST fits?","options":[{"id":"PM-C1-0103-O1","text":"Return objective"},{"id":"PM-C1-0103-O2","text":"Liquidity constraint"},{"id":"PM-C1-0103-O3","text":"Tax constraint"},{"id":"PM-C1-0103-O4","text":"Investment benchmark"}],"correctOptionId":"PM-C1-0103-O4","explanation":"Investment benchmark: A benchmark offers an agreed reference for measuring performance. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề IPS Objectives and Constraints.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0104","chapter":1,"number":104,"topic":"IPS Objectives and Constraints","level":"Basic","question":"An investment case describes the following: A household calculates the annual return needed to reach a defined education-funding amount. Which concept BEST fits?","options":[{"id":"PM-C1-0104-O1","text":"Required return"},{"id":"PM-C1-0104-O2","text":"Risk objective"},{"id":"PM-C1-0104-O3","text":"Time-horizon constraint"},{"id":"PM-C1-0104-O4","text":"Legal constraint"}],"correctOptionId":"PM-C1-0104-O1","explanation":"Required return: Required return is linked to financial goals and cash-flow needs. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề IPS Objectives and Constraints.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0105","chapter":1,"number":105,"topic":"IPS Objectives and Constraints","level":"Basic","question":"An investment case describes the following: A client wants high returns but may need all invested cash next month. Which concept BEST fits?","options":[{"id":"PM-C1-0105-O1","text":"Unique circumstances"},{"id":"PM-C1-0105-O2","text":"Constraint trade-off"},{"id":"PM-C1-0105-O3","text":"Liquidity constraint"},{"id":"PM-C1-0105-O4","text":"Tax constraint"}],"correctOptionId":"PM-C1-0105-O2","explanation":"Constraint trade-off: Objectives must be evaluated jointly with constraints, not in isolation. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề IPS Objectives and Constraints.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0106","chapter":1,"number":106,"topic":"Risk Tolerance","level":"Basic","question":"An investment case describes the following: An investor has stable income, a large emergency fund and few immediate liabilities. Which concept BEST fits?","options":[{"id":"PM-C1-0106-O1","text":"Risk capacity"},{"id":"PM-C1-0106-O2","text":"Tolerance mismatch"},{"id":"PM-C1-0106-O3","text":"Emergency reserve"},{"id":"PM-C1-0106-O4","text":"Risk questionnaire"}],"correctOptionId":"PM-C1-0106-O1","explanation":"Risk capacity: Capacity concerns financial ability to withstand investment losses. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Risk Tolerance.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0107","chapter":1,"number":107,"topic":"Risk Tolerance","level":"Basic","question":"An investment case describes the following: An investor has ample wealth but loses sleep over temporary stock-price declines. Which concept BEST fits?","options":[{"id":"PM-C1-0107-O1","text":"Investor-specific suitability"},{"id":"PM-C1-0107-O2","text":"Risk willingness"},{"id":"PM-C1-0107-O3","text":"Loss constraint"},{"id":"PM-C1-0107-O4","text":"Sequence-of-returns concern"}],"correctOptionId":"PM-C1-0107-O2","explanation":"Risk willingness: Willingness reflects psychological comfort with risk. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Risk Tolerance.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0108","chapter":1,"number":108,"topic":"Risk Tolerance","level":"Basic","question":"An investment case describes the following: Given the same expected payoff, a client chooses the less volatile investment. Which concept BEST fits?","options":[{"id":"PM-C1-0108-O1","text":"Risk questionnaire"},{"id":"PM-C1-0108-O2","text":"Risk-return consistency"},{"id":"PM-C1-0108-O3","text":"Risk aversion"},{"id":"PM-C1-0108-O4","text":"Emergency reserve"}],"correctOptionId":"PM-C1-0108-O3","explanation":"Risk aversion: Risk aversion means preferring less uncertainty when expected returns are equal. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Risk Tolerance.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0109","chapter":1,"number":109,"topic":"Risk Tolerance","level":"Basic","question":"An investment case describes the following: A wealthy client can afford losses but is unwilling to accept equity volatility. Which concept BEST fits?","options":[{"id":"PM-C1-0109-O1","text":"Sequence-of-returns concern"},{"id":"PM-C1-0109-O2","text":"Investor-specific suitability"},{"id":"PM-C1-0109-O3","text":"Risk capacity"},{"id":"PM-C1-0109-O4","text":"Tolerance mismatch"}],"correctOptionId":"PM-C1-0109-O4","explanation":"Tolerance mismatch: Capacity and willingness can diverge and both should be assessed. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Risk Tolerance.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0110","chapter":1,"number":110,"topic":"Risk Tolerance","level":"Basic","question":"An investment case describes the following: A foundation's board sets a portfolio drawdown limit in its mandate. Which concept BEST fits?","options":[{"id":"PM-C1-0110-O1","text":"Loss constraint"},{"id":"PM-C1-0110-O2","text":"Risk questionnaire"},{"id":"PM-C1-0110-O3","text":"Risk-return consistency"},{"id":"PM-C1-0110-O4","text":"Risk willingness"}],"correctOptionId":"PM-C1-0110-O1","explanation":"Loss constraint: Loss limits translate risk preferences into explicit controls. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Risk Tolerance.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0111","chapter":1,"number":111,"topic":"Risk Tolerance","level":"Basic","question":"An investment case describes the following: An investor keeps near-term living costs in readily available cash outside volatile holdings. Which concept BEST fits?","options":[{"id":"PM-C1-0111-O1","text":"Risk aversion"},{"id":"PM-C1-0111-O2","text":"Emergency reserve"},{"id":"PM-C1-0111-O3","text":"Investor-specific suitability"},{"id":"PM-C1-0111-O4","text":"Risk capacity"}],"correctOptionId":"PM-C1-0111-O2","explanation":"Emergency reserve: A cash reserve protects near-term spending from market fluctuations. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Risk Tolerance.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0112","chapter":1,"number":112,"topic":"Risk Tolerance","level":"Basic","question":"An investment case describes the following: A retiree must withdraw money immediately after a sharp market decline. Which concept BEST fits?","options":[{"id":"PM-C1-0112-O1","text":"Risk willingness"},{"id":"PM-C1-0112-O2","text":"Tolerance mismatch"},{"id":"PM-C1-0112-O3","text":"Sequence-of-returns concern"},{"id":"PM-C1-0112-O4","text":"Risk-return consistency"}],"correctOptionId":"PM-C1-0112-O3","explanation":"Sequence-of-returns concern: Portfolio losses near required withdrawals can disproportionately harm future spending. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Risk Tolerance.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0113","chapter":1,"number":113,"topic":"Risk Tolerance","level":"Basic","question":"An investment case describes the following: An adviser uses responses about hypothetical losses to assess emotional reactions. Which concept BEST fits?","options":[{"id":"PM-C1-0113-O1","text":"Risk capacity"},{"id":"PM-C1-0113-O2","text":"Risk aversion"},{"id":"PM-C1-0113-O3","text":"Loss constraint"},{"id":"PM-C1-0113-O4","text":"Risk questionnaire"}],"correctOptionId":"PM-C1-0113-O4","explanation":"Risk questionnaire: Questionnaires help elicit willingness but should not replace financial-capacity analysis. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Risk Tolerance.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0114","chapter":1,"number":114,"topic":"Risk Tolerance","level":"Basic","question":"An investment case describes the following: Two clients of equal age receive different portfolios because their liabilities differ. Which concept BEST fits?","options":[{"id":"PM-C1-0114-O1","text":"Investor-specific suitability"},{"id":"PM-C1-0114-O2","text":"Risk willingness"},{"id":"PM-C1-0114-O3","text":"Tolerance mismatch"},{"id":"PM-C1-0114-O4","text":"Emergency reserve"}],"correctOptionId":"PM-C1-0114-O1","explanation":"Investor-specific suitability: Suitable risk exposure depends on personal circumstances, not age alone. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Risk Tolerance.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0115","chapter":1,"number":115,"topic":"Risk Tolerance","level":"Basic","question":"An investment case describes the following: A client requests equity-like growth with almost no tolerable downside. Which concept BEST fits?","options":[{"id":"PM-C1-0115-O1","text":"Sequence-of-returns concern"},{"id":"PM-C1-0115-O2","text":"Risk-return consistency"},{"id":"PM-C1-0115-O3","text":"Risk aversion"},{"id":"PM-C1-0115-O4","text":"Loss constraint"}],"correctOptionId":"PM-C1-0115-O2","explanation":"Risk-return consistency: Return ambition must be reconciled with risk constraints and achievable opportunities. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Risk Tolerance.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0116","chapter":1,"number":116,"topic":"Investor Life Cycle","level":"Basic","question":"An investment case describes the following: A graduate beginning a career contributes monthly savings toward a distant retirement. Which concept BEST fits?","options":[{"id":"PM-C1-0116-O1","text":"Accumulation phase"},{"id":"PM-C1-0116-O2","text":"Gifting phase"},{"id":"PM-C1-0116-O3","text":"Short investment horizon"},{"id":"PM-C1-0116-O4","text":"Retirement transition"}],"correctOptionId":"PM-C1-0116-O1","explanation":"Accumulation phase: Accumulation generally emphasizes building capital over a long horizon. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investor Life Cycle.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0117","chapter":1,"number":117,"topic":"Investor Life Cycle","level":"Basic","question":"An investment case describes the following: A mid-career saver has built substantial wealth and adjusts toward balanced growth. Which concept BEST fits?","options":[{"id":"PM-C1-0117-O1","text":"Estate-planning goal"},{"id":"PM-C1-0117-O2","text":"Consolidation phase"},{"id":"PM-C1-0117-O3","text":"Long investment horizon"},{"id":"PM-C1-0117-O4","text":"Income stability"}],"correctOptionId":"PM-C1-0117-O2","explanation":"Consolidation phase: Consolidation focuses on growing and protecting accumulated capital. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investor Life Cycle.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0118","chapter":1,"number":118,"topic":"Investor Life Cycle","level":"Basic","question":"An investment case describes the following: A recently retired person withdraws money to meet recurring living expenses. Which concept BEST fits?","options":[{"id":"PM-C1-0118-O1","text":"Retirement transition"},{"id":"PM-C1-0118-O2","text":"Life-event reassessment"},{"id":"PM-C1-0118-O3","text":"Spending phase"},{"id":"PM-C1-0118-O4","text":"Short investment horizon"}],"correctOptionId":"PM-C1-0118-O3","explanation":"Spending phase: Spending requires portfolio cash flows and a workable withdrawal plan. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investor Life Cycle.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0119","chapter":1,"number":119,"topic":"Investor Life Cycle","level":"Basic","question":"An investment case describes the following: A wealthy retired client plans charitable transfers and bequests. Which concept BEST fits?","options":[{"id":"PM-C1-0119-O1","text":"Income stability"},{"id":"PM-C1-0119-O2","text":"Estate-planning goal"},{"id":"PM-C1-0119-O3","text":"Accumulation phase"},{"id":"PM-C1-0119-O4","text":"Gifting phase"}],"correctOptionId":"PM-C1-0119-O4","explanation":"Gifting phase: Gifting concerns distributing wealth to beneficiaries and causes. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investor Life Cycle.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0120","chapter":1,"number":120,"topic":"Investor Life Cycle","level":"Basic","question":"An investment case describes the following: An investor has no expected withdrawals from retirement savings for 35 years. Which concept BEST fits?","options":[{"id":"PM-C1-0120-O1","text":"Long investment horizon"},{"id":"PM-C1-0120-O2","text":"Retirement transition"},{"id":"PM-C1-0120-O3","text":"Life-event reassessment"},{"id":"PM-C1-0120-O4","text":"Consolidation phase"}],"correctOptionId":"PM-C1-0120-O1","explanation":"Long investment horizon: A long horizon can increase capacity for illiquid or volatile exposures, subject to circumstances. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investor Life Cycle.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0121","chapter":1,"number":121,"topic":"Investor Life Cycle","level":"Basic","question":"An investment case describes the following: A couple plans to purchase a house within nine months. Which concept BEST fits?","options":[{"id":"PM-C1-0121-O1","text":"Spending phase"},{"id":"PM-C1-0121-O2","text":"Short investment horizon"},{"id":"PM-C1-0121-O3","text":"Estate-planning goal"},{"id":"PM-C1-0121-O4","text":"Accumulation phase"}],"correctOptionId":"PM-C1-0121-O2","explanation":"Short investment horizon: Short horizons put greater weight on liquidity and principal preservation. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investor Life Cycle.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0122","chapter":1,"number":122,"topic":"Investor Life Cycle","level":"Basic","question":"An investment case describes the following: A household with predictable employment income can fund normal expenses without selling investments. Which concept BEST fits?","options":[{"id":"PM-C1-0122-O1","text":"Consolidation phase"},{"id":"PM-C1-0122-O2","text":"Gifting phase"},{"id":"PM-C1-0122-O3","text":"Income stability"},{"id":"PM-C1-0122-O4","text":"Life-event reassessment"}],"correctOptionId":"PM-C1-0122-O3","explanation":"Income stability: Reliable external cash flows can support greater financial risk capacity. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investor Life Cycle.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0123","chapter":1,"number":123,"topic":"Investor Life Cycle","level":"Basic","question":"An investment case describes the following: An individual shifts from regular contributions to recurring withdrawals. Which concept BEST fits?","options":[{"id":"PM-C1-0123-O1","text":"Accumulation phase"},{"id":"PM-C1-0123-O2","text":"Spending phase"},{"id":"PM-C1-0123-O3","text":"Long investment horizon"},{"id":"PM-C1-0123-O4","text":"Retirement transition"}],"correctOptionId":"PM-C1-0123-O4","explanation":"Retirement transition: Retirement changes portfolio cash-flow requirements and risk management. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investor Life Cycle.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0124","chapter":1,"number":124,"topic":"Investor Life Cycle","level":"Basic","question":"An investment case describes the following: A client decides which assets should pass to family members in future. Which concept BEST fits?","options":[{"id":"PM-C1-0124-O1","text":"Estate-planning goal"},{"id":"PM-C1-0124-O2","text":"Consolidation phase"},{"id":"PM-C1-0124-O3","text":"Gifting phase"},{"id":"PM-C1-0124-O4","text":"Short investment horizon"}],"correctOptionId":"PM-C1-0124-O1","explanation":"Estate-planning goal: Estate objectives affect planning beyond the investor's own lifetime. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investor Life Cycle.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0125","chapter":1,"number":125,"topic":"Investor Life Cycle","level":"Basic","question":"An investment case describes the following: An unexpected medical bill changes the amount of money a family needs accessible. Which concept BEST fits?","options":[{"id":"PM-C1-0125-O1","text":"Income stability"},{"id":"PM-C1-0125-O2","text":"Life-event reassessment"},{"id":"PM-C1-0125-O3","text":"Spending phase"},{"id":"PM-C1-0125-O4","text":"Long investment horizon"}],"correctOptionId":"PM-C1-0125-O2","explanation":"Life-event reassessment: Material life events can change investment constraints and allocation suitability. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investor Life Cycle.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0126","chapter":1,"number":126,"topic":"Asset Allocation","level":"Basic","question":"An investment case describes the following: A pension fund adopts a 55/35/10 equity/bond/cash policy for the long term. Which concept BEST fits?","options":[{"id":"PM-C1-0126-O1","text":"Strategic asset allocation"},{"id":"PM-C1-0126-O2","text":"Overweight position"},{"id":"PM-C1-0126-O3","text":"Policy range"},{"id":"PM-C1-0126-O4","text":"Asset-class mix"}],"correctOptionId":"PM-C1-0126-O1","explanation":"Strategic asset allocation: Strategic allocation sets long-term target exposures consistent with policy. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Asset Allocation.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0127","chapter":1,"number":127,"topic":"Asset Allocation","level":"Basic","question":"An investment case describes the following: An investment committee temporarily increases bonds because it expects weaker equity returns. Which concept BEST fits?","options":[{"id":"PM-C1-0127-O1","text":"Rebalancing cost"},{"id":"PM-C1-0127-O2","text":"Tactical asset allocation"},{"id":"PM-C1-0127-O3","text":"Underweight position"},{"id":"PM-C1-0127-O4","text":"Market-timing decision"}],"correctOptionId":"PM-C1-0127-O2","explanation":"Tactical asset allocation: Tactical allocation makes temporary departures from strategic weights based on opportunities. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Asset Allocation.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0128","chapter":1,"number":128,"topic":"Asset Allocation","level":"Basic","question":"An investment case describes the following: Shares rise and exceed their policy band; the fund trims shares toward target. Which concept BEST fits?","options":[{"id":"PM-C1-0128-O1","text":"Asset-class mix"},{"id":"PM-C1-0128-O2","text":"Policy discipline"},{"id":"PM-C1-0128-O3","text":"Rebalancing"},{"id":"PM-C1-0128-O4","text":"Policy range"}],"correctOptionId":"PM-C1-0128-O3","explanation":"Rebalancing: Rebalancing restores policy allocations after market movements. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Asset Allocation.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0129","chapter":1,"number":129,"topic":"Asset Allocation","level":"Basic","question":"An investment case describes the following: The portfolio's equity weight is 65% while its strategic target is 55%. Which concept BEST fits?","options":[{"id":"PM-C1-0129-O1","text":"Market-timing decision"},{"id":"PM-C1-0129-O2","text":"Rebalancing cost"},{"id":"PM-C1-0129-O3","text":"Strategic asset allocation"},{"id":"PM-C1-0129-O4","text":"Overweight position"}],"correctOptionId":"PM-C1-0129-O4","explanation":"Overweight position: An overweight is an exposure above the reference or target allocation. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Asset Allocation.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0130","chapter":1,"number":130,"topic":"Asset Allocation","level":"Basic","question":"An investment case describes the following: The portfolio's bond weight is 20% versus a long-run policy target of 35%. Which concept BEST fits?","options":[{"id":"PM-C1-0130-O1","text":"Underweight position"},{"id":"PM-C1-0130-O2","text":"Asset-class mix"},{"id":"PM-C1-0130-O3","text":"Policy discipline"},{"id":"PM-C1-0130-O4","text":"Tactical asset allocation"}],"correctOptionId":"PM-C1-0130-O1","explanation":"Underweight position: An underweight is an exposure below the benchmark or policy weight. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Asset Allocation.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0131","chapter":1,"number":131,"topic":"Asset Allocation","level":"Basic","question":"An investment case describes the following: An IPS permits equities to move between 45% and 55% around a 50% target. Which concept BEST fits?","options":[{"id":"PM-C1-0131-O1","text":"Rebalancing"},{"id":"PM-C1-0131-O2","text":"Policy range"},{"id":"PM-C1-0131-O3","text":"Rebalancing cost"},{"id":"PM-C1-0131-O4","text":"Strategic asset allocation"}],"correctOptionId":"PM-C1-0131-O2","explanation":"Policy range: Tolerance bands define acceptable drift before intervention. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Asset Allocation.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0132","chapter":1,"number":132,"topic":"Asset Allocation","level":"Basic","question":"An investment case describes the following: A manager substantially reduces equity risk because of a short-term market forecast. Which concept BEST fits?","options":[{"id":"PM-C1-0132-O1","text":"Tactical asset allocation"},{"id":"PM-C1-0132-O2","text":"Overweight position"},{"id":"PM-C1-0132-O3","text":"Market-timing decision"},{"id":"PM-C1-0132-O4","text":"Policy discipline"}],"correctOptionId":"PM-C1-0132-O3","explanation":"Market-timing decision: Market timing attempts to change exposure based on expected market movements. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Asset Allocation.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0133","chapter":1,"number":133,"topic":"Asset Allocation","level":"Basic","question":"An investment case describes the following: A committee chooses equity, fixed-income, cash and real-estate proportions for its client. Which concept BEST fits?","options":[{"id":"PM-C1-0133-O1","text":"Strategic asset allocation"},{"id":"PM-C1-0133-O2","text":"Rebalancing"},{"id":"PM-C1-0133-O3","text":"Underweight position"},{"id":"PM-C1-0133-O4","text":"Asset-class mix"}],"correctOptionId":"PM-C1-0133-O4","explanation":"Asset-class mix: Asset-class mix is a cross-asset distribution decision. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Asset Allocation.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0134","chapter":1,"number":134,"topic":"Asset Allocation","level":"Basic","question":"An investment case describes the following: An adviser estimates trading costs and taxes before restoring a portfolio's exact weights. Which concept BEST fits?","options":[{"id":"PM-C1-0134-O1","text":"Rebalancing cost"},{"id":"PM-C1-0134-O2","text":"Tactical asset allocation"},{"id":"PM-C1-0134-O3","text":"Overweight position"},{"id":"PM-C1-0134-O4","text":"Policy range"}],"correctOptionId":"PM-C1-0134-O1","explanation":"Rebalancing cost: Rebalancing has implementation costs that may alter the best timing. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Asset Allocation.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0135","chapter":1,"number":135,"topic":"Asset Allocation","level":"Basic","question":"An investment case describes the following: A manager resists chasing last month's winning asset and follows IPS allocations. Which concept BEST fits?","options":[{"id":"PM-C1-0135-O1","text":"Market-timing decision"},{"id":"PM-C1-0135-O2","text":"Policy discipline"},{"id":"PM-C1-0135-O3","text":"Rebalancing"},{"id":"PM-C1-0135-O4","text":"Underweight position"}],"correctOptionId":"PM-C1-0135-O2","explanation":"Policy discipline: Policy discipline prevents temporary performance from overriding agreed strategy. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Asset Allocation.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0136","chapter":1,"number":136,"topic":"Investment Strategies","level":"Basic","question":"An investment case describes the following: A fund selects stocks with the explicit aim of beating its market benchmark. Which concept BEST fits?","options":[{"id":"PM-C1-0136-O1","text":"Active management"},{"id":"PM-C1-0136-O2","text":"Bottom-up analysis"},{"id":"PM-C1-0136-O3","text":"Technical analysis"},{"id":"PM-C1-0136-O4","text":"Security mispricing strategy"}],"correctOptionId":"PM-C1-0136-O1","explanation":"Active management: Active management seeks excess performance through discretionary decisions. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Strategies.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0137","chapter":1,"number":137,"topic":"Investment Strategies","level":"Basic","question":"An investment case describes the following: A fund broadly replicates a market index at relatively low turnover. Which concept BEST fits?","options":[{"id":"PM-C1-0137-O1","text":"Benchmark-relative objective"},{"id":"PM-C1-0137-O2","text":"Passive management"},{"id":"PM-C1-0137-O3","text":"Fundamental analysis"},{"id":"PM-C1-0137-O4","text":"Index replication"}],"correctOptionId":"PM-C1-0137-O2","explanation":"Passive management: Passive management aims to track an index rather than outperform it. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Strategies.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0138","chapter":1,"number":138,"topic":"Investment Strategies","level":"Basic","question":"An investment case describes the following: A research team starts with inflation, then sectors, and finally particular stocks. Which concept BEST fits?","options":[{"id":"PM-C1-0138-O1","text":"Security mispricing strategy"},{"id":"PM-C1-0138-O2","text":"Market forecast exposure"},{"id":"PM-C1-0138-O3","text":"Top-down analysis"},{"id":"PM-C1-0138-O4","text":"Technical analysis"}],"correctOptionId":"PM-C1-0138-O3","explanation":"Top-down analysis: Top-down analysis moves from macroeconomic views to industries and securities. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Strategies.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0139","chapter":1,"number":139,"topic":"Investment Strategies","level":"Basic","question":"An investment case describes the following: An analyst begins with individual company finances and valuations, not economic forecasts. Which concept BEST fits?","options":[{"id":"PM-C1-0139-O1","text":"Index replication"},{"id":"PM-C1-0139-O2","text":"Benchmark-relative objective"},{"id":"PM-C1-0139-O3","text":"Active management"},{"id":"PM-C1-0139-O4","text":"Bottom-up analysis"}],"correctOptionId":"PM-C1-0139-O4","explanation":"Bottom-up analysis: Bottom-up analysis starts at security or company level. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Strategies.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0140","chapter":1,"number":140,"topic":"Investment Strategies","level":"Basic","question":"An investment case describes the following: An analyst values a business using cash flows, profitability and financial strength. Which concept BEST fits?","options":[{"id":"PM-C1-0140-O1","text":"Fundamental analysis"},{"id":"PM-C1-0140-O2","text":"Security mispricing strategy"},{"id":"PM-C1-0140-O3","text":"Market forecast exposure"},{"id":"PM-C1-0140-O4","text":"Passive management"}],"correctOptionId":"PM-C1-0140-O1","explanation":"Fundamental analysis: Fundamental analysis attempts to estimate intrinsic economic value. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Strategies.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0141","chapter":1,"number":141,"topic":"Investment Strategies","level":"Basic","question":"An investment case describes the following: A trader studies historical prices, volumes and chart patterns. Which concept BEST fits?","options":[{"id":"PM-C1-0141-O1","text":"Top-down analysis"},{"id":"PM-C1-0141-O2","text":"Technical analysis"},{"id":"PM-C1-0141-O3","text":"Benchmark-relative objective"},{"id":"PM-C1-0141-O4","text":"Active management"}],"correctOptionId":"PM-C1-0141-O2","explanation":"Technical analysis: Technical analysis studies market-price and volume information. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Strategies.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0142","chapter":1,"number":142,"topic":"Investment Strategies","level":"Basic","question":"An investment case describes the following: An equity portfolio buys its benchmark's constituent shares in nearly matching proportions. Which concept BEST fits?","options":[{"id":"PM-C1-0142-O1","text":"Passive management"},{"id":"PM-C1-0142-O2","text":"Bottom-up analysis"},{"id":"PM-C1-0142-O3","text":"Index replication"},{"id":"PM-C1-0142-O4","text":"Market forecast exposure"}],"correctOptionId":"PM-C1-0142-O3","explanation":"Index replication: Replication is a passive way to obtain index exposure. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Strategies.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0143","chapter":1,"number":143,"topic":"Investment Strategies","level":"Basic","question":"An investment case describes the following: A manager buys a security because estimated intrinsic value exceeds market quotation. Which concept BEST fits?","options":[{"id":"PM-C1-0143-O1","text":"Active management"},{"id":"PM-C1-0143-O2","text":"Top-down analysis"},{"id":"PM-C1-0143-O3","text":"Fundamental analysis"},{"id":"PM-C1-0143-O4","text":"Security mispricing strategy"}],"correctOptionId":"PM-C1-0143-O4","explanation":"Security mispricing strategy: Seeking mispricing is an active valuation-based security decision. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Strategies.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0144","chapter":1,"number":144,"topic":"Investment Strategies","level":"Basic","question":"An investment case describes the following: A manager targets outperformance against a named market index, after costs. Which concept BEST fits?","options":[{"id":"PM-C1-0144-O1","text":"Benchmark-relative objective"},{"id":"PM-C1-0144-O2","text":"Passive management"},{"id":"PM-C1-0144-O3","text":"Bottom-up analysis"},{"id":"PM-C1-0144-O4","text":"Technical analysis"}],"correctOptionId":"PM-C1-0144-O1","explanation":"Benchmark-relative objective: A relative objective compares returns with a chosen benchmark. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Strategies.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0145","chapter":1,"number":145,"topic":"Investment Strategies","level":"Basic","question":"An investment case describes the following: An allocator increases equity weight after predicting improving aggregate earnings. Which concept BEST fits?","options":[{"id":"PM-C1-0145-O1","text":"Index replication"},{"id":"PM-C1-0145-O2","text":"Market forecast exposure"},{"id":"PM-C1-0145-O3","text":"Top-down analysis"},{"id":"PM-C1-0145-O4","text":"Fundamental analysis"}],"correctOptionId":"PM-C1-0145-O2","explanation":"Market forecast exposure: Forecast-driven changing exposure is tactical or active allocation. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Investment Strategies.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0146","chapter":1,"number":146,"topic":"Security Analysis","level":"Basic","question":"An investment case describes the following: Projected cash flows are discounted to estimate an equity's economic worth. Which concept BEST fits?","options":[{"id":"PM-C1-0146-O1","text":"Intrinsic value estimate"},{"id":"PM-C1-0146-O2","text":"Overvalued hypothesis"},{"id":"PM-C1-0146-O3","text":"Earnings assessment"},{"id":"PM-C1-0146-O4","text":"Industry analysis"}],"correctOptionId":"PM-C1-0146-O1","explanation":"Intrinsic value estimate: Intrinsic value is an analyst's estimate, distinct from observed market price. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Security Analysis.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0147","chapter":1,"number":147,"topic":"Security Analysis","level":"Basic","question":"An investment case describes the following: A listed share trades at an observable exchange price of $42. Which concept BEST fits?","options":[{"id":"PM-C1-0147-O1","text":"Company analysis"},{"id":"PM-C1-0147-O2","text":"Market quotation"},{"id":"PM-C1-0147-O3","text":"Discounted cash-flow approach"},{"id":"PM-C1-0147-O4","text":"Macroeconomic assessment"}],"correctOptionId":"PM-C1-0147-O2","explanation":"Market quotation: Market price is the current transacted or quoted price. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Security Analysis.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0148","chapter":1,"number":148,"topic":"Security Analysis","level":"Basic","question":"An investment case describes the following: An analyst estimates intrinsic value of $65 for a security offered at $50. Which concept BEST fits?","options":[{"id":"PM-C1-0148-O1","text":"Industry analysis"},{"id":"PM-C1-0148-O2","text":"Security selection"},{"id":"PM-C1-0148-O3","text":"Undervalued hypothesis"},{"id":"PM-C1-0148-O4","text":"Earnings assessment"}],"correctOptionId":"PM-C1-0148-O3","explanation":"Undervalued hypothesis: Estimated value above price suggests undervaluation given the assumptions. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Security Analysis.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0149","chapter":1,"number":149,"topic":"Security Analysis","level":"Basic","question":"An investment case describes the following: An analyst estimates a stock's value at $38 while it trades for $51. Which concept BEST fits?","options":[{"id":"PM-C1-0149-O1","text":"Macroeconomic assessment"},{"id":"PM-C1-0149-O2","text":"Company analysis"},{"id":"PM-C1-0149-O3","text":"Intrinsic value estimate"},{"id":"PM-C1-0149-O4","text":"Overvalued hypothesis"}],"correctOptionId":"PM-C1-0149-O4","explanation":"Overvalued hypothesis: Estimated value below price suggests overvaluation under the model. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Security Analysis.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0150","chapter":1,"number":150,"topic":"Security Analysis","level":"Basic","question":"An investment case describes the following: An analyst projects free cash flows and discounts them to present value. Which concept BEST fits?","options":[{"id":"PM-C1-0150-O1","text":"Discounted cash-flow approach"},{"id":"PM-C1-0150-O2","text":"Industry analysis"},{"id":"PM-C1-0150-O3","text":"Security selection"},{"id":"PM-C1-0150-O4","text":"Market quotation"}],"correctOptionId":"PM-C1-0150-O1","explanation":"Discounted cash-flow approach: DCF estimates value from forecast future cash flows and discount rates. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Security Analysis.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0151","chapter":1,"number":151,"topic":"Security Analysis","level":"Basic","question":"An investment case describes the following: A researcher examines margins, profitability and earnings quality. Which concept BEST fits?","options":[{"id":"PM-C1-0151-O1","text":"Undervalued hypothesis"},{"id":"PM-C1-0151-O2","text":"Earnings assessment"},{"id":"PM-C1-0151-O3","text":"Company analysis"},{"id":"PM-C1-0151-O4","text":"Intrinsic value estimate"}],"correctOptionId":"PM-C1-0151-O2","explanation":"Earnings assessment: Earnings analysis studies the business's capacity to generate sustainable profit. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Security Analysis.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0152","chapter":1,"number":152,"topic":"Security Analysis","level":"Basic","question":"An investment case describes the following: An equity report starts by evaluating economic growth, inflation and rates. Which concept BEST fits?","options":[{"id":"PM-C1-0152-O1","text":"Market quotation"},{"id":"PM-C1-0152-O2","text":"Overvalued hypothesis"},{"id":"PM-C1-0152-O3","text":"Macroeconomic assessment"},{"id":"PM-C1-0152-O4","text":"Security selection"}],"correctOptionId":"PM-C1-0152-O3","explanation":"Macroeconomic assessment: Macroeconomic review considers economy-wide drivers of returns. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Security Analysis.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0153","chapter":1,"number":153,"topic":"Security Analysis","level":"Basic","question":"An investment case describes the following: An analyst compares airline-sector competition and demand before naming specific stocks. Which concept BEST fits?","options":[{"id":"PM-C1-0153-O1","text":"Intrinsic value estimate"},{"id":"PM-C1-0153-O2","text":"Undervalued hypothesis"},{"id":"PM-C1-0153-O3","text":"Discounted cash-flow approach"},{"id":"PM-C1-0153-O4","text":"Industry analysis"}],"correctOptionId":"PM-C1-0153-O4","explanation":"Industry analysis: Industry analysis evaluates prospects at the sector level. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Security Analysis.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0154","chapter":1,"number":154,"topic":"Security Analysis","level":"Basic","question":"An investment case describes the following: An analyst studies a firm's balance sheet and competitive advantage. Which concept BEST fits?","options":[{"id":"PM-C1-0154-O1","text":"Company analysis"},{"id":"PM-C1-0154-O2","text":"Market quotation"},{"id":"PM-C1-0154-O3","text":"Overvalued hypothesis"},{"id":"PM-C1-0154-O4","text":"Earnings assessment"}],"correctOptionId":"PM-C1-0154-O1","explanation":"Company analysis: Company-level analysis evaluates individual issuer fundamentals. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Security Analysis.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0155","chapter":1,"number":155,"topic":"Security Analysis","level":"Basic","question":"An investment case describes the following: A manager chooses among approved stocks after comparing expected upside and risk. Which concept BEST fits?","options":[{"id":"PM-C1-0155-O1","text":"Macroeconomic assessment"},{"id":"PM-C1-0155-O2","text":"Security selection"},{"id":"PM-C1-0155-O3","text":"Undervalued hypothesis"},{"id":"PM-C1-0155-O4","text":"Discounted cash-flow approach"}],"correctOptionId":"PM-C1-0155-O2","explanation":"Security selection: Security selection ranks individual instruments for portfolio inclusion. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Security Analysis.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0156","chapter":1,"number":156,"topic":"Performance and Feedback","level":"Basic","question":"An investment case describes the following: A portfolio earned 8% over the calendar year, without reference to a benchmark. Which concept BEST fits?","options":[{"id":"PM-C1-0156-O1","text":"Absolute return"},{"id":"PM-C1-0156-O2","text":"Money-weighted return"},{"id":"PM-C1-0156-O3","text":"Tracking error"},{"id":"PM-C1-0156-O4","text":"Risk-adjusted evaluation"}],"correctOptionId":"PM-C1-0156-O1","explanation":"Absolute return: Absolute return reports performance on its own. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Performance and Feedback.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0157","chapter":1,"number":157,"topic":"Performance and Feedback","level":"Basic","question":"An investment case describes the following: A portfolio returned 9% while its benchmark gained 7%, yielding 2 percentage points of excess return. Which concept BEST fits?","options":[{"id":"PM-C1-0157-O1","text":"Attribution analysis"},{"id":"PM-C1-0157-O2","text":"Relative return"},{"id":"PM-C1-0157-O3","text":"Benchmark selection"},{"id":"PM-C1-0157-O4","text":"Net performance"}],"correctOptionId":"PM-C1-0157-O2","explanation":"Relative return: Relative performance compares the investment to a reference. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Performance and Feedback.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0158","chapter":1,"number":158,"topic":"Performance and Feedback","level":"Basic","question":"An investment case describes the following: A manager wants to measure performance without rewarding client cash deposits made at lucky times. Which concept BEST fits?","options":[{"id":"PM-C1-0158-O1","text":"Risk-adjusted evaluation"},{"id":"PM-C1-0158-O2","text":"Monitoring feedback"},{"id":"PM-C1-0158-O3","text":"Time-weighted return"},{"id":"PM-C1-0158-O4","text":"Tracking error"}],"correctOptionId":"PM-C1-0158-O3","explanation":"Time-weighted return: Time-weighted return reduces the effect of the timing of external cash flows. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Performance and Feedback.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0159","chapter":1,"number":159,"topic":"Performance and Feedback","level":"Basic","question":"An investment case describes the following: An investor calculates an IRR that accounts for personal contributions and withdrawals. Which concept BEST fits?","options":[{"id":"PM-C1-0159-O1","text":"Net performance"},{"id":"PM-C1-0159-O2","text":"Attribution analysis"},{"id":"PM-C1-0159-O3","text":"Absolute return"},{"id":"PM-C1-0159-O4","text":"Money-weighted return"}],"correctOptionId":"PM-C1-0159-O4","explanation":"Money-weighted return: Money-weighted return reflects the timing and sizes of the investor's cash flows. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Performance and Feedback.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0160","chapter":1,"number":160,"topic":"Performance and Feedback","level":"Basic","question":"An investment case describes the following: A global equity manager is evaluated against an agreed global stock index. Which concept BEST fits?","options":[{"id":"PM-C1-0160-O1","text":"Benchmark selection"},{"id":"PM-C1-0160-O2","text":"Risk-adjusted evaluation"},{"id":"PM-C1-0160-O3","text":"Monitoring feedback"},{"id":"PM-C1-0160-O4","text":"Relative return"}],"correctOptionId":"PM-C1-0160-O1","explanation":"Benchmark selection: A relevant benchmark matches the investment mandate. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Performance and Feedback.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0161","chapter":1,"number":161,"topic":"Performance and Feedback","level":"Basic","question":"An investment case describes the following: A passive fund measures variability of its returns relative to an index. Which concept BEST fits?","options":[{"id":"PM-C1-0161-O1","text":"Time-weighted return"},{"id":"PM-C1-0161-O2","text":"Tracking error"},{"id":"PM-C1-0161-O3","text":"Attribution analysis"},{"id":"PM-C1-0161-O4","text":"Absolute return"}],"correctOptionId":"PM-C1-0161-O2","explanation":"Tracking error: Tracking error quantifies dispersion of active returns around benchmark returns. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Performance and Feedback.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0162","chapter":1,"number":162,"topic":"Performance and Feedback","level":"Basic","question":"An investment case describes the following: A portfolio's gross return is reduced by advisory and trading fees to calculate investor experience. Which concept BEST fits?","options":[{"id":"PM-C1-0162-O1","text":"Relative return"},{"id":"PM-C1-0162-O2","text":"Money-weighted return"},{"id":"PM-C1-0162-O3","text":"Net performance"},{"id":"PM-C1-0162-O4","text":"Monitoring feedback"}],"correctOptionId":"PM-C1-0162-O3","explanation":"Net performance: Net return reflects relevant investment costs. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Performance and Feedback.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0163","chapter":1,"number":163,"topic":"Performance and Feedback","level":"Basic","question":"An investment case describes the following: Two portfolios' returns are compared after accounting for differences in volatility. Which concept BEST fits?","options":[{"id":"PM-C1-0163-O1","text":"Absolute return"},{"id":"PM-C1-0163-O2","text":"Time-weighted return"},{"id":"PM-C1-0163-O3","text":"Benchmark selection"},{"id":"PM-C1-0163-O4","text":"Risk-adjusted evaluation"}],"correctOptionId":"PM-C1-0163-O4","explanation":"Risk-adjusted evaluation: Risk-adjusted evaluation considers risk undertaken to earn returns. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Performance and Feedback.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0164","chapter":1,"number":164,"topic":"Performance and Feedback","level":"Basic","question":"An investment case describes the following: A review separates the manager's results into allocation and stock-selection contributions. Which concept BEST fits?","options":[{"id":"PM-C1-0164-O1","text":"Attribution analysis"},{"id":"PM-C1-0164-O2","text":"Relative return"},{"id":"PM-C1-0164-O3","text":"Money-weighted return"},{"id":"PM-C1-0164-O4","text":"Tracking error"}],"correctOptionId":"PM-C1-0164-O1","explanation":"Attribution analysis: Attribution analyzes sources of relative performance. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Performance and Feedback.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0165","chapter":1,"number":165,"topic":"Performance and Feedback","level":"Basic","question":"An investment case describes the following: The investor updates allocation policy after evaluating changing goals and results. Which concept BEST fits?","options":[{"id":"PM-C1-0165-O1","text":"Net performance"},{"id":"PM-C1-0165-O2","text":"Monitoring feedback"},{"id":"PM-C1-0165-O3","text":"Time-weighted return"},{"id":"PM-C1-0165-O4","text":"Benchmark selection"}],"correctOptionId":"PM-C1-0165-O2","explanation":"Monitoring feedback: Feedback combines evaluation with suitable revisions to implementation. Các lựa chọn còn lại thuộc những khái niệm khác trong chủ đề Performance and Feedback.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0166","chapter":1,"number":166,"topic":"Portfolio & Asset Classes","level":"Intermediate","question":"Which example MOST directly demonstrates \"Investment portfolio\"?","options":[{"id":"PM-C1-0166-O1","text":"A client owns bonds, equities and investment property in one coordinated holding."},{"id":"PM-C1-0166-O2","text":"A shareholder votes in a company's annual general meeting and participates in residual profit."},{"id":"PM-C1-0166-O3","text":"An allocator groups domestic equities and investment-grade bonds into separate exposure buckets."},{"id":"PM-C1-0166-O4","text":"A portfolio holds a physical gold allocation to diversify exposure to company cash flows."}],"correctOptionId":"PM-C1-0166-O1","explanation":"Tình huống chính: A client owns bonds, equities and investment property in one coordinated holding. A portfolio brings together different investment assets under a common strategy. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0167","chapter":1,"number":167,"topic":"Portfolio & Asset Classes","level":"Intermediate","question":"Which example MOST directly demonstrates \"Financial asset\"?","options":[{"id":"PM-C1-0167-O1","text":"A client's capital is spread across several imperfectly correlated investment holdings."},{"id":"PM-C1-0167-O2","text":"An investor acquires a corporate note that gives contractual rights to future payments."},{"id":"PM-C1-0167-O3","text":"A company issues a five-year bond promising interest and principal repayment."},{"id":"PM-C1-0167-O4","text":"An investor owns and manages a warehouse, rather than purchasing a property-fund unit."}],"correctOptionId":"PM-C1-0167-O2","explanation":"Tình huống chính: An investor acquires a corporate note that gives contractual rights to future payments. A financial asset is a claim or financial contract rather than direct ownership of a physical resource. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0168","chapter":1,"number":168,"topic":"Portfolio & Asset Classes","level":"Intermediate","question":"Which example MOST directly demonstrates \"Real asset\"?","options":[{"id":"PM-C1-0168-O1","text":"A portfolio holds a physical gold allocation to diversify exposure to company cash flows."},{"id":"PM-C1-0168-O2","text":"Seventy percent of a portfolio is invested in a single listed company."},{"id":"PM-C1-0168-O3","text":"An individual directly purchases an apartment and receives rental income."},{"id":"PM-C1-0168-O4","text":"An allocator groups domestic equities and investment-grade bonds into separate exposure buckets."}],"correctOptionId":"PM-C1-0168-O3","explanation":"Tình huống chính: An individual directly purchases an apartment and receives rental income. Real assets have intrinsic physical or productive form, unlike claims issued by others. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0169","chapter":1,"number":169,"topic":"Portfolio & Asset Classes","level":"Intermediate","question":"Which example MOST directly demonstrates \"Common equity\"?","options":[{"id":"PM-C1-0169-O1","text":"An investor owns and manages a warehouse, rather than purchasing a property-fund unit."},{"id":"PM-C1-0169-O2","text":"A client's capital is spread across several imperfectly correlated investment holdings."},{"id":"PM-C1-0169-O3","text":"A client owns bonds, equities and investment property in one coordinated holding."},{"id":"PM-C1-0169-O4","text":"A shareholder votes in a company's annual general meeting and participates in residual profit."}],"correctOptionId":"PM-C1-0169-O4","explanation":"Tình huống chính: A shareholder votes in a company's annual general meeting and participates in residual profit. Common shares represent ownership and residual corporate claims. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0170","chapter":1,"number":170,"topic":"Portfolio & Asset Classes","level":"Intermediate","question":"Which example MOST directly demonstrates \"Debt security\"?","options":[{"id":"PM-C1-0170-O1","text":"A company issues a five-year bond promising interest and principal repayment."},{"id":"PM-C1-0170-O2","text":"A portfolio holds a physical gold allocation to diversify exposure to company cash flows."},{"id":"PM-C1-0170-O3","text":"Seventy percent of a portfolio is invested in a single listed company."},{"id":"PM-C1-0170-O4","text":"An investor acquires a corporate note that gives contractual rights to future payments."}],"correctOptionId":"PM-C1-0170-O1","explanation":"Tình huống chính: A company issues a five-year bond promising interest and principal repayment. Bonds are creditor claims with contractual payment terms. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0171","chapter":1,"number":171,"topic":"Portfolio & Asset Classes","level":"Intermediate","question":"Which example MOST directly demonstrates \"Asset class\"?","options":[{"id":"PM-C1-0171-O1","text":"An individual directly purchases an apartment and receives rental income."},{"id":"PM-C1-0171-O2","text":"An allocator groups domestic equities and investment-grade bonds into separate exposure buckets."},{"id":"PM-C1-0171-O3","text":"A client's capital is spread across several imperfectly correlated investment holdings."},{"id":"PM-C1-0171-O4","text":"A client owns bonds, equities and investment property in one coordinated holding."}],"correctOptionId":"PM-C1-0171-O2","explanation":"Tình huống chính: An allocator groups domestic equities and investment-grade bonds into separate exposure buckets. Asset classes group investments with broadly similar economic characteristics. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0172","chapter":1,"number":172,"topic":"Portfolio & Asset Classes","level":"Intermediate","question":"Which example MOST directly demonstrates \"Direct property holding\"?","options":[{"id":"PM-C1-0172-O1","text":"An investor acquires a corporate note that gives contractual rights to future payments."},{"id":"PM-C1-0172-O2","text":"A shareholder votes in a company's annual general meeting and participates in residual profit."},{"id":"PM-C1-0172-O3","text":"An investor owns and manages a warehouse, rather than purchasing a property-fund unit."},{"id":"PM-C1-0172-O4","text":"Seventy percent of a portfolio is invested in a single listed company."}],"correctOptionId":"PM-C1-0172-O3","explanation":"Tình huống chính: An investor owns and manages a warehouse, rather than purchasing a property-fund unit. Direct property exposure means owning the underlying real estate itself. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0173","chapter":1,"number":173,"topic":"Portfolio & Asset Classes","level":"Intermediate","question":"Which example MOST directly demonstrates \"Commodity exposure\"?","options":[{"id":"PM-C1-0173-O1","text":"A client owns bonds, equities and investment property in one coordinated holding."},{"id":"PM-C1-0173-O2","text":"An individual directly purchases an apartment and receives rental income."},{"id":"PM-C1-0173-O3","text":"A company issues a five-year bond promising interest and principal repayment."},{"id":"PM-C1-0173-O4","text":"A portfolio holds a physical gold allocation to diversify exposure to company cash flows."}],"correctOptionId":"PM-C1-0173-O4","explanation":"Tình huống chính: A portfolio holds a physical gold allocation to diversify exposure to company cash flows. Gold is a commodity and differs from a claim on a corporate issuer. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0174","chapter":1,"number":174,"topic":"Portfolio & Asset Classes","level":"Intermediate","question":"Which example MOST directly demonstrates \"Diversification\"?","options":[{"id":"PM-C1-0174-O1","text":"A client's capital is spread across several imperfectly correlated investment holdings."},{"id":"PM-C1-0174-O2","text":"An investor acquires a corporate note that gives contractual rights to future payments."},{"id":"PM-C1-0174-O3","text":"A shareholder votes in a company's annual general meeting and participates in residual profit."},{"id":"PM-C1-0174-O4","text":"An allocator groups domestic equities and investment-grade bonds into separate exposure buckets."}],"correctOptionId":"PM-C1-0174-O1","explanation":"Tình huống chính: A client's capital is spread across several imperfectly correlated investment holdings. Diversification combines exposures to manage overall portfolio risk, without guaranteeing profits. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0175","chapter":1,"number":175,"topic":"Portfolio & Asset Classes","level":"Intermediate","question":"Which example MOST directly demonstrates \"Concentrated position\"?","options":[{"id":"PM-C1-0175-O1","text":"An investor owns and manages a warehouse, rather than purchasing a property-fund unit."},{"id":"PM-C1-0175-O2","text":"Seventy percent of a portfolio is invested in a single listed company."},{"id":"PM-C1-0175-O3","text":"An individual directly purchases an apartment and receives rental income."},{"id":"PM-C1-0175-O4","text":"A company issues a five-year bond promising interest and principal repayment."}],"correctOptionId":"PM-C1-0175-O2","explanation":"Tình huống chính: Seventy percent of a portfolio is invested in a single listed company. Concentration creates a large dependence on one issuer or exposure. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0176","chapter":1,"number":176,"topic":"Investment Funds & Services","level":"Intermediate","question":"Which example MOST directly demonstrates \"Pooled investment fund\"?","options":[{"id":"PM-C1-0176-O1","text":"Hundreds of investors contribute capital that is managed as one portfolio."},{"id":"PM-C1-0176-O2","text":"A fund values portfolio assets, subtracts liabilities and divides the remainder by outstanding units."},{"id":"PM-C1-0176-O3","text":"A fund deducts recurring operating costs from assets, reducing the investor's net return."},{"id":"PM-C1-0176-O4","text":"Investors sign up to a fund that is permitted to hold only investment-grade fixed income."}],"correctOptionId":"PM-C1-0176-O1","explanation":"Tình huống chính: Hundreds of investors contribute capital that is managed as one portfolio. A pooled fund combines investors' money into a common investment vehicle. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0177","chapter":1,"number":177,"topic":"Investment Funds & Services","level":"Intermediate","question":"Which example MOST directly demonstrates \"Fund ownership units\"?","options":[{"id":"PM-C1-0177-O1","text":"A designated independent institution safeguards portfolio assets while a manager decides investments."},{"id":"PM-C1-0177-O2","text":"Two investors receive fund units in proportion to their subscriptions."},{"id":"PM-C1-0177-O3","text":"A fund share is bought during a market session through an exchange order."},{"id":"PM-C1-0177-O4","text":"A manager aims to replicate the weights and returns of a specified index."}],"correctOptionId":"PM-C1-0177-O2","explanation":"Tình huống chính: Two investors receive fund units in proportion to their subscriptions. Fund interests represent proportional participation, subject to the fund terms. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0178","chapter":1,"number":178,"topic":"Investment Funds & Services","level":"Intermediate","question":"Which example MOST directly demonstrates \"Professional management\"?","options":[{"id":"PM-C1-0178-O1","text":"Investors sign up to a fund that is permitted to hold only investment-grade fixed income."},{"id":"PM-C1-0178-O2","text":"An investor checks redemption frequency, settlement dates and exchange trading depth."},{"id":"PM-C1-0178-O3","text":"A regulated manager selects securities and monitors pooled investments on investors' behalf."},{"id":"PM-C1-0178-O4","text":"A fund deducts recurring operating costs from assets, reducing the investor's net return."}],"correctOptionId":"PM-C1-0178-O3","explanation":"Tình huống chính: A regulated manager selects securities and monitors pooled investments on investors' behalf. Professional managers make allocation and security decisions according to mandate. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0179","chapter":1,"number":179,"topic":"Investment Funds & Services","level":"Intermediate","question":"Which example MOST directly demonstrates \"Mutual fund net asset value\"?","options":[{"id":"PM-C1-0179-O1","text":"A manager aims to replicate the weights and returns of a specified index."},{"id":"PM-C1-0179-O2","text":"A designated independent institution safeguards portfolio assets while a manager decides investments."},{"id":"PM-C1-0179-O3","text":"Hundreds of investors contribute capital that is managed as one portfolio."},{"id":"PM-C1-0179-O4","text":"A fund values portfolio assets, subtracts liabilities and divides the remainder by outstanding units."}],"correctOptionId":"PM-C1-0179-O4","explanation":"Tình huống chính: A fund values portfolio assets, subtracts liabilities and divides the remainder by outstanding units. NAV per unit is net fund asset value divided by the number of units. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0180","chapter":1,"number":180,"topic":"Investment Funds & Services","level":"Intermediate","question":"Which example MOST directly demonstrates \"Exchange-traded fund\"?","options":[{"id":"PM-C1-0180-O1","text":"A fund share is bought during a market session through an exchange order."},{"id":"PM-C1-0180-O2","text":"Investors sign up to a fund that is permitted to hold only investment-grade fixed income."},{"id":"PM-C1-0180-O3","text":"An investor checks redemption frequency, settlement dates and exchange trading depth."},{"id":"PM-C1-0180-O4","text":"Two investors receive fund units in proportion to their subscriptions."}],"correctOptionId":"PM-C1-0180-O1","explanation":"Tình huống chính: A fund share is bought during a market session through an exchange order. ETF shares can trade on a securities exchange during the trading day. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0181","chapter":1,"number":181,"topic":"Investment Funds & Services","level":"Intermediate","question":"Which example MOST directly demonstrates \"Fund expense ratio\"?","options":[{"id":"PM-C1-0181-O1","text":"A regulated manager selects securities and monitors pooled investments on investors' behalf."},{"id":"PM-C1-0181-O2","text":"A fund deducts recurring operating costs from assets, reducing the investor's net return."},{"id":"PM-C1-0181-O3","text":"A designated independent institution safeguards portfolio assets while a manager decides investments."},{"id":"PM-C1-0181-O4","text":"Hundreds of investors contribute capital that is managed as one portfolio."}],"correctOptionId":"PM-C1-0181-O2","explanation":"Tình huống chính: A fund deducts recurring operating costs from assets, reducing the investor's net return. Operating expenses reduce the investor's return compared with gross portfolio performance. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0182","chapter":1,"number":182,"topic":"Investment Funds & Services","level":"Intermediate","question":"Which example MOST directly demonstrates \"Index-tracking fund\"?","options":[{"id":"PM-C1-0182-O1","text":"Two investors receive fund units in proportion to their subscriptions."},{"id":"PM-C1-0182-O2","text":"A fund values portfolio assets, subtracts liabilities and divides the remainder by outstanding units."},{"id":"PM-C1-0182-O3","text":"A manager aims to replicate the weights and returns of a specified index."},{"id":"PM-C1-0182-O4","text":"An investor checks redemption frequency, settlement dates and exchange trading depth."}],"correctOptionId":"PM-C1-0182-O3","explanation":"Tình huống chính: A manager aims to replicate the weights and returns of a specified index. An index fund pursues benchmark exposure rather than discretionary stock outperformance. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0183","chapter":1,"number":183,"topic":"Investment Funds & Services","level":"Intermediate","question":"Which example MOST directly demonstrates \"Fund mandate\"?","options":[{"id":"PM-C1-0183-O1","text":"Hundreds of investors contribute capital that is managed as one portfolio."},{"id":"PM-C1-0183-O2","text":"A regulated manager selects securities and monitors pooled investments on investors' behalf."},{"id":"PM-C1-0183-O3","text":"A fund share is bought during a market session through an exchange order."},{"id":"PM-C1-0183-O4","text":"Investors sign up to a fund that is permitted to hold only investment-grade fixed income."}],"correctOptionId":"PM-C1-0183-O4","explanation":"Tình huống chính: Investors sign up to a fund that is permitted to hold only investment-grade fixed income. The mandate specifies eligible assets, objectives and constraints for fund operations. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0184","chapter":1,"number":184,"topic":"Investment Funds & Services","level":"Intermediate","question":"Which example MOST directly demonstrates \"Custody arrangement\"?","options":[{"id":"PM-C1-0184-O1","text":"A designated independent institution safeguards portfolio assets while a manager decides investments."},{"id":"PM-C1-0184-O2","text":"Two investors receive fund units in proportion to their subscriptions."},{"id":"PM-C1-0184-O3","text":"A fund values portfolio assets, subtracts liabilities and divides the remainder by outstanding units."},{"id":"PM-C1-0184-O4","text":"A fund deducts recurring operating costs from assets, reducing the investor's net return."}],"correctOptionId":"PM-C1-0184-O1","explanation":"Tình huống chính: A designated independent institution safeguards portfolio assets while a manager decides investments. Custody concerns safekeeping of holdings rather than strategy selection. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0185","chapter":1,"number":185,"topic":"Investment Funds & Services","level":"Intermediate","question":"Which example MOST directly demonstrates \"Liquidity of fund units\"?","options":[{"id":"PM-C1-0185-O1","text":"A manager aims to replicate the weights and returns of a specified index."},{"id":"PM-C1-0185-O2","text":"An investor checks redemption frequency, settlement dates and exchange trading depth."},{"id":"PM-C1-0185-O3","text":"A regulated manager selects securities and monitors pooled investments on investors' behalf."},{"id":"PM-C1-0185-O4","text":"A fund share is bought during a market session through an exchange order."}],"correctOptionId":"PM-C1-0185-O2","explanation":"Tình huống chính: An investor checks redemption frequency, settlement dates and exchange trading depth. Fund liquidity reflects the ability to convert units into cash under applicable rules. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0186","chapter":1,"number":186,"topic":"Portfolio Management Process","level":"Intermediate","question":"Which example MOST directly demonstrates \"Planning stage\"?","options":[{"id":"PM-C1-0186-O1","text":"Before placing trades, an adviser documents goals, constraints and the investment policy."},{"id":"PM-C1-0186-O2","text":"An adviser and client agree in writing on objectives, limitations and monitoring standards."},{"id":"PM-C1-0186-O3","text":"Within the equity budget, an analyst chooses specific listed companies to purchase."},{"id":"PM-C1-0186-O4","text":"An investment committee calculates return and compares it with an agreed reference."}],"correctOptionId":"PM-C1-0186-O1","explanation":"Tình huống chính: Before placing trades, an adviser documents goals, constraints and the investment policy. Planning establishes requirements and the policy for managing capital. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0187","chapter":1,"number":187,"topic":"Portfolio Management Process","level":"Intermediate","question":"Which example MOST directly demonstrates \"Implementation stage\"?","options":[{"id":"PM-C1-0187-O1","text":"A drifted portfolio trades some holdings to restore policy weights."},{"id":"PM-C1-0187-O2","text":"A manager implements target weights by buying approved securities."},{"id":"PM-C1-0187-O3","text":"A committee determines how much capital goes to shares, bonds and cash."},{"id":"PM-C1-0187-O4","text":"Monthly reviews compare current holdings and exposures with permitted ranges."}],"correctOptionId":"PM-C1-0187-O2","explanation":"Tình huống chính: A manager implements target weights by buying approved securities. Implementation puts approved asset and security strategies into effect. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0188","chapter":1,"number":188,"topic":"Portfolio Management Process","level":"Intermediate","question":"Which example MOST directly demonstrates \"Feedback stage\"?","options":[{"id":"PM-C1-0188-O1","text":"An investment committee calculates return and compares it with an agreed reference."},{"id":"PM-C1-0188-O2","text":"The manager checks whether divorce, a new child or job loss changes client needs."},{"id":"PM-C1-0188-O3","text":"A manager evaluates actual results and updates allocations when justified."},{"id":"PM-C1-0188-O4","text":"Within the equity budget, an analyst chooses specific listed companies to purchase."}],"correctOptionId":"PM-C1-0188-O3","explanation":"Tình huống chính: A manager evaluates actual results and updates allocations when justified. Feedback includes monitoring, measurement and appropriate corrective actions. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0189","chapter":1,"number":189,"topic":"Portfolio Management Process","level":"Intermediate","question":"Which example MOST directly demonstrates \"Investment policy statement\"?","options":[{"id":"PM-C1-0189-O1","text":"Monthly reviews compare current holdings and exposures with permitted ranges."},{"id":"PM-C1-0189-O2","text":"A drifted portfolio trades some holdings to restore policy weights."},{"id":"PM-C1-0189-O3","text":"Before placing trades, an adviser documents goals, constraints and the investment policy."},{"id":"PM-C1-0189-O4","text":"An adviser and client agree in writing on objectives, limitations and monitoring standards."}],"correctOptionId":"PM-C1-0189-O4","explanation":"Tình huống chính: An adviser and client agree in writing on objectives, limitations and monitoring standards. The IPS is a governing document for consistent portfolio decisions. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0190","chapter":1,"number":190,"topic":"Portfolio Management Process","level":"Intermediate","question":"Which example MOST directly demonstrates \"Asset-allocation decision\"?","options":[{"id":"PM-C1-0190-O1","text":"A committee determines how much capital goes to shares, bonds and cash."},{"id":"PM-C1-0190-O2","text":"An investment committee calculates return and compares it with an agreed reference."},{"id":"PM-C1-0190-O3","text":"The manager checks whether divorce, a new child or job loss changes client needs."},{"id":"PM-C1-0190-O4","text":"A manager implements target weights by buying approved securities."}],"correctOptionId":"PM-C1-0190-O1","explanation":"Tình huống chính: A committee determines how much capital goes to shares, bonds and cash. Asset allocation distributes funds among asset classes. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0191","chapter":1,"number":191,"topic":"Portfolio Management Process","level":"Intermediate","question":"Which example MOST directly demonstrates \"Security-selection decision\"?","options":[{"id":"PM-C1-0191-O1","text":"A manager evaluates actual results and updates allocations when justified."},{"id":"PM-C1-0191-O2","text":"Within the equity budget, an analyst chooses specific listed companies to purchase."},{"id":"PM-C1-0191-O3","text":"A drifted portfolio trades some holdings to restore policy weights."},{"id":"PM-C1-0191-O4","text":"Before placing trades, an adviser documents goals, constraints and the investment policy."}],"correctOptionId":"PM-C1-0191-O2","explanation":"Tình huống chính: Within the equity budget, an analyst chooses specific listed companies to purchase. Security selection decides which individual instruments to own. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0192","chapter":1,"number":192,"topic":"Portfolio Management Process","level":"Intermediate","question":"Which example MOST directly demonstrates \"Portfolio monitoring\"?","options":[{"id":"PM-C1-0192-O1","text":"A manager implements target weights by buying approved securities."},{"id":"PM-C1-0192-O2","text":"An adviser and client agree in writing on objectives, limitations and monitoring standards."},{"id":"PM-C1-0192-O3","text":"Monthly reviews compare current holdings and exposures with permitted ranges."},{"id":"PM-C1-0192-O4","text":"The manager checks whether divorce, a new child or job loss changes client needs."}],"correctOptionId":"PM-C1-0192-O3","explanation":"Tình huống chính: Monthly reviews compare current holdings and exposures with permitted ranges. Monitoring observes positions, risk and compliance through time. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0193","chapter":1,"number":193,"topic":"Portfolio Management Process","level":"Intermediate","question":"Which example MOST directly demonstrates \"Performance evaluation\"?","options":[{"id":"PM-C1-0193-O1","text":"Before placing trades, an adviser documents goals, constraints and the investment policy."},{"id":"PM-C1-0193-O2","text":"A manager evaluates actual results and updates allocations when justified."},{"id":"PM-C1-0193-O3","text":"A committee determines how much capital goes to shares, bonds and cash."},{"id":"PM-C1-0193-O4","text":"An investment committee calculates return and compares it with an agreed reference."}],"correctOptionId":"PM-C1-0193-O4","explanation":"Tình huống chính: An investment committee calculates return and compares it with an agreed reference. Performance evaluation assesses achieved outcomes against appropriate measures. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0194","chapter":1,"number":194,"topic":"Portfolio Management Process","level":"Intermediate","question":"Which example MOST directly demonstrates \"Rebalancing implementation\"?","options":[{"id":"PM-C1-0194-O1","text":"A drifted portfolio trades some holdings to restore policy weights."},{"id":"PM-C1-0194-O2","text":"A manager implements target weights by buying approved securities."},{"id":"PM-C1-0194-O3","text":"An adviser and client agree in writing on objectives, limitations and monitoring standards."},{"id":"PM-C1-0194-O4","text":"Within the equity budget, an analyst chooses specific listed companies to purchase."}],"correctOptionId":"PM-C1-0194-O1","explanation":"Tình huống chính: A drifted portfolio trades some holdings to restore policy weights. Rebalancing trades are corrective actions restoring the intended allocation. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0195","chapter":1,"number":195,"topic":"Portfolio Management Process","level":"Intermediate","question":"Which example MOST directly demonstrates \"Client circumstances review\"?","options":[{"id":"PM-C1-0195-O1","text":"Monthly reviews compare current holdings and exposures with permitted ranges."},{"id":"PM-C1-0195-O2","text":"The manager checks whether divorce, a new child or job loss changes client needs."},{"id":"PM-C1-0195-O3","text":"A manager evaluates actual results and updates allocations when justified."},{"id":"PM-C1-0195-O4","text":"A committee determines how much capital goes to shares, bonds and cash."}],"correctOptionId":"PM-C1-0195-O2","explanation":"Tình huống chính: The manager checks whether divorce, a new child or job loss changes client needs. Substantial life changes can require revision of objectives and constraints. Các ví dụ khác minh họa cơ chế khác.","source":"Phát triển từ slide · Tình huống"},{"id":"PM-C1-0196","chapter":1,"number":196,"topic":"IPS Objectives and Constraints","level":"Intermediate","question":"Which example MOST directly demonstrates \"Return objective\"?","options":[{"id":"PM-C1-0196-O1","text":"A client asks to fund a known retirement spending goal while preserving purchasing power."},{"id":"PM-C1-0196-O2","text":"An investor must repay a property deposit within six months."},{"id":"PM-C1-0196-O3","text":"A pension mandate prohibits specific securities under applicable regulations."},{"id":"PM-C1-0196-O4","text":"An IPS names a bond index against which its bond mandate will be evaluated."}],"correctOptionId":"PM-C1-0196-O1","explanation":"Tình huống chính: A client asks to fund a known retirement spending goal while preserving purchasing power. The return objective
