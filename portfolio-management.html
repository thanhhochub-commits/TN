điểm phần trăm.\nExplanation (EN): Expected portfolio return is the portfolio-weighted average of individual expected returns. Asset A\ncontributes 3.6 percentage points and Asset B contributes 9 percentage points.\nCông thức & tính toán / Formula & calculation:\nE(Rₚ) = wA × E(RA) + wB × E(RB)\nE(Rₚ) = 0.40 × 9% + 0.60 × 15% = 3.6% + 9% = 12.6%","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q08","chapter":2,"number":8,"question":"Asset A has an expected return of 16% and Asset B has an expected return of 10%. What weight should be invested in Asset A if the target portfolio return is 13%?\nTài sản A có lợi nhuận kỳ vọng 16% và tài sản B có lợi nhuận kỳ vọng 10%. Cần phân bổ bao nhiêu phần trăm vào A để lợi nhuận kỳ vọng danh mục đạt 13%?","options":[{"id":"PM120-C2-Q08-O1","text":"40% \n40%"},{"id":"PM120-C2-Q08-O2","text":"50% \n50%"},{"id":"PM120-C2-Q08-O3","text":"60% \n60%"},{"id":"PM120-C2-Q08-O4","text":"30% \n30%"}],"correctOptionId":"PM120-C2-Q08-O2","explanation":"Giải thích (VI): Với danh mục chỉ gồm A và B, tỷ trọng B bằng 1 trừ tỷ trọng A. Giải phương trình lợi nhuận kỳ vọng sẽ cho\ntỷ trọng A là 50% và B là 50%.\nExplanation (EN): With two assets, Asset B’s weight equals one minus Asset A’s weight. Solving the target expected-return\nequation gives 50% in A and 50% in B.\nCông thức & tính toán / Formula & calculation:\n13% = wA × 16% + (1 − wA) × 10%\n13 = 16wA + 10 − 10wA ⇒ 3 = 6wA ⇒ wA = 0.50 = 50%\nVerification / Kiểm tra: 0.50 × 16% + 0.50 × 10% = 13%","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q09","chapter":2,"number":9,"question":"The standard deviations of Assets A and B are 12% and 20%, and their correlation is 0.25. What is their covariance?\nĐộ lệch chuẩn của A và B lần lượt là 12% và 20%, hệ số tương quan giữa chúng là 0,25. Hiệp phương sai bằng bao nhiêu?","options":[{"id":"PM120-C2-Q09-O1","text":"0.0240 \n0,0240"},{"id":"PM120-C2-Q09-O2","text":"0.0120 \n0,0120"},{"id":"PM120-C2-Q09-O3","text":"0.0030 \n0,0030"},{"id":"PM120-C2-Q09-O4","text":"0.0060 \n0,0060"}],"correctOptionId":"PM120-C2-Q09-O4","explanation":"Giải thích (VI): Hiệp phương sai bằng hệ số tương quan nhân với độ lệch chuẩn của hai tài sản. Giá trị dương thể hiện lợi\nnhuận có xu hướng biến động cùng chiều.\nExplanation (EN): Covariance equals correlation multiplied by both standard deviations. A positive covariance indicates that\nthe returns tend to move in the same direction.\nCông thức & tính toán / Formula & calculation:\nCov(A,B) = ρAB × σA × σB\nCov(A,B) = 0.25 × 0.12 × 0.20 = 0.0060","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q10","chapter":2,"number":10,"question":"The covariance between two assets is 0.004. Their standard deviations are 10% and 20%. What is their correlation coefficient?\nHiệp phương sai giữa hai tài sản là 0,004, độ lệch chuẩn lần lượt 10% và 20%. Hệ số tương quan của chúng bằng bao nhiêu?","options":[{"id":"PM120-C2-Q10-O1","text":"0.10 \n0,10"},{"id":"PM120-C2-Q10-O2","text":"0.80 \n0,80"},{"id":"PM120-C2-Q10-O3","text":"0.20 \n0,20"},{"id":"PM120-C2-Q10-O4","text":"0.40 \n0,40"}],"correctOptionId":"PM120-C2-Q10-O3","explanation":"Giải thích (VI): Hệ số tương quan là hiệp phương sai đã được chuẩn hóa theo tích độ lệch chuẩn của hai tài sản. Kết quả 0,20\ncho thấy tương quan tuyến tính dương yếu.\nExplanation (EN): Correlation is covariance normalized by the product of both assets’ standard deviations. A value of 0.20\nindicates a weak positive linear relationship.\nCông thức & tính toán / Formula & calculation:\nρAB = Cov(A,B) / (σA × σB)\nρAB = 0.004 / (0.10 × 0.20) = 0.004 / 0.020 = 0.20","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q11","chapter":2,"number":11,"question":"A portfolio invests 50% in Asset A and 50% in Asset B. Their standard deviations are 10% and 20%, and their correlation is 0.30. What is the portfolio standard deviation approximately?\nMột danh mục đầu tư phân bổ 50% vào A và 50% vào B, với độ lệch chuẩn lần lượt 10% và 20%, hệ số tương quan 0,30. Độ lệch chuẩn danh mục xấp xỉ bao nhiêu?","options":[{"id":"PM120-C2-Q11-O1","text":"17.5% \n17,5%"},{"id":"PM120-C2-Q11-O2","text":"10.5% \n10,5%"},{"id":"PM120-C2-Q11-O3","text":"15.0% \n15,0%"},{"id":"PM120-C2-Q11-O4","text":"12.45% \n12,45%"}],"correctOptionId":"PM120-C2-Q11-O4","explanation":"Giải thích (VI): Độ lệch chuẩn danh mục hai tài sản phụ thuộc vào cả phương sai riêng lẻ và hiệp phương sai. Vì tương quan\nchỉ 0,30 nên độ lệch chuẩn danh mục thấp hơn trung bình có trọng số 15% của hai độ lệch chuẩn.\nExplanation (EN): Two-asset portfolio risk depends on both individual variances and covariance. Because correlation is only\n0.30, the portfolio standard deviation is below the weighted average of 15%.\nCông thức & tính toán / Formula & calculation:\nσₚ = √[wA²σA² + wB²σB² + 2wAwBσAσBρAB]\nσₚ = √[0.5²×0.1² + 0.5²×0.2² + 2×0.5×0.5×0.1×0.2×0.3]\nσₚ = √(0.0025 + 0.0100 + 0.0030) = √0.0155 ≈ 12.45%","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q12","chapter":2,"number":12,"question":"Two assets have a correlation coefficient of +1. Their standard deviations are 10% and 20%. If 30% is invested in the first asset and 70% in the second, what is the portfolio standard deviation?\nHai tài sản có hệ số tương quan +1 và độ lệch chuẩn 10%, 20%. Nếu đầu tư 30% vào tài sản thứ nhất và 70% vào tài sản thứ hai, độ lệch chuẩn danh mục là bao nhiêu?","options":[{"id":"PM120-C2-Q12-O1","text":"13% \n13%"},{"id":"PM120-C2-Q12-O2","text":"15% \n15%"},{"id":"PM120-C2-Q12-O3","text":"20% \n20%"},{"id":"PM120-C2-Q12-O4","text":"17% \n17%"}],"correctOptionId":"PM120-C2-Q12-O4","explanation":"Giải thích (VI): Tương quan +1 biểu thị tương quan dương hoàn hảo. Khi hai tỷ trọng đều không âm, độ lệch chuẩn danh\nmục bằng tổng có trọng số của độ lệch chuẩn riêng lẻ; không có lợi ích giảm rủi ro từ tương quan.\nExplanation (EN): Correlation of +1 indicates perfect positive correlation. With nonnegative weights, portfolio standard\ndeviation equals the weighted average of individual standard deviations; there is no correlation-driven diversification benefit.\nCông thức & tính toán / Formula & calculation:\nIf ρAB = +1 and weights ≥ 0: σₚ = wAσA + wBσB\nσₚ = 0.30 × 10% + 0.70 × 20% = 3% + 14% = 17%","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q13","chapter":2,"number":13,"question":"Holding portfolio weights and individual asset volatilities constant, what happens if the correlation between two assets decreases?\nKhi giữ nguyên tỷ trọng danh mục và độ biến động từng tài sản, điều gì xảy ra nếu hệ số tương quan giữa hai tài sản giảm xuống?","options":[{"id":"PM120-C2-Q13-O1","text":"Portfolio risk decreases \nRủi ro danh mục giảm"},{"id":"PM120-C2-Q13-O2","text":"Expected portfolio return increases \nLợi nhuận kỳ vọng danh mục tăng"},{"id":"PM120-C2-Q13-O3","text":"Expected portfolio return decreases \nLợi nhuận kỳ vọng danh mục giảm"},{"id":"PM120-C2-Q13-O4","text":"Portfolio weights automatically change \nTỷ trọng danh mục tự động thay đổi"}],"correctOptionId":"PM120-C2-Q13-O1","explanation":"Giải thích (VI): Khi hai tỷ trọng dương và độ lệch chuẩn không đổi, tương quan giảm khiến thành phần hiệp phương sai\ntrong phương sai danh mục giảm, nhờ đó rủi ro giảm. Lợi nhuận kỳ vọng không tự thay đổi vì tương quan. Nếu có bán khống,\nkết luận về rủi ro cần xét lại.\nExplanation (EN): With positive weights and fixed individual volatilities, lower correlation decreases the covariance term in\nportfolio variance and reduces risk. Correlation alone does not change expected return. The risk conclusion may differ with\nshort positions.\nCông thức & tính toán / Formula & calculation:\nσₚ² = wA²σA² + wB²σB² + 2wAwBσAσBρAB\nFor wA,wB > 0 / Với wA,wB > 0: ρAB ↓ ⇒ σₚ² ↓","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q14","chapter":2,"number":14,"question":"An analyst knows the expected returns and weights of two assets but has no information about their variances or correlation. What can the analyst calculate?\nMột nhà phân tích biết lợi nhuận kỳ vọng và tỷ trọng của hai tài sản nhưng không có dữ liệu về phương sai hoặc tương quan. Nhà phân tích có thể tính được gì?","options":[{"id":"PM120-C2-Q14-O1","text":"Neither portfolio return nor risk \nKhông tính được cả lợi nhuận lẫn rủi ro danh mục"},{"id":"PM120-C2-Q14-O2","text":"Portfolio expected return only \nChỉ lợi nhuận kỳ vọng của danh mục"},{"id":"PM120-C2-Q14-O3","text":"Portfolio standard deviation only \nChỉ độ lệch chuẩn danh mục"},{"id":"PM120-C2-Q14-O4","text":"Both portfolio return and risk \nCả lợi nhuận và rủi ro danh mục"}],"correctOptionId":"PM120-C2-Q14-O2","explanation":"Giải thích (VI): Lợi nhuận kỳ vọng danh mục chỉ yêu cầu tỷ trọng và lợi nhuận kỳ vọng của từng tài sản. Tính phương sai, độ\nlệch chuẩn danh mục còn cần phương sai và hiệp phương sai/tương quan, nên không thể tính rủi ro từ dữ liệu đã cho.\nExplanation (EN): Expected portfolio return requires only asset weights and expected returns. Portfolio variance and\nstandard deviation additionally require variance and covariance/correlation information, which is missing here.\nCông thức & tính toán / Formula & calculation:\nE(Rₚ) = wA × E(RA) + wB × E(RB)\nσₚ² = wA²σA² + wB²σB² + 2wAwBσAσBρAB","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q15","chapter":2,"number":15,"question":"Three assets have equal expected returns and equal standard deviations. Their correlations are Corr(A,B) = 0.40, Corr(A,C) = −0.20, and Corr(B,C) = 0.10. Which pair provides the greatest diversification benefit?\nBa tài sản có lợi nhuận kỳ vọng và độ lệch chuẩn bằng nhau. Tương quan Corr(A,B) = 0,40; Corr(A,C) = −0,20; Corr(B,C) = 0,10. Cặp nào có lợi ích đa dạng hóa lớn nhất?","options":[{"id":"PM120-C2-Q15-O1","text":"A and B \nA và B"},{"id":"PM120-C2-Q15-O2","text":"All pairs provide the same benefit \nTất cả các cặp có lợi ích như nhau"},{"id":"PM120-C2-Q15-O3","text":"B and C \nB và C"},{"id":"PM120-C2-Q15-O4","text":"A and C \nA và C"}],"correctOptionId":"PM120-C2-Q15-O4","explanation":"Giải thích (VI): Khi so sánh các cặp có cùng mức lợi nhuận, độ lệch chuẩn và tỷ trọng tương đương, tương quan càng thấp\nthì khả năng bù trừ biến động và giảm phương sai càng lớn. Cặp A–C có tương quan thấp nhất (−0,20).\nExplanation (EN): For pairs with equal expected returns, volatilities and comparable weights, lower correlation allows\ngreater offsetting of return fluctuations. The A–C pair has the lowest correlation (−0.20).\nCông thức & tính toán / Formula & calculation:\nCorr(A,B) = +0.40; Corr(A,C) = −0.20; Corr(B,C) = +0.10\nLowest correlation / Tương quan thấp nhất = Corr(A,C) = −0.20","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q16","chapter":2,"number":16,"question":"In the variance formula for an n-asset portfolio, which terms capture the interaction among different securities?\nTrong công thức phương sai của danh mục gồm n tài sản, thành phần nào thể hiện sự tương tác giữa các chứng khoán khác nhau?","options":[{"id":"PM120-C2-Q16-O1","text":"Covariance terms \nCác thành phần hiệp phương sai"},{"id":"PM120-C2-Q16-O2","text":"Expected return terms \nCác thành phần lợi nhuận kỳ vọng"},{"id":"PM120-C2-Q16-O3","text":"Portfolio weights only \nChỉ tỷ trọng danh mục"},{"id":"PM120-C2-Q16-O4","text":"Individual variance terms only \nChỉ các thành phần phương sai riêng lẻ"}],"correctOptionId":"PM120-C2-Q16-O1","explanation":"Giải thích (VI): Phương sai riêng lẻ thể hiện biến động của từng tài sản; hiệp phương sai cho biết lợi nhuận các tài sản khác\nnhau cùng biến động ra sao. Do đó, phần tổng chứa hiệp phương sai phản ánh sự tương tác giữa chứng khoán.\nExplanation (EN): Individual variances capture each asset’s standalone volatility, while covariances capture how returns of\ndifferent securities move together. Therefore, the covariance sum represents interactions among assets.\nCông thức & tính toán / Formula & calculation:\nσₚ² = Σ(wᵢ²σᵢ²) + 2Σ(i<j)[wᵢwⱼCov(Rᵢ,Rⱼ)]\nCovariance terms / Thành phần tương tác: 2Σ(i<j)[wᵢwⱼCov(Rᵢ,Rⱼ)]","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q17","chapter":2,"number":17,"question":"A portfolio contains 16 equally weighted securities. Each has a standard deviation of 24%, and all securities are mutually uncorrelated. What is the portfolio standard deviation?\nDanh mục gồm 16 chứng khoán tỷ trọng bằng nhau, mỗi chứng khoán có độ lệch chuẩn 24% và tất cả không tương quan với nhau. Độ lệch chuẩn danh mục là bao nhiêu?","options":[{"id":"PM120-C2-Q17-O1","text":"12% \n12%"},{"id":"PM120-C2-Q17-O2","text":"6% \n6%"},{"id":"PM120-C2-Q17-O3","text":"3% \n3%"},{"id":"PM120-C2-Q17-O4","text":"24% \n24%"}],"correctOptionId":"PM120-C2-Q17-O2","explanation":"Giải thích (VI): Với n tài sản cùng độ lệch chuẩn, tỷ trọng 1/n và hiệp phương sai bằng 0, phương sai danh mục bằng phương\nsai một tài sản chia n. Vì vậy, độ lệch chuẩn bằng 24% chia căn 16.\nExplanation (EN): For n equally weighted, mutually uncorrelated assets with identical standard deviations, portfolio variance\nequals individual variance divided by n. Thus standard deviation is 24% divided by the square root of 16.\nCông thức & tính toán / Formula & calculation:\nσₚ = σ / √n\nσₚ = 24% / √16 = 24% / 4 = 6%","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q18","chapter":2,"number":18,"question":"Which measure is most appropriate for comparing risk per unit of expected return across investments with different expected returns?\nChỉ tiêu nào phù hợp nhất để so sánh rủi ro trên mỗi đơn vị lợi nhuận kỳ vọng giữa các khoản đầu tư có lợi nhuận kỳ vọng khác nhau?","options":[{"id":"PM120-C2-Q18-O1","text":"Portfolio weight \nTỷ trọng danh mục"},{"id":"PM120-C2-Q18-O2","text":"Correlation \nHệ số tương quan"},{"id":"PM120-C2-Q18-O3","text":"Covariance \nHiệp phương sai"},{"id":"PM120-C2-Q18-O4","text":"Coefficient of variation \nHệ số biến thiên"}],"correctOptionId":"PM120-C2-Q18-O4","explanation":"Giải thích (VI): Hệ số biến thiên (CV) lấy độ lệch chuẩn chia cho lợi nhuận kỳ vọng nên đo rủi ro trên mỗi đơn vị lợi nhuận.\nVới lợi nhuận kỳ vọng dương, CV thấp hơn nghĩa là ít rủi ro tương đối hơn. CV không dễ diễn giải khi lợi nhuận kỳ vọng\nbằng 0 hoặc âm.\nExplanation (EN): The coefficient of variation (CV) divides standard deviation by expected return and measures risk per unit\nof return. For positive expected returns, a lower CV indicates lower relative risk. CV is not straightforward when expected\nreturn is zero or negative.\nCông thức & tính toán / Formula & calculation:\nCV = σ / E(R)","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q19","chapter":2,"number":19,"question":"An investor owns 30 stocks, but all of them are commercial banks. Which statement is most accurate?\nMột nhà đầu tư sở hữu 30 cổ phiếu nhưng tất cả đều thuộc các ngân hàng thương mại. Nhận định nào chính xác nhất?","options":[{"id":"PM120-C2-Q19-O1","text":"The portfolio must have lower risk than a broad-market portfolio \nDanh mục chắc chắn ít rủi ro hơn danh mục toàn thị trường"},{"id":"PM120-C2-Q19-O2","text":"The investor is fully diversified because 30 stocks are held \nNhà đầu tư đã đa dạng hóa hoàn toàn vì có 30 cổ phiếu"},{"id":"PM120-C2-Q19-O3","text":"The investor may still have substantial industry-specific risk \nNhà đầu tư vẫn có thể chịu rủi ro đặc thù ngành đáng kể"},{"id":"PM120-C2-Q19-O4","text":"The portfolio contains no unsystematic risk \nDanh mục không có rủi ro phi hệ thống"}],"correctOptionId":"PM120-C2-Q19-O3","explanation":"Giải thích (VI): Có 30 cổ phiếu không đảm bảo đa dạng hóa hiệu quả nếu toàn bộ đều thuộc ngành ngân hàng. Các mã có thể\ncùng chịu tác động của nợ xấu, thanh khoản và quy định ngành, do đó rủi ro đặc thù ngành vẫn đáng kể.\nExplanation (EN): Having 30 stocks does not ensure effective diversification if all are banks. These securities may share\nexposure to nonperforming loans, liquidity stress, and banking regulation, leaving substantial industry-specific risk.","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q20","chapter":2,"number":20,"question":"Which statement best describes the usual effect of adding more securities to a portfolio?\nNhận định nào mô tả đúng nhất tác động thường gặp khi bổ sung thêm chứng khoán vào danh mục?","options":[{"id":"PM120-C2-Q20-O1","text":"Risk falls at an increasing rate until it reaches zero \nRủi ro giảm nhanh dần cho đến khi bằng 0"},{"id":"PM120-C2-Q20-O2","text":"Systematic risk disappears before unsystematic risk \nRủi ro hệ thống biến mất trước rủi ro phi hệ thống"},{"id":"PM120-C2-Q20-O3","text":"Expected return must increase as more securities are added \nLợi nhuận kỳ vọng chắc chắn tăng khi thêm chứng khoán"},{"id":"PM120-C2-Q20-O4","text":"Risk initially falls substantially, but additional risk reduction becomes smaller \nBan đầu rủi ro giảm đáng kể, nhưng mức giảm bổ sung ngày càng nhỏ"}],"correctOptionId":"PM120-C2-Q20-O4","explanation":"Giải thích (VI): Đa dạng hóa thường giúp giảm nhanh rủi ro riêng lẻ khi danh mục có ít mã. Khi đã nắm giữ nhiều tài sản\ntương quan không hoàn hảo, lợi ích giảm rủi ro bổ sung thường nhỏ dần. Rủi ro hệ thống không tự biến mất.\nExplanation (EN): Diversification usually cuts firm-specific risk substantially when a portfolio starts with few securities. As\nmore imperfectly correlated assets are added, marginal risk reduction generally diminishes. Systematic risk remains.","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q21","chapter":2,"number":21,"question":"Which of the following is an example of systematic risk?\nTrường hợp nào sau đây là ví dụ về rủi ro hệ thống?","options":[{"id":"PM120-C2-Q21-O1","text":"A product recall by one firm \nMột doanh nghiệp thu hồi sản phẩm"},{"id":"PM120-C2-Q21-O2","text":"The resignation of one firm's CEO \nGiám đốc điều hành của một doanh nghiệp từ chức"},{"id":"PM120-C2-Q21-O3","text":"An unexpected increase in economy-wide inflation \nLạm phát toàn nền kinh tế tăng bất ngờ"},{"id":"PM120-C2-Q21-O4","text":"A strike at one company \nMột cuộc đình công tại một doanh nghiệp"}],"correctOptionId":"PM120-C2-Q21-O3","explanation":"Giải thích (VI): Rủi ro hệ thống là rủi ro từ các yếu tố ảnh hưởng rộng đến thị trường, chẳng hạn lạm phát, suy thoái và lãi\nsuất. Lạm phát tăng bất ngờ có thể ảnh hưởng nhiều công ty cùng lúc; các tình huống còn lại chủ yếu riêng từng công ty.\nExplanation (EN): Systematic risk arises from broad market or economic factors, such as inflation, recessions, and interest\nrates. An unexpected economy-wide inflation increase may affect many firms at once, whereas the other events are largely\ncompany-specific.","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q22","chapter":2,"number":22,"question":"Which of the following is an example of unsystematic risk?\nTrường hợp nào sau đây là ví dụ về rủi ro phi hệ thống?","options":[{"id":"PM120-C2-Q22-O1","text":"A company-specific management failure \nSự thất bại trong quản lý của một doanh nghiệp cụ thể"},{"id":"PM120-C2-Q22-O2","text":"A nationwide recession \nSuy thoái kinh tế trên phạm vi cả nước"},{"id":"PM120-C2-Q22-O3","text":"A broad increase in interest rates \nLãi suất tăng trên diện rộng"},{"id":"PM120-C2-Q22-O4","text":"An economy-wide inflation shock \nCú sốc lạm phát trên toàn nền kinh tế"}],"correctOptionId":"PM120-C2-Q22-O1","explanation":"Giải thích (VI): Rủi ro phi hệ thống xuất phát từ đặc điểm riêng của công ty hoặc ngành. Thất bại quản lý tại một doanh\nnghiệp có thể ảnh hưởng cổ phiếu đó mà không ảnh hưởng tất cả cổ phiếu. Suy thoái, lãi suất và lạm phát diện rộng là rủi ro\nhệ thống.\nExplanation (EN): Unsystematic risk originates from firm-specific or industry-specific factors. A management failure can\nhurt one company without affecting all stocks. Nationwide recessions, broad interest-rate increases, and economy-wide\ninflation are systematic risks.","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q23","chapter":2,"number":23,"question":"In a well-diversified portfolio, which type of risk should become relatively small?\nTrong một danh mục được đa dạng hóa tốt, loại rủi ro nào sẽ trở nên tương đối nhỏ?","options":[{"id":"PM120-C2-Q23-O1","text":"Market risk \nRủi ro thị trường"},{"id":"PM120-C2-Q23-O2","text":"Unsystematic risk \nRủi ro phi hệ thống"},{"id":"PM120-C2-Q23-O3","text":"Interest-rate risk affecting the whole economy \nRủi ro lãi suất ảnh hưởng toàn nền kinh tế"},{"id":"PM120-C2-Q23-O4","text":"Systematic risk \nRủi ro hệ thống"}],"correctOptionId":"PM120-C2-Q23-O2","explanation":"Giải thích (VI): Đa dạng hóa trên nhiều tài sản không tương quan hoàn hảo giúp các cú sốc riêng lẻ bù trừ nhau, làm rủi ro\nphi hệ thống giảm đáng kể. Rủi ro toàn thị trường vẫn có thể ảnh hưởng đồng thời nhiều tài sản.\nExplanation (EN): Holding many imperfectly correlated securities allows company-specific shocks to offset one another,\nsubstantially reducing unsystematic risk. Market-wide risks can still affect many assets simultaneously.","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q24","chapter":2,"number":24,"question":"What is the main contribution of Markowitz's portfolio theory?\nĐóng góp quan trọng nhất của lý thuyết danh mục Markowitz là gì?","options":[{"id":"PM120-C2-Q24-O1","text":"Replacing diversification with market timing \nThay đa dạng hóa bằng việc chọn thời điểm thị trường"},{"id":"PM120-C2-Q24-O2","text":"Evaluating combinations of securities using return, risk, and covariance \nĐánh giá sự kết hợp chứng khoán qua lợi nhuận, rủi ro và hiệp phương sai"},{"id":"PM120-C2-Q24-O3","text":"Selecting the security with the highest return \nChọn chứng khoán có lợi nhuận cao nhất"},{"id":"PM120-C2-Q24-O4","text":"Eliminating all investment risk \nLoại bỏ toàn bộ rủi ro đầu tư"}],"correctOptionId":"PM120-C2-Q24-O2","explanation":"Giải thích (VI): Lý thuyết Markowitz đánh giá chứng khoán trong mối quan hệ với toàn bộ danh mục. Ngoài lợi nhuận kỳ\nvọng và phương sai từng tài sản, hiệp phương sai quyết định hiệu quả đa dạng hóa. Mô hình không hứa hẹn loại bỏ mọi rủi ro.\nExplanation (EN): Markowitz’s portfolio theory evaluates securities as parts of a portfolio. In addition to expected returns\nand individual variances, covariances determine diversification benefits. The model does not claim to eliminate all risk.","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q25","chapter":2,"number":25,"question":"Which of the following is NOT a core Markowitz assumption used in the slides?\nĐiều nào KHÔNG phải một giả định cốt lõi của lý thuyết Markowitz trong slide bài giảng?","options":[{"id":"PM120-C2-Q25-O1","text":"Investors are generally risk-averse \nCác nhà đầu tư nhìn chung ngại rủi ro"},{"id":"PM120-C2-Q25-O2","text":"Investors can borrow and lend unlimited amounts at the risk-free rate \nNhà đầu tư có thể vay và cho vay không giới hạn ở lãi suất phi rủi ro"},{"id":"PM120-C2-Q25-O3","text":"Investors evaluate alternatives over one holding period \nNhà đầu tư đánh giá các phương án trong một kỳ nắm giữ"},{"id":"PM120-C2-Q25-O4","text":"Investors consider expected return and risk \nNhà đầu tư xem xét lợi nhuận kỳ vọng và rủi ro"}],"correctOptionId":"PM120-C2-Q25-O2","explanation":"Giải thích (VI): Markowitz cơ bản giả định nhà đầu tư quan tâm đến lợi nhuận kỳ vọng và rủi ro, thường ngại rủi ro và xét\nmột kỳ đầu tư. Vay/cho vay không giới hạn tại lãi suất phi rủi ro không phải yêu cầu cốt lõi của mô hình này mà thuộc các mở\nrộng thị trường vốn.\nExplanation (EN): The basic Markowitz framework focuses on expected return and risk, typically risk-averse investors, and\none holding period. Unlimited borrowing and lending at the risk-free rate is not a core requirement; it is associated with later\ncapital-market extensions.","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q26","chapter":2,"number":26,"question":"Portfolio A and Portfolio B have the same standard deviation, but Portfolio A has a higher expected return. Which statement is correct?\nDanh mục A và B có cùng độ lệch chuẩn nhưng A có lợi nhuận kỳ vọng cao hơn. Nhận định nào đúng?","options":[{"id":"PM120-C2-Q26-O1","text":"Neither portfolio dominates the other \nKhông danh mục nào chiếm ưu thế"},{"id":"PM120-C2-Q26-O2","text":"Portfolio A dominates Portfolio B \nDanh mục A chiếm ưu thế so với B"},{"id":"PM120-C2-Q26-O3","text":"Portfolio B dominates Portfolio A \nDanh mục B chiếm ưu thế so với A"},{"id":"PM120-C2-Q26-O4","text":"Both portfolios must lie on the efficient frontier \nCả hai chắc chắn thuộc đường biên hiệu quả"}],"correctOptionId":"PM120-C2-Q26-O2","explanation":"Giải thích (VI): Theo nguyên tắc chiếm ưu thế trung bình–phương sai, cùng rủi ro thì nhà đầu tư thích lợi nhuận kỳ vọng cao\nhơn. Vì độ lệch chuẩn bằng nhau nhưng A có lợi nhuận kỳ vọng lớn hơn, A chiếm ưu thế.\nExplanation (EN): Under mean-variance dominance, a portfolio with higher expected return is preferred when risk is equal.\nA dominates B because both have the same standard deviation but A offers more expected return.\nCông thức & tính toán / Formula & calculation:\nIf σA = σB and E(RA) > E(RB), then A dominates B.","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q27","chapter":2,"number":27,"question":"Portfolio X has an expected return of 9% and a standard deviation of 10%. Portfolio Y has an expected return of 9% and a standard deviation of 14%. Which portfolio dominates?\nDanh mục X có lợi nhuận kỳ vọng 9%, độ lệch chuẩn 10%; danh mục Y có lợi nhuận kỳ vọng 9%, độ lệch chuẩn 14%. Danh mục nào chiếm ưu thế?","options":[{"id":"PM120-C2-Q27-O1","text":"Neither \nKhông danh mục nào"},{"id":"PM120-C2-Q27-O2","text":"Portfolio X \nDanh mục X"},{"id":"PM120-C2-Q27-O3","text":"Portfolio Y \nDanh mục Y"},{"id":"PM120-C2-Q27-O4","text":"Both \nCả hai"}],"correctOptionId":"PM120-C2-Q27-O2","explanation":"Giải thích (VI): Hai danh mục có cùng lợi nhuận kỳ vọng 9%. X có độ lệch chuẩn chỉ 10%, thấp hơn Y (14%), nên X chiếm\nưu thế theo trung bình–phương sai.\nExplanation (EN): Both portfolios have the same 9% expected return. X has only 10% standard deviation versus Y’s 14%, so\nX dominates under mean-variance criteria.\nCông thức & tính toán / Formula & calculation:\nE(RX) = E(RY) = 9%; σX = 10% < σY = 14%\nTherefore / Do đó: Portfolio X dominates Portfolio Y.","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q28","chapter":2,"number":28,"question":"What does the efficient frontier represent?\nĐường biên hiệu quả biểu thị điều gì?","options":[{"id":"PM120-C2-Q28-O1","text":"Portfolios with the highest return regardless of risk \nCác danh mục lợi nhuận cao nhất bất kể rủi ro"},{"id":"PM120-C2-Q28-O2","text":"Portfolios with the lowest possible risk regardless of return \nCác danh mục rủi ro thấp nhất bất kể lợi nhuận"},{"id":"PM120-C2-Q28-O3","text":"Portfolios with the highest utility for every investor \nCác danh mục hữu dụng cao nhất với mọi nhà đầu tư"},{"id":"PM120-C2-Q28-O4","text":"Portfolios offering the best available risk-return combinations \nCác danh mục có tổ hợp rủi ro–lợi nhuận tốt nhất hiện có"}],"correctOptionId":"PM120-C2-Q28-O4","explanation":"Giải thích (VI): Đường biên hiệu quả gồm các danh mục có lợi nhuận kỳ vọng cao nhất tại mỗi mức rủi ro, hoặc rủi ro nhỏ\nnhất để đạt một mức lợi nhuận kỳ vọng. Đây là tập hợp cơ hội hiệu quả, không phải duy nhất một danh mục phù hợp mọi\nngười.\nExplanation (EN): The efficient frontier contains portfolios with the highest expected return at each risk level, or the lowest\nrisk for a specified expected return. It is a set of efficient opportunities, not one portfolio preferred by everyone.","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q29","chapter":2,"number":29,"question":"What is the global minimum-variance portfolio?\nDanh mục phương sai tối thiểu toàn cục (GMV) là gì?","options":[{"id":"PM120-C2-Q29-O1","text":"The portfolio preferred by every investor \nDanh mục mọi nhà đầu tư đều ưa thích"},{"id":"PM120-C2-Q29-O2","text":"The portfolio with the lowest possible variance among all feasible portfolios \nDanh mục có phương sai thấp nhất trong tất cả danh mục khả thi"},{"id":"PM120-C2-Q29-O3","text":"The portfolio with the highest expected return \nDanh mục có lợi nhuận kỳ vọng cao nhất"},{"id":"PM120-C2-Q29-O4","text":"The portfolio with zero risk \nDanh mục không có rủi ro"}],"correctOptionId":"PM120-C2-Q29-O2","explanation":"Giải thích (VI): Danh mục GMV tối thiểu hóa phương sai trong tập hợp những tỷ trọng thỏa mãn ràng buộc. GMV có thể vẫn\ncó rủi ro lớn hơn 0 và không nhất thiết tối đa hóa lợi nhuận hay hữu dụng của từng nhà đầu tư.\nExplanation (EN): The global minimum-variance portfolio minimizes variance across all feasible allocations under the\nportfolio constraints. It may still have positive risk and does not necessarily maximize expected return or each investor’s\nutility.\nCông thức & tính toán / Formula & calculation:\nMinimize / Tối thiểu hóa: σₚ² = wᵀΣw\nSubject to / Với điều kiện: Σwᵢ = 1 (plus applicable constraints / và các ràng buộc khác)","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q30","chapter":2,"number":30,"question":"Which statement best distinguishes an efficient portfolio from an optimal portfolio?\nNhận định nào phân biệt đúng nhất giữa danh mục hiệu quả và danh mục tối ưu?","options":[{"id":"PM120-C2-Q30-O1","text":"Efficient portfolios describe available risk-return opportunities; the optimal portfolio also depends on investor preferences \nDanh mục hiệu quả thể hiện cơ hội rủi ro–lợi nhuận; danh mục tối ưu còn phụ thuộc sở thích nhà đầu tư"},{"id":"PM120-C2-Q30-O2","text":"Optimal portfolios always have the lowest variance \nDanh mục tối ưu luôn có phương sai thấp nhất"},{"id":"PM120-C2-Q30-O3","text":"Efficient portfolios depend on investor risk aversion; optimal portfolios do not \nDanh mục hiệu quả phụ thuộc mức ngại rủi ro; danh mục tối ưu thì không"},{"id":"PM120-C2-Q30-O4","text":"Every efficient portfolio is optimal for every investor \nMọi danh mục hiệu quả đều tối ưu với tất cả nhà đầu tư"}],"correctOptionId":"PM120-C2-Q30-O1","explanation":"Giải thích (VI): Danh mục hiệu quả thuộc tập hợp cơ hội có sự đánh đổi rủi ro–lợi nhuận tốt nhất. Danh mục tối ưu là lựa\nchọn của một nhà đầu tư cụ thể dựa trên sở thích, hàm hữu dụng và mức ngại rủi ro. Một danh mục hiệu quả không phải lúc\nnào cũng tối ưu với tất cả.\nExplanation (EN): Efficient portfolios belong to the best feasible risk-return opportunity set. The optimal portfolio is chosen\nbased on a particular investor’s preferences, utility function, and risk aversion. Not every efficient portfolio is optimal for\nevery investor.","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q31","chapter":2,"number":31,"question":"A portfolio has an expected return of 12%, variance of 0.020, and the investor's risk-aversion coefficient is A = 3. Using utility function, what is the utility?\nMột danh mục có lợi nhuận kỳ vọng 12%, phương sai 0,020 và hệ số ngại rủi ro A = 3. Mức hữu dụng theo hàm utility bằng bao nhiêu?","options":[{"id":"PM120-C2-Q31-O1","text":"6% \n6%"},{"id":"PM120-C2-Q31-O2","text":"12% \n12%"},{"id":"PM120-C2-Q31-O3","text":"9% \n9%"},{"id":"PM120-C2-Q31-O4","text":"15% \n15%"}],"correctOptionId":"PM120-C2-Q31-O3","explanation":"Giải thích (VI): Hàm hữu dụng trung bình–phương sai bằng lợi nhuận kỳ vọng trừ khoản phạt rủi ro. Đề cho phương sai\n0,020 nên không bình phương nó thêm lần nữa. Kết quả hữu dụng quy đổi theo tỷ suất là 9%, không phải lợi nhuận thực tế.\nExplanation (EN): The mean-variance utility function subtracts a risk penalty from expected return. The given 0.020 is\nvariance, so do not square it again. The return-equivalent utility is 9%, not a realized investment return.\nCông thức & tính toán / Formula & calculation:\nU = E(R) − ½ × A × σ²\nU = 0.12 − 0.5 × 3 × 0.020 = 0.12 − 0.03 = 0.09 = 9%","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q32","chapter":2,"number":32,"question":"If the expected return and variance of a portfolio remain unchanged, what happens to utility when the investor's risk-aversion coefficient increases?\nNếu lợi nhuận kỳ vọng và phương sai danh mục không đổi, mức hữu dụng thay đổi thế nào khi hệ số ngại rủi ro của nhà đầu tư tăng?","options":[{"id":"PM120-C2-Q32-O1","text":"Utility decreases \nMức hữu dụng giảm"},{"id":"PM120-C2-Q32-O2","text":"Utility increases \nMức hữu dụng tăng"},{"id":"PM120-C2-Q32-O3","text":"Utility becomes equal to expected return \nMức hữu dụng bằng lợi nhuận kỳ vọng"},{"id":"PM120-C2-Q32-O4","text":"Utility remains unchanged \nMức hữu dụng không thay đổi"}],"correctOptionId":"PM120-C2-Q32-O1","explanation":"Giải thích (VI): Với phương sai dương không đổi, hệ số A tăng làm tăng khoản phạt rủi ro ½Aσ², nên hữu dụng giảm. Nếu\nphương sai bằng 0, thay đổi A không tác động đến hữu dụng.\nExplanation (EN): With fixed positive variance, increasing A raises the risk penalty ½Aσ², so utility decreases. If variance is\nzero, changing A does not affect utility.\nCông thức & tính toán / Formula & calculation:\nU = E(R) − ½ × A × σ²\nFor σ² > 0 / Với σ² > 0: A ↑ ⇒ U ↓","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q33","chapter":2,"number":33,"question":"For a risk-neutral investor, what is the value of the risk-aversion coefficient A in the utility function?\nĐối với nhà đầu tư trung lập rủi ro, hệ số ngại rủi ro A trong hàm hữu dụng bằng bao nhiêu?","options":[{"id":"PM120-C2-Q33-O1","text":"A equals 1 \nA bằng 1"},{"id":"PM120-C2-Q33-O2","text":"A equals 0 \nA bằng 0"},{"id":"PM120-C2-Q33-O3","text":"A is smaller than 0 \nA nhỏ hơn 0"},{"id":"PM120-C2-Q33-O4","text":"A is greater than 1 \nA lớn hơn 1"}],"correctOptionId":"PM120-C2-Q33-O2","explanation":"Giải thích (VI): Nhà đầu tư trung lập rủi ro không áp dụng khoản phạt phương sai trong hàm hữu dụng trung bình–phương\nsai. Do đó A = 0 và U bằng lợi nhuận kỳ vọng. A dương biểu thị ngại rủi ro; A âm biểu thị ưa thích rủi ro trong mô hình này.\nExplanation (EN): A risk-neutral investor does not penalize variance in the mean-variance utility model. Therefore A = 0 and\nutility equals expected return. Positive A indicates risk aversion; negative A indicates risk seeking in this model.\nCông thức & tính toán / Formula & calculation:\nU = E(R) − ½ × A × σ²\nA = 0 ⇒ U = E(R)","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q34","chapter":2,"number":34,"question":"How does a higher risk-aversion coefficient affect a risk-averse investor's indifference curves?\nHệ số ngại rủi ro cao hơn ảnh hưởng thế nào tới đường bàng quan của nhà đầu tư ngại rủi ro?","options":[{"id":"PM120-C2-Q34-O1","text":"They become steeper \nCác đường trở nên dốc hơn"},{"id":"PM120-C2-Q34-O2","text":"They become flatter \nCác đường trở nên thoải hơn"},{"id":"PM120-C2-Q34-O3","text":"They become horizontal \nCác đường trở thành đường ngang"},{"id":"PM120-C2-Q34-O4","text":"They shift downward but keep the same slope \nCác đường dịch xuống nhưng giữ nguyên độ dốc"}],"correctOptionId":"PM120-C2-Q34-O1","explanation":"Giải thích (VI): Khi A cao hơn, nhà đầu tư yêu cầu lợi nhuận kỳ vọng tăng nhiều hơn để chấp nhận tăng rủi ro. Trên đồ thị\nlợi nhuận kỳ vọng (trục tung) theo độ lệch chuẩn (trục hoành), đường bàng quan dốc hơn.\nExplanation (EN): With higher A, the investor requires more expected return to accept an increase in risk. In expected-\nreturn-versus-standard-deviation space, the indifference curves become steeper.\nCông thức & tính toán / Formula & calculation:\nE(R) = U + ½ × A × σ² (holding U constant / giữ U không đổi)\nSlope / Độ dốc: dE(R)/dσ = Aσ; higher A ⇒ steeper curve for σ > 0","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q35","chapter":2,"number":35,"question":"In the Markowitz framework, where is the optimal portfolio for a particular investor found?\nTrong mô hình Markowitz, danh mục tối ưu của một nhà đầu tư cụ thể được tìm tại đâu?","options":[{"id":"PM120-C2-Q35-O1","text":"Where the highest attainable indifference curve is tangent to the efficient frontier \nNơi đường bàng quan cao nhất có thể đạt tiếp xúc với đường biên hiệu quả"},{"id":"PM120-C2-Q35-O2","text":"At the portfolio with the highest expected return \nTại danh mục có lợi nhuận kỳ vọng cao nhất"},{"id":"PM120-C2-Q35-O3","text":"At any portfolio located below the efficient frontier \nTại bất kỳ danh mục nào nằm dưới đường biên hiệu quả"},{"id":"PM120-C2-Q35-O4","text":"At the global minimum-variance portfolio for all investors \nTại GMV cho mọi nhà đầu tư"}],"correctOptionId":"PM120-C2-Q35-O1","explanation":"Giải thích (VI): Đường biên hiệu quả thể hiện cơ hội đầu tư; đường bàng quan biểu thị sở thích của nhà đầu tư. Trong trường\nhợp nghiệm tiếp tuyến thông thường, danh mục tối ưu là điểm tiếp xúc giữa đường bàng quan cao nhất đạt được và đường\nbiên hiệu quả. Các nghiệm ở biên có thể là ngoại lệ.\nExplanation (EN): The efficient frontier describes feasible investment opportunities, while indifference curves represent\npreferences. In the standard interior solution, the optimal portfolio is the tangency of the highest attainable indifference curve\nand the efficient frontier. Boundary solutions can be exceptions.\nCông thức & tính toán / Formula & calculation:\nUtility / Hữu dụng: U = E(R) − ½ × A × σ²","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q36","chapter":2,"number":36,"question":"When a risk-free asset is combined with a risky portfolio, the resulting risk-return combinations form:\nKhi kết hợp một tài sản phi rủi ro với một danh mục rủi ro, các tổ hợp lợi nhuận–rủi ro hình thành đường nào?","options":[{"id":"PM120-C2-Q36-O1","text":"The Capital Allocation Line \nĐường phân bổ vốn (CAL)"},{"id":"PM120-C2-Q36-O2","text":"The covariance matrix \nMa trận hiệp phương sai"},{"id":"PM120-C2-Q36-O3","text":"The efficient frontier only \nChỉ đường biên hiệu quả"},{"id":"PM120-C2-Q36-O4","text":"The Security Market Line \nĐường thị trường chứng khoán (SML)"}],"correctOptionId":"PM120-C2-Q36-O1","explanation":"Giải thích (VI): Đường phân bổ vốn (CAL) biểu diễn các tổ hợp giữa một tài sản phi rủi ro và một danh mục tài sản rủi ro cố\nđịnh. SML mô tả quan hệ lợi nhuận kỳ vọng–Beta trong CAPM nên không phải đáp án.\nExplanation (EN): The Capital Allocation Line (CAL) represents combinations of a risk-free asset and a fixed risky\nportfolio. The Security Market Line instead relates expected return to beta in the CAPM.\nCông thức & tính toán / Formula & calculation:\nE(RC) = Rf + [(E(RP) − Rf) / σP] × σC (standard lending segment / đoạn cho vay chuẩn)","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q37","chapter":2,"number":37,"question":"Among several Capital Allocation Lines drawn from the same risk-free rate, which one is preferred?\nGiữa nhiều đường CAL xuất phát từ cùng một lãi suất phi rủi ro, đường nào được ưu tiên?","options":[{"id":"PM120-C2-Q37-O1","text":"The CAL with the smallest slope \nCAL có độ dốc nhỏ nhất"},{"id":"PM120-C2-Q37-O2","text":"All CALs are equally attractive \nTất cả CAL hấp dẫn như nhau"},{"id":"PM120-C2-Q37-O3","text":"The CAL with the largest slope \nCAL có độ dốc lớn nhất"},{"id":"PM120-C2-Q37-O4","text":"The CAL with the lowest risky-asset return \nCAL có lợi nhuận tài sản rủi ro thấp nhất"}],"correctOptionId":"PM120-C2-Q37-O3","explanation":"Giải thích (VI): Độ dốc CAL bằng tỷ số Sharpe, tức lợi nhuận kỳ vọng vượt lãi suất phi rủi ro trên mỗi đơn vị độ lệch chuẩn.\nTrong các CAL cùng điểm xuất phát phi rủi ro, đường dốc nhất có Sharpe cao nhất.\nExplanation (EN): CAL slope equals the Sharpe ratio: expected excess return per unit of standard deviation. Among CALs\nfrom the same risk-free rate, the steepest has the highest Sharpe ratio.\nCông thức & tính toán / Formula & calculation:\nSlope of CAL / Độ dốc CAL = Sharpe = [E(RP) − Rf] / σP","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q38","chapter":2,"number":38,"question":"What is the tangency portfolio?\nDanh mục tiếp tuyến (Tangency Portfolio) là gì?","options":[{"id":"PM120-C2-Q38-O1","text":"The risk-free asset \nTài sản phi rủi ro"},{"id":"PM120-C2-Q38-O2","text":"Any inefficient portfolio combined with Treasury bills \nBất kỳ danh mục kém hiệu quả nào kết hợp tín phiếu Kho bạc"},{"id":"PM120-C2-Q38-O3","text":"The global minimum-variance portfolio in every case \nDanh mục phương sai tối thiểu toàn cục trong mọi trường hợp"},{"id":"PM120-C2-Q38-O4","text":"The risky portfolio where the CAL with the highest slope touches the efficient frontier \nDanh mục rủi ro tại nơi CAL có độ dốc lớn nhất tiếp xúc với đường biên hiệu quả"}],"correctOptionId":"PM120-C2-Q38-O4","explanation":"Giải thích (VI): Danh mục tiếp tuyến là danh mục tài sản rủi ro có tỷ số Sharpe tối đa tại lãi suất phi rủi ro đã cho. Đây là\nđiểm đường CAL dốc nhất tiếp xúc đường biên hiệu quả và không nhất thiết trùng danh mục GMV.\nExplanation (EN): The tangency portfolio is the risky portfolio that maximizes the Sharpe ratio for the given risk-free rate. It\nlies where the steepest CAL touches the efficient frontier and need not equal the GMV portfolio.\nCông thức & tính toán / Formula & calculation:\nTangency objective / Mục tiêu tiếp tuyến: maximize [E(RP) − Rf] / σP\nGMV objective / Mục tiêu GMV: minimize σP²\nPHẦN B. BỔ SUNG CÂU 39–40 / NEW PRACTICE QUESTIONS\nCác câu dưới đây được biên soạn thêm theo trọng tâm học tập; không phải câu trong nguồn gốc hoặc đề LMS đã được xác nhận.","source":"Câu gốc / Original","topic":"Markowitz's Theory","level":"Nguyên gốc"},{"id":"PM120-C2-Q39","chapter":2,"number":39,"question":"A portfolio has an expected return of 14%, a risk-free rate of 4%, and a standard deviation of 20%. What is its Sharpe ratio?\nDanh mục có lợi nhuận kỳ vọng 14%, lãi suất phi rủi ro 4% và độ lệch chuẩn 20%. Tỷ số Sharpe là bao nhiêu?","options":[{"id":"PM120-C2-Q39-O1","text":"0.20 0,20"},{"id":"PM120-C2-Q39-O2","text":"0.50 0,50"},{"id":"PM120-C2-Q39-O3","text":"0.70 0,70"},{"id":"PM120-C2-Q39-O4","text":"2.50 2,50"}],"correctOptionId":"PM120-C2-Q39-O2","explanation":"Explanation (EN): The Sharpe ratio is expected excess return divided by total standard deviation: (14% − 4%)/20% = 0.50.\nGiải thích (VI): Lấy lợi nhuận kỳ vọng vượt lãi suất phi rủi ro chia độ lệch chuẩn: (14% − 4%)/20% = 0,50.\nFormula / Calculation / Công thức & tính toán: Sharpe = [E(Rp) − Rf]/σp = 0.10/0.20 = 0.50","source":"Câu bổ sung / New","topic":"Markowitz's Theory","level":"Bổ sung"},{"id":"PM120-C2-Q40","chapter":2,"number":40,"question":"Portfolio A has E(R)=12%, variance=0.01; Portfolio B has E(R)=15%, variance=0.04. If risk aversion A=4, which portfolio has higher utility?\nDanh mục A có E(R)=12%, phương sai=0,01; B có E(R)=15%, phương sai=0,04. Với hệ số ngại rủi ro A=4, danh mục nào có hữu dụng cao hơn?","options":[{"id":"PM120-C2-Q40-O1","text":"Portfolio A. Danh mục A."},{"id":"PM120-C2-Q40-O2","text":"Portfolio B. Danh mục B."},{"id":"PM120-C2-Q40-O3","text":"Both have equal utility. Hai danh mục có hữu dụng bằng nhau."},{"id":"PM120-C2-Q40-O4","text":"Insufficient information. Không đủ thông tin."}],"correctOptionId":"PM120-C2-Q40-O1","explanation":"Explanation (EN): Using U=E(R)−½Aσ²: U_A=0.12−2(0.01)=0.10; U_B=0.15−2(0.04)=0.07. Thus A offers higher utility.\nGiải thích (VI): Hàm hữu dụng U=E(R)−½Aσ². U_A=10%; U_B=7%. Danh mục A có hữu dụng cao hơn dù lợi nhuận kỳ\nvọng thấp hơn.\nFormula / Calculation / Công thức & tính toán: U_A = 12% − 0.5×4×0.01 = 10%; U_B = 15% − 0.5×4×0.04 = 7%","source":"Câu bổ sung / New","topic":"Markowitz's Theory","level":"Bổ sung"},{"id":"PM120-C3-Q01","chapter":3,"number":1,"question":"A fund has a beta above the market beta. Which reallocation would most directly reduce its market sensitivity without using derivatives?\nMột quỹ đầu tư có hệ số beta cao hơn beta của thị trường. Việc điều chỉnh phân bổ tài sản nào sẽ trực tiếp làm giảm mức độ nhạy cảm của quỹ với thị trường mà không sử dụng công cụ phái sinh?","options":[{"id":"PM120-C3-Q01-O1","text":"Increase exposure to sectors highly responsive to economic cycles. \nTăng tỷ trọng đầu tư vào các ngành rất nhạy cảm với chu kỳ kinh tế."},{"id":"PM120-C3-Q01-O2","text":"Replace Treasury bills with cyclical shares. \nThay thế tín phiếu Kho bạc bằng cổ phiếu có tính chu kỳ."},{"id":"PM120-C3-Q01-O3","text":"Raise its investment in the highest-beta stocks. \nTăng đầu tư vào những cổ phiếu có hệ số beta cao nhất."},{"id":"PM120-C3-Q01-O4","text":"Increase its share of low-beta securities. \nTăng tỷ trọng các chứng khoán có hệ số beta thấp."}],"correctOptionId":"PM120-C3-Q01-O4","explanation":"Explanation (EN): Portfolio beta is the weighted average of the betas of its holdings. Raising the weight of low-beta\nsecurities, while reducing higher-beta holdings, directly lowers the portfolio’s sensitivity to market movements. The other\nallocations generally increase systematic-risk exposure.\nGiải thích (VI): Beta danh mục được tính theo trung bình có trọng số: βp = Σ(wi × βi). Tăng tỷ trọng chứng khoán beta thấp\nvà giảm tỷ trọng chứng khoán beta cao sẽ làm giảm beta chung. Các lựa chọn A, B và C thường làm tăng mức độ tiếp xúc với\nrủi ro hệ thống.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q02","chapter":3,"number":2,"question":"Why does the Fama–French Five-Factor Model distinguish profitability from investment?\nTại sao mô hình Fama–French 5 nhân tố phân biệt khả năng sinh lời với hoạt động đầu tư?","options":[{"id":"PM120-C3-Q02-O1","text":"They eliminate the importance of market beta. \nChúng loại bỏ tầm quan trọng của beta thị trường."},{"id":"PM120-C3-Q02-O2","text":"They capture different return patterns. \nChúng phản ánh những quy luật lợi suất khác nhau."},{"id":"PM120-C3-Q02-O3","text":"They always move together across all market cycles. \nChúng luôn biến động cùng nhau trong mọi chu kỳ thị trường."},{"id":"PM120-C3-Q02-O4","text":"They measure one identical source of risk. \nChúng đo lường chính xác cùng một nguồn rủi ro."}],"correctOptionId":"PM120-C3-Q02-O2","explanation":"Explanation (EN): The profitability factor (RMW, Robust Minus Weak) and the investment factor (CMA, Conservative\nMinus Aggressive) capture distinct patterns in average stock returns. They do not replace market beta and need not move\ntogether.\nGiải thích (VI): RMW đo chênh lệch lợi suất giữa doanh nghiệp có khả năng sinh lời mạnh và yếu; CMA đo chênh lệch giữa\ndoanh nghiệp đầu tư thận trọng và đầu tư mạnh. Đây là hai đặc điểm giải thích lợi suất khác nhau, không phải một nhân tố\ntrùng lặp hoặc có thể thay thế beta thị trường.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q03","chapter":3,"number":3,"question":"An aggressive investor selects a complete portfolio beyond the market portfolio on the theoretical Capital Market Line. How is this position established under the model’s borrowing assumption?\nMột nhà đầu tư ưa thích rủi ro chọn danh mục hoàn chỉnh nằm vượt quá danh mục thị trường trên đường thị trường vốn (CML) theo lý thuyết. Vị thế này được thiết lập như thế nào theo giả định vay vốn của mô hình?","options":[{"id":"PM120-C3-Q03-O1","text":"Increase lending to short-term government securities. \nTăng cho vay thông qua chứng khoán chính phủ ngắn hạn."},{"id":"PM120-C3-Q03-O2","text":"Borrow to buy more of the market portfolio. \nVay tiền để mua thêm danh mục thị trường."},{"id":"PM120-C3-Q03-O3","text":"Reduce exposure by selling part of the risky fund. \nGiảm mức đầu tư bằng cách bán bớt danh mục rủi ro."},{"id":"PM120-C3-Q03-O4","text":"Purchase a concentrated basket of highly volatile shares. \nMua một nhóm cổ phiếu tập trung có biến động rất cao."}],"correctOptionId":"PM120-C3-Q03-O2","explanation":"Explanation (EN): A point beyond the market portfolio on the theoretical CML represents a leveraged holding of that same\nmarket portfolio. The investor borrows at the assumed risk-free rate and invests more than 100% of equity in the market\nportfolio.\nGiải thích (VI): Trên CML lý thuyết, điểm nằm phía bên phải danh mục thị trường tương ứng với tỷ trọng vào danh mục rủi\nro y > 1, tức sử dụng đòn bẩy. Nhà đầu tư vay tại lãi suất phi rủi ro giả định để mua thêm danh mục thị trường, làm tăng cả lợi\nsuất kỳ vọng và rủi ro.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q04","chapter":3,"number":4,"question":"An investor can lend at the Treasury bill rate but must borrow at a higher rate. What is the most important consequence for constructing leveraged portfolios?\nMột nhà đầu tư có thể cho vay theo lãi suất tín phiếu Kho bạc nhưng phải đi vay với lãi suất cao hơn. Hệ quả quan trọng nhất khi xây dựng danh mục có đòn bẩy là gì?","options":[{"id":"PM120-C3-Q04-O1","text":"All investors must hold only Treasury bills. \nMọi nhà đầu tư đều phải chỉ nắm giữ tín phiếu Kho bạc."},{"id":"PM120-C3-Q04-O2","text":"Borrowed funds increase the original opportunity line’s slope. \nVốn vay làm tăng độ dốc của đường cơ hội đầu tư ban đầu."},{"id":"PM120-C3-Q04-O3","text":"Portfolio risk becomes unrelated to leverage. \nRủi ro danh mục không còn liên quan đến đòn bẩy."},{"id":"PM120-C3-Q04-O4","text":"Leveraged opportunities become less attractive. \nCơ hội đầu tư sử dụng đòn bẩy trở nên kém hấp dẫn hơn."}],"correctOptionId":"PM120-C3-Q04-O4","explanation":"Explanation (EN): A borrowing rate above the lending rate raises the financing cost of leveraged positions. For a given risky\nallocation, the investor retains less expected return after borrowing costs. The leveraged segment of the opportunity line is less\nattractive.\nGiải thích (VI): Khi lãi suất đi vay Rb cao hơn lãi suất cho vay Rf, chi phí sử dụng đòn bẩy tăng. Với y > 1, E(Rc) = yE(Rp)\n− (y − 1)Rb. Khi Rb tăng, lợi suất kỳ vọng còn lại giảm trong khi mức rủi ro từ tài sản rủi ro không tự giảm, khiến đòn bẩy\nkém hấp dẫn.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q05","chapter":3,"number":5,"question":"Under a positive market risk premium, what does a negative beta imply about how an asset can contribute to a diversified portfolio?\nKhi phần bù rủi ro thị trường dương, beta âm hàm ý điều gì về khả năng đóng góp của một tài sản vào danh mục đã đa dạng hóa?","options":[{"id":"PM120-C3-Q05-O1","text":"It offers exposure opposite to market swings. \nTài sản có xu hướng biến động ngược chiều thị trường."},{"id":"PM120-C3-Q05-O2","text":"It has no variability in its own return. \nLợi suất riêng của tài sản không biến động."},{"id":"PM120-C3-Q05-O3","text":"It avoids exposure to every economic shock. \nTài sản không chịu ảnh hưởng của bất kỳ cú sốc kinh tế nào."},{"id":"PM120-C3-Q05-O4","text":"It guarantees a positive realized return. \nTài sản bảo đảm lợi suất thực tế luôn dương."}],"correctOptionId":"PM120-C3-Q05-O1","explanation":"Explanation (EN): Beta measures covariance with the market scaled by market variance. A negative beta indicates an inverse\ntendency relative to market returns and may provide a hedging or diversification benefit. It does not mean zero volatility or\nguaranteed gains.\nGiải thích (VI): βi = Cov(Ri, Rm) / Var(Rm). Beta âm thể hiện hiệp phương sai với thị trường âm, nghĩa là tài sản có xu\nhướng biến động ngược thị trường và có thể hỗ trợ phòng vệ rủi ro. Tuy nhiên, không có gì bảo đảm tài sản sẽ tăng trong mọi\nlần thị trường giảm.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q06","chapter":3,"number":6,"question":"A client requests a portfolio emphasizing small-cap value stocks. Under the Fama–French Three-Factor Model, which combination of factor exposures should the manager seek?\nKhách hàng yêu cầu danh mục chú trọng cổ phiếu giá trị có vốn hóa nhỏ. Theo mô hình Fama–French 3 nhân tố, nhà quản lý nên tìm kiếm tổ hợp mức độ tiếp xúc nhân tố nào?","options":[{"id":"PM120-C3-Q06-O1","text":"Positive momentum and inflation exposures. \nMức độ tiếp xúc dương với động lượng và lạm phát."},{"id":"PM120-C3-Q06-O2","text":"Negative market beta and dividend exposures. \nMức độ tiếp xúc âm với beta thị trường và cổ tức."},{"id":"PM120-C3-Q06-O3","text":"Positive SMB and HML exposures. \nMức độ tiếp xúc dương với SMB và HML."},{"id":"PM120-C3-Q06-O4","text":"Negative SMB and HML exposures. \nMức độ tiếp xúc âm với SMB và HML."}],"correctOptionId":"PM120-C3-Q06-O3","explanation":"Explanation (EN): SMB (Small Minus Big) represents the size factor and HML (High Minus Low) represents the value\nfactor, based on book-to-market ratios. A small-cap value tilt is associated with positive exposure to both.\nGiải thích (VI): SMB là nhân tố quy mô, chênh lệch lợi suất cổ phiếu vốn hóa nhỏ và lớn. HML là nhân tố giá trị, chênh lệch\ngiữa cổ phiếu có tỷ số giá trị sổ sách/giá trị thị trường (B/M) cao và thấp. Do đó, đầu tư small-cap value gắn với hệ số tải nhân\ntố SMB dương và HML dương.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q07","chapter":3,"number":7,"question":"Two firms have different exposures to fuel prices. One tends to benefit from rising fuel costs, while the other tends to suffer. What benefit may a portfolio manager obtain by holding both stocks?\nHai doanh nghiệp có mức nhạy cảm khác nhau với giá nhiên liệu: một doanh nghiệp có xu hướng hưởng lợi khi chi phí nhiên liệu tăng, còn doanh nghiệp kia bị bất lợi. Việc cùng nắm giữ hai cổ phiếu có thể mang lại lợi ích gì?","options":[{"id":"PM120-C3-Q07-O1","text":"Guarantee that neither firm’s share price can fall. \nBảo đảm giá cổ phiếu của cả hai doanh nghiệp đều không thể giảm."},{"id":"PM120-C3-Q07-O2","text":"Eliminate sensitivity to all economy-wide risk factors. \nLoại bỏ mức độ nhạy cảm với mọi nhân tố rủi ro của nền kinh tế."},{"id":"PM120-C3-Q07-O3","text":"Ensure both stocks consistently outperform the market index. \nBảo đảm cả hai cổ phiếu luôn vượt hiệu suất chỉ số thị trường."},{"id":"PM120-C3-Q07-O4","text":"Lower volatility through offsetting returns. \nGiảm biến động nhờ lợi suất của hai cổ phiếu bù trừ cho nhau."}],"correctOptionId":"PM120-C3-Q07-O4","explanation":"Explanation (EN): Assets that respond differently to an economic variable may have lower correlation. Their returns can\npartially offset each other, reducing portfolio variance. This neither guarantees gains nor eliminates all market-wide risk.\nGiải thích (VI): Nếu hai cổ phiếu có biến động ít đồng chiều hoặc trái chiều, thành phần hiệp phương sai của danh mục có thể\nthấp. Với hai tài sản: σp² = wA²σA² + wB²σB² + 2wAwBσAσBρAB. Tương quan thấp hoặc âm giúp giảm biến động tổng thể,\nnhưng không loại bỏ mọi rủi ro.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q08","chapter":3,"number":8,"question":"A researcher estimates asset betas using only a domestic equity index, although the theoretical market portfolio contains a much broader universe of risky assets. What is the main interpretive concern?\nMột nhà nghiên cứu ước lượng beta bằng chỉ số cổ phiếu trong nước, trong khi danh mục thị trường theo lý thuyết chứa phạm vi tài sản rủi ro rộng hơn nhiều. Vấn đề diễn giải quan trọng nhất là gì?","options":[{"id":"PM120-C3-Q08-O1","text":"Estimated market exposure may be mismeasured. \nMức độ tiếp xúc với rủi ro thị trường được ước lượng có thể sai lệch."},{"id":"PM120-C3-Q08-O2","text":"Domestic equity prices become completely risk-free. \nGiá cổ phiếu trong nước trở nên hoàn toàn phi rủi ro."},{"id":"PM120-C3-Q08-O3","text":"All domestic securities must appear above the Security Market Line. \nMọi chứng khoán trong nước phải nằm phía trên SML."},{"id":"PM120-C3-Q08-O4","text":"Company-specific risk automatically becomes systematic. \nRủi ro đặc thù tự động biến thành rủi ro hệ thống."}],"correctOptionId":"PM120-C3-Q08-O1","explanation":"Explanation (EN): The true theoretical market portfolio includes a wide range of risky assets. A domestic stock index is an\nimperfect proxy, so betas estimated against it may not accurately represent exposure to the broader market portfolio.\nGiải thích (VI): CAPM lý thuyết sử dụng danh mục thị trường bao quát các tài sản rủi ro. Chỉ số chứng khoán trong nước chỉ\nđại diện cho một phần thị trường. Vì β = Cov(Ri, Rm)/Var(Rm) phụ thuộc vào chỉ số làm chuẩn, chọn đại diện không phù hợp\ncó thể gây sai lệch beta ước lượng.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q09","chapter":3,"number":9,"question":"A security’s forecast return is fifteen percent, while its required return under the CAPM is twelve percent. What expected Jensen’s alpha does this imply?\nMột chứng khoán có lợi suất dự báo 15%, trong khi lợi suất yêu cầu theo CAPM là 12%. Jensen’s alpha kỳ vọng bằng bao nhiêu?","options":[{"id":"PM120-C3-Q09-O1","text":"A negative three-percentage-point performance gap. \nChênh lệch hiệu suất âm 3 điểm phần trăm."},{"id":"PM120-C3-Q09-O2","text":"Three percentage points. \nBa điểm phần trăm."},{"id":"PM120-C3-Q09-O3","text":"Twenty-seven percentage points. \nHai mươi bảy điểm phần trăm."},{"id":"PM120-C3-Q09-O4","text":"Twelve percentage points. \nMười hai điểm phần trăm."}],"correctOptionId":"PM120-C3-Q09-O2","explanation":"Explanation (EN): Expected Jensen’s alpha equals the security’s forecast return minus its CAPM-required return: 15% −\n12% = +3 percentage points. It is an expected excess over a model benchmark, not a realized guarantee.\nGiải thích (VI): Alpha kỳ vọng = lợi suất dự báo − lợi suất yêu cầu theo CAPM = 15% − 12% = +3 điểm phần trăm. Alpha\ndương có thể hàm ý tiềm năng vượt mức yêu cầu nếu dự báo và mô hình đúng; không phải lợi nhuận đã chắc chắn đạt được.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q10","chapter":3,"number":10,"question":"A portfolio manager expands a portfolio from four stocks to five stocks. How many additional distinct pairwise covariances must be estimated to construct the full covariance matrix?\nMột nhà quản lý mở rộng danh mục từ bốn lên năm cổ phiếu. Phải ước lượng thêm bao nhiêu hiệp phương sai riêng biệt giữa các cặp cổ phiếu để lập ma trận hiệp phương sai đầy đủ?","options":[{"id":"PM120-C3-Q10-O1","text":"Ten, covering every possible portfolio pairing. \nMười, bao gồm mọi cặp cổ phiếu trong danh mục."},{"id":"PM120-C3-Q10-O2","text":"Five, including the new asset’s variance. \nNăm, bao gồm cả phương sai của tài sản mới."},{"id":"PM120-C3-Q10-O3","text":"Sixteen, for all ordered security pairs. \nMười sáu, tính tất cả cặp có xét thứ tự."},{"id":"PM120-C3-Q10-O4","text":"Four. \nBốn."}],"correctOptionId":"PM120-C3-Q10-O4","explanation":"Explanation (EN): The number of distinct pairwise covariances among n different assets is n(n − 1)/2. Four assets give 6;\nfive assets give 10. The additional number is 10 − 6 = 4. A fifth variance is needed too, but it is not a pairwise covariance.\nGiải thích (VI): Số hiệp phương sai giữa hai tài sản khác nhau là N = n(n − 1)/2. Với 4 cổ phiếu: 6 cặp; với 5 cổ phiếu: 10\ncặp. Cần bổ sung 10 − 6 = 4 hiệp phương sai, tương ứng cổ phiếu thứ năm với bốn cổ phiếu cũ. Phương sai của cổ phiếu thứ\nnăm là một ô đường chéo riêng.\nPHẦN II. CÂU 11–20 | VẬN DỤNG","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q11","chapter":3,"number":11,"question":"An analyst compares Stock A, which has high stand-alone volatility but low beta, with Stock B, which has modest stand-alone volatility but high beta. Under the CAPM, which stock should command a larger equilibrium risk premium?\nMột nhà phân tích so sánh cổ phiếu A có biến động riêng lẻ cao nhưng beta thấp với cổ phiếu B có biến động riêng lẻ vừa phải nhưng beta cao. Theo CAPM, cổ phiếu nào có phần bù rủi ro cân bằng lớn hơn?","options":[{"id":"PM120-C3-Q11-O1","text":"Both, because their stand-alone risks are different. \nCả hai, vì rủi ro riêng lẻ của chúng khác nhau."},{"id":"PM120-C3-Q11-O2","text":"Stock B, because its market exposure is higher. \nCổ phiếu B, vì mức tiếp xúc với thị trường cao hơn."},{"id":"PM120-C3-Q11-O3","text":"Stock A, because it fluctuates more independently. \nCổ phiếu A, vì nó biến động độc lập nhiều hơn."},{"id":"PM120-C3-Q11-O4","text":"Neither, because firm-level volatility determines all premiums. \nKhông cổ phiếu nào, vì biến động doanh nghiệp quyết định mọi phần bù rủi ro."}],"correctOptionId":"PM120-C3-Q11-O2","explanation":"Explanation (EN): CAPM rewards systematic risk, measured by beta, rather than total stand-alone volatility. Given a positive\nmarket risk premium, the security with higher beta (Stock B) commands a greater equilibrium risk premium.\nGiải thích (VI): Theo CAPM: E(Ri) − Rf = βi[E(Rm) − Rf]. Khi phần bù rủi ro thị trường dương, beta lớn hơn kéo theo phần\nbù rủi ro yêu cầu lớn hơn. B có beta cao, nên phần bù rủi ro cân bằng cao hơn dù độ biến động riêng lẻ không lớn bằng A.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q12","chapter":3,"number":12,"question":"A firm announces an unexpected patent approval when the broad equity index does not move. In a Single-Index Model, where should the unexpected stock movement primarily appear?\nDoanh nghiệp bất ngờ công bố được phê duyệt bằng sáng chế trong khi chỉ số chứng khoán chung không đổi. Trong mô hình chỉ số đơn, biến động bất ngờ của cổ phiếu chủ yếu phản ánh ở đâu?","options":[{"id":"PM120-C3-Q12-O1","text":"In the firm-specific residual. \nTrong phần dư đặc thù của doanh nghiệp."},{"id":"PM120-C3-Q12-O2","text":"In the market portfolio’s expected dividend yield. \nTrong tỷ suất cổ tức kỳ vọng của danh mục thị trường."},{"id":"PM120-C3-Q12-O3","text":"In the market return component. \nTrong thành phần lợi suất thị trường."},{"id":"PM120-C3-Q12-O4","text":"In the risk-free borrowing assumption. \nTrong giả định vay vốn ở lãi suất phi rủi ro."}],"correctOptionId":"PM120-C3-Q12-O1","explanation":"Explanation (EN): The Single-Index Model attributes stock movements to a market component and a firm-specific residual.\nAn unexpected patent approval is idiosyncratic news; with the market index unchanged, the unusual movement mainly enters\nthe residual.\nGiải thích (VI): Mô hình chỉ số đơn: Ri = αi + βiRm + εi. Tin phê duyệt bằng sáng chế là sự kiện đặc thù doanh nghiệp. Khi\nRm không đổi, tác động bất ngờ chủ yếu nằm ở εi (phần dư đặc thù) thay vì thành phần biến động thị trường.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q13","chapter":3,"number":13,"question":"A portfolio manager wants greater exposure to the profitability factor in the Fama–French Five-Factor Model. Which change best meets this objective?\nMột nhà quản lý muốn tăng mức tiếp xúc với nhân tố khả năng sinh lời trong Fama–French 5 nhân tố. Điều chỉnh nào phù hợp nhất?","options":[{"id":"PM120-C3-Q13-O1","text":"Favor firms with consistently higher market betas. \nƯu tiên doanh nghiệp có beta thị trường cao hơn một cách ổn định."},{"id":"PM120-C3-Q13-O2","text":"Switch the entire portfolio into short-maturity Treasury bills. \nChuyển toàn bộ danh mục sang tín phiếu Kho bạc ngắn hạn."},{"id":"PM120-C3-Q13-O3","text":"Prefer firms that invest aggressively regardless of earnings. \nƯu tiên doanh nghiệp đầu tư mạnh bất kể lợi nhuận."},{"id":"PM120-C3-Q13-O4","text":"Favor firms with robust profitability. \nƯu tiên doanh nghiệp có khả năng sinh lời mạnh."}],"correctOptionId":"PM120-C3-Q13-O4","explanation":"Explanation (EN): RMW (Robust Minus Weak) captures the return difference associated with stronger versus weaker\noperating profitability. Favoring robustly profitable companies increases the portfolio’s intended exposure to the profitability\ncharacteristic.\nGiải thích (VI): RMW là nhân tố chênh lệch lợi suất giữa doanh nghiệp có khả năng sinh lời hoạt động cao và thấp. Muốn\ntăng mức tiếp xúc với RMW, chiến lược hợp lý là ưu tiên doanh nghiệp có khả năng sinh lời mạnh, chứ không phải chỉ tăng\nbeta hoặc đầu tư mạnh bất chấp hiệu quả.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q14","chapter":3,"number":14,"question":"An investor needs a risk-free benchmark for a short investment horizon. Why is a Treasury bill maturing at the end of that horizon generally more appropriate than a long-term government bond?\nNhà đầu tư cần chuẩn lợi suất phi rủi ro cho kỳ đầu tư ngắn hạn. Tại sao tín phiếu Kho bạc đáo hạn đúng vào cuối kỳ thường phù hợp hơn trái phiếu chính phủ dài hạn?","options":[{"id":"PM120-C3-Q14-O1","text":"It always delivers a higher yield. \nNó luôn có lợi suất cao hơn."},{"id":"PM120-C3-Q14-O2","text":"It better matches the horizon. \nNó phù hợp hơn với thời hạn đầu tư."},{"id":"PM120-C3-Q14-O3","text":"It guarantees gains on early sale. \nNó bảo đảm có lãi nếu bán trước hạn."},{"id":"PM120-C3-Q14-O4","text":"It avoids all inflation risk. \nNó loại bỏ mọi rủi ro lạm phát."}],"correctOptionId":"PM120-C3-Q14-O2","explanation":"Explanation (EN): Matching maturity to the investment horizon reduces uncertainty about the nominal payoff when held to\nmaturity, assuming negligible default risk. Long bonds may have material interest-rate price risk if sold before maturity.\nGiải thích (VI): Tín phiếu đáo hạn trùng thời điểm cần dùng tiền giúp giảm bất định về dòng tiền danh nghĩa nếu nắm giữ\nđến đáo hạn và rủi ro vỡ nợ không đáng kể. Trái phiếu dài hạn có giá nhạy cảm hơn với lãi suất khi phải bán sớm; không tài\nsản nào tự loại bỏ rủi ro lạm phát.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q15","chapter":3,"number":15,"question":"Suppose investors require a larger premium for bearing market risk, while the risk-free rate remains unchanged. What happens to the Security Market Line?\nGiả sử nhà đầu tư yêu cầu phần bù cao hơn để gánh chịu rủi ro thị trường, còn lãi suất phi rủi ro không đổi. Đường thị trường chứng khoán SML sẽ thay đổi ra sao?","options":[{"id":"PM120-C3-Q15-O1","text":"It becomes flat for every risky security. \nSML nằm ngang đối với mọi chứng khoán rủi ro."},{"id":"PM120-C3-Q15-O2","text":"It becomes a curve instead of a straight line. \nSML trở thành đường cong thay vì đường thẳng."},{"id":"PM120-C3-Q15-O3","text":"It moves downward without changing slope. \nSML dịch xuống nhưng độ dốc không đổi."},{"id":"PM120-C3-Q15-O4","text":"It becomes steeper from the same intercept. \nSML dốc hơn, với cùng điểm chặn."}],"correctOptionId":"PM120-C3-Q15-O4","explanation":"Explanation (EN): The SML intercept is the risk-free rate; its slope is the market risk premium E(Rm) − Rf. A higher market\nrisk premium with unchanged Rf steepens the line while preserving the intercept.\nGiải thích (VI): Trong E(Ri) = Rf + βi[E(Rm) − Rf], điểm chặn theo trục lợi suất là Rf và độ dốc theo beta là phần bù rủi ro\nthị trường. Nếu Rf giữ nguyên nhưng phần bù tăng, SML trở nên dốc hơn từ cùng điểm chặn.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q16","chapter":3,"number":16,"question":"In the Single-Index Model, what is the economic meaning of a stock’s residual return?\nTrong mô hình chỉ số đơn, ý nghĩa kinh tế của lợi suất phần dư của một cổ phiếu là gì?","options":[{"id":"PM120-C3-Q16-O1","text":"The guaranteed excess over Treasury bills. \nLợi suất vượt tín phiếu Kho bạc được bảo đảm."},{"id":"PM120-C3-Q16-O2","text":"The company-specific unexplained component. \nThành phần đặc thù doanh nghiệp chưa được mô hình giải thích."},{"id":"PM120-C3-Q16-O3","text":"The common return from market movements. \nThành phần lợi suất chung do biến động thị trường."},{"id":"PM120-C3-Q16-O4","text":"The price change caused by risk-free lending. \nThay đổi giá do cho vay phi rủi ro gây ra."}],"correctOptionId":"PM120-C3-Q16-O2","explanation":"Explanation (EN): The residual is the part of an observed stock return not explained by the fitted market component in the\nSingle-Index Model. It reflects idiosyncratic influences and other unexplained shocks, not guaranteed excess return.\nGiải thích (VI): Theo Ri = αi + βiRm + εi, εi là phần không được giải thích bởi phần thị trường trong mô hình. Phần dư có\nthể phản ánh tin riêng của doanh nghiệp, sự kiện bất thường hoặc sai số. Cần phân biệt εi với βiRm (phần phản ứng theo thị\ntrường).","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q17","chapter":3,"number":17,"question":"The risk-free return is four percent, the expected market return is ten percent, and a stock has a beta of one point five. Assuming the CAPM holds, what is the stock’s required return?\nLợi suất phi rủi ro là 4%, lợi suất kỳ vọng thị trường là 10% và beta cổ phiếu bằng 1,5. Giả sử CAPM đúng, lợi suất yêu cầu của cổ phiếu là bao nhiêu?","options":[{"id":"PM120-C3-Q17-O1","text":"Four percent. \nBốn phần trăm (4%)."},{"id":"PM120-C3-Q17-O2","text":"Nineteen percent, including the full market premium twice. \nMười chín phần trăm (19%), cộng phần bù thị trường hai lần."},{"id":"PM120-C3-Q17-O3","text":"Ten percent. \nMười phần trăm (10%)."},{"id":"PM120-C3-Q17-O4","text":"Thirteen percent. \nMười ba phần trăm (13%)."}],"correctOptionId":"PM120-C3-Q17-O4","explanation":"Explanation (EN): CAPM gives required return = Rf + β[E(Rm) − Rf] = 4% + 1.5 × (10% − 4%) = 13%. The market risk\npremium is 6%, so this stock’s risk premium is 9%.\nGiải thích (VI): Áp dụng CAPM: E(Ri) = 4% + 1,5 × (10% − 4%) = 4% + 9% = 13%. Do beta bằng 1,5, phần bù rủi ro cổ\nphiếu bằng 1,5 lần phần bù thị trường (6%).","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q18","chapter":3,"number":18,"question":"Why does combining a risk-free asset with a risky portfolio create a straight opportunity line in expected return and total risk?\nTại sao kết hợp tài sản phi rủi ro với danh mục rủi ro tạo ra đường cơ hội thẳng trong không gian lợi suất kỳ vọng và tổng rủi ro?","options":[{"id":"PM120-C3-Q18-O1","text":"Every asset becomes independent of the market. \nMọi tài sản đều trở nên độc lập với thị trường."},{"id":"PM120-C3-Q18-O2","text":"Both measures vary with the risky weight. \nCả hai đại lượng thay đổi theo tỷ trọng danh mục rủi ro."},{"id":"PM120-C3-Q18-O3","text":"Diversification eliminates market-wide risk entirely. \nĐa dạng hóa loại bỏ mọi rủi ro toàn thị trường."},{"id":"PM120-C3-Q18-O4","text":"Expected returns become perfectly predictable. \nLợi suất kỳ vọng trở nên dự đoán chính xác hoàn toàn."}],"correctOptionId":"PM120-C3-Q18-O2","explanation":"Explanation (EN): For a nonnegative risky-portfolio weight y, expected return is Rf + y[E(Rp) − Rf], while standard\ndeviation is yσp. Eliminating y yields a linear relation between expected return and total risk: the CAL.\nGiải thích (VI): Với tỷ trọng danh mục rủi ro y ≥ 0: E(Rc) = Rf + y[E(Rp) − Rf] và σc = yσp. Khử y cho phương trình đường\nthẳng E(Rc) = Rf + {[E(Rp) − Rf]/σp}σc. Đó là Capital Allocation Line (CAL).","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q19","chapter":3,"number":19,"question":"A company announces a product recall, but broad equity-market conditions remain unchanged. Why is the resulting company-specific risk generally not rewarded with a separate risk premium under the CAPM?\nMột doanh nghiệp công bố thu hồi sản phẩm trong khi điều kiện chung của thị trường cổ phiếu không đổi. Tại sao rủi ro riêng phát sinh thường không được trả thêm phần bù riêng theo CAPM?","options":[{"id":"PM120-C3-Q19-O1","text":"It is diversifiable firm-specific risk. \nĐó là rủi ro đặc thù doanh nghiệp có thể đa dạng hóa."},{"id":"PM120-C3-Q19-O2","text":"It raises every shareholder’s risk tolerance. \nNó làm tăng mức chấp nhận rủi ro của mọi cổ đông."},{"id":"PM120-C3-Q19-O3","text":"It always reduces long-run inflation. \nNó luôn làm giảm lạm phát dài hạn."},{"id":"PM120-C3-Q19-O4","text":"It is a universal market event. \nĐó là sự kiện tác động chung toàn thị trường."}],"correctOptionId":"PM120-C3-Q19-O1","explanation":"Explanation (EN): CAPM prices nondiversifiable systematic risk, measured by beta. The recall is mainly firm-specific; a\nwell-diversified investor can mitigate such idiosyncratic exposure. The event may still cause large losses in that stock.\nGiải thích (VI): Theo CAPM, chỉ rủi ro hệ thống (beta) được trả phần bù cân bằng. Thu hồi sản phẩm chủ yếu là rủi ro đặc\nthù, có thể phân tán nhờ nắm giữ nhiều chứng khoán. Việc không được trả phần bù riêng không đồng nghĩa giá cổ phiếu\nkhông thể giảm mạnh.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q20","chapter":3,"number":20,"question":"A retiree holds an efficient market portfolio and needs less total volatility without changing the mix of risky securities. Which adjustment is consistent with capital market theory?\nMột người nghỉ hưu nắm giữ danh mục thị trường hiệu quả và cần giảm tổng biến động mà không thay đổi tỷ trọng tương đối giữa các chứng khoán rủi ro. Điều chỉnh nào phù hợp với lý thuyết thị trường vốn?","options":[{"id":"PM120-C3-Q20-O1","text":"Increase the risk-free allocation. \nTăng tỷ trọng tài sản phi rủi ro."},{"id":"PM120-C3-Q20-O2","text":"Borrow more at a rate above the risk-free rate. \nVay thêm vốn với lãi suất cao hơn phi rủi ro."},{"id":"PM120-C3-Q20-O3","text":"Add a concentrated position in an illiquid sector. \nTăng vị thế tập trung trong ngành kém thanh khoản."},{"id":"PM120-C3-Q20-O4","text":"Replace the market portfolio with one speculative stock. \nThay danh mục thị trường bằng một cổ phiếu đầu cơ."}],"correctOptionId":"PM120-C3-Q20-O1","explanation":"Explanation (EN): Shifting part of wealth from the market portfolio into the risk-free asset reduces the risky weight and total\nvolatility, while leaving the relative composition within the risky portfolio unchanged. This moves toward the risk-free\nintercept on the CML.\nGiải thích (VI): Nếu y là tỷ trọng vào danh mục thị trường, σc = yσm (với y ≥ 0). Giảm y và tăng (1 − y) vào tài sản phi rủi\nro sẽ giảm độ lệch chuẩn mà không cần thay đổi cơ cấu tương đối giữa các cổ phiếu rủi ro.\nPHẦN III. CÂU 21–25 | BỔ SUNG KHÔNG TRÙNG","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q21","chapter":3,"number":21,"question":"A fund owns shares across twenty unrelated industries but suffers substantial losses during an economy-wide recession. Which conclusion best explains the outcome?\nMột quỹ nắm giữ cổ phiếu thuộc 20 ngành ít liên quan nhưng vẫn lỗ lớn khi toàn nền kinh tế suy thoái. Kết luận nào giải thích đúng nhất?","options":[{"id":"PM120-C3-Q21-O1","text":"Market-wide risk remains after diversification. \nRủi ro toàn thị trường vẫn tồn tại sau đa dạng hóa."},{"id":"PM120-C3-Q21-O2","text":"A diversified portfolio cannot have negative returns. \nDanh mục đa dạng hóa không thể có lợi suất âm."},{"id":"PM120-C3-Q21-O3","text":"Every company-specific shock occurred independently of the downturn. \nMọi cú sốc đặc thù công ty đều độc lập với suy thoái."},{"id":"PM120-C3-Q21-O4","text":"Holding more sectors necessarily increases specific risk. \nNắm giữ nhiều ngành nhất thiết làm tăng rủi ro đặc thù."}],"correctOptionId":"PM120-C3-Q21-O1","explanation":"Explanation (EN): Diversification can reduce diversifiable (idiosyncratic) risk, but systematic risk arising from economy-\nwide recession still affects many assets simultaneously. Therefore even a broad stock portfolio can lose money.\nGiải thích (VI): Đa dạng hóa giúp giảm rủi ro phi hệ thống nhưng không triệt tiêu rủi ro hệ thống như suy thoái kinh tế,\nkhủng hoảng tài chính hoặc cú sốc vĩ mô. Nhiều ngành có thể cùng giảm giá trong một đợt suy thoái, nên danh mục phân tán\nvẫn có thể lỗ.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q22","chapter":3,"number":22,"question":"An analyst evaluates an individual stock that is not part of an efficient portfolio. Which benchmark is suitable for judging its required return under the CAPM?\nMột nhà phân tích đánh giá cổ phiếu riêng lẻ không thuộc danh mục hiệu quả. Đường nào phù hợp để xét lợi suất yêu cầu của nó theo CAPM?","options":[{"id":"PM120-C3-Q22-O1","text":"The minimum-variance portfolio frontier. \nĐường biên các danh mục phương sai tối thiểu."},{"id":"PM120-C3-Q22-O2","text":"The investor’s utility indifference curve. \nĐường bàng quan hữu dụng của nhà đầu tư."},{"id":"PM120-C3-Q22-O3","text":"The Security Market Line. \nĐường thị trường chứng khoán (SML)."},{"id":"PM120-C3-Q22-O4","text":"The Capital Market Line. \nĐường thị trường vốn (CML)."}],"correctOptionId":"PM120-C3-Q22-O3","explanation":"Explanation (EN): The SML expresses CAPM required return as a function of beta for individual securities or portfolios,\nincluding inefficient portfolios. The CML applies only to efficient combinations of the risk-free asset and the market portfolio,\nusing total volatility.\nGiải thích (VI): SML dùng beta để định giá lợi suất yêu cầu của bất kỳ chứng khoán hoặc danh mục nào theo CAPM. CML\ndùng độ lệch chuẩn để mô tả các danh mục hiệu quả tạo bởi tài sản phi rủi ro và danh mục thị trường. Vì đối tượng là một cổ\nphiếu riêng lẻ, dùng SML.","source":"Câu gốc / Original","topic":"Asset Pricing Models","level":"Nguyên gốc"},{"id":"PM120-C3-Q23","chapter":3,"number":23,"question":"An active fund reports positive alpha under the CAPM, but its alpha vanishes when the Fama–French size and value factors are included. What is the strongest interpretation?\nMột quỹ chủ động có alpha dương theo CAPM, nhưng alpha biến mất khi thêm nhân tố quy mô và giá trị Fama– French. Diễn giải thuyết phục nhất là gì?","options":[{"id":"PM120-C3-Q23-O1","text":"Its apparent skill may reflect factor exposure. \nThành tích tưởng như do kỹ năng có thể phản ánh mức tiếp xúc nhân tố."},{"id":"PM120-C3-Q23-O2","text":"The market factor plays no role in explaining performance. \nNhân tố thị trường không còn vai trò giải thích lợi suất."},{"id":"PM120-C3-Q23-O3","text":"The fund generated guaranteed arbitrage profits. \nQuỹ tạo được lợi nhuận arbitrage bảo đảm."},{"id":"PM120-C3-Q23-O4","text":"The original stock returns were recorded incorrectly. \nLợi suất cổ phiếu gốc đã ghi nhận sai."}],"correctOptionId":"PM120-C3-Q23-O1","explanation":"Explanation (EN): Alpha estimated from a one-factor CAPM regression may partly absorb missing systematic return\npatterns. If it vanishes when SMB and HML are added, the previous outperformance may be explained by size and value tilts\nrather than unique security-selection skill.\nGiải thích (VI): CAPM chỉ kiểm soát nhân tố thị trường. Nếu mô hình bỏ
