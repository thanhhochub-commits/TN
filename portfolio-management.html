function applyPrefs(){document.documentElement.dataset.theme=state.theme||'light'; const fs=state.font==='small'?14:state.font==='large'?18:16;document.documentElement.style.setProperty('--font',fs+'px')}
applyPrefs();
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function stat(qid){return state.stats[qid]||{attempts:0,correct:0,wrong:0,streak:0,lastAt:null}}
function statusOf(qid){const s=stat(qid);if(!s.attempts)return 'new';if(state.wrongIds.includes(qid))return 'weak';if(s.streak>=2)return 'mastered';return 'learning'}
function chapterQuestions(ch){return QUESTIONS.filter(q=>q.chapter===ch)}
function overall(){const done=QUESTIONS.filter(q=>stat(q.id).attempts>0).length;const mastered=QUESTIONS.filter(q=>statusOf(q.id)==='mastered').length;let a=0,c=0;QUESTIONS.forEach(q=>{const s=stat(q.id);a+=s.correct+s.wrong;c+=s.correct});return{done,mastered,wrong:state.wrongIds.length,accuracy:a?Math.round(c/a*100):0}}
function navigate(p){page=p;session=null;clearTimer();$('#topTimer').classList.add('hidden');$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#topTitle').textContent={dashboard:'Trang chủ',practice:'Ôn tập / Kiểm tra',wrong:'Câu sai',bookmarks:'Đã đánh dấu',bank:'Ngân hàng câu hỏi',stats:'Thống kê',settings:'Cài đặt'}[p]||'';render();$('#sidebar').classList.remove('open');scrollTo({top:0,behavior:'auto'})}

<div class="card" style="grid-column:span 12"><h3 class="section-title">Tiến độ toàn bộ ngân hàng</h3><div class="progress"><span style="width:${QUESTIONS.length?o.done/QUESTIONS.length*100:0}%"></span></div><p class="muted">${o.done} câu đã chạm tới • ${QUESTIONS.length-o.done} câu chưa làm</p><div class="row"><button class="btn primary" onclick="navigate('practice')">Bắt đầu ôn</button>${state.activeSession?'<button class="btn" onclick="resumeSaved()">Tiếp tục bài đang dở</button>':''}<button class="btn" onclick="quickWrong()">Ôn câu sai</button></div></div>
${[1,2,3].map(ch=>{const qs=chapterQuestions(ch);const done=qs.filter(q=>stat(q.id).attempts).length;const weak=qs.filter(q=>state.wrongIds.includes(q.id)).length;return `<div class="card" style="grid-column:span 6"><b>Chương ${ch}</b><div class="muted">${esc(CHAPTERS[ch])}</div><div class="row" style="margin-top:10px"><span class="pill">Đã học ${done}/${qs.length}</span><span class="pill">Câu yếu ${weak}</span><button class="btn" onclick="startChapter(${ch})">Ôn chương</button></div></div>`}).join('')}</div>`}
function setupHTML(){return `<h1 class="page-title">Tạo bài ôn / bài kiểm tra</h1><p class="sub">Chế độ ôn sẽ phản hồi ngay. Nếu chọn sai, lựa chọn sai chuyển đỏ, đáp án đúng chuyển xanh và giải thích hiện ngay bên dưới.</p><div class="setup"><div class="card"><h3 class="section-title">1. Chọn chương</h3><div class="chapter-grid">${[1,2,3].map(ch=>`<label class="chapter-item"><input type="checkbox" class="chpick" value="${ch}" checked><span><b>Chương ${ch}</b><small style="display:block;color:var(--muted)">${esc(CHAPTERS[ch])} • ${chapterQuestions(ch).length} câu</small></span></label>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn" id="allCh">Chọn tất cả</button><button class="btn" id="noneCh">Bỏ chọn</button></div></div><div class="card"><h3 class="section-title">2. Thiết lập</h3><div class="field"><label>Chế độ</label><select id="mode"><option value="practice">Ôn tập: hiện đúng/sai + giải thích ngay</option><option value="test">Kiểm tra: nộp bài mới hiện kết quả</option></select></div><div class="field" style="margin-top:10px"><label>Số câu</label><select id="count"><option>10</option><option>20</option><option>30</option><option selected>50</option><option>100</option><option value="all">Tất cả trong phạm vi</option></select></div><label class="toggle" style="margin-top:10px"><input id="shuffleQ" type="checkbox" ${state.shuffleQ?'checked':''}> Xáo thứ tự câu hỏi</label><label class="toggle" style="margin-top:8px"><input id="shuffleA" type="checkbox" ${state.shuffleA?'checked':''}> Xáo vị trí đáp án A, B, C, D</label><div class="field" style="margin-top:10px"><label>Giới hạn thời gian toàn bài</label><select id="timerMin"><option value="0">Không giới hạn</option><option value="10">10 phút</option><option value="20">20 phút</option><option value="30">30 phút</option><option value="45">45 phút</option><option value="60">60 phút</option></select></div><button class="btn primary" style="width:100%;margin-top:14px" id="startBtn">Bắt đầu</button></div></div>`}
function renderSetup(c){c.innerHTML=setupHTML();$('#allCh').onclick=()=>$$('.chpick').forEach(x=>x.checked=true);$('#noneCh').onclick=()=>$$('.chpick').forEach(x=>x.checked=false);$('#startBtn').onclick=()=>{const chapters=$$('.chpick:checked').map(x=>+x.value);if(!chapters.length)return toast('Hãy chọn ít nhất một chương');startSession({chapters,count:$('#count').value,mode:$('#mode').value,shuffleQ:$('#shuffleQ').checked,shuffleA:$('#shuffleA').checked,timerMin:+$('#timerMin').value})}}
function startChapter(ch){page='practice';startSession({chapters:[ch],count:'all',mode:'practice',shuffleQ:true,shuffleA:true,timerMin:0})}
function quickWrong(){if(!state.wrongIds.length)return toast('Chưa có câu sai để ôn');startSessionFromIds(state.wrongIds,'practice',true,true,0)}
function startSession(cfg){state.shuffleQ=cfg.shuffleQ;state.shuffleA=cfg.shuffleA;saveState();let pool=QUESTIONS.filter(q=>cfg.chapters.includes(q.chapter));if(cfg.shuffleQ)pool=shuffle(pool);const n=cfg.count==='all'?pool.length:Math.min(+cfg.count,pool.length);startSessionFromObjects(pool.slice(0,n),cfg.mode,cfg.shuffleA,cfg.timerMin)}
function startSessionFromIds(ids,mode='practice',shuffleA=true,timerMin=0){let pool=QUESTIONS.filter(q=>ids.includes(q.id));pool=shuffle(pool);startSessionFromObjects(pool,mode,shuffleA,timerMin)}
function startSessionFromObjects(qs,mode,shuffleA,timerMin){session={id:Date.now(),mode,index:0,startedAt:Date.now(),endsAt:timerMin?Date.now()+timerMin*60000:null,submitted:false,items:qs.map(q=>({qid:q.id,optionOrder:(shuffleA?shuffle(q.options):q.options).map(o=>o.id),selected:null,locked:false}))};state.activeSession=session;saveState();renderQuiz();startTimer()}
function resumeSaved(){if(!state.activeSession)return;session=state.activeSession;page='practice';renderQuiz();startTimer()}
function startTimer(){clearTimer();if(!session?.endsAt){$('#topTimer').classList.add('hidden');return}const el=$('#topTimer');el.classList.remove('hidden');const tick=()=>{const left=Math.max(0,session.endsAt-Date.now());const m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);el.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;if(left<=0){clearTimer();submitTest(true)}};tick();timerHandle=setInterval(tick,1000)}
function clearTimer(){if(timerHandle)clearInterval(timerHandle);timerHandle=null}
function currentItem(){return session.items[session.index]}
function qById(id){return QUESTIONS.find(q=>q.id===id)}
function optionText(q,oid){return q.options.find(o=>o.id===oid)?.text||''}
function renderQuiz(){const c=$('#content');if(!session)return renderSetup(c);const it=currentItem(),q=qById(it.qid);const practice=session.mode==='practice';const show=practice&&it.locked;const selected=it.selected;const correct=q.correctOptionId;const graded=!!correct;const isCorrect=graded&&selected===correct;const answered=session.items.filter(x=>x.selected).length;c.innerHTML=`<div class="quiz-wrap"><div class="quiz-head"><span>${session.index+1}/${session.items.length}</span><div class="progress"><span style="width:${(session.index+1)/session.items.length*100}%"></span></div><button class="icon-btn bookmark ${state.bookmarks.includes(q.id)?'active':''}" onclick="toggleBookmark('${q.id}')">★</button></div><div class="navigator">${session.items.map((x,i)=>{let cls=i===session.index?'current ':'';if(session.mode==='practice'&&x.locked){const qq=qById(x.qid);if(!qq.correctOptionId)cls+='answered';else cls+=x.selected===qq.correctOptionId?'correct':'wrong'}else if(x.selected)cls+='answered';return `<button class="navq ${cls}" onclick="goQ(${i})">${i+1}</button>`}).join('')}</div><div class="quiz-card"><div class="q-meta"><span class="pill">Chương ${q.chapter}</span><span class="pill">${esc(q.source||'Portfolio Management')}</span><span class="pill">${q.id}</span>${session.mode==='test'?'<span class="pill">Chế độ kiểm tra</span>':'<span class="pill">Chế độ ôn tập</span>'}</div><div class="question">${esc(q.question)}</div><div class="options">${it.optionOrder.map((oid,idx)=>{let cls='';if(show){if(graded&&oid===correct)cls='correct';else if(graded&&oid===selected)cls='wrong';else if(!graded&&oid===selected)cls='review'}else if(session.mode==='test'&&oid===selected)cls='selected';return `<button class="option ${cls}" ${show?'disabled':''} onclick="choose('${oid}')"><span class="opt-letter">${'ABCD'[idx]}</span><span>${esc(optionText(q,oid))}${show&&graded&&oid===correct?' <b>✓ Đáp án đúng</b>':''}${show&&graded&&oid===selected&&oid!==correct?' <b>✕ Bạn đã chọn</b>':''}${show&&!graded&&oid===selected?' <b>• Bạn đã chọn</b>':''}</span></button>`}).join('')}</div>${show?(graded?`<div class="feedback ${isCorrect?'good':'bad'}"><b>${isCorrect?'✓ Chính xác':'✕ Chưa đúng'}</b>${!isCorrect?`Bạn đã chọn <b>${esc(optionText(q,selected))}</b>. Đáp án đúng được tô xanh phía trên.`:''}<div class="explanation"><b>Giải thích vì sao đáp án màu xanh đúng:</b>${esc(q.explanation)}</div></div>`:`<div class="feedback review"><b>⚠ Câu này chưa có đáp án chính thức đủ rõ để chốt duy nhất</b><div class="explanation"><b>Giải thích / lưu ý:</b>${esc(q.explanation)}</div></div>`):''}<div class="quiz-actions"><button class="btn" onclick="prevQ()" ${session.index===0?'disabled':''}>← Câu trước</button>${session.mode==='test'?`<button class="btn primary" onclick="${session.index===session.items.length-1?'submitTest()':'nextQ()'}">${session.index===session.items.length-1?'Nộp bài':'Câu tiếp →'}</button>`:`<button class="btn primary" onclick="nextQ()" ${!it.locked?'disabled':''}>${session.index===session.items.length-1?'Hoàn thành':'Câu tiếp →'}</button>`}</div></div><p class="muted" style="text-align:center">Đã trả lời ${answered}/${session.items.length}. Phím 1–4 chọn A–D; Enter sang câu tiếp.</p></div>`;$('#topTitle').textContent='Đang làm bài';state.activeSession=session;saveState()}
function choose(oid){const it=currentItem(),q=qById(it.qid);if(session.mode==='practice'&&it.locked)return;it.selected=oid;if(session.mode==='practice'){it.locked=true;if(q.correctOptionId)recordAttempt(q.id,oid===q.correctOptionId);else recordReview(q.id)}state.activeSession=session;saveState();renderQuiz()}
function recordAttempt(qid,correct){const s=stat(qid);s.attempts++;s.lastAt=Date.now();if(correct){s.correct++;s.streak++;if(s.streak>=2)state.wrongIds=state.wrongIds.filter(x=>x!==qid)}else{s.wrong++;s.streak=0;if(!state.wrongIds.includes(qid))state.wrongIds.push(qid)}state.stats[qid]=s;saveState()}
function recordReview(qid){const s=stat(qid);s.attempts++;s.lastAt=Date.now();state.stats[qid]=s;saveState()}
function nextQ(){if(session.index<session.items.length-1){session.index++;renderQuiz()}else{if(session.mode==='practice')finishPractice();else submitTest()}}
function prevQ(){if(session.index>0){session.index--;renderQuiz()}}
function goQ(i){session.index=i;renderQuiz()}
function toggleBookmark(qid){if(state.bookmarks.includes(qid))state.bookmarks=state.bookmarks.filter(x=>x!==qid);else state.bookmarks.push(qid);saveState();renderQuiz()}
function finishPractice(){const gradable=session.items.filter(x=>qById(x.qid).correctOptionId);const correct=gradable.filter(x=>{const q=qById(x.qid);return x.selected===q.correctOptionId}).length;const ungraded=session.items.length-gradable.length;const done={id:session.id,date:Date.now(),mode:'practice',total:gradable.length,correct,ungraded};state.sessions.unshift(done);state.sessions=state.sessions.slice(0,50);state.activeSession=null;saveState();clearTimer();$('#topTimer').classList.add('hidden');showResult(correct,gradable.length,'Ôn tập hoàn thành',ungraded)}
function submitTest(auto=false){if(!session||session.submitted)return;const unanswered=session.items.filter(x=>!x.selected).length;if(!auto&&unanswered&&!confirm(`Bạn còn ${unanswered} câu chưa trả lời. Vẫn nộp bài?`))return;session.submitted=true;let correct=0,gradable=0,ungraded=0;session.items.forEach(x=>{const q=qById(x.qid);if(!q.correctOptionId){ungraded++;if(x.selected)recordReview(q.id);return}gradable++;const ok=x.selected===q.correctOptionId;if(x.selected)recordAttempt(q.id,ok);if(ok)correct++});state.sessions.unshift({id:session.id,date:Date.now(),mode:'test',total:gradable,correct,ungraded});state.sessions=state.sessions.slice(0,50);state.activeSession=null;saveState();clearTimer();$('#topTimer').classList.add('hidden');showTestReview(correct,auto)}

function showResult(correct,total,title,ungraded=0){const c=$('#content');const pct=total?Math.round(correct/total*100):0;c.innerHTML=`<h1 class="page-title">${title}</h1><div class="test-summary"><div class="card"><div class="n" style="font-size:28px;font-weight:800">${correct}</div><div class="muted">Câu đúng</div></div><div class="card"><div class="n" style="font-size:28px;font-weight:800">${total-correct}</div><div class="muted">Câu sai</div></div><div class="card"><div class="n" style="font-size:28px;font-weight:800">${pct}%</div><div class="muted">Tỷ lệ đúng trên câu có đáp án chốt</div></div>${ungraded?`<div class="card"><div class="n" style="font-size:28px;font-weight:800">${ungraded}</div><div class="muted">Câu chưa chốt đáp án, không tính điểm</div></div>`:''}</div><div class="row" style="margin-top:16px"><button class="btn primary" onclick="navigate('practice')">Tạo bài mới</button><button class="btn" onclick="navigate('wrong')">Ôn câu sai</button><button class="btn" onclick="navigate('stats')">Xem thống kê</button></div>`}
function showTestReview(correct,auto){const c=$('#content');const gradable=session.items.filter(x=>qById(x.qid).correctOptionId);const total=gradable.length;const ungraded=session.items.length-total;const pct=total?Math.round(correct/total*100):0;c.innerHTML=`<h1 class="page-title">${auto?'Hết giờ - đã tự động nộp':'Kết quả kiểm tra'}</h1><div class="test-summary"><div class="card"><b>${correct}/${total}</b><div class="muted">Câu đúng / câu có đáp án chốt</div></div><div class="card"><b>${total-correct}</b><div class="muted">Câu sai hoặc bỏ trống</div></div><div class="card"><b>${pct}%</b><div class="muted">Tỷ lệ đúng</div></div>${ungraded?`<div class="card"><b>${ungraded}</b><div class="muted">Câu chưa chốt, không tính điểm</div></div>`:''}</div><h3>Xem lại từng câu</h3><div class="list">${session.items.map((it,i)=>{const q=qById(it.qid);if(!q.correctOptionId)return `<div class="q-row"><h4>Câu ${i+1}. ${esc(q.question)}</h4><div class="meta">⚠ Chưa có đáp án chốt • Chương ${q.chapter} • ${esc(q.source||'Portfolio Management')}</div>${it.selected?`<p><b>Bạn chọn:</b> ${esc(optionText(q,it.selected))}</p>`:''}<p><b>Giải thích / lưu ý:</b> ${esc(q.explanation)}</p></div>`;const ok=it.selected===q.correctOptionId;return `<div class="q-row"><h4>Câu ${i+1}. ${esc(q.question)}</h4><div class="meta">${ok?'✓ Đúng':'✕ Sai'} • Chương ${q.chapter} • ${esc(q.source||'Portfolio Management')}</div><p><b>Đáp án đúng:</b> ${esc(optionText(q,q.correctOptionId))}</p>${it.selected&&!ok?`<p><b>Bạn chọn:</b> ${esc(optionText(q,it.selected))}</p>`:''}<p><b>Giải thích:</b> ${esc(q.explanation)}</p></div>`}).join('')}</div><div class="row" style="margin-top:16px"><button class="btn primary" onclick="navigate('practice')">Tạo bài mới</button><button class="btn" onclick="navigate('wrong')">Ôn câu sai</button></div>`}

function renderCollection(type){const c=$('#content');const ids=type==='wrong'?state.wrongIds:state.bookmarks;const title=type==='wrong'?'Câu sai / đang yếu':'Câu đã đánh dấu';const qs=QUESTIONS.filter(q=>ids.includes(q.id));c.innerHTML=`<h1 class="page-title">${title}</h1><p class="sub">${type==='wrong'?'Câu sai được lưu tự động. Khi trả lời đúng liên tiếp 2 lần, câu sẽ rời danh sách yếu nhưng lịch sử vẫn được giữ.':'Các câu bạn muốn xem lại riêng.'}</p>${qs.length?`<div class="row" style="margin-bottom:14px"><button class="btn primary" onclick="startSessionFromIds(${JSON.stringify(ids).replace(/"/g,'&quot;')},'practice',true,0)">Ôn tất cả (${qs.length})</button><button class="btn" onclick="startSessionFromIds(${JSON.stringify(ids.slice(0,20)).replace(/"/g,'&quot;')},'practice',true,0)">Ôn tối đa 20 câu</button></div><div class="list">${qs.map(q=>rowHTML(q)).join('')}</div>`:`<div class="empty">Chưa có câu nào trong mục này.</div>`}`}
function rowHTML(q){const s=stat(q.id);return `<div class="q-row"><h4>${esc(q.question)}</h4><div class="meta">${q.id} • ${esc(q.source||'Portfolio Management')} • Chương ${q.chapter} • Đã làm ${s.attempts} lần • Đúng ${s.correct} • Sai ${s.wrong}</div><div class="actions"><button class="btn" onclick="openQuestion('${q.id}')">Xem câu</button><button class="btn" onclick="startSessionFromIds(['${q.id}'],'practice',true,0)">Làm lại</button></div></div>`}
function renderBank(c){let qs=QUESTIONS.filter(q=>(bankChapter==='all'||q.chapter==bankChapter));if(bankStatus!=='all')qs=qs.filter(q=>statusOf(q.id)===bankStatus);if(bankQuery.trim()){const t=bankQuery.toLowerCase();qs=qs.filter(q=>(q.question+' '+q.options.map(o=>o.text).join(' ')).toLowerCase().includes(t))}c.innerHTML=`<h1 class="page-title">Ngân hàng ${QUESTIONS.length} câu</h1><p class="sub">Tìm kiếm và xem từng câu. Đáp án mặc định được ẩn trong cửa sổ chi tiết.</p><div class="searchbar"><input id="bankSearch" placeholder="Tìm nội dung câu hỏi..." value="${esc(bankQuery)}"><select id="bankChapter"><option value="all">Tất cả chương</option>${[1,2,3].map(ch=>`<option value="${ch}" ${bankChapter==ch?'selected':''}>Chương ${ch}</option>`).join('')}</select><select id="bankStatus"><option value="all">Mọi trạng thái</option><option value="new" ${bankStatus==='new'?'selected':''}>Chưa làm</option><option value="weak" ${bankStatus==='weak'?'selected':''}>Đang yếu</option><option value="learning" ${bankStatus==='learning'?'selected':''}>Đang học</option><option value="mastered" ${bankStatus==='mastered'?'selected':''}>Thành thạo</option></select></div><div class="muted" style="margin-bottom:10px">Tìm thấy ${qs.length} câu</div><div class="list">${qs.slice(0,120).map(q=>rowHTML(q)).join('')}${qs.length>120?'<div class="empty">Đang hiển thị 120 kết quả đầu. Hãy lọc hoặc tìm kiếm để thu hẹp.</div>':''}</div>`;$('#bankSearch').oninput=e=>{bankQuery=e.target.value;clearTimeout(window._bs);window._bs=setTimeout(()=>renderBank(c),180)};$('#bankChapter').onchange=e=>{bankChapter=e.target.value;renderBank(c)};$('#bankStatus').onchange=e=>{bankStatus=e.target.value;renderBank(c)}}
function openQuestion(qid){const q=qById(qid);const m=$('#modal'),mc=$('#modalCard');const answerHtml=q.correctOptionId?`<p><b>Đáp án đúng:</b> ${esc(optionText(q,q.correctOptionId))}</p>`:`<p style="color:var(--warn)"><b>Chưa có đáp án chính thức đủ rõ để chốt duy nhất.</b></p>`;mc.innerHTML=`<div class="row"><b>${q.id} • ${esc(q.source||'Portfolio Management')} • Chương ${q.chapter}</b><div style="flex:1"></div><button class="icon-btn" onclick="closeModal()">✕</button></div><h3>${esc(q.question)}</h3>${q.options.map((o,i)=>`<p><b>${'ABCD'[i]}.</b> ${esc(o.text)}</p>`).join('')}<button class="btn primary" id="revealBtn">Hiện đáp án và giải thích</button><div id="reveal" class="hidden"><hr style="border:0;border-top:1px solid var(--line)">${answerHtml}<p><b>${q.correctOptionId?'Giải thích':'Giải thích / lưu ý'}:</b> ${esc(q.explanation)}</p></div>`;m.classList.add('open');$('#revealBtn').onclick=()=>$('#reveal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.remove('open')}
function renderStats(c){const rows=[1,2,3].map(ch=>{const qs=chapterQuestions(ch);let a=0,co=0;qs.forEach(q=>{const s=stat(q.id);a+=s.correct+s.wrong;co+=s.correct});const done=qs.filter(q=>stat(q.id).attempts).length;const weak=qs.filter(q=>state.wrongIds.includes(q.id)).length;return{ch,done,weak,acc:a?Math.round(co/a*100):0}});c.innerHTML=`<h1 class="page-title">Thống kê</h1><p class="sub">Theo dõi mức độ phủ câu hỏi và tỷ lệ đúng thực tế, không dùng điểm cộng/trừ.</p><div class="card"><table class="kpi-table"><thead><tr><th>Chương</th><th class="right">Đã học</th><th class="right">Câu yếu</th><th class="right">Độ chính xác</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>Chương ${r.ch}</b><div class="muted">${esc(CHAPTERS[r.ch])}</div></td><td class="right">${r.done}/${chapterQuestions(r.ch).length}</td><td class="right">${r.weak}</td><td class="right">${r.acc}%</td></tr>`).join('')}</tbody></table></div><h3>Lịch sử bài gần đây</h3>${state.sessions.length?`<div class="list">${state.sessions.slice(0,12).map(s=>`<div class="q-row"><b>${s.mode==='test'?'Kiểm tra':'Ôn tập'} • ${new Date(s.date).toLocaleString('vi-VN')}</b><div class="meta">${s.correct}/${s.total} đúng • ${Math.round(s.correct/s.total*100)}%</div></div>`).join('')}</div>`:'<div class="empty">Chưa có bài hoàn thành.</div>'}`}
function renderSettings(c){c.innerHTML=`<h1 class="page-title">Cài đặt</h1><div class="grid"><div class="card" style="grid-column:span 6"><h3 class="section-title">Giao diện</h3><div class="field"><label>Chế độ màu</label><select id="themeSel"><option value="light" ${state.theme==='light'?'selected':''}>Sáng</option><option value="dark" ${state.theme==='dark'?'selected':''}>Tối</option></select></div><div class="field" style="margin-top:10px"><label>Cỡ chữ</label><select id="fontSel"><option value="small" ${state.font==='small'?'selected':''}>Nhỏ</option><option value="normal" ${state.font==='normal'?'selected':''}>Vừa</option><option value="large" ${state.font==='large'?'selected':''}>Lớn</option></select></div></div><div class="card" style="grid-column:span 6"><h3 class="section-title">Sao lưu tiến độ</h3><div class="row"><button class="btn" id="exportBtn">Xuất dữ liệu JSON</button><label class="btn">Nhập dữ liệu<input id="importFile" type="file" accept="application/json" hidden></label></div><p class="muted">Dùng để chuyển tiến độ sang máy khác.</p></div><div class="card danger-zone" style="grid-column:span 12"><h3 class="section-title">Xóa dữ liệu học</h3><p class="muted">Xóa lịch sử đúng/sai, câu yếu, đánh dấu và bài đang dở. Ngân hàng ${QUESTIONS.length} câu vẫn còn nguyên.</p><button class="btn danger" id="resetBtn">Xóa toàn bộ tiến độ</button></div></div>`;$('#themeSel').onchange=e=>{state.theme=e.target.value;saveState();applyPrefs()};$('#fontSel').onchange=e=>{state.font=e.target.value;saveState();applyPrefs()};$('#exportBtn').onclick=exportData;$('#importFile').onchange=importData;$('#resetBtn').onclick=resetData}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='portfolio-management-tien-do.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state={...DEFAULT,...x};saveState();applyPrefs();toast('Đã nhập tiến độ');render()}catch{alert('File dữ liệu không hợp lệ')}};r.readAsText(f)}
function resetData(){if(!confirm('Xóa toàn bộ tiến độ học?'))return;if(!confirm('Xác nhận lần cuối: thao tác này không thể hoàn tác.'))return;localStorage.removeItem(KEY);state=structuredClone(DEFAULT);applyPrefs();toast('Đã xóa tiến độ');navigate('dashboard')}
$('#nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(b)navigate(b.dataset.page)};$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';saveState();applyPrefs()};$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(!session)return;if(['1','2','3','4'].includes(e.key)){const it=currentItem();const idx=+e.key-1;if(it.optionOrder[idx])choose(it.optionOrder[idx])}if(e.key==='Enter'&&session.mode==='practice'&&currentItem().locked)nextQ()});
render();
</script>
</body>
